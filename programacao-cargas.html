<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Programação de Cargas — ERP Industrial</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<style>
:root{--pc-red:#E5484D;--pc-redbg:#FDECEC;--pc-amb:#D98E04;--pc-ambbg:#FFF6DB;--pc-grn:#15803D;--pc-grnbg:#E7F7EC;--pc-pur:#7C3AED;--pc-purbg:#F3EEFF;--pc-line:#E3E8F0;--pc-mut:#64748B}
.pc-alert{background:var(--pc-red);color:#fff;border-radius:12px;padding:11px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-weight:700;margin-bottom:16px}
.pc-alert .pulse{width:10px;height:10px;border-radius:50%;background:#fff;animation:pcp 1.2s infinite}
@keyframes pcp{0%{box-shadow:0 0 0 0 rgba(255,255,255,.8)}100%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}
.pc-alert button{margin-left:auto;background:#fff;color:var(--pc-red);border:0;border-radius:8px;padding:6px 14px;font-weight:800;font-family:inherit;cursor:pointer}
.pc-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.pc-kpi{background:#fff;border:1px solid var(--pc-line);border-radius:12px;padding:12px 14px;cursor:pointer}
.pc-kpi .l{font-size:11px;color:var(--pc-mut);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.pc-kpi .v{font-size:26px;font-weight:800;color:var(--primary);line-height:1.15;margin-top:2px}
.pc-kpi .s{font-size:12px;color:var(--pc-mut)}
.pc-kpi.red{border-color:#F5B5B7;background:var(--pc-redbg)}.pc-kpi.red .v{color:var(--pc-red)}
.pc-kpi.amb{border-color:#F3D27A;background:var(--pc-ambbg)}.pc-kpi.amb .v{color:var(--pc-amb)}
.pc-kpi.pur{border-color:#D9C8FF;background:var(--pc-purbg)}.pc-kpi.pur .v{color:var(--pc-pur)}
.pc-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pc-bar h2{margin:0 6px;font-size:19px;font-weight:800;color:var(--primary);min-width:190px}
.pc-nav{width:34px;height:34px;border-radius:8px;border:1px solid var(--pc-line);background:#fff;font-weight:800;cursor:pointer;font-family:inherit;color:var(--primary)}
.pc-seg{display:inline-flex;background:#fff;border:1px solid var(--pc-line);border-radius:9px;padding:3px}
.pc-seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:700;color:var(--pc-mut);font-size:13px;font-family:inherit;cursor:pointer}
.pc-seg button.on{background:var(--primary);color:var(--accent)}
.pc-chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--pc-pur);background:var(--pc-purbg);border:1px solid #D9C8FF;border-radius:9px;padding:6px 10px;cursor:pointer}
.pc-sync{margin-left:auto;font-size:12px;color:var(--pc-mut);display:flex;gap:14px;align-items:center}
.pc-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.pc-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
/* SEMANA */
.pc-week{display:grid;gap:10px}
.pc-col{background:#F8FAFC;border:1px solid var(--pc-line);border-radius:12px;padding:8px;min-height:420px;transition:background .12s,outline .12s}
.pc-col.today{outline:3px solid var(--primary);outline-offset:-1px}
.pc-col.off{background:repeating-linear-gradient(135deg,#F8FAFC 0 10px,#EEF2F6 10px 20px)}
.pc-col.drop{background:#EAF7D0;outline:2px dashed var(--primary)}
.pc-ch{display:flex;justify-content:space-between;align-items:baseline;padding:2px 2px 8px}
.pc-ch b{font-size:15px;color:var(--primary)}.pc-ch span{font-size:11px;color:var(--pc-mut);font-weight:700}
.pc-meter{background:#fff;border:1px solid var(--pc-line);border-radius:8px;padding:6px 8px;margin-bottom:8px;font-size:11.5px}
.pc-mrow{margin:3px 0}
.pc-mt{display:flex;justify-content:space-between;gap:6px;font-weight:600;color:#334155}
.pc-mt b{font-weight:800}
.pc-track{height:8px;background:#E8EDF3;border-radius:5px;overflow:hidden;display:flex;margin-top:2px}
.pc-track i{display:block;height:100%}
.pc-res{margin-top:5px;font-weight:800;font-size:12px}
.pc-res.r{color:#C62828}.pc-res.g{color:var(--pc-grn)}.pc-res.m{color:var(--pc-mut);font-weight:600}
/* CARD */
.pc-card{background:#fff;border:1px solid var(--pc-line);border-left:5px solid #3B6FB6;border-radius:9px;padding:7px 8px;margin-bottom:7px;position:relative;font-size:12px}
.pc-card[draggable=true]{cursor:grab}
.pc-card.dragging{opacity:.4}
.pc-card .c{font-weight:800;font-size:12.5px;color:var(--text);line-height:1.2;padding-right:2px}
.pc-card .p{color:var(--pc-mut);font-size:11px;margin:1px 0 3px;line-height:1.25}
.pc-card .q{font-size:17px;font-weight:800;color:var(--primary)}.pc-card .q small{font-size:11px;font-weight:600;color:var(--pc-mut)}
.pc-qrow{display:flex;justify-content:space-between;align-items:center;gap:6px}
.pc-fit{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:5px;white-space:nowrap}
.pc-fit.ok{background:var(--pc-grnbg);color:var(--pc-grn)}.pc-fit.par{background:var(--pc-ambbg);color:#8A6100}.pc-fit.no{background:var(--pc-red);color:#fff}.pc-fit.sl{background:#EEF2F7;color:#475569}
.pc-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.pc-t{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;background:#EEF2F7;color:#41506A}
.pc-t.red{background:#FDE2E2;color:#B02A2A}.pc-t.yel{background:#FFF3C4;color:#8A6100}.pc-t.grn{background:#DCFCE7;color:#166534}.pc-t.pur{background:var(--pc-purbg);color:#5B21B6}.pc-t.blu{background:#E0ECFF;color:#1E40AF}
.pc-card.over{background:repeating-linear-gradient(45deg,#fff 0 8px,#FFF1F1 8px 16px)}
.pc-card.fin{border-style:dashed;border-color:#B79CF5;border-left:5px dashed var(--pc-pur);background:#FCFAFF}
.pc-card.late{box-shadow:0 0 0 2px #F5B5B7}
.pc-cb{margin-top:6px;display:flex;gap:5px}
.pc-cb button{flex:1;border:0;border-radius:6px;padding:6px 0;font-weight:800;font-size:11.5px;font-family:inherit;cursor:pointer;background:#22C55E;color:#06311A}
.pc-cb button.s{flex:none;padding:6px 9px;background:#EEF2F7;color:#41506A}
.pc-cb button:disabled{opacity:.45;cursor:not-allowed}
/* MÊS */
.pc-cal{background:#fff;border:1px solid var(--pc-line);border-radius:14px;overflow:hidden}
.pc-dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#F8FAFD;border-bottom:1px solid var(--pc-line)}
.pc-dow div{padding:8px 10px;font-size:11px;font-weight:800;color:var(--pc-mut);text-transform:uppercase}
.pc-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.pc-day{min-height:118px;border-right:1px solid var(--pc-line);border-bottom:1px solid var(--pc-line);padding:6px 7px;cursor:pointer;position:relative}
.pc-day:nth-child(7n){border-right:0}
.pc-day:hover{background:#F8FAFD}
.pc-day.out{background:#FAFBFC;color:#B5BFCD}
.pc-day.off{background:repeating-linear-gradient(135deg,#fff 0 10px,#F4F6F9 10px 20px)}
.pc-day.today{box-shadow:inset 0 0 0 2px var(--primary)}
.pc-day.late{background:var(--pc-redbg)}
.pc-day.drop{background:#EAF7D0}
.pc-dn{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px;color:var(--primary)}
.pc-day.out .pc-dn{color:#B5BFCD}
.pc-dn span{font-size:10.5px;font-weight:700}
.pc-chip{display:block;font-size:11px;background:#fff;border:1px solid var(--pc-line);border-left:3px solid #3B6FB6;border-radius:5px;padding:2px 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-chip.fin{border-style:dashed;border-left-style:dashed}
.pc-chip.no{background:#FFF1F1}
.pc-mini{height:5px;border-radius:3px;background:#E8EDF3;margin-top:4px;overflow:hidden;display:flex}
/* LATERAL */
.pc-side .card{padding:0;margin-bottom:14px;overflow:hidden}
.pc-sh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--pc-line)}
.pc-sh b{font-size:14px;color:var(--primary)}
.pc-pill{background:var(--primary);color:var(--accent);font-weight:800;font-size:12px;border-radius:12px;padding:2px 9px}
.pc-pill.red{background:var(--pc-red);color:#fff}
.pc-sb{padding:8px 12px;max-height:440px;overflow:auto}
.pc-sb.drop{background:#EAF7D0}
.pc-grp{font-size:10.5px;font-weight:800;color:var(--pc-mut);text-transform:uppercase;letter-spacing:.5px;margin:8px 2px 4px}
.pc-help{font-size:12px;color:var(--pc-mut);padding:10px 14px;line-height:1.5}
.pc-leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--pc-mut);margin-top:10px}
.pc-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* DIA (modal) */
.pc-drow{display:flex;gap:10px;align-items:center;border:1px solid var(--pc-line);border-left:5px solid #3B6FB6;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.pc-drow .i{flex:1;min-width:0}
.pc-drow .i b{display:block;font-size:14px}
.pc-drow .i span{font-size:12px;color:var(--pc-mut)}
.pc-hist td,.pc-hist th{padding:7px 10px;font-size:12.5px;border-bottom:1px solid var(--pc-line);text-align:left}
.pc-hist thead th{background:var(--primary);color:var(--accent);font-weight:700}
@media(max-width:1300px){.pc-wrap{grid-template-columns:1fr}.pc-kpis{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

<header class="topbar">
  <button class="topbar-open-sidebar" onclick="toggleSidebar()">☰</button>
  <div class="topbar-title">Programação de Cargas</div>
  <div class="topbar-right">
    <div class="topbar-user">
      <div class="user-avatar" style="width:32px;height:32px;font-size:12px;" id="top-avatar">--</div>
      <div><div class="topbar-user-name" id="top-user-name">—</div><div class="topbar-user-profile" id="top-user-perfil"></div></div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()" style="color:#64748b;">Sair</button>

<div id="toast-container" style="position:fixed;top:16px;right:16px;z-index:99999;display:flex;flex-direction:column;gap:8px;pointer-events:none;"></div>

<main class="main-content" id="main-content">
  <div class="page-header">

<!-- Dia -->

<script>
/* ═══════════════════════════════════════════════════════════
   PROGRAMAÇÃO DE CARGAS
   Fonte: programacao_cargas (1 linha por pedido; planilha + Salescode juntos).
   Data que vale: data_manual (arrastada aqui) > data_planilha > data_salescode.
   Capacidade: planejamentos_custo (ativo do mês) × turnos.calendario × eficiência,
   igual ao calcHorasSecao do custo-precificacao.html. Nada é chutado: produto sem
   linha no planejamento aparece como "sem linha" e não entra na conta.
   ═══════════════════════════════════════════════════════════ */
const MOD = 'programacao_cargas';
const DIAS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const DIAS_C = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const FINANCEIRO = ['ANALISE DE AVAL','APROVACAO - DIRETOR','APROVACAO - GESTOR','APROVACAO - REPRESENTANTE','EM ABERTO'];
// família (nome do produto no planejamento) → unidade e kg por unidade
const FAM = {
  'Bag':                    { un:'bags',  kg:1000, rot:'Big Bag' },
  'Linha 25kg':             { un:'sacos', kg:25,   rot:'Ensacado 25 kg' },
  'Linha 20kg':             { un:'sacos', kg:20,   rot:'20 kg' },
  'Concentrado 10kg':       { un:'sacos', kg:10,   rot:'Concentrado 10 kg' },
  'Impermeabilizante 10kg': { un:'sacos', kg:10,   rot:'Impermeabilizante' },
  'Caulim Granel':          { un:'t',     kg:1000, rot:'Granel' },
};

let _cargas = [], _planos = [], _turnos = [], _podeEditar = false;
let _vis = 'semana', _grp = 'todos', _ref = hojeISO(), _drag = null, _fitCache = {};

/* ── utilidades ─────────────────────────────────────────── */
function hojeISO(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function addDias(iso,n){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function dow(iso){ return new Date(iso+'T12:00:00').getDay(); }
function fmtD(iso){ if(!iso) return '—'; const [a,m,d]=iso.split('-'); return `${d}/${m}`; }
function fmtDL(iso){ if(!iso) return '—'; const [a,m,d]=iso.split('-'); return `${DIAS_C[dow(iso)]} ${d}/${m}/${a}`; }
function n0(v){ return (Math.round(v)||0).toLocaleString('pt-BR'); }
function n1(v){ return (Number(v)||0).toLocaleString('pt-BR',{maximumFractionDigits:1}); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim(); }
function minutos(ini,fim){ const p=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+(m||0);}; let d=p(fim)-p(ini); if(d<=0)d+=1440; return d; }
function carregarScript(src){ return new Promise((ok,er)=>{ if([...document.scripts].some(s=>s.src===src)) return ok(); const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>er(new Error('não carregou '+src)); document.head.appendChild(s); }); }

/* ── produto → família / grupo / material ───────────────── */
function familiaDe(nome){
  const n=norm(nome);
  if(/BIG ?BAG/.test(n)) return 'Bag';
  if(/GRANEL/.test(n)) return 'Caulim Granel';
  if(/^ORIGINAL|LIQUIDO|50 ?G\b|STAND POUCH|MASSA|SELADOR|FUNDO PREPARADOR|TOPDRY|ADESIVO|PU 40|BETUMEX|VEDAMASSA|CHAPISTEC|ACQUABLOCK|IMPER PRO/.test(n)) return null;
  if(/IMPERMEABILIZANTE/.test(n)) return 'Impermeabilizante 10kg';
  if(/25 ?KG/.test(n)) return 'Linha 25kg';
  if(/20 ?KG/.test(n)) return 'Linha 20kg';
  if(/CONCENTRADO|KILIGA|LIGANEX|LIGAPRO|10 ?KG/.test(n)) return 'Concentrado 10kg';
  return null;
}
function grupoDe(nome){ const n=norm(nome); if(/^CAULIM/.test(n)) return 'caulim'; return familiaDe(nome)?'ligas':'original'; }
function materialDe(nome){
  const n=norm(nome);
  if(/AMARELO/.test(n)) return 'amarelo'; if(/CINZA/.test(n)) return 'cinza'; if(/CREME/.test(n)) return 'creme';
  if(/BRANCO ?3/.test(n)) return 'branco3'; if(/BRANCO ?2/.test(n)) return 'branco2'; if(/BRANCO/.test(n)) return 'branco';
  return grupoDe(nome)==='ligas'?'liga':'outro';
}
const COR = { branco:'#3B6FB6', branco2:'#2A9D8F', branco3:'#5B8DEF', creme:'#D9962B', cinza:'#7A8699', amarelo:'#E3B505', liga:'#8B5CF6', outro:'#94A3B8' };

/* ── item (produto+qtd) → quantidade na unidade da família ─ */
function qtdFamilia(fam, qtd, unidade){
  const u=norm(unidade); const f=FAM[fam]; if(!f) return { q:Number(qtd)||0, un:(unidade||'').toLowerCase() };
  const q=Number(qtd)||0;
  if(u==='TL'||u==='T'||u==='TON') return { q: q*1000/f.kg, un:f.un };
  return { q, un:f.un };
}
// itens de uma carga: do Salescode se tiver; senão monta da planilha
function itensDa(c){
  if(Array.isArray(c.itens) && c.itens.length) return c.itens.map(i=>{ const fam=familiaDe(i.produto); const r=qtdFamilia(fam,i.qtd,i.unidade); return { produto:i.produto, fam, q:r.q, un:r.un, t: /^(TL|T)$/.test(norm(i.unidade))?Number(i.qtd):(fam&&FAM[fam]?r.q*FAM[fam].kg/1000:null) }; });
  const p=c.planilha||{}; const emb=norm(p.embalagem); const mat=p.material||'';
  let fam=null, nome='';
  if(/BAG/.test(emb)){ fam='Bag'; nome='CAULIM BIG BAG – '+mat; }
  else if(/GRANEL/.test(emb)){ fam='Caulim Granel'; nome='CAULIM GRANEL – '+mat; }
  else if(/SAC/.test(emb)){ fam=/20/.test(mat)?'Linha 20kg':'Linha 25kg'; nome='CAULIM ENSACADO – '+mat; }
  else nome=mat||p.embalagem||'—';
  const t=Number(p.peso_t)||0; const r=qtdFamilia(fam,t,'TL');
  return [{ produto:nome, fam, q:r.q, un:r.un||'t', t }];
}

/* ── normaliza a carga para a tela ──────────────────────── */
function montar(c){
  const p=c.planilha||{};
  const itens=itensDa(c);
  const princ=itens.slice().sort((a,b)=>(b.t||0)-(a.t||0))[0]||{};
  const nomeProd=(p.material&&c.em_planilha)?`${princ.fam&&FAM[princ.fam]?FAM[princ.fam].rot:''} ${p.material}`.trim():princ.produto;
  const st=norm(c.status_salescode);
  return Object.assign(c,{
    _data: c.data_manual || c.data_planilha || c.data_salescode || null,
    _cliente: p.cliente || c.cliente_salescode || '—',
    _cidade: c.cidade || '',
    _itens: itens,
    _produto: nomeProd || '—',
    _grupo: grupoDe(princ.produto||nomeProd),
    _mat: materialDe((p.material||'')+' '+(princ.produto||'')),
    _fin: FINANCEIRO.includes(st),
    _t: itens.reduce((s,i)=>s+(i.t||0),0),
  });
}

/* ── CAPACIDADE ─────────────────────────────────────────── */
function planoDoDia(iso){
  const [a,m]=iso.split('-').map(Number);
  const cand=_planos.filter(p=>Number(p.ano)===a && Number(p.mes)===m);
  return cand.sort((x,y)=>String(y.atualizado_em).localeCompare(String(x.atualizado_em)))[0]||null;
}
// {linhas:[{nome,horas,cap:{fam:capHora}}], estado:'trabalha'|'folga'|..., semPlano}
const _capCache={};
function capacidadeDia(iso){
  if(_capCache[iso]) return _capCache[iso];
  const pl=planoDoDia(iso);
  if(!pl){ return _capCache[iso]={ semPlano:true, linhas:[], estado:null }; }
  const est=pl.estado||{}; const estado=(est.calendario||{})[iso]||null;
  const trabalha = estado==='trabalha'||estado==='domingo-especial';
  const linhas=(est.blocos||[]).map(b=>{
    let mins=0; const cap={};
    (b.secoes||[]).forEach(s=>{
      (s.produtos||[]).forEach(p=>{ const ch=Number(p.capHora)||0; if(p.ativo!==false && ch>0 && FAM[p.nome]) cap[p.nome]=Math.max(cap[p.nome]||0,ch); });
      if(!trabalha || s.simuladoDesligado) return;
      const t=_turnos.find(x=>x.nome===s.turnoNome); if(!t) return;
      let m=0;
      if(estado==='domingo-especial') m=Math.round((Number(est.horasDomingoEspecial)||0)*60);
      else { const di=(t.calendario||{})[DIAS[dow(iso)]]; if(di && di.ativo!==false && di.inicio && di.fim) m=Math.max(0,minutos(di.inicio,di.fim)-(Number(t.refeicao_min)||0)); }
      mins += m * (Number(s.eficiencia)||100)/100;
    });
    return { nome:b.linhaNome, horas:mins/60, cap };
  });
  return _capCache[iso]={ semPlano:false, linhas, estado, plano:pl.nome||pl.codigo };
}
// encaixa as cargas do dia, na ordem, nas horas das linhas. Retorna uso por linha e status por carga.
function encaixarDia(iso, cargas){
  const cap=capacidadeDia(iso);
  const resto={}; cap.linhas.forEach(l=>resto[l.nome]=l.horas);
  const usoH={}; cap.linhas.forEach(l=>usoH[l.nome]=0);
  const faltaH={}, uni={};
  const fit={};
  cargas.forEach(c=>{
    let tot=0, cabe=0, semLinha=true;
    c._itens.forEach(it=>{
      if(!it.fam) return;
      const linhas=cap.linhas.filter(l=>l.cap[it.fam]).sort((a,b)=>b.cap[it.fam]-a.cap[it.fam]);
      if(!linhas.length) return;
      semLinha=false; tot+=it.q;
      let need=it.q;
      linhas.forEach(l=>{ if(need<=0) return; const pode=Math.max(0,resto[l.nome])*l.cap[it.fam]; const usa=Math.min(need,pode); resto[l.nome]-=usa/l.cap[it.fam]; usoH[l.nome]+=usa/l.cap[it.fam]; need-=usa; cabe+=usa; if(usa>0){ const u=(uni[l.nome]=uni[l.nome]||{}); (u[it.fam]=u[it.fam]||{q:0,f:0}).q+=usa; } });
      if(need>0){ const l=linhas[0]; faltaH[l.nome]=(faltaH[l.nome]||0)+need/l.cap[it.fam]; const u=(uni[l.nome]=uni[l.nome]||{}); (u[it.fam]=u[it.fam]||{q:0,f:0}).f+=need; }
    });
    fit[c.id] = semLinha ? {st:'sl'} : (cabe>=tot-0.01 ? {st:'ok'} : (cabe>0.5 ? {st:'par',cabe,tot} : {st:'no',tot}));
  });
  return { cap, usoH, faltaH, fit, uni };
}

/* ── DADOS ──────────────────────────────────────────────── */
async function carregar(){
  const desde=addDias(hojeISO(),-45);
  const [cg,pl,tu]=await Promise.all([
    db(_supabase.from('programacao_cargas').select('*').or(`carregado.eq.false,carregado_em.gte.${desde}`).limit(2000),'carregar cargas'),
    db(_supabase.from('planejamentos_custo').select('id,codigo,nome,mes,ano,estado,atualizado_em').eq('status','ativo').order('atualizado_em',{ascending:false}).limit(24),'carregar planejamento'),
    db(_supabase.from('turnos').select('nome,refeicao_min,calendario').limit(100),'carregar turnos'),
  ]);
  _cargas=(cg.data||[]).map(montar);
  _planos=pl.data||[]; _turnos=tu.data||[];
  Object.keys(_capCache).forEach(k=>delete _capCache[k]);
  render();
}

function ordenar(a,b){ return (a.ordem_dia??9999)-(b.ordem_dia??9999) || (a.em_planilha===b.em_planilha?0:(a.em_planilha?-1:1)) || String(a.pedido).localeCompare(String(b.pedido)); }

function medidorHtml(iso, ench, compacto){

function fitTag(f){

/* ── ARRASTAR ───────────────────────────────────────────── */
function ligarDrag(){
  if(!_podeEditar) return;
  document.querySelectorAll('[draggable=true][data-id]').forEach(el=>{
    el.ondragstart=e=>{ _drag=el.dataset.id; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.stopPropagation(); };
    el.ondragend=()=>{ el.classList.remove('dragging'); _drag=null; document.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop')); };
  });
  document.querySelectorAll('[data-dia]').forEach(z=>{
    z.ondragover=e=>{ if(!_drag) return; e.preventDefault(); z.classList.add('drop'); };
    z.ondragleave=()=>z.classList.remove('drop');
    z.ondrop=e=>{ e.preventDefault(); z.classList.remove('drop'); if(_drag) moverCarga(_drag, z.dataset.dia||null, e, z); };
  });
}
async function moverCarga(id, dia, ev, zona){
  if(!guardAction(MOD,'edit')) return;
  const c=_cargas.find(x=>x.id===id); if(!c) return;
  // posição dentro do dia (pelo card mais perto do ponto onde soltou)
  let ordem=null;
  if(dia && zona && ev){ const cards=[...zona.querySelectorAll('.pc-card[data-id]')].filter(x=>x.dataset.id!==id); const idx=cards.findIndex(x=>ev.clientY < x.getBoundingClientRect().top + x.offsetHeight/2); ordem=idx<0?cards.length:idx;
    const novos=cards.map(x=>x.dataset.id); novos.splice(ordem,0,id);
    await Promise.all(novos.map((cid,i)=>{ const cc=_cargas.find(x=>x.id===cid); if(cc&&cc.ordem_dia!==i&&cid!==id){ cc.ordem_dia=i; return _supabase.from('programacao_cargas').update({ordem_dia:i}).eq('id',cid); } return null; }).filter(Boolean));
  }
  const original=c.data_planilha||c.data_salescode||null;
  const nova=(dia && dia===original)?null:dia;   // voltou para a data original = limpa a manual
  const {error}=await db(_supabase.from('programacao_cargas').update({data_manual:nova, ordem_dia:ordem, updated_at:new Date().toISOString()}).eq('id',id),'mover carga');
  if(error) return;
  c.data_manual=nova; c.ordem_dia=ordem; montar(c);
  addLog('MOVER', MOD, id, `${c.pedido} ${c._cliente} → ${dia?fmtDL(dia):'sem data'}`);
  toast(`${c.pedido} → ${dia?fmtDL(dia):'sem data'}`);
  render();
}

async function marcarCarregado(id, desfazer){
  if(!guardAction(MOD,'edit')) return;
  const c=_cargas.find(x=>x.id===id); if(!c) return;
  const u=getUser();
  const upd = desfazer
    ? { carregado:false, carregado_em:null, carregado_por:null, carregado_origem:null, carregado_manual:true }
    : { carregado:true, carregado_em:new Date().toISOString(), carregado_por:u?.nome||null, carregado_origem:'manual', carregado_manual:true };
  const {error}=await db(_supabase.from('programacao_cargas').update(upd).eq('id',id),'marcar carregado');
  if(error) return;
  Object.assign(c,upd);
  addLog(desfazer?'DESFAZER':'CARREGADO', MOD, id, `${c.pedido} ${c._cliente}`);
  toast(desfazer?`${c.pedido} voltou para a programação`:`${c.pedido} carregado ✓`);
  closeModal('m-carga');
  render();
  if(!document.getElementById('m-dia').classList.contains('hidden')) abrirDia(document.getElementById('m-dia').dataset.dia);
  if(!document.getElementById('m-hist').classList.contains('hidden')) abrirHistorico();
}

/* ── MODAIS ─────────────────────────────────────────────── */
function abrirDia(iso){
  const lista=visiveis(); const cs=doDia(lista,iso); const ench=encaixarDia(iso,cs.filter(c=>!c._fin));
  const m=document.getElementById('m-dia'); m.dataset.dia=iso;
  document.getElementById('m-dia-tit').textContent=fmtDL(iso);
  document.getElementById('m-dia-body').innerHTML = medidorHtml(iso,ench,false) +
    (cs.length?cs.map(c=>cardHtml(c,ench.fit[c.id],{botao:true})).join(''):'<div class="pc-help">Nenhuma carga neste dia.</div>') +
    (ench.cap.plano?`<div class="pc-help">Capacidade do planejamento <b>${esc(ench.cap.plano)}</b> (Custo e Precificação).</div>`:'');
  m.classList.remove('hidden');
}
function abrirCarga(id, ev){
  if(ev && ev.defaultPrevented) return;
  const c=_cargas.find(x=>x.id===id); if(!c) return;
  const p=c.planilha||{};
  const linha=(r,v)=>v?`<div class="campo" style="background:#f8fafc;border-left:3px solid #cbd5e1;padding:6px 10px;border-radius:0 5px 5px 0;margin-bottom:6px"><div style="font-size:9px;color:#94a3b8;text-transform:uppercase;font-weight:700">${r}</div><div style="font-size:13px;font-weight:600">${v}</div></div>`:'';
  document.getElementById('m-carga-tit').textContent=`${c.pedido} · ${c._cliente}`;
  document.getElementById('m-carga-body').innerHTML=`
    ${linha('Data que vale',fmtDL(c._data)+(c.data_manual?' (movida por você)':''))}
    ${linha('Data na planilha',c.data_planilha?fmtDL(c.data_planilha):'')}
    ${linha('Data no Salescode',c.data_salescode?fmtDL(c.data_salescode):'')}
    ${linha('Itens',c._itens.map(i=>`${esc(i.produto)} — <b>${i.un==='t'?n1(i.q):n0(i.q)} ${esc(i.un)}</b>${i.fam?'':' <span class="pc-t">sem linha</span>'}`).join('<br>'))}
    ${linha('Cidade / frete',[c._cidade,c.frete].filter(Boolean).join(' · '))}
    ${linha('Situação no Salescode',esc(c.status_salescode||''))}
    ${linha('Transportadora',esc(p.transp||''))}
    ${linha('Observações',esc(p.obs||''))}
    ${linha('Preço (t)',p.preco?('R$ '+Number(p.preco).toLocaleString('pt-BR',{minimumFractionDigits:2})):'')}
    ${c.carregado?linha('Carregado',`${c.carregado_em?new Date(c.carregado_em).toLocaleString('pt-BR'):''} · ${esc(c.carregado_por||c.carregado_origem||'')}`):''}
    ${c.salescode_view?`<a class="btn btn-ghost btn-sm" target="_blank" href="https://salescode.com.br/ret/pedido/view/${encodeURIComponent(c.salescode_view)}">Abrir no Salescode ↗</a>`:''}
    ${_podeEditar?`<div class="modal-footer" style="flex-wrap:wrap">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin-right:auto">Mudar para <input type="date" class="form-input" style="padding:6px 8px" value="${c._data||''}" onchange="closeModal('m-carga');moverCarga('${c.id}',this.value||null)"></label>
      ${c.data_manual?`<button class="btn btn-secondary btn-sm" onclick="closeModal('m-carga');moverCarga('${c.id}',${c.data_planilha||c.data_salescode?`'${c.data_planilha||c.data_salescode}'`:'null'})">↩ Voltar à data original</button>`:''}
      ${c.carregado?`<button class="btn btn-secondary btn-sm" onclick="marcarCarregado('${c.id}',true)">↩ Desfazer carregado</button>`:(c._fin?'<span class="pc-t yel" style="align-self:center">No financeiro — não pode marcar carregado</span>':`<button class="btn btn-primary btn-sm" onclick="marcarCarregado('${c.id}')">✓ Carregado</button>`)}
    </div>`:''}`;
  document.getElementById('m-carga').classList.remove('hidden');
}
function verLista(tipo){
  const lista=visiveis(); let arr=[], tit='';
  if(tipo==='atrasadas'){ arr=atrasadas(lista); tit='Atrasadas'; }
  if(tipo==='semdata'){ arr=semData(lista); tit='Sem data'; }
  if(tipo==='financeiro'){ arr=_cargas.filter(c=>!c.carregado&&c._fin&&(_grp==='todos'||c._grupo===_grp)); tit='No financeiro'; }
  const m=document.getElementById('m-dia'); m.dataset.dia='';
  document.getElementById('m-dia-tit').textContent=`${tit} (${arr.length})`;
  document.getElementById('m-dia-body').innerHTML=arr.sort((a,b)=>String(a._data||'').localeCompare(String(b._data||''))).map(c=>cardHtml(c,null,{botao:true})).join('')||'<div class="pc-help">Nenhuma.</div>';
  m.classList.remove('hidden');
}
function abrirHistorico(){
  const arr=_cargas.filter(c=>c.carregado).sort((a,b)=>String(b.carregado_em||'').localeCompare(String(a.carregado_em||'')));
  const orig={manual:'Marcado aqui',planilha:'Planilha (verde/nota)',salescode:'Saiu do Salescode'};
  document.getElementById('m-hist-body').innerHTML=arr.length?`<table class="pc-hist" style="width:100%;border-collapse:collapse"><thead><tr><th>Quando</th><th>Pedido</th><th>Cliente</th><th>Produto</th><th>Qtd</th><th>Como</th><th></th></tr></thead><tbody>${arr.map(c=>`<tr><td>${c.carregado_em?new Date(c.carregado_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—'}</td><td>${esc(c.pedido)}</td><td>${esc(c._cliente)}</td><td>${esc(c._produto)}</td><td>${qtdTxt(c)}</td><td>${orig[c.carregado_origem]||esc(c.carregado_origem||'')}${c.carregado_por?' · '+esc(c.carregado_por):''}</td><td>${_podeEditar?`<button class="btn btn-ghost btn-sm" onclick="marcarCarregado('${c.id}',true)">↩ Desfazer</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<div class="pc-help">Nada carregado nos últimos 45 dias.</div>';
  document.getElementById('m-hist').classList.remove('hidden');
}

/* ── IMPORTAR PLANILHA (.xlsx) — mesma regra do Apps Script ─ */
async function importarXlsx(f){
  if(!f) return; if(!guardAction(MOD,'edit')) return;
  try{
    await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true,cellStyles:true});
    const nome=wb.SheetNames.find(n=>/CARREG/i.test(n))||wb.SheetNames[0];
    const linhas=lerPlanilha(wb.Sheets[nome]);
    if(linhas.length<3){ toast('Não achei as linhas da planilha (cabeçalho "Cod. Pedido").','danger'); return; }
    const {data,error}=await db(_supabase.rpc('sync_planilha',{p_token:null,p_linhas:linhas}),'importar planilha');
    if(error) return;
    toast(`Planilha importada: ${data?.linhas||0} pedido(s)`);
    addLog('IMPORTAR', MOD, null, `planilha ${f.name}: ${data?.linhas||0} pedidos`);
    carregar();
  }catch(e){ toast('Erro ao ler a planilha: '+e.message,'danger'); console.error(e); }
}
function lerPlanilha(ws){
  const R=XLSX.utils.decode_range(ws['!ref']);
  const val=(r,c)=>{ const cell=ws[XLSX.utils.encode_cell({r,c})]; return cell?cell.v:null; };
  const cor=(r,c)=>{ const cell=ws[XLSX.utils.encode_cell({r,c})]; return (cell&&cell.s&&cell.s.fgColor&&cell.s.fgColor.rgb)||''; };
  let hr=-1, col={};
  for(let r=R.s.r;r<=Math.min(R.e.r,40)&&hr<0;r++) for(let c=R.s.c;c<=R.e.c;c++){ if(norm(val(r,c))==='COD. PEDIDO'){ hr=r; break; } }
  if(hr<0) return [];
  for(let c=R.s.c;c<=R.e.c;c++){ const h=norm(val(hr,c)); if(h) col[h]=c; }
  const C=k=>col[Object.keys(col).find(h=>h.startsWith(k))];
  const cD=C('DATA COLETA'), cP=C('COD. PEDIDO');
  const iso=v=>{ if(v instanceof Date){ const d=new Date(v.getTime()-v.getTimezoneOffset()*6e4); return d.toISOString().slice(0,10);} const s=String(v||''); const m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if(m) return `${m[3].length===2?'20'+m[3]:m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; return /^\d{4}-\d{2}-\d{2}/.test(s)?s.slice(0,10):null; };
  const lim=addDias(hojeISO(),-60), out=[];
  for(let r=hr+1;r<=R.e.r;r++){
    const ped=String(val(r,cP)||'').trim(); const d=iso(val(r,cD));
    if(!ped||!d||d<lim) continue;
    const nota=String(val(r,C('NOTA'))||'').trim();
    const verde=/C5E0B3|B6D7A8|D9EAD3|93C47D|A9D08E|C6EFCE/i.test(cor(r,cD));
    out.push({ pedido:ped, data:d, cliente:val(r,C('CLIENTE')), cnpj:val(r,C('CNPJ')), peso_t:Number(val(r,C('PESO')))||null,
      nota: /^\d+(\.0)?$/.test(nota)?nota.replace('.0',''):null, preco:Number(val(r,C('PRECO')))||null, material:val(r,C('MATERIAL')),
      embalagem:val(r,C('EMBALAGEM')), transp:val(r,C('TRANSP')), obs:val(r,C('OBSERVA')), carregado: verde || /^\d+(\.0)?$/.test(nota) });
  }
  return out;
}

/* ── NAVEGAÇÃO ──────────────────────────────────────────── */
function mover(n){ if(_vis==='semana') _ref=addDias(_ref,7*n); else { const d=new Date(_ref+'T12:00:00'); d.setDate(1); d.setMonth(d.getMonth()+n); _ref=d.toISOString().slice(0,10); } render(); }
function irHoje(){ _ref=hojeISO(); render(); }
document.getElementById('seg-vis').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; _vis=b.dataset.v; [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b)); try{localStorage.setItem('pc_vis',_vis);}catch(_){} render(); };
document.getElementById('seg-grp').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; _grp=b.dataset.g; [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b)); render(); };

/* ── INIT ───────────────────────────────────────────────── */
async function init(){
  fetch('partials/sidebar.html').then(r=>r.text()).then(h=>{
    document.getElementById('sidebar-container').innerHTML=h;
    if(typeof initSidebar==='function') initSidebar('programacao-cargas.html');
  });
  _podeEditar = checkPerm(MOD,'edit');
  if(!_podeEditar) document.getElementById('btn-imp').style.display='none';
  try{ const v=localStorage.getItem('pc_vis'); if(v==='mes'||v==='semana'){ _vis=v; document.querySelectorAll('#seg-vis button').forEach(x=>x.classList.toggle('on',x.dataset.v===v)); } }catch(_){}
  await carregar();
  setInterval(()=>{ if(!_drag && document.querySelectorAll('.modal-overlay:not(.hidden)').length===0) carregar(); }, 5*60*1000);
}
init();
