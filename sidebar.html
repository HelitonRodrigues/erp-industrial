<aside class="sidebar" id="sidebar">
  <div class="sidebar-hex"></div>
  <div class="sidebar-header">
    <div class="sidebar-logo" id="sb-logo">S</div>
    <div class="sidebar-company">
      <div class="sidebar-company-name" id="sb-company-name">Silicate Indústria</div>
    </div>
    <button class="sidebar-toggle" onclick="toggleSidebar()" title="Recolher / abrir o menu" aria-label="Recolher ou abrir o menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </button>
  </div>

  <!-- busca de módulo (Ctrl K) -->
  <div class="sb-busca-box">
    <label class="sb-busca">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input type="text" id="sb-busca" placeholder="Buscar módulo…" aria-label="Buscar módulo" autocomplete="off">
      <span class="sb-kbd">Ctrl K</span>
    </label>
  </div>

  <!-- favoritos (a pessoa fixa com a ☆ ao passar o mouse no módulo) -->
  <div class="sb-favs-box" id="sb-favs-box" style="display:none;">
    <div class="sb-tit">FAVORITOS</div>
    <div class="sb-favs" id="sb-favs"></div>
  </div>

  <!-- O menu é construído dinamicamente pelo utils.js com base nas permissões do usuário -->
  <nav class="sidebar-nav" id="sidebar-nav"></nav>

  <div class="sidebar-footer">
    <div class="user-mini">
      <div class="user-avatar" id="sb-avatar">—<span class="sb-online" title="Online"></span></div>
      <div class="user-info">
        <div class="user-name" id="sb-user-name">—</div>
        <div class="user-profile" id="sb-user-perfil">—</div>
      </div>
      <button class="sb-fbt" id="sb-som" type="button" title="Som dos avisos" aria-label="Som dos avisos" onclick="sbSom(event)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>
      </button>
      <button class="sb-fbt" type="button" title="Sair" aria-label="Sair" onclick="doLogout()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4"></path><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path></svg>
      </button>
    </div>
  </div>
</aside>
