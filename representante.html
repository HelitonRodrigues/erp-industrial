<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#042D4D">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Programação de carregamento — Representante</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#042D4D;--lime:#C9FF64;--bg:#EEF2F6;--line:#E2E8F0;--mut:#64748B;--ink:#0F172A}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;min-height:100vh}
.top{background:radial-gradient(1200px 300px at 85% -40%,#0E5A8F 0,transparent 60%),linear-gradient(135deg,var(--navy),#03213A);color:#fff;padding:22px 32px 70px}
.bar,.hero,.wrap,.ft{max-width:1280px;margin-left:auto;margin-right:auto}
.bar{display:flex;align-items:center;gap:14px}
.lg-svg{width:44px;height:48px;color:var(--lime);flex:none}
.lg-img{height:48px;max-width:150px;object-fit:contain;background:#fff;border-radius:10px;padding:5px 8px;flex:none}
.emp b{display:block;font-size:20px;letter-spacing:2.5px}.emp span{font-size:11px;color:#9FB6CC;letter-spacing:1px;text-transform:uppercase}
.sp{flex:1}
.at{font-size:12px;color:#CFE0EE;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:7px 12px;border-radius:30px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.at i{width:8px;height:8px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 4px rgba(74,222,128,.2)}
.hero{margin-top:26px}.hero .k{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--lime)}
.hero h1{margin:6px 0 4px;font-size:32px}.hero p{color:#B9CCDD;font-size:14px}
.wrap{margin-top:-48px;margin-bottom:24px;padding:0 32px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kp{background:#fff;border-radius:16px;padding:16px 18px;box-shadow:0 8px 24px rgba(4,45,77,.08);border:1px solid var(--line)}
.kp small{font-size:10.5px;font-weight:800;letter-spacing:1px;color:var(--mut);text-transform:uppercase}.kp b{display:block;font-size:28px;margin-top:4px}.kp span{font-size:12px;color:var(--mut)}
.kp.az b{color:#1D4ED8}.kp.am b{color:#B45309}.kp.vm b{color:#DC2626}.kp.rx b{color:#7C3AED}
.alert{margin-top:16px;background:#FFFBEB;border:1px solid #FCD34D;border-radius:14px;padding:12px 16px;font-size:13.5px;display:flex;gap:10px;align-items:center}
.seg{display:none}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:18px;margin-top:18px;align-items:start}
.box{background:#fff;border-radius:16px;border:1px solid var(--line);box-shadow:0 4px 14px rgba(4,45,77,.05);overflow:hidden}
.bh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:16px 18px 10px}
.bh h2{font-size:16px}.bh span{font-size:12px;color:var(--mut)}
.chips{display:flex;gap:6px;padding:0 18px 12px;flex-wrap:wrap}
.chip{border:0;font:inherit;font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;background:#F1F5F9;color:#334155;cursor:pointer}
.chip.on{background:var(--navy);color:var(--lime)}.chip[disabled]{opacity:.45;cursor:default}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;letter-spacing:.8px;color:var(--mut);text-align:left;padding:9px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#F8FAFC;text-transform:uppercase}
td{padding:11px 14px;border-bottom:1px solid #EEF2F6;vertical-align:middle}
tr.dg td{font-weight:800;font-size:12px;color:var(--navy);background:#F8FAFC;padding:8px 14px}
.ped{font-weight:800;background:var(--navy);color:var(--lime);padding:3px 8px;border-radius:6px;font-size:12px;white-space:nowrap}
.cli b{display:block}.cli span{color:var(--mut);font-size:12px}.cli em{font-style:normal;font-size:11.5px;color:var(--mut)}
.pr{display:inline-block;white-space:nowrap;font-size:11px;font-weight:700;color:#fff;padding:3px 8px;border-radius:6px;margin:1px 0}
.q{font-weight:800;white-space:nowrap}.q small{font-weight:600;color:var(--mut)}
.dt{font-weight:800;white-space:nowrap}.old{display:block;color:#94A3B8;text-decoration:line-through;font-size:11.5px;font-weight:600}
.st{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.st.ok{background:#DCFCE7;color:#166534}.st.mu{background:#FEF3C7;color:#92400E}.st.fi{background:#F3E8FF;color:#6B21A8}.st.at{background:#FEE2E2;color:#991B1B}.st.sd{background:#F1F5F9;color:#475569}
.vazio{padding:26px 18px;text-align:center;color:var(--mut)}
.cal{padding:4px 18px 18px}
.fams{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.fams button{flex:1;min-width:90px;border:0;font:inherit;font-size:12px;font-weight:800;padding:9px 6px;border-radius:10px;background:#F1F5F9;color:#334155;cursor:pointer}
.fams button.on{background:var(--navy);color:var(--lime)}
.wk{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:6px}
.dw{font-size:10px;font-weight:800;color:var(--mut);text-align:center;letter-spacing:.5px}
.sw{font-size:10px;font-weight:800;color:var(--mut);letter-spacing:.5px;margin:8px 0 4px}
.d{border-radius:10px;padding:7px 3px;text-align:center;min-height:58px;border:1px solid transparent}
.d b{display:block;font-size:13px}.d small{display:block;font-size:10.5px;font-weight:800;margin-top:3px;line-height:1.25}
.d.l{background:#ECFDF5;border-color:#A7F3D0;color:#065F46}.d.p{background:#FFFBEB;border-color:#FDE68A;color:#92400E}.d.c{background:#FEF2F2;border-color:#FECACA;color:#991B1B}
.d.f{background:repeating-linear-gradient(45deg,#F8FAFC,#F8FAFC 6px,#EEF2F6 6px,#EEF2F6 12px);color:#94A3B8}.d.x{visibility:hidden}
.d.me{box-shadow:inset 0 0 0 2px var(--navy)}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:10px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.nota{font-size:11.5px;color:var(--mut);line-height:1.55;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.ft{padding:0 32px 30px;color:var(--mut);font-size:11.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.erro{max-width:460px;margin:60px auto;background:#fff;border-radius:16px;padding:26px;text-align:center;border:1px solid var(--line)}
.erro b{display:block;font-size:17px;color:var(--navy);margin-bottom:6px}
.mc{display:none}
/* ── celular ── */
@media (max-width:900px){
  .top{padding:16px 16px 56px}.hero{margin-top:18px}.hero h1{font-size:24px}.hero p{font-size:13px}
  .lg-svg{width:34px;height:38px}.lg-img{height:38px}.emp b{font-size:16px}.emp span{font-size:10px}.at{display:none}
  .wrap{padding:0 12px;margin-top:-40px}.kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kp{padding:11px 13px;border-radius:14px}.kp b{font-size:22px;margin-top:2px}.kp small{font-size:9.5px}.kp span{font-size:11px}
  .alert{font-size:13px;padding:10px 12px}
  .seg{display:flex;background:#fff;border-radius:14px;padding:4px;margin-top:14px;border:1px solid var(--line);position:sticky;top:6px;z-index:5;box-shadow:0 6px 16px rgba(4,45,77,.08)}
  .seg button{flex:1;border:0;font:inherit;background:none;font-weight:800;font-size:13.5px;padding:11px;border-radius:10px;color:#475569}
  .seg button.on{background:var(--navy);color:var(--lime)}
  .cols{display:block;margin-top:12px}.cols>.box{display:none}.cols>.box.on{display:block}
  table{display:none}.mc{display:block;padding:0 12px 12px}
  .bh{padding:14px 14px 8px}.bh span{display:none}.chips{padding:0 14px 10px}.cal{padding:4px 12px 14px}
  .ft{padding:0 16px 26px}
}
.mg{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--mut);margin:14px 2px 6px;text-transform:uppercase}
.mcard{border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px;background:#fff}
.mcard .r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mcard .dd{font-weight:800;font-size:15px;color:var(--navy);text-align:right;white-space:nowrap}

.cols.c2{grid-template-columns:1fr}
/* ── portal do representante (login) ── */
.lgn{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 18px;position:relative;overflow:hidden;
  background:radial-gradient(900px 520px at 85% -10%,#0E5A8F 0,transparent 60%),radial-gradient(700px 500px at -10% 110%,#0B4A73 0,transparent 55%),linear-gradient(160deg,#042D4D,#021A2E)}
.lgn .wm{position:absolute;width:560px;height:620px;right:-170px;bottom:-160px;opacity:.07;pointer-events:none}.lgn .wm svg{width:100%;height:100%}
.lgtop{position:relative;text-align:center;color:#fff;margin-bottom:22px}
.lgtop .sym{width:74px;height:82px;margin:0 auto;filter:drop-shadow(0 8px 24px rgba(201,255,100,.25))}.lgtop .sym svg{width:100%;height:100%}
.lgtop .nm{margin-top:12px;font-size:26px;font-weight:800;letter-spacing:7px}
.lgtop .sb{margin-top:4px;font-size:11px;font-weight:700;letter-spacing:2.5px;color:#9FB6CC;text-transform:uppercase}
.lgc{position:relative;background:#fff;border-radius:24px;padding:26px 22px 22px;width:100%;max-width:400px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.lgc .tg{display:inline-flex;align-items:center;gap:6px;background:#EEF6DD;color:#3F6212;font-size:11px;font-weight:800;letter-spacing:1px;padding:5px 10px;border-radius:20px;text-transform:uppercase}
.lgc h1{font-size:22px;color:var(--navy);margin-top:12px;line-height:1.2}.lgc p.sub{font-size:13px;color:var(--mut);margin-top:4px;line-height:1.45}
.lgc label{display:block;font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--mut);margin:16px 0 7px;text-transform:uppercase}
.lgc input,.mm input,.mm textarea{width:100%;border:1.5px solid #CBD5E1;border-radius:12px;padding:12px 13px;font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:#fff}
.lgc input:focus,.mm input:focus,.mm textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(4,45,77,.12)}
.bt{border:0;font:inherit;font-weight:800;font-size:15px;padding:13px 16px;border-radius:12px;cursor:pointer;background:var(--navy);color:var(--lime);width:100%}
.bt:disabled{opacity:.6;cursor:default}.bt.sec{background:#F1F5F9;color:#334155}.bt.av{background:var(--lime);color:var(--navy)}
.err{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;border-radius:10px;padding:9px 11px;font-size:13px;margin-top:12px}
.ok2{background:#ECFDF5;border:1px solid #A7F3D0;color:#065F46;border-radius:10px;padding:9px 11px;font-size:13px;margin-top:12px}
.fld{position:relative}.fld .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:17px;opacity:.55;pointer-events:none}
.lgc .fld input{padding-left:44px;padding-right:50px;height:52px}.fld .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:#F1F5F9;border-radius:9px;padding:7px 10px;font-size:15px;cursor:pointer}
.lgc .bt{height:54px;font-size:16px;margin-top:20px;background:var(--lime);color:var(--navy);box-shadow:0 10px 24px rgba(201,255,100,.35)}
.lgc .mini{font-size:12px;color:var(--mut);margin-top:16px;text-align:center;line-height:1.55;border-top:1px solid var(--line);padding-top:14px}
.lgft{position:relative;margin-top:18px;color:#7F9BB5;font-size:11.5px;text-align:center}
.acts{display:flex;gap:8px;align-items:center}
.ab{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-weight:700;font-size:12.5px;padding:8px 12px;border-radius:30px;cursor:pointer;white-space:nowrap}
.ab.av{background:var(--lime);color:var(--navy);border-color:var(--lime);font-weight:800}
.atr{margin-top:16px;background:#FEF2F2;border:1px solid #FCA5A5;border-radius:14px;padding:12px 16px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;color:#7F1D1D}
.ov{position:fixed;inset:0;background:rgba(3,32,54,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.mm{background:#fff;border-radius:20px;width:100%;max-width:440px;padding:22px}
.mm h3{font-size:18px;color:var(--navy)}.mm p{font-size:13px;color:var(--mut);margin-top:4px}
.mm label{display:block;font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--mut);margin:14px 0 6px;text-transform:uppercase}
.mm .row{display:flex;gap:8px;margin-top:18px}
.or{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:20px;white-space:nowrap;background:#F1F5F9;color:#475569}.or.b{background:#FEF3C7;color:#92400E}
.d .me2{display:block;font-size:9.5px;font-weight:800;color:var(--navy);margin-top:2px}
@media (max-width:900px){.bar{flex-wrap:wrap}.acts{order:5;width:100%;margin-top:12px;gap:6px}.acts .ab.av{flex:1;padding:10px;font-size:14px}.ab{padding:9px 12px}}
</style>
</head>
<body>
<div id="app"><div class="erro"><b>Carregando…</b></div></div>
<div id="ov"></div>

  _carregando=true;
  try{
    const r=await fetch(`${URL_SB}/functions/v1/prog-rep`,{method:'POST',headers:H,body:JSON.stringify({token:t})});
    const j=await r.json().catch(()=>null);
    if(r.status===401||(j&&j.sessao===false)){gravarTk('');telaLogin(j&&j.motivo);return;}
    if(!r.ok||!j||!j.ok){if(!_d)document.getElementById('app').innerHTML=`<div class="erro"><b>Não deu para carregar</b>${esc((j&&j.motivo)||'Tente de novo em instantes.')}<br><br><button class="bt" onclick="carregar()">Tentar de novo</button></div>`;return;}
    _d=preparar(j);render();
  }catch(e){console.error(e);if(!_d||!document.querySelector('.top'))document.getElementById('app').innerHTML='<div class="erro"><b>Sem conexão</b>Confira a internet e tente de novo.<br><br><button class="bt" onclick="carregar()">Tentar de novo</button></div>';}
  finally{_carregando=false;}
}
function preparar(d){
  const meus=(d.meus||[]).map(c=>Object.assign(c,{_itens:c.itens,_data:c.data,_sc:c.data_salescode,_fin:c.fin}));
  meus.sort((a,b)=>String(a._data||'9999').localeCompare(String(b._data||'9999'))||String(a.pedido).localeCompare(String(b.pedido)));
  const carr=(d.carregados||[]).map(c=>Object.assign(c,{_itens:c.itens||[]}));
  return {d,meus,carr,livres:d.livres||[],hoje:d.hoje};
}
function situacao(c,h){
  if(c._fin)return {k:'fi',t:`FINANCEIRO · ${c.status||''}`};
  if(!c._data)return {k:'sd',t:'SEM DATA · fale com a fábrica'};
  if(c.data_manual&&c.data_manual!==c._sc)return {k:'mu',t:c._sc?'MUDOU A DATA':'DATA DA FÁBRICA'};
  if(c._data<h)return {k:'at',t:'ATRASADO · ainda não carregou'};
  return {k:'ok',t:'CONFIRMADO'};
}
function cabecalho(D){
  const b=_brand||{}, rz=String(b.razao_social||'').trim(), fan=String(b.nome_fantasia||'').trim();
  const nome=rz?rz.split(/\s+/)[0]:(fan||'Silicate');
  const resto=(rz?rz.split(/\s+/).slice(1).join(' '):'')||(!['FABRICA','FÁBRICA','EMPRESA',''].includes(fan.toUpperCase())?fan:'');
  const local=[b.cidade,b.uf].filter(Boolean).join('/');
  const logo=b.logo?`<img class="lg-img" src="${esc(b.logo)}" alt="">`:LOGO_SVG;
  const att=D.d.atualizado?new Date(D.d.atualizado).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
  const rep=String(D.d.representante||''), pri=(String(D.d.nome||'')||rep.replace(/^[\d-]+\s*[—-]\s*/,'')).split(/\s+/)[0]||'';
  return `<div class="top"><div class="bar">${logo}<div class="emp"><b>${esc(nome.toUpperCase())}</b><span>${esc([resto,local].filter(Boolean).join(' · '))}</span></div><div class="sp"></div>
    <div class="at"><i></i>Atualizado ${att}</div>
    <div class="acts"><button class="ab av" onclick="abrirAviso()">📣 <span class="tx">Lancei pedido novo</span></button><button class="ab" onclick="abrirSenha()" title="Trocar senha">🔑</button><button class="ab" onclick="sair()">Sair</button></div></div>
    <div class="hero"><div class="k">PROGRAMAÇÃO DE CARREGAMENTO</div><h1>Olá, ${esc(pri.charAt(0)+pri.slice(1).toLowerCase())} 👋</h1><p>${esc(rep)} · seus pedidos de Big Bag e Caulim 25 kg</p></div></div>`;
}

function render(){
  if(!_d)return;const D=_d,h=D.hoje,meus=D.meus;
  const sab=addDias(h,(6-dow(h)+7)%7);
  const semana=meus.filter(c=>!c._fin&&c._data&&c._data>=h&&c._data<=sab);
  const mudou=meus.filter(c=>c.data_manual&&c.data_manual!==c._sc);
  const fin=meus.filter(c=>c._fin), atr=meus.filter(c=>!c._fin&&c._data&&c._data<h), sem=meus.filter(c=>!c._fin&&!c._data);
  const tTot=meus.reduce((s,c)=>s+c._itens.reduce((a,i)=>a+(i.t||0),0),0);
  const kpis=`<div class="kpis"><div class="kp"><small>Pedidos em aberto</small><b>${meus.length}</b><span>${n1(tTot)} t no total</span></div>
    <div class="kp az"><small>Carregam esta semana</small><b>${semana.length}</b><span>até ${fmtDL(sab).toLowerCase()}</span></div>
    <div class="kp am"><small>Data mudada pela fábrica</small><b>${mudou.length}</b><span>${mudou.length?'veja abaixo':'nenhuma'}</span></div>
    <div class="kp"><small>Carregados (30 dias)</small><b style="color:#15803D">${D.carr.length}</b><span>${D.carr.length?'veja em Carregados':'nenhum'}</span></div></div>`;
  const atrasos=(D.d.atrasos||[]).map(a=>`<div class="atr">⚠️ <div><b>Atraso na fábrica (${esc(a.linha)}):</b> ${esc(a.motivo)}. Os pedidos a partir de ${fmtDL(a.inicio)} foram adiados ${a.dias} dia${a.dias>1?'s':''} útil${a.dias>1?'eis':''} — as datas abaixo já estão corrigidas.</div></div>`).join('');
  const alerta=mudou.length?`<div class="alert">📅 <div><b>${mudou.length>1?mudou.length+' pedidos mudaram':'1 pedido mudou'} de data</b> para caber na produção — a data riscada é a que você tinha programado. Avise o cliente.</div></div>`:'';

  const F={todos:meus,mudou,atr,fin,sem}, lista=F[_flt]||meus;
  const chip=(k,t,n)=>`<button class="chip${_flt===k?' on':''}" ${n||k==='todos'?'':'disabled'} onclick="_flt='${k}';render()">${t} ${n}</button>`;
  const chips=`<div class="chips">${chip('todos','Todos',meus.length)}${chip('mudou','Mudou',mudou.length)}${chip('atr','Atrasados',atr.length)}${chip('fin','Financeiro',fin.length)}${chip('sem','Sem data',sem.length)}</div>`;
  const grupos={};lista.forEach(c=>(grupos[c._data||'']=grupos[c._data||'']||[]).push(c));
  const chaves=Object.keys(grupos).sort((a,b)=>(a||'9').localeCompare(b||'9'));
  const rot=k=>k?fmtDL(k)+(k===h?' · HOJE':k<h?' · atrasados':''):'Sem data';
  const prod=c=>c._itens.map(i=>`<span class="pr" style="background:${COR[i.mat]||COR.outro}">${esc(i.nome)}</span>`).join('<br>');
  const qtd=c=>c._itens.map(i=>`${i.un==='t'?n1(i.q):n0(i.q)} <small>${esc(i.un)}</small>`).join('<br>');
  const dataC=c=>`<span class="dt">${fmtDL(c._data)}</span>${c.data_manual&&c._sc&&c.data_manual!==c._sc?`<span class="old">${fmtDL(c._sc)}</span>`:''}`;
  const cli=c=>`<b>${esc(c.cliente||'—')}</b>${c.cidade&&!String(c.cliente||'').includes('(')?`<span>${esc(c.cidade)}</span>`:''}`;
  const tab=lista.length?`<table><thead><tr><th>Pedido</th><th>Cliente</th><th>Produto</th><th>Qtd</th><th>Carrega</th><th>Situação</th></tr></thead><tbody>${chaves.map(k=>`<tr class="dg"><td colspan="6">${rot(k)} · ${grupos[k].length}</td></tr>`+grupos[k].map(c=>{const s=situacao(c,h);return `<tr><td><span class="ped">${esc(c.pedido)}</span></td><td class="cli">${cli(c)}</td><td>${prod(c)}</td><td class="q">${qtd(c)}</td><td>${dataC(c)}</td><td><span class="st ${s.k}">${esc(s.t)}</span></td></tr>`;}).join('')).join('')}</tbody></table>`:'';
  const cards=lista.length?`<div class="mc">${chaves.map(k=>`<div class="mg">${rot(k)}</div>`+grupos[k].map(c=>{const s=situacao(c,h);return `<div class="mcard"><div class="r"><span class="ped">${esc(c.pedido)}</span><span class="st ${s.k}">${esc(s.t)}</span></div>
      <div class="r" style="margin-top:8px;align-items:flex-start"><div class="cli">${cli(c)}</div><div class="dd">${dataC(c)}</div></div>
      <div class="r" style="margin-top:8px;align-items:flex-end"><div>${prod(c)}</div><div class="q" style="text-align:right">${qtd(c)}</div></div></div>`;}).join('')).join('')}</div>`:'';
  const boxPed=`<div class="box${_aba==='ped'?' on':''}"><div class="bh"><h2>Meus pedidos</h2><span>${meus.length} em aberto · por data de carregamento</span></div>${chips}
    ${lista.length?tab+cards:`<div class="vazio">${meus.length?'Nenhum pedido neste filtro.':'Nenhum pedido em aberto agora.'}</div>`}</div>`;

  // dias livres (vêm prontos do servidor)
  const [fam,rotF,un]=FAMS.find(f=>f[0]===_fam)||FAMS[0];
  const meusDias=new Set(meus.filter(c=>!c._fin&&c._itens.some(i=>i.fam===fam)).map(c=>c._data));
  const L={};D.livres.forEach(x=>L[x.iso]=x);
  let semanas='', seg=addDias(h,dow(h)===0?1:1-dow(h)), fim=addDias(h,28), temAdef=false;
  while(seg<=fim){
    let linha='';
    for(let k=0;k<6;k++){
      const iso=addDias(seg,k), x=L[iso];
      if(iso<=h||iso>fim||!x){linha+='<div class="d x"></div>';continue;}
      const l=x[fam]||{};let cls,txt;
      if(l.semPlano){cls='f';txt='a definir';temAdef=true;}
      else if(l.fechado){cls='f';txt=x.estado==='feriado'?'feriado':'fechado';}
      else{const r=l.total?l.livre/l.total:0;cls=l.livre<1?'c':r<0.25?'p':'l';txt=l.livre<1?'cheio':`cabem ${n0(l.livre)}`;}
      linha+=`<div class="d ${cls}${meusDias.has(iso)?' me':''}" title="${fmtDL(iso)}"><b>${iso.slice(8,10)}</b><small>${txt}</small></div>`;
    }
    semanas+=`<div class="sw">SEMANA ${fmtD(seg)}</div><div class="wk">${linha}</div>`;seg=addDias(seg,7);
  }
  const boxCal=`<div class="box${_aba==='cal'?' on':''}"><div class="bh"><h2>Dias livres para programar</h2><span>próximas 4 semanas · em ${esc(un)}</span></div><div class="cal">
    <div class="fams">${FAMS.map(f=>`<button class="${f[0]===_fam?'on':''}" onclick="_fam='${f[0]}';render()">${esc(f[1])}</button>`).join('')}</div>
    <div class="wk">${['SEG','TER','QUA','QUI','SEX','SÁB'].map(x=>`<div class="dw">${x}</div>`).join('')}</div>${semanas}
    <div class="leg"><span><i style="background:#A7F3D0"></i>livre</span><span><i style="background:#FDE68A"></i>pouco espaço</span><span><i style="background:#FECACA"></i>cheio</span>${temAdef?'<span><i style="background:#E2E8F0"></i>mês ainda sem plano</span>':''}<span><i style="box-shadow:inset 0 0 0 2px #042D4D"></i>você já tem pedido</span></div>
    <div class="nota">Big Bag e Caulim 25 kg saem da mesma linha: o espaço livre é <b>um ou outro</b>, não os dois juntos. “Cabem X” já desconta os pedidos programados de <b>todos</b> os representantes. Os pedidos novos ainda precisam da confirmação da fábrica.${temAdef?' “A definir” = a fábrica ainda não fechou a programação daquele mês.':''}</div></div></div>`;

  // carregados (30 dias)
  const cg={};D.carr.forEach(c=>{const k=isoLocal(c.em);(cg[k]=cg[k]||[]).push(c);});
  const ck=Object.keys(cg).sort().reverse();
  const origem=c=>c.origem==='balanca'?`<span class="or b">⚖️ pesou${c.ticket?' · ticket '+esc(c.ticket):''}</span>`:'<span class="or">carregado</span>';
  const boxCarr=`<div class="box${_aba==='carr'?' on':''}"><div class="bh"><h2>Carregados</h2><span>últimos 30 dias</span></div>
    ${D.carr.length?`<table><thead><tr><th>Pedido</th><th>Cliente</th><th>Produto</th><th>Qtd</th><th>Carregou</th><th>Placa</th></tr></thead><tbody>${ck.map(k=>`<tr class="dg"><td colspan="6">${fmtDL(k)} · ${cg[k].length}</td></tr>`+cg[k].map(c=>`<tr><td><span class="ped">${esc(c.pedido)}</span></td><td class="cli">${cli(c)}</td><td>${prod(c)}</td><td class="q">${qtd(c)}</td><td>${new Date(c.em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} ${origem(c)}</td><td>${esc(c.placa||'—')}</td></tr>`).join('')).join('')}</tbody></table>
    <div class="mc">${ck.map(k=>`<div class="mg">${fmtDL(k)}</div>`+cg[k].map(c=>`<div class="mcard"><div class="r"><span class="ped">${esc(c.pedido)}</span>${origem(c)}</div><div class="r" style="margin-top:8px;align-items:flex-start"><div class="cli">${cli(c)}</div><div class="dd">${new Date(c.em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div></div><div class="r" style="margin-top:8px;align-items:flex-end"><div>${prod(c)}</div><div class="q" style="text-align:right">${qtd(c)}${c.placa?`<br><small>${esc(c.placa)}</small>`:''}</div></div></div>`).join('')).join('')}</div>`
    :'<div class="vazio">Nenhum pedido carregado nos últimos 30 dias.</div>'}</div>`;

  const segm=`<div class="seg"><button class="${_aba==='ped'?'on':''}" onclick="_aba='ped';render()">Pedidos</button><button class="${_aba==='cal'?'on':''}" onclick="_aba='cal';render()">Dias livres</button><button class="${_aba==='carr'?'on':''}" onclick="_aba='carr';render()">Carregados</button></div>`;
  const b=_brand||{};
  document.getElementById('app').innerHTML=cabecalho(D)+`<div class="wrap">${kpis}${atrasos}${alerta}${segm}<div class="cols">${boxPed}${boxCal}</div><div class="cols c2">${boxCarr}</div></div>
    <div class="ft"><span>${esc(b.razao_social||'')}${b.razao_social?' · ':''}acesso exclusivo — não compartilhe sua senha</span><span>Para mudar uma data já programada, fale com a programação da fábrica.</span></div>`;
}

/* ── avisar pedido novo / trocar senha ── */
const fecharOv=()=>{document.getElementById('ov').innerHTML='';};
function abrirAviso(){
  document.getElementById('ov').innerHTML=`<div class="ov" onclick="if(event.target===this)fecharOv()"><form class="mm" onsubmit="event.preventDefault();avisar()">
    <h3>📣 Lancei pedido novo no Salescode</h3><p>A fábrica recebe o aviso na hora (no sistema e no celular).</p>
    <label>Número do pedido (se tiver)</label><input id="av-p" maxlength="40" placeholder="ex.: A01MXX" autocapitalize="characters">
    <label>Observação (opcional)</label><textarea id="av-o" rows="3" maxlength="300" placeholder="ex.: cliente quer carregar dia 25"></textarea>
    <div id="av-m"></div>
    <div class="row"><button type="button" class="bt sec" onclick="fecharOv()">Cancelar</button><button class="bt av" id="av-b">Enviar aviso</button></div></form></div>`;
  setTimeout(()=>document.getElementById('av-p')?.focus(),50);
}
async function avisar(){
  const b=document.getElementById('av-b'),m=document.getElementById('av-m');b.disabled=true;b.textContent='Enviando…';
  try{const r=await rpc('rep_avisar',{p_token:lerTk(),p_pedido:document.getElementById('av-p').value,p_obs:document.getElementById('av-o').value});
    if(r&&r.ok){m.innerHTML='<div class="ok2">✓ Aviso enviado para a fábrica.</div>';b.textContent='Enviado';setTimeout(fecharOv,1600);return;}
    m.innerHTML=`<div class="err">${esc(r&&r.motivo||'Não foi possível enviar.')}</div>`;if(r&&/Sessão/.test(r.motivo||'')){setTimeout(()=>{fecharOv();gravarTk('');telaLogin(r.motivo);},1200);}
  }catch(e){m.innerHTML='<div class="err">Sem conexão. Tente de novo.</div>';}
  b.disabled=false;if(b.textContent!=='Enviado')b.textContent='Enviar aviso';
}
function abrirSenha(){
  document.getElementById('ov').innerHTML=`<div class="ov" onclick="if(event.target===this)fecharOv()"><form class="mm" onsubmit="event.preventDefault();trocarSenha()">
    <h3>🔑 Trocar minha senha</h3><p>Depois de trocar, outros aparelhos onde você entrou são desconectados.</p>
    <label>Senha atual</label><input id="ts-a" type="password" autocomplete="current-password" required>
    <label>Nova senha (mín. 6)</label><input id="ts-n" type="password" autocomplete="new-password" minlength="6" required>
    <label>Repita a nova senha</label><input id="ts-n2" type="password" autocomplete="new-password" minlength="6" required>
    <div id="ts-m"></div>
    <div class="row"><button type="button" class="bt sec" onclick="fecharOv()">Cancelar</button><button class="bt" id="ts-b">Trocar</button></div></form></div>`;
}
async function trocarSenha(){
  const a=document.getElementById('ts-a').value,n=document.getElementById('ts-n').value,n2=document.getElementById('ts-n2').value,m=document.getElementById('ts-m');
  if(n!==n2){m.innerHTML='<div class="err">As duas novas senhas não estão iguais.</div>';return;}
  try{const r=await rpc('rep_trocar_senha',{p_token:lerTk(),p_atual:a,p_nova:n});
    m.innerHTML=r&&r.ok?'<div class="ok2">✓ Senha trocada.</div>':`<div class="err">${esc(r&&r.motivo||'Não foi possível trocar.')}</div>`;if(r&&r.ok)setTimeout(fecharOv,1400);
  }catch(e){m.innerHTML='<div class="err">Sem conexão. Tente de novo.</div>';}
}

carregar();
setInterval(()=>{if(_d&&!document.hidden)carregar();},2*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&_d)carregar();});
</script>
</body>
