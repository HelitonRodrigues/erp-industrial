<!-- ==========================================================================
     BPF / SGQ  ·  v2.3  ·  03/09/2026
     v2.0  camada de fila: gatilho -> tarefa -> coleta -> assinatura
     v2.1  escopo por designacao: cada um so enxerga os POPs em que e designado
     v2.2  filtro de itens por gatilho (bpf_gatilhos.filtro.itens) - so os insumos
           de nutricao animal geram ficha de recebimento
     v2.3  escopo tambem na navegacao: as 6 abas de leitura total somem da barra
           para quem so coleta, e ir() bloqueia a entrada por URL/KPI
     Requer: sql/002_bpf_fila.sql + sql/003_bpf_gatilho_filtro_itens.sql
             (ambas aplicadas em 03/09/2026)

<style>
.pg-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap;gap:12px;}
.pg-hdr h1{font-size:20px;font-weight:800;color:var(--primary);line-height:1.2;}
.pg-hdr p{font-size:12px;color:#64748b;margin-top:4px;line-height:1.5;}
.pg-acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex-shrink:0;}

.lay{display:grid;grid-template-columns:286px 1fr;min-height:calc(100vh - var(--topbar-h) - 92px);
     border-radius:14px;border:1.5px solid #e2e8f0;background:#fff;overflow:hidden;transition:grid-template-columns .22s ease;}
.lay.nav-off{grid-template-columns:0 1fr;}
.lay.nav-off .nav{opacity:0;pointer-events:none;}
.nav{background:#f8fafc;border-right:1.5px solid #e2e8f0;display:flex;flex-direction:column;overflow:hidden;transition:opacity .18s;}
.nav-top{padding:13px 12px 10px;border-bottom:1.5px solid #e2e8f0;background:#fff;}
.nav-list{flex:1;overflow-y:auto;padding:6px 8px 20px;}
.nav-grp{font-size:9.5px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:.6px;padding:13px 8px 5px;}
.nav-it{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12px;color:#374151;font-weight:600;border-left:3px solid transparent;}
.nav-it:hover{background:#eef2f7;}
.nav-it.on{background:#fff;border-left-color:var(--accent);color:var(--primary);font-weight:800;box-shadow:0 1px 4px rgba(4,45,77,.08);}
.nav-it .cod{font-size:10px;font-weight:800;color:var(--primary);background:#e8eef4;border-radius:5px;padding:2px 5px;flex-shrink:0;min-width:24px;text-align:center;}
.nav-it .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav-it .ct{font-size:10px;color:#94a3b8;font-weight:700;}
.nav-it .al{width:7px;height:7px;border-radius:50%;background:var(--danger);flex-shrink:0;}
.nav-tg{background:transparent;border:1.5px solid var(--primary);color:var(--primary);border-radius:8px;
        padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.nav-tg:hover{background:#f0f4f8;}

.body{display:flex;flex-direction:column;min-width:0;}
.body-hdr{padding:14px 20px;border-bottom:1.5px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.body-crumb{font-size:10px;color:#94a3b8;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.body-title{font-size:17px;font-weight:800;color:var(--primary);}
.body-main{padding:20px;overflow-y:auto;flex:1;}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:12px;margin-bottom:18px;}
.kpi{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:13px 15px;border-left:4px solid var(--primary);}
.kpi .v{font-size:23px;font-weight:800;color:var(--primary);line-height:1.1;}
.kpi .l{font-size:10.5px;color:#64748b;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-top:4px;}
.kpi.warn{border-left-color:var(--warning);} .kpi.warn .v{color:#b45309;}
.kpi.dang{border-left-color:var(--danger);} .kpi.dang .v{color:var(--danger);}
.kpi.ok{border-left-color:var(--success);} .kpi.ok .v{color:#16a34a;}
.kpi.clk{cursor:pointer;} .kpi.clk:hover{box-shadow:0 2px 10px rgba(4,45,77,.12);}

.tbl-wrap{border:1.5px solid #e2e8f0;border-radius:12px;overflow:auto;background:#fff;}
.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th{background:var(--primary);color:var(--accent);font-size:11px;font-weight:800;text-align:left;padding:9px 12px;white-space:nowrap;text-transform:uppercase;letter-spacing:.3px;}
.tbl td{padding:9px 12px;border-bottom:1px solid #eef2f7;vertical-align:middle;}
.tbl tbody tr:hover{background:#f8fafc;}
.tbl .num{font-family:ui-monospace,monospace;font-size:11px;font-weight:700;color:var(--primary);}

.sec-card{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:15px 17px;margin-bottom:13px;}
.sec-card h3{font-size:13px;font-weight:800;color:var(--primary);margin-bottom:4px;}
.sec-card .sub{font-size:11.5px;color:#64748b;line-height:1.6;}
.erp-card{border-left:4px solid var(--info);}

.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px;margin-bottom:13px;}
.fld label{font-size:11.5px;font-weight:700;color:#374151;display:block;margin-bottom:4px;}
.fld .aj{font-size:10.5px;color:#94a3b8;margin-top:3px;line-height:1.5;display:block;}
.fld .req{color:var(--danger);}
.f-secao{grid-column:1/-1;font-size:11px;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:.5px;padding:9px 0 2px;border-bottom:1.5px solid #e2e8f0;margin-bottom:3px;}
.sn-grp{display:flex;gap:6px;}
.sn-btn{flex:1;padding:8px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;color:#64748b;}
.sn-btn.sel-sim{background:#dcfce7;border-color:#16a34a;color:#16a34a;}
.sn-btn.sel-nao{background:#fee2e2;border-color:var(--danger);color:var(--danger);}
.fld.desvio input,.fld.desvio select{border-color:var(--danger)!important;background:#fff5f6;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:11.5px;font-weight:600;cursor:pointer;margin:0 5px 5px 0;}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff;}

.alerta{border-radius:10px;padding:10px 14px;font-size:12px;line-height:1.6;margin-bottom:11px;border-left:4px solid;}
.al-warn{background:#fffbeb;border-color:var(--warning);color:#92400e;}
.al-dang{background:#fef2f2;border-color:var(--danger);color:#991b1b;}
.al-info{background:#eff6ff;border-color:var(--info);color:#1e40af;}
.al-ok{background:#f0fdf4;border-color:var(--success);color:#15803d;}

.trava{display:flex;align-items:center;gap:12px;padding:10px 13px;border:1.5px solid #e2e8f0;border-radius:10px;margin-bottom:7px;background:#fff;}
.trava .sw{width:42px;height:23px;border-radius:20px;background:#cbd5e1;position:relative;cursor:pointer;flex-shrink:0;transition:.2s;}
.trava .sw::after{content:'';position:absolute;top:2.5px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;}
.trava .sw.on{background:var(--success);} .trava .sw.on::after{left:21px;}
.trava .nm{font-size:12.5px;font-weight:700;color:var(--primary);}
.trava .ds{font-size:11px;color:#64748b;margin-top:2px;line-height:1.5;}
.sys{font-size:10px;font-weight:800;color:#94a3b8;font-family:ui-monospace,monospace;}

.trilha-it{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #eef2f7;font-size:11.5px;}
.trilha-it .qd{font-size:10px;color:#94a3b8;white-space:nowrap;font-family:ui-monospace,monospace;}
.empty{padding:40px 20px;text-align:center;color:#94a3b8;}
.empty .ic{font-size:36px;margin-bottom:10px;}
.empty h3{font-size:14px;font-weight:700;color:var(--primary);margin-bottom:5px;}
.empty p{font-size:12px;}
.anx{display:flex;align-items:center;gap:9px;padding:7px 11px;border:1.5px solid #e2e8f0;border-radius:8px;margin-bottom:6px;font-size:12px;background:#fff;}
.anx .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.spin{display:inline-block;width:13px;height:13px;border:2px solid #cbd5e1;border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;}
@keyframes sp{to{transform:rotate(360deg);}}

/* diálogos próprios — nada de alert/confirm/prompt do navegador */
.dlg-ov{position:fixed;inset:0;background:rgba(3,32,54,.55);z-index:9000;display:flex;align-items:center;justify-content:center;padding:18px;}
.dlg{background:#fff;border-radius:14px;max-width:470px;width:100%;box-shadow:0 12px 40px rgba(3,32,54,.3);overflow:hidden;}
.dlg-hd{padding:15px 18px 11px;border-bottom:1.5px solid #eef2f7;display:flex;gap:10px;align-items:flex-start;}
.dlg-ic{font-size:20px;line-height:1;}
.dlg-tt{font-size:14px;font-weight:800;color:var(--primary);}
.dlg-bd{padding:15px 18px;font-size:12.5px;line-height:1.65;color:var(--text);}
.dlg-ft{padding:11px 18px 15px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
.vw-box{width:100%;height:74vh;border:1.5px solid #e2e8f0;border-radius:10px;background:#f8fafc;}
.vw-box img{max-width:100%;max-height:100%;display:block;margin:0 auto;object-fit:contain;}

.mob-tg{display:none;background:var(--primary);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:700;}
@media(max-width:880px){
  .lay,.lay.nav-off{grid-template-columns:1fr;}
  .nav{display:none;position:fixed;inset:0;z-index:200;width:300px;border-radius:0;opacity:1;pointer-events:auto;}
  .nav.open{display:flex;}
  .mob-tg{display:inline-flex;} .nav-tg{display:none;}
  .kpis{grid-template-columns:repeat(2,1fr);}
  .form-row{grid-template-columns:1fr;}
}
/* IMPRESSÃO
   O bug anterior: a área de impressão ficava com display:none e o @media print
   tentava revelá-la com visibility:visible. Não funciona — elemento com
   display:none não entra na renderização, então saía folha em branco.
   A correção é alternar display, não visibility. */
#print-area{display:none;}
@media print{
  body>*{display:none!important;}
  #print-area{display:block!important;position:static;width:100%;padding:0;margin:0;}
  #print-area table{page-break-inside:auto;}
  #print-area tr{page-break-inside:avoid;}
  @page{margin:12mm;}
}

/* ── camada de fila (002_bpf_fila.sql) ─────────────────────── */
.tk{display:flex;gap:12px;padding:13px 15px;border:1.5px solid #e2e8f0;border-left:4px solid #cbd5e1;
    border-radius:11px;background:#fff;margin-bottom:8px;align-items:flex-start;}
.tk.coletar{border-left-color:var(--info);} .tk.assinar{border-left-color:var(--warning);}
.tk.atras{border-left-color:var(--danger);background:#fff6f7;}
.tk-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:16px;flex:0 0 34px;background:#f1f5f9;}
.tk-bd{flex:1;min-width:0;} .tk-msg{font-size:13.5px;font-weight:700;line-height:1.35;color:var(--primary);}
.tk-mt{font-size:10.5px;color:#64748b;margin-top:4px;display:flex;gap:9px;flex-wrap:wrap;font-weight:600;align-items:center;}
.tk-ac{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex:0 0 auto;}
.ch{display:flex;flex-wrap:wrap;margin-top:9px;}
.ch .st{flex:1;min-width:140px;border:1px solid #e2e8f0;padding:7px 10px;background:#f8fafc;}
.ch .st:first-child{border-radius:9px 0 0 9px;} .ch .st:last-child{border-radius:0 9px 9px 0;}
.ch .st+.st{border-left:0;}
.ch .st .n{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:#94a3b8;}
.ch .st .q{font-size:12px;font-weight:700;color:var(--primary);margin-top:1px;}
.ch .st .w{font-size:10px;color:#64748b;margin-top:1px;}
.ch .st.done{background:#f0fdf4;border-color:#bbf7d0;} .ch .st.done .n{color:#15803d;}
.ch .st.now{background:#fffbeb;border-color:#fde68a;} .ch .st.now .n{color:#b45309;}
.ch .st.wait{opacity:.6;}
.fl-flow{display:flex;align-items:center;flex-wrap:wrap;font-size:10.5px;font-weight:700;margin-top:9px;gap:0;}
.fl-flow span{border:1px solid #cbd5e1;background:#fff;padding:5px 10px;border-radius:6px;white-space:nowrap;}
.fl-flow i{color:#94a3b8;padding:0 6px;font-style:normal;font-size:13px;}
.qa{border:1.5px solid #e2e8f0;border-radius:11px;overflow:hidden;margin-top:11px;background:#fff;}
.qa-q{padding:10px 13px;background:#f1f5f9;font-size:12.5px;font-weight:700;color:var(--primary);
      display:flex;align-items:center;gap:9px;border-bottom:1px solid #e2e8f0;flex-wrap:wrap;}
.qa-n{background:var(--primary);color:var(--accent);border-radius:5px;padding:1px 7px;font-size:10px;font-weight:800;}
.qa-a{padding:12px 13px;font-size:12.5px;}
.dl-g{display:grid;grid-template-columns:170px 1fr;gap:0 13px;font-size:12.5px;}
.dl-g b{color:#64748b;font-weight:700;padding:5px 0;border-bottom:1px solid #f1f5f9;}
.dl-g span{padding:5px 0;border-bottom:1px solid #f1f5f9;font-weight:500;}
.dq-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.dq-row #dq-q{min-width:290px;flex:1;}
@media(max-width:700px){.dl-g{grid-template-columns:1fr;}.tk{flex-wrap:wrap;}.tk-ac{width:100%;flex-direction:row;}}


/* ══ BPF — layout 10/2026 (padrão Insumos/Almoxarifado/Solicitações) ══ */
.main-content{--bx-ln:#e2e8f0;--bx-mu:#64748b;--bx-ok:#16a34a;--bx-sh:0 1px 3px rgba(4,45,77,.06),0 1px 2px rgba(4,45,77,.04);}
.pg-hdr{align-items:center;margin-bottom:12px;}
.pg-hdr h1{font-size:24px;}
.bx-nav{display:flex;gap:6px;padding:6px;background:#fff;border:1px solid var(--bx-ln);border-radius:16px;box-shadow:var(--bx-sh);margin-bottom:14px;flex-wrap:wrap;}
.bx-area{flex:1 0 auto;min-height:48px;padding:0 14px;border:none;border-radius:12px;background:transparent;font-family:inherit;font-weight:700;font-size:14px;color:var(--primary);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.bx-area:hover{background:#f1f5f9;}
.bx-area.on{background:var(--primary);color:var(--accent);}
.bx-bd{display:none;background:#dc2626;color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;font-weight:800;}
.bx-mais-wrap{position:relative;flex:1 0 auto;display:flex;}
.bx-mais-wrap .bx-area{width:100%;}
.bx-mais-lista{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:60;min-width:220px;background:#fff;border:1px solid var(--bx-ln);border-radius:12px;box-shadow:0 10px 30px rgba(4,45,77,.15);padding:6px;}
.bx-mais-wrap.on .bx-mais-lista{display:block;}
.bx-mais-lista button{display:flex;width:100%;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:none;background:none;border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;color:var(--primary);cursor:pointer;text-align:left;}
.bx-mais-lista button:hover{background:#f1f5f9;}
/* item escolhido na lista de POPs: bem visível */
.nav-it.on{background:var(--primary)!important;color:#fff!important;border-left-color:var(--accent)!important;}
.nav-it.on .cod{background:var(--accent);color:var(--primary);}
.nav-it.on .ct{color:#cbd5e1;}

.bx-bar{display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid var(--bx-ln);border-radius:12px;padding:12px 14px;margin-bottom:12px;}
.bx-busca{min-height:44px;}
.bx-chips{display:flex;gap:6px;flex-wrap:wrap;}

.bx-sub{font-size:11.5px;color:#94a3b8;margin-top:2px;}

.bx-mu{color:var(--bx-mu);}

// ESCOPO DO BPF — o que é nutrição animal
//
// O sistema de qualidade cobre SÓ a produção para alimentação animal:
// Linha 2 e Longa Vida, em sacaria de 25 kg (papel kraft valvulado, POP-01 6.a)
// e Big Bag. Linha 3, Sikal Concentrado e demais produtos são outra operação e
// não entram em nenhum registro, painel ou indicador daqui.
//
// Os limites do POP-18 6.c confirmam o escopo: sacaria 25,000–25,200 kg e
// Big Bag 1.000 kg ± 1 kg. Não há tolerância definida para nenhum outro produto.
// ═══════════════════════════════════════════════════════════════════════════
const ESCOPO={
  linhas:['Linha 2','Longa Vida'],
  // 25 kg (com ou sem espaço) ou Big Bag / BB / bag
  reProduto:/(^|[^\d])25\s*kg|big\s*-?\s*bag|\bbag\b/i,
  ativo:true,
};
function produtoNoEscopo(p){ return ESCOPO.reProduto.test(String(p||'')); }
function linhaNoEscopo(l){
  const v=String(l||'').trim();
  return !v || ESCOPO.linhas.some(x=>x.toLowerCase()===v.toLowerCase());
}
// Uma linha do ERP entra se a linha bate E pelo menos um produto bate.
// Campo ausente não reprova — a tabela pode simplesmente não ter aquela coluna.
function noEscopo(r){
  if(!ESCOPO.ativo) return true;
  const l=r.linha??r.linha_producao??r.linha_produto;
  if(l!==undefined&&l!==null&&String(l).trim()!==''&&!linhaNoEscopo(l)) return false;
  let prods=[];
  if(Array.isArray(r.produtos_op)) prods=r.produtos_op.map(x=>x&&(x.produto||x.nome)).filter(Boolean);
  const p=r.produto??r.produto_nome??r.item_nome;
  if(p) prods.push(p);
  if(!prods.length) return true;              // sem informação de produto: não exclui
  return prods.some(produtoNoEscopo);
}

}

// O lote NÃO é uma coluna da tabela `producao`: ele vive dentro do jsonb

// carregamento.html — se o BPF derivasse diferente, dariam lotes divergentes

function itensDaOP(r){ return Array.isArray(r.produtos_op)?r.produtos_op.filter(Boolean):[]; }

const _normP=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
// lote da análise: OP do mesmo dia e linha, item com o mesmo produto
async function loteDaAnaliseLab(x){
  try{
    const ops=await lst(_supabase.from('producao').select('op_numero,data,linha,produtos_op').eq('data',x.data).eq('linha',x.linha));
    for(const op of ops){const it=itensDaOP(op).find(i=>_normP(i.produto)===_normP(x.produto));if(it)return {lote:it.lote||'',op:op.op_numero||''};}
  }catch(e){}
  return {lote:'',op:''};
}
function mapLabPOP15(x,lt){
  const pen=x.peneiramento||{};const n=v=>v===null||v===undefined||v===''?null:Number(v);
  const pens={pen20:n(pen.p20),pen40:n(pen.p40),pen50:n(pen.p50),pen100:n(pen.p100),pen200:n(pen.p200)};
  const soma=Object.values(pens).filter(v=>v!==null&&!isNaN(v)).reduce((a,b)=>a+b,0);
  const tem=Object.values(pens).some(v=>v!==null);
  const o={lote:(lt&&lt.lote)||'',...pens,
    total_retido:tem?+soma.toFixed(2):null,passante:tem?+(100-soma).toFixed(2):null,
    umidade:n(x.umidade),mm:n(x.mm_result),peso_especifico:n(x.peso_esp_result),
    limites_origem:'Genérico do produto',
    decisao:x.status==='OK'?'Aprovado':'Aguardando resultado',
    _resp:x.responsavel_analise||x.responsavel||'Laboratório'};
  if(lt&&lt.op)o.obs='OP '+lt.op+' · '+x.linha+' · '+x.produto;
  Object.keys(o).forEach(k=>{if(o[k]===null)delete o[k];});
  return o;
}
// botão "Atualizar do laboratório": relê a análise enquanto nenhum revisor assinou
async function atualizarDoLaboratorio(id){
  const r=_regs.find(x=>x.id===id);if(!r||r.origem_modulo!=='laboratorio'||!r.origem_id)return;
  const {data:x,error}=await _supabase.from('laboratorio').select('*').eq('id',r.origem_id).maybeSingle();
  if(error||!x){await uiAlerta('Análise não encontrada no laboratório.',{titulo:'Não encontrado',tipo:'warn'});return;}
  const novo=mapLabPOP15(x,await loteDaAnaliseLab(x));delete novo._resp;
  const campos={...(r.campos||{}),...novo};
  const res=await db(_supabase.from('bpf_registros').update({campos,atualizado_em:new Date().toISOString()}).eq('id',id),'atualizar do laboratório');
  if(res.error)return;
  await trilha(id,r.numero,'atualizado',null,null,null,'Valores relidos do laboratório');
  r.campos=campos;toast('Valores atualizados do laboratório.','success');abrirRegistroFluxo(id);
}
// POP-15 / 003: rótulo aprovado → o 1º lote produzido com ele entra sozinho no registro
async function vincularLoteRotulo(){
  const pend=_regs.filter(r=>r.formulario_cod==='REG-POP15-03'&&!r.cancelado_em&&regLancado(r)&&(r.campos||{}).produto&&!(r.campos||{}).primeiro_lote);
  if(!pend.length)return;
  let ops=[];
  try{ops=await lst(_supabase.from('producao').select('op_numero,data,linha,produtos_op').order('data').gte('data',pend.map(r=>r.data).sort()[0]).limit(1000));}catch(e){return;}
  for(const r of pend){
    const alvo=_normP(r.campos.produto);
    for(const op of ops.filter(o=>o.data>=r.data&&noEscopo(o))){
      const it=itensDaOP(op).find(i=>_normP(i.produto)===alvo||_normP(i.produto).includes(alvo));
      if(!it)continue;
      const campos={...r.campos,primeiro_lote:it.lote||'',op_primeiro:op.op_numero||''};
      const res=await db(_supabase.from('bpf_registros').update({campos}).eq('id',r.id),'vincular lote ao rótulo');
      if(!res.error){r.campos=campos;await trilha(r.id,r.numero,'lote vinculado','Primeiro lote',null,it.lote||'',`OP ${op.op_numero||''} — primeiro lote com esta versão do rótulo`);}
      break;
    }
  }
}

function calibracaoVigente(tag){
  const i=(_ent.instrumentos||[]).find(x=>x.tag===tag);if(!i)return null;

  if(!u)return null;                               // sem calibração cadastrada: o operador responde
  return diasAte(u.validade)>=0;
}

// Visualizador de anexo: imagem e PDF abrem aqui dentro; o resto oferece download.
// bucket opcional: as fotos enviadas pelo cliente vivem em `publico-anexos`,
// separado do `documentos` por segurança — lá o anon pode inserir, aqui não.
// PDF desenhado com pdf.js dentro da janela: o visualizador nativo do navegador
// (iframe) às vezes mostra só o botão "Abrir" — principalmente no celular.
let _pdfjs=null;
async function carregarPdfJs(){
  if(_pdfjs)return _pdfjs;
  await new Promise((ok,er)=>{const sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';sc.onload=ok;sc.onerror=er;document.head.appendChild(sc);});
  window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  _pdfjs=window.pdfjsLib;return _pdfjs;
}
// src: URL (string) ou bytes (Uint8Array). Desenha todas as páginas no elemento.
async function renderPdfNo(el,src){
  const lib=await carregarPdfJs();
  let dados=src;
  if(typeof src==='string'){const resp=await fetch(src);if(!resp.ok)throw new Error('HTTP '+resp.status);dados=new Uint8Array(await resp.arrayBuffer());}
  const pdf=await lib.getDocument({data:dados,
    standardFontDataUrl:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/',
    cMapUrl:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',cMapPacked:true}).promise;
  el.innerHTML='';el.style.overflowY='auto';el.style.background='#e2e8f0';el.style.padding='10px';
  const larg=Math.max(280,el.clientWidth-20);
  for(let i=1;i<=pdf.numPages;i++){
    const pg=await pdf.getPage(i);const v0=pg.getViewport({scale:1});
    const esc_=larg/v0.width, dpr=window.devicePixelRatio||1;
    const vp=pg.getViewport({scale:esc_*dpr});
    const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
    cv.style.width=(vp.width/dpr)+'px';cv.style.height=(vp.height/dpr)+'px';
    cv.style.display='block';cv.style.margin='0 auto 10px';cv.style.background='#fff';cv.style.boxShadow='0 1px 4px rgba(0,0,0,.15)';
    el.appendChild(cv);
    await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
  }
}
// Leitor do próprio navegador só no computador que comprovadamente mostra PDF dentro da página.
// Celular/tablet (mesmo em "versão para computador") não mostra — lá o PDF é desenhado pelo pdf.js.
const _leitorNativo=()=>navigator.pdfViewerEnabled===true
  && !/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
  && !(navigator.maxTouchPoints>0 && matchMedia('(pointer: coarse)').matches);
async function mostrarPdf(el,src,nome){
  let bytes=null;
  try{
    if(typeof src==='string'){const r=await fetch(src);if(!r.ok)throw new Error('HTTP '+r.status);bytes=new Uint8Array(await r.arrayBuffer());}
    else bytes=src;
  }catch(e){ el.outerHTML=`<div class="alerta al-dang" style="margin:0;">Não foi possível baixar o PDF (${esc(e.message||e)}).</div>`; return; }
  if(_leitorNativo()){
    const u=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
    el.outerHTML=`<iframe class="vw-box" src="${u}#view=FitH" title="${esc(nome||'PDF')}" style="border:none;background:#525659;"></iframe>`;
    return;
  }
  try{ await renderPdfNo(el,bytes.slice(0)); }
  catch(e){ el.outerHTML=`<div class="alerta al-dang" style="margin:0;">Não foi possível mostrar o PDF aqui (${esc(e.message||e)}). Use o botão ⬇️ Baixar.</div>`; }
}

async function carregar(){
  const s=async(q,ctx)=>{const r=await db(q,ctx);return r.data||[];};
  const [docs,forms,travas,funcs,desig,ncs,auds,treins,fn]=await Promise.all([
    s(_supabase.from('bpf_documentos_mestre').select('*').order('ordem').order('codigo'),'documentos'),
    s(_supabase.from('bpf_formularios').select('*').eq('ativo',true).order('pop_cod').order('ordem'),'formulários'),
    s(_supabase.from('bpf_travas').select('*').order('sys_ref'),'travas'),
    s(_supabase.from('bpf_funcoes').select('*').eq('ativo',true).order('ordem'),'funções'),
    s(_supabase.from('bpf_designacoes').select('*').order('funcionario_nome'),'designações'),
    s(_supabase.from('bpf_ncs').select('*').order('data',{ascending:false}).limit(500),'NCs'),
    s(_supabase.from('bpf_auditorias').select('*').order('data',{ascending:false}).limit(300),'auditorias'),
    s(_supabase.from('bpf_treinamentos').select('*').order('data',{ascending:false}).limit(300),'treinamentos'),
    s(_supabase.from('funcionarios').select('id,nome,funcao').eq('status','ativo').order('nome'),'funcionários'),
  ]);
  _docs=docs;_forms=forms;_travas=travas;_funcs=funcs;_desig=desig;
  _ncs=ncs;_auds=auds;_treins=treins;_funcionarios=fn;
  _pops=docs.filter(d=>d.tipo==='pop');
  // histórico de versões (uma linha por versão substituída, com o arquivo dela)
  _revs=await s(_supabase.from('bpf_documento_revisoes').select('*').order('created_at',{ascending:false}),'histórico de versões');
  const dl=document.getElementById('lst-func');
  if(dl) dl.innerHTML=_funcionarios.map(f=>`<option value="${esc(f.nome)}">`).join('');

  // Recentes + TUDO em aberto: "estado atual" não pode ser filtrado por
  // recência, senão some registro antigo ainda pendente de assinatura.
  // TODOS os registros (paginado): com o levantamento desde a vigência são milhares, e qualquer
  // corte deixaria POP com fichas faltando no quadro e na contagem
  const todosRegs=await selectTodos(_supabase.from('bpf_registros').select('*').order('data',{ascending:false}),{max:50000}).then(r=>r.data||[]).catch(()=>[]);
  const m=new Map();todosRegs.forEach(r=>m.set(r.id,r));
  _regs=[...m.values()].sort((a,b)=>String(b.data).localeCompare(String(a.data)));

  // Camada de fila (002_bpf_fila.sql). Se as tabelas ainda não existem, o
  // módulo continua funcionando exatamente como antes — só sem fila.
  try{
    const [gt,tf]=await Promise.all([
      lst(_supabase.from('bpf_gatilhos').select('*').order('pop_cod').order('codigo')),
      selectTodos(_supabase.from('bpf_tarefas').select('*').order('prazo'),{max:50000}).then(r=>{if(r.error)throw r.error;return r.data||[];}),
    ]);
    _gatilhos=gt; _tarefas=tf; _temFila=true;
  }catch(e){ _gatilhos=[]; _tarefas=[]; _temFila=false; }

  const ks=Object.keys(ENTIDADES);
  const res=await Promise.all(ks.map(k=>{
    const e=ENTIDADES[k];
    let q=_supabase.from(e.tabela).select('*').limit(1000);
    if(e.ordem)q=q.order(e.ordem,{ascending:!e.desc_ordem});
    return s(q,e.titulo);
  }));
  ks.forEach((k,i)=>_ent[k]=res[i]);

  // guarda o conjunto completo e aplica o escopo do usuário
  _popsAll=_pops; _formsAll=_forms; _regsAll=_regs; _ncsAll=_ncs; _treinsAll=_treins;
  aplicarEscopo();
}

function alertas(){
  const a=[];
  (_ent.instrumentos||[]).forEach(i=>{
    if(i.status==='inativo')return;
    const u=(_ent.calibracoes||[]).filter(c=>c.instrumento_id===i.id)
      .sort((x,y)=>String(y.validade).localeCompare(String(x.validade)))[0];
    if(!u)a.push({t:'warn',pop:'POP-07',ent:'instrumentos',m:`Instrumento ${i.tag} ainda sem calibração registrada`});
    else{const d=diasAte(u.validade);
      if(d<0)a.push({t:'dang',pop:'POP-07',ent:'instrumentos',m:`Instrumento ${i.tag} com calibração VENCIDA em ${fmtD(u.validade)}`});
      else if(d<=60)a.push({t:'warn',pop:'POP-07',ent:'instrumentos',m:`Instrumento ${i.tag} vence a calibração em ${d} dia(s)`});}
  });
  (_ent.pesos_padrao||[]).forEach(p=>{const d=diasAte(p.validade);
    if(d!==null&&d<0&&p.status!=='inativo')a.push({t:'dang',pop:'POP-07',ent:'pesos_padrao',m:`Peso-padrão ${p.identificacao} com certificado vencido`});});
  (_ent.prestadores_qualif||[]).forEach(p=>{const d=diasAte(p.validade);
    if(d!==null&&d<0)a.push({t:'dang',pop:'POP-17',ent:'prestadores_qualif',m:`${p.nome} com acreditação vencida — envio suspenso`});});
  (_ent.fornecedores_qualif||[]).forEach(f=>{const d=diasAte(f.reavaliacao_em);
    if(d!==null&&d<0&&['A','B'].includes(f.categoria_risco))a.push({t:'warn',pop:'POP-01',ent:'fornecedores_qualif',m:`${f.nome} (risco ${f.categoria_risco}) com reavaliação vencida`});});
  // Reclamação de cliente chega sozinha pelo canal público, igual à do
  // colaborador. Se ninguém abrir a tela, o prazo de 15 dias corre à revelia.
  (_ent.reclamacoes||[]).forEach(r=>{
    if(r.status==='encerrada')return;
    const dPrazo=diasAte(r.prazo_ate), idade=-(diasAte(r.data_recebimento)||0);
    if(dPrazo!==null&&dPrazo<0)
      a.push({t:'dang',pop:'POP-19',ent:'reclamacoes',m:`Reclamação ${r.numero} (${r.cliente||'cliente'}) FORA DO PRAZO há ${-dPrazo} dia(s)`});
    else if(idade<=7)
      a.push({t:'dang',pop:'POP-19',ent:'reclamacoes',novo:true,
        m:`NOVA reclamação de cliente — ${r.numero} · ${r.cliente||'—'}${r.lote_ref?' · lote '+r.lote_ref:''}, ${idade===0?'hoje':'há '+idade+' dia(s)'}`});
    else if(dPrazo!==null&&dPrazo<=5)
      a.push({t:'warn',pop:'POP-19',ent:'reclamacoes',m:`Reclamação ${r.numero} vence em ${dPrazo} dia(s)`});});
  // O canal é público e chega sozinho — se ninguém olhar, a manifestação
  // morre sem tratamento, que é justamente o que a IN 04/2007 8.1 proíbe.
  (_ent.manifestacoes||[]).forEach(x=>{
    if(x.status!=='aberta')return;
    const d=-(diasAte(x.data)||0);
    const rot=x.anonimo?'anônima':'de '+(x.autor_nome||'colaborador');
    if(d<=7) a.push({t:'dang',pop:'POP-19',ent:'manifestacoes',novo:true,
      m:`NOVA manifestação ${rot} — ${x.numero} (${cap(x.tema)}), recebida ${d===0?'hoje':'há '+d+' dia(s)'}`});
    else if(d<=30) a.push({t:'warn',pop:'POP-19',ent:'manifestacoes',
      m:`Manifestação ${x.numero} sem tratamento há ${d} dias`});
    else a.push({t:'dang',pop:'POP-19',ent:'manifestacoes',
      m:`Manifestação ${x.numero} aberta há ${d} dias — muito além do razoável para tratativa`});});
  _regs.forEach(r=>{const d=diasAte(r.validade);
    if(d!==null&&d<0&&!r.cancelado_em)a.push({t:'dang',pop:r.pop_cod,m:`Registro ${r.numero} com validade vencida`});});
  _ncs.filter(n=>n.status!=='encerrado'&&n.prazo).forEach(n=>{
    if(diasAte(n.prazo)<0)a.push({t:'dang',pop:n.procedimento_cod,m:`NC de ${fmtD(n.data)} fora do prazo`});});
  // POP-20: o cronograma anual é o REG-POP20-02 (nasce sozinho em dezembro)
  // travas em modo "alerta" (o bloqueio acontece em outro módulo / na portaria)
  try{
    const d30=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
    if(travaAtiva('veiculo_reprovado'))_regs.filter(r=>r.formulario_cod==='REG-POP21-01'&&!r.cancelado_em&&String(r.data)>=d30&&/reprov/i.test(String((r.campos||{}).resultado||'')))
      .forEach(r=>a.push({t:'dang',pop:'POP-21',m:`Veículo ${(r.campos||{}).placa||''} REPROVADO na inspeção (${r.numero}) — não carregar até regularizar (SYS-034)`}));
    if(travaAtiva('lote_nao_liberado'))_regs.filter(r=>r.formulario_cod==='REG-POP15-01'&&!r.cancelado_em&&String(r.data)>=d30&&['Reprovado','Aguardando resultado'].includes((r.campos||{}).decisao))
      .forEach(r=>a.push({t:(r.campos||{}).decisao==='Reprovado'?'dang':'warn',pop:'POP-16',m:`Lote ${(r.campos||{}).lote||'—'} ${(r.campos||{}).decisao==='Reprovado'?'REPROVADO':'aguardando resultado'} — não usar nem expedir sem liberação (SYS-012)`}));
    if(travaAtiva('treinamento_vencido')){
      const pessoas={};_regs.filter(r=>r.formulario_cod==='REG-POP20-01'&&!r.cancelado_em&&regLancado(r)).forEach(r=>{
        String((r.campos||{}).participantes||'').split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean).forEach(n=>{const v=(r.campos||{}).validade;if(v&&(!pessoas[n]||v>pessoas[n]))pessoas[n]=v;});});
      const venc=Object.entries(pessoas).filter(([n,v])=>v<hoje());
      if(venc.length)a.push({t:'warn',pop:'POP-20',m:`${venc.length} pessoa(s) com treinamento de BPF vencido: ${venc.slice(0,5).map(x=>x[0]).join(', ')}${venc.length>5?'…':''} (SYS-016)`});
    }
  }catch(e){}
  return a;
}

function renderNav(){

    const o=_sitPop[r.pop_cod]||(_sitPop[r.pop_cod]={tot:0,pend:0,conc:0,c:{a_preencher:0,a_digitar:0,falta_foto:0,assinaturas:0,concluido:0}});
    const e=etapaReg(r);o.tot++;if(o.c[e]!==undefined)o.c[e]++;if(e==='concluido')o.conc++;else if(o.c[e]!==undefined)o.pend++; }
  for(const g of GRUPOS){
    const l=_pops.filter(p=>p.grupo===g.id);if(!l.length)continue;
    // situação dos registros de cada POP: pendentes (vermelho), tudo em dia (✓) e barra de concluídos
    const sit=cod=>_sitPop[cod]||{tot:0,pend:0,conc:0,c:{a_preencher:0,a_digitar:0,falta_foto:0,assinaturas:0,concluido:0}};

    h+=`<div class="nav-grp">${g.label}${pendGrp?`<span class="ng-p">${pendGrp}</span>`:''}</div>`;
    for(const p of l){
      const st=sit(p.codigo);const d=al.some(x=>x.pop===p.codigo&&x.t==='dang');
      const pct=st.tot?Math.round(st.conc/st.tot*100):0;
      const dica=st.tot?`${st.tot} registro(s) · ${st.conc} concluído(s) (${pct}%)\nA preencher ${st.c.a_preencher} · A digitar ${st.c.a_digitar} · Falta foto ${st.c.falta_foto} · Assinaturas ${st.c.assinaturas}`:'Sem registros ainda';
      h+=`<div class="nav-it" data-cod="${p.codigo}" data-busca="${esc((p.codigo+' '+p.titulo).toLowerCase())}" onclick="abrirPop('${p.codigo}')" title="${esc(p.titulo+'\n'+dica)}">
        <span class="cod">${esc(p.codigo.replace('POP-',''))}</span>
        <span class="tx"><span class="tx-t">${esc(p.titulo)}</span>${st.tot?`<span class="nv-bar"><i style="width:${pct}%"></i></span>`:''}</span>
        ${d?'<span class="al"></span>':''}${st.pend?`<span class="nv-p">${st.pend}</span>`:st.tot?'<span class="nv-ok">✓</span>':''}</div>`;}
  }
  h+=`<div class="nav-grp">Cadastros e controles</div>`;
  for(const [k,e] of Object.entries(ENTIDADES)){
    if(!entNoEscopo(e))continue;                   // cadastro de POP que não é meu
    const n=(_ent[k]||[]).length, d=al.some(x=>x.ent===k&&x.t==='dang');
    const novas=al.filter(x=>x.ent===k&&x.novo).length;
    h+=`<div class="nav-it" data-cod="ent:${k}" data-busca="${esc((e.titulo+' '+e.sys).toLowerCase())}" onclick="abrirEnt('${k}')">
      <span class="cod">${e.icone}</span><span class="tx" title="${esc(e.titulo)}">${esc(e.titulo)}</span>
      ${d?'<span class="al"></span>':''}${novas?`<span class="ct" style="background:var(--danger);color:#fff;border-radius:9px;padding:1px 6px;">${novas} novo(s)</span>`:n?`<span class="ct">${n}</span>`:''}</div>`;}
  document.getElementById('nav-list').innerHTML=h;
}
let _sitPop={};

// ── manter a tela ao atualizar (F5): o endereço guarda onde a pessoa está ──
function lembrarTela(obj){
  try{ const p=new URLSearchParams(); Object.entries(obj).forEach(([k,v])=>{if(v!==undefined&&v!==null&&v!=='')p.set(k,v);});
    history.replaceState(null,'',location.pathname+location.search.replace(/([?&])(reg|imprimirOP)=[^&]*/g,'$1').replace(/[?&]+$/,'')+'#'+p.toString()); }catch(e){}
}
// fechou o registro: tira ele do endereço (o F5 não reabre)
{ const _cmOrig=closeModal; closeModal=function(id){ _cmOrig(id);
    if(id==='m-reg'){ const h=new URLSearchParams(String(location.hash||'').replace(/^#/,'')); if(h.has('reg')){h.delete('reg');lembrarTela(Object.fromEntries(h));}
      if(_regs.some(r=>r._novo)){ _regs=_regs.filter(r=>!r._novo); } } }; }
function restaurarTela(){
  const h=new URLSearchParams(String(location.hash||'').replace(/^#/,''));
  if(!h.toString())return false;
  try{
    if(h.get('cfg')&&_pops.some(p=>p.codigo===h.get('cfg'))){abrirConfigPop(h.get('cfg'));return true;}
    if(h.get('pop')&&_pops.some(p=>p.codigo===h.get('pop'))){abrirPop(h.get('pop'),h.get('aba')||undefined);
      if(h.get('reg')&&_regs.some(r=>r.id===h.get('reg')))abrirReg(h.get('reg'));return true;}
    if(h.get('doc')&&_docs.some(d=>d.id===h.get('doc'))){abrirDoc(h.get('doc'));
      if(h.get('reg')&&_regs.some(r=>r.id===h.get('reg')))abrirReg(h.get('reg'));return true;}
    if(h.get('ent')&&ENTIDADES[h.get('ent')]){abrirEnt(h.get('ent'));return true;}
    if(h.get('sec')){ir(h.get('sec'));if(h.get('reg')&&_regs.some(r=>r.id===h.get('reg')))abrirReg(h.get('reg'));return true;}
  }catch(e){console.warn('[restaurar tela]',e);}
  return false;
}
function ir(sec){
  lembrarTela({sec});

    fila:renderFila,gatilhos:renderGatilhos,dossie:renderDossie}[sec]||renderPainel)();

}

// Consulta resiliente + escopo aplicado AQUI, na camada de busca.

function campoHtml(c,valor){
  const v=valor===undefined||valor===null?(c.default!==undefined?c.default:''):valor;
  const req=c.obrigatorio?'<span class="req">*</span>':'';
  const aj=c.ajuda?`<span class="aj">${esc(c.ajuda)}</span>`:'';
  const un=c.unidade?` <span style="color:#94a3b8;font-weight:600;">(${esc(c.unidade)})</span>`:'';
  const id='f_'+c.id;
  if(c.tipo==='secao')return `<div class="f-secao">${esc(c.label)}</div>${c.ajuda?`<div style="grid-column:1/-1;font-size:11px;color:#64748b;margin:-2px 0 5px;">${esc(c.ajuda)}</div>`:''}`;
  let inner='';
  switch(c.tipo){
    case 'sim_nao':
      inner=`<div class="sn-grp" id="${id}" data-v="${esc(v)}">
        <button type="button" class="sn-btn ${v==='sim'?'sel-sim':''}" onclick="setSN('${c.id}','sim')">Sim</button>
        <button type="button" class="sn-btn ${v==='nao'?'sel-nao':''}" onclick="setSN('${c.id}','nao')">Não</button>
        <button type="button" class="sn-btn ${v==='na'?'sel-sim':''}" onclick="setSN('${c.id}','na')" style="flex:.6;">N/A</button></div>`;break;
    case 'select':
      inner=`<select class="form-input" id="${id}" onchange="avaliarAoVivo()"><option value="">Selecione...</option>
        ${(c.opcoes||[]).map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;break;
    case 'multiselect':
      inner=`<div id="${id}" data-multi="1">${(c.opcoes||[]).map(o=>
        `<span class="chip ${Array.isArray(v)&&v.includes(o)?'on':''}" onclick="this.classList.toggle('on')" data-o="${esc(o)}">${esc(o)}</span>`).join('')}</div>`;break;
    case 'textarea': inner=`<textarea class="form-input" id="${id}" rows="2">${esc(v)}</textarea>`;break;
    case 'numero':
      inner=`<input type="number" step="any" class="form-input" id="${id}" value="${esc(v)}"
        ${c.min!==undefined?`data-min="${c.min}"`:''} ${c.max!==undefined?`data-max="${c.max}"`:''} oninput="checarLimite(this)">`;break;
    case 'data': inner=`<input type="date" class="form-input" id="${id}" value="${esc(String(v).split('T')[0])}">`;break;
    case 'hora': inner=`<input type="time" class="form-input" id="${id}" value="${esc(String(v).slice(0,5))}">`;break;
    case 'funcao':
      inner=`<select class="form-input" id="${id}"><option value="">Selecione...</option>
        ${_funcs.map(f=>`<option value="${esc(f.codigo)}" ${v===f.codigo?'selected':''}>${esc(f.nome)}</option>`).join('')}</select>`;break;
    case 'pop':
      inner=`<select class="form-input" id="${id}"><option value="">— todos —</option>
        ${_pops.map(p=>`<option value="${esc(p.codigo)}" ${v===p.codigo?'selected':''}>${esc(p.codigo)} — ${esc(p.titulo)}</option>`).join('')}</select>`;break;
    case 'ref':{
      const lst=_ent[c.ref]||[];
      inner=`<select class="form-input" id="${id}"><option value="">Selecione...</option>
        ${lst.map(o=>`<option value="${esc(o.id)}" ${v===o.id?'selected':''}>${esc(o[c.refLabel]||o.nome||o.id)}</option>`).join('')}</select>`;break;}
    case 'funcionario':
      inner=`<input type="text" class="form-input" id="${id}" value="${esc(v)}" list="lst-func" placeholder="Nome do colaborador">`;break;
    default: inner=`<input type="text" class="form-input" id="${id}" value="${esc(v)}">`;
  }
  const lim=(c.min!==undefined||c.max!==undefined)
    ?`<span class="aj">Tolerância: ${c.min!==undefined?'mín '+c.min:''}${c.min!==undefined&&c.max!==undefined?' · ':''}${c.max!==undefined?'máx '+c.max:''}</span>`:'';
  return `<div class="fld" id="w_${c.id}"><label>${esc(c.label)}${un}${req}</label>${inner}${lim}${aj}</div>`;
}
function setSN(id,val){
  const el=document.getElementById('f_'+id);if(!el)return;
  el.dataset.v=el.dataset.v===val?'':val;
  const v=el.dataset.v,b=el.querySelectorAll('.sn-btn');
  b[0].className='sn-btn'+(v==='sim'?' sel-sim':'');
  b[1].className='sn-btn'+(v==='nao'?' sel-nao':'');
  b[2].className='sn-btn'+(v==='na'?' sel-sim':'');
  avaliarAoVivo();
}
function checarLimite(inp){
  const w=inp.closest('.fld');if(!w)return;
  const v=parseFloat(inp.value);
  const mn=inp.dataset.min!==undefined?parseFloat(inp.dataset.min):null;
  const mx=inp.dataset.max!==undefined?parseFloat(inp.dataset.max):null;
  w.classList.toggle('desvio',!isNaN(v)&&((mn!==null&&v<mn)||(mx!==null&&v>mx)));
  avaliarAoVivo();
}
function lerForm(campos){
  const out={};
  for(const c of campos){
    if(c.tipo==='secao')continue;
    const el=document.getElementById('f_'+c.id);if(!el)continue;
    if(c.tipo==='sim_nao')out[c.id]=el.dataset.v||'';
    else if(c.tipo==='multiselect')out[c.id]=[...el.querySelectorAll('.chip.on')].map(x=>x.dataset.o);
    else out[c.id]=el.value;
  }
  return out;
}
function avaliar(campos,vals){
  const d=[];
  for(const c of campos){
    if(c.tipo==='secao')continue;
    const v=vals[c.id];
    if(c.conforme!==undefined&&v!==''&&v!=null&&v!=='na'&&v!==c.conforme)
      d.push({campo:c.label,esperado:c.conforme,obtido:v});
    if(c.tipo==='numero'&&v!==''&&v!=null){
      const n=parseFloat(v);
      if(!isNaN(n)){
        if(c.min!==undefined&&n<c.min)d.push({campo:c.label,esperado:'≥ '+c.min,obtido:n});
        if(c.max!==undefined&&n>c.max)d.push({campo:c.label,esperado:'≤ '+c.max,obtido:n});
      }}}
  { const e=parseFloat(String(vals.erro??'').replace(',','.')), m=parseFloat(String(vals.emp??'').replace(',','.'));
    if(!isNaN(e)&&!isNaN(m)&&Math.abs(e)>Math.abs(m)) d.push({campo:'Erro encontrado',esperado:'≤ EMA '+m,obtido:e}); }
  return d;
}
function faltando(campos,vals){
  return campos.filter(c=>c.tipo!=='secao'&&c.obrigatorio&&
    (vals[c.id]===''||vals[c.id]==null||(Array.isArray(vals[c.id])&&!vals[c.id].length))).map(c=>c.label);
}
function avaliarAoVivo(){
  const box=document.getElementById('box-desvio');if(!box||!_formAtual)return;
  const d=avaliar(_formAtual.campos||[],lerForm(_formAtual.campos||[]));
  box.innerHTML=d.length?`<div class="alerta al-dang" style="margin:0;"><strong>${d.length} desvio(s):</strong>
    ${d.map(x=>esc(x.campo)).join(' · ')}<div style="margin-top:4px;font-size:11px;">Será salvo como <strong>NÃO CONFORME</strong>.</div></div>`:'';
}

// Fontes de pré-preenchimento: escolher a origem no ERP preenche todo campo
// do formulário cujo id coincida com uma coluna do registro de origem.
// Formata valor do ERP para leitura humana: array de objetos vira sub-tabela,
// em vez do JSON cru que aparecia antes (produtos_op, paradas_op).
// Abre a linha inteira do ERP — inclusive as colunas que não couberam na tabela.
function validadeSugerida(f){
  if(!f.validade_meses)return '';
  const d=new Date();d.setMonth(d.getMonth()+f.validade_meses);
  return d.toISOString().split('T')[0];
}
function renderAnexosTmp(){
  const el=document.getElementById('anx-lst');if(!el)return;
  el.innerHTML=_anexosTmp.length?_anexosTmp.map((a,i)=>
    `<div class="anx"><span>${a.origem==='cliente'?'📷':'📎'}</span><span class="nm">${esc(a.nome)}</span>
     ${a.origem==='cliente'?'<span class="badge badge-warning">enviada pelo cliente</span>':''}
     <span style="color:#94a3b8;font-size:11px;">${(a.tamanho/1024).toFixed(0)} KB</span>
     <button class="btn btn-ghost btn-sm" onclick="uiVisualizar('${esc(a.path)}','${esc(a.nome)}','${esc(a.bucket||'')}')">👁️ ver</button>
     <span style="cursor:pointer;color:var(--danger);font-weight:800;" onclick="removerAnexoTmp(${i})">✕</span></div>`).join('')
    :'<span style="font-size:11.5px;color:#94a3b8;">Nenhum anexo.</span>';
}
function removerAnexoTmp(i){_anexosTmp.splice(i,1);renderAnexosTmp();}
async function subirAnexos(inp){
  for(const file of inp.files){
    if(file.size>15*1024*1024){await uiAlerta(`<strong>${esc(file.name)}</strong> tem mais de 15 MB e não foi anexado.`,{titulo:'Arquivo grande demais',tipo:'warn'});continue;}
    const path=`bpf/${Date.now()}_${file.name.replace(/[^\w.\-]/g,'_')}`;
    try{
      const {error}=await _supabase.storage.from('documentos').upload(path,file);
      if(error)throw error;
      _anexosTmp.push({nome:file.name,path,tipo:file.type||'',tamanho:file.size});
      toast(`${file.name} anexado.`,'success');
    }catch(e){ await uiAlerta(`Não foi possível anexar <strong>${esc(file.name)}</strong>.<br><span style="font-size:11px;">${esc(e.message||e)}</span>`,{titulo:'Falha no anexo',tipo:'dang'}); }
  }
  inp.value='';renderAnexosTmp();
}

// FLUXO DO REGISTRO — papel → ERP (10/2026)
// gerado → ficha impressa → preenchido no papel → digitado no ERP → foto da
// ficha → assinaturas (papel + sistema) → concluído. A etapa é DERIVADA dos
// campos do registro (lancado_em, foto_ficha, assinaturas), não digitada.
// ═══════════════════════════════════════════════════════════════════════════
const ETAPAS_REG=[
  {k:'a_preencher',t:'🖨️ A preencher',cor:'#94a3b8',dica:'gerado · imprimir a ficha'},
  {k:'a_digitar',t:'⌨️ A digitar',cor:'#2563eb',dica:'ficha no papel · lançar no ERP'},
  {k:'falta_foto',t:'📷 Falta foto',cor:'#f59e0b',dica:'anexar a foto da ficha'},
  {k:'assinaturas',t:'✍️ Assinaturas',cor:'#7c3aed',dica:'faltam assinaturas no sistema'},
  {k:'concluido',t:'✅ Concluídos',cor:'#16a34a',dica:''},
];
// formulário preenchido direto no sistema (ex.: aprovação de rótulo pelo RT): não tem papel nem foto
function formSemPapel(cod){ return !!(_forms.find(x=>x.codigo===cod)||{}).sem_papel; }
// formulário que conclui só com a folha preenchida anexada (sem assinatura no sistema)
function concluiComAnexo(cod){ return !!(_forms.find(x=>x.codigo===cod)||{}).conclui_com_anexo; }
function faltamAssin(r){
  const f=_forms.find(x=>x.codigo===r.formulario_cod);
  return (f?.assinaturas||[]).filter(a=>!(r.assinaturas||[]).some(x=>x.id===a.id));
}
function regLancado(r){ return !!r.lancado_em||['aguardando_assinatura','nao_conforme','concluido'].includes(r.status); }
function etapaReg(r){
  if(r.cancelado_em||r.status==='cancelado')return 'cancelado';
  if(r.status==='concluido')return 'concluido';
  if(!regLancado(r))return (r.ficha_impressa_em||r.status==='rascunho'||r.status==='a_digitar')?'a_digitar':'a_preencher';
  if(!r.foto_ficha&&!formSemPapel(r.formulario_cod))return 'falta_foto';
  if(concluiComAnexo(r.formulario_cod))return 'concluido';
  return faltamAssin(r).length?'assinaturas':'concluido';
}
function abrirReg(id){
  const r=_regs.find(x=>x.id===id);if(!r)return;
  const e=etapaReg(r);
  if(e==='concluido'||e==='cancelado')verRegistro(id);else abrirRegistroFluxo(id);
}
function resumoReg(r){
  const c=r.campos||{};
  const curto=s=>String(s||'').replace(/^Saco de Papel /i,'Saco ').replace(/\s*\(ALM-\d+\)$/,'');
  const qtd=c.quantidade!=null&&c.quantidade!==''?Number(c.quantidade).toLocaleString('pt-BR'):'';
  const pedacos=[
    c.embalagem&&((qtd?qtd+' · ':'')+curto(c.embalagem)),
    c.fornecedor, c.nota_fiscal&&('NF '+c.nota_fiscal),
    c.op&&('OP '+c.op), (c.lote_producao||(c.lote&&!/^EMB-/.test(c.lote)?c.lote:'')), c.produto, c.nome, c.linha].filter(Boolean);
  return pedacos.slice(0,3).join(' · ');
}
// lista completa de uma coluna (A preencher, A digitar…) em janela
function verColunaRegs(pop,etapa,form,soForm){
  const e=ETAPAS_REG.find(x=>x.k===etapa);
  const l=_regs.filter(r=>r.pop_cod===pop&&(!soForm||r.formulario_cod===form)&&etapaReg(r)===etapa)
    .sort((a,b)=>String(a.numero||'').localeCompare(String(b.numero||''),'pt',{numeric:true}));
  _dlg(`<div class="dlg" style="max-width:860px;width:96vw;"><div class="dlg-hd"><span class="dlg-ic">📋</span>
    <div class="dlg-tt">${esc(pop)} · ${e?e.t:etapa} — ${l.length} registro(s)</div></div>
    <div class="dlg-bd" style="max-height:66vh;overflow:auto;">${l.length?`<table class="tbl"><thead><tr><th>Nº</th><th>Data</th><th>Registro</th><th>Resumo</th><th></th></tr></thead><tbody>
      ${l.map(r=>{const f=_forms.find(x=>x.codigo===r.formulario_cod);return `<tr style="cursor:pointer;" onclick="_fecharDlg();abrirReg('${r.id}')">
        <td class="num">${esc(String(r.numero||'').split('-').pop())}</td><td>${fmtD(r.data)}${r.hora?' '+String(r.hora).slice(0,5):''}</td>
        <td style="font-size:12px;">${esc(f?f.titulo:r.formulario_cod)}</td><td style="font-size:12.5px;">${esc(resumoReg(r))}</td>
        <td><button class="btn btn-secondary btn-sm">Abrir</button></td></tr>`;}).join('')}</tbody></table>`:'<div class="bx-mu">Nenhum registro.</div>'}</div>
    <div class="dlg-ft"><button class="btn btn-ghost" onclick="_fecharDlg()">Fechar</button></div></div>`);
}
function quadroRegsHtml(lista,titulo){
  const ativos=lista.filter(r=>etapaReg(r)!=='cancelado');
  const col=e=>ativos.filter(r=>etapaReg(r)===e.k).sort((a,b)=>String(a.numero||'').localeCompare(String(b.numero||''),'pt',{numeric:true}));
  return `<div class="${titulo===''?'':'bx-card'}">${titulo===''?'':`<div class="bx-ttl">${titulo||'📋 Andamento dos registros'} <span class="bx-mu">${ativos.length} registro(s)</span></div>`}
    <div class="rx-cols">${ETAPAS_REG.map(e=>{const l=col(e);const mostra=e.k==='concluido'?l.slice(0,5):l.slice(0,400);
      return `<div class="rx-col"><h4 class="rx-col-h" title="Ver todos" onclick="verColunaRegs('${esc((lista[0]||{}).pop_cod||'')}','${e.k}','${esc((lista[0]||{}).formulario_cod||'')}',${lista.every(r=>r.formulario_cod===(lista[0]||{}).formulario_cod)?1:0})">${e.t}<span>${l.length} ›</span></h4>
        ${e.k==='a_preencher'&&l.length>1?`<div class="rx-mais" style="margin:-2px 0 8px;" onclick="imprimirFichasPendentes('${esc(l[0].pop_cod)}')">🖨️ imprimir todas</div>`:''}
        ${mostra.map(r=>{const fa=faltamAssin(r).map(a=>a.label);
          return `<div class="rx-it" style="border-left-color:${e.cor}" onclick="abrirReg('${r.id}')">
          <b>${esc(r.numero||r.formulario_cod)}</b>${esc(resumoReg(r)||fmtD(r.data))}
          <small>${e.k==='assinaturas'?'falta: '+esc(fa.join(', ')):e.k==='concluido'?fmtD(r.concluido_em||r.data)+(r.conforme===false?' · NÃO CONFORME':''):esc(e.dica)}</small></div>`;}).join('')
        ||'<div class="rx-vazio">—</div>'}
        ${e.k==='concluido'&&l.length>5?`<div class="rx-mais" onclick="verRegistrosDo('${esc(lista[0]?.formulario_cod||'')}')">ver todos</div>`:''}</div>`;}).join('')}
    </div></div>`;
}


// ═══════════════════════════════════════════════════════════════════════════
// TRAVAS — o que cada uma FAZ (antes 17 das 20 estavam ligadas no banco, mas
// nenhum código as verificava). 'bloqueia' = não deixa salvar/assinar/concluir
// o registro aqui no BPF; 'alerta' = aparece no Início; 'pendente' = aguarda
// definição (ex.: POP-17) ou integração com outro módulo.
// ═══════════════════════════════════════════════════════════════════════════
function travaAtiva(c){ return !!(_travas.find(t=>t.codigo===c)||{}).ativa; }
function travaCfg(c){ return (_travas.find(t=>t.codigo===c)||{}).config||{}; }
// homologação vigente do fornecedor pelos registros REG-POP01-02 → {ate, numero} ou null
function homologacaoFornecedor(nome,cnpj){
  const n=_normP(nome),c=String(cnpj||'').replace(/\D/g,'');
  const l=_regsAll.concat(_regs).filter((r,i,a)=>a.indexOf(r)===i).filter(r=>r.formulario_cod==='REG-POP01-02'&&!r.cancelado_em&&regLancado(r)&&(r.campos||{}).status==='Homologado'&&(()=>{
    const rc=r.campos||{},rn=_normP(rc.nome);
    return (c.length>=11&&String(rc.cnpj||'').replace(/\D/g,'')===c)||(rn.length>=4&&n&&(rn.includes(n)||n.includes(rn)));})());
  if(!l.length)return null;
  const best=l.map(r=>({ate:(r.campos||{}).reavaliacao||null,numero:r.numero})).sort((a,b)=>String(b.ate||'9999').localeCompare(String(a.ate||'9999')))[0];
  return best;
}
function capacitadoAte(nome){
  if(!nome)return null;const n=_normP(nome);let melhor=null;
  _regs.filter(r=>r.formulario_cod==='REG-POP20-01'&&!r.cancelado_em&&regLancado(r)).forEach(r=>{
    const lista=String((r.campos||{}).participantes||'').split(/[\n,;]+/).map(_normP).filter(Boolean);
    if(lista.includes(n)){const v=(r.campos||{}).validade||null;if(v&&(!melhor||v>melhor))melhor=v;}
  });
  (_ent.treinamentos||[]).forEach(t=>{const quem=_normP(t.participante||t.funcionario_nome||'');const v=t.validade||null;
    if(quem===n&&v&&(!melhor||v>melhor))melhor=v;});
  return melhor;
}

    &&'Análise química da frente vencida: o lote de MP não pode ser "Liberado" (SYS-040).'},
  visitante_sem_integracao:{modo:'bloqueia',onde:'REG-POP04-02 + portaria.html (chegada do motorista)',chk:(r,v)=>r.formulario_cod==='REG-POP04-02'&&v.video_assistido==='nao'

// devolve as mensagens das travas ligadas que barram este registro
function travasDoRegistro(r,vals,f,fim){
  const out=[];
  for(const [cod,d] of Object.entries(TRAVAS_DEF)){
    if(!d.chk||!travaAtiva(cod))continue;
    if(d.fim&&!fim)continue;
    try{const m=d.chk(r,vals||r.campos||{},f);
      if(m){ if(travaCfg(cod).modo==='avisar'){ toast('⚠️ '+m,'warning'); avisarBpf(cod,m,r.pop_cod); } else out.push(m); }
    }catch(e){}
  }
  return out;
}
// aviso para quem está marcado no POP (sino do ERP = notificações)
async function avisarBpf(cod,msg,pop){
  try{ const dest=[...new Set(pessoasDoPop(pop,'aviso').concat(pessoasDoPop(pop,'responsavel')).map(d=>d.funcionario_nome).filter(Boolean))];
    await _supabase.from('notificacoes').insert({tipo:'urgente',modulo:'bpf',titulo:'BPF '+(pop||'')+': '+((_travas.find(t=>t.codigo===cod)||{}).nome||cod),
    descricao:msg,chave:'bpf_'+cod+'_'+Date.now(),fonte:'bpf',destinatarios:dest}); }catch(e){}
}
function pessoasDoPop(pop,papel){ return _desig.filter(d=>d.ativo&&d.pop_cod===pop&&(!papel||(d.papeis||[]).includes(papel))); }
async function avisarTravas(msgs){
  await uiAlerta(`<strong>Bloqueado por trava do BPF:</strong><ul style="margin:7px 0 0 16px;">${msgs.map(m=>`<li>${esc(m)}</li>`).join('')}</ul>
    <div style="margin-top:8px;font-size:11.5px;color:#64748b;">As travas ficam em ⋯ Mais → 🔒 Travas.</div>`,{titulo:'Trava',tipo:'dang'});
}

// ── gerar o registro (substitui o "+ Novo": a ficha nasce pendente) ───────
async function gerarRegistro(formCod,{pre,tarefa,origemMod,origemId,abrir=true}={}){
  if(!guardAction('bpf','edit'))return null;
  const f=_forms.find(x=>x.codigo===formCod);
  if(!f){toast('Formulário não encontrado','danger');return null;}
  const docF=_docs.find(d=>d.codigo===f.codigo), docP=_docs.find(d=>d.codigo===f.pop_cod);
  if(travaAtiva('documento_obsoleto')&&(docF?.status==='obsoleto'||docP?.status==='obsoleto')){
    await avisarTravas([`${docF?.status==='obsoleto'?f.codigo:f.pop_cod} está OBSOLETO: não gera ficha nova (SYS-019).`]);return null;}
  const u=getUser();
  if(f.codigo==='REG-POP04-02'){ const vd=docVideo(); if(vd){pre={...(pre||{}),video_versao:'rev. '+(vd.revisao||'—')};} }
  const row={formulario_cod:f.codigo,pop_cod:f.pop_cod,data:hoje(),hora:new Date().toTimeString().slice(0,5),
    campos:pre||{},status:'a_preencher',conforme:true,anexos:[],assinaturas:[],assinaturas_papel:{},
    origem_modulo:origemMod||null,origem_id:origemId||null,tarefa_id:tarefa?.id||null,
    criado_por:u?.nome||u?.email||'sistema'};
  const r=await db(_supabase.from('bpf_registros').insert(row).select().single(),'gerar registro');
  if(r.error)return null;
  await trilha(r.data.id,r.data.numero,'gerado',null,null,null,tarefa?('Gerado pela tarefa '+(tarefa.origem_det||tarefa.origem_ref||'')):'Ficha gerada');
  _regs.unshift(r.data);
  toast(`Ficha ${r.data.numero} gerada.`,'success');
  if(abrir)abrirRegistroFluxo(r.data.id);
  return r.data;
}
// ＋ Gerar ficha (manual): abre em branco SEM gravar. Só vira registro (com nº)
// quando a pessoa salva (rascunho/digitação) ou imprime. Fechou sem salvar → descarta.
function novaFichaManual(formCod){
  if(!guardAction('bpf','edit'))return;
  const f=_forms.find(x=>x.codigo===formCod);if(!f){toast('Formulário não encontrado','danger');return;}
  const u=getUser();
  const r={id:'novo-'+Date.now(),_novo:true,numero:'nova ficha (o nº sai ao salvar)',formulario_cod:f.codigo,pop_cod:f.pop_cod,
    data:hoje(),hora:new Date().toTimeString().slice(0,5),campos:{},status:'a_preencher',conforme:true,anexos:[],assinaturas:[],
    assinaturas_papel:{},origem_modulo:null,origem_id:null,tarefa_id:null,criado_por:u?.nome||u?.email||'—'};
  _regs.unshift(r);
  abrirRegistroFluxo(r.id);
}
// grava de verdade a ficha manual (primeiro salvar / imprimir) e troca o id temporário
async function persistirNovo(r){
  if(!r||!r._novo)return true;
  const row={formulario_cod:r.formulario_cod,pop_cod:r.pop_cod,data:r.data,hora:r.hora||null,campos:r.campos||{},status:'a_preencher',
    conforme:true,anexos:[],assinaturas:[],assinaturas_papel:{},criado_por:r.criado_por};
  const res=await db(_supabase.from('bpf_registros').insert(row).select().single(),'criar ficha');
  if(res.error||!res.data)return false;
  const idTemp=r.id;
  Object.keys(r).forEach(k=>delete r[k]); Object.assign(r,res.data);
  await trilha(r.id,r.numero,'gerado',null,null,null,'Ficha manual');
  { const h=new URLSearchParams(String(location.hash||'').replace(/^#/,'')); if(h.get('reg')===idTemp){h.set('reg',r.id);lembrarTela(Object.fromEntries(h));} }
  return true;
}
// compatibilidade: quem chamava novoRegistro (telas antigas) cai no fluxo novo
async function novoRegistro(formCod){ return gerarRegistro(formCod); }

// ── imprimir a ficha do registro (pré-preenchida com o que o ERP já sabe) ─
async function imprimirFichaReg(id){
  let r=_regs.find(x=>x.id===id);if(!r)return;
  if(r._novo){ if(!(await persistirNovo(r)))return; id=r.id; }
  const f=_forms.find(x=>x.codigo===r.formulario_cod);if(!f)return;
  document.getElementById('print-area').innerHTML=htmlFicha(f,_pops.find(p=>p.codigo===f.pop_cod),r);
  window.print();
  if(!r.ficha_impressa_em){
    const agora=new Date().toISOString();
    const st=r.status==='a_preencher'?'a_digitar':r.status;
    const res=await db(_supabase.from('bpf_registros').update({ficha_impressa_em:agora,status:st}).eq('id',id),'marcar ficha impressa');
    if(!res.error){r.ficha_impressa_em=agora;r.status=st;await trilha(id,r.numero,'ficha impressa',null,null,null,'Ficha impressa para preenchimento no papel');}
    if(!document.getElementById('m-reg').classList.contains('hidden'))abrirRegistroFluxo(id);else voltar();
  }
}

// Imprime de uma vez todas as fichas "A preencher" (ex.: as que a OP acabou de gerar)
async function imprimirFichasPendentes(popCod,opId){
  const l=_regs.filter(r=>etapaReg(r)==='a_preencher'&&(!popCod||r.pop_cod===popCod)&&(!opId||String(r.origem_id||'')===String(opId)));
  if(!l.length){toast('Nenhuma ficha a imprimir.','info');return;}
  const ok=await uiConfirma(`Imprimir <strong>${l.length} ficha(s)</strong>${popCod?' do '+esc(popCod):''}? Cada uma sai numa página, com o número do registro e os dados da OP.`,{titulo:'Imprimir fichas',ok:'Imprimir'});
  if(!ok)return;
  document.getElementById('print-area').innerHTML=l.map(r=>{
    const f=_forms.find(x=>x.codigo===r.formulario_cod);if(!f)return '';
    return htmlFicha(f,_pops.find(p=>p.codigo===f.pop_cod),r);
  }).join('');
  window.print();
  const agora=new Date().toISOString();
  const ids=l.map(r=>r.id);
  const res=await db(_supabase.from('bpf_registros').update({ficha_impressa_em:agora,status:'a_digitar'}).in('id',ids),'marcar fichas impressas');
  if(!res.error){l.forEach(r=>{r.ficha_impressa_em=agora;r.status='a_digitar';});toast(`${l.length} ficha(s) marcadas como impressas.`,'success');voltar();}
}

// calc: "outroCampo*fator" — o campo fica só leitura e é recalculado ao digitar
function aplicarCalc(){
  for(const c of (_formAtual?.campos||[])){
    if(!c.calc)continue;
    const m=String(c.calc).match(/^(\w+)\s*\*\s*([\d.]+)$/);if(!m)continue;
    const src=document.getElementById('f_'+m[1]),dst=document.getElementById('f_'+c.id);if(!dst)continue;
    dst.readOnly=true;dst.style.background='#f1f5f9';
    const v=parseFloat(String(src?.value||'').replace(',','.'));
    dst.value=isNaN(v)?'':String(+(v*parseFloat(m[2])).toFixed(3));
  }
}
document.addEventListener('input',e=>{ if(e.target.closest&&e.target.closest('#campos-box'))aplicarCalc(); });
// POP-13 — limite de MP por produto: o lote de MP digitado é buscado no
// Laboratório; preenche o produto/variação da MP, se ela foi aprovada (cor/ΔE)
// e se é compatível com TODOS os produtos da OP (ex.: MP Branco em OP de Cinza = não).
async function conferirMpPop13(r,silencioso){
  const num=(document.getElementById('f_lote_mp')?.value||'').trim();if(!num)return;
  const set=(id,v)=>{const el=document.getElementById('f_'+id);if(!el)return;
    if(el.querySelector&&el.querySelector('.sn-btn')){el.dataset.v='';if(v)setSN(id,v);}else el.value=v??'';};
  try{
    const {data:mps}=await _supabase.from('caulim_lotes_mp').select('numero,cor_aprovada,especificacao').ilike('numero',num).limit(1);
    const mp=(mps||[])[0];
    if(!mp){ if(!silencioso)toast(`Lote de MP ${num} não encontrado no Laboratório — preencha os campos da MP à mão.`,'warning'); return; }
    const esp=mp.especificacao||{};const varr=esp.variacao||esp.produto||'';
    set('mp_produto',[esp.produto,esp.variacao].filter(Boolean).join(' · '));
    set('mp_aprovada',mp.cor_aprovada===true?'sim':mp.cor_aprovada===false?'nao':'');
    let prods=[];
    if(r.origem_id){const {data:op}=await _supabase.from('producao').select('produtos_op,produto').eq('id',r.origem_id).maybeSingle();
      prods=op?itensDaOP(op).map(i=>i.produto).filter(Boolean):[];if(!prods.length&&op?.produto)prods=[op.produto];}
    if(prods.length&&varr){const alvo=_normP(varr);set('mp_compativel',prods.every(p=>_normP(p).includes(alvo))?'sim':'nao');}
    avaliarAoVivo();
    if(!silencioso)toast('Lote de MP conferido no Laboratório.','success');
  }catch(e){ if(!silencioso)toast('Não foi possível consultar o Laboratório: '+(e.message||e),'warning'); }
}
// ── combo de escolha: lista própria (não a do navegador), fica presa ao campo,
// mostra se o valor é DA LISTA (✓) ou só texto digitado (⚠) ─────────────────
function comboCampo(inp,opcoes,aoEscolher){
  if(!inp||inp.dataset.cb)return; inp.dataset.cb='1'; inp.setAttribute('autocomplete','off');
  const w=document.createElement('div');w.className='cb-w';inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
  const st=document.createElement('span');st.className='cb-st';w.appendChild(st);
  let lista=null,at=-1;
  const n=x=>_normP(x);
  const marca=()=>{const ok=opcoes.some(o=>n(o.v)===n(inp.value));inp.dataset.ok=ok?'1':'';
    st.className='cb-st '+(inp.value?(ok?'ok':'no'):'');st.textContent=inp.value?(ok?'✓ da lista':'⚠ escolha da lista'):'';};
  const fecha=()=>{if(lista){lista.remove();lista=null;}at=-1;};
  const escolhe=o=>{inp.value=o.v;marca();fecha();aoEscolher&&aoEscolher(o);inp.dispatchEvent(new Event('input',{bubbles:true}));};
  const abre=()=>{fecha();const q=n(inp.value);
    const l=opcoes.filter(o=>!q||n(o.v+' '+(o.sub||'')).includes(q)).slice(0,60);
    lista=document.createElement('div');lista.className='cb-l';
    lista.innerHTML=l.length?l.map((o,i)=>`<div class="cb-o" data-i="${i}">${esc(o.v)}${o.sub?`<small>${esc(o.sub)}</small>`:''}</div>`).join(''):'<div class="cb-v">Nada encontrado com esse texto.</div>';
    lista.addEventListener('mousedown',e=>{const d=e.target.closest('.cb-o');if(d){e.preventDefault();escolhe(l[+d.dataset.i]);}});
    w.appendChild(lista);lista._l=l;};
  inp.addEventListener('focus',abre);
  inp.addEventListener('input',()=>{marca();abre();});
  inp.addEventListener('blur',()=>setTimeout(fecha,120));
  inp.addEventListener('keydown',e=>{if(!lista)return;const os=lista.querySelectorAll('.cb-o');
    if(e.key==='ArrowDown'){at=Math.min(os.length-1,at+1);e.preventDefault();}
    else if(e.key==='ArrowUp'){at=Math.max(0,at-1);e.preventDefault();}
    else if(e.key==='Enter'&&at>=0){e.preventDefault();escolhe(lista._l[at]);return;}
    else if(e.key==='Escape'){fecha();return;}
    os.forEach((o,i)=>o.classList.toggle('at',i===at));if(os[at])os[at].scrollIntoView({block:'nearest'});});
  // a janela rolou: a lista fecha (não fica "voando" sobre o formulário)
  document.getElementById('m-reg-body')?.addEventListener('scroll',fecha,{passive:true});
  marca();
}

async function assinar(regId,assId){
  if(!guardAction('bpf','edit'))return;
  const r=_regs.find(x=>x.id===regId);if(!r)return;
  const f=_forms.find(x=>x.codigo===r.formulario_cod);
  const a=(f?.assinaturas||[]).find(x=>x.id===assId);if(!a)return;
  const u=getUser();
  if(!u){await uiAlerta('Sessão não identificada. Faça login novamente.',{titulo:'Sem usuário',tipo:'dang'});return;}
  { const tv=travasDoRegistro(r,r.campos||{},f,true); if(tv.length){await avisarTravas(tv);return;} }
  if(!regLancado(r)||(!r.foto_ficha&&!formSemPapel(r.formulario_cod))){
    await uiAlerta('A assinatura no sistema libera depois que a ficha foi <strong>digitada</strong> e a <strong>foto da ficha</strong> anexada.',{titulo:'Ainda não',tipo:'warn'});return;}
  const tv=_travas.find(t=>t.codigo==='sem_designacao');
  if(tv?.ativa&&a.funcao){
    const ok=_desig.some(d=>d.ativo&&d.funcao_cod===a.funcao&&(!d.pop_cod||d.pop_cod===r.pop_cod)&&
      d.funcionario_nome===u.nome&&(!d.data_fim||d.data_fim>=hoje()));
    if(!ok){
      await uiAlerta(`Você não tem designação vigente para a função <strong>${esc(nomeFuncao(a.funcao))}</strong> no ${esc(r.pop_cod)}.
        <div style="margin-top:7px;font-size:11.5px;color:#64748b;">Cadastre a designação em <strong>👤 Designações de função</strong>.</div>
        <div style="margin-top:5px;" class="sys">SYS-036</div>`,{titulo:'Sem designação',tipo:'dang'});return;}
  }
  const ok=await uiConfirma(
    `Assinar como <strong>${esc(a.label)}</strong>?
     <div style="margin-top:9px;padding:9px 11px;background:#f8fafc;border-radius:8px;font-size:11.5px;">
       ${esc(u.nome||u.email)}<br>${esc(nomeFuncao(a.funcao))}<br>${new Date().toLocaleString('pt-BR')}</div>
     <div style="margin-top:9px;font-size:11.5px;color:#64748b;">A assinatura fica na trilha de auditoria e não pode ser removida.</div>`,
    {titulo:'Assinatura eletrônica',ok:'Assinar'});
  if(!ok)return;
  const novas=[...(r.assinaturas||[]).filter(x=>x.id!==assId),
    {id:assId,label:a.label,funcao:a.funcao,nome:u.nome||u.email,perfil:u.perfil||null,em:new Date().toISOString()}];
  // conclui quando a cadeia inteira (executante → encarregado → qualidade…) assinou no sistema
  const cadeia=(f?.assinaturas||[]).map(x=>x.id);
  const todas=cadeia.every(id=>novas.some(x=>x.id===id));
  const patch={assinaturas:novas,atualizado_em:new Date().toISOString()};
  if(todas&&(r.foto_ficha||formSemPapel(r.formulario_cod))&&regLancado(r)){patch.status='concluido';patch.concluido_em=new Date().toISOString();}
  const res=await db(_supabase.from('bpf_registros').update(patch).eq('id',regId),'assinar');
  if(res.error)return;
  Object.assign(r,patch);
  await trilha(regId,r.numero,'assinado',a.label,null,u.nome||u.email,'Assinatura eletrônica');
  if(patch.status==='concluido')await trilha(regId,r.numero,'concluido',null,null,null,'Todas as assinaturas obrigatórias coletadas');
  toast(patch.status==='concluido'?`Assinado. ${r.numero} concluído.`:'Assinado.','success');
  const estavaNoFluxo=!document.getElementById('m-reg').classList.contains('hidden');
  await carregar();closeModal('m-ver');renderNav();
  if(estavaNoFluxo&&patch.status!=='concluido')abrirRegistroFluxo(regId);else{closeModal('m-reg');voltar();}
}
async function cancelarRegistro(regId){
  if(!guardAction('bpf','delete'))return;
  const r=_regs.find(x=>x.id===regId);if(!r)return;
  const motivo=await uiTexto(
    `O registro <strong>${esc(r.numero)}</strong> não será apagado — ele fica preservado por 4 anos (SYS-003)
     e o cancelamento entra na trilha de auditoria.`,
    {titulo:'Cancelar registro',rotulo:'Motivo do cancelamento',ok:'Cancelar registro'});
  if(motivo===null)return;
  const u=getUser();
  const res=await db(_supabase.from('bpf_registros').update({status:'cancelado',
    cancelado_em:new Date().toISOString(),cancelado_por:u?.nome||u?.email||'sistema',
    cancelado_motivo:motivo}).eq('id',regId),'cancelar registro');
  if(res.error)return;

}

// ASSINATURAS — tela própria
// Antes a assinatura só aparecia depois de abrir o registro, e ninguém achava.
// Aqui cada pendência vira uma linha com o botão na mão, separada pelo que
// cabe a VOCÊ assinar (pela designação) e o que espera outra função.
// ═══════════════════════════════════════════════════════════════════════════
function pendenciasAssinatura(){
  const out=[];
  for(const r of _regs){
    if(r.cancelado_em||r.status==='concluido'||etapaReg(r)!=='assinaturas')continue;
    const f=_forms.find(x=>x.codigo===r.formulario_cod);
    for(const a of (f?.assinaturas||[])){
      if((r.assinaturas||[]).some(x=>x.id===a.id))continue;
      out.push({reg:r,form:f,ass:a});
    }
  }
  return out.sort((x,y)=>String(x.reg.data).localeCompare(String(y.reg.data)));
}
function podeAssinar(pend){
  const u=getUser();if(!u)return false;
  const tv=_travas.find(t=>t.codigo==='sem_designacao');
  if(!tv?.ativa)return true;                       // trava desligada: qualquer um
  if(!pend.ass.funcao)return true;
  return _desig.some(d=>d.ativo&&d.funcao_cod===pend.ass.funcao&&
    (!d.pop_cod||d.pop_cod===pend.reg.pop_cod)&&d.funcionario_nome===u.nome&&
    (!d.data_fim||d.data_fim>=hoje()));
}

             :(meusPops()?' A trava <span class="sys">SYS-036</span> está desligada, então qualquer usuário pode assinar.'
                         :' A trava <span class="sys">SYS-036</span> está desligada, então qualquer usuário pode assinar. Ligue-a em 🔒 Travas quando as designações estiverem cadastradas.')}</div>`;

  if(!todas.length){
    h+=`<div class="empty"><div class="ic">✅</div><h3>Nada pendente</h3>
      <p>Todos os registros submetidos já têm as assinaturas obrigatórias.</p></div>`;

  }
  const tabela=(lista,podeAss)=>`<div class="tbl-wrap"><table class="tbl"><thead><tr>
    <th>Registro</th><th>Data</th><th>Formulário</th><th>POP</th><th>Assinatura</th><th>Função exigida</th><th style="width:190px;">Ação</th>
    </tr></thead><tbody>${lista.map(p=>`<tr>
      <td class="num">${esc(p.reg.numero)}</td><td>${fmtD(p.reg.data)}</td>
      <td>${esc(p.form?.titulo||p.reg.formulario_cod)}</td>
      <td><span class="badge badge-gray">${esc(p.reg.pop_cod)}</span></td>
      <td><strong>${esc(p.ass.label)}</strong>${p.ass.obrigatoria?' <span class="req">*</span>':''}</td>
      <td style="color:#64748b;">${esc(nomeFuncao(p.ass.funcao))}</td>

// EXCLUSÕES
// A regra não é a mesma para tudo, e isso é de propósito:
//  · Cadastro (instrumento, fornecedor…) — apaga. É cadastro, não evidência.
//    Onde existe campo de status, prefiro INATIVAR: preserva o histórico de
//    quem já apontou para ele.
//  · Registro do SGQ — NÃO apaga (SYS-003, retenção de 4 anos). Só cancelamento
//    com motivo. A única exceção é o rascunho nunca submetido, que ainda não
//    é registro; o próprio banco recusa o resto.
// ═══════════════════════════════════════════════════════════════════════════
async function excluirEnt(k,id){
  if(!guardAction('bpf','delete'))return;
  const e=ENTIDADES[k],row=(_ent[k]||[]).find(x=>x.id===id);if(!row)return;
  const rot=row[e.colunas[0].id]||row.nome||row.numero||id;
  const temStatus=e.campos.some(c=>c.id==='status'||c.id==='ativo');

  // Uso em outros pontos do módulo — avisa antes de quebrar a referência.
  const usos=[];
  if(k==='instrumentos'){const n=(_ent.calibracoes||[]).filter(c=>c.instrumento_id===id).length;
    if(n)usos.push(`${n} calibração(ões) apontam para ele`);}
  if(k==='pesos_padrao'){const n=(_ent.calibracoes||[]).filter(c=>c.peso_padrao_id===id).length;
    if(n)usos.push(`${n} calibração(ões) usaram este peso-padrão`);}

  const ok=await uiConfirma(
    `Excluir <strong>${esc(String(rot))}</strong> de ${esc(e.titulo)}?
     ${usos.length?`<div class="alerta al-warn" style="margin:9px 0 0;">${usos.join(' · ')}. Excluir deixa esse histórico sem referência.</div>`:''}
     ${temStatus?`<div style="margin-top:9px;font-size:11.5px;color:#64748b;">Se a ideia é só tirar de circulação,
        <strong>inativar</strong> é melhor: o cadastro some das listas de escolha mas o histórico continua íntegro.</div>`:''}`,
    {titulo:'Excluir cadastro',tipo:'warn',ok:temStatus?'Excluir mesmo assim':'Excluir',perigo:true});
  if(!ok)return;
  const r=await db(_supabase.from(e.tabela).delete().eq('id',id),'excluir '+e.titulo);
  if(r.error)return;
  await addLog('DELETE','BPF',String(rot),'Excluído de '+e.titulo);
  toast('Excluído.','success');
  await carregar();renderNav();abrirEnt(k);
}

async function excluirRascunho(id){
  if(!guardAction('bpf','delete'))return;
  const r=_regs.find(x=>x.id===id);if(!r)return;
  if(!['rascunho','a_preencher','a_digitar'].includes(r.status)||r.lancado_em||(r.assinaturas||[]).length){

  }

     <div style="margin-top:9px;font-size:11.5px;color:#64748b;">Rascunho nunca submetido ainda não é registro do SGQ —
     é digitação em andamento. Some de vez, sem trilha.</div>`,

function badgeStatus(s){

     ${k==='reclamacoes'?`<button class="btn btn-secondary btn-sm" onclick="renderCanal('cliente')">📣 Canal do cliente</button> `:''}

      ${l.map(row=>`<tr>${e.colunas.map(c=>`<td>${celulaEnt(k,row,c)}</td>`).join('')}
        ${e.anexo?`<td>${(row.anexos||[]).length?`<span class="badge badge-gray">📎 ${(row.anexos||[]).length}</span>`:'—'}</td>`:''}
        <td style="white-space:nowrap;"><button class="btn btn-ghost btn-sm" onclick="editarEnt('${k}','${row.id}')">✏️ editar</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="excluirEnt('${k}','${row.id}')">🗑️</button></td></tr>`).join('')}
    </tbody></table></div>`;
  document.getElementById('conteudo').innerHTML=h;
}
function celulaEnt(k,row,c){
  if(c.id==='_calib'){
    const u=(_ent.calibracoes||[]).filter(x=>x.instrumento_id===row.id)
      .sort((a,b)=>String(b.validade).localeCompare(String(a.validade)))[0];
    if(!u)return '<span class="badge badge-warning">sem calibração</span>';
    const d=diasAte(u.validade);
    return `<span class="badge badge-${d<0?'danger':d<=60?'warning':'success'}">${d<0?'vencida '+fmtD(u.validade):fmtD(u.validade)}</span>`;
  }
  if(c.id==='_instr'){const i=(_ent.instrumentos||[]).find(x=>x.id===row.instrumento_id);return esc(i?.tag||'—');}
  if(c.id==='_funcao')return esc(nomeFuncao(row.funcao_cod));
  if(c.id==='_autor')return row.anonimo?'<em style="color:#94a3b8;">anônimo</em>':esc(row.autor_nome||'—');
  let v=row[c.id];
  if(c.bool)return v===true||v==='sim'?'<span class="badge badge-success">sim</span>':'<span class="badge badge-gray">não</span>';
  if(c.data){
    if(!v)return '—';
    if(c.venc){const d=diasAte(v);return `<span class="badge badge-${d<0?'danger':d<=60?'warning':'success'}">${fmtD(v)}</span>`;}
    return fmtD(v);
  }
  if(c.badge){
    const bom=['ativo','aprovado','homologado','qualificado','liberado','vigente','realizado','encerrada','executado'];
    const ruim=['bloqueado','reprovado','suspenso','vencido','retornado_bloqueado','atrasado'];
    const cl=bom.includes(v)?'success':ruim.includes(v)?'danger':'warning';
    return `<span class="badge badge-${cl}">${esc(cap(v))}</span>`;
  }
  return esc(v??'—');
}
function novaEnt(k){if(!guardAction('bpf','edit'))return;_entEditId=null;_anexosTmp=[];abrirModalEnt(k,{});}
function editarEnt(k,id){
  if(!guardAction('bpf','edit'))return;
  const row=(_ent[k]||[]).find(x=>x.id===id);if(!row)return;
  _entEditId=id;_anexosTmp=(row.anexos||[]).slice();abrirModalEnt(k,row);
}
function abrirModalEnt(k,row){
  const e=ENTIDADES[k];_formAtual={campos:e.campos};
  const vals={...row};
  e.campos.forEach(c=>{

      const n=(_ent[k]||[]).filter(x=>String(x.numero||'').startsWith(c.auto+'-'+ano)).length+1;
      vals[c.id]=`${c.auto}-${ano}-${String(n).padStart(4,'0')}`;
    }

  });

  document.getElementById('m-ent-body').innerHTML=

     <div class="form-row">${e.campos.map(c=>campoHtml(c,vals[c.id])).join('')}</div>
     ${e.anexo?`<div class="sec-card" style="margin-top:6px;"><h3>Anexos</h3>
       <div id="anx-lst" style="margin:8px 0;"></div>
       <input type="file" id="anx-in" multiple style="font-size:12px;" onchange="subirAnexos(this)"></div>`:''}

}
async function salvarEnt(k){
  if(!guardAction('bpf','edit'))return;
  const e=ENTIDADES[k],vals=lerForm(e.campos);
  const falt=faltando(e.campos,vals);
  if(falt.length){
    await uiAlerta(`Faltam campos obrigatórios:<ul style="margin:7px 0 0 16px;">${falt.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`,
      {titulo:'Cadastro incompleto',tipo:'warn'});return;}

  // Travas de cadastro
  if(k==='calibracoes'&&vals.peso_padrao_id){
    const p=(_ent.pesos_padrao||[]).find(x=>x.id===vals.peso_padrao_id);
    const tv=_travas.find(t=>t.codigo==='peso_padrao_vencido');
    if(tv?.ativa&&p&&diasAte(p.validade)<0){
      await uiAlerta(`O peso-padrão <strong>${esc(p.identificacao)}</strong> está com certificado vencido em ${fmtD(p.validade)}.
        <div style="margin-top:7px;font-size:11.5px;color:#64748b;">Não é possível registrar verificação de balança com peso-padrão vencido.</div>
        <div style="margin-top:5px;" class="sys">SYS-039</div>`,{titulo:'Peso-padrão vencido',tipo:'dang'});return;}
  }
  const desvios=avaliar(e.campos,vals);
  if(desvios.length){
    const ok=await uiConfirma(`Este cadastro tem <strong>${desvios.length} ponto(s) fora do esperado</strong>:
      <ul style="margin:7px 0 0 16px;">${desvios.map(d=>`<li>${esc(d.campo)} — esperado <strong>${esc(d.esperado)}</strong>, obtido <strong>${esc(d.obtido)}</strong></li>`).join('')}</ul>
      <div style="margin-top:9px;font-size:11.5px;color:#64748b;">Pode ser exatamente o que você quer registrar (ex.: fornecedor suspenso). Só confirme que é intencional.</div>`,
      {titulo:'Confirmar cadastro',tipo:'warn',ok:'Salvar assim mesmo'});
    if(!ok)return;
  }
  const payload={};
  e.campos.forEach(c=>{
    let v=vals[c.id];
    if(v==='')v=null;
    if(c.tipo==='sim_nao')v=v==='sim'?true:v==='nao'?false:null;
    if(c.tipo==='numero'&&v!=null)v=parseFloat(v);
    payload[c.id]=v;});
  if(e.anexo)payload.anexos=_anexosTmp;
  const r=_entEditId
    ? await db(_supabase.from(e.tabela).update(payload).eq('id',_entEditId),'salvar '+e.titulo)
    : await db(_supabase.from(e.tabela).insert(payload),'salvar '+e.titulo);
  if(r.error)return;
  await addLog(_entEditId?'UPDATE':'CREATE','BPF',String(payload[e.colunas[0].id]||'—'),e.titulo);
  if(k==='calibracoes'&&payload.resultado==='reprovado'&&payload.instrumento_id){
    await db(_supabase.from('bpf_instrumentos').update({status:'bloqueado'}).eq('id',payload.instrumento_id),'bloquear instrumento');
    await uiAlerta('A calibração foi reprovada, então o instrumento foi marcado como <strong>bloqueado</strong> automaticamente.',
      {titulo:'Instrumento bloqueado',tipo:'warn'});
  }
  closeModal('m-ent');toast('Salvo.','success');_anexosTmp=[];
  await carregar();renderNav();abrirEnt(k);
}
