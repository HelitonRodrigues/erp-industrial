async function buscarDossie(){
  _dq.q=(document.getElementById('dq-q')?.value||'').trim();
  _dq.de=document.getElementById('dq-de')?.value||'';
  _dq.ate=document.getElementById('dq-ate')?.value||'';
  _dqLote=null;
  await pintarDossie();
}
async function verLoteDossie(lote){ _dqLote=lote; await pintarDossie(); }
async function pintarDossie(){
  const out=document.getElementById('dq-out');if(!out)return;
  out.innerHTML=`<div class="spin" style="margin:26px auto;"></div>`;
  try{
    out.innerHTML = _dqLote ? await htmlDossieLote(_dqLote) : await htmlDossieBusca();
  }catch(e){
    out.innerHTML=`<div class="alerta al-warn">Não foi possível montar o dossiê: ${esc(e.message||e)}</div>`;
  }
}
async function htmlDossieBusca(){
  const q=_dq.q.toLowerCase();
  if(!q) return `<div class="empty"><div class="ic">🔍</div><h3>Digite algo para buscar</h3>
    <p>Ou abra um lote pela tela de Registros.</p></div>`;
  const bate=(...v)=>v.some(x=>String(x??'').toLowerCase().includes(q));
  const dentro=d=>(!_dq.de||String(d||'')>=_dq.de)&&(!_dq.ate||String(d||'')<=_dq.ate);
  const hits=[];
  // registros do próprio BPF
  _regs.filter(r=>bate(r.numero)||Object.values(r.campos||{}).some(v=>bate(v)))
    .filter(r=>dentro(r.data)).slice(0,25).forEach(r=>{
      const f=_forms.find(x=>x.codigo===r.formulario_cod);
      hits.push({t:'Registro',lb:r.numero,sub:(f?.titulo||r.formulario_cod)+' · '+fmtD(r.data),
        btn:`<button class="btn btn-secondary btn-sm" onclick="verRegistro('${r.id}')">abrir ficha</button>`});});
  const tenta=async(tab,sel,map)=>{ try{
      const l=await lst(_supabase.from(tab).select(sel).limit(400));
      l.forEach(r=>{const m=map(r); if(m&&bate(...m.busca)&&dentro(m.data)) hits.push(m.hit);});
    }catch(e){/* tabela ainda sem uso — silencioso aqui, aparece no painel do POP */} };
  await Promise.all([
    tenta('carregamentos','*',r=>({busca:[r.ordem_numero,r.placa,r.motorista,r.transportadora],data:r.data,
      hit:{t:'Carregamento',lb:`Ordem ${r.ordem_numero||r.id} · ${r.placa||''}`,
        sub:`${fmtD(r.data)} · ${r.motorista||''} · ${r.total_pallets||0} pallets`,btn:''}})),
    tenta('producao_pallets','*',r=>({busca:[r.codigo,r.cliente_dest,r.produto,r.romaneio_numero,r.ordem_numero],data:r.data,
      hit:{t:'Pallet / unidade',lb:r.codigo||r.id,
        sub:`${r.produto||''} · ${fmtD(r.data)} · ${r.estoque_status||r.status||''}${r.cliente_dest?' · '+r.cliente_dest:''}`,
        btn:`<button class="btn btn-ghost btn-sm" onclick="verLoteDossie('${esc(r.codigo||'')}')">ver dossiê</button>`}})),
    tenta('caulim_lotes_producao','*',r=>({busca:[r.numero],data:(r.data_abertura||'').slice(0,10),
      hit:{t:'Lote de produção',lb:r.numero||r.id,sub:`${r.status||''} · aberto ${fmtD(r.data_abertura)}`,
        btn:`<button class="btn btn-secondary btn-sm" onclick="verLoteDossie('${esc(r.numero||'')}')">ver dossiê</button>`}})),
    tenta('caulim_lotes_mp','*',r=>({busca:[r.numero,r.analista_mp],data:r.data,
      hit:{t:'Lote de MP',lb:r.numero||r.id,sub:`${r.montante_t||'?'} t · ΔE ${r.delta_e??'—'} · ${fmtD(r.data)}`,btn:''}})),
    tenta('caulim_unidades','*',r=>({busca:[r.qr_codigo],data:(r.criado_em||'').slice(0,10),
      hit:{t:'Unidade / QR',lb:r.qr_codigo||r.id,sub:`${r.tipo||''} · ${r.status||''}`,btn:''}})),
    tenta('almoxarifado_movimentos','*',r=>({busca:[r.nota_fiscal,r.lote,r.fornecedor_destino,r.numero_doc],data:r.data,
      hit:{t:'Movimento de almoxarifado',lb:`NF ${r.nota_fiscal||'—'}`,
        sub:`${fmtD(r.data)} · ${r.tipo||''} · ${r.quantidade||''} · ${r.fornecedor_destino||''}`,btn:''}})),
  ]);
  if(!hits.length) return `<div class="empty"><div class="ic">🔎</div><h3>Nada encontrado</h3>
    <p>Nenhum registro, lote, unidade, carregamento ou nota fiscal bate com “${esc(_dq.q)}”.</p></div>`;
  return `<div class="sec-card" style="margin-top:12px;"><h3>${hits.length} resultado(s)</h3></div>`+
    hits.map(h=>`<div class="tk"><div class="tk-ic">${h.t==='Registro'?'📄':h.t.includes('QR')||h.t.includes('Pallet')?'🏷️':
      h.t.includes('Carreg')?'🚛':h.t.includes('almox')?'📦':'🧱'}</div>
      <div class="tk-bd"><div class="tk-msg" style="font-size:13px;">${esc(h.lb)}</div>
        <div class="tk-mt"><span class="badge badge-gray">${esc(h.t)}</span><span>${esc(h.sub)}</span></div></div>
      <div class="tk-ac">${h.btn}</div></div>`).join('');
}
async function htmlDossieLote(lote){
  const regsDo=t=>_regs.filter(r=>!r.cancelado_em&&Object.values(r.campos||{}).some(v=>String(v||'')===lote)&&
    (!t||r.formulario_cod===t));
  const btn=r=>r?`<button class="btn btn-secondary btn-sm" onclick="verRegistro('${r.id}')">📄 ${esc(r.numero)}</button>`
    :'<span class="badge badge-danger">sem registro</span>';
  const um=t=>regsDo(t)[0];
  let lp=null,lmp=null,uni=[],car=[],pal=[];
  try{ lp=(await lst(_supabase.from('caulim_lotes_producao').select('*').eq('numero',lote).limit(1)))[0]; }catch(e){}
  try{ if(lp?.lote_mp_id) lmp=(await lst(_supabase.from('caulim_lotes_mp').select('*').eq('id',lp.lote_mp_id).limit(1)))[0]; }catch(e){}
  try{ if(lp) uni=await lst(_supabase.from('caulim_unidades').select('*').eq('lote_producao_id',lp.id).limit(500)); }catch(e){}
  try{ pal=await lst(_supabase.from('producao_pallets').select('*').or(`codigo.eq.${lote},romaneio_numero.eq.${lote}`).limit(300)); }catch(e){}
  try{ car=await lst(_supabase.from('carregamentos').select('*').order('data',{ascending:false}).limit(200)); }catch(e){}
  const qa=(n,perg,resp,acao)=>`<div class="qa"><div class="qa-q"><span class="qa-n">${n}</span>${perg}
    <span style="flex:1;"></span>${acao||''}</div><div class="qa-a">${resp}</div></div>`;
  const rEmb=um('REG-POP01-01'), rMP=um('REG-POP02-01'), rLab=um('REG-POP15-01'), rCert=um('REG-POP15-02');
  const limpezas=_regs.filter(r=>r.formulario_cod==='REG-POP03-01'&&!r.cancelado_em).slice(0,6);
  const nomeAss=r=>(r?.assinaturas||[]).map(a=>`${esc(a.nome)} (${esc(a.label)})`).join(' · ')||'—';
  let h=`<div class="sec-card" style="margin-top:12px;">
    <h3>Dossiê do lote ${esc(lote)}</h3>
    <div class="sub">${lp?`${esc(lp.status||'')} · aberto ${fmtD(lp.data_abertura)}${lp.data_fechamento?' · fechado '+fmtD(lp.data_fechamento):''}`
      :'Lote não encontrado em caulim_lotes_producao — mostrando o que existe nos registros do BPF.'}</div>
    <div style="margin-top:8px;"><button class="btn btn-ghost btn-sm" onclick="_dqLote=null;pintarDossie()">← voltar à busca</button></div></div>`;
  h+=qa(1,'A embalagem usada neste lote — quando chegou e em que condição?',
    rEmb?`<div class="dl-g"><b>Fornecedor</b><span>${esc(rEmb.campos.fornecedor||'—')}</span>
      <b>Nota fiscal</b><span>${esc(rEmb.campos.nota_fiscal||'—')}</span>
      <b>Lote do fabricante</b><span>${esc(rEmb.campos.lote||'—')}</span>
      <b>Recebida em</b><span>${fmtD(rEmb.data)} ${esc(rEmb.hora||'')}</span>
      <b>Homologado?</b><span>${esc(rEmb.campos.fornecedor_homologado||'—')}</span>
      <b>Íntegra?</b><span>${esc(rEmb.campos.integridade||'—')}</span>
      <b>Assinaturas</b><span>${nomeAss(rEmb)}</span></div>`
    :'<div class="alerta al-warn">Nenhum REG-POP01-01 vinculado a este lote ainda.</div>', btn(rEmb));
  h+=qa(2,'Qual matéria-prima foi usada nesta produção?',
    (lmp||rMP)?`<div class="dl-g">
      <b>Lote de MP</b><span>${esc(lmp?.numero||rMP?.campos.lote_mp||'—')}</span>
      <b>Frente</b><span>${esc(rMP?.campos.mina_frente||lmp?.frente_id||'—')}</span>
      <b>Montante</b><span>${esc(lmp?.montante_t||rMP?.campos.montante_t||'—')} t</span>
      <b>ΔE</b><span>${esc(lmp?.delta_e??rMP?.campos.delta_e??'—')} (limite 1,0)</span>
      <b>Decisão</b><span>${esc(rMP?.campos.decisao||lmp?.cor_aprovada||'—')}</span>
      <b>Liberado por</b><span>${nomeAss(rMP)}</span></div>
      <div class="aj" style="margin-top:6px;">A cor reprova a MP e não é reensaiada na produção — o lote herda cor e variação do lote de MP.</div>`
    :'<div class="alerta al-warn">Sem lote de MP vinculado.</div>', btn(rMP));
  const carDoLote=car.filter(c=>String(JSON.stringify(c.itens||'')).includes(lote)||pal.some(p=>p.ordem_numero===c.ordem_numero));
  h+=qa(3,'Quais clientes carregaram esta produção?',
    carDoLote.length||pal.some(p=>p.cliente_dest)
    ?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ordem</th><th>Data</th><th>Motorista</th><th>Placa</th><th>Pallets</th><th>Inspeção do veículo</th></tr></thead><tbody>
      ${(carDoLote.length?carDoLote:[]).map(c=>{
        const rv=_regs.find(r=>r.formulario_cod==='REG-POP21-01'&&String(r.campos?.ordem||'')===String(c.ordem_numero||''));
        return `<tr><td class="num">${esc(c.ordem_numero||c.id)}</td><td>${fmtD(c.data)}</td>
          <td>${esc(c.motorista||'')}</td><td>${esc(c.placa||'')}</td><td>${c.total_pallets||0}</td>
          <td>${rv?`<button class="btn btn-ghost btn-sm" onclick="verRegistro('${rv.id}')">📄 ${esc(rv.numero)}</button>`
            :'<span class="badge badge-warning">sem inspeção</span>'}</td></tr>`;}).join('')}
      ${pal.filter(p=>p.cliente_dest).slice(0,20).map(p=>`<tr><td class="num">${esc(p.romaneio_numero||'—')}</td>
        <td>${fmtD(p.carregado_em||p.data)}</td><td colspan="2">${esc(p.cliente_dest)}</td><td>1</td>
        <td><span class="badge badge-gray">pallet ${esc(p.codigo||'')}</span></td></tr>`).join('')}
      </tbody></table></div>`
    :'<div class="alerta al-info">Nenhum carregamento registrado para este lote.</div>');
  h+=qa(4,'O que está em estoque agora?',
    pal.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Unidade</th><th>Produto</th><th>Situação</th><th>Local</th></tr></thead><tbody>
      ${pal.slice(0,30).map(p=>`<tr><td class="num">${esc(p.codigo||p.id)}</td><td>${esc(p.produto||'')}</td>
        <td>${esc(p.estoque_status||p.status||'')}${p.motivo_bloqueio?' — '+esc(p.motivo_bloqueio):''}</td>
        <td>${esc(p.barracao||'—')}</td></tr>`).join('')}</tbody></table></div>`
    :(uni.length?`<div class="dl-g"><b>Unidades com QR</b><span>${uni.length}</span>
        <b>Liberadas</b><span>${uni.filter(u=>u.status==='liberada').length}</span>
        <b>Aguardando</b><span>${uni.filter(u=>u.status!=='liberada').length}</span></div>`
      :'<div class="alerta al-info">Sem unidades registradas para este lote.</div>'));
  h+=qa(5,'Quais ensaios liberaram este lote?',
    rLab?`<div class="dl-g">${['pen20','pen50','pen100','pen200','umidade','mm','peso_especifico','decisao']
      .filter(k=>rLab.campos[k]!==undefined&&rLab.campos[k]!=='')
      .map(k=>`<b>${esc(k)}</b><span>${esc(rLab.campos[k])}</span>`).join('')}
      <b>Assinaturas</b><span>${nomeAss(rLab)}</span></div>
      ${rCert?`<div class="aj" style="margin-top:6px;">Certificado ${esc(rCert.campos.numero_cert||'')} —
        validade ${fmtD(rCert.campos.validade)} (fabricação + 36 meses).</div>`:''}`
    :'<div class="alerta al-warn">Sem boletim de análise (REG-POP15-01) para este lote.</div>', btn(rLab));
  h+=qa(6,'A limpeza — como foi feita, quando, por quem, e quem verificou?',
    limpezas.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr>
      <th>Data</th><th>Horário</th><th>Áreas</th><th>Destino</th><th>Assinaturas</th><th></th></tr></thead><tbody>
      ${limpezas.map(r=>`<tr><td>${fmtD(r.data)}</td>
        <td>${esc(r.campos.hora_ini||'')} – ${esc(r.campos.hora_fim||'')}</td>
        <td>${esc([].concat(r.campos.areas||[]).join(', '))}</td>
        <td>${esc(r.campos.destino_varredura||'')}</td>
        <td style="font-size:11px;">${nomeAss(r)}</td>
        <td><button class="btn btn-ghost btn-sm" onclick="verRegistro('${r.id}')">📄</button></td></tr>`).join('')}
      </tbody></table></div>
      <div class="aj" style="margin-top:6px;">As colunas que faltavam: quem verificou, quem aprovou e quando.</div>`
    :'<div class="alerta al-warn">Nenhum registro de limpeza (REG-POP03-01) no período.</div>');
  const todos=regsDo();
  h+=qa(7,'Todos os registros ligados a este lote',
    todos.length?tabelaRegs(todos):'<div class="alerta al-info">Nenhum registro cita este lote.</div>');
  return h;
}

init();
</script>
