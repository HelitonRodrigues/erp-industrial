<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP Industrial — BPF / SGQ</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<style>
.pg-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap;gap:12px;}
.pg-hdr h1{font-size:20px;font-weight:800;color:var(--primary);line-height:1.2;}
.pg-hdr p{font-size:12px;color:#64748b;margin-top:4px;line-height:1.5;}
.pg-acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex-shrink:0;}

.lay{display:grid;grid-template-columns:286px 1fr;min-height:calc(100vh - var(--topbar-h) - 92px);border-radius:14px;border:1.5px solid #e2e8f0;background:#fff;overflow:hidden;}
.nav{background:#f8fafc;border-right:1.5px solid #e2e8f0;display:flex;flex-direction:column;}
.nav-top{padding:13px 12px 10px;border-bottom:1.5px solid #e2e8f0;background:#fff;}
.nav-list{flex:1;overflow-y:auto;padding:6px 8px 20px;}
.nav-grp{font-size:9.5px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:.6px;padding:13px 8px 5px;}
.nav-it{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12px;color:#374151;font-weight:600;border-left:3px solid transparent;}
.nav-it:hover{background:#eef2f7;}
.nav-it.on{background:#fff;border-left-color:var(--accent);color:var(--primary);font-weight:800;box-shadow:0 1px 4px rgba(4,45,77,.08);}
.nav-it .cod{font-size:10px;font-weight:800;color:var(--primary);background:#e8eef4;border-radius:5px;padding:2px 5px;flex-shrink:0;min-width:24px;text-align:center;}
.nav-it .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav-it .ct{font-size:10px;color:#94a3b8;font-weight:700;}
.nav-it .al{width:7px;height:7px;border-radius:50%;background:var(--danger);flex-shrink:0;}

.body{display:flex;flex-direction:column;min-width:0;}
.body-hdr{padding:15px 20px;border-bottom:1.5px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.body-crumb{font-size:10px;color:#94a3b8;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.body-title{font-size:17px;font-weight:800;color:var(--primary);}
.body-main{padding:20px;overflow-y:auto;flex:1;}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin-bottom:18px;}
.kpi{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:13px 15px;border-left:4px solid var(--primary);}
.kpi .v{font-size:23px;font-weight:800;color:var(--primary);line-height:1.1;}
.kpi .l{font-size:10.5px;color:#64748b;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-top:4px;}
.kpi.warn{border-left-color:var(--warning);} .kpi.warn .v{color:#b45309;}
.kpi.dang{border-left-color:var(--danger);} .kpi.dang .v{color:var(--danger);}
.kpi.ok{border-left-color:var(--success);} .kpi.ok .v{color:#16a34a;}
.kpi.clk{cursor:pointer;} .kpi.clk:hover{box-shadow:0 2px 10px rgba(4,45,77,.12);}

.tbl-wrap{border:1.5px solid #e2e8f0;border-radius:12px;overflow:auto;background:#fff;}
.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th{background:var(--primary);color:var(--accent);font-size:11px;font-weight:800;text-align:left;padding:9px 12px;white-space:nowrap;text-transform:uppercase;letter-spacing:.3px;}
.tbl td{padding:9px 12px;border-bottom:1px solid #eef2f7;vertical-align:middle;}
.tbl tbody tr:hover{background:#f8fafc;}
.tbl .num{font-family:ui-monospace,monospace;font-size:11px;font-weight:700;color:var(--primary);}

.sec-card{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:15px 17px;margin-bottom:13px;}
.sec-card h3{font-size:13px;font-weight:800;color:var(--primary);margin-bottom:4px;}
.sec-card .sub{font-size:11.5px;color:#64748b;line-height:1.6;}

.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px;margin-bottom:13px;}
.fld label{font-size:11.5px;font-weight:700;color:#374151;display:block;margin-bottom:4px;}
.fld .aj{font-size:10.5px;color:#94a3b8;margin-top:3px;line-height:1.5;display:block;}
.fld .req{color:var(--danger);}
.f-secao{grid-column:1/-1;font-size:11px;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:.5px;padding:9px 0 2px;border-bottom:1.5px solid #e2e8f0;margin-bottom:3px;}
.sn-grp{display:flex;gap:6px;}
.sn-btn{flex:1;padding:8px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;color:#64748b;}
.sn-btn.sel-sim{background:#dcfce7;border-color:#16a34a;color:#16a34a;}
.sn-btn.sel-nao{background:#fee2e2;border-color:var(--danger);color:var(--danger);}
.fld.desvio input,.fld.desvio select{border-color:var(--danger)!important;background:#fff5f6;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:11.5px;font-weight:600;cursor:pointer;margin:0 5px 5px 0;}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff;}

.alerta{border-radius:10px;padding:10px 14px;font-size:12px;line-height:1.6;margin-bottom:11px;border-left:4px solid;}
.al-warn{background:#fffbeb;border-color:var(--warning);color:#92400e;}
.al-dang{background:#fef2f2;border-color:var(--danger);color:#991b1b;}
.al-info{background:#eff6ff;border-color:var(--info);color:#1e40af;}
.al-ok{background:#f0fdf4;border-color:var(--success);color:#15803d;}

.trava{display:flex;align-items:center;gap:12px;padding:10px 13px;border:1.5px solid #e2e8f0;border-radius:10px;margin-bottom:7px;background:#fff;}
.trava .sw{width:42px;height:23px;border-radius:20px;background:#cbd5e1;position:relative;cursor:pointer;flex-shrink:0;transition:.2s;}
.trava .sw::after{content:'';position:absolute;top:2.5px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;}
.trava .sw.on{background:var(--success);} .trava .sw.on::after{left:21px;}
.trava .nm{font-size:12.5px;font-weight:700;color:var(--primary);}
.trava .ds{font-size:11px;color:#64748b;margin-top:2px;line-height:1.5;}
.sys{font-size:10px;font-weight:800;color:#94a3b8;font-family:ui-monospace,monospace;}

.trilha-it{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #eef2f7;font-size:11.5px;}
.trilha-it .qd{font-size:10px;color:#94a3b8;white-space:nowrap;font-family:ui-monospace,monospace;}
.empty{padding:42px 20px;text-align:center;color:#94a3b8;}
.empty .ic{font-size:36px;margin-bottom:10px;}
.empty h3{font-size:14px;font-weight:700;color:var(--primary);margin-bottom:5px;}
.empty p{font-size:12px;}
.anx{display:flex;align-items:center;gap:9px;padding:7px 11px;border:1.5px solid #e2e8f0;border-radius:8px;margin-bottom:6px;font-size:12px;background:#fff;}
.anx .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.mob-tg{display:none;background:var(--primary);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:700;}
@media(max-width:880px){
  .lay{grid-template-columns:1fr;}
  .nav{display:none;position:fixed;inset:0;z-index:200;width:300px;border-radius:0;}
  .nav.open{display:flex;}
  .mob-tg{display:inline-flex;}
  .kpis{grid-template-columns:repeat(2,1fr);}
  .form-row{grid-template-columns:1fr;}
}
@media print{
  body *{visibility:hidden;}
  #print-area,#print-area *{visibility:visible;}
  #print-area{position:absolute;left:0;top:0;width:100%;padding:14px;}
}
#print-area{display:none;}
</style>
</head>
<body>
<div id="sidebar-container"></div>
<header class="topbar" id="topbar">
  <button class="topbar-open-sidebar" onclick="toggleSidebar()">☰</button>
  <div class="topbar-title">BPF / SGQ</div>
  <div class="topbar-right">
    <div class="topbar-user">
      <div class="user-avatar" style="width:32px;height:32px;font-size:12px;" id="top-avatar">—</div>
      <div><div class="topbar-user-name" id="top-user-name">—</div><div class="topbar-user-profile" id="top-user-perfil">—</div></div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()" style="color:#64748b;">Sair</button>
  </div>
</header>

<main class="main-content" id="main-content">
  <div class="pg-hdr">
    <div>
      <h1>BPF / SGQ — Gestão da Qualidade</h1>
      <p>Nutrição animal · IN MAPA 04/2007 · MAN-01 Rev. 02 · 21 POPs · 34 registros</p>
    </div>
    <div class="pg-acts">
      <button class="mob-tg" onclick="document.getElementById('nav').classList.toggle('open')">☰ Menu</button>
      <button class="btn btn-secondary btn-sm" onclick="ir('painel')">📊 Painel</button>
      <button class="btn btn-secondary btn-sm" onclick="ir('registros')">📝 Registros</button>
      <button class="btn btn-secondary btn-sm" onclick="ir('ncs')">⚠️ NCs</button>
      <button class="btn btn-secondary btn-sm" onclick="ir('auditorias')">🔍 Auditorias</button>
      <button class="btn btn-secondary btn-sm" onclick="ir('treinamentos')">🎓 Treinamentos</button>
      <button class="btn btn-secondary btn-sm" onclick="ir('documentos')">📁 Documentos</button>
      <button class="btn btn-secondary btn-sm" onclick="ir('travas')">🔒 Travas</button>
    </div>
  </div>

  <div class="lay">
    <div class="nav" id="nav">
      <div class="nav-top">
        <input type="text" class="form-input" style="font-size:12px;padding:7px 10px;" id="busca" placeholder="🔍 Buscar POP ou cadastro..." oninput="filtrarNav(this.value)">
      </div>
      <div class="nav-list" id="nav-list"></div>
    </div>
    <div class="body">
      <div class="body-hdr">
        <div>
          <div class="body-crumb" id="crumb">BPF</div>
          <div class="body-title" id="titulo">Painel</div>
        </div>
        <div id="acoes" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
      </div>
      <div class="body-main" id="conteudo"></div>
    </div>
  </div>
</main>

<div id="print-area"></div>

<!-- MODAL: registro (motor de formulário) -->
<div class="modal-overlay hidden" id="m-reg" onclick="if(event.target===this)closeModal('m-reg')">
  <div class="modal modal-lg" style="max-width:840px;">
    <div class="modal-header">
      <div class="modal-title" id="m-reg-tit">Novo registro</div>
      <button class="modal-close" onclick="closeModal('m-reg')">✕</button>
    </div>
    <div id="m-reg-body" style="overflow-y:auto;max-height:calc(90vh - 150px);padding-right:4px;"></div>
    <div class="modal-footer" id="m-reg-foot"></div>
  </div>
</div>

<!-- MODAL: ver registro -->
<div class="modal-overlay hidden" id="m-ver" onclick="if(event.target===this)closeModal('m-ver')">
  <div class="modal modal-lg" style="max-width:780px;">
    <div class="modal-header">
      <div class="modal-title" id="m-ver-tit">Registro</div>
      <button class="modal-close" onclick="closeModal('m-ver')">✕</button>
    </div>
    <div id="m-ver-body" style="overflow-y:auto;max-height:calc(90vh - 150px);"></div>
    <div class="modal-footer" id="m-ver-foot"></div>
  </div>
</div>

<!-- MODAL: cadastro genérico (entidades) -->
<div class="modal-overlay hidden" id="m-ent" onclick="if(event.target===this)closeModal('m-ent')">
  <div class="modal modal-lg" style="max-width:800px;">
    <div class="modal-header">
      <div class="modal-title" id="m-ent-tit">Cadastro</div>
      <button class="modal-close" onclick="closeModal('m-ent')">✕</button>
    </div>
    <div id="m-ent-body" style="overflow-y:auto;max-height:calc(90vh - 150px);padding-right:4px;"></div>
    <div class="modal-footer" id="m-ent-foot"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// BPF / SGQ — Gestão da qualidade para nutrição animal
//
// DOIS MOTORES, NENHUM CÓDIGO POR PROCEDIMENTO:
//
//  1. MOTOR DE REGISTROS — os 34 REG-POPxx-yy são linhas de bpf_formularios,
//     com os campos em jsonb. Criar registro novo = INSERT, não deploy.
//     As chaves "conforme" e min/max fazem a regra do POP virar bloqueio.
//
//  2. MOTOR DE CADASTROS — as entidades com ciclo de vida (instrumento,
//     calibração, visitante, fornecedor...) são descritas no objeto ENTIDADES
//     e renderizadas por uma função só.
//
// Base: Requisitos_Sistema.md (45 SYS) · Índice Mestre · seção 6.1 dos 21 POPs.
// ═══════════════════════════════════════════════════════════════════════════

let _pops=[], _forms=[], _regs=[], _travas=[], _docs=[], _funcs=[], _desig=[];
let _ncs=[], _auds=[], _treins=[], _anexos=[], _funcionarios=[];
let _ent={};                       // cache das entidades carregadas
let _sec='painel', _popSel=null, _entSel=null, _formAtual=null, _regAtual=null;
let _anexosTmp=[];                 // anexos do registro em edição
let _entEditId=null;

const GRUPOS=[
  {id:'fluxo',         label:'Fluxo do produto'},
  {id:'desvio',        label:'Desvio — saída do fluxo'},
  {id:'apoio',         label:'Apoio — governam o fluxo'},
  {id:'pre_requisito', label:'Pré-requisitos de ambiente e pessoas'},
];

// ── ENTIDADES: cadastros com ciclo de vida ─────────────────────────────────
// Cada uma é uma tabela real (têm status, validade e travas próprias — não
// caberiam no jsonb genérico dos registros).
const ENTIDADES={
  instrumentos:{
    tabela:'bpf_instrumentos', titulo:'Instrumentos', icone:'📏', sys:'SYS-005/006', pop:'POP-07',
    desc:'Identificação individual por tag. Calibração vencida bloqueia o uso.',
    ordem:'tag',
    colunas:[{id:'tag',l:'Tag'},{id:'nome',l:'Nome'},{id:'tipo',l:'Tipo'},{id:'localizacao',l:'Local'},{id:'status',l:'Status',badge:1},{id:'_calib',l:'Calibração'}],
    campos:[
      {id:'tag',label:'Tag',tipo:'texto',obrigatorio:true,ajuda:'Identificação individual e única (SYS-006)'},
      {id:'nome',label:'Nome',tipo:'texto',obrigatorio:true},
      {id:'tipo',label:'Tipo',tipo:'select',opcoes:['balanca','espectrofotometro','termometro','manometro','outro']},
      {id:'fabricante',label:'Fabricante',tipo:'texto'},{id:'modelo',label:'Modelo',tipo:'texto'},
      {id:'numero_serie',label:'Nº de série',tipo:'texto'},
      {id:'faixa_min',label:'Faixa mín.',tipo:'numero'},{id:'faixa_max',label:'Faixa máx.',tipo:'numero'},
      {id:'unidade',label:'Unidade',tipo:'texto'},{id:'resolucao',label:'Resolução',tipo:'numero'},
      {id:'classe',label:'Classe metrológica',tipo:'texto'},
      {id:'emp',label:'Erro máx. admissível',tipo:'numero',ajuda:'Do instrumento — não confundir com a tolerância do produto (POP-18)'},
      {id:'localizacao',label:'Localização',tipo:'texto'},
      {id:'periodicidade_meses',label:'Periodicidade (meses)',tipo:'numero',default:12},
      {id:'critico',label:'Crítico (bloqueia se vencido)',tipo:'sim_nao',default:'sim'},
      {id:'status',label:'Status',tipo:'select',opcoes:['ativo','em_calibracao','bloqueado','inativo'],default:'ativo'},
      {id:'obs',label:'Observações',tipo:'textarea'},
    ]},
  calibracoes:{
    tabela:'bpf_calibracoes', titulo:'Calibrações', icone:'🎯', sys:'SYS-005/039', pop:'POP-07',
    desc:'Validade controlada com alerta prévio. Peso-padrão vencido impede o registro.',
    ordem:'data', desc_ordem:true,
    colunas:[{id:'_instr',l:'Instrumento'},{id:'tipo',l:'Tipo'},{id:'data',l:'Data',data:1},{id:'validade',l:'Validade',data:1,venc:1},{id:'resultado',l:'Resultado',badge:1},{id:'certificado_numero',l:'Certificado'}],
    campos:[
      {id:'instrumento_id',label:'Instrumento',tipo:'ref',ref:'instrumentos',refLabel:'tag',obrigatorio:true},
      {id:'tipo',label:'Tipo',tipo:'select',opcoes:['calibracao','verificacao_interna'],obrigatorio:true,default:'calibracao'},
      {id:'data',label:'Data',tipo:'data',obrigatorio:true},
      {id:'validade',label:'Validade',tipo:'data',obrigatorio:true,ajuda:'SYS-005: vencida bloqueia o uso do instrumento'},
      {id:'prestador_nome',label:'Prestador',tipo:'texto'},
      {id:'certificado_numero',label:'Nº do certificado',tipo:'texto'},
      {id:'peso_padrao_id',label:'Peso-padrão usado',tipo:'ref',ref:'pesos_padrao',refLabel:'identificacao',ajuda:'SYS-039: certificado vencido impede registrar'},
      {id:'erro_encontrado',label:'Erro encontrado',tipo:'numero'},
      {id:'resultado',label:'Resultado',tipo:'select',opcoes:['aprovado','aprovado_com_restricao','reprovado'],obrigatorio:true,conforme:'aprovado'},
      {id:'obs',label:'Observações',tipo:'textarea'},
    ]},
  pesos_padrao:{
    tabela:'bpf_pesos_padrao', titulo:'Pesos-padrão', icone:'⚖️', sys:'SYS-039', pop:'POP-07',
    desc:'Ativo controlado: classe, certificado e validade.',
    ordem:'identificacao',
    colunas:[{id:'identificacao',l:'Identificação'},{id:'valor_nominal',l:'Valor'},{id:'classe',l:'Classe'},{id:'validade',l:'Validade',data:1,venc:1},{id:'status',l:'Status',badge:1}],
    campos:[
      {id:'identificacao',label:'Identificação',tipo:'texto',obrigatorio:true},
      {id:'valor_nominal',label:'Valor nominal',tipo:'numero',obrigatorio:true},
      {id:'unidade',label:'Unidade',tipo:'texto',default:'kg'},
      {id:'classe',label:'Classe',tipo:'select',opcoes:['E1','E2','F1','F2','M1','M2']},
      {id:'certificado_numero',label:'Nº do certificado',tipo:'texto'},
      {id:'data_certificado',label:'Data do certificado',tipo:'data'},
      {id:'validade',label:'Validade',tipo:'data',obrigatorio:true},
      {id:'status',label:'Status',tipo:'select',opcoes:['ativo','vencido','em_calibracao','inativo'],default:'ativo'},
      {id:'obs',label:'Observações',tipo:'textarea'},
    ]},
  equip_saidas:{
    tabela:'bpf_equip_saidas', titulo:'Saída e retorno de equipamento', icone:'📤', sys:'SYS-029', pop:'POP-07',
    desc:'O retorno só é aceito com o certificado anexado — sem ele, não reentra em operação.',
    ordem:'data_saida', desc_ordem:true,
    colunas:[{id:'descricao',l:'Item'},{id:'prestador_nome',l:'Prestador'},{id:'motivo',l:'Motivo'},{id:'data_saida',l:'Saída',data:1},{id:'data_retorno',l:'Retorno',data:1},{id:'status',l:'Status',badge:1}],
    campos:[
      {id:'descricao',label:'Item que saiu',tipo:'texto',obrigatorio:true},
      {id:'instrumento_id',label:'Instrumento (se cadastrado)',tipo:'ref',ref:'instrumentos',refLabel:'tag'},
      {id:'prestador_nome',label:'Prestador',tipo:'texto',obrigatorio:true},
      {id:'motivo',label:'Motivo',tipo:'select',opcoes:['conserto','calibracao','ambos'],obrigatorio:true},
      {id:'data_saida',label:'Data de saída',tipo:'data',obrigatorio:true},
      {id:'nf_saida',label:'NF de saída',tipo:'texto'},
      {id:'previsao_retorno',label:'Previsão de retorno',tipo:'data'},
      {id:'data_retorno',label:'Data de retorno',tipo:'data'},
      {id:'nf_retorno',label:'NF de retorno',tipo:'texto'},
      {id:'status',label:'Status',tipo:'select',opcoes:['fora','retornado_bloqueado','liberado'],default:'fora',
       ajuda:'"liberado" exige o certificado anexado (SYS-029)'},
      {id:'obs',label:'Observações',tipo:'textarea'},
    ],
    anexo:true},
  fornecedores_qualif:{
    tabela:'bpf_fornecedores_qualif', titulo:'Fornecedores qualificados', icone:'🏭', sys:'SYS-020/032', pop:'POP-01',
    desc:'Categoria de risco A–D. Bloqueio de recebimento vale para as categorias A e B (POP-01, 6.1).',
    ordem:'nome',
    colunas:[{id:'nome',l:'Fornecedor'},{id:'categoria_risco',l:'Risco'},{id:'tipo_fornecimento',l:'Fornece'},{id:'status',l:'Status',badge:1},{id:'reavaliacao_em',l:'Reavaliação',data:1,venc:1}],
    campos:[
      {id:'nome',label:'Fornecedor',tipo:'texto',obrigatorio:true},
      {id:'cnpj',label:'CNPJ',tipo:'texto'},
      {id:'categoria_risco',label:'Categoria de risco',tipo:'select',obrigatorio:true,
       opcoes:['A','B','C','D'],

// ── HELPERS ────────────────────────────────────────────────────────────────
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoje=()=>new Date().toISOString().split('T')[0];
const fmtD=d=>d?String(d).split('T')[0].split('-').reverse().join('/'):'—';
const fmtDH=d=>{if(!d)return '—';const x=new Date(d);return x.toLocaleDateString('pt-BR')+' '+x.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});};
const diasAte=d=>d?Math.ceil((new Date(String(d).split('T')[0])-new Date(hoje()))/864e5):null;
const cap=s=>String(s||'').replace(/_/g,' ').replace(/^./,c=>c.toUpperCase());
const nomeFuncao=c=>_funcs.find(f=>f.codigo===c)?.nome||c||'—';

async function carregar(){
  const s=async(q,ctx)=>{const r=await db(q,ctx);return r.data||[];};
  const [docs,forms,travas,funcs,desig,ncs,auds,treins,anexos,fn]=await Promise.all([
    s(_supabase.from('bpf_documentos_mestre').select('*').order('ordem').order('codigo'),'documentos'),
    s(_supabase.from('bpf_formularios').select('*').eq('ativo',true).order('pop_cod').order('ordem'),'formulários'),
    s(_supabase.from('bpf_travas').select('*').order('sys_ref'),'travas'),
    s(_supabase.from('bpf_funcoes').select('*').eq('ativo',true).order('ordem'),'funções'),
    s(_supabase.from('bpf_designacoes').select('*').order('funcionario_nome'),'designações'),
    s(_supabase.from('bpf_ncs').select('*').order('data',{ascending:false}).limit(500),'NCs'),
    s(_supabase.from('bpf_auditorias').select('*').order('data',{ascending:false}).limit(300),'auditorias'),
    s(_supabase.from('bpf_treinamentos').select('*').order('data',{ascending:false}).limit(300),'treinamentos'),
    s(_supabase.from('bpf_documentos').select('*').order('created_at',{ascending:false}).limit(300),'anexos'),
    s(_supabase.from('funcionarios').select('id,nome,funcao').eq('status','ativo').order('nome'),'funcionários'),
  ]);
  _docs=docs;_forms=forms;_travas=travas;_funcs=funcs;_desig=desig;
  _ncs=ncs;_auds=auds;_treins=treins;_anexos=anexos;_funcionarios=fn;
  _pops=docs.filter(d=>d.tipo==='pop');

  // Registros: janela recente + TUDO em aberto. "Estado atual" não pode ser
  // filtrado por recência, senão some registro antigo ainda pendente.
  const [rec,ab]=await Promise.all([
    s(_supabase.from('bpf_registros').select('*').order('data',{ascending:false}).limit(500),'registros'),
    s(_supabase.from('bpf_registros').select('*').in('status',['rascunho','aguardando_assinatura','nao_conforme']).limit(500),'registros em aberto'),
  ]);
  const m=new Map();[...rec,...ab].forEach(r=>m.set(r.id,r));
  _regs=[...m.values()].sort((a,b)=>String(b.data).localeCompare(String(a.data)));

  // Entidades
  const chaves=Object.keys(ENTIDADES);
  const res=await Promise.all(chaves.map(k=>{
    const e=ENTIDADES[k];
    let q=_supabase.from(e.tabela).select('*').limit(1000);
    if(e.ordem) q=q.order(e.ordem,{ascending:!e.desc_ordem});
    return s(q,e.titulo);
  }));
  chaves.forEach((k,i)=>_ent[k]=res[i]);
}

// ── ALERTAS (usados no painel e nos pontos vermelhos do menu) ──────────────
function alertas(){
  const a=[];
  (_ent.instrumentos||[]).forEach(i=>{
    const ult=(_ent.calibracoes||[]).filter(c=>c.instrumento_id===i.id).sort((x,y)=>String(y.validade).localeCompare(String(x.validade)))[0];
    if(i.status==='inativo') return;
    if(!ult) a.push({t:'dang',pop:'POP-07',ent:'instrumentos',m:`Instrumento ${i.tag} sem nenhuma calibração registrada`});
    else{const d=diasAte(ult.validade);
      if(d<0) a.push({t:'dang',pop:'POP-07',ent:'instrumentos',m:`Instrumento ${i.tag} com calibração VENCIDA em ${fmtD(ult.validade)}`});
      else if(d<=60) a.push({t:'warn',pop:'POP-07',ent:'instrumentos',m:`Instrumento ${i.tag} vence em ${d} dia(s)`});}
  });
  (_ent.pesos_padrao||[]).forEach(p=>{const d=diasAte(p.validade);
    if(d!==null&&d<0&&p.status!=='inativo') a.push({t:'dang',pop:'POP-07',ent:'pesos_padrao',m:`Peso-padrão ${p.identificacao} com certificado vencido`});});
  (_ent.prestadores_qualif||[]).forEach(p=>{const d=diasAte(p.validade);
    if(d!==null&&d<0) a.push({t:'dang',pop:'POP-17',ent:'prestadores_qualif',m:`${p.nome} com acreditação vencida`});});
  (_ent.equip_saidas||[]).forEach(s=>{
    if(s.status==='retornado_bloqueado') a.push({t:'dang',pop:'POP-07',ent:'equip_saidas',m:`${s.descricao} retornou sem certificado — não reentra em operação`});});
  (_ent.visitantes||[]).forEach(v=>{const d=diasAte(v.integracao_validade);
    if(d!==null&&d<0&&v.status==='liberado') a.push({t:'warn',pop:'POP-04',ent:'visitantes',m:`${v.nome} com integração de BPF vencida`});});
  (_ent.reclamacoes||[]).forEach(r=>{const d=diasAte(r.prazo_ate);
    if(d!==null&&d<0&&r.status!=='encerrada') a.push({t:'dang',pop:'POP-19',ent:'reclamacoes',m:`Reclamação ${r.numero} fora do prazo de 15 dias`});});
  _regs.forEach(r=>{const d=diasAte(r.validade);
    if(d!==null&&d<0&&!r.cancelado_em) a.push({t:'dang',pop:r.pop_cod,m:`Registro ${r.numero} com validade vencida`});});
  _ncs.filter(n=>n.status!=='encerrado'&&n.prazo).forEach(n=>{
    if(diasAte(n.prazo)<0) a.push({t:'dang',pop:n.procedimento_cod,m:`NC de ${fmtD(n.data)} fora do prazo`});});
  // SYS-026: cronograma do ano seguinte precisa existir
  const prox=new Date().getFullYear()+1;
  if(new Date().getMonth()===11){
    ['auditoria','treinamento'].forEach(t=>{
      if(!(_ent.cronograma||[]).some(c=>c.ano===prox&&c.tipo===t))
        a.push({t:'warn',pop:'POP-20',ent:'cronograma',m:`Cronograma de ${t} de ${prox} ainda não cadastrado (SYS-026)`});});
  }
  return a;
}

// ── NAVEGAÇÃO ──────────────────────────────────────────────────────────────
function renderNav(){
  const al=alertas();
  let h='';
  for(const g of GRUPOS){
    const l=_pops.filter(p=>p.grupo===g.id);
    if(!l.length) continue;
    h+=`<div class="nav-grp">${g.label}</div>`;
    for(const p of l){
      const n=_forms.filter(f=>f.pop_cod===p.codigo).length;
      const temAl=al.some(x=>x.pop===p.codigo&&x.t==='dang');
      h+=`<div class="nav-it" data-cod="${p.codigo}" data-busca="${esc((p.codigo+' '+p.titulo).toLowerCase())}" onclick="abrirPop('${p.codigo}')">
        <span class="cod">${esc(p.codigo.replace('POP-',''))}</span>
        <span class="tx" title="${esc(p.titulo)}">${esc(p.titulo)}</span>
        ${temAl?'<span class="al"></span>':''}${n?`<span class="ct">${n}</span>`:''}</div>`;
    }
  }
  h+=`<div class="nav-grp">Cadastros e controles</div>`;
  for(const [k,e] of Object.entries(ENTIDADES)){
    const n=(_ent[k]||[]).length;
    const temAl=al.some(x=>x.ent===k&&x.t==='dang');
    h+=`<div class="nav-it" data-cod="ent:${k}" data-busca="${esc((e.titulo+' '+e.sys).toLowerCase())}" onclick="abrirEnt('${k}')">
      <span class="cod">${e.icone}</span><span class="tx" title="${esc(e.titulo)}">${esc(e.titulo)}</span>
      ${temAl?'<span class="al"></span>':''}${n?`<span class="ct">${n}</span>`:''}</div>`;
  }
  document.getElementById('nav-list').innerHTML=h;
}
function filtrarNav(t){
  const q=(t||'').toLowerCase().trim();
  document.querySelectorAll('.nav-it').forEach(el=>{el.style.display=!q||el.dataset.busca.includes(q)?'':'none';});
  document.querySelectorAll('.nav-grp').forEach(g=>{
    let n=g.nextElementSibling,v=false;
    while(n&&n.classList.contains('nav-it')){if(n.style.display!=='none')v=true;n=n.nextElementSibling;}
    g.style.display=v?'':'none';});
}
function marcarNav(c){document.querySelectorAll('.nav-it').forEach(e=>e.classList.toggle('on',e.dataset.cod===c));}
function ir(sec){
  _sec=sec;_popSel=null;_entSel=null;marcarNav(null);
  document.getElementById('nav').classList.remove('open');
  ({painel:renderPainel,registros:renderRegistros,documentos:renderDocs,travas:renderTravas,

}

function renderPainel(){

  const doMes=_regs.filter(r=>String(r.data).startsWith(mes)&&!r.cancelado_em);

  let h=`<div class="kpis">
    <div class="kpi"><div class="v">${doMes.length}</div><div class="l">Registros no mês</div></div>

    <div class="kpi ${nc.length?'dang':'ok'}"><div class="v">${nc.length}</div><div class="l">Registros não conformes</div></div>

  </div>`;

  if(al.length){
    h+=`<div class="sec-card"><h3>Alertas</h3>
      ${al.slice(0,14).map(a=>`<div class="alerta al-${a.t}" style="margin:6px 0 0;cursor:${a.ent?'pointer':'default'};"
        ${a.ent?`onclick="abrirEnt('${a.ent}')"`:''}><span class="sys">${esc(a.pop||'')}</span> ${esc(a.m)}</div>`).join('')}
      ${al.length>14?`<div class="sub" style="margin-top:8px;">+ ${al.length-14} outro(s).</div>`:''}</div>`;
  } else {
    h+=`<div class="alerta al-ok"><strong>Nenhum alerta.</strong> Nenhuma calibração vencida, prazo estourado ou validade expirada.</div>`;
  }

    h+=`<div class="alerta al-info"><strong>Nenhuma trava ativa.</strong> O sistema está registrando, mas ainda não bloqueia nada —

  }

  const semReg=_pops.filter(p=>{

  h+=`<div class="sec-card"><h3>Cobertura dos procedimentos</h3>
    <div class="sub">${_pops.length-semReg.length} de ${_pops.length} POPs já têm ao menos um registro lançado.</div>

}

// MOTOR DE CAMPOS (compartilhado entre registros e cadastros)
// ═══════════════════════════════════════════════════════════════════════════
function campoHtml(c,valor){
  const v=valor===undefined||valor===null?(c.default!==undefined?c.default:''):valor;
  const req=c.obrigatorio?'<span class="req">*</span>':'';
  const aj=c.ajuda?`<span class="aj">${esc(c.ajuda)}</span>`:'';
  const un=c.unidade?` <span style="color:#94a3b8;font-weight:600;">(${esc(c.unidade)})</span>`:'';
  const id='f_'+c.id;
  if(c.tipo==='secao') return `<div class="f-secao">${esc(c.label)}</div>${c.ajuda?`<div style="grid-column:1/-1;font-size:11px;color:#64748b;margin:-2px 0 5px;">${esc(c.ajuda)}</div>`:''}`;
  let inner='';
  switch(c.tipo){
    case 'sim_nao':
      inner=`<div class="sn-grp" id="${id}" data-v="${esc(v)}">
        <button type="button" class="sn-btn ${v==='sim'?'sel-sim':''}" onclick="setSN('${c.id}','sim')">Sim</button>
        <button type="button" class="sn-btn ${v==='nao'?'sel-nao':''}" onclick="setSN('${c.id}','nao')">Não</button>
        <button type="button" class="sn-btn ${v==='na'?'sel-sim':''}" onclick="setSN('${c.id}','na')" style="flex:.6;">N/A</button></div>`;break;
    case 'select':
      inner=`<select class="form-input" id="${id}"><option value="">Selecione...</option>
        ${(c.opcoes||[]).map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;break;
    case 'multiselect':
      inner=`<div id="${id}" data-multi="1">${(c.opcoes||[]).map(o=>
        `<span class="chip ${Array.isArray(v)&&v.includes(o)?'on':''}" onclick="this.classList.toggle('on')" data-o="${esc(o)}">${esc(o)}</span>`).join('')}</div>`;break;
    case 'textarea': inner=`<textarea class="form-input" id="${id}" rows="2">${esc(v)}</textarea>`;break;
    case 'numero':
      inner=`<input type="number" step="any" class="form-input" id="${id}" value="${esc(v)}"
        ${c.min!==undefined?`data-min="${c.min}"`:''} ${c.max!==undefined?`data-max="${c.max}"`:''} oninput="checarLimite(this)">`;break;
    case 'data': inner=`<input type="date" class="form-input" id="${id}" value="${esc(String(v).split('T')[0])}">`;break;
    case 'hora': inner=`<input type="time" class="form-input" id="${id}" value="${esc(String(v).slice(0,5))}">`;break;
    case 'funcao':
      inner=`<select class="form-input" id="${id}"><option value="">Selecione...</option>
        ${_funcs.map(f=>`<option value="${esc(f.codigo)}" ${v===f.codigo?'selected':''}>${esc(f.nome)}</option>`).join('')}</select>`;break;
    case 'pop':
      inner=`<select class="form-input" id="${id}"><option value="">— todos —</option>
        ${_pops.map(p=>`<option value="${esc(p.codigo)}" ${v===p.codigo?'selected':''}>${esc(p.codigo)} — ${esc(p.titulo)}</option>`).join('')}</select>`;break;
    case 'ref':{
      const lst=_ent[c.ref]||[];
      inner=`<select class="form-input" id="${id}"><option value="">Selecione...</option>
        ${lst.map(o=>`<option value="${esc(o.id)}" ${v===o.id?'selected':''}>${esc(o[c.refLabel]||o.nome||o.id)}</option>`).join('')}</select>`;break;}
    case 'funcionario':
      inner=`<input type="text" class="form-input" id="${id}" value="${esc(v)}" list="lst-func" placeholder="Nome do colaborador">`;break;
    default: inner=`<input type="text" class="form-input" id="${id}" value="${esc(v)}">`;
  }
  const lim=(c.min!==undefined||c.max!==undefined)
    ?`<span class="aj">Tolerância: ${c.min!==undefined?'mín '+c.min:''}${c.min!==undefined&&c.max!==undefined?' · ':''}${c.max!==undefined?'máx '+c.max:''}</span>`:'';
  return `<div class="fld" id="w_${c.id}"><label>${esc(c.label)}${un}${req}</label>${inner}${lim}${aj}</div>`;
}
function setSN(id,val){
  const el=document.getElementById('f_'+id);if(!el)return;
  el.dataset.v=el.dataset.v===val?'':val;
  const v=el.dataset.v,b=el.querySelectorAll('.sn-btn');
  b[0].className='sn-btn'+(v==='sim'?' sel-sim':'');
  b[1].className='sn-btn'+(v==='nao'?' sel-nao':'');
  b[2].className='sn-btn'+(v==='na'?' sel-sim':'');
  avaliarAoVivo();
}
function checarLimite(inp){
  const w=inp.closest('.fld');if(!w)return;
  const v=parseFloat(inp.value);
  const mn=inp.dataset.min!==undefined?parseFloat(inp.dataset.min):null;
  const mx=inp.dataset.max!==undefined?parseFloat(inp.dataset.max):null;
  w.classList.toggle('desvio',!isNaN(v)&&((mn!==null&&v<mn)||(mx!==null&&v>mx)));
  avaliarAoVivo();
}
// Único ponto de leitura do DOM.
function lerForm(campos){
  const out={};
  for(const c of campos){
    if(c.tipo==='secao')continue;
    const el=document.getElementById('f_'+c.id);if(!el)continue;
    if(c.tipo==='sim_nao') out[c.id]=el.dataset.v||'';
    else if(c.tipo==='multiselect') out[c.id]=[...el.querySelectorAll('.chip.on')].map(x=>x.dataset.o);
    else out[c.id]=el.value;
  }
  return out;
}
// A regra do POP vira comportamento aqui: "conforme" e min/max.
function avaliar(campos,vals){
  const d=[];
  for(const c of campos){
    if(c.tipo==='secao')continue;
    const v=vals[c.id];
    if(c.conforme!==undefined&&v!==''&&v!=null&&v!=='na'&&v!==c.conforme)
      d.push({campo:c.label,esperado:c.conforme,obtido:v});
    if(c.tipo==='numero'&&v!==''&&v!=null){
      const n=parseFloat(v);
      if(!isNaN(n)){
        if(c.min!==undefined&&n<c.min) d.push({campo:c.label,esperado:'≥ '+c.min,obtido:n});
        if(c.max!==undefined&&n>c.max) d.push({campo:c.label,esperado:'≤ '+c.max,obtido:n});
      }}}
  return d;
}
function faltando(campos,vals){
  return campos.filter(c=>c.tipo!=='secao'&&c.obrigatorio&&
    (vals[c.id]===''||vals[c.id]==null||(Array.isArray(vals[c.id])&&!vals[c.id].length))).map(c=>c.label);
}
function avaliarAoVivo(){
  if(!_formAtual)return;
  const d=avaliar(_formAtual.campos||[],lerForm(_formAtual.campos||[]));
  const box=document.getElementById('box-desvio');if(!box)return;
  box.innerHTML=d.length?`<div class="alerta al-dang" style="margin:0;"><strong>${d.length} desvio(s):</strong>
    ${d.map(x=>esc(x.campo)).join(' · ')}<div style="margin-top:4px;font-size:11px;">Será salvo como <strong>NÃO CONFORME</strong>.</div></div>`:'';
}

  const campos=f.campos||[];
  document.getElementById('m-reg-tit').textContent=f.codigo+' — '+f.titulo;
  document.getElementById('m-reg-body').innerHTML=`
    ${f.exige_anexo?`<div class="alerta al-warn">Este registro <strong>não fecha sem arquivo anexado</strong> (SYS-008).</div>`:''}
    <div class="form-row">
      <div class="fld"><label>Data<span class="req">*</span></label><input type="date" class="form-input" id="f__data" value="${hoje()}"></div>
      <div class="fld"><label>Hora</label><input type="time" class="form-input" id="f__hora" value="${new Date().toTimeString().slice(0,5)}"></div>
      ${f.gera_validade?`<div class="fld"><label>Validade</label><input type="date" class="form-input" id="f__validade" value="${validadeSugerida(f)}"><span class="aj">Entra no alerta de vencimento</span></div>`:''}
    </div>

    <div class="sec-card" style="margin-top:8px;"><h3>Anexos${f.exige_anexo?' <span class="req">*</span>':''}</h3>
      <div id="anx-lst" style="margin:8px 0;"></div>
      <input type="file" id="anx-in" multiple style="font-size:12px;" onchange="subirAnexos(this)"></div>
    <div id="box-desvio" style="margin-top:6px;"></div>`;
  document.getElementById('m-reg-foot').innerHTML=`
    <button class="btn btn-secondary" onclick="closeModal('m-reg')">Cancelar</button>

    <button class="btn btn-primary" onclick="salvarRegistro(false)">💾 Salvar e enviar p/ assinatura</button>`;
  document.getElementById('m-reg').classList.remove('hidden');
  renderAnexosTmp();avaliarAoVivo();

function validadeSugerida(f){
  if(!f.validade_meses)return '';
  const d=new Date();d.setMonth(d.getMonth()+f.validade_meses);
  return d.toISOString().split('T')[0];
}
function renderAnexosTmp(){
  const el=document.getElementById('anx-lst');if(!el)return;
  el.innerHTML=_anexosTmp.length?_anexosTmp.map((a,i)=>
    `<div class="anx"><span>📎</span><span class="nm">${esc(a.nome)}</span>
     <span style="color:#94a3b8;font-size:11px;">${(a.tamanho/1024).toFixed(0)} KB</span>
     <span style="cursor:pointer;color:var(--danger);font-weight:800;" onclick="_anexosTmp.splice(${i},1);renderAnexosTmp();">✕</span></div>`).join('')

// Storage, não base64 no Postgres (dívida do item 4.5 — não criar mais).
async function subirAnexos(inp){
  for(const file of inp.files){
    if(file.size>15*1024*1024){toast(`${file.name}: acima de 15 MB`,'warning');continue;}
    const path=`bpf/${Date.now()}_${file.name.replace(/[^\w.\-]/g,'_')}`;
    try{
      const {error}=await _supabase.storage.from('documentos').upload(path,file);
      if(error)throw error;
      _anexosTmp.push({nome:file.name,path,tipo:file.type||'',tamanho:file.size});
      toast(`${file.name} anexado.`,'success');
    }catch(e){ toast('Falha ao anexar '+file.name+': '+(e.message||e),'danger'); }
  }
  inp.value='';renderAnexosTmp();
}
async function baixarAnexo(path){
  try{
    const {data,error}=await _supabase.storage.from('documentos').createSignedUrl(path,120);
    if(error)throw error;
    window.open(data.signedUrl,'_blank');
  }catch(e){ toast('Não foi possível abrir: '+(e.message||e),'danger'); }
}

async function salvarRegistro(rascunho){
  if(!guardAction('bpf','edit'))return;
  const f=_formAtual;if(!f)return;
  const campos=f.campos||[], vals=lerForm(campos);
  const data=document.getElementById('f__data').value;
  if(!data){toast('Informe a data','warning');return;}
  if(!rascunho){
    const falt=faltando(campos,vals);
    if(falt.length){toast('Falta preencher: '+falt.slice(0,3).join(', ')+(falt.length>3?'…':''),'warning');return;}
    if(f.exige_anexo&&!_anexosTmp.length){toast('SYS-008: este registro não fecha sem anexo.','danger');return;}
  }
  const desvios=avaliar(campos,vals), conforme=desvios.length===0;
  const status=rascunho?'rascunho':(conforme?'aguardando_assinatura':'nao_conforme');
  const u=getUser(), vEl=document.getElementById('f__validade');
  // numero e retencao_ate nascem no INSERT (trigger) — SYS-003/004.
  const row={formulario_cod:f.codigo,pop_cod:f.pop_cod,data,
    hora:document.getElementById('f__hora').value||null,
    campos:vals,status,conforme,anexos:_anexosTmp,
    validade:vEl&&vEl.value?vEl.value:null,
    criado_por:u?.nome||u?.email||'sistema'};
  const r=await db(_supabase.from('bpf_registros').insert(row).select().single(),'salvar registro');
  if(r.error)return;
  await trilha(r.data.id,r.data.numero,'criado',null,null,null,
    rascunho?'Rascunho criado':(conforme?'Registro criado':`Criado com ${desvios.length} desvio(s): `+desvios.map(d=>d.campo).join('; ')));
  await addLog('CREATE','BPF',r.data.numero,f.codigo+' — '+(conforme?'conforme':'NÃO CONFORME'));
  closeModal('m-reg');
  toast(conforme?`${r.data.numero} salvo.`:`${r.data.numero} salvo como NÃO CONFORME (${desvios.length} desvio).`,conforme?'success':'warning');
  _anexosTmp=[];
  await carregar();renderNav();voltar();
}

// Assinatura ELETRÔNICA: quem, quando, com que perfil. Sem canvas/base64 —
// SYS-043 pede identificação do executante, não grafia; e base64 no Postgres
// é a dívida do item 4.5, que não faz sentido aumentar.
async function assinar(regId,assId){
  if(!guardAction('bpf','edit'))return;
  const r=_regs.find(x=>x.id===regId);if(!r)return;
  const f=_forms.find(x=>x.codigo===r.formulario_cod);
  const a=(f?.assinaturas||[]).find(x=>x.id===assId);if(!a)return;
  const u=getUser();if(!u){toast('Sessão não identificada','danger');return;}
  const tv=_travas.find(t=>t.codigo==='sem_designacao');
  if(tv?.ativa&&a.funcao){
    const ok=_desig.some(d=>d.ativo&&d.funcao_cod===a.funcao&&(!d.pop_cod||d.pop_cod===r.pop_cod)&&
      d.funcionario_nome===u.nome&&(!d.data_fim||d.data_fim>=hoje()));
    if(!ok){toast(`SYS-036: sem designação vigente para "${nomeFuncao(a.funcao)}" no ${r.pop_cod}.`,'danger');return;}
  }
  if(!confirm(`Assinar como "${a.label}"?\n\n${u.nome||u.email}\n${new Date().toLocaleString('pt-BR')}\n\nFica na trilha e não pode ser removida.`))return;
  const novas=[...(r.assinaturas||[]).filter(x=>x.id!==assId),
    {id:assId,label:a.label,funcao:a.funcao,nome:u.nome||u.email,perfil:u.perfil||null,em:new Date().toISOString()}];
  const obrig=(f?.assinaturas||[]).filter(x=>x.obrigatoria).map(x=>x.id);
  const todas=obrig.every(id=>novas.some(x=>x.id===id));
  const patch={assinaturas:novas,atualizado_em:new Date().toISOString()};
  if(todas&&r.status==='aguardando_assinatura'){patch.status='concluido';patch.concluido_em=new Date().toISOString();}
  const res=await db(_supabase.from('bpf_registros').update(patch).eq('id',regId),'assinar');
  if(res.error)return;
  await trilha(regId,r.numero,'assinado',a.label,null,u.nome||u.email,'Assinatura eletrônica');
  if(patch.status==='concluido') await trilha(regId,r.numero,'concluido',null,null,null,'Todas as assinaturas obrigatórias coletadas');
  toast('Assinado.','success');
  await carregar();closeModal('m-ver');renderNav();voltar();
}
// SYS-003: não existe exclusão. Cancelamento com motivo, registro preservado.
async function cancelarRegistro(regId){
  if(!guardAction('bpf','delete'))return;
  const r=_regs.find(x=>x.id===regId);if(!r)return;
  const motivo=prompt('Motivo do cancelamento (obrigatório — fica na trilha):');
  if(motivo===null)return;
  if(!motivo.trim()){toast('O motivo é obrigatório.','warning');return;}
  const u=getUser();
  const res=await db(_supabase.from('bpf_registros').update({status:'cancelado',
    cancelado_em:new Date().toISOString(),cancelado_por:u?.nome||u?.email||'sistema',
    cancelado_motivo:motivo.trim()}).eq('id',regId),'cancelar registro');
  if(res.error)return;
  await trilha(regId,r.numero,'cancelado',null,r.status,'cancelado',motivo.trim());
  await addLog('UPDATE','BPF',r.numero,'Cancelado: '+motivo.trim());
  toast('Cancelado (preservado por 4 anos).','success');
  await carregar();closeModal('m-ver');renderNav();voltar();
}

function abrirEnt(k){
  const e=ENTIDADES[k];if(!e)return;
  _sec='ent';_entSel=k;_popSel=null;marcarNav('ent:'+k);
  document.getElementById('nav').classList.remove('open');
  cab(e.pop+' · '+e.sys,e.icone+' '+e.titulo,
    `<button class="btn btn-primary btn-sm" onclick="novaEnt('${k}')">+ Novo</button>`);
  const l=_ent[k]||[];
  let h=`<div class="alerta al-info">${esc(e.desc)}</div>`;
  const al=alertas().filter(a=>a.ent===k);
  if(al.length) h+=al.map(a=>`<div class="alerta al-${a.t}">${esc(a.m)}</div>`).join('');
  if(!l.length){
    h+=`<div class="empty"><div class="ic">${e.icone}</div><h3>Nenhum cadastro</h3><p>Clique em “+ Novo”.</p></div>`;
  }else{
    h+=`<div class="tbl-wrap"><table class="tbl"><thead><tr>
      ${e.colunas.map(c=>`<th>${esc(c.l)}</th>`).join('')}<th></th></tr></thead><tbody>
      ${l.map(row=>`<tr>${e.colunas.map(c=>`<td>${celulaEnt(k,row,c)}</td>`).join('')}
        <td><button class="btn btn-ghost btn-sm" onclick="editarEnt('${k}','${row.id}')">editar</button></td></tr>`).join('')}
    </tbody></table></div>`;
  }
  document.getElementById('conteudo').innerHTML=h;
}
function celulaEnt(k,row,c){
  if(c.id==='_calib'){
    const u=(_ent.calibracoes||[]).filter(x=>x.instrumento_id===row.id)
      .sort((a,b)=>String(b.validade).localeCompare(String(a.validade)))[0];
    if(!u)return '<span class="badge badge-danger">sem calibração</span>';
    const d=diasAte(u.validade);
    return `<span class="badge badge-${d<0?'danger':d<=60?'warning':'success'}">${d<0?'vencida':fmtD(u.validade)}</span>`;
  }
  if(c.id==='_instr'){const i=(_ent.instrumentos||[]).find(x=>x.id===row.instrumento_id);return esc(i?.tag||'—');}
  if(c.id==='_funcao')return esc(nomeFuncao(row.funcao_cod));
  if(c.id==='_autor')return row.anonimo?'<em style="color:#94a3b8;">anônimo</em>':esc(row.autor_nome||'—');
  let v=row[c.id];
  if(c.bool)return v===true||v==='sim'?'<span class="badge badge-success">sim</span>':'<span class="badge badge-gray">não</span>';
  if(c.data){
    if(!v)return '—';
    if(c.venc){const d=diasAte(v);return `<span class="badge badge-${d<0?'danger':d<=60?'warning':'success'}">${fmtD(v)}</span>`;}
    return fmtD(v);
  }
  if(c.badge){
    const bom=['ativo','aprovado','homologado','qualificado','liberado','vigente','realizado','encerrada','executado'];
    const ruim=['bloqueado','reprovado','suspenso','vencido','retornado_bloqueado','atrasado'];
    const cl=bom.includes(v)?'success':ruim.includes(v)?'danger':'warning';
    return `<span class="badge badge-${cl}">${esc(cap(v))}</span>`;
  }
  return esc(v??'—');
}
function novaEnt(k){
  if(!guardAction('bpf','edit'))return;
  _entEditId=null;abrirModalEnt(k,{});
}
function editarEnt(k,id){
  if(!guardAction('bpf','edit'))return;
  const row=(_ent[k]||[]).find(x=>x.id===id);if(!row)return;
  _entEditId=id;abrirModalEnt(k,row);
}
function abrirModalEnt(k,row){
  const e=ENTIDADES[k];
  _formAtual=null;
  // Numeração automática de RC / manifestação
  const vals={...row};
  e.campos.forEach(c=>{
    if(c.auto&&!vals[c.id]){
      const ano=new Date().getFullYear();
      const n=(_ent[k]||[]).filter(x=>String(x.numero||'').startsWith(c.auto+'-'+ano)).length+1;
      vals[c.id]=`${c.auto}-${ano}-${String(n).padStart(4,'0')}`;
    }
    if(c.tipo==='sim_nao'&&typeof vals[c.id]==='boolean') vals[c.id]=vals[c.id]?'sim':'nao';
  });
  document.getElementById('m-ent-tit').textContent=(_entEditId?'Editar — ':'Novo — ')+e.titulo;
  document.getElementById('m-ent-body').innerHTML=
    `<div class="alerta al-info" style="font-size:11.5px;">${esc(e.desc)} <span class="sys">${esc(e.sys)}</span></div>
     <div class="form-row">${e.campos.map(c=>campoHtml(c,vals[c.id])).join('')}</div>`;
  document.getElementById('m-ent-foot').innerHTML=`
    <button class="btn btn-secondary" onclick="closeModal('m-ent')">Cancelar</button>
    <button class="btn btn-primary" onclick="salvarEnt('${k}')">💾 Salvar</button>`;
  document.getElementById('m-ent').classList.remove('hidden');
}
async function salvarEnt(k){
  if(!guardAction('bpf','edit'))return;
  const e=ENTIDADES[k], vals=lerForm(e.campos);
  const falt=faltando(e.campos,vals);
  if(falt.length){toast('Falta preencher: '+falt.slice(0,3).join(', '),'warning');return;}

  // Travas específicas de cadastro
  if(k==='calibracoes'&&vals.peso_padrao_id){
    const p=(_ent.pesos_padrao||[]).find(x=>x.id===vals.peso_padrao_id);
    const tv=_travas.find(t=>t.codigo==='peso_padrao_vencido');
    if(tv?.ativa&&p&&diasAte(p.validade)<0){
      toast(`SYS-039: o peso-padrão ${p.identificacao} está com certificado vencido — não é possível registrar a verificação.`,'danger');return;}
  }
  if(k==='equip_saidas'&&vals.status==='liberado'){
    const tv=_travas.find(t=>t.codigo==='equip_sem_certificado');
    const row=(_ent[k]||[]).find(x=>x.id===_entEditId);
    if(tv?.ativa&&!(row?.certificado_path)){
      toast('SYS-029: sem o certificado anexado, o equipamento não reentra em operação.','danger');return;}
  }

  const payload={};
  e.campos.forEach(c=>{
    let v=vals[c.id];
    if(v==='') v=null;
    if(c.tipo==='sim_nao') v = v==='sim'?true : v==='nao'?false : null;
    if(c.tipo==='numero'&&v!=null) v=parseFloat(v);
    payload[c.id]=v;
  });

  const r=_entEditId
    ? await db(_supabase.from(e.tabela).update(payload).eq('id',_entEditId),'salvar '+e.titulo)
    : await db(_supabase.from(e.tabela).insert(payload),'salvar '+e.titulo);
  if(r.error)return;
  await addLog(_entEditId?'UPDATE':'CREATE','BPF',payload[e.colunas[0].id]||'—',e.titulo);

  // Instrumento com calibração reprovada é bloqueado na hora.
  if(k==='calibracoes'&&payload.resultado==='reprovado'&&payload.instrumento_id){
    await db(_supabase.from('bpf_instrumentos').update({status:'bloqueado'}).eq('id',payload.instrumento_id),'bloquear instrumento');
    toast('Calibração reprovada — instrumento marcado como bloqueado.','warning');
  }
  closeModal('m-ent');toast('Salvo.','success');
  await carregar();renderNav();abrirEnt(k);
}

let _simplesCfg=null;
function abrirSimples(tabela,titulo,campos,id){
  if(!guardAction('bpf','edit'))return;
  const lista={bpf_ncs:_ncs,bpf_auditorias:_auds,bpf_treinamentos:_treins}[tabela]||[];
  const row=id?lista.find(x=>x.id===id)||{}:{};
  _simplesCfg={tabela,campos,id:id||null};
  _formAtual=null;
  document.getElementById('m-ent-tit').textContent=(id?'Editar — ':'Novo — ')+titulo;
  document.getElementById('m-ent-body').innerHTML=`<div class="form-row">${campos.map(c=>campoHtml(c,row[c.id])).join('')}</div>`;
  document.getElementById('m-ent-foot').innerHTML=`
    <button class="btn btn-secondary" onclick="closeModal('m-ent')">Cancelar</button>
    <button class="btn btn-primary" onclick="salvarSimples()">💾 Salvar</button>`;
  document.getElementById('m-ent').classList.remove('hidden');
}
async function salvarSimples(){
  if(!guardAction('bpf','edit')||!_simplesCfg)return;
  const {tabela,campos,id}=_simplesCfg;
  const vals=lerForm(campos);
  const falt=faltando(campos,vals);
  if(falt.length){toast('Falta preencher: '+falt.slice(0,3).join(', '),'warning');return;}
  const payload={};
  campos.forEach(c=>{let v=vals[c.id];if(v==='')v=null;if(c.tipo==='numero'&&v!=null)v=parseFloat(v);payload[c.id]=v;});
  const r=id?await db(_supabase.from(tabela).update(payload).eq('id',id),'salvar')
            :await db(_supabase.from(tabela).insert(payload),'salvar');
  if(r.error)return;
  await addLog(id?'UPDATE':'CREATE','BPF',tabela,JSON.stringify(payload).slice(0,120));
  closeModal('m-ent');toast('Salvo.','success');
  await carregar();renderNav();
  ({bpf_ncs:renderNCs,bpf_auditorias:renderAuditorias,bpf_treinamentos:renderTreinamentos}[tabela])();
}

function renderDocs(){
  cab('POP-12 · Controle de documentos','Lista mestra de documentos','');
  const ord={manual:0,pop:1,it:2,reg:3};
  const l=_docs.slice().sort((a,b)=>(ord[a.tipo]-ord[b.tipo])||a.codigo.localeCompare(b.codigo));
  const pt=t=>_docs.filter(d=>d.tipo===t).length;
  const revVenc=_docs.filter(d=>d.proxima_revisao&&diasAte(d.proxima_revisao)<0);
  document.getElementById('conteudo').innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="v">${pt('manual')}</div><div class="l">Manual</div></div>
      <div class="kpi"><div class="v">${pt('pop')}</div><div class="l">POPs</div></div>
      <div class="kpi"><div class="v">${pt('it')}</div><div class="l">Instruções</div></div>
      <div class="kpi"><div class="v">${pt('reg')}</div><div class="l">Registros</div></div>
      <div class="kpi ${revVenc.length?'dang':'ok'}"><div class="v">${revVenc.length}</div><div class="l">Revisão vencida</div></div>
    </div>
    <div class="alerta al-info">Base do controle documental (SYS-018). Documento obsoleto permanece na lista com status
      <strong>obsoleto</strong> — nunca some, porque a rastreabilidade depende dele.</div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr>
      <th>Código</th><th>Tipo</th><th>Título</th><th>Rev.</th><th>Status</th><th>POP</th><th>Próx. revisão</th></tr></thead>
      <tbody>${l.map(d=>{const dd=d.proxima_revisao?diasAte(d.proxima_revisao):null;
        return `<tr><td class="num">${esc(d.codigo)}</td>
        <td style="text-transform:uppercase;font-size:10px;font-weight:800;color:#94a3b8;">${esc(d.tipo)}</td>
        <td>${esc(d.titulo)}</td><td>${esc(d.revisao)}</td>
        <td><span class="badge badge-${d.status==='vigente'?'success':d.status==='obsoleto'?'gray':'warning'}">${esc(d.status)}</span></td>
        <td style="color:#64748b;">${esc(d.pop_cod||'—')}</td>
        <td>${d.proxima_revisao?`<span class="badge badge-${dd<0?'danger':dd<=60?'warning':'gray'}">${fmtD(d.proxima_revisao)}</span>`:'—'}</td></tr>`;
      }).join('')}</tbody></table></div>
    <div class="sec-card" style="margin-top:14px;"><h3>Arquivos anexados ao SGQ (${_anexos.length})</h3>
      <div class="sub" style="margin-bottom:9px;">Manual, POPs e ITs em PDF. Anexos de registro ficam no próprio registro.</div>
      ${_anexos.length?_anexos.slice(0,40).map(a=>`<div class="anx"><span>📎</span><span class="nm">${esc(a.nome)}</span>
        <span style="color:#94a3b8;font-size:11px;">${a.tamanho?(a.tamanho/1024).toFixed(0)+' KB':''}</span>
        ${a.path_storage?`<button class="btn btn-ghost btn-sm" onclick="baixarAnexo('${esc(a.path_storage)}')">abrir</button>`
          :a.url?`<a class="btn btn-ghost btn-sm" href="${esc(a.url)}" target="_blank">abrir</a>`:''}</div>`).join('')
        :'<span style="font-size:11.5px;color:#94a3b8;">Nenhum arquivo.</span>'}
      <input type="file" id="doc-in" multiple style="font-size:12px;margin-top:9px;" onchange="subirDocumento(this)"></div>`;
}
async function subirDocumento(inp){
  if(!guardAction('bpf','edit'))return;
  const u=getUser();
  for(const file of inp.files){
    if(file.size>25*1024*1024){toast(`${file.name}: acima de 25 MB`,'warning');continue;}
    const path=`bpf/docs/${Date.now()}_${file.name.replace(/[^\w.\-]/g,'_')}`;
    try{
      const {error}=await _supabase.storage.from('documentos').upload(path,file);
      if(error)throw error;
      const r=await db(_supabase.from('bpf_documentos').insert({nome:file.name,
        tipo:file.type||'application/octet-stream',tamanho:file.size,path_storage:path,
        enviado_por:u?.nome||u?.email||'Sistema'}),'registrar documento');
      if(!r.error) toast(`${file.name} anexado.`,'success');
    }catch(e){ toast('Falha ao anexar: '+(e.message||e),'danger'); }
  }
  inp.value='';await carregar();renderDocs();
}

function renderTravas(){
  cab('BPF / SGQ','Travas do sistema','');
  const ativas=_travas.filter(t=>t.ativa).length;
  let h=`<div class="alerta al-info">Cada trava do fluxograma é uma linha de <code>bpf_travas</code>; ligar e desligar não exige deploy.
    <strong>Ligue uma de cada vez</strong>, testando o módulo alvo — se ligar tudo junto e o cadastro travar, você não descobre qual causou.
    <div style="margin-top:5px;"><strong>${ativas} de ${_travas.length}</strong> ativas.</div></div>`;
  const pm={};_travas.forEach(t=>{(pm[t.modulo_alvo||'bpf'] ||= []).push(t);});
  for(const [mod,lst] of Object.entries(pm)){
    h+=`<div class="sec-card"><h3>Atua em: ${esc(mod)}</h3>
      <div class="sub" style="margin-bottom:9px;">${mod==='bpf'?'Dentro deste módulo — funciona assim que ligada.'
        :'Exige que o módulo '+esc(mod)+'.html leia bpf_travas para ter efeito.'}</div>
      ${lst.map(t=>`<div class="trava"><div class="sw ${t.ativa?'on':''}" onclick="alternarTrava('${t.codigo}')"></div>
        <div style="flex:1;"><div class="nm">${esc(t.nome)} <span class="sys">${esc(t.sys_ref)}</span>
          ${t.severidade==='alerta'?'<span class="badge badge-warning">alerta</span>':''}</div>
          <div class="ds">${esc(t.descricao||'')}</div></div>
        <span class="badge badge-gray">${esc(t.pop_cod||'—')}</span></div>`).join('')}</div>`;
  }
  document.getElementById('conteudo').innerHTML=h;
}
async function alternarTrava(cod){
  if(!guardAction('bpf','edit'))return;
  const t=_travas.find(x=>x.codigo===cod);if(!t)return;
  const nova=!t.ativa;
  if(nova&&t.modulo_alvo!=='bpf'){
    if(!confirm(`A trava "${t.nome}" atua no módulo ${t.modulo_alvo}.\n\nLigar aqui NÃO altera o ${t.modulo_alvo}.html sozinho — aquele módulo precisa ler bpf_travas.\nAté lá, ela fica registrada como intenção, sem efeito prático.\n\nLigar assim mesmo?`))return;
  }
  const u=getUser();
  const r=await db(_supabase.from('bpf_travas').update({ativa:nova,
    ativada_em:nova?new Date().toISOString():null,ativada_por:nova?(u?.nome||u?.email):null}).eq('codigo',cod),'alterar trava');
  if(r.error)return;
  await addLog('UPDATE','BPF',cod,(nova?'Trava LIGADA: ':'Trava desligada: ')+t.nome);
  toast(nova?'Trava ligada.':'Trava desligada.',nova?'success':'warning');
  await carregar();renderTravas();
}
