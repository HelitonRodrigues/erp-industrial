/* IMPRESSÃO
   O bug anterior: a área de impressão ficava com display:none e o @media print
   tentava revelá-la com visibility:visible. Não funciona — elemento com
   display:none não entra na renderização, então saía folha em branco.
   A correção é alternar display, não visibility. */
#print-area{display:none;}
@media print{
  body>*{display:none!important;}
  #print-area{display:block!important;position:static;width:100%;padding:0;margin:0;}
  #print-area table{page-break-inside:auto;}
  #print-area tr{page-break-inside:avoid;}
  @page{margin:12mm;}
}

<script>
// ═══════════════════════════════════════════════════════════════════════════
// BPF / SGQ — Gestão da qualidade para nutrição animal · Silicate
//
// TRÊS MOTORES, NENHUM CÓDIGO POR PROCEDIMENTO:
//  1. REGISTROS — os 34 REG-POPxx-yy vêm de bpf_formularios (campos em jsonb).
//     "conforme" e min/max transformam a regra do POP em bloqueio automático.
//  2. CADASTROS — as 15 entidades com ciclo de vida saem do objeto ENTIDADES.
//  3. PAINÉIS DO ERP — cada POP mostra o dado que já existe nos outros
//     módulos (produção, almoxarifado, laboratório, manutenção, expedição).
//
// Fontes: Requisitos_Sistema.md (45 SYS) · Índice Mestre · seção 6 e 6.1 dos
// 21 POPs · Fluxograma de Gatilhos e Fronteiras.
// ═══════════════════════════════════════════════════════════════════════════

let _pops=[],_forms=[],_regs=[],_travas=[],_docs=[],_funcs=[],_desig=[];
let _ncs=[],_auds=[],_treins=[],_anexos=[],_funcionarios=[];
let _ent={},_erpCache={},_erpLinhas={};
let _sec='painel',_popSel=null,_entSel=null,_formAtual=null,_anexosTmp=[],_entEditId=null,_simplesCfg=null,_origem=null;

const GRUPOS=[
  {id:'fluxo',label:'Fluxo do produto'},
  {id:'desvio',label:'Desvio — saída do fluxo'},
  {id:'apoio',label:'Apoio — governam o fluxo'},
  {id:'pre_requisito',label:'Pré-requisitos de ambiente e pessoas'},
];

// ═══════════════════════════════════════════════════════════════════════════
// ESCOPO DO BPF — o que é nutrição animal
//
// O sistema de qualidade cobre SÓ a produção para alimentação animal:
// Linha 2 e Longa Vida, em sacaria de 25 kg (papel kraft valvulado, POP-01 6.a)
// e Big Bag. Linha 3, Sikal Concentrado e demais produtos são outra operação e
// não entram em nenhum registro, painel ou indicador daqui.
//
// Os limites do POP-18 6.c confirmam o escopo: sacaria 25,000–25,200 kg e
// Big Bag 1.000 kg ± 1 kg. Não há tolerância definida para nenhum outro produto.
// ═══════════════════════════════════════════════════════════════════════════
const ESCOPO={
  linhas:['Linha 2','Longa Vida'],
  // 25 kg (com ou sem espaço) ou Big Bag / BB / bag
  reProduto:/(^|[^\d])25\s*kg|big\s*-?\s*bag|\bbag\b/i,
  ativo:true,
};
function produtoNoEscopo(p){ return ESCOPO.reProduto.test(String(p||'')); }
function linhaNoEscopo(l){
  const v=String(l||'').trim();
  return !v || ESCOPO.linhas.some(x=>x.toLowerCase()===v.toLowerCase());
}
// Uma linha do ERP entra se a linha bate E pelo menos um produto bate.
// Campo ausente não reprova — a tabela pode simplesmente não ter aquela coluna.
function noEscopo(r){
  if(!ESCOPO.ativo) return true;
  const l=r.linha??r.linha_producao??r.linha_produto;
  if(l!==undefined&&l!==null&&String(l).trim()!==''&&!linhaNoEscopo(l)) return false;
  let prods=[];
  if(Array.isArray(r.produtos_op)) prods=r.produtos_op.map(x=>x&&(x.produto||x.nome)).filter(Boolean);
  const p=r.produto??r.produto_nome??r.item_nome;
  if(p) prods.push(p);
  if(!prods.length) return true;              // sem informação de produto: não exclui
  return prods.some(produtoNoEscopo);
}
function bannerEscopo(){
  return `<div class="alerta ${ESCOPO.ativo?'al-info':'al-warn'}" style="display:flex;gap:11px;align-items:flex-start;">
    <div style="flex:1;">
      ${ESCOPO.ativo
        ? `<strong>Escopo do BPF:</strong> ${ESCOPO.linhas.join(' e ')} · sacaria 25 kg e Big Bag.
           Linha 3, Sikal Concentrado e demais produtos não entram — são outra operação.`
        : `<strong>Escopo desligado.</strong> Está aparecendo produção que <u>não</u> é de alimentação animal.
           Use só para conferência; volte a ligar antes de registrar qualquer coisa.`}
    </div>
    <button class="btn btn-secondary btn-sm" onclick="alternarEscopo()" style="flex-shrink:0;">
      ${ESCOPO.ativo?'Ver tudo':'Voltar ao escopo'}</button></div>`;
}
function alternarEscopo(){
  ESCOPO.ativo=!ESCOPO.ativo;
  _erpCache={};
  toast(ESCOPO.ativo?'Escopo do BPF reativado.':'Mostrando TODAS as linhas e produtos.',ESCOPO.ativo?'success':'warning');
  voltar();
}

// ── COLUNAS DERIVADAS ──────────────────────────────────────────────────────
// O lote NÃO é uma coluna da tabela `producao`: ele vive dentro do jsonb
// `produtos_op`, um por produto da OP. Mesma lógica do `loteDe()` do
// carregamento.html — se o BPF derivasse diferente, dariam lotes divergentes
// para a mesma OP.
function itensDaOP(r){ return Array.isArray(r.produtos_op)?r.produtos_op.filter(Boolean):[]; }
function lotesDaOP(r){
  const l=[...new Set(itensDaOP(r).map(x=>x.lote).filter(Boolean).map(String))];
  if(l.length) return l.join(' · ');
  return r.lote||'';
}
function produtosDaOP(r){
  const p=[...new Set(itensDaOP(r).map(x=>x.produto).filter(Boolean))];
  if(p.length) return p.join(' · ');
  return r.produto||'';
}
function sacosDaOP(r){
  const it=itensDaOP(r);
  if(it.length) return it.reduce((s,x)=>s+(Number(x.total_sacos)||0),0);
  return r.total_sacos??'';
}
// Derivadas disponíveis nos painéis: basta citar a chave em `cols`.
const DERIV={
  _lote:   {l:'Lote',      fn:lotesDaOP},
  _prods:  {l:'Produtos',  fn:produtosDaOP},
  _sacos:  {l:'Sacos',     fn:sacosDaOP},
};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoje=()=>new Date().toISOString().split('T')[0];
const fmtD=d=>d?String(d).split('T')[0].split('-').reverse().join('/'):'—';
const fmtDH=d=>{if(!d)return '—';const x=new Date(d);return x.toLocaleDateString('pt-BR')+' '+x.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});};
const diasAte=d=>d?Math.ceil((new Date(String(d).split('T')[0])-new Date(hoje()))/864e5):null;
const cap=s=>String(s||'').replace(/_/g,' ').replace(/^./,c=>c.toUpperCase());
const nomeFuncao=c=>_funcs.find(f=>f.codigo===c)?.nome||c||'—';
const ehData=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}/.test(v);

function _fecharDlg(){document.getElementById('dlg-host').innerHTML='';}
function _dlg(html){document.getElementById('dlg-host').innerHTML=`<div class="dlg-ov" id="dlg-ov">${html}</div>`;}
const _ICO={info:'ℹ️',ok:'✅',warn:'⚠️',dang:'⛔',pergunta:'❓'};

function uiAlerta(msg,{titulo='Aviso',tipo='info',ok='Entendi'}={}){
  return new Promise(res=>{
    _dlg(`<div class="dlg"><div class="dlg-hd"><span class="dlg-ic">${_ICO[tipo]||'ℹ️'}</span>
      <div class="dlg-tt">${esc(titulo)}</div></div>
      <div class="dlg-bd">${msg}</div>
      <div class="dlg-ft"><button class="btn btn-primary" id="dlg-ok">${esc(ok)}</button></div></div>`);
    document.getElementById('dlg-ok').onclick=()=>{_fecharDlg();res(true);};
    document.getElementById('dlg-ok').focus();
  });
}
function uiConfirma(msg,{titulo='Confirmar',tipo='pergunta',ok='Confirmar',cancelar='Cancelar',perigo=false}={}){
  return new Promise(res=>{
    _dlg(`<div class="dlg"><div class="dlg-hd"><span class="dlg-ic">${_ICO[tipo]||'❓'}</span>
      <div class="dlg-tt">${esc(titulo)}</div></div>
      <div class="dlg-bd">${msg}</div>
      <div class="dlg-ft"><button class="btn btn-secondary" id="dlg-no">${esc(cancelar)}</button>
      <button class="btn ${perigo?'btn-danger':'btn-primary'}" id="dlg-si">${esc(ok)}</button></div></div>`);
    document.getElementById('dlg-no').onclick=()=>{_fecharDlg();res(false);};
    document.getElementById('dlg-si').onclick=()=>{_fecharDlg();res(true);};
    document.getElementById('dlg-si').focus();
  });
}
function uiTexto(msg,{titulo='Informe',rotulo='',ok='Salvar',obrigatorio=true,linhas=3}={}){
  return new Promise(res=>{
    _dlg(`<div class="dlg"><div class="dlg-hd"><span class="dlg-ic">✏️</span><div class="dlg-tt">${esc(titulo)}</div></div>
      <div class="dlg-bd">${msg}
        <div class="fld" style="margin-top:11px;">${rotulo?`<label>${esc(rotulo)}</label>`:''}
        <textarea class="form-input" id="dlg-tx" rows="${linhas}"></textarea></div>
        <div id="dlg-err" style="color:var(--danger);font-size:11.5px;margin-top:6px;"></div></div>
      <div class="dlg-ft"><button class="btn btn-secondary" id="dlg-no">Cancelar</button>
      <button class="btn btn-primary" id="dlg-si">${esc(ok)}</button></div></div>`);
    const tx=document.getElementById('dlg-tx');tx.focus();
    document.getElementById('dlg-no').onclick=()=>{_fecharDlg();res(null);};
    document.getElementById('dlg-si').onclick=()=>{
      const v=tx.value.trim();
      if(obrigatorio&&!v){document.getElementById('dlg-err').textContent='Este campo é obrigatório.';tx.focus();return;}
      _fecharDlg();res(v);
    };
  });
}
// Visualizador de anexo: imagem e PDF abrem aqui dentro; o resto oferece download.
// bucket opcional: as fotos enviadas pelo cliente vivem em `publico-anexos`,
// separado do `documentos` por segurança — lá o anon pode inserir, aqui não.
async function uiVisualizar(path,nome,bucket){
  const ext=String(nome||path).split('.').pop().toLowerCase();
  _dlg(`<div class="dlg" style="max-width:920px;"><div class="dlg-hd"><span class="dlg-ic">📎</span>
    <div class="dlg-tt">${esc(nome||path)}</div></div>
    <div class="dlg-bd" id="vw-bd"><span class="spin"></span> Abrindo…</div>
    <div class="dlg-ft" id="vw-ft"><button class="btn btn-secondary" onclick="_fecharDlg()">Fechar</button></div></div>`);
  let url=null;
  try{
    const {data,error}=await _supabase.storage.from(bucket||'documentos').createSignedUrl(path,600);
    if(error)throw error;
    url=data.signedUrl;
  }catch(e){
    document.getElementById('vw-bd').innerHTML=
      `<div class="alerta al-dang" style="margin:0;">Não foi possível abrir o arquivo.<br>
       <span style="font-size:11px;">${esc(e.message||e)}</span></div>`;
    return;
  }
  const bd=document.getElementById('vw-bd');
  if(['png','jpg','jpeg','webp','gif','avif','bmp'].includes(ext))
    bd.innerHTML=`<div class="vw-box" style="display:flex;align-items:center;justify-content:center;padding:8px;"><img src="${url}" alt="${esc(nome)}"></div>`;
  else if(ext==='pdf')
    bd.innerHTML=`<iframe class="vw-box" src="${url}" title="${esc(nome)}"></iframe>`;
  else
    bd.innerHTML=`<div class="alerta al-info" style="margin:0;">Pré-visualização não disponível para <strong>.${esc(ext)}</strong>.
      Use o botão de download.</div>`;
  document.getElementById('vw-ft').insertAdjacentHTML('afterbegin',
    `<a class="btn btn-primary" href="${url}" target="_blank" rel="noopener" download="${esc(nome||'')}">⬇️ Baixar</a>`);
}

async function init(){
  const u=getUser();
  if(u){
    document.getElementById('top-user-name').textContent=u.nome||u.email||'—';
    document.getElementById('top-user-perfil').textContent=u.perfil||'—';
    document.getElementById('top-avatar').textContent=(u.nome||u.email||'?').slice(0,2).toUpperCase();
  }
  try{ if(localStorage.getItem('bpf-nav-off')==='1') alternarNav(true); }catch(e){}
  await carregar();
  renderNav();
  // A varredura é PULL: roda ao abrir o módulo, não é trigger no Postgres.
  if(_temFila && _gatilhos.some(g=>g.ativo)){
    try{ await varrerGatilhos(true); }catch(e){ console.warn('[varredura]',e); }
  }
  ir(_temFila && (minhasTarefas().length||pendenciasAssinatura().filter(podeAssinar).length) ? 'fila' : 'painel');
}

async function carregar(){
  const s=async(q,ctx)=>{const r=await db(q,ctx);return r.data||[];};
  const [docs,forms,travas,funcs,desig,ncs,auds,treins,anexos,fn]=await Promise.all([
    s(_supabase.from('bpf_documentos_mestre').select('*').order('ordem').order('codigo'),'documentos'),
    s(_supabase.from('bpf_formularios').select('*').eq('ativo',true).order('pop_cod').order('ordem'),'formulários'),
    s(_supabase.from('bpf_travas').select('*').order('sys_ref'),'travas'),
    s(_supabase.from('bpf_funcoes').select('*').eq('ativo',true).order('ordem'),'funções'),
    s(_supabase.from('bpf_designacoes').select('*').order('funcionario_nome'),'designações'),
    s(_supabase.from('bpf_ncs').select('*').order('data',{ascending:false}).limit(500),'NCs'),
    s(_supabase.from('bpf_auditorias').select('*').order('data',{ascending:false}).limit(300),'auditorias'),
    s(_supabase.from('bpf_treinamentos').select('*').order('data',{ascending:false}).limit(300),'treinamentos'),
    s(_supabase.from('bpf_documentos').select('*').order('created_at',{ascending:false}).limit(300),'anexos'),
    s(_supabase.from('funcionarios').select('id,nome,funcao').eq('status','ativo').order('nome'),'funcionários'),
  ]);
  _docs=docs;_forms=forms;_travas=travas;_funcs=funcs;_desig=desig;
  _ncs=ncs;_auds=auds;_treins=treins;_anexos=anexos;_funcionarios=fn;
  _pops=docs.filter(d=>d.tipo==='pop');
  const dl=document.getElementById('lst-func');
  if(dl) dl.innerHTML=_funcionarios.map(f=>`<option value="${esc(f.nome)}">`).join('');

  // Recentes + TUDO em aberto: "estado atual" não pode ser filtrado por
  // recência, senão some registro antigo ainda pendente de assinatura.
  const [rec,ab]=await Promise.all([
    s(_supabase.from('bpf_registros').select('*').order('data',{ascending:false}).limit(500),'registros'),
    s(_supabase.from('bpf_registros').select('*').in('status',['rascunho','aguardando_assinatura','nao_conforme']).limit(500),'registros em aberto'),
  ]);
  const m=new Map();[...rec,...ab].forEach(r=>m.set(r.id,r));
  _regs=[...m.values()].sort((a,b)=>String(b.data).localeCompare(String(a.data)));

  // Camada de fila (002_bpf_fila.sql). Se as tabelas ainda não existem, o
  // módulo continua funcionando exatamente como antes — só sem fila.
  try{
    const [gt,tf]=await Promise.all([
      lst(_supabase.from('bpf_gatilhos').select('*').order('pop_cod').order('codigo')),
      lst(_supabase.from('bpf_tarefas').select('*').order('prazo').limit(1000)),
    ]);
    _gatilhos=gt; _tarefas=tf; _temFila=true;
  }catch(e){ _gatilhos=[]; _tarefas=[]; _temFila=false; }

  const ks=Object.keys(ENTIDADES);
  const res=await Promise.all(ks.map(k=>{
    const e=ENTIDADES[k];
    let q=_supabase.from(e.tabela).select('*').limit(1000);
    if(e.ordem)q=q.order(e.ordem,{ascending:!e.desc_ordem});
    return s(q,e.titulo);
  }));
  ks.forEach((k,i)=>_ent[k]=res[i]);

  // guarda o conjunto completo e aplica o escopo do usuário
  _popsAll=_pops; _formsAll=_forms; _regsAll=_regs; _ncsAll=_ncs;
  aplicarEscopo();
}

// ── ALERTAS ────────────────────────────────────────────────────────────────
function alertas(){
  const a=[];
  (_ent.instrumentos||[]).forEach(i=>{
    if(i.status==='inativo')return;
    const u=(_ent.calibracoes||[]).filter(c=>c.instrumento_id===i.id)
      .sort((x,y)=>String(y.validade).localeCompare(String(x.validade)))[0];
    if(!u)a.push({t:'warn',pop:'POP-07',ent:'instrumentos',m:`Instrumento ${i.tag} ainda sem calibração registrada`});
    else{const d=diasAte(u.validade);
      if(d<0)a.push({t:'dang',pop:'POP-07',ent:'instrumentos',m:`Instrumento ${i.tag} com calibração VENCIDA em ${fmtD(u.validade)}`});
      else if(d<=60)a.push({t:'warn',pop:'POP-07',ent:'instrumentos',m:`Instrumento ${i.tag} vence a calibração em ${d} dia(s)`});}
  });
  (_ent.pesos_padrao||[]).forEach(p=>{const d=diasAte(p.validade);
    if(d!==null&&d<0&&p.status!=='inativo')a.push({t:'dang',pop:'POP-07',ent:'pesos_padrao',m:`Peso-padrão ${p.identificacao} com certificado vencido`});});
  (_ent.prestadores_qualif||[]).forEach(p=>{const d=diasAte(p.validade);
    if(d!==null&&d<0)a.push({t:'dang',pop:'POP-17',ent:'prestadores_qualif',m:`${p.nome} com acreditação vencida — envio suspenso`});});
  (_ent.fornecedores_qualif||[]).forEach(f=>{const d=diasAte(f.reavaliacao_em);
    if(d!==null&&d<0&&['A','B'].includes(f.categoria_risco))a.push({t:'warn',pop:'POP-01',ent:'fornecedores_qualif',m:`${f.nome} (risco ${f.categoria_risco}) com reavaliação vencida`});});
  (_ent.equip_saidas||[]).forEach(s=>{
    if(s.status==='retornado_bloqueado')a.push({t:'dang',pop:'POP-07',ent:'equip_saidas',m:`${s.descricao} retornou sem certificado — não reentra em operação`});
    if(s.status==='fora'&&s.previsao_retorno&&diasAte(s.previsao_retorno)<0)
      a.push({t:'warn',pop:'POP-07',ent:'equip_saidas',m:`${s.descricao} passou da previsão de retorno`});});
  (_ent.visitantes||[]).forEach(v=>{const d=diasAte(v.integracao_validade);
    if(d!==null&&d<0&&v.status==='liberado')a.push({t:'warn',pop:'POP-04',ent:'visitantes',m:`${v.nome} com integração de BPF vencida`});});
  // Reclamação de cliente chega sozinha pelo canal público, igual à do
  // colaborador. Se ninguém abrir a tela, o prazo de 15 dias corre à revelia.
  (_ent.reclamacoes||[]).forEach(r=>{
    if(r.status==='encerrada')return;
    const dPrazo=diasAte(r.prazo_ate), idade=-(diasAte(r.data_recebimento)||0);
    if(dPrazo!==null&&dPrazo<0)
      a.push({t:'dang',pop:'POP-19',ent:'reclamacoes',m:`Reclamação ${r.numero} (${r.cliente||'cliente'}) FORA DO PRAZO há ${-dPrazo} dia(s)`});
    else if(idade<=7)
      a.push({t:'dang',pop:'POP-19',ent:'reclamacoes',novo:true,
        m:`NOVA reclamação de cliente — ${r.numero} · ${r.cliente||'—'}${r.lote_ref?' · lote '+r.lote_ref:''}, ${idade===0?'hoje':'há '+idade+' dia(s)'}`});
    else if(dPrazo!==null&&dPrazo<=5)
      a.push({t:'warn',pop:'POP-19',ent:'reclamacoes',m:`Reclamação ${r.numero} vence em ${dPrazo} dia(s)`});});
  // O canal é público e chega sozinho — se ninguém olhar, a manifestação
  // morre sem tratamento, que é justamente o que a IN 04/2007 8.1 proíbe.
  (_ent.manifestacoes||[]).forEach(x=>{
    if(x.status!=='aberta')return;
    const d=-(diasAte(x.data)||0);
    const rot=x.anonimo?'anônima':'de '+(x.autor_nome||'colaborador');
    if(d<=7) a.push({t:'dang',pop:'POP-19',ent:'manifestacoes',novo:true,
      m:`NOVA manifestação ${rot} — ${x.numero} (${cap(x.tema)}), recebida ${d===0?'hoje':'há '+d+' dia(s)'}`});
    else if(d<=30) a.push({t:'warn',pop:'POP-19',ent:'manifestacoes',
      m:`Manifestação ${x.numero} sem tratamento há ${d} dias`});
    else a.push({t:'dang',pop:'POP-19',ent:'manifestacoes',
      m:`Manifestação ${x.numero} aberta há ${d} dias — muito além do razoável para tratativa`});});
  (_ent.rotulos||[]).forEach(r=>{const d=diasAte(r.reavaliacao_em);
    if(d!==null&&d<0&&r.status==='vigente')a.push({t:'warn',pop:'POP-15',ent:'rotulos',m:`Rótulo de ${r.produto_nome} v${r.versao} com reavaliação anual vencida`});
    if(r.status==='vigente'&&!r.aprovado_rt)a.push({t:'dang',pop:'POP-15',ent:'rotulos',m:`Rótulo de ${r.produto_nome} vigente SEM aprovação do RT`});});
  _regs.forEach(r=>{const d=diasAte(r.validade);
    if(d!==null&&d<0&&!r.cancelado_em)a.push({t:'dang',pop:r.pop_cod,m:`Registro ${r.numero} com validade vencida`});});
  _ncs.filter(n=>n.status!=='encerrado'&&n.prazo).forEach(n=>{
    if(diasAte(n.prazo)<0)a.push({t:'dang',pop:n.procedimento_cod,m:`NC de ${fmtD(n.data)} fora do prazo`});});
  const prox=new Date().getFullYear()+1;
  if(new Date().getMonth()===11)['auditoria','treinamento'].forEach(t=>{
    if(!(_ent.cronograma||[]).some(c=>c.ano===prox&&c.tipo===t))
      a.push({t:'warn',pop:'POP-20',ent:'cronograma',m:`Cronograma de ${t} de ${prox} ainda não cadastrado (SYS-026)`});});
  return a;
}

function filtrarNav(t){
  const q=(t||'').toLowerCase().trim();
  document.querySelectorAll('.nav-it').forEach(el=>{el.style.display=!q||el.dataset.busca.includes(q)?'':'none';});
  document.querySelectorAll('.nav-grp').forEach(g=>{
    let n=g.nextElementSibling,v=false;
    while(n&&n.classList.contains('nav-it')){if(n.style.display!=='none')v=true;n=n.nextElementSibling;}
    g.style.display=v?'':'none';});
}
function marcarNav(c){document.querySelectorAll('.nav-it').forEach(e=>e.classList.toggle('on',e.dataset.cod===c));}
function ir(sec){
  _sec=sec;_popSel=null;_entSel=null;marcarNav(null);

// Consulta resiliente + escopo aplicado AQUI, na camada de busca.
// Antes o filtro era marcado painel a painel e um deles escapou — produção da
// Linha 3 e da Emitec vazou para a tela. Agora é o contrário: todo painel é
// filtrado por padrão, e quem não deve ser precisa dizer `semEscopo:true`.
// Tabela sem coluna de linha/produto passa direto (noEscopo devolve true).
async function buscaERP(p){
  const monta=(comOrdem)=>{
    let q=_supabase.from(p.tab).select('*').limit(p.lim||25);
    if(p.filtro) q=p.filtro(q);
    if(comOrdem&&p.ord) q=q.order(p.ord[0],{ascending:p.ord[1]});
    return q;
  };
  let r=await monta(true);
  let semOrdem=false;
  if(r.error&&p.ord){
    const r2=await monta(false);
    if(!r2.error){ r=r2; semOrdem=true; }
    else r=r2;
  }
  if(r.error) throw r.error;
  let linhas=r.data||[];
  const antes=linhas.length;
  if(!p.semEscopo) linhas=linhas.filter(noEscopo);
  const cortadas=antes-linhas.length;
  if(p.pos) linhas=p.pos(linhas);
  return {data:linhas,semOrdem,cortadas};
}

async function carregarERP(cod){
  const paineis=ERP[cod]||[];
  const out=document.getElementById('erp-out');if(!out)return;
  const blocos=await Promise.all(paineis.map(async p=>{
    const chave=cod+'|'+p.t;
    if(_erpCache[chave])return _erpCache[chave];
    let html;
    try{
      const {data,semOrdem,cortadas}=await buscaERP(p);
      html=tabelaERP(p,data||[],semOrdem,cortadas);
    }catch(e){
      // Protocolo #7: falha aparece, não some — e diz o que fazer.
      const msg=String(e.message||e);
      const naoExiste=/does not exist|schema cache|relation/i.test(msg);
      html=`<div class="sec-card" style="margin-bottom:10px;"><h3>${esc(p.t)}</h3>
        <div class="alerta al-warn" style="margin:8px 0 0;">
        ${naoExiste?`A tabela <code>${esc(p.tab)}</code> não existe neste banco — o módulo de origem provavelmente ainda não foi usado.`
                   :`Não foi possível ler <code>${esc(p.tab)}</code>.`}
        <div style="font-size:11px;margin-top:4px;color:#92400e;">${esc(msg)}</div></div></div>`;
    }
    _erpCache[chave]=html;return html;
  }));
  out.innerHTML=blocos.join('');
}
function tabelaERP(p,linhas,semOrdem,cortadas){
  if(!linhas.length)
    return `<div class="sec-card" style="margin-bottom:10px;"><h3>${esc(p.t)}</h3>
      <div class="sub" style="margin-top:5px;">${esc(p.vazio||'Nenhum registro encontrado em '+p.tab+'.')}
      ${cortadas?` <strong>${cortadas} registro(s) foram ocultados por estarem fora do escopo do BPF.</strong>`:''}</div></div>`;
  const chaves=Object.keys(linhas[0]);
  // derivada entra mesmo sem existir como coluna no banco
  let cols=(p.cols||[]).filter(c=>chaves.includes(c)||DERIV[c]);
  if(!cols.length)cols=chaves.filter(k=>!['id','created_at','updated_at'].includes(k)).slice(0,6);
  const idx=l=>linhas.indexOf(l);
  _erpLinhas[p.tab]=linhas;
  return `<div class="sec-card" style="margin-bottom:10px;padding-bottom:10px;">
    <h3>${esc(p.t)} <span style="font-weight:600;color:#94a3b8;font-size:11px;">· ${linhas.length} registro(s) · ${esc(p.tab)}</span></h3>
    ${semOrdem?`<div class="sub" style="color:#b45309;">Sem ordenação: a coluna <code>${esc(p.ord[0])}</code> não existe nesta tabela. Os dados são os mesmos.</div>`:''}
    ${cortadas?`<div class="sub">${cortadas} registro(s) fora do escopo do BPF foram ocultados (outra linha ou outro produto).</div>`:''}
    <div class="tbl-wrap" style="margin-top:9px;"><table class="tbl"><thead><tr>
      ${cols.map(c=>`<th>${esc(DERIV[c]?DERIV[c].l:cap(c))}</th>`).join('')}<th style="width:120px;">Ação</th></tr></thead><tbody>
      ${linhas.slice(0,25).map(r=>`<tr>${cols.map(c=>{
        let v=DERIV[c]?DERIV[c].fn(r):r[c];
        if(v===null||v===undefined||v==='')return '<td style="color:#cbd5e1;">—</td>';
        if(typeof v==='boolean')return `<td><span class="badge badge-${v?'success':'gray'}">${v?'sim':'não'}</span></td>`;
        if(typeof v==='object')return `<td style="color:#94a3b8;font-size:11px;">{…}</td>`;
        if(ehData(v))return `<td>${fmtD(v)}</td>`;
        return `<td>${esc(String(v).slice(0,60))}</td>`;
      }).join('')}<td><button class="btn btn-ghost btn-sm" onclick="verLinhaERP('${esc(p.tab)}',${idx(r)})">👁️ ver</button></td></tr>`).join('')}
    </tbody></table></div>
    ${linhas.length>25?`<div class="sub" style="margin-top:6px;">Mostrando 25 de ${linhas.length}.</div>`:''}</div>`;
}

function campoHtml(c,valor){
  const v=valor===undefined||valor===null?(c.default!==undefined?c.default:''):valor;
  const req=c.obrigatorio?'<span class="req">*</span>':'';
  const aj=c.ajuda?`<span class="aj">${esc(c.ajuda)}</span>`:'';
  const un=c.unidade?` <span style="color:#94a3b8;font-weight:600;">(${esc(c.unidade)})</span>`:'';
  const id='f_'+c.id;
  if(c.tipo==='secao')return `<div class="f-secao">${esc(c.label)}</div>${c.ajuda?`<div style="grid-column:1/-1;font-size:11px;color:#64748b;margin:-2px 0 5px;">${esc(c.ajuda)}</div>`:''}`;
  let inner='';
  switch(c.tipo){
    case 'sim_nao':
      inner=`<div class="sn-grp" id="${id}" data-v="${esc(v)}">
        <button type="button" class="sn-btn ${v==='sim'?'sel-sim':''}" onclick="setSN('${c.id}','sim')">Sim</button>
        <button type="button" class="sn-btn ${v==='nao'?'sel-nao':''}" onclick="setSN('${c.id}','nao')">Não</button>
        <button type="button" class="sn-btn ${v==='na'?'sel-sim':''}" onclick="setSN('${c.id}','na')" style="flex:.6;">N/A</button></div>`;break;
    case 'select':
      inner=`<select class="form-input" id="${id}" onchange="avaliarAoVivo()"><option value="">Selecione...</option>
        ${(c.opcoes||[]).map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;break;
    case 'multiselect':
      inner=`<div id="${id}" data-multi="1">${(c.opcoes||[]).map(o=>
        `<span class="chip ${Array.isArray(v)&&v.includes(o)?'on':''}" onclick="this.classList.toggle('on')" data-o="${esc(o)}">${esc(o)}</span>`).join('')}</div>`;break;
    case 'textarea': inner=`<textarea class="form-input" id="${id}" rows="2">${esc(v)}</textarea>`;break;
    case 'numero':
      inner=`<input type="number" step="any" class="form-input" id="${id}" value="${esc(v)}"
        ${c.min!==undefined?`data-min="${c.min}"`:''} ${c.max!==undefined?`data-max="${c.max}"`:''} oninput="checarLimite(this)">`;break;
    case 'data': inner=`<input type="date" class="form-input" id="${id}" value="${esc(String(v).split('T')[0])}">`;break;
    case 'hora': inner=`<input type="time" class="form-input" id="${id}" value="${esc(String(v).slice(0,5))}">`;break;
    case 'funcao':
      inner=`<select class="form-input" id="${id}"><option value="">Selecione...</option>
        ${_funcs.map(f=>`<option value="${esc(f.codigo)}" ${v===f.codigo?'selected':''}>${esc(f.nome)}</option>`).join('')}</select>`;break;
    case 'pop':
      inner=`<select class="form-input" id="${id}"><option value="">— todos —</option>
        ${_pops.map(p=>`<option value="${esc(p.codigo)}" ${v===p.codigo?'selected':''}>${esc(p.codigo)} — ${esc(p.titulo)}</option>`).join('')}</select>`;break;
    case 'ref':{
      const lst=_ent[c.ref]||[];
      inner=`<select class="form-input" id="${id}"><option value="">Selecione...</option>
        ${lst.map(o=>`<option value="${esc(o.id)}" ${v===o.id?'selected':''}>${esc(o[c.refLabel]||o.nome||o.id)}</option>`).join('')}</select>`;break;}
    case 'funcionario':
      inner=`<input type="text" class="form-input" id="${id}" value="${esc(v)}" list="lst-func" placeholder="Nome do colaborador">`;break;
    default: inner=`<input type="text" class="form-input" id="${id}" value="${esc(v)}">`;
  }
  const lim=(c.min!==undefined||c.max!==undefined)
    ?`<span class="aj">Tolerância: ${c.min!==undefined?'mín '+c.min:''}${c.min!==undefined&&c.max!==undefined?' · ':''}${c.max!==undefined?'máx '+c.max:''}</span>`:'';
  return `<div class="fld" id="w_${c.id}"><label>${esc(c.label)}${un}${req}</label>${inner}${lim}${aj}</div>`;
}
function setSN(id,val){
  const el=document.getElementById('f_'+id);if(!el)return;
  el.dataset.v=el.dataset.v===val?'':val;
  const v=el.dataset.v,b=el.querySelectorAll('.sn-btn');
  b[0].className='sn-btn'+(v==='sim'?' sel-sim':'');
  b[1].className='sn-btn'+(v==='nao'?' sel-nao':'');
  b[2].className='sn-btn'+(v==='na'?' sel-sim':'');
  avaliarAoVivo();
}
function checarLimite(inp){
  const w=inp.closest('.fld');if(!w)return;
  const v=parseFloat(inp.value);
  const mn=inp.dataset.min!==undefined?parseFloat(inp.dataset.min):null;
  const mx=inp.dataset.max!==undefined?parseFloat(inp.dataset.max):null;
  w.classList.toggle('desvio',!isNaN(v)&&((mn!==null&&v<mn)||(mx!==null&&v>mx)));
  avaliarAoVivo();
}
function lerForm(campos){
  const out={};
  for(const c of campos){
    if(c.tipo==='secao')continue;
    const el=document.getElementById('f_'+c.id);if(!el)continue;
    if(c.tipo==='sim_nao')out[c.id]=el.dataset.v||'';
    else if(c.tipo==='multiselect')out[c.id]=[...el.querySelectorAll('.chip.on')].map(x=>x.dataset.o);
    else out[c.id]=el.value;
  }
  return out;
}
function avaliar(campos,vals){
  const d=[];
  for(const c of campos){
    if(c.tipo==='secao')continue;
    const v=vals[c.id];
    if(c.conforme!==undefined&&v!==''&&v!=null&&v!=='na'&&v!==c.conforme)
      d.push({campo:c.label,esperado:c.conforme,obtido:v});
    if(c.tipo==='numero'&&v!==''&&v!=null){
      const n=parseFloat(v);
      if(!isNaN(n)){
        if(c.min!==undefined&&n<c.min)d.push({campo:c.label,esperado:'≥ '+c.min,obtido:n});
        if(c.max!==undefined&&n>c.max)d.push({campo:c.label,esperado:'≤ '+c.max,obtido:n});
      }}}
  return d;
}
function faltando(campos,vals){
  return campos.filter(c=>c.tipo!=='secao'&&c.obrigatorio&&
    (vals[c.id]===''||vals[c.id]==null||(Array.isArray(vals[c.id])&&!vals[c.id].length))).map(c=>c.label);
}
function avaliarAoVivo(){
  const box=document.getElementById('box-desvio');if(!box||!_formAtual)return;
  const d=avaliar(_formAtual.campos||[],lerForm(_formAtual.campos||[]));
  box.innerHTML=d.length?`<div class="alerta al-dang" style="margin:0;"><strong>${d.length} desvio(s):</strong>
    ${d.map(x=>esc(x.campo)).join(' · ')}<div style="margin-top:4px;font-size:11px;">Será salvo como <strong>NÃO CONFORME</strong>.</div></div>`:'';
}

async function carregarOrigens(mod){
  const cfg=FONTES[mod],sel=document.getElementById('f__origem');
  if(!cfg||!sel)return;
  try{
    let q=_supabase.from(cfg.tab).select('*').limit(cfg.lim);
    if(cfg.filtro)q=cfg.filtro(q);
    if(cfg.ord)q=q.order(cfg.ord[0],{ascending:cfg.ord[1]});
    let {data,error}=await q;
    if(error){                                   // mesma blindagem dos painéis
      const r2=await (cfg.filtro?cfg.filtro(_supabase.from(cfg.tab).select('*').limit(cfg.lim))
                                :_supabase.from(cfg.tab).select('*').limit(cfg.lim));
      if(r2.error)throw error;
      data=r2.data;
    }
    let lista=data||[];
    if(cfg.escopo)lista=lista.filter(noEscopo);   // só o que é nutrição animal
    _origem={mod,lista};
    sel.innerHTML='<option value="">— sem vínculo —</option>'+
      lista.map(r=>`<option value="${esc(r.id)}">${esc(cfg.rot(r))}</option>`).join('');
    if(cfg.escopo)sel.insertAdjacentHTML('afterend',
      `<span class="aj">${lista.length} registro(s) de ${ESCOPO.linhas.join(' / ')} em 25 kg e Big Bag.</span>`);
  }catch(e){
    sel.insertAdjacentHTML('afterend',
      `<div class="alerta al-warn" style="margin-top:7px;">Não foi possível listar <code>${esc(cfg.tab)}</code>: ${esc(e.message||e)}</div>`);
  }
}
// Formata valor do ERP para leitura humana: array de objetos vira sub-tabela,
// em vez do JSON cru que aparecia antes (produtos_op, paradas_op).
function fmtValorERP(v){
  if(v===null||v===undefined||v==='')return '<span style="color:#cbd5e1;">—</span>';
  if(typeof v==='boolean')return `<span class="badge badge-${v?'success':'gray'}">${v?'sim':'não'}</span>`;
  if(ehData(v))return fmtD(v);
  if(Array.isArray(v)){
    if(!v.length)return '<span style="color:#cbd5e1;">nenhum</span>';
    if(typeof v[0]!=='object')return esc(v.join(', '));
    const ks=[...new Set(v.flatMap(o=>Object.keys(o||{})))].slice(0,7);
    return `<table class="tbl" style="font-size:11px;"><thead><tr>${ks.map(k=>`<th>${esc(cap(k))}</th>`).join('')}</tr></thead>
      <tbody>${v.slice(0,14).map(o=>`<tr>${ks.map(k=>{
        const c=o?.[k];
        return `<td>${c===null||c===undefined||c===''?'—':esc(String(typeof c==='object'?JSON.stringify(c):c).slice(0,40))}</td>`;
      }).join('')}</tr>`).join('')}</tbody></table>
      ${v.length>14?`<div class="sub">+ ${v.length-14} item(ns).</div>`:''}`;
  }
  if(typeof v==='object')
    return `<table class="tbl" style="font-size:11px;"><tbody>${Object.entries(v).slice(0,14).map(([k,c])=>
      `<tr><td style="color:#64748b;">${esc(cap(k))}</td><td>${esc(String(typeof c==='object'?JSON.stringify(c):c).slice(0,60))}</td></tr>`).join('')}</tbody></table>`;
  return esc(String(v));
}
// Abre a linha inteira do ERP — inclusive as colunas que não couberam na tabela.
function verLinhaERP(tab,i){
  const r=(_erpLinhas[tab]||[])[i];
  if(!r){uiAlerta('Linha não encontrada. Recarregue a tela.',{titulo:'Dado indisponível',tipo:'warn'});return;}
  const ordem=['op_numero','numero','codigo','data','linha','turno','produto','encarregado','total_sacos','status'];
  const chaves=Object.keys(r).filter(k=>k!=='id'&&r[k]!==null&&r[k]!=='');
  chaves.sort((a,b)=>{
    const ia=ordem.indexOf(a),ib=ordem.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b);});
  const linhas=chaves.map(k=>
    `<tr><td style="width:34%;color:#64748b;vertical-align:top;">${esc(cap(k))}</td>
     <td style="font-weight:600;">${fmtValorERP(r[k])}</td></tr>`).join('');
  const fora=ESCOPO.ativo&&!noEscopo(r);
  uiAlerta(`<div class="sub" style="margin-bottom:8px;">Origem: <code>${esc(tab)}</code> — leitura. Para alterar, use o módulo de origem.</div>
    ${fora?'<div class="alerta al-warn">Este registro está FORA do escopo do BPF (não é Linha 2/Longa Vida em 25 kg ou Big Bag).</div>':''}
    <div class="tbl-wrap" style="max-height:56vh;overflow:auto;"><table class="tbl"><tbody>${linhas}</tbody></table></div>`,
    {titulo:'Registro do ERP',tipo:'info',ok:'Fechar'});
}
function aplicarOrigem(){
  const sel=document.getElementById('f__origem');
  if(!sel||!_origem)return;
  const row=_origem.lista.find(r=>String(r.id)===sel.value);
  if(!row)return;
  let n=0;
  for(const c of (_formAtual.campos||[])){
    if(c.tipo==='secao')continue;
    if(row[c.id]===undefined||row[c.id]===null||row[c.id]==='')continue;
    const el=document.getElementById('f_'+c.id);if(!el)continue;
    const v=row[c.id];
    if(c.tipo==='sim_nao'){el.dataset.v=v===true||v==='sim'?'sim':'nao';setSN(c.id,el.dataset.v);setSN(c.id,el.dataset.v);}
    else if(c.tipo==='multiselect')continue;
    else if(typeof v!=='object'){el.value=ehData(v)?String(v).split('T')[0]:v;n++;}
  }
  if(row.data){const d=document.getElementById('f__data');if(d)d.value=String(row.data).split('T')[0];}
  avaliarAoVivo();
  toast(n?`${n} campo(s) preenchido(s) a partir do ERP.`:'Vínculo registrado. Nenhum campo coincidiu para preencher.', n?'success':'info');
}
function validadeSugerida(f){
  if(!f.validade_meses)return '';
  const d=new Date();d.setMonth(d.getMonth()+f.validade_meses);
  return d.toISOString().split('T')[0];
}
function renderAnexosTmp(){
  const el=document.getElementById('anx-lst');if(!el)return;
  el.innerHTML=_anexosTmp.length?_anexosTmp.map((a,i)=>
    `<div class="anx"><span>${a.origem==='cliente'?'📷':'📎'}</span><span class="nm">${esc(a.nome)}</span>
     ${a.origem==='cliente'?'<span class="badge badge-warning">enviada pelo cliente</span>':''}
     <span style="color:#94a3b8;font-size:11px;">${(a.tamanho/1024).toFixed(0)} KB</span>
     <button class="btn btn-ghost btn-sm" onclick="uiVisualizar('${esc(a.path)}','${esc(a.nome)}','${esc(a.bucket||'')}')">👁️ ver</button>
     <span style="cursor:pointer;color:var(--danger);font-weight:800;" onclick="removerAnexoTmp(${i})">✕</span></div>`).join('')
    :'<span style="font-size:11.5px;color:#94a3b8;">Nenhum anexo.</span>';
}
function removerAnexoTmp(i){_anexosTmp.splice(i,1);renderAnexosTmp();}
async function subirAnexos(inp){
  for(const file of inp.files){
    if(file.size>15*1024*1024){await uiAlerta(`<strong>${esc(file.name)}</strong> tem mais de 15 MB e não foi anexado.`,{titulo:'Arquivo grande demais',tipo:'warn'});continue;}
    const path=`bpf/${Date.now()}_${file.name.replace(/[^\w.\-]/g,'_')}`;
    try{
      const {error}=await _supabase.storage.from('documentos').upload(path,file);
      if(error)throw error;
      _anexosTmp.push({nome:file.name,path,tipo:file.type||'',tamanho:file.size});
      toast(`${file.name} anexado.`,'success');
    }catch(e){ await uiAlerta(`Não foi possível anexar <strong>${esc(file.name)}</strong>.<br><span style="font-size:11px;">${esc(e.message||e)}</span>`,{titulo:'Falha no anexo',tipo:'dang'}); }
  }

async function salvarRegistro(rascunho){
  if(!guardAction('bpf','edit'))return;
  const f=_formAtual;if(!f)return;
  const campos=f.campos||[],vals=lerForm(campos);
  const data=document.getElementById('f__data').value;
  if(!data){await uiAlerta('Informe a data do registro.',{titulo:'Data obrigatória',tipo:'warn'});return;}
  if(!rascunho){
    const falt=faltando(campos,vals);
    if(falt.length){
      await uiAlerta(`Faltam campos obrigatórios:<ul style="margin:7px 0 0 16px;">${falt.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
        <div style="margin-top:8px;font-size:11.5px;color:#64748b;">Você pode salvar como rascunho e completar depois.</div>`,
        {titulo:'Registro incompleto',tipo:'warn'});return;}
    if(f.exige_anexo&&!_anexosTmp.length){
      await uiAlerta('Este registro exige arquivo anexado e não pode ser concluído sem ele.<br><span class="sys">SYS-008</span>',
        {titulo:'Anexo obrigatório',tipo:'dang'});return;}
  }
  const desvios=avaliar(campos,vals),conforme=desvios.length===0;
  if(!rascunho&&!conforme){
    const ok=await uiConfirma(
      `Este registro tem <strong>${desvios.length} desvio(s)</strong>:
       <ul style="margin:7px 0 0 16px;">${desvios.map(d=>`<li>${esc(d.campo)} — esperado <strong>${esc(d.esperado)}</strong>, obtido <strong>${esc(d.obtido)}</strong></li>`).join('')}</ul>
       <div style="margin-top:9px;">Será salvo como <strong>NÃO CONFORME</strong>. Isso é o comportamento correto — o desvio fica registrado e rastreável.</div>`,
      {titulo:'Registro não conforme',tipo:'warn',ok:'Salvar assim mesmo',cancelar:'Voltar e corrigir'});
    if(!ok)return;
  }
  const status=rascunho?'rascunho':(conforme?'aguardando_assinatura':'nao_conforme');
  const u=getUser(),vEl=document.getElementById('f__validade'),oEl=document.getElementById('f__origem');
  const row={formulario_cod:f.codigo,pop_cod:f.pop_cod,data,
    hora:document.getElementById('f__hora').value||null,
    campos:vals,status,conforme,anexos:_anexosTmp,
    validade:vEl&&vEl.value?vEl.value:null,
    origem_modulo:oEl&&oEl.value?f.fonte_modulo:null,
    origem_id:oEl&&oEl.value?oEl.value:null,
    criado_por:u?.nome||u?.email||'sistema'};
  const r=await db(_supabase.from('bpf_registros').insert(row).select().single(),'salvar registro');
  if(r.error)return;
  await trilha(r.data.id,r.data.numero,'criado',null,null,null,
    rascunho?'Rascunho criado':(conforme?'Registro criado':`Criado com ${desvios.length} desvio(s): `+desvios.map(d=>d.campo).join('; ')));
  await addLog('CREATE','BPF',r.data.numero,f.codigo+' — '+(conforme?'conforme':'NÃO CONFORME'));
  if(_tarefaAtual&&!rascunho){                     // fecha a tarefa que gerou esta ficha
    await db(_supabase.from('bpf_tarefas').update({status:'concluida',registro_id:r.data.id,
      concluida_em:new Date().toISOString()}).eq('id',_tarefaAtual.id),'concluir tarefa');
    await db(_supabase.from('bpf_registros').update({tarefa_id:_tarefaAtual.id}).eq('id',r.data.id),'vincular tarefa');
    _tarefaAtual=null;
  }
  closeModal('m-reg');
  toast(conforme?`${r.data.numero} salvo.`:`${r.data.numero} salvo como NÃO CONFORME.`,conforme?'success':'warning');
  _anexosTmp=[];
  await carregar();renderNav();voltar();
}

async function assinar(regId,assId){
  if(!guardAction('bpf','edit'))return;
  const r=_regs.find(x=>x.id===regId);if(!r)return;
  const f=_forms.find(x=>x.codigo===r.formulario_cod);
  const a=(f?.assinaturas||[]).find(x=>x.id===assId);if(!a)return;
  const u=getUser();
  if(!u){await uiAlerta('Sessão não identificada. Faça login novamente.',{titulo:'Sem usuário',tipo:'dang'});return;}
  const tv=_travas.find(t=>t.codigo==='sem_designacao');
  if(tv?.ativa&&a.funcao){
    const ok=_desig.some(d=>d.ativo&&d.funcao_cod===a.funcao&&(!d.pop_cod||d.pop_cod===r.pop_cod)&&
      d.funcionario_nome===u.nome&&(!d.data_fim||d.data_fim>=hoje()));
    if(!ok){
      await uiAlerta(`Você não tem designação vigente para a função <strong>${esc(nomeFuncao(a.funcao))}</strong> no ${esc(r.pop_cod)}.
        <div style="margin-top:7px;font-size:11.5px;color:#64748b;">Cadastre a designação em <strong>👤 Designações de função</strong>.</div>
        <div style="margin-top:5px;" class="sys">SYS-036</div>`,{titulo:'Sem designação',tipo:'dang'});return;}
  }
  const ok=await uiConfirma(
    `Assinar como <strong>${esc(a.label)}</strong>?
     <div style="margin-top:9px;padding:9px 11px;background:#f8fafc;border-radius:8px;font-size:11.5px;">
       ${esc(u.nome||u.email)}<br>${esc(nomeFuncao(a.funcao))}<br>${new Date().toLocaleString('pt-BR')}</div>
     <div style="margin-top:9px;font-size:11.5px;color:#64748b;">A assinatura fica na trilha de auditoria e não pode ser removida.</div>`,
    {titulo:'Assinatura eletrônica',ok:'Assinar'});
  if(!ok)return;
  const novas=[...(r.assinaturas||[]).filter(x=>x.id!==assId),
    {id:assId,label:a.label,funcao:a.funcao,nome:u.nome||u.email,perfil:u.perfil||null,em:new Date().toISOString()}];
  const obrig=(f?.assinaturas||[]).filter(x=>x.obrigatoria).map(x=>x.id);
  const todas=obrig.every(id=>novas.some(x=>x.id===id));
  const patch={assinaturas:novas,atualizado_em:new Date().toISOString()};
  if(todas&&r.status==='aguardando_assinatura'){patch.status='concluido';patch.concluido_em=new Date().toISOString();}
  const res=await db(_supabase.from('bpf_registros').update(patch).eq('id',regId),'assinar');
  if(res.error)return;
  await trilha(regId,r.numero,'assinado',a.label,null,u.nome||u.email,'Assinatura eletrônica');
  if(patch.status==='concluido')await trilha(regId,r.numero,'concluido',null,null,null,'Todas as assinaturas obrigatórias coletadas');
  toast('Assinado.','success');
  await carregar();closeModal('m-ver');renderNav();voltar();
}

// ASSINATURAS — tela própria
// Antes a assinatura só aparecia depois de abrir o registro, e ninguém achava.
// Aqui cada pendência vira uma linha com o botão na mão, separada pelo que
// cabe a VOCÊ assinar (pela designação) e o que espera outra função.
// ═══════════════════════════════════════════════════════════════════════════
function pendenciasAssinatura(){
  const out=[];
  for(const r of _regs){
    if(r.cancelado_em||r.status==='concluido'||r.status==='rascunho')continue;
    const f=_forms.find(x=>x.codigo===r.formulario_cod);
    for(const a of (f?.assinaturas||[])){
      if((r.assinaturas||[]).some(x=>x.id===a.id))continue;
      out.push({reg:r,form:f,ass:a});
    }
  }
  return out.sort((x,y)=>String(x.reg.data).localeCompare(String(y.reg.data)));
}
function podeAssinar(pend){
  const u=getUser();if(!u)return false;
  const tv=_travas.find(t=>t.codigo==='sem_designacao');
  if(!tv?.ativa)return true;                       // trava desligada: qualquer um
  if(!pend.ass.funcao)return true;
  return _desig.some(d=>d.ativo&&d.funcao_cod===pend.ass.funcao&&
    (!d.pop_cod||d.pop_cod===pend.reg.pop_cod)&&d.funcionario_nome===u.nome&&
    (!d.data_fim||d.data_fim>=hoje()));
}

// EXCLUSÕES
// A regra não é a mesma para tudo, e isso é de propósito:
//  · Cadastro (instrumento, fornecedor…) — apaga. É cadastro, não evidência.
//    Onde existe campo de status, prefiro INATIVAR: preserva o histórico de
//    quem já apontou para ele.
//  · Registro do SGQ — NÃO apaga (SYS-003, retenção de 4 anos). Só cancelamento
//    com motivo. A única exceção é o rascunho nunca submetido, que ainda não
//    é registro; o próprio banco recusa o resto.
// ═══════════════════════════════════════════════════════════════════════════
async function excluirEnt(k,id){
  if(!guardAction('bpf','delete'))return;
  const e=ENTIDADES[k],row=(_ent[k]||[]).find(x=>x.id===id);if(!row)return;
  const rot=row[e.colunas[0].id]||row.nome||row.numero||id;
  const temStatus=e.campos.some(c=>c.id==='status'||c.id==='ativo');

  // Uso em outros pontos do módulo — avisa antes de quebrar a referência.
  const usos=[];
  if(k==='instrumentos'){const n=(_ent.calibracoes||[]).filter(c=>c.instrumento_id===id).length;
    if(n)usos.push(`${n} calibração(ões) apontam para ele`);}
  if(k==='pesos_padrao'){const n=(_ent.calibracoes||[]).filter(c=>c.peso_padrao_id===id).length;
    if(n)usos.push(`${n} calibração(ões) usaram este peso-padrão`);}

  const ok=await uiConfirma(
    `Excluir <strong>${esc(String(rot))}</strong> de ${esc(e.titulo)}?
     ${usos.length?`<div class="alerta al-warn" style="margin:9px 0 0;">${usos.join(' · ')}. Excluir deixa esse histórico sem referência.</div>`:''}
     ${temStatus?`<div style="margin-top:9px;font-size:11.5px;color:#64748b;">Se a ideia é só tirar de circulação,
        <strong>inativar</strong> é melhor: o cadastro some das listas de escolha mas o histórico continua íntegro.</div>`:''}`,
    {titulo:'Excluir cadastro',tipo:'warn',ok:temStatus?'Excluir mesmo assim':'Excluir',perigo:true});
  if(!ok)return;
  const r=await db(_supabase.from(e.tabela).delete().eq('id',id),'excluir '+e.titulo);
  if(r.error)return;
  await addLog('DELETE','BPF',String(rot),'Excluído de '+e.titulo);
  toast('Excluído.','success');
  await carregar();renderNav();abrirEnt(k);
}

    `${k==='manifestacoes'?`<button class="btn btn-secondary btn-sm" onclick="renderCanal('colaborador')">💬 Canal público</button> `:''}
     ${k==='reclamacoes'?`<button class="btn btn-secondary btn-sm" onclick="renderCanal('cliente')">📣 Canal do cliente</button> `:''}
     <button class="btn btn-primary btn-sm" onclick="novaEnt('${k}')">+ Novo</button>`);
  const l=_ent[k]||[];
  let h=`<div class="alerta al-info">${esc(e.desc)}</div>`;

  if(al.length)h+=al.map(a=>`<div class="alerta al-${a.t}">${esc(a.m)}</div>`).join('');
  if(!l.length)h+=`<div class="empty"><div class="ic">${e.icone}</div><h3>Nenhum cadastro</h3><p>Clique em “+ Novo”.</p></div>`;
  else h+=`<div class="tbl-wrap"><table class="tbl"><thead><tr>
      ${e.colunas.map(c=>`<th>${esc(c.l)}</th>`).join('')}${e.anexo?'<th>Anexos</th>':''}<th></th></tr></thead><tbody>
      ${l.map(row=>`<tr>${e.colunas.map(c=>`<td>${celulaEnt(k,row,c)}</td>`).join('')}
        ${e.anexo?`<td>${(row.anexos||[]).length?`<span class="badge badge-gray">📎 ${(row.anexos||[]).length}</span>`:'—'}</td>`:''}
        <td style="white-space:nowrap;"><button class="btn btn-ghost btn-sm" onclick="editarEnt('${k}','${row.id}')">✏️ editar</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="excluirEnt('${k}','${row.id}')">🗑️</button></td></tr>`).join('')}
    </tbody></table></div>`;
  document.getElementById('conteudo').innerHTML=h;
}
function celulaEnt(k,row,c){
  if(c.id==='_calib'){
    const u=(_ent.calibracoes||[]).filter(x=>x.instrumento_id===row.id)
      .sort((a,b)=>String(b.validade).localeCompare(String(a.validade)))[0];
    if(!u)return '<span class="badge badge-warning">sem calibração</span>';
    const d=diasAte(u.validade);
    return `<span class="badge badge-${d<0?'danger':d<=60?'warning':'success'}">${d<0?'vencida '+fmtD(u.validade):fmtD(u.validade)}</span>`;
  }
  if(c.id==='_instr'){const i=(_ent.instrumentos||[]).find(x=>x.id===row.instrumento_id);return esc(i?.tag||'—');}
  if(c.id==='_funcao')return esc(nomeFuncao(row.funcao_cod));
  if(c.id==='_autor')return row.anonimo?'<em style="color:#94a3b8;">anônimo</em>':esc(row.autor_nome||'—');
  let v=row[c.id];
  if(c.bool)return v===true||v==='sim'?'<span class="badge badge-success">sim</span>':'<span class="badge badge-gray">não</span>';
  if(c.data){
    if(!v)return '—';
    if(c.venc){const d=diasAte(v);return `<span class="badge badge-${d<0?'danger':d<=60?'warning':'success'}">${fmtD(v)}</span>`;}
    return fmtD(v);
  }
  if(c.badge){
    const bom=['ativo','aprovado','homologado','qualificado','liberado','vigente','realizado','encerrada','executado'];
    const ruim=['bloqueado','reprovado','suspenso','vencido','retornado_bloqueado','atrasado'];
    const cl=bom.includes(v)?'success':ruim.includes(v)?'danger':'warning';
    return `<span class="badge badge-${cl}">${esc(cap(v))}</span>`;
  }
  return esc(v??'—');
}
function novaEnt(k){if(!guardAction('bpf','edit'))return;_entEditId=null;_anexosTmp=[];abrirModalEnt(k,{});}
function editarEnt(k,id){
  if(!guardAction('bpf','edit'))return;
  const row=(_ent[k]||[]).find(x=>x.id===id);if(!row)return;
  _entEditId=id;_anexosTmp=(row.anexos||[]).slice();abrirModalEnt(k,row);

function abrirModalEnt(k,row){
  const e=ENTIDADES[k];_formAtual={campos:e.campos};
  const vals={...row};
  e.campos.forEach(c=>{

      const ano=new Date().getFullYear();
      const n=(_ent[k]||[]).filter(x=>String(x.numero||'').startsWith(c.auto+'-'+ano)).length+1;
      vals[c.id]=`${c.auto}-${ano}-${String(n).padStart(4,'0')}`;
    }

  });
  document.getElementById('m-ent-tit').textContent=(_entEditId?'Editar — ':'Novo — ')+e.titulo;
  document.getElementById('m-ent-body').innerHTML=
    `<div class="alerta al-info" style="font-size:11.5px;">${esc(e.desc)} <span class="sys">${esc(e.sys)}</span></div>
     <div class="form-row">${e.campos.map(c=>campoHtml(c,vals[c.id])).join('')}</div>
     ${e.anexo?`<div class="sec-card" style="margin-top:6px;"><h3>Anexos</h3>
       <div id="anx-lst" style="margin:8px 0;"></div>
       <input type="file" id="anx-in" multiple style="font-size:12px;" onchange="subirAnexos(this)"></div>`:''}
     <div id="box-desvio" style="margin-top:6px;"></div>`;
  document.getElementById('m-ent-foot').innerHTML=`
    <button class="btn btn-secondary" onclick="closeModal('m-ent')">Cancelar</button>
    <button class="btn btn-primary" onclick="salvarEnt('${k}')">💾 Salvar</button>`;
  document.getElementById('m-ent').classList.remove('hidden');
  if(e.anexo)renderAnexosTmp();

}
async function salvarEnt(k){
  if(!guardAction('bpf','edit'))return;
  const e=ENTIDADES[k],vals=lerForm(e.campos);
  const falt=faltando(e.campos,vals);
  if(falt.length){
    await uiAlerta(`Faltam campos obrigatórios:<ul style="margin:7px 0 0 16px;">${falt.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`,
      {titulo:'Cadastro incompleto',tipo:'warn'});return;}

  // Travas de cadastro
  if(k==='calibracoes'&&vals.peso_padrao_id){
    const p=(_ent.pesos_padrao||[]).find(x=>x.id===vals.peso_padrao_id);
    const tv=_travas.find(t=>t.codigo==='peso_padrao_vencido');
    if(tv?.ativa&&p&&diasAte(p.validade)<0){
      await uiAlerta(`O peso-padrão <strong>${esc(p.identificacao)}</strong> está com certificado vencido em ${fmtD(p.validade)}.
        <div style="margin-top:7px;font-size:11.5px;color:#64748b;">Não é possível registrar verificação de balança com peso-padrão vencido.</div>
        <div style="margin-top:5px;" class="sys">SYS-039</div>`,{titulo:'Peso-padrão vencido',tipo:'dang'});return;}
  }
  if(k==='equip_saidas'&&vals.status==='liberado'&&!_anexosTmp.length){
    const tv=_travas.find(t=>t.codigo==='equip_sem_certificado');
    if(tv?.ativa){
      await uiAlerta(`Sem o certificado de calibração anexado, o equipamento <strong>não reentra em operação</strong>.
        <div style="margin-top:5px;" class="sys">SYS-029 · POP-07 6.e</div>`,{titulo:'Certificado obrigatório',tipo:'dang'});return;}
  }
  const desvios=avaliar(e.campos,vals);
  if(desvios.length){
    const ok=await uiConfirma(`Este cadastro tem <strong>${desvios.length} ponto(s) fora do esperado</strong>:
      <ul style="margin:7px 0 0 16px;">${desvios.map(d=>`<li>${esc(d.campo)} — esperado <strong>${esc(d.esperado)}</strong>, obtido <strong>${esc(d.obtido)}</strong></li>`).join('')}</ul>
      <div style="margin-top:9px;font-size:11.5px;color:#64748b;">Pode ser exatamente o que você quer registrar (ex.: fornecedor suspenso). Só confirme que é intencional.</div>`,
      {titulo:'Confirmar cadastro',tipo:'warn',ok:'Salvar assim mesmo'});
    if(!ok)return;
  }
  const payload={};
  e.campos.forEach(c=>{
    let v=vals[c.id];
    if(v==='')v=null;
    if(c.tipo==='sim_nao')v=v==='sim'?true:v==='nao'?false:null;
    if(c.tipo==='numero'&&v!=null)v=parseFloat(v);
    payload[c.id]=v;});
  if(e.anexo)payload.anexos=_anexosTmp;
  const r=_entEditId
    ? await db(_supabase.from(e.tabela).update(payload).eq('id',_entEditId),'salvar '+e.titulo)
    : await db(_supabase.from(e.tabela).insert(payload),'salvar '+e.titulo);
  if(r.error)return;
  await addLog(_entEditId?'UPDATE':'CREATE','BPF',String(payload[e.colunas[0].id]||'—'),e.titulo);
  if(k==='calibracoes'&&payload.resultado==='reprovado'&&payload.instrumento_id){
    await db(_supabase.from('bpf_instrumentos').update({status:'bloqueado'}).eq('id',payload.instrumento_id),'bloquear instrumento');
    await uiAlerta('A calibração foi reprovada, então o instrumento foi marcado como <strong>bloqueado</strong> automaticamente.',
      {titulo:'Instrumento bloqueado',tipo:'warn'});
  }
  closeModal('m-ent');toast('Salvo.','success');_anexosTmp=[];
  await carregar();renderNav();abrirEnt(k);
}

  if(!guardAction('bpf','edit')||!_simplesCfg)return;
  const {tabela,campos,id}=_simplesCfg,vals=lerForm(campos);
  const falt=faltando(campos,vals);
  if(falt.length){
    await uiAlerta(`Faltam campos obrigatórios:<ul style="margin:7px 0 0 16px;">${falt.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`,
      {titulo:'Registro incompleto',tipo:'warn'});return;}
  const payload={};
  campos.forEach(c=>{let v=vals[c.id];if(v==='')v=null;if(c.tipo==='numero'&&v!=null)v=parseFloat(v);payload[c.id]=v;});
  const r=id?await db(_supabase.from(tabela).update(payload).eq('id',id),'salvar')
            :await db(_supabase.from(tabela).insert(payload),'salvar');
  if(r.error)return;
  await addLog(id?'UPDATE':'CREATE','BPF',tabela,String(payload.descricao||payload.titulo||payload.auditor||'').slice(0,100));
  closeModal('m-ent');toast('Salvo.','success');
  await carregar();renderNav();
  ({bpf_ncs:renderNCs,bpf_auditorias:renderAuditorias,bpf_treinamentos:renderTreinamentos}[tabela])();
}

// FICHAS PARA IMPRESSÃO
// A ficha em branco é gerada a partir do MESMO jsonb que desenha a tela.
// Consequência: formulário de papel e formulário eletrônico nunca divergem —
// mudou o campo no banco, mudou a ficha impressa. É o que resolve a NC-3
// (documento sem controle de revisão) e o item 8.2 da IN 04/2007, que exige
// data e assinatura do responsável em registro de papel.

function linhaFicha(c){
  const un=c.unidade?` (${esc(c.unidade)})`:'';
  const req=c.obrigatorio?' <span style="color:#c00;">*</span>':'';
  const box=(w)=>`<span style="display:inline-block;border-bottom:1px solid #333;min-width:${w};height:13px;"></span>`;
  if(c.tipo==='secao')
    return `<tr><td colspan="2" style="padding:9px 6px 3px;font-weight:800;font-size:10px;text-transform:uppercase;
      letter-spacing:.5px;color:#042D4D;border-bottom:1.5px solid #042D4D;">${esc(c.label)}</td></tr>`;
  let campo;
  switch(c.tipo){
    case 'sim_nao': campo='( ) Sim &nbsp;&nbsp; ( ) Não &nbsp;&nbsp; ( ) N/A'; break;
    case 'select': case 'multiselect':
      campo=(c.opcoes||[]).map(o=>`( ) ${esc(o)}`).join('&nbsp;&nbsp; ')||box('60%'); break;
    case 'numero':{
      const lim=(c.min!==undefined||c.max!==undefined)
        ?` <span style="color:#666;font-size:9px;">[${c.min!==undefined?'mín '+c.min:''}${c.min!==undefined&&c.max!==undefined?' · ':''}${c.max!==undefined?'máx '+c.max:''}]</span>`:'';
      campo=box('90px')+lim; break;}
    case 'data': campo='____ / ____ / ________'; break;
    case 'hora': campo='______ : ______'; break;
    case 'textarea': campo=box('100%')+'<br style="line-height:20px;">'+box('100%'); break;
    default: campo=box('100%');
  }
  return `<tr><td style="padding:5px 6px;border-bottom:1px solid #e5e7eb;width:46%;vertical-align:top;">
      ${esc(c.label)}${un}${req}${c.ajuda?`<div style="font-size:8.5px;color:#777;line-height:1.35;">${esc(c.ajuda)}</div>`:''}</td>
    <td style="padding:5px 6px;border-bottom:1px solid #e5e7eb;font-size:10px;">${campo}</td></tr>`;
}

      <span style="float:right;">${esc(f.codigo)}</span></div>

// O POP-12 6.1 pede: gerar o código, controlar revisão e status vigente/obsoleto,
// e alertar o vencimento do ciclo de revisão. Tudo isso mora nesta tabela — e
// era ela que estava sem nenhuma ação na tela.
const CAMPOS_DOCMESTRE=[
  {id:'codigo',label:'Código',tipo:'texto',obrigatorio:true,ajuda:'Padrão MAN-[nn] · POP-[nn] · IT-POP[nn]-[seq] · REG-POP[nn]-[seq]'},
  {id:'tipo',label:'Tipo',tipo:'select',obrigatorio:true,opcoes:['manual','pop','it','reg']},
  {id:'titulo',label:'Título',tipo:'texto',obrigatorio:true},
  {id:'revisao',label:'Revisão',tipo:'texto',obrigatorio:true},
  {id:'status',label:'Status',tipo:'select',obrigatorio:true,opcoes:['rascunho','vigente','em_revisao','obsoleto'],conforme:'vigente'},
  {id:'pop_cod',label:'POP de origem',tipo:'pop'},
  {id:'data_emissao',label:'Data de emissão',tipo:'data'},
  {id:'data_revisao',label:'Data desta revisão',tipo:'data'},
  {id:'proxima_revisao',label:'Próxima revisão',tipo:'data',ajuda:'Ciclo anual ou a cada alteração normativa (POP-12, item 6.g)'},
  {id:'ncs_resolve',label:'NCs que resolve',tipo:'texto'},
  {id:'aprovado_por',label:'Aprovado por',tipo:'texto'},
  {id:'aprovado_em',label:'Aprovado em',tipo:'data'},
  {id:'observacao',label:'Observação',tipo:'textarea'},
];
let _docMestreId=null;
function editarDocMestre(id){
  if(!guardAction('bpf','edit'))return;
  const d=_docs.find(x=>x.id===id);if(!d)return;
  _docMestreId=id;_formAtual={campos:CAMPOS_DOCMESTRE};
  document.getElementById('m-ent-tit').textContent='Documento — '+d.codigo;
  document.getElementById('m-ent-body').innerHTML=
    `<div class="alerta al-info" style="font-size:11.5px;">Alterar a revisão aqui muda o que a lista mestra declara como vigente.
      Ao publicar uma revisão nova, o correto é marcar a anterior como <strong>obsoleta</strong> em vez de sobrescrevê-la.
      <span class="sys">SYS-001 / SYS-018 / SYS-019</span></div>
     <div class="form-row">${CAMPOS_DOCMESTRE.map(c=>campoHtml(c,d[c.id])).join('')}</div>
     <div id="box-desvio"></div>`;
  document.getElementById('m-ent-foot').innerHTML=`
    <button class="btn btn-secondary" onclick="closeModal('m-ent')">Cancelar</button>

async function salvarDocMestre(){
  if(!guardAction('bpf','edit')||!_docMestreId)return;
  const vals=lerForm(CAMPOS_DOCMESTRE);
  const falt=faltando(CAMPOS_DOCMESTRE,vals);
  if(falt.length){await uiAlerta(`Faltam: ${falt.join(', ')}`,{titulo:'Incompleto',tipo:'warn'});return;}
  const payload={};
  CAMPOS_DOCMESTRE.forEach(c=>{let v=vals[c.id];payload[c.id]=v===''?null:v;});
  payload.atualizado_em=new Date().toISOString();
  const r=await db(_supabase.from('bpf_documentos_mestre').update(payload).eq('id',_docMestreId),'salvar documento');
  if(r.error)return;
  await addLog('UPDATE','BPF',payload.codigo,'Documento da lista mestra atualizado — rev. '+payload.revisao);
  closeModal('m-ent');toast('Documento atualizado.','success');
  await carregar();renderDocs();
}
// Publicar revisão nova: a anterior vira obsoleta e continua na lista (POP-12 6.1).
async function duplicarRevisao(id){
  const d=_docs.find(x=>x.id===id);if(!d)return;
  const atual=parseInt(String(d.revisao).replace(/\D/g,''))||0;
  const nova=String(atual+1).padStart(2,'0');
  const ok=await uiConfirma(
    `Publicar a <strong>revisão ${nova}</strong> de ${esc(d.codigo)}?
     <div style="margin-top:9px;font-size:11.5px;color:#64748b;">O documento passa a constar como revisão ${nova} e vigente.
     Registro do que era antes fica no histórico de revisões.</div>`,
    {titulo:'Nova revisão',ok:'Publicar '+nova});
  if(!ok)return;
  const u=getUser();
  await db(_supabase.from('bpf_documento_revisoes').insert({documento_cod:d.codigo,revisao:d.revisao,
    data:d.data_revisao||hoje(),alteracao:'Substituída pela revisão '+nova,autor:u?.nome||u?.email||'sistema',
    arquivo_path:d.arquivo_path}),'histórico de revisão');
  const r=await db(_supabase.from('bpf_documentos_mestre').update({revisao:nova,status:'vigente',
    data_revisao:hoje(),atualizado_em:new Date().toISOString()}).eq('id',id),'publicar revisão');
  if(r.error)return;
  await addLog('UPDATE','BPF',d.codigo,'Revisão '+d.revisao+' → '+nova);
  closeModal('m-ent');toast(`${d.codigo} agora está na revisão ${nova}.`,'success');
  await carregar();renderDocs();
}
function anexarDocMestre(id){
  if(!guardAction('bpf','edit'))return;
  _docMestreId=id;
  document.getElementById('dm-in').click();
}
async function subirDocMestre(inp){
  const file=inp.files[0];inp.value='';
  if(!file||!_docMestreId)return;
  const d=_docs.find(x=>x.id===_docMestreId);
  if(file.size>25*1024*1024){await uiAlerta('Arquivo acima de 25 MB.',{titulo:'Grande demais',tipo:'warn'});return;}
  const path=`bpf/mestre/${d?.codigo||'doc'}_${Date.now()}_${file.name.replace(/[^\w.\-]/g,'_')}`;
  try{
    const {error}=await _supabase.storage.from('documentos').upload(path,file);
    if(error)throw error;
    const r=await db(_supabase.from('bpf_documentos_mestre').update({arquivo_path:path,
      atualizado_em:new Date().toISOString()}).eq('id',_docMestreId),'anexar arquivo');
    if(r.error)return;
    await addLog('UPDATE','BPF',d?.codigo||'',' Arquivo anexado: '+file.name);
    toast('Arquivo anexado ao documento.','success');
    await carregar();renderDocs();
  }catch(e){ await uiAlerta(`Falha ao anexar.<br><span style="font-size:11px;">${esc(e.message||e)}</span>`,{titulo:'Erro',tipo:'dang'}); }
}
async function excluirDocMestre(id){
  if(!guardAction('bpf','delete'))return;
  const d=_docs.find(x=>x.id===id);if(!d)return;
  const ehCatalogo=['pop','manual'].includes(d.tipo);
  const temReg=d.tipo==='reg'&&_regs.some(r=>r.formulario_cod===d.codigo);
  if(temReg){
    await uiAlerta(`<strong>${esc(d.codigo)}</strong> já tem registro lançado.
      <div style="margin-top:8px;">Excluir o documento deixaria esses registros sem a definição que os originou.
      Marque como <strong>obsoleto</strong> em vez de excluir.</div>`,{titulo:'Não pode ser excluído',tipo:'dang'});return;
  }
  const ok=await uiConfirma(
    `Excluir <strong>${esc(d.codigo)} — ${esc(d.titulo)}</strong> da lista mestra?
     ${ehCatalogo?`<div class="alerta al-warn" style="margin:9px 0 0;">Este é um ${d.tipo==='manual'?'Manual':'POP'} do catálogo oficial,
       vindo do Índice Mestre. Excluir tira um procedimento obrigatório da estrutura documental — um auditor vai perguntar.</div>`:''}
     <div style="margin-top:9px;font-size:11.5px;color:#64748b;">O POP-12 6.1 manda controlar status vigente/obsoleto.
     Se o documento saiu de vigência, o certo é marcar <strong>obsoleto</strong>: ele continua na lista e a rastreabilidade fica íntegra.</div>`,
    {titulo:'Excluir documento',tipo:'warn',ok:'Excluir mesmo assim',perigo:true});
  if(!ok)return;
  if(d.arquivo_path){ try{ await _supabase.storage.from('documentos').remove([d.arquivo_path]); }catch(e){} }
  const r=await db(_supabase.from('bpf_documentos_mestre').delete().eq('id',id),'excluir documento');
  if(r.error)return;
  await addLog('DELETE','BPF',d.codigo,'Removido da lista mestra');
  toast('Documento excluído.','success');
  await carregar();renderNav();renderDocs();
}

function gerarQR(){
  const box=document.getElementById('qr-canal');if(!box)return;
  const desenhar=()=>{
    box.innerHTML='';
    try{ new QRCode(box,{text:urlCanal(_canalSel),width:210,height:210,colorDark:'#042D4D',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); }
    catch(e){ box.innerHTML='<div class="alerta al-warn" style="margin:0;">Não foi possível gerar o QR aqui. Use o link acima.</div>'; }
  };
  if(window.QRCode) return desenhar();
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  s.onload=desenhar;
  s.onerror=()=>{box.innerHTML='<div class="alerta al-warn" style="margin:0;">Biblioteca de QR indisponível. Use o link acima.</div>';};
  document.head.appendChild(s);
}
function copiarCanal(){
  const el=document.getElementById('url-canal');
  el.select();
  (navigator.clipboard?navigator.clipboard.writeText(el.value):Promise.reject())
    .then(()=>toast('Link copiado.','success'))
    .catch(()=>toast('Copie manualmente: '+el.value,'info'));
}

function iconeArq(n){
  const e=String(n||'').split('.').pop().toLowerCase();
  if(e==='pdf')return '📕';
  if(['png','jpg','jpeg','webp','gif','avif','bmp'].includes(e))return '🖼️';
  if(['doc','docx','odt'].includes(e))return '📘';
  if(['xls','xlsx','csv','ods'].includes(e))return '📗';
  return '📎';
}
// Aceita os três formatos que já existiram no sistema: Storage, link externo
// e o base64 antigo gravado direto no Postgres.
async function verDocumento(id){
  const a=_anexos.find(x=>x.id===id);
  if(!a){await uiAlerta('Arquivo não encontrado.',{titulo:'Indisponível',tipo:'warn'});return;}
  if(a.path_storage) return uiVisualizar(a.path_storage,a.nome);
  if(a.url){window.open(a.url,'_blank','noopener');return;}
  if(a.conteudo_base64){
    const tipo=a.tipo||'application/octet-stream';
    const src=String(a.conteudo_base64).startsWith('data:')?a.conteudo_base64:`data:${tipo};base64,${a.conteudo_base64}`;
    const ext=String(a.nome||'').split('.').pop().toLowerCase();
    let corpo;
    if(['png','jpg','jpeg','webp','gif','avif','bmp'].includes(ext))
      corpo=`<div class="vw-box" style="display:flex;align-items:center;justify-content:center;padding:8px;"><img src="${src}" alt="${esc(a.nome)}"></div>`;
    else if(ext==='pdf') corpo=`<iframe class="vw-box" src="${src}" title="${esc(a.nome)}"></iframe>`;
    else corpo=`<div class="alerta al-info" style="margin:0;">Pré-visualização não disponível para <strong>.${esc(ext)}</strong>.</div>`;
    _dlg(`<div class="dlg" style="max-width:920px;"><div class="dlg-hd"><span class="dlg-ic">📎</span>
      <div class="dlg-tt">${esc(a.nome)}</div></div>
      <div class="dlg-bd">${corpo}
        <div class="alerta al-warn" style="margin:10px 0 0;">Este arquivo está gravado como <strong>base64 no banco</strong>,
        não no Storage. Funciona, mas pesa no Postgres — ao reenviá-lo, ele passa a usar o Storage.</div></div>
      <div class="dlg-ft"><a class="btn btn-primary" href="${src}" download="${esc(a.nome)}">⬇️ Baixar</a>
      <button class="btn btn-secondary" onclick="_fecharDlg()">Fechar</button></div></div>`);
    return;
  }
  await uiAlerta(`O registro <strong>${esc(a.nome)}</strong> existe na lista, mas não tem arquivo associado
    (sem Storage, sem link e sem conteúdo).<div style="margin-top:8px;">Reenvie o arquivo e exclua esta linha órfã.</div>`,
    {titulo:'Sem arquivo',tipo:'warn'});
}
async function renomearDocumento(id){
  if(!guardAction('bpf','edit'))return;
  const a=_anexos.find(x=>x.id===id);if(!a)return;
  const novo=await uiTexto(`Nome atual: <strong>${esc(a.nome)}</strong>`,
    {titulo:'Renomear arquivo',rotulo:'Novo nome (mantenha a extensão)',ok:'Renomear',linhas:1});
  if(novo===null)return;
  const r=await db(_supabase.from('bpf_documentos').update({nome:novo}).eq('id',id),'renomear documento');
  if(r.error)return;
  await addLog('UPDATE','BPF',novo,'Renomeado (era: '+a.nome+')');
  toast('Renomeado.','success');
  await carregar();renderDocs();
}
async function excluirDocumento(id){
  if(!guardAction('bpf','delete'))return;
  const a=_anexos.find(x=>x.id===id);if(!a)return;
  const ok=await uiConfirma(
    `Excluir <strong>${esc(a.nome)}</strong> dos arquivos do SGQ?
     ${a.path_storage?'<div style="margin-top:9px;font-size:11.5px;color:#64748b;">O arquivo sai também do Storage.</div>':''}
     <div class="alerta al-warn" style="margin:9px 0 0;">Se este for o PDF de um POP ou IT vigente, a lista mestra
     fica sem a evidência do documento. Confirme que é cópia obsoleta ou duplicada.</div>`,
    {titulo:'Excluir arquivo',tipo:'warn',ok:'Excluir',perigo:true});
  if(!ok)return;
  if(a.path_storage){
    try{ await _supabase.storage.from('documentos').remove([a.path_storage]); }
    catch(e){ toast('Removido do banco, mas o arquivo pode ter ficado no Storage: '+(e.message||e),'warning'); }
  }
  const r=await db(_supabase.from('bpf_documentos').delete().eq('id',id),'excluir documento');
  if(r.error)return;
  await addLog('DELETE','BPF',a.nome,'Arquivo do SGQ excluído');
  toast('Arquivo excluído.','success');
  await carregar();renderDocs();
}
async function subirDocumento(inp){
  if(!guardAction('bpf','edit'))return;
  const u=getUser();
  for(const file of inp.files){
    if(file.size>25*1024*1024){await uiAlerta(`<strong>${esc(file.name)}</strong> tem mais de 25 MB.`,{titulo:'Arquivo grande demais',tipo:'warn'});continue;}
    const path=`bpf/docs/${Date.now()}_${file.name.replace(/[^\w.\-]/g,'_')}`;
    try{
      const {error}=await _supabase.storage.from('documentos').upload(path,file);
      if(error)throw error;
      const r=await db(_supabase.from('bpf_documentos').insert({nome:file.name,
        tipo:file.type||'application/octet-stream',tamanho:file.size,path_storage:path,
        enviado_por:u?.nome||u?.email||'Sistema'}),'registrar documento');
      if(!r.error)toast(`${file.name} anexado.`,'success');
    }catch(e){ await uiAlerta(`Não foi possível anexar <strong>${esc(file.name)}</strong>.<br><span style="font-size:11px;">${esc(e.message||e)}</span>`,{titulo:'Falha no anexo',tipo:'dang'}); }
  }
  inp.value='';await carregar();renderDocs();
}

// BPF e vê os 21 POPs, os 34 formulários e todos os registros da fábrica.

const PERFIS_LEITURA_TOTAL=['SADM','ADM','QLD','AUD','DIR','GPR','SGR'];
// Set dos POPs do usuário, ou null quando ele vê tudo.
function meusPops(){
  const u=getUser(); if(!u) return new Set();
  if(PERFIS_LEITURA_TOTAL.includes(u.perfil)) return null;
  const minhas=_desig.filter(d=>d.ativo&&d.funcionario_nome===u.nome&&(!d.data_fim||d.data_fim>=hoje()));
  if(minhas.some(d=>!d.pop_cod)) return null;      // designação sem POP = todos
  return new Set(minhas.map(d=>d.pop_cod));
}
function noEscopoPop(cod){ const s=meusPops(); return !s || s.has(cod); }
function entNoEscopo(e){ return noEscopoPop(e.pop); }
function aplicarEscopo(){
  const s=meusPops();
  if(!s){ _pops=_popsAll;_forms=_formsAll;_regs=_regsAll;_ncs=_ncsAll; return; }
  _pops =_popsAll .filter(p=>s.has(p.codigo));
  _forms=_formsAll.filter(f=>s.has(f.pop_cod));
  _regs =_regsAll .filter(r=>s.has(r.pop_cod));
  _ncs  =_ncsAll  .filter(n=>s.has(n.procedimento_cod));
}

const lst=async q=>{const r=await q;if(r.error)throw r.error;return r.data||[];};

// Quem coleta = função da 1ª assinatura da ficha.
function funcaoColeta(formCod){
  const f=_forms.find(x=>x.codigo===formCod);
  return (f?.assinaturas||[])[0]?.funcao||null;
}
function pessoasDaFuncao(funcao,pop){
  return _desig.filter(d=>d.ativo&&d.funcao_cod===funcao&&(!d.pop_cod||d.pop_cod===pop)
    &&(!d.data_fim||d.data_fim>=hoje())).map(d=>d.funcionario_nome);
}
function souDaFuncao(funcao,pop){
  const u=getUser();if(!u)return false;
  const tv=_travas.find(t=>t.codigo==='sem_designacao');
  if(!tv?.ativa)return true;                       // trava desligada: qualquer um coleta
  return pessoasDaFuncao(funcao,pop).includes(u.nome);
}
function minhasTarefas(){

}
function tarefaAtrasada(t){ return t.prazo && new Date(t.prazo) < new Date(); }

// ── VARREDURA ──────────────────────────────────────────────────────────────
// Puxa os eventos do ERP e cria as tarefas que faltam. Roda ao abrir o módulo
// e no botão "Procurar eventos agora". É PULL, não trigger no Postgres: não
// mexe em tabela de outro módulo e pode ser desligada só apagando a linha.
async function varrerGatilhos(silencioso){
  if(!_temFila)return 0;
  const ativos=_gatilhos.filter(g=>g.ativo);
  if(!ativos.length){ if(!silencioso)toast('Nenhum gatilho ligado. Ligue um em ⚙️ Gatilhos.','warning'); return 0; }
  const novas=[],erros=[];
  for(const g of ativos){
    const rec=GATILHO_FONTES[g.codigo];
    if(!rec)continue;
    try{
      let eventos=[];
      if(rec.cal) eventos=eventosCalendario(g,rec.cal);
      else {
        eventos=await rec.busca();
        if(rec.dias){const lim=new Date(Date.now()-rec.dias*864e5).toISOString().slice(0,10);
          eventos=eventos.filter(e=>!e.quando||String(e.quando).slice(0,10)>=lim);}
      }
      for(const e of eventos){
        if(_tarefas.some(t=>t.gatilho_cod===g.codigo&&t.origem_ref===e.ref))continue;
        novas.push({gatilho_cod:g.codigo,formulario_cod:g.formulario_cod,pop_cod:g.pop_cod,
          funcao_cod:funcaoColeta(g.formulario_cod),origem_tabela:g.fonte_tabela,
          origem_id:e.id?String(e.id):null,origem_ref:e.ref,origem_det:e.det,pre:e.pre||{},
          prazo:new Date(Date.parse((e.quando&&e.quando.length>10?e.quando:(e.quando||hoje())+'T08:00:00'))+
            (g.prazo_horas||24)*36e5).toISOString()});
      }
    }catch(err){ erros.push(g.codigo+': '+(err.message||err)); }
  }
  if(novas.length){
    // ignoreDuplicates cobre a corrida entre dois usuários abrindo o módulo junto.
    const r=await db(_supabase.from('bpf_tarefas').upsert(novas,{onConflict:'gatilho_cod,origem_ref',ignoreDuplicates:true}),'criar tarefas');
    if(r.error)return 0;
    _tarefas=await lst(_supabase.from('bpf_tarefas').select('*').order('prazo')).catch(()=>_tarefas);
  }
  if(erros.length&&!silencioso)
    toast(`${novas.length} tarefa(s) criada(s). ${erros.length} gatilho(s) falharam — ver console.`,'warning'),console.warn('[gatilhos]',erros);
  else if(!silencioso)
    toast(novas.length?`${novas.length} tarefa(s) criada(s).`:'Nada novo — tudo já estava na fila.',novas.length?'success':'info');
  return novas.length;
}
function eventosCalendario(g,tipo){
  const h=hoje(),ini=h.slice(0,8)+'01';
  if(tipo==='mensal')  return [{ref:'CAL/'+g.codigo+'/'+h.slice(0,7),id:null,quando:ini,
    det:`${g.evento} — competência ${h.slice(5,7)}/${h.slice(0,4)}`,pre:{}}];
  if(tipo==='diaria')  return [{ref:'CAL/'+g.codigo+'/'+h,id:null,quando:h,
    det:`${g.evento} — ${fmtD(h)}`,pre:{}}];
  if(tipo==='anual_dez'){ if(new Date().getMonth()!==11)return [];
    return [{ref:'CAL/'+g.codigo+'/'+h.slice(0,4),id:null,quando:h,det:g.evento,pre:{ano:+h.slice(0,4)+1}}]; }
  return [];
}

function rotuloAssin(p){
  if(p.ass.funcao==='rt')return 'Liberar';
  if(ehPrimeiraAssinatura(p)&&souAutorDo(p.reg))return 'Assinar';
  return 'Verificar';
}
function msgAssinatura(p){
  const f=p.form,r=p.reg;
  const feitas=(r.assinaturas||[]);
  const quem=feitas.length?feitas[feitas.length-1].nome:(r.criado_por||'A equipe');
  // Caso mais comum e o que mais confunde: a própria pessoa que preencheu
  // ainda precisa assinar a coleta dela. Não é "verificação de terceiro".
  if(ehPrimeiraAssinatura(p)&&souAutorDo(r))
    return `Você preencheu ${(f?.titulo||'').toLowerCase()}. Confirme com sua assinatura para o registro seguir.`;
  if(p.ass.funcao==='rt') return `As informações estão coletadas e conferidas. Só você pode liberar — ${(f?.titulo||'').toLowerCase()}.`;
  if(p.ass.funcao==='encarregado_prod') return `${quem} lançou ${(f?.titulo||'').toLowerCase()}. Está em aberto para sua verificação.`;
  return `${quem} lançou ${(f?.titulo||'').toLowerCase()}. As informações estão coletadas, falta sua verificação e assinatura.`;
}
function cadeiaHtml(f,r){
  const feitas=(r?.assinaturas||[]);
  const prox=(f?.assinaturas||[]).find(a=>!feitas.some(x=>x.id===a.id));
  return `<div class="ch">${(f?.assinaturas||[]).map(a=>{
    const j=feitas.find(x=>x.id===a.id);
    const cls=j?'done':(prox&&prox.id===a.id?'now':'wait');
    return `<div class="st ${cls}"><div class="n">${esc(a.label)}</div>
      <div class="q">${esc(nomeFuncao(a.funcao))}</div>
      <div class="w">${j?'✓ '+esc(j.nome)+' · '+new Date(j.em).toLocaleString('pt-BR').slice(0,16)
        :(cls==='now'?'aguardando agora':'aguarda a etapa anterior')}</div></div>`;}).join('')}</div>`;
}

async function abrirTarefa(id){
  const t=_tarefas.find(x=>x.id===id);if(!t)return;
  if(!souDaFuncao(t.funcao_cod,t.pop_cod)){
    await uiAlerta(`Esta ficha é da função <strong>${esc(nomeFuncao(t.funcao_cod))}</strong> e você não tem designação vigente para ela no ${esc(t.pop_cod)}.
      <div style="margin-top:5px;" class="sys">SYS-036</div>`,{titulo:'Sem designação',tipo:'dang'});return;}
  await novoRegistro(t.formulario_cod);          // novoRegistro zera _tarefaAtual
  _tarefaAtual=t;                                // por isso o vínculo vem depois
  const box=document.getElementById('m-reg-body');
  if(box) box.insertAdjacentHTML('afterbegin',
    `<div class="alerta al-info"><strong>Por que esta ficha abriu:</strong> ${esc(t.origem_det||t.origem_ref)}
     <div style="font-size:11px;margin-top:4px;">Gatilho <code>${esc(t.gatilho_cod)}</code> ·
       origem <code>${esc(t.origem_tabela||'calendário')}</code> · referência <strong>${esc(t.origem_ref)}</strong></div></div>`);
  // pré-preenchimento: respeita o tipo do campo, senão sim_nao e multiselect quebram
  const f=_forms.find(x=>x.codigo===t.formulario_cod);
  for(const c of (f?.campos||[])){
    const v=(t.pre||{})[c.id];
    if(v===null||v===undefined||v==='')continue;
    const el=document.getElementById('f_'+c.id);if(!el)continue;
    if(c.tipo==='sim_nao'){ if(v==='sim'||v==='nao'||v==='na') setSN(c.id,v); }
    else if(c.tipo==='multiselect'){ const arr=Array.isArray(v)?v:[v];
      el.querySelectorAll('.chip').forEach(ch=>{ if(arr.includes(ch.dataset.o)) ch.classList.add('on'); }); }
    else if(c.tipo==='data') el.value=String(v).slice(0,10);
    else if(c.tipo==='hora') el.value=String(v).slice(0,5);
    else el.value=v;
  }
  avaliarAoVivo();
}

async function togGatilho(cod){
  if(!guardAction('bpf','edit'))return;
  const g=_gatilhos.find(x=>x.codigo===cod);if(!g)return;
  const nova=!g.ativo;
  if(nova&&!GATILHO_FONTES[cod]){
    const ok=await uiConfirma(`Este gatilho ainda não tem receita de consulta no JS (<code>GATILHO_FONTES</code>).
      <div style="margin-top:8px;">Ligar agora <strong>não cria tarefa nenhuma</strong> — fica registrado como intenção.</div>`,
      {titulo:'Sem receita',tipo:'warn',ok:'Ligar assim mesmo'});
    if(!ok)return;}
  if(nova){
    const fn=funcaoColeta(g.formulario_cod), pes=pessoasDaFuncao(fn,g.pop_cod);
    if(!pes.length){
      const ok=await uiConfirma(`Ninguém tem designação de <strong>${esc(nomeFuncao(fn))}</strong> no ${esc(g.pop_cod)}.
        <div style="margin-top:8px;">A tarefa vai ser criada e <strong>ficar sem dono</strong>.</div>`,
        {titulo:'Sem designação',tipo:'warn',ok:'Ligar assim mesmo'});
      if(!ok)return;}}
  const r=await db(_supabase.from('bpf_gatilhos').update({ativo:nova}).eq('codigo',cod),'alterar gatilho');
  if(r.error)return;
  await addLog('UPDATE','BPF',cod,(nova?'Gatilho LIGADO: ':'Gatilho desligado: ')+g.evento);
  g.ativo=nova;
  toast(nova?'Gatilho ligado.':'Gatilho desligado.',nova?'success':'warning');
  if(nova) await varrerGatilhos(true);
  await carregar();renderNav();renderGatilhos();
}
