// A ficha em branco é gerada a partir do MESMO jsonb que desenha a tela.
// Consequência: formulário de papel e formulário eletrônico nunca divergem —
// mudou o campo no banco, mudou a ficha impressa. É o que resolve a NC-3
// (documento sem controle de revisão) e o item 8.2 da IN 04/2007, que exige
// data e assinatura do responsável em registro de papel.
// ═══════════════════════════════════════════════════════════════════════════
function linhaFicha(c,val){
  const un=c.unidade?` (${esc(c.unidade)})`:'';
  const tem=val!==undefined&&val!==null&&val!==''&&typeof val!=='object';
  const V=t=>`<span style="font-weight:700;color:#0b3a8c;border-bottom:1px solid #333;padding:0 4px;">${esc(t)}</span>`;
  const mk=(o,on)=>on?`(<b style="color:#0b3a8c;">X</b>) <b style="color:#0b3a8c;">${esc(o)}</b>`:`( ) ${esc(o)}`;
  const req=c.obrigatorio?' <span style="color:#c00;">*</span>':'';
  const box=(w)=>`<span style="display:inline-block;border-bottom:1px solid #333;min-width:${w};height:13px;"></span>`;
  if(c.tipo==='secao')
    return `<tr><td colspan="2" style="padding:9px 6px 3px;font-weight:800;font-size:10px;text-transform:uppercase;
      letter-spacing:.5px;color:#042D4D;border-bottom:1.5px solid #042D4D;">${esc(c.label)}</td></tr>`;
  let campo;
  switch(c.tipo){
    case 'sim_nao': campo=[['sim','Sim'],['nao','Não'],['na','N/A']].map(([k,t])=>mk(t,tem&&String(val).toLowerCase()===k)).join(' &nbsp;&nbsp; '); break;
    case 'select': case 'multiselect':
      campo=(c.opcoes||[]).map(o=>mk(o,tem&&String(val)===String(o))).join('&nbsp;&nbsp; ')||(tem?V(val):box('60%')); break;
    case 'numero':{
      const lim=(c.min!==undefined||c.max!==undefined)
        ?` <span style="color:#666;font-size:9px;">[${c.min!==undefined?'mín '+c.min:''}${c.min!==undefined&&c.max!==undefined?' · ':''}${c.max!==undefined?'máx '+c.max:''}]</span>`:'';
      campo=(tem?V(String(val).replace('.',',')):box('90px'))+lim; break;}
    case 'data': campo=tem?V(fmtD(val)):'____ / ____ / ________'; break;
    case 'hora': campo=tem?V(String(val).slice(0,5)):'______ : ______'; break;
    case 'textarea': campo=tem?`<div style="font-weight:700;color:#0b3a8c;border-bottom:1px solid #333;padding:2px 4px;">${esc(val)}</div>`+box('100%'):box('100%')+'<br style="line-height:20px;">'+box('100%'); break;
    default: campo=tem?V(val):box('100%');
  }
  return `<tr><td style="padding:5px 6px;border-bottom:1px solid #e5e7eb;width:46%;vertical-align:top;">
      ${esc(c.label)}${un}${req}${c.ajuda?`<div style="font-size:8.5px;color:#777;line-height:1.35;">${esc(c.ajuda)}</div>`:''}</td>
    <td style="padding:5px 6px;border-bottom:1px solid #e5e7eb;font-size:10px;">${campo}</td></tr>`;
}

function imprimirFicha(cod){
  const f=_forms.find(x=>x.codigo===cod);
  if(!f){uiAlerta('Formulário não encontrado.',{titulo:'Indisponível',tipo:'warn'});return;}
  document.getElementById('print-area').innerHTML=htmlFicha(f,_pops.find(p=>p.codigo===f.pop_cod));
  window.print();
}
async function imprimirTodasFichas(popCod){
  const lista=popCod?_forms.filter(f=>f.pop_cod===popCod):_forms;
  if(!lista.length){await uiAlerta('Nenhuma ficha para imprimir.',{titulo:'Vazio',tipo:'warn'});return;}
  const ok=await uiConfirma(
    `Gerar <strong>${lista.length} ficha(s)</strong> em branco${popCod?' do '+esc(popCod):' — o caderno completo do SGQ'}?
     <div style="margin-top:8px;font-size:11.5px;color:#64748b;">Cada ficha sai numa página. Na janela de impressão,
     escolha “Salvar como PDF” se quiser o arquivo em vez do papel.</div>`,
    {titulo:'Imprimir fichas',ok:'Gerar'});
  if(!ok)return;
  document.getElementById('print-area').innerHTML=
    lista.map(f=>htmlFicha(f,_pops.find(p=>p.codigo===f.pop_cod))).join('');
  window.print();
}

  for(const g of GRUPOS){

function gerarQR(){
  const box=document.getElementById('qr-canal');if(!box)return;
  const desenhar=()=>{
    box.innerHTML='';
    try{ new QRCode(box,{text:urlCanal(_canalSel),width:210,height:210,colorDark:'#042D4D',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); }
    catch(e){ box.innerHTML='<div class="alerta al-warn" style="margin:0;">Não foi possível gerar o QR aqui. Use o link acima.</div>'; }
  };
  if(window.QRCode) return desenhar();
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  s.onload=desenhar;
  s.onerror=()=>{box.innerHTML='<div class="alerta al-warn" style="margin:0;">Biblioteca de QR indisponível. Use o link acima.</div>';};
  document.head.appendChild(s);
}
function copiarCanal(){
  const el=document.getElementById('url-canal');

    .then(()=>toast('Link copiado.','success'))
    .catch(()=>toast('Copie manualmente: '+el.value,'info'));

let _docFiltro='pop',_docBusca='';
const TIPO_DOC={manual:'Manual',pop:'POP',it:'Instrução',reg:'Registro'};
function nomeArqDoc(path){ return String(path||'').split('/').pop().replace(/^[A-Z0-9-]+_(r\d+_)?\d{10,}_/,''); }
function revsDe(cod){ return _revs.filter(r=>r.documento_cod===cod); }
function dataVersao(d){ return d.data_vigencia||d.data_revisao||d.data_emissao||(d.atualizado_em||'').slice(0,10)||null; }
function situacaoDoc(d){
  const dd=d.proxima_revisao?diasAte(d.proxima_revisao):null;
  if(d.status==='obsoleto')return {cls:'bx-tg-cinza',t:'Obsoleto'};
  if(dd!==null&&dd<0)return {cls:'bx-tg-verm',t:'Revisão vencida'};
  if(dd!==null&&dd<=60)return {cls:'bx-tg-amar',t:'Revisar até '+fmtD(d.proxima_revisao)};
  if(d.status==='vigente')return {cls:'bx-tg-verde',t:'Vigente'};
  if(d.status==='em_revisao')return {cls:'bx-tg-amar',t:'Em revisão'};
  return {cls:'bx-tg-cinza',t:cap(d.status||'rascunho')};
}
function filtrarDocs(f){_docFiltro=f;renderDocs();}
function renderDocs(){
  _sec='documentos';marcarArea('documentos');

          :ehInstr(d)?`<button class="bx-ib" title="Ver a instrução" onclick="verInstrucaoDoc('${d.id}')">👁️</button><button class="bx-ib" title="Imprimir a instrução" onclick="imprimirInstrucao('${d.id}')">🖨️</button>`

    sessionStorage.setItem('bpf_orfaos_ok','1');
    const {data}=await _supabase.rpc('bpf_arquivos_orfaos'); const l=(data||[]).map(x=>typeof x==='string'?x:Object.values(x)[0]).filter(Boolean);
    for(let i=0;i<l.length;i+=50) await _supabase.storage.from('documentos').remove(l.slice(i,i+50));
    if(l.length)console.info('[BPF] arquivos sem uso removidos:',l.length);
  }catch(e){}
}
function ehInstr(d){ return d&&d.tipo==='it'&&!d.arquivo_path&&!!d.conteudo; }
const _negr=t=>esc(t||'').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');

async function salvarTextoIT(id){
  const d=_docs.find(x=>x.id===id);if(!d)return;
  const v=k=>document.getElementById(k).value.trim(), ls=k=>v(k).split('\n').map(x=>x.trim()).filter(Boolean);
  const c={...(d.conteudo||{}),onde:v('it-onde'),quando:v('it-quando'),quem_faz:v('it-faz'),quem_confere:v('it-conf'),registro:v('it-reg'),
    passos:ls('it-passos'),se_errado:ls('it-err'),lembre:ls('it-lem')};
  if(!c.passos.length){await uiAlerta('Informe ao menos um passo.',{titulo:'Incompleto',tipo:'warn'});return;}
  const r=await db(_supabase.from('bpf_documentos_mestre').update({conteudo:c,atualizado_em:new Date().toISOString()}).eq('id',id),'texto da IT');
  if(r.error)return;
  d.conteudo=c;await addLog('UPDATE','BPF',d.codigo,'Texto da instrução ajustado');
  closeModal('m-ent');toast('Texto salvo.','success');verInstrucaoDoc(id);
}
function ehFicha(d){ return d&&d.tipo==='reg'&&_forms.some(f=>f.codigo===d.codigo); }
function verFichaDoc(id){
  const d=_docs.find(x=>x.id===id);if(!d)return;const f=_forms.find(x=>x.codigo===d.codigo);if(!f)return;
  const html=htmlFicha(f,_pops.find(p=>p.codigo===f.pop_cod));
  _dlg(`<div class="dlg" style="max-width:1000px;width:96vw;"><div class="dlg-hd"><span class="dlg-ic">📝</span>
    <div class="dlg-tt">${esc(d.codigo)} rev. ${esc(d.revisao||'00')} — ficha em branco</div></div>
    <div class="dlg-bd" style="max-height:72vh;overflow:auto;background:#e2e8f0;padding:14px;"><div style="background:#fff;max-width:794px;margin:0 auto;padding:28px 30px;box-shadow:0 2px 8px rgba(0,0,0,.15);">${html}</div></div>
    <div class="dlg-ft"><button class="btn btn-primary" onclick="imprimirFicha('${esc(d.codigo)}')">🖨️ Imprimir / salvar PDF</button>
      <button class="btn btn-secondary" onclick="_fecharDlg()">Fechar</button></div></div>`);
}
function verArqDoc(id){
  const d=_docs.find(x=>x.id===id);if(!d)return;
  if(ehFicha(d))return verFichaDoc(id);
  if(ehInstr(d))return verInstrucaoDoc(id);
  if(!d.arquivo_path)return;
  uiVisualizar(d.arquivo_path,`${d.codigo} rev. ${d.revisao||'—'} — ${d.titulo}.${String(d.arquivo_path).split('.').pop()}`);
}
async function baixarArquivo(path,nome,bucket){
  try{
    const {data,error}=await _supabase.storage.from(bucket||'documentos').createSignedUrl(path,600,{download:nome||true});
    if(error)throw error;
    const a=document.createElement('a');a.href=data.signedUrl;a.download=nome||'';document.body.appendChild(a);a.click();a.remove();
  }catch(e){ await uiAlerta(`Não foi possível baixar.<br><span style="font-size:11px;">${esc(e.message||e)}</span>`,{titulo:'Erro',tipo:'dang'}); }
}
function baixarArqDoc(id){
  { const d0=_docs.find(x=>x.id===id); if(ehFicha(d0))return imprimirFicha(d0.codigo); if(ehInstr(d0))return imprimirInstrucao(id); }
  const d=_docs.find(x=>x.id===id);if(!d||!d.arquivo_path)return;
  const ext=String(d.arquivo_path).split('.').pop();
  baixarArquivo(d.arquivo_path,`${d.codigo}_rev${d.revisao||''}.${ext}`);
}
function verArqRev(revId){
  const r=_revs.find(x=>x.id===revId);if(!r||!r.arquivo_path)return;
  uiVisualizar(r.arquivo_path,`${r.documento_cod} rev. ${r.revisao} (obsoleta).${String(r.arquivo_path).split('.').pop()}`);
}
function baixarArqRev(revId){
  const r=_revs.find(x=>x.id===revId);if(!r||!r.arquivo_path)return;
  baixarArquivo(r.arquivo_path,`${r.documento_cod}_rev${r.revisao}_obsoleta.${String(r.arquivo_path).split('.').pop()}`);
}

// ═══════════════════════════════════════════════════════════════════════════
// ⚙️ CONFIGURAÇÃO DO POP — quem participa (por NOME), gatilhos e travas
// Pessoas = usuários do ERP (usuarios.html). Ao salvar, grava a designação
// (bpf_designacoes): é ela que decide quais POPs a pessoa vê e em que papel
// pode assinar. O perfil (perfis.html) continua decidindo se ela abre o BPF.
// ═══════════════════════════════════════════════════════════════════════════
const PAPEIS=[['responsavel','Responsável'],['ve','Vê o POP e registros'],['lanca','Preenche / lança'],['assina','Assina'],['aviso','Recebe aviso'],['libera','Libera exceção']];
let _cfg=null;   // estado da tela enquanto edita
async function carregarDadosCfg(){
  const [us,pf,fo,ins,pc]=await Promise.all([
    lst(_supabase.from('usuarios').select('id,nome,funcao,perfil,setor,status').order('nome')),
    lst(_supabase.from('perfis').select('codigo,nome,permissoes')),
    lst(_supabase.from('almoxarifado_fornecedores').select('id,razao_social,nome_fantasia,cnpj,bpf_categoria').order('nome_fantasia')),
    lst(_supabase.from('insumos').select('id,codigo,nome,tipo').order('nome')),
    lst(_supabase.from('bpf_pop_config').select('*'))]);
  return {us:us.filter(u=>(u.status||'ativo')!=='inativo'),pf,fo,ins,pc};
}
function perfilAbreBpf(pf,cod){ const p=pf.find(x=>x.codigo===cod); if(!p)return false; if(['SADM','ADM','DIR','GER'].includes(cod)&&!p.permissoes)return true;
  const b=(p.permissoes||{}).bpf; return !!(b&&b.view); }
function funcoesAssinaturaDoPop(cod){
  const s=new Set();(_formsAll.length?_formsAll:_forms).filter(f=>f.pop_cod===cod).forEach(f=>(f.assinaturas||[]).forEach(a=>a.funcao&&s.add(a.funcao)));
  return [...s];
}
// escolher qual POP configurar (menu ⋯ Mais / Gatilhos / Travas)
function escolherConfigPop(){
  const pops=_pops.slice().sort((a,b)=>a.codigo.localeCompare(b.codigo,'pt',{numeric:true}));
  const nG=c=>_gatilhos.filter(g=>g.pop_cod===c).length, nT=c=>_travas.filter(t=>t.pop_cod===c).length, nP=c=>_desig.filter(d=>d.ativo&&d.pop_cod===c).length;
  _dlg(`<div class="dlg" style="max-width:720px;width:96vw;"><div class="dlg-hd"><span class="dlg-ic">🛠️</span><div class="dlg-tt">Configuração dos POPs — escolha o POP</div></div>
    <div class="dlg-bd" style="max-height:64vh;overflow:auto;">${pops.map(p=>`<button class="cf-pick" onclick="_fecharDlg();abrirConfigPop('${esc(p.codigo)}')">
      <b>${esc(p.codigo)}</b> ${esc(p.titulo)}<small>${nP(p.codigo)} pessoa(s) · ${nG(p.codigo)} gatilho(s) · ${nT(p.codigo)} trava(s)</small></button>`).join('')}</div>
    <div class="dlg-ft"><button class="btn btn-ghost" onclick="_fecharDlg()">Fechar</button></div></div>`);
}
async function abrirConfigPop(cod){
  lembrarTela({cfg:cod});
  if(!guardAction('bpf','edit'))return;
  const p=_docs.find(d=>d.codigo===cod&&d.tipo==='pop');if(!p)return;
  document.getElementById('conteudo').innerHTML='<div style="padding:30px;"><span class="spin"></span> Carregando configuração…</div>';
  const dados=await carregarDadosCfg();
  const pc=(dados.pc.find(x=>x.pop_cod===cod)||{}).config||{};
  _cfg={cod,dados,
    pessoas:_desig.filter(d=>d.ativo&&d.pop_cod===cod).map(d=>({id:d.id,usuario_id:d.usuario_id,nome:d.funcionario_nome,funcao_cod:d.funcao_cod,papeis:[...(d.papeis||[])]})),
    removidos:[],
    gat:_gatilhos.filter(g=>g.pop_cod===cod).map(g=>({...g,filtro:{...(g.filtro||{})}})),
    trv:_travas.filter(t=>t.pop_cod===cod).map(t=>({...t,config:{modo:'bloquear',onde:[],liberadores:[],...(t.config||{})}})),
    forn:dados.fo.map(f=>({...f})),
    canais:pc.canais||['sino','inicio']};
  _sec='cfg';_popSel=cod;marcarArea('pop');
  pintarConfigPop();
}
function avisosCfg(){
  const c=_cfg,a=[];
  if(!c.pessoas.some(x=>x.papeis.includes('responsavel')))a.push('ninguém marcado como Responsável');
  if(!c.pessoas.some(x=>x.papeis.includes('aviso')))a.push('ninguém recebe aviso quando algo der errado');
  c.pessoas.filter(x=>!x.usuario_id).forEach(x=>a.push(`${x.nome} não tem login no ERP (aparece só como nome no papel)`));
  c.pessoas.filter(x=>x.usuario_id).forEach(x=>{const u=c.dados.us.find(y=>y.id===x.usuario_id);
    if(u&&!perfilAbreBpf(c.dados.pf,u.perfil))a.push(`o perfil ${u.perfil} de ${u.nome} não abre o BPF`);});
  c.gat.filter(g=>g.ativo).forEach(g=>{
    if(Array.isArray(g.filtro.itens)&&!g.filtro.itens.length)a.push(`gatilho "${g.evento||g.codigo}" ligado sem nenhum item marcado — não vai gerar nada`);
    if(g.codigo==='g_forn'&&!c.forn.some(f=>f.bpf_categoria))a.push('gatilho de fornecedor ligado sem nenhum fornecedor BPF marcado');});
  c.trv.filter(t=>t.ativa&&t.config.modo!=='avisar').forEach(t=>{
    if(!c.pessoas.some(x=>x.papeis.includes('libera')))a.push(`trava "${t.nome}" bloqueia e ninguém pode liberar exceção`);
    const d=TRAVAS_DEF[t.codigo]; if(d&&d.ondeOpcoes&&!t.config.onde.length)a.push(`trava "${t.nome}" ligada sem marcar onde age`);});
  return a;
}
function pintarConfigPop(){
  const c=_cfg,p=_docs.find(d=>d.codigo===c.cod),D=c.dados;
  const fAss=funcoesAssinaturaDoPop(c.cod);
  const av=avisosCfg();
  const chip=(on,txt,js,title)=>`<button type="button" class="cf-ch${on?' on':''}" onclick="${js}" ${title?`title="${esc(title)}"`:''}>${txt}</button>`;
  const seg=(op,atual,js)=>`<span class="cf-seg">${op.map(([v,t])=>`<button type="button" class="${String(v)===String(atual)?'on':''}" onclick="${js.replace('$V',v)}">${t}</button>`).join('')}</span>`;
  const tg=(on,js)=>`<button type="button" class="cf-tg${on?'':' off'}" onclick="${js}" aria-label="ligar/desligar"></button>`;
  cab('POPs & Documentos › '+c.cod,'⚙️ Configuração — '+p.titulo,
    `<button class="btn btn-secondary btn-sm" onclick="abrirPop('${c.cod}')">← Voltar ao POP</button> <button class="btn btn-primary btn-sm" onclick="salvarConfigPop()">💾 Salvar configuração</button>`);
  const pessoasHtml=c.pessoas.map((x,i)=>{const u=D.us.find(y=>y.id===x.usuario_id);
    const abre=u?perfilAbreBpf(D.pf,u.perfil):null;
    return `<div class="cf-pes"><div class="cf-pes-h"><div><b>${esc(x.nome)}</b>
        <div class="cf-sub">${u?`${esc(u.funcao||'sem função no cadastro')} · perfil <b>${esc(u.perfil||'—')}</b>${u.setor?' · '+esc(u.setor):''}`:'sem login no ERP — só aparece como nome no papel'}</div>
        ${u&&!abre?`<div class="cf-warn">⚠️ o perfil ${esc(u.perfil)} não abre o BPF <button class="btn btn-secondary btn-sm" onclick="liberarBpfPerfil('${esc(u.perfil)}')">Liberar BPF no perfil ${esc(u.perfil)}</button></div>`:''}</div>
      <button class="btn btn-ghost btn-sm" title="Tirar deste POP" onclick="_cfg.removidos.push(_cfg.pessoas.splice(${i},1)[0]);pintarConfigPop()">✕</button></div>
      <div>${PAPEIS.map(([k,t])=>chip(x.papeis.includes(k),t,`cfgPapel(${i},'${k}')`)).join('')}</div>
      ${x.papeis.includes('assina')?`<div class="cf-sub" style="margin-top:6px;">Assina como: <select class="form-input" style="display:inline-block;width:auto;min-height:34px;" onchange="_cfg.pessoas[${i}].funcao_cod=this.value">
        <option value="">— escolha —</option>${[...new Set(fAss.concat(x.funcao_cod?[x.funcao_cod]:[]))].map(fc=>`<option value="${esc(fc)}" ${fc===x.funcao_cod?'selected':''}>${esc(nomeFuncao(fc))}</option>`).join('')}</select></div>`:''}
    </div>`;}).join('')||'<div class="cf-sub">Ninguém neste POP ainda.</div>';
  const gatHtml=c.gat.map((g,i)=>{
    const itensCfg=Array.isArray(g.filtro.itens);
    const embs=D.ins.filter(x=>/saco|big\s*bag|embalag/i.test(x.nome+' '+(x.tipo||'')));
    return `<div class="cf-c"><div class="cf-t"><b>⚡ ${esc(g.evento||g.codigo)}</b>${tg(g.ativo,`_cfg.gat[${i}].ativo=!_cfg.gat[${i}].ativo;pintarConfigPop()`)}</div>
      <div class="cf-sub">Gera a ficha <b>${esc(g.formulario_cod)}</b>.</div>
      ${itensCfg?`<div class="cf-lb">Itens que entram no BPF</div>
        ${embs.filter(x=>g.filtro.itens.includes(x.codigo)).map(x=>chip(true,esc(x.nome)+` <small>${esc(x.codigo)}</small> ✕`,`cfgItem(${i},'${esc(x.codigo)}')`,'Tirar')).join('')||'<span class="cf-sub">nenhum item</span>'}
        ${(()=>{const resto=embs.filter(x=>!g.filtro.itens.includes(x.codigo));return resto.length?`<div><select class="form-input cf-add" onchange="if(this.value)cfgItem(${i},this.value)">
          <option value="">+ adicionar item…</option>${resto.map(x=>`<option value="${esc(x.codigo)}">${esc(x.nome)} (${esc(x.codigo)})</option>`).join('')}</select></div>`:'';})()}`:''}
      ${g.codigo==='g_forn'?`<div class="cf-lb">Fornecedores BPF (cadastro do Compras)</div>
        ${c.forn.map((f,j)=>f.bpf_categoria?chip(true,esc(f.nome_fantasia||f.razao_social)+' ✕',`cfgForn(${j})`,'Tirar'):'').join('')||'<span class="cf-sub">nenhum fornecedor BPF</span>'}
        ${c.forn.some(f=>!f.bpf_categoria)?`<div><select class="form-input cf-add" onchange="if(this.value!=='')cfgForn(Number(this.value))">

function cfgPapel(i,k){const p=_cfg.pessoas[i];p.papeis=p.papeis.includes(k)?p.papeis.filter(x=>x!==k):p.papeis.concat(k);if(k==='assina'&&!p.papeis.includes('ve'))p.papeis.push('ve');pintarConfigPop();}
function cfgItem(i,cod){const f=_cfg.gat[i].filtro;f.itens=f.itens.includes(cod)?f.itens.filter(x=>x!==cod):f.itens.concat(cod);pintarConfigPop();}
function cfgForn(j){const f=_cfg.forn[j];f.bpf_categoria=f.bpf_categoria?null:'embalagem';f._mudou=true;pintarConfigPop();}
function cfgOnde(i,k){const o=_cfg.trv[i].config.onde;_cfg.trv[i].config.onde=o.includes(k)?o.filter(x=>x!==k):o.concat(k);pintarConfigPop();}
function cfgCanal(k){_cfg.canais=_cfg.canais.includes(k)?_cfg.canais.filter(x=>x!==k):_cfg.canais.concat(k);pintarConfigPop();}
function cfgAddPessoa(){
  const n=document.getElementById('cf-busca').value.trim();
  const u=_cfg.dados.us.find(x=>_normP(x.nome)===_normP(n));
  if(!u){toast('Escolha um usuário da lista.','warning');return;}
  if(_cfg.pessoas.some(x=>x.usuario_id===u.id||_normP(x.nome)===_normP(u.nome))){toast(u.nome+' já está neste POP.','info');return;}

}
async function liberarBpfPerfil(perfil){
  const p=_cfg.dados.pf.find(x=>x.codigo===perfil);if(!p)return;
  const ok=await uiConfirma(`Liberar o módulo BPF para o perfil <b>${esc(p.nome)}</b>?<div style="margin-top:6px;font-size:12px;color:#64748b;">É seguro: dentro do BPF cada pessoa só vê os POPs em que foi colocada. Quem tem esse perfil e não está em nenhum POP continua sem ver nada.</div>`,{titulo:'Liberar BPF',ok:'Liberar'});
  if(!ok)return;
  const perm={...(p.permissoes||{})};perm.bpf={...(perm.bpf||{}),view:true,create:true,edit:true,delete:!!(perm.bpf&&perm.bpf.delete),export:true};
  const r=await db(_supabase.from('perfis').update({permissoes:perm}).eq('codigo',perfil),'liberar BPF no perfil');
  if(r.error)return;
  p.permissoes=perm;await addLog('UPDATE','PERFIS',perfil,'BPF liberado no perfil (configuração do '+_cfg.cod+')');
  toast('BPF liberado no perfil '+p.nome+'.','success');pintarConfigPop();
}
async function salvarConfigPop(){
  const c=_cfg;if(!c)return;
  const semFuncao=c.pessoas.filter(x=>x.papeis.includes('assina')&&!x.funcao_cod);
  if(semFuncao.length){await uiAlerta('Escolha "Assina como" para: '+semFuncao.map(x=>esc(x.nome)).join(', '),{titulo:'Falta a função',tipo:'warn'});return;}
  const u=getUser(),quem=u?.nome||u?.email||'—',agora=new Date().toISOString();
  try{
    for(const x of c.pessoas){
      const row={usuario_id:x.usuario_id,funcionario_nome:x.nome,pop_cod:c.cod,funcao_cod:x.funcao_cod||null,papeis:x.papeis,ativo:true};
      if(x.id){const r=await db(_supabase.from('bpf_designacoes').update(row).eq('id',x.id),'designação');if(r.error)throw r.error;}
      else{const r=await db(_supabase.from('bpf_designacoes').insert({...row,data_inicio:hoje(),designado_por:quem}),'designação');if(r.error)throw r.error;}
    }
    for(const x of c.removidos.filter(x=>x.id)){
      const r=await db(_supabase.from('bpf_designacoes').update({ativo:false,data_fim:hoje()}).eq('id',x.id),'retirar designação');if(r.error)throw r.error;}
    for(const g of c.gat){
      const r=await db(_supabase.from('bpf_gatilhos').update({ativo:g.ativo,prazo_horas:g.prazo_horas,filtro:g.filtro}).eq('codigo',g.codigo),'gatilho');if(r.error)throw r.error;}
    const libs=c.pessoas.filter(x=>x.papeis.includes('libera')).map(x=>x.nome);
    for(const t of c.trv){
      const r=await db(_supabase.from('bpf_travas').update({ativa:t.ativa,config:{...t.config,liberadores:libs}}).eq('codigo',t.codigo),'trava');if(r.error)throw r.error;}
    for(const f of c.forn.filter(f=>f._mudou)){
      const r=await db(_supabase.from('almoxarifado_fornecedores').update({bpf_categoria:f.bpf_categoria}).eq('id',f.id),'fornecedor BPF');if(r.error)throw r.error;}
    const r=await db(_supabase.from('bpf_pop_config').upsert({pop_cod:c.cod,config:{canais:c.canais},atualizado_em:agora,atualizado_por:quem}),'configuração do POP');
    if(r.error)throw r.error;
    await addLog('UPDATE','BPF',c.cod,`Configuração do POP salva: ${c.pessoas.length} pessoa(s), ${c.gat.filter(g=>g.ativo).length} gatilho(s) e ${c.trv.filter(t=>t.ativa).length} trava(s) ligados`);
    toast('Configuração do '+c.cod+' salva.','success');
    await carregar();renderNav();abrirConfigPop(c.cod);
  }catch(e){ await uiAlerta('Não foi possível salvar: '+esc(e.message||e),{titulo:'Erro',tipo:'dang'}); }
}

async function salvarNovaVersaoFicha(){
  const d=_docs.find(x=>x.id===_nvDocId);if(!d)return;
  const rev=document.getElementById('nv-rev').value.trim(),data=document.getElementById('nv-data').value,alt=document.getElementById('nv-alt').value.trim(),aprov=document.getElementById('nv-aprov').value.trim();
  if(!rev||!data||!alt){await uiAlerta('Informe a revisão, a data e o que mudou.',{titulo:'Incompleto',tipo:'warn'});return;}
  if(rev===String(d.revisao||'')){await uiAlerta(`A revisão atual já é ${esc(rev)}.`,{titulo:'Revisão repetida',tipo:'warn'});return;}
  const u=getUser(),quem=u?.nome||u?.email||'—';const f=_forms.find(x=>x.codigo===d.codigo);
  try{
    const h=await db(_supabase.from('bpf_documento_revisoes').insert({documento_cod:d.codigo,revisao:d.revisao||'00',data:dataVersao(d),alteracao:d.alteracao_atual||null,autor:d.revisado_por||d.aprovado_por||null,arquivo_path:null}),'histórico');
    if(h.error)throw h.error;
    const upd={revisao:rev,data_revisao:data,alteracao_atual:alt,revisado_por:quem,atualizado_em:new Date().toISOString()};
    if(aprov){upd.aprovado_por=aprov;upd.aprovado_em=data;}
    const r=await db(_supabase.from('bpf_documentos_mestre').update(upd).eq('id',d.id),'nova versão');if(r.error)throw r.error;
    await addLog('UPDATE','BPF',d.codigo,'Revisão '+(d.revisao||'00')+' → '+rev+': '+alt);
    if(_forms.some(x=>x.codigo==='REG-POP12-02')){ try{ await gerarRegistro('REG-POP12-02',{abrir:false,pre:{documento:d.codigo+' — '+d.titulo,revisao_entregue:rev,revisao_recolhida:d.revisao||'',obs:'Recolher as cópias impressas da rev. '+(d.revisao||'—')+'. O que mudou: '+alt}}); }catch(e){} }
    closeModal('m-ent');toast(`${d.codigo} agora está na revisão ${rev}.`,'success');
    await carregar();renderNav();if(_sec==='pop'&&_popSel)abrirPop(_popSel);else renderDocs();
  }catch(e){ await uiAlerta('Não foi possível salvar: '+esc(e.message||e),{titulo:'Erro',tipo:'dang'}); }
}
async function salvarNovaVersao(){
  const d=_docs.find(x=>x.id===_nvDocId);if(!d)return;
  const file=document.getElementById('nv-arq').files[0];
  const rev=document.getElementById('nv-rev').value.trim();
  const data=document.getElementById('nv-data').value;
  const prox=document.getElementById('nv-prox').value||null;
  const alt=document.getElementById('nv-alt').value.trim();
  const aprov=document.getElementById('nv-aprov').value.trim();
  const primeiro=!d.arquivo_path;
  if(!file){await uiAlerta('Escolha o arquivo.',{titulo:'Falta o arquivo',tipo:'warn'});return;}
  if(file.size>25*1024*1024){await uiAlerta('Arquivo acima de 25 MB.',{titulo:'Grande demais',tipo:'warn'});return;}
  if(!rev||!data){await uiAlerta('Informe a revisão e a data.',{titulo:'Incompleto',tipo:'warn'});return;}
  if(!primeiro&&!alt){await uiAlerta('Descreva o que mudou nesta versão — é o que fica no histórico.',{titulo:'Incompleto',tipo:'warn'});return;}
  if(!primeiro&&rev===String(d.revisao||'')){await uiAlerta(`A revisão atual já é ${esc(rev)}. Use um número novo.`,{titulo:'Revisão repetida',tipo:'warn'});return;}
  const u=getUser();const quem=u?.nome||u?.email||'—';
  const btn=document.getElementById('nv-ok');if(btn)btn.disabled=true;
  const path=`bpf/mestre/${d.codigo}_r${rev.replace(/\W/g,'')}_${Date.now()}_${file.name.replace(/[^\w.\-]/g,'_')}`;
  try{
    const {error}=await _supabase.storage.from('documentos').upload(path,file);
    if(error)throw error;
    // a versão atual vai para o histórico ANTES de ser substituída (com o arquivo dela)
    if(!primeiro){
      const h=await db(_supabase.from('bpf_documento_revisoes').insert({documento_cod:d.codigo,revisao:d.revisao,
        data:dataVersao(d),alteracao:d.alteracao_atual||null,autor:d.revisado_por||d.aprovado_por||null,
        arquivo_path:d.arquivo_path}),'histórico de versão');
      if(h.error)throw h.error;
    }
    const upd={arquivo_path:path,revisao:rev,data_revisao:data,status:'vigente',proxima_revisao:prox,
      alteracao_atual:alt||(primeiro?'Emissão inicial':null),revisado_por:quem,atualizado_em:new Date().toISOString()};
    if(aprov){upd.aprovado_por=aprov;upd.aprovado_em=data;}
    if(primeiro&&!d.data_emissao)upd.data_emissao=data;
    const r=await db(_supabase.from('bpf_documentos_mestre').update(upd).eq('id',d.id),'publicar versão');
    if(r.error)throw r.error;
    await addLog('UPDATE','BPF',d.codigo,primeiro?'Arquivo anexado (rev. '+rev+')':'Revisão '+(d.revisao||'—')+' → '+rev+': '+alt);
    // POP-12/002: documento mudou → nasce a ficha de distribuição/recolhimento das cópias antigas
    if(!primeiro&&_forms.some(f=>f.codigo==='REG-POP12-02')){
      try{ await gerarRegistro('REG-POP12-02',{abrir:false,pre:{documento:d.codigo+' — '+d.titulo,
        revisao_entregue:rev,revisao_recolhida:d.revisao||'',obs:'Recolher todas as cópias da rev. '+(d.revisao||'—')+' (impressas e na linha). O que mudou: '+alt}}); }
      catch(e){ console.warn('[POP-12]',e); }
    }
    closeModal('m-ent');
    toast(primeiro?`Arquivo anexado a ${d.codigo}.`:`${d.codigo} agora está na revisão ${rev}. A anterior foi para o histórico.`,'success');
    await carregar();renderNav();
    if(_sec==='pop'&&_popSel)abrirPop(_popSel);else if(_sec==='doc')abrirDoc(d.id);else renderDocs();
  }catch(e){ await uiAlerta(`Não foi possível salvar.<br><span style="font-size:11px;">${esc(e.message||e)}</span>`,{titulo:'Erro',tipo:'dang'}); }
  finally{ if(btn)btn.disabled=false; }
}

async function alternarTrava(cod){

}

let _tarefas=[],_gatilhos=[],_temFila=false,_tarefaAtual=null;
// ── ESCOPO POR DESIGNAÇÃO ──────────────────────────────────────────────────
// Camada 3: o perfil do ERP decide se a pessoa ABRE o módulo; a designação
// decide QUAIS POPs ela enxerga dentro dele. Sem isto o almoxarife entra no
// BPF e vê os 21 POPs, os 34 formulários e todos os registros da fábrica.
let _popsAll=[],_formsAll=[],_regsAll=[],_ncsAll=[],_treinsAll=[];
// Quem precisa ler tudo para fazer o trabalho: gestão, qualidade e auditoria.
const PERFIS_LEITURA_TOTAL=['SADM','ADM','QLD','AUD','DIR','GPR','SGR'];
// Set dos POPs do usuário, ou null quando ele vê tudo.
function meusPops(){
  const u=getUser(); if(!u) return new Set();
  if(PERFIS_LEITURA_TOTAL.includes(u.perfil)) return null;
  const minhas=_desig.filter(d=>d.ativo&&d.funcionario_nome===u.nome&&(!d.data_fim||d.data_fim>=hoje()));
  if(minhas.some(d=>!d.pop_cod)) return null;      // designação sem POP = todos
  return new Set(minhas.map(d=>d.pop_cod));
}
function noEscopoPop(cod){ const s=meusPops(); return !s || s.has(cod); }
function entNoEscopo(e){ return noEscopoPop(e.pop); }
function aplicarEscopo(){
  const s=meusPops();
  if(!s){ _pops=_popsAll;_forms=_formsAll;_regs=_regsAll;_ncs=_ncsAll;_treins=_treinsAll;
          aplicarEscopoNav(); return; }
  _pops  =_popsAll  .filter(p=>s.has(p.codigo));
  _forms =_formsAll .filter(f=>s.has(f.pop_cod));
  _regs  =_regsAll  .filter(r=>s.has(r.pop_cod));
  _ncs   =_ncsAll   .filter(n=>s.has(n.procedimento_cod));
  _treins=_treinsAll.filter(t=>s.has(t.procedimento_cod));
  aplicarEscopoNav();
}

const SECOES_LEITURA_TOTAL=['auditorias','canal','documentos','dossie','gatilhos','travas'];
const SECAO_NOME={auditorias:'Auditorias',canal:'Canais de manifestacao',documentos:'Documentos',

// ── VARREDURA ──────────────────────────────────────────────────────────────
// Puxa os eventos do ERP e cria as tarefas que faltam. Roda ao abrir o módulo
// e no botão "Procurar eventos agora". É PULL, não trigger no Postgres: não
// mexe em tabela de outro módulo e pode ser desligada só apagando a linha.
async function varrerGatilhos(silencioso){
  if(!_temFila)return 0;
  try{await vincularLoteRotulo();}catch(e){console.warn('[rótulo]',e);}
  const ativos=_gatilhos.filter(g=>g.ativo);
  if(!ativos.length){ if(!silencioso)toast('Nenhum gatilho ligado. Ligue um em ⚙️ Gatilhos.','warning'); return 0; }
  const novas=[],erros=[];
  const jaTem=new Set(_tarefas.map(t=>t.gatilho_cod+'|'+t.origem_ref));
  await Promise.all(ativos.map(async g=>{
    const rec=GATILHO_FONTES[g.codigo];
    if(!rec)return;
    try{
      let eventos=[];
      // registros nascem a partir da VIGÊNCIA do POP (data do PDF); sem vigência, vale o "desde" do gatilho
      const vig=(_pops.find(p=>p.codigo===g.pop_cod)||{}).data_vigencia||null;
      g._desde=vig||(g.filtro&&g.filtro.desde)||null;
      if(rec.cal) eventos=eventosCalendario(g,rec.cal);
      else {
        eventos=await rec.busca(g);
        if(rec.dias&&!vig){const lim=new Date(Date.now()-rec.dias*864e5).toISOString().slice(0,10);
          eventos=eventos.filter(e=>!e.quando||String(e.quando).slice(0,10)>=lim);}
        if(g._desde)eventos=eventos.filter(e=>!e.quando||String(e.quando).slice(0,10)>=g._desde);
      }
      for(const e of eventos){
        if(jaTem.has(g.codigo+'|'+e.ref))continue;
        jaTem.add(g.codigo+'|'+e.ref);
        novas.push({status:'aberta',gatilho_cod:g.codigo,formulario_cod:g.formulario_cod,pop_cod:g.pop_cod,
          funcao_cod:funcaoColeta(g.formulario_cod),origem_tabela:g.fonte_tabela,
          origem_id:e.id?String(e.id):null,origem_ref:e.ref,origem_det:e.det,pre:e.pre||{},
          prazo:new Date(Date.parse((e.quando&&e.quando.length>10?e.quando:(e.quando||hoje())+'T08:00:00'))+
            (g.prazo_horas||24)*36e5).toISOString()});
      }
    }catch(err){ erros.push(g.codigo+': '+(err.message||err)); }
  }));
  if(novas.length){
    // ignoreDuplicates cobre a corrida entre dois usuários abrindo o módulo junto.
    for(let i=0;i<novas.length;i+=500){
      const r=await db(_supabase.from('bpf_tarefas').upsert(novas.slice(i,i+500),{onConflict:'gatilho_cod,origem_ref',ignoreDuplicates:true}),'criar tarefas');
      if(r.error)return 0;
    }
    _tarefas=await selectTodos(_supabase.from('bpf_tarefas').select('*').order('prazo'),{max:50000}).then(r=>r.data||_tarefas).catch(()=>_tarefas);
    await gerarRegistrosDasTarefas();
  }
  if(erros.length&&!silencioso)
    toast(`${novas.length} tarefa(s) criada(s). ${erros.length} gatilho(s) falharam — ver console.`,'warning'),console.warn('[gatilhos]',erros);
  else if(!silencioso)
    toast(novas.length?`${novas.length} tarefa(s) criada(s).`:'Nada novo — tudo já estava na fila.',novas.length?'success':'info');
  return novas.length;
}
// Cada tarefa nova já nasce com o REGISTRO pendente (ficha "A preencher"),
// pré-preenchido com o que o ERP trouxe. A tarefa fecha quando o registro é digitado.
async function gerarRegistrosDasTarefas(){
  const _regTarefa=new Set(_regs.map(r=>r.tarefa_id).filter(Boolean));
  const desdeImpl='2026-10-26';
  const novas=_tarefas.filter(t=>t.status==='aberta'&&!t.registro_id&&String(t.criado_em||'').slice(0,10)>=desdeImpl
    &&!_regTarefa.has(t.id));
  if(!novas.length)return 0;
  const u=getUser();
  const agora=new Date().toISOString();
  const rows=novas.map(t=>{
    // por enquanto TODO registro nasce em "A preencher" (inclusive os do laboratório)
    const dig=false&&!!(GATILHO_FONTES[t.gatilho_cod]||{}).digital;
    const pre={...(t.pre||{})};const resp=pre._resp||null;delete pre._resp;
    const f=_forms.find(x=>x.codigo===t.formulario_cod);
    const conforme=f?avaliar(f.campos||[],pre).length===0:true;
    return {formulario_cod:t.formulario_cod,pop_cod:t.pop_cod,
      // data do EVENTO (o prazo é depois): prazo − horas do gatilho, no horário de Brasília
      data:(()=>{const g=_gatilhos.find(x=>x.codigo===t.gatilho_cod);const ms=Date.parse(t.prazo||'');
        return isNaN(ms)?hoje():new Date(ms-((g&&g.prazo_horas)||24)*36e5).toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'});})(),hora:null,campos:pre,
      status:dig?(conforme?'aguardando_assinatura':'nao_conforme'):'a_preencher',conforme,
      anexos:[],assinaturas:[],assinaturas_papel:{},origem_modulo:t.origem_tabela||null,origem_id:t.origem_id||null,
      tarefa_id:t.id,criado_por:'Gatilho '+t.gatilho_cod,
      ...(dig?{preenchido_por:resp||'Laboratório',lancado_por:resp||'Laboratório',lancado_em:agora,
        foto_ficha:{digital:true,nome:'Lançado pelo Laboratório (sem ficha em papel)',em:agora,por:resp||'Laboratório'}}:{})};
  });
  // em lotes de 300 (requisições menores, não trava a tela)
  const r={data:[],error:null};
  for(let i=0;i<rows.length;i+=300){ const x=await db(_supabase.from('bpf_registros').insert(rows.slice(i,i+300)).select(),'gerar fichas das tarefas');
    if(x.error){r.error=x.error;break;} r.data.push(...(x.data||[])); }
  if(r.error)return 0;
  // liga cada tarefa à sua ficha numa única chamada ao banco (antes: uma por ficha)
  try{ await _supabase.rpc('bpf_vincular_tarefas'); }catch(e){}
  for(const reg of (r.data||[])){
    const t=_tarefas.find(x=>x.id===reg.tarefa_id);if(t){t.registro_id=reg.id;if(reg.lancado_em)t.status='concluida';}
    _regs.unshift(reg);
  }
  // numeração em ordem de data (o mais antigo desde a vigência é o 000001) — só mexe se nenhuma ficha ativa
  // daquele registro já foi impressa, lançada ou assinada
  const forms=[...new Set((r.data||[]).map(x=>x.formulario_cod))];
  let mudou=false;
  for(const fc of forms){ try{ const {data:n}=await _supabase.rpc('bpf_renumerar',{p_form:fc}); if(n)mudou=true; }catch(e){} }
  if(mudou){ try{ await carregar(); }catch(e){} }
  return (r.data||[]).length;
}
// Pendências da fila criadas ANTES do fluxo novo: encerrar em lote, com motivo.
async function encerrarPendenciasAntigas(){
  if(!guardAction('bpf','edit'))return;
  const lim='2026-10-26';
  const velhas=_tarefas.filter(t=>t.status==='aberta'&&!t.registro_id&&String(t.criado_em||'').slice(0,10)<lim);
  if(!velhas.length){toast('Nenhuma pendência antiga.','info');return;}
  const m=await uiTexto(`<strong>${velhas.length} tarefa(s)</strong> abertas antes de ${fmtD(lim)} e que nunca viraram ficha.
    <div style="margin-top:6px;font-size:11.5px;color:#64748b;">Elas não são apagadas: ficam como canceladas, com este motivo, na trilha.</div>`,
    {titulo:'Encerrar pendências antigas',rotulo:'Motivo',ok:'Encerrar todas',obrigatorio:true,linhas:2});
  if(m===null||!String(m).trim())return;
  const u=getUser();

  renderFila();marcarArea('fila');
}
function eventosCalendario(g,tipo){
  const h=hoje(),ini=h.slice(0,8)+'01';
  if(tipo==='mensal')  return [{ref:'CAL/'+g.codigo+'/'+h.slice(0,7),id:null,quando:ini,
    det:`${g.evento} — competência ${h.slice(5,7)}/${h.slice(0,4)}`,pre:{}}];
  if(tipo==='diaria')  return [{ref:'CAL/'+g.codigo+'/'+h,id:null,quando:h,
    det:`${g.evento} — ${fmtD(h)}`,pre:{}}];
  if(tipo==='anual_dez'){ if(new Date().getMonth()!==11)return [];
    return [{ref:'CAL/'+g.codigo+'/'+h.slice(0,4),id:null,quando:h,det:g.evento,pre:{ano:+h.slice(0,4)+1}}]; }
  return [];
}
async function cancelarTarefa(id){

    {titulo:'Cancelar tarefa',rotulo:'Motivo',ok:'Cancelar tarefa'});

  const u=getUser();

async function abrirTarefa(id){
  const t=_tarefas.find(x=>x.id===id);if(!t)return;
  if(!souDaFuncao(t.funcao_cod,t.pop_cod)){
    await uiAlerta(`Esta ficha é da função <strong>${esc(nomeFuncao(t.funcao_cod))}</strong> e você não tem designação vigente para ela no ${esc(t.pop_cod)}.
      <div style="margin-top:5px;" class="sys">SYS-036</div>`,{titulo:'Sem designação',tipo:'dang'});return;}
  // já existe ficha gerada por esta tarefa? abre ela em vez de criar outra
  const ja=_regs.find(r=>(r.tarefa_id===t.id||r.id===t.registro_id)&&!r.cancelado_em);
  if(ja){abrirReg(ja.id);return;}
  await gerarRegistro(t.formulario_cod,{pre:t.pre||{},tarefa:t,origemMod:t.origem_tabela||null,origemId:t.origem_ref||null});
}

// Edita a lista de itens sem deploy — é a razão de bpf_gatilhos existir.
async function editarItens(cod){
  if(!guardAction('bpf','edit'))return;
  const g=_gatilhos.find(x=>x.codigo===cod);if(!g)return;
  const atual=((g.filtro&&g.filtro.itens)||[]).join(', ');
  const txt=await uiTexto(
    `Códigos de item que passam por este gatilho, separados por vírgula.
     <div style="margin-top:7px;font-size:11.5px;color:#64748b;">
       Hoje a nutrição animal usa <code>ALM-0456</code> (Saco de Papel Caulim 25 kg) e
       <code>ALM-0448</code> (Big Bag). Deixar em branco desliga o gatilho na prática:
       ele não gera ficha nenhuma.</div>`,
    {titulo:'Itens do gatilho — '+esc(g.evento),rotulo:'Códigos',ok:'Salvar',obrigatorio:false,linhas:2});
  if(txt===null)return;
  const itens=String(txt).split(/[,;\s]+/).map(x=>x.trim().toUpperCase()).filter(Boolean);
  const r=await db(_supabase.from('bpf_gatilhos').update({filtro:{...(g.filtro||{}),itens}}).eq('codigo',cod),'salvar itens');
  if(r.error)return;
  await addLog('UPDATE','BPF',cod,'Itens do gatilho: '+(itens.join(', ')||'(vazio)'));
  g.filtro={...(g.filtro||{}),itens};
  toast(itens.length?`${itens.length} item(ns) no gatilho.`:'Lista vazia — o gatilho não vai gerar ficha.',itens.length?'success':'warning');
  await carregar();renderGatilhos();
}
async function togGatilho(cod){
  if(!guardAction('bpf','edit'))return;
  const g=_gatilhos.find(x=>x.codigo===cod);if(!g)return;
  const nova=!g.ativo;
  if(nova&&!GATILHO_FONTES[cod]){
    const ok=await uiConfirma(`Este gatilho ainda não tem receita de consulta no JS (<code>GATILHO_FONTES</code>).
      <div style="margin-top:8px;">Ligar agora <strong>não cria tarefa nenhuma</strong> — fica registrado como intenção.</div>`,
      {titulo:'Sem receita',tipo:'warn',ok:'Ligar assim mesmo'});
    if(!ok)return;}
  if(nova&&g.filtro&&Array.isArray(g.filtro.itens)&&!g.filtro.itens.length){
    await uiAlerta(`Este gatilho tem <strong>lista de itens vazia</strong> e por isso não geraria ficha nenhuma.
      <div style="margin-top:7px;">Cadastre os códigos em <strong>editar</strong>, ao lado da lista, antes de ligar.</div>`,
      {titulo:'Lista de itens vazia',tipo:'warn'});return;}
  if(nova){
    const fn=funcaoColeta(g.formulario_cod), pes=pessoasDaFuncao(fn,g.pop_cod);
    if(!pes.length){
      const ok=await uiConfirma(`Ninguém tem designação de <strong>${esc(nomeFuncao(fn))}</strong> no ${esc(g.pop_cod)}.
        <div style="margin-top:8px;">A tarefa vai ser criada e <strong>ficar sem dono</strong>.</div>`,
        {titulo:'Sem designação',tipo:'warn',ok:'Ligar assim mesmo'});
      if(!ok)return;}}
  const r=await db(_supabase.from('bpf_gatilhos').update({ativo:nova}).eq('codigo',cod),'alterar gatilho');
  if(r.error)return;
  await addLog('UPDATE','BPF',cod,(nova?'Gatilho LIGADO: ':'Gatilho desligado: ')+g.evento);
  g.ativo=nova;
  toast(nova?'Gatilho ligado.':'Gatilho desligado.',nova?'success':'warning');
  if(nova) await varrerGatilhos(true);
  await carregar();renderNav();renderGatilhos();
}

async function htmlDossieBusca(){

    <p>Ou abra um lote pela tela de Registros.</p></div>`;

  const hits=[];
  // registros do próprio BPF
  _regs.filter(r=>bate(r.numero)||Object.values(r.campos||{}).some(v=>bate(v)))
    .filter(r=>dentro(r.data)).slice(0,25).forEach(r=>{

      const l=await lst(_supabase.from(tab).select(sel).limit(400));
      l.forEach(r=>{const m=map(r); if(m&&bate(...m.busca)&&dentro(m.data)) hits.push(m.hit);});

        btn:r.lancamento_id?`<button class="btn btn-ghost btn-sm" onclick="verLoteDossie('OP:${esc(r.lancamento_id)}|${esc(r.produto||'')}')">ver dossiê do lote</button>`:''}})),
    tenta('caulim_lotes_producao','*',r=>({busca:[r.numero],data:(r.data_abertura||'').slice(0,10),
      hit:{t:'Lote de produção',lb:r.numero||r.id,sub:`${r.status||''} · aberto ${fmtD(r.data_abertura)}`,
        btn:`<button class="btn btn-secondary btn-sm" onclick="verLoteDossie('${esc(r.numero||'')}')">ver dossiê</button>`}})),
    tenta('caulim_lotes_mp','*',r=>({busca:[r.numero,r.analista_mp],data:r.data,
      hit:{t:'Lote de MP',lb:r.numero||r.id,sub:`${r.montante_t||'?'} t · ΔE ${r.delta_e??'—'} · ${fmtD(r.data)}`,btn:''}})),
    tenta('caulim_unidades','*',r=>({busca:[r.qr_codigo],data:(r.criado_em||'').slice(0,10),

    tenta('almoxarifado_movimentos','*',r=>({busca:[r.nota_fiscal,r.lote,r.fornecedor_destino,r.numero_doc],data:r.data,

  ]);
  if(!hits.length) return `<div class="empty"><div class="ic">🔎</div><h3>Nada encontrado</h3>
    <p>Nenhum registro, lote, unidade, carregamento ou nota fiscal bate com “${esc(_dq.q)}”.</p></div>`;

      <div class="tk-ac">${h.btn}</div></div>`).join('');

async function htmlDossieLote(chave){
  // chave "OP:<id>|<produto>" (veio de um pallet) → acha o lote do item da OP
  let lote=chave, op=null, item=null;
  try{
    if(String(chave).startsWith('OP:')){
      const [idp,prod]=String(chave).slice(3).split('|');
      op=(await lst(_supabase.from('producao').select('*').eq('id',idp).limit(1)))[0]||null;
      item=op?(itensDaOP(op).find(i=>_normP(i.produto)===_normP(prod))||itensDaOP(op)[0]):null;
      lote=item?.lote||chave;
    }else{
      const ops=await lst(_supabase.from('producao').select('*').order('data',{ascending:false}).limit(800));
      for(const o of ops){const it=itensDaOP(o).find(i=>String(i.lote||'')===String(lote));if(it){op=o;item=it;break;}}
    }
  }catch(e){}
  return htmlDossieLoteBase(lote,op,item);
}

  let labs=[],labPal=[];
  try{ if(op){ labs=(await lst(_supabase.from('laboratorio').select('*').eq('data',op.data).eq('linha',op.linha))).filter(x=>!item||_normP(x.produto)===_normP(item.produto));
                labPal=await lst(_supabase.from('lab_pallet_analises').select('resultado,produto,pallet_numero,data,assinatura_nome').eq('lancamento_id',op.id).limit(300)); } }catch(e){}
  try{ car=await lst(_supabase.from('carregamentos').select('*').order('data',{ascending:false}).limit(200)); }catch(e){}
  const qa=(n,perg,resp,acao)=>`<div class="qa"><div class="qa-q"><span class="qa-n">${n}</span>${perg}
    <span style="flex:1;"></span>${acao||''}</div><div class="qa-a">${resp}</div></div>`;
  const rEmb=um('REG-POP01-01'), rMP=um('REG-POP02-01'), rLab=um('REG-POP15-01'), rCert=um('REG-POP15-02');
  const limpezas=_regs.filter(r=>r.formulario_cod==='REG-POP03-01'&&!r.cancelado_em).slice(0,6);
  const nomeAss=r=>(r?.assinaturas||[]).map(a=>`${esc(a.nome)} (${esc(a.label)})`).join(' · ')||'—';
  let h=`<div class="sec-card" style="margin-top:12px;">
    <h3>Dossiê do lote ${esc(lote)}</h3>
    <div class="sub">${op?`OP <strong>${esc(op.op_numero||'')}</strong> · ${esc(op.linha||'')} · turno ${esc(op.turno||'—')} · ${fmtD(op.data)} · encarregado ${esc(op.encarregado||'—')}`
      :lp?`${esc(lp.status||'')} · aberto ${fmtD(lp.data_abertura)}`:'Lote não encontrado nas OPs — mostrando o que existe nos registros do BPF.'}</div>
    <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;" class="no-print">
      <button class="btn btn-ghost btn-sm" onclick="_dqLote=null;pintarDossie()">← voltar à busca</button>
      <button class="btn btn-secondary btn-sm" onclick="imprimirDossie()">🖨️ Imprimir dossiê</button>
      ${_forms.some(f=>f.codigo==='REG-POP10-01')?`<button class="btn btn-secondary btn-sm" onclick="gerarRastreabilidade('${esc(lote)}')">📋 Gerar REG-POP10-01 (rastreabilidade)</button>`:''}</div></div>`;
  if(op){
    h+=qa(0,'A ordem de produção deste lote',
      `<div class="dl-g"><b>OP</b><span>${esc(op.op_numero||'—')}</span>
        <b>Produto</b><span>${esc(item?.produto||produtosDaOP(op))}</span>
        <b>Quantidade</b><span>${esc(item?.total_sacos||item?.sacos_pallets||'—')} un.</span>
        <b>Lote de MP</b><span>${esc(op.lote_mp||'—')}</span>
        <b>Validade</b><span>${fmtD(item?.validade)}</span>
        <b>Linha / turno</b><span>${esc(op.linha||'—')} · ${esc(op.turno||'—')}</span>
        <b>Encarregado</b><span>${esc(op.encarregado||'—')}</span></div>`);
    h+=qa('0b','O laboratório — análise da linha e dos pallets',
      (labs.length||labPal.length)?`${labs.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Hora</th><th>Status da linha</th><th>Umidade</th><th>#20</th><th>#50</th><th>#100</th><th>#200</th><th>Analista</th></tr></thead><tbody>
        ${labs.map(x=>{const pz=x.peneiramento||{};return `<tr><td>${esc(String(x.hora||'').slice(0,5))}</td><td><b>${esc(x.status||'')}</b></td><td>${esc(x.umidade??'—')}</td>
          <td>${esc(pz.p20??'—')}</td><td>${esc(pz.p50??'—')}</td><td>${esc(pz.p100??'—')}</td><td>${esc(pz.p200??'—')}</td><td>${esc(x.responsavel_analise||x.responsavel||'—')}</td></tr>`;}).join('')}</tbody></table></div>`:''}
        ${labPal.length?`<div class="dl-g" style="margin-top:8px;"><b>Pallets analisados</b><span>${labPal.length}</span>
          <b>Aprovados</b><span>${labPal.filter(x=>/aprov/i.test(x.resultado||'')).length}</span>
          <b>Reprovados</b><span>${labPal.filter(x=>/reprov/i.test(x.resultado||'')).length}</span></div>`:''}`
      :'<div class="alerta al-info">Sem análise do laboratório para esta OP.</div>');
  }
  h+=qa(1,'A embalagem usada neste lote — quando chegou e em que condição?',
    rEmb?`<div class="dl-g"><b>Fornecedor</b><span>${esc(rEmb.campos.fornecedor||'—')}</span>
      <b>Nota fiscal</b><span>${esc(rEmb.campos.nota_fiscal||'—')}</span>
      <b>Lote do fabricante</b><span>${esc(rEmb.campos.lote||'—')}</span>
      <b>Recebida em</b><span>${fmtD(rEmb.data)} ${esc(rEmb.hora||'')}</span>
      <b>Homologado?</b><span>${esc(rEmb.campos.fornecedor_homologado||'—')}</span>
      <b>Íntegra?</b><span>${esc(rEmb.campos.integridade||'—')}</span>
      <b>Assinaturas</b><span>${nomeAss(rEmb)}</span></div>`
    :'<div class="alerta al-warn">Nenhum REG-POP01-01 vinculado a este lote ainda.</div>', btn(rEmb));
  h+=qa(2,'Qual matéria-prima foi usada nesta produção?',
    (lmp||rMP)?`<div class="dl-g">
      <b>Lote de MP</b><span>${esc(lmp?.numero||rMP?.campos.lote_mp||'—')}</span>
      <b>Frente</b><span>${esc(rMP?.campos.mina_frente||lmp?.frente_id||'—')}</span>
      <b>Montante</b><span>${esc(lmp?.montante_t||rMP?.campos.montante_t||'—')} t</span>
      <b>ΔE</b><span>${esc(lmp?.delta_e??rMP?.campos.delta_e??'—')} (limite 1,0)</span>
      <b>Decisão</b><span>${esc(rMP?.campos.decisao||lmp?.cor_aprovada||'—')}</span>
      <b>Liberado por</b><span>${nomeAss(rMP)}</span></div>
      <div class="aj" style="margin-top:6px;">A cor reprova a MP e não é reensaiada na produção — o lote herda cor e variação do lote de MP.</div>`
    :'<div class="alerta al-warn">Sem lote de MP vinculado.</div>', btn(rMP));
  const carDoLote=car.filter(c=>String(JSON.stringify(c.itens||'')).includes(lote)||pal.some(p=>p.ordem_numero===c.ordem_numero));
  h+=qa(3,'Quais clientes carregaram esta produção?',
    carDoLote.length||pal.some(p=>p.cliente_dest)
    ?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ordem</th><th>Data</th><th>Motorista</th><th>Placa</th><th>Pallets</th><th>Inspeção do veículo</th></tr></thead><tbody>
      ${(carDoLote.length?carDoLote:[]).map(c=>{
        const rv=_regs.find(r=>r.formulario_cod==='REG-POP21-01'&&String(r.campos?.ordem||'')===String(c.ordem_numero||''));
        return `<tr><td class="num">${esc(c.ordem_numero||c.id)}</td><td>${fmtD(c.data)}</td>
          <td>${esc(c.motorista||'')}</td><td>${esc(c.placa||'')}</td><td>${c.total_pallets||0}</td>
          <td>${rv?`<button class="btn btn-ghost btn-sm" onclick="verRegistro('${rv.id}')">📄 ${esc(rv.numero)}</button>`
            :'<span class="badge badge-warning">sem inspeção</span>'}</td></tr>`;}).join('')}
      ${pal.filter(p=>p.cliente_dest).slice(0,20).map(p=>`<tr><td class="num">${esc(p.romaneio_numero||'—')}</td>
        <td>${fmtD(p.carregado_em||p.data)}</td><td colspan="2">${esc(p.cliente_dest)}</td><td>1</td>
        <td><span class="badge badge-gray">pallet ${esc(p.codigo||'')}</span></td></tr>`).join('')}
      </tbody></table></div>`
    :'<div class="alerta al-info">Nenhum carregamento registrado para este lote.</div>');
  h+=qa(4,'O que está em estoque agora?',
    pal.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Unidade</th><th>Produto</th><th>Situação</th><th>Local</th></tr></thead><tbody>
      ${pal.slice(0,30).map(p=>`<tr><td class="num">${esc(p.codigo||p.id)}</td><td>${esc(p.produto||'')}</td>
        <td>${esc(p.estoque_status||p.status||'')}${p.motivo_bloqueio?' — '+esc(p.motivo_bloqueio):''}</td>
        <td>${esc(p.barracao||'—')}</td></tr>`).join('')}</tbody></table></div>`
    :(uni.length?`<div class="dl-g"><b>Unidades com QR</b><span>${uni.length}</span>
        <b>Liberadas</b><span>${uni.filter(u=>u.status==='liberada').length}</span>
        <b>Aguardando</b><span>${uni.filter(u=>u.status!=='liberada').length}</span></div>`
      :'<div class="alerta al-info">Sem unidades registradas para este lote.</div>'));
  h+=qa(5,'Quais ensaios liberaram este lote?',
    rLab?`<div class="dl-g">${['pen20','pen50','pen100','pen200','umidade','mm','peso_especifico','decisao']
      .filter(k=>rLab.campos[k]!==undefined&&rLab.campos[k]!=='')
      .map(k=>`<b>${esc(k)}</b><span>${esc(rLab.campos[k])}</span>`).join('')}
      <b>Assinaturas</b><span>${nomeAss(rLab)}</span></div>
      ${rCert?`<div class="aj" style="margin-top:6px;">Certificado ${esc(rCert.campos.numero_cert||'')} —
        validade ${fmtD(rCert.campos.validade)} (fabricação + 36 meses).</div>`:''}`
    :'<div class="alerta al-warn">Sem boletim de análise (REG-POP15-01) para este lote.</div>', btn(rLab));
  h+=qa(6,'A limpeza — como foi feita, quando, por quem, e quem verificou?',
    limpezas.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr>
      <th>Data</th><th>Horário</th><th>Áreas</th><th>Destino</th><th>Assinaturas</th><th></th></tr></thead><tbody>
      ${limpezas.map(r=>`<tr><td>${fmtD(r.data)}</td>
        <td>${esc(r.campos.hora_ini||'')} – ${esc(r.campos.hora_fim||'')}</td>
        <td>${esc([].concat(r.campos.areas||[]).join(', '))}</td>
        <td>${esc(r.campos.destino_varredura||'')}</td>
        <td style="font-size:11px;">${nomeAss(r)}</td>
        <td><button class="btn btn-ghost btn-sm" onclick="verRegistro('${r.id}')">📄</button></td></tr>`).join('')}
      </tbody></table></div>
      <div class="aj" style="margin-top:6px;">As colunas que faltavam: quem verificou, quem aprovou e quando.</div>`
    :'<div class="alerta al-warn">Nenhum registro de limpeza (REG-POP03-01) no período.</div>');
  const todos=regsDo();
  const popTit=c=>(_docs.find(d=>d.codigo===c)||{}).titulo||'';
  h+=qa(7,'Todos os registros BPF ligados a este lote',
    todos.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>POP</th><th>Registro</th><th>Nº</th><th>Data</th><th>Situação</th><th>Preenchido / lançado</th><th>Assinaturas</th><th></th></tr></thead><tbody>
      ${todos.sort((a,b)=>String(a.pop_cod).localeCompare(String(b.pop_cod))).map(r=>{const f=_forms.find(x=>x.codigo===r.formulario_cod);
        return `<tr><td><b>${esc(r.pop_cod)}</b><div class="bx-mu" style="font-size:11px;">${esc(popTit(r.pop_cod))}</div></td>
          <td><b>${esc(r.formulario_cod)}</b><div class="bx-mu" style="font-size:11px;">${esc(f?.titulo||'')}</div></td>
          <td class="num">${esc(r.numero||'')}</td><td>${fmtD(r.data)}</td><td>${badgeEtapa(r)}</td>
          <td style="font-size:11.5px;">${esc(r.preenchido_por||'—')} / ${esc(r.lancado_por||'—')}</td>
          <td style="font-size:11.5px;">${nomeAss(r)}</td>
          <td class="no-print"><button class="btn btn-ghost btn-sm" onclick="abrirReg('${r.id}')">abrir</button></td></tr>`;}).join('')}
      </tbody></table></div>`:'<div class="alerta al-info">Nenhum registro cita este lote.</div>');
  return h;
}
function imprimirDossie(){
  const out=document.getElementById('dq-out');if(!out)return;
  document.getElementById('print-area').innerHTML=`<div style="font-family:'Plus Jakarta Sans',sans-serif;">
    <div style="border-bottom:2.5px solid #042D4D;padding-bottom:8px;margin-bottom:10px;"><b style="font-size:15px;color:#042D4D;">SILICATE — DOSSIÊ DE AUDITORIA</b>
    <div style="font-size:10.5px;color:#64748b;">Gerado em ${new Date().toLocaleString('pt-BR')}</div></div>${out.innerHTML}</div>`;
  document.querySelectorAll('#print-area .no-print,#print-area button').forEach(e=>e.remove());
  window.print();
}
// POP-10/001 é do "tipo dossiê": gera o registro de rastreabilidade já preenchido com o que o dossiê achou
async function gerarRastreabilidade(lote){
  let op=null,item=null,pal=[];
  try{ const ops=await lst(_supabase.from('producao').select('*').order('data',{ascending:false}).limit(800));
    for(const o of ops){const it=itensDaOP(o).find(i=>String(i.lote||'')===String(lote));if(it){op=o;item=it;break;}}
    if(op)pal=await lst(_supabase.from('producao_pallets').select('cliente_dest,romaneio_numero,ordem_numero').eq('lancamento_id',op.id).limit(500)); }catch(e){}
  const clientes=[...new Set(pal.map(p=>p.cliente_dest).filter(Boolean))];
  const romaneios=[...new Set(pal.map(p=>p.romaneio_numero||p.ordem_numero).filter(Boolean))];
  const reg=await gerarRegistro('REG-POP10-01',{abrir:true,origemMod:'producao',origemId:op?String(op.id):null,
    pre:{lote_producao:lote,lote_mp:op?.lote_mp||'',unidades:pal.length||null,
      notas_fiscais:[clientes.length?'Clientes: '+clientes.join(', '):'',romaneios.length?'Romaneios/ordens: '+romaneios.join(', '):''].filter(Boolean).join('\n'),
      obs:op?`OP ${op.op_numero||''} · ${op.linha||''} · ${fmtD(op.data)} · ${item?.produto||''}`:''}});
  return reg;
}
