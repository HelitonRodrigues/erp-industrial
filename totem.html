<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only"><!-- não deixa o modo escuro do navegador escurecer a central -->
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/totem.webmanifest">
<meta name="theme-color" content="#042D4D">
<link rel="icon" href="/icons/totem-192.png">
<title>Central de rótulos</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/qrcode.min.js"></script>
<style>
/* Central de rótulos — tablet em pé (≈ 800 × 1280). Ver comentário no script. */
:root{--navy:#042D4D;--navy2:#0B3F66;--lime:#C9FF64;--ink:#0B1F33;--bg:#EEF2F6;--surface:#fff;--line:#D9E1EA;--muted:#5B6B7C;
  --ok:#16A34A;--ok-soft:#DCFCE7;--warn:#B45309;--warn-soft:#FEF3C7;--err:#B91C1C;--err-soft:#FEE2E2;--sel-ink:#052e16;
  --sh:0 1px 2px rgba(4,45,77,.06),0 6px 18px rgba(4,45,77,.08);--sh-press:0 1px 2px rgba(4,45,77,.10);}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:manipulation;}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent;}
button:focus-visible{outline:4px solid #2563EB;outline-offset:3px;}
button:disabled{opacity:.45;cursor:default;}

/* topo */
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 18px;}
.voltar-erp{color:#fff;text-decoration:none;font-size:20px;font-weight:800;width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.12);}
.btn-cheia{color:#fff;font-size:20px;font-weight:800;width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.12);margin-left:12px;flex-shrink:0;}
.brand{font-weight:800;font-size:21px;letter-spacing:-.01em;}
.brand small{display:block;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.6);}
.est{display:none;}
.clock{margin-left:auto;text-align:right;}
.clock b{display:block;font-size:32px;line-height:1;color:var(--lime);font-variant-numeric:tabular-nums;}
.clock span{font-size:12.5px;color:rgba(255,255,255,.75);}

/* faixa das impressoras */
.estbar{display:flex;align-items:center;gap:12px;padding:12px 18px;font-weight:800;font-size:17px;}
.estbar.ok{background:var(--ok-soft);color:var(--sel-ink);}
.estbar.off{background:var(--err);color:#fff;font-size:19px;padding:16px 18px;}
.estbar .dot{width:14px;height:14px;border-radius:50%;background:var(--ok);flex-shrink:0;box-shadow:0 0 0 4px rgba(22,163,74,.18);}
.estbar.off .dot{background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.25);}
.estbar small{display:block;font-size:14px;font-weight:600;opacity:.9;}

.wrap{max-width:1000px;margin:0 auto;padding:18px 18px 40px;}

/* passos */
.trail{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
.chip{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:9px 16px 9px 9px;font-weight:800;font-size:17px;color:#334155;max-width:100%;box-shadow:var(--sh-press);}
.chip:disabled{opacity:1;cursor:default;}
.chip span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chip .n{width:30px;height:30px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;font-size:15px;background:#E2E8F0;color:#334155;}
.chip.done{border-color:var(--ok);color:var(--sel-ink);}
.chip.done .n{background:var(--ok);color:#fff;}
.chip.now{border-color:var(--navy);background:var(--navy);color:#fff;}
.chip.now .n{background:var(--lime);color:var(--navy);}

h1.q{font-size:clamp(30px,5vw,42px);font-weight:800;letter-spacing:-.025em;margin:4px 0 16px;line-height:1.08;}
.hint{color:var(--muted);font-size:16px;margin:-8px 0 18px;}
.grp{font-size:17px;font-weight:800;margin:22px 0 10px;display:flex;align-items:center;gap:10px;color:#334155;}
.grp i{width:16px;height:16px;border-radius:5px;background:var(--c);display:inline-block;}

/* cartões */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}
.big{background:var(--surface);border:2px solid transparent;border-radius:20px;min-height:100px;padding:16px 18px;text-align:left;font-size:22px;font-weight:800;display:flex;flex-direction:column;justify-content:center;gap:4px;line-height:1.15;box-shadow:var(--sh);transition:transform .08s,box-shadow .08s;}
.big:active{transform:scale(.98);box-shadow:var(--sh-press);}
.big small{font-size:14px;font-weight:600;color:var(--muted);}
.big.sel{border-color:var(--ok);background:var(--ok-soft);color:var(--sel-ink);}
.prod{position:relative;overflow:hidden;padding-left:32px;font-size:20px;}
.prod::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--c);}

/* linhas: 4 botões gigantes 2×2 ocupando a tela */
.linhas{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.linhas .big{min-height:clamp(150px,calc((100dvh - 430px)/2),420px);padding:24px;justify-content:flex-end;font-size:clamp(30px,5.4vw,46px);letter-spacing:-.02em;position:relative;overflow:hidden;}
.linhas .big small{font-size:17px;margin-top:4px;}
.linhas .big::after{content:"→";position:absolute;top:18px;right:22px;font-size:30px;color:var(--navy);opacity:.25;}
.linhas .big .ico{position:absolute;top:18px;left:22px;width:54px;height:54px;border-radius:16px;background:var(--navy);color:var(--lime);display:grid;place-items:center;font-size:22px;font-weight:800;letter-spacing:0;}

/* cartão de linha com foto: foto de fundo, faixa escura embaixo, só o nome em branco */
.linhas .linha-card{color:#fff;background:linear-gradient(150deg,#0B3F66,#042D4D);border:3px solid transparent;}
.linhas .linha-card.com-foto{background:linear-gradient(to top,rgba(4,25,45,.95) 0%,rgba(4,25,45,.7) 28%,rgba(4,25,45,.08) 62%,rgba(4,25,45,0) 100%),var(--img) center/cover no-repeat,#042D4D;}
.linhas .linha-card .nm{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-.02em;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.55);}
.linhas .linha-card .ico{background:var(--lime);color:var(--navy);box-shadow:0 4px 14px rgba(0,0,0,.25);}
.linhas .linha-card::after{color:#fff;opacity:.9;text-shadow:0 2px 8px rgba(0,0,0,.5);}
.linhas .linha-card.sel{border-color:var(--lime);}
/* quantidade */
.qty{display:flex;align-items:center;justify-content:center;gap:22px;background:var(--surface);border-radius:24px;padding:30px;box-shadow:var(--sh);}
.qty button{width:120px;height:120px;border-radius:28px;background:var(--navy);color:#fff;font-size:60px;font-weight:700;line-height:1;}
.qty button:active{transform:scale(.96);}
.qty button:disabled{opacity:.3;}
.qty output{min-width:180px;text-align:center;font-size:110px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;}
.rapido{display:flex;gap:12px;margin-top:14px;}
.rapido button{flex:1;height:80px;border-radius:18px;background:var(--surface);border:2px solid var(--navy);color:var(--navy);font-size:24px;font-weight:800;box-shadow:var(--sh-press);}
.rapido button:active{transform:scale(.97);}
.qty-lbl{text-align:center;color:var(--muted);font-weight:700;margin-top:12px;font-size:16px;}

/* ações */
.actions{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap;}
.btn{border-radius:18px;padding:20px 28px;font-size:21px;font-weight:800;min-height:74px;}
.btn:active{transform:scale(.98);}
.btn-go{background:var(--lime);color:var(--navy);flex:1;min-width:240px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14),var(--sh);}
/* Voltar: escuro, contorno, nunca parece um cartão de linha/produto */
.btn-back{background:transparent;color:var(--navy);border:3px solid var(--navy);display:inline-flex;align-items:center;justify-content:center;gap:10px;}
.btn-back::before{content:"←";font-size:24px;line-height:1;}
.btn-sec{background:var(--navy);color:#fff;box-shadow:var(--sh);}

.sum{background:var(--surface);border-radius:24px;overflow:hidden;box-shadow:var(--sh);}
.sum .band{height:14px;background:var(--c);}
.sum dl{display:grid;grid-template-columns:auto 1fr;gap:14px 24px;padding:24px;font-size:20px;}
.sum dt{color:var(--muted);font-weight:600;} .sum dd{font-weight:800;}
.okmsg{display:flex;align-items:center;gap:16px;border:3px solid var(--ok);background:var(--ok-soft);color:var(--sel-ink);border-radius:20px;padding:18px 20px;font-size:22px;font-weight:800;margin-bottom:12px;}
.okmsg.warn{border-color:var(--warn);background:var(--warn-soft);color:var(--ink);}
.okmsg.err{border-color:var(--err);background:var(--err-soft);color:var(--ink);}
.okmsg .ic{width:52px;height:52px;flex-shrink:0;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:28px;}
.okmsg.warn .ic{background:var(--warn);} .okmsg.err .ic{background:var(--err);}
.okmsg small{display:block;font-size:15px;font-weight:600;}
.jobs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.job{background:var(--surface);border-radius:14px;padding:12px 16px;font-weight:700;font-size:16px;box-shadow:var(--sh-press);}
.job b.impresso{color:var(--ok);} .job b.erro{color:var(--err);} .job b.pendente,.job b.imprimindo{color:var(--warn);}
.thumbs{display:flex;flex-wrap:nowrap;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.thumbs::-webkit-scrollbar{display:none;}
.thumbs button{flex-shrink:0;}
.thumbs button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:800;font-size:16px;}
.thumbs button.sel{border-color:var(--ok);background:var(--ok-soft);color:var(--sel-ink);}
.paper{background:#D5DEE7;border-radius:16px;padding:12px;}
.fit{position:relative;overflow:hidden;width:100%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);}
.fit > .in{position:absolute;left:0;top:0;transform-origin:top left;}
.sec-title{font-size:22px;font-weight:800;margin:28px 0 10px;letter-spacing:-.01em;}
.emis{background:var(--surface);border-radius:18px;padding:16px 18px;margin-top:12px;border-left:12px solid var(--c);box-shadow:var(--sh);}
.emis h3{font-size:19px;font-weight:800;} .emis p{color:var(--muted);font-size:14px;margin:2px 0 10px;}
.pals{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.pals button{border:2px solid var(--navy);background:var(--surface);color:var(--navy);border-radius:12px;padding:12px 16px;font-weight:800;font-size:17px;}
.pals button:active{background:var(--ok-soft);}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:18px;padding:24px;color:var(--muted);font-weight:600;margin-top:10px;font-size:17px;}
.foot{margin-top:30px;}

/* início */
.hero{width:100%;min-height:clamp(200px,26dvh,330px);display:flex;flex-direction:column;justify-content:flex-end;background:var(--lime);color:var(--navy);border-radius:28px;padding:30px 30px 28px;font-size:clamp(44px,8vw,68px);font-weight:800;text-align:left;line-height:1;letter-spacing:-.03em;box-shadow:inset 0 -7px 0 rgba(0,0,0,.13),var(--sh);position:relative;overflow:hidden;}
.hero span{display:block;font-size:20px;font-weight:700;margin-bottom:10px;opacity:.8;letter-spacing:0;}
.hero::after{content:"🖨️";position:absolute;top:22px;right:26px;font-size:clamp(46px,8vw,72px);opacity:.9;}
.hero:active{transform:scale(.99);}
.reimp{width:100%;margin-top:14px;min-height:96px;display:flex;align-items:center;gap:18px;background:var(--navy);color:#fff;border-radius:24px;padding:18px 24px;font-size:26px;font-weight:800;text-align:left;box-shadow:var(--sh);}
.reimp .ic{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:28px;flex-shrink:0;}
.reimp small{display:block;font-size:15px;font-weight:600;color:rgba(255,255,255,.7);margin-top:2px;}
.reimp:active{transform:scale(.99);}
.virada{width:100%;display:block;text-align:left;background:var(--warn-soft);border:3px solid var(--warn);border-radius:22px;padding:18px 22px;margin-bottom:14px;font-size:18px;font-weight:700;line-height:1.35;}
.virada b{display:block;font-size:26px;font-weight:800;}
.runs{display:grid;gap:14px;grid-template-columns:1fr 1fr;}
.run{background:var(--surface);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh);border-top:8px solid var(--c,#CBD5E1);min-height:150px;}
.run b{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.run strong{font-size:22px;font-weight:800;line-height:1.2;}
.run .num{margin-top:auto;display:flex;align-items:baseline;gap:8px;color:var(--muted);font-weight:700;font-size:15px;}
.run .num em{font-style:normal;font-size:40px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1;}
.run.vazio strong{color:#94A3B8;font-size:19px;}
/* tela de produtos compacta: tudo numa tela, sem rolar */
h1.q-prod{margin:0 0 6px;font-size:clamp(26px,4.4vw,34px);}
.prods .grp{margin:10px 0 6px;font-size:15px;}
.prods .grid{grid-template-columns:repeat(3,1fr);gap:10px;}
.prods .big{min-height:var(--ph,76px);padding:6px 12px 6px 26px;font-size:var(--pf,19px);border-radius:16px;gap:2px;line-height:1.12;}
.prods .prod::before{width:10px;}
.prods .big small{font-size:12.5px;}
.brand{display:flex;align-items:center;gap:12px;}
.logo-top{background:#fff;border-radius:12px;padding:5px 10px;display:flex;align-items:center;height:48px;}
.logo-top img{height:38px;width:auto;max-width:150px;object-fit:contain;display:block;}
.brand-t{display:block;}
/* barra fixa embaixo: Voltar sempre no mesmo lugar */
.actions.fixo{position:fixed;left:0;right:0;bottom:0;z-index:6;margin:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(238,242,246,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);flex-wrap:nowrap;}
.actions.fixo{padding-top:14px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));gap:14px;}
.actions.fixo .btn{min-height:96px;padding:18px 30px;font-size:27px;border-radius:22px;}
.actions.fixo .btn-back{min-width:230px;border-width:4px;}
.actions.fixo .btn-back::before{font-size:30px;}
.actions.fixo .btn-back{background:var(--surface);}
.wrap{padding-bottom:140px;}
/* produto com foto do cadastro (produtos.html) */
.prods .prod{flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;}
.prods .prod .ptx{display:flex;flex-direction:column;gap:2px;min-width:0;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto;}
.prods .prod.com-foto{padding-left:20px;gap:10px;}
.prods .prod .pfoto{flex-shrink:0;width:min(50px,calc(var(--ph,76px) - 22px));height:min(50px,calc(var(--ph,76px) - 22px));border-radius:10px;background:#F1F5F9 center/cover no-repeat;box-shadow:inset 0 0 0 1px rgba(4,45,77,.08);}
.load{padding:60px 20px;text-align:center;color:var(--muted);font-size:18px;font-weight:700;}
@media (max-width:560px){.big{min-height:90px;font-size:19px;}.qty button{width:80px;height:80px;font-size:44px;}.qty output{font-size:66px;min-width:90px;}.runs{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header class="top">
  <a href="dashboard.html" class="voltar-erp" title="Voltar ao ERP">←</a>
  <div class="brand"><span class="logo-top" id="logo-top" hidden><img id="logo-img" alt=""></span><span class="brand-t">Central de rótulos<small>Silicate</small></span></div>
  <div class="est" id="est"></div>
  <div class="clock"><b id="hora">--:--</b><span id="data">—</span></div>
  <button class="btn-cheia" id="btn-cheia" onclick="telaCheia()" title="Tela cheia">⛶</button>
</header>
<div id="estbar"></div>
<main class="wrap" id="app"><div class="load">Carregando…</div></main>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRAL DE RÓTULOS (nov/2026) — tablet na sala das impressoras.
   • Imprimir: linha → produto → quantidade → confirma. A RPC totem_emitir numera
     (por linha + produto + dia; continua quando o produto volta) e grava em
     rotulos_impressos. RÓTULO IMPRESSO NÃO É ESTOQUE.
   • O pallet nasce quando a OP confirma (trigger → totem_alocar, na ordem dos
     turnos 3º→1º→2º) ou quando o carregamento lê o QR (fica "a conferir").
   • Rótulo → fila "laser" · amostra → fila "dymo" (25 kg e Big Bag: só o nº 01).
     Quem imprime é a estacao-impressao.html do PC (?destino=laser e a da DYMO).
   • QR de 60 mm com link curto em MAIÚSCULAS (…/R/CODIGO): modo alfanumérico,
     33×33 módulos — atravessa várias camadas de plástico.
   Migration: sql/migrations/096_central_rotulos.sql
   ══════════════════════════════════════════════════════════════════════════ */
const pad=(n,k=2)=>String(n).padStart(k,'0');
// data/hora sempre no horário de Brasília (o fuso do tablet pode estar errado)
const _spParts=d=>{try{const o={};new Intl.DateTimeFormat('en-GB',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d).forEach(x=>o[x.type]=x.value);return o;}catch(e){return {day:pad(d.getDate()),month:pad(d.getMonth()+1),year:d.getFullYear(),hour:pad(d.getHours()),minute:pad(d.getMinutes())};}};
const fData=d=>{const o=_spParts(d);return o.day+'/'+o.month+'/'+o.year;};
const fHora=d=>{const o=_spParts(d);return o.hour+':'+o.minute;};
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fD=s=>{if(!s)return '—';const[y,m,d]=String(s).slice(0,10).split('-');return d+'/'+m+'/'+y;};
const esc_=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/\s/g,'');
// "hoje" sempre no horário de Brasília — tablet com fuso errado não pode mudar o dia dos rótulos
const _fmtSP=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'});
const isoSP=d=>{try{return _fmtSP.format(d);}catch(e){return iso(d);}};
const hojeIso=()=>isoSP(new Date()), ontemIso=()=>isoSP(new Date(Date.now()-864e5));
const usuario=()=>{try{return (JSON.parse(sessionStorage.getItem('erp_user')||localStorage.getItem('erp_user')||'{}').nome)||'Central de rótulos';}catch(e){return 'Central de rótulos';}};
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};

/* ═══ regras (iguais ao aferidor) ═══ */
const isFicha=lp=>{lp=norm(lp);return lp.includes('25kg')||lp.includes('bag')||lp.includes('granel')||lp.includes('bigbag');};
const ehBag=p=>/big\s*-?\s*bag|\bbags?\b/i.test((p.nome||'')+' '+(p.linhaProduto||''));
// validade em ANOS (mesmo dia e mês): 02/11/2026 + 3 anos = 02/11/2029.
// (contar 1095 dias errava 1 dia quando passava por ano bissexto)
const anosValidade=p=>isFicha(p.linhaProduto)?3:1;   // 25 kg / Big Bag = 3 anos; demais = 1 ano
function validadeDe(d,p){ const v=new Date(d); v.setFullYear(v.getFullYear()+anosValidade(p)); return v; }
function corCodigo(nome){
  const s=String(nome||'').replace(/\bcaulim\b/gi,'').replace(/\b25\s*kg\b/gi,'').replace(/\bbig\s*bag\b/gi,'').replace(/\bbigbag\b/gi,'')
    .replace(/\bbag\b/gi,'').replace(/\bgranel\b/gi,'').replace(/[-–—:|/,]+/g,' ').trim().replace(/\s+/g,' ');
  // Caulim Brasil Minas → "A" (regra da fábrica — igual à producao.html)
  if(/^brasil\s*minas$/i.test(s)) return 'A';

}
// código da linha no rótulo: Linha 2 → L02, Linha 3 → L03, Emitec → EMI, Longa Vida → LVD
function codLinha(nome){
  const fixos={'emitec':'EMI','longavida':'LVD'}; const n=norm(nome);
  if(fixos[n]) return fixos[n];
  const m=/linha\s*(\d+)/i.exec(nome||''); if(m) return 'L'+pad(m[1]);

}

function qrSvg(texto,ladoMaxMm,dpmm){
  if(typeof QRCode==='undefined'||!QRCode.create) return `<div style="width:${ladoMaxMm}mm;height:${ladoMaxMm}mm;border:0.5mm solid #000;display:flex;align-items:center;justify-content:center;font:700 7pt Arial;">QR NÃO GERADO</div>`;
  const qr=QRCode.create(texto,{errorCorrectionLevel:'M'}), n=qr.modules.size, d=qr.modules.data, b=4, tot=n+b*2;
  dpmm=dpmm||8; const dm=Math.max(3,Math.floor((ladoMaxMm*dpmm)/tot)), lado=(tot*dm)/dpmm;
  let r=''; for(let y=0;y<n;y++){let x=0;while(x<n){if(d[y*n+x]){const x0=x;while(x<n&&d[y*n+x])x++;r+=`<rect x="${x0+b}" y="${y+b}" width="${x-x0}" height="1"/>`;}else x++;}}
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${tot} ${tot}" width="${lado}mm" height="${lado}mm" shape-rendering="crispEdges" style="display:block;"><rect width="${tot}" height="${tot}" fill="#fff"/><g fill="#000">${r}</g></svg>`;
}

/* dados da empresa (Configurações) para o cabeçalho dos rótulos — sem nome fantasia */
function empDados(){
  const E=EMP||{}, l=[];
  const doc=[E.cnpj?'CNPJ '+E.cnpj:'',E.ie?'IE '+E.ie:''].filter(Boolean).join(' · '); if(doc) l.push(doc);
  const end=[[E.rua,E.numero].filter(Boolean).join(', '),E.bairro,[E.cidade,E.uf].filter(Boolean).join('/'),E.cep?'CEP '+E.cep:''].filter(Boolean).join(' · '); if(end) l.push(end);
  if(E.telefone) l.push('SAC '+E.telefone);
  return l;
}
function cabecalhoEmpresa(sub){
  const logo=`<div class="lg" style="width:44px;height:48px;flex-shrink:0;"></div>`;
  return `<div style="display:flex;align-items:center;gap:12px;border-bottom:1px solid #042D4D;padding-bottom:10px;margin-bottom:12px;">${logo}
    <div style="flex:1;"><div style="font-size:15px;font-weight:800;color:#042D4D;line-height:1.2;">${esc_(EMP.razao_social||EMP.nome_fantasia||'ERP Industrial')}</div>
    ${empDados().map(t=>`<div style="font-size:9px;color:#64748b;line-height:1.35;">${esc_(t)}</div>`).join('')}
    <div style="font-size:10px;font-weight:700;color:#475569;letter-spacing:.5px;margin-top:3px;text-transform:uppercase;">${esc_(sub)}</div></div></div>`;
}
function rotuloCompleto(pal,p){
  const bag=ehBag(p), lp=norm(p.linhaProduto);
  const pesoLiq=lp.includes('bag')?'1.000 kg':(lp.includes('25kg')?'25 kg/unidade':'');
  const ficha=`<div style="margin-bottom:12px;border:1px solid #1e293b;border-radius:6px;overflow:hidden;">
    ${[['COMPOSIÇÃO','SILICATO DE ALUMÍNIO'],['UMIDADE','MÁXIMO 1%'],
      ['INDICAÇÃO DE USO','VEÍCULO/EXCIPIENTE DE ORIGEM MINERAL PARA INCORPORAÇÃO EM PRODUTOS DESTINADOS À ALIMENTAÇÃO ANIMAL — RAÇÕES, CONCENTRADOS, SUPLEMENTOS, PREMIXES E NÚCLEOS — DE TODAS AS ESPÉCIES ANIMAIS. PRODUTO DE USO INDUSTRIAL, NÃO DESTINADO AO FORNECIMENTO DIRETO AO ANIMAL.'],
      ['ESPÉCIE / CATEGORIA','TODAS AS ESPÉCIES ANIMAIS, OBSERVADA A LISTA DE INGREDIENTES E VEÍCULOS AUTORIZADOS PARA USO NA ALIMENTAÇÃO ANIMAL, PUBLICADA PELO MAPA (IN MAPA Nº 110/2020 E ATUALIZAÇÕES). CATEGORIA E FASE DEFINIDAS PELA FORMULAÇÃO DO PRODUTO FINAL.'],
      ['MODO DE USAR','INCORPORAR À FORMULAÇÃO COMO VEÍCULO/EXCIPIENTE, NO PERCENTUAL DEFINIDO PELO FABRICANTE DO PRODUTO FINAL, CONFORME A FÓRMULA POR ELE ESTABELECIDA.'],
      ['MODO DE CONSERVAR','LOCAL VENTILADO E SECO, PROTEGIDO CONTRA PRAGAS URBANAS, ANIMAIS DOMÉSTICOS E CRIANÇAS.'],['CLASSIFICAÇÃO','VEÍCULO MINERAL']].map(([r,v])=>`<div style="display:grid;grid-template-columns:160px 1fr;border-bottom:1px solid #1e293b;"><div style="padding:5px 8px;border-right:1px solid #1e293b;font-size:9px;font-weight:800;color:#1e293b;">${r}</div><div style="padding:5px 8px;font-size:9px;color:#1e293b;text-align:center;">${v}</div></div>`).join('')}
    <div style="display:grid;grid-template-columns:160px 1fr;"><div style="padding:7px 8px;border-right:1px solid #1e293b;font-size:9px;font-weight:800;color:#1e293b;">PESO LÍQUIDO (Kg)</div><div style="padding:7px 8px;font-size:10px;font-weight:700;color:#1e293b;text-align:center;">${pesoLiq}</div></div></div>`;
  // (nov/2026) sem o nome do produto (Branco 01, Creme 02…): o rótulo diz só CAULIM; o produto fica no sistema (QR)
  const dados=[['Linha de Produção',pal.linha],['Data de Fabricação',fD(pal.data)],['Lote',pal.lote],['Validade',fD(pal.validade)],[bag?'Código do Bag':'Código Pallet',pal.codigo]];
  return `<div style="width:190mm;min-height:130mm;padding:14mm;box-sizing:border-box;font-family:Arial,sans-serif;background:#fff;color:#000;">
    ${cabecalhoEmpresa('Controle de Qualidade')}
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:8px;">
      <div><div style="font-size:22px;font-weight:800;color:#042D4D;letter-spacing:1px;line-height:1;">CAULIM</div>
        <div style="font-size:9px;font-weight:700;color:#475569;letter-spacing:.8px;margin-top:3px;">SILICATO DE ALUMÍNIO · VEÍCULO MINERAL PARA ALIMENTAÇÃO ANIMAL</div></div>
      <div style="font-size:22px;font-weight:800;color:#042D4D;white-space:nowrap;">${bag?'Bag':'Pallet'} #${pal.numero}</div></div>
    ${ficha}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">
      ${dados.map(([l,v],i)=>`<div style="padding:7px 10px;border-radius:6px;border:1px solid #cbd5e1;${i===dados.length-1&&dados.length%2?'grid-column:1/-1;':''}"><div style="font-size:9px;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:.5px;">${l}</div><div style="font-size:12px;font-weight:700;color:#042D4D;margin-top:2px;">${esc_(v)}</div></div>`).join('')}
    </div>
    <div style="border:1px solid #042D4D;border-radius:10px;padding:14px;display:flex;align-items:center;justify-content:center;gap:18px;">
      <div style="width:60mm;">${qrSvg(urlRastreio(pal.codigo),60,23.6)}</div>
      <div><div style="font-size:9px;color:#94a3b8;font-weight:700;text-transform:uppercase;margin-bottom:4px;">Rastreabilidade</div>
      <div style="font-size:13px;font-weight:800;color:#042D4D;font-family:monospace;letter-spacing:1px;">${esc_(pal.codigo)}</div>
      <div style="font-size:10px;color:#64748b;margin-top:4px;">Escaneie o QR Code para rastrear</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;font-size:8px;line-height:1.35;color:#1e293b;font-weight:700;">
      <div style="border-left:2px solid #1e293b;padding-left:7px;">"PRODUTO ISENTO DE REGISTRO NO MINISTÉRIO DA AGRICULTURA E PECUÁRIA"</div>
      <div style="border-left:2px solid #1e293b;padding-left:7px;">"ESTABELECIMENTO DISPENSADO DE REGISTRO NO MINISTÉRIO DA AGRICULTURA E PECUÁRIA POR TRATAR-SE DE FABRICAÇÃO DE VEÍCULO PARA RAÇÃO ANIMAL, NÍVEL DE RISCO I, CONFORME PORTARIA SDA/MAPA Nº 196, DE 08/01/2021 — ART. 2º, INC. I, C/C ANEXO I ITEM 19"</div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:8px;padding-top:5px;border-top:1px solid #1e293b;font-size:9px;font-weight:800;letter-spacing:1.5px;color:#1e293b;">
      <span>INDÚSTRIA BRASILEIRA</span><span style="letter-spacing:.5px;">www.silicate.com.br</span></div></div>`;
}
function rotuloSimples(pal,p){

    <div style="flex:1;display:flex;gap:6mm;align-items:stretch;padding:2.5mm 0 2mm;min-height:0;">

          <div>${rot('LOTE')}<div style="font-size:15pt;font-weight:800;line-height:1.1;">${esc_(pal.lote||'—')}</div></div>

        </div>
        <div style="margin-top:auto;">${rot(bag?'BAG Nº':'PALLET Nº')}

/* ═══ fila de impressão (estacao-impressao.html?destino=laser | dymo) ═══ */
async function enfileirar(rows,p,oque){
  const ids=[], pals=rows.map(palDe), ficha=isFicha(p.linhaProduto);
  const titulo=`${p.nome} · ${pals[0].linha} · nº ${pad(pals[0].numero,3)}${pals.length>1?' a '+pad(pals[pals.length-1].numero,3):''}`;
  if(oque!=='am'){
    const estilo=`<style>.lg{background:url(${LOGO_SIMBOLO}) center/contain no-repeat;-webkit-print-color-adjust:exact;print-color-adjust:exact;}</style>`;
    const html=estilo+pals.map(x=>ficha
      ?`<div style="page-break-after:always;padding-top:8mm;display:flex;justify-content:center;">${rotulo(x,p)}</div>`
      :`<div style="page-break-after:always;width:210mm;height:296mm;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;">${rotulo(x,p)}</div>`).join('');
    const r=await _supabase.from('impressao_fila').insert({destino:'laser',tipo:'rotulo',titulo:'Rótulos · '+titulo,tamanho:'A4',qtd:pals.length,criado_por:usuario(),html}).select('id').single();
    if(r.error) throw r.error; ids.push({id:r.data.id,nome:'Rótulos',dest:'laser'});
  }
  if(oque!=='rot'){
    const am=ficha?pals.filter(x=>x.numero===1):pals;
    if(am.length){
      const html=am.map(x=>`<div style="page-break-after:always;">${amostraHTML(x,p)}</div>`).join('');
      const r=await _supabase.from('impressao_fila').insert({destino:'dymo',tipo:'amostra',titulo:'Amostras · '+titulo,tamanho:'89mm 28mm',qtd:am.length,criado_por:usuario(),html}).select('id').single();
      if(r.error) throw r.error; ids.push({id:r.data.id,nome:'Amostras',dest:'dymo'});
    }
  }
  return ids;
}
let _jobs=[], _jobTimer=null, _est={};
function acompanharJobs(ids){
  _jobs=ids.map(j=>({...j,status:'pendente'})); clearInterval(_jobTimer); let n=0;
  _jobTimer=setInterval(async()=>{ n++;
    try{ const {data}=await _supabase.from('impressao_fila').select('id,status,erro').in('id',_jobs.map(j=>j.id));
      (data||[]).forEach(d=>{const j=_jobs.find(x=>x.id===d.id); if(j){j.status=d.status;j.erro=d.erro;}}); }catch(e){}
    const el=document.getElementById('jobs'); if(el) el.innerHTML=htmlJobs();
    if(_jobs.every(j=>j.status==='impresso'||j.status==='erro')||n>60) clearInterval(_jobTimer);
  },3000);
}
/* estação ligada = deu sinal nos últimos 60 s, medido no SERVIDOR (rpc estacoes_status):
   não depende do relógio do tablet nem do PC, e aguenta a estação ocupada imprimindo */
const estOn=d=>_est[d]!=null&&_est[d]<60;
const ST={pendente:'na fila…',imprimindo:'imprimindo…',impresso:'impresso ✓',erro:'erro'};
const htmlJobs=()=>_jobs.map(j=>`<div class="job">${j.nome} (${j.dest==='laser'?'LaserJet':'DYMO'}): <b class="${j.status}">${ST[j.status]||j.status}</b>${j.status==='pendente'&&!estOn(j.dest)?' — <b class="erro">a estação dessa impressora está desligada no PC</b>':''}${j.erro?' — '+esc_(j.erro):''}</div>`).join('');
async function lerEstacoes(){
  try{ const {data,error}=await _supabase.rpc('estacoes_status'); if(!error){ _est={}; (data||[]).forEach(e=>_est[e.destino]=e.segundos); } }catch(e){}
  const bar=document.getElementById('estbar'); if(!bar) return;
  const off=[['laser','LaserJet (rótulos)'],['dymo','DYMO (amostras)']].filter(([d])=>!estOn(d)).map(([,n])=>n);
  if(!off.length){ bar.className='estbar ok'; bar.innerHTML='<span class="dot"></span>Impressoras prontas — LaserJet e DYMO'; }
  else { bar.className='estbar off'; bar.innerHTML=`<span class="dot"></span><div>${off.join(' e ')} ${off.length>1?'desligadas':'desligada'}<small>${off.some(n=>n.startsWith('LaserJet'))?'Os rótulos não vão sair.':'As amostras não vão sair.'} Avise o responsável para abrir a estação de impressão no PC.</small></div>`; }
}

  if(!reimp.grupos.length) h+=`<div class="empty">Nada impresso hoje na ${esc_(reimp.linha)}.</div>`;
  reimp.grupos.forEach((ps,gi)=>{const p=prodPorNome(ps[0].produto), u=ehBag(p)?'Bag':'Pallet';
    h+=`<div class="emis" style="--c:${corDe(p.linhaProduto)}"><h3>${esc_(ps[0].produto)}</h3>
    <div class="pals">${ps.map((x,i)=>`<button onclick="reimp.row=reimp.grupos[${gi}][${i}];ir('reimpConf')">${u} ${pad(x.numero,3)}</button>`).join('')}</div></div>`;});
  return h+`<div class="actions fixo"><button class="btn btn-back" onclick="reimp.linha=null;render()">Voltar</button></div>`;
}
function telaReimpConf(){
  const x=reimp.row, p=prodPorNome(x.produto), temAm=!(isFicha(p.linhaProduto)&&x.numero!==1);
  return barraErro()+`<h1 class="q">Reimprimir ${ehBag(p)?'bag':'pallet'} ${pad(x.numero,3)}?</h1><p class="hint">${esc_(x.produto)} · ${esc_(x.linha)} · ${fD(x.dia)}</p>
  <div class="actions" style="margin:0 0 8px;"><button class="btn btn-back" onclick="ir('reimp')">Voltar</button>
  <button class="btn btn-go" ${ocupado?'disabled':''} onclick="reimprimir('rot')">Reimprimir rótulo</button>
  ${temAm?`<button class="btn btn-go" ${ocupado?'disabled':''} onclick="reimprimir('am')">Reimprimir amostra</button>`:''}</div>${previas(x,p)}`;
}
async function reimprimir(oque){
  if(ocupado) return; ocupado=true; render();
  try{ const x=reimp.row, p=prodPorNome(x.produto);
    const ids=await enfileirar([x],p,oque);
    if(oque==='rot') await _supabase.from('rotulos_impressos').update({vias:(x.vias||1)+1}).eq('id',x.id);
    reimp.oque=oque; ocupado=false; ir('reimpOk'); acompanharJobs(ids);
  }catch(e){ ocupado=false; erroMsg=e.message||String(e); render(); }
}
function telaReimpOk(){ const x=reimp.row;
  return `<div class="okmsg"><div class="ic">✓</div><div>${reimp.oque==='am'?'Amostra':'Rótulo'} do nº ${pad(x.numero,3)} enviado para impressão<small>Mesmo número e mesmo QR do original</small></div></div>
  <div class="jobs" id="jobs">${htmlJobs()}</div><div class="actions"><button class="btn btn-go" onclick="voltarInicio()">Pronto</button></div>`; }

/* ═══ render ═══ */
// prévia do rótulo: cabe na largura e, com data-maxh, também numa fração da altura da tela (centralizada)
function ajustarPrevia(){ document.querySelectorAll('.fit').forEach(f=>{const i=f.querySelector('.in'); if(!i) return;
  f.style.width=''; let s=f.clientWidth/i.offsetWidth; const mh=parseFloat(f.dataset.maxh||0);
  if(mh) s=Math.min(s,(window.innerHeight*mh)/i.offsetHeight);
  i.style.transform=`scale(${s})`; f.style.height=(i.offsetHeight*s)+'px';
  if(mh){ f.style.width=(i.offsetWidth*s)+'px'; f.style.margin='0 auto'; } }); }
window.addEventListener('resize',ajustarPrevia);
function render(){
  const map={inicio:telaInicio,linha:telaLinha,produto:telaProduto,qtd:telaQtd,confirma:telaConfirma,feito:telaFeito,
    reimp:telaReimp,reimpConf:telaReimpConf,reimpOk:telaReimpOk};
  document.getElementById('app').innerHTML=map[tela](); requestAnimationFrame(ajustarPrevia);
  if(tela==='produto') requestAnimationFrame(caberProdutos);
  if(tela==='feito'||tela==='reimpConf') requestAnimationFrame(caberPrevia);
}
function tick(){const d=new Date(); document.getElementById('hora').textContent=fHora(d); document.getElementById('data').textContent=fData(d)+' · '+turnoDe(d);}

/* ═══ modo totem: tela sempre acesa, sem menu de toque longo, volta ao início parado ═══ */
let _wake=null;
async function manterAcesa(){ try{ if('wakeLock' in navigator&&!_wake){ _wake=await navigator.wakeLock.request('screen'); _wake.addEventListener('release',()=>{_wake=null;}); } }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') manterAcesa(); });
document.addEventListener('contextmenu',e=>e.preventDefault());
let _parado=null;
/* tela cheia: o navegador só deixa entrar com um toque — então todo toque garante.
   Se sair (tablet bloqueou, alguém puxou a barra), o próximo toque volta. */
/* aberta como app instalado (display fullscreen/standalone) já está sem barra:
   NÃO pede tela cheia ao navegador — é esse pedido que mostra o aviso "Para sair da tela cheia…" */
const _comoApp=()=>matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function telaCheia(){ if(_comoApp()) return; try{ const el=document.documentElement;
  if(!document.fullscreenElement&&!document.webkitFullscreenElement){
    const f=el.requestFullscreen||el.webkitRequestFullscreen; if(f){ const r=f.call(el,{navigationUI:'hide'}); if(r&&r.catch) r.catch(()=>{}); } } }catch(e){} }
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{ manterAcesa(); telaCheia(); clearTimeout(_parado);
  _parado=setTimeout(()=>{ if(tela!=='inicio'&&!ocupado) voltarInicio(); },180000); }));
// virou o dia com a tela aberta: recarrega numeração e aviso
let _diaAberto=hojeIso();
setInterval(()=>{ if(hojeIso()!==_diaAberto){ _diaAberto=hojeIso(); _emHoje=[]; carregarInicio().catch(()=>{}).then(()=>{ if(tela==='inicio') render(); }); } },60000);

// "instalar" a central como app (tela cheia, sem barra do navegador)
if('serviceWorker' in navigator&&location.protocol==='https:'){ navigator.serviceWorker.register('/sw-totem.js',{scope:'/totem.html'}).catch(()=>{}); }
function atualizaBtnCheia(){ const b=document.getElementById('btn-cheia'); if(b) b.style.display=(document.fullscreenElement||document.webkitFullscreenElement||matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches)?'none':''; }
document.addEventListener('fullscreenchange',atualizaBtnCheia); document.addEventListener('webkitfullscreenchange',atualizaBtnCheia);
(async function(){
  if(location.protocol==='file:'||typeof _supabase==='undefined'){
    document.getElementById('app').innerHTML=`<div class="empty">Abra pelo endereço do ERP: <b>erp-industrial-theta.vercel.app/totem.html</b></div>`; return; }
  let sess=null; try{({data:{session:sess}}=await _supabase.auth.getSession());}catch(e){}
  if(!sess){ document.getElementById('app').innerHTML=`<div class="empty" style="text-align:center;font-size:18px;">🔒 A central precisa de um login do ERP (uma vez).<br><br><a href="index.html?volta=totem.html" style="font-weight:800;color:#042D4D;">Fazer login</a> e depois voltar para esta página.</div>`; return; }
  tick(); setInterval(tick,15000);
  try{ await carregarCadastros(); await carregarInicio().catch(()=>{}); }
  catch(e){ document.getElementById('app').innerHTML=`<div class="okmsg err"><div class="ic">!</div><div>Não carregou os cadastros<small>${esc_(e.message||e)} — confira a internet e recarregue.</small></div></div>`; return; }
  render(); atualizaBtnCheia(); lerEstacoes(); setInterval(lerEstacoes,10000);
  preCarregarFotos();
  setInterval(()=>{ if(tela==='inicio') carregarInicio().catch(()=>{}).then(render); },30000);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&tela==='inicio') carregarInicio().catch(()=>{}).then(render); });
})();
</script>
