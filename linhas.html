<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP Industrial — Linhas de Produção</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   LINHAS DE PRODUÇÃO (out/2026) — mesmo desenho do Painel da fábrica
   • O NOME da linha liga tudo (OPs, equipamentos, laboratório, pallets…):
     com histórico, o nome fica travado — renomear deixaria tudo órfão.
   • Excluir só linha sem OP e sem equipamento; com histórico → Inativo.
   • Médias por hora: o nome da "linha de produto" precisa ser IGUAL ao do
     cadastro de produtos (é por ele que o planejamento/OEE acha a média).
     A tela escolhe da lista e avisa quando não bate.
   • Horímetro: lê só as OPs recentes (antes baixava TODAS as OPs a cada abertura).
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --ok:#16a34a; --ok-bg:#dcfce7; --ok-line:#22c55e;
  --warn:#b45309; --warn-bg:#fef3c7; --warn-line:#f59e0b;
  --bad:#dc2626; --bad-bg:#fee2e2; --bad-line:#ef4444;
  --info:#2563eb; --info-bg:#dbeafe;
  --wd-line:#e3e9f0; --line-soft:#f1f5f9;
  --ink-2:#475569; --ink-3:#64748b; --ink-4:#94a3b8; --ink-5:#cbd5e1;
  --wd-shadow:0 1px 2px rgba(4,45,77,.05);
}
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.eq-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
.eq-head h1{margin:0;font-size:26px;font-weight:800;color:var(--primary);letter-spacing:-.4px;}
.eq-head p{margin:3px 0 0;font-size:13px;color:var(--ink-3);}
.eq-acts{display:flex;gap:8px;flex-wrap:wrap;}
.b{height:44px;padding:0 15px;border-radius:12px;border:1.5px solid var(--wd-line);background:#fff;font:inherit;font-size:13.5px;
  font-weight:700;color:var(--primary);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;}
.b:hover{border-color:var(--primary);}
.b.pri{background:var(--primary);border-color:var(--primary);color:var(--accent);}
.b.sm{height:36px;padding:0 11px;font-size:12.5px;border-radius:9px;}
.b.perigo{color:var(--bad);} .b.perigo:hover{border-color:var(--bad);}
.b:disabled{opacity:.55;cursor:default;}

.pend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.pend .pi{display:inline-flex;align-items:center;gap:8px;border:1.5px solid #fcd34d;background:var(--warn-bg);color:#7c2d12;
  border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;}
.pend .pi.on{background:#7c2d12;border-color:#7c2d12;color:#fff;}
.pend .pi b{font-size:15px;}

.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px;}
.tile{background:#fff;border:1px solid var(--wd-line);border-radius:14px;padding:14px 16px;box-shadow:var(--wd-shadow);text-align:left;font:inherit;cursor:pointer;min-width:0;}
.tile:hover{border-color:#b9c8d8;} .tile.on{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary);}
.tile.hero{background:var(--primary);border-color:var(--primary);cursor:default;}
.tile:not([onclick]){cursor:default;}
.pz-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line-soft);cursor:pointer;}
.pz-row:hover{background:#f8fafc;}
.pz-row b{color:var(--primary);} .pz-row .cod{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink-3);margin-left:6px;}
.pz-row .sub{display:block;font-size:11.5px;color:var(--ink-4);margin-top:2px;}
.pz-det{padding:4px 12px 12px 24px;border-bottom:1px solid var(--line-soft);background:#fafcfe;}
.pz-eq{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px dashed var(--line-soft);}
.pz-eq:last-child{border-bottom:0;}
.tile-l{font-size:12.5px;font-weight:700;color:var(--ink-2);}
.tile-v{font-size:28px;font-weight:800;color:var(--primary);letter-spacing:-.5px;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums;}
.tile-s{font-size:11.5px;color:var(--ink-3);margin-top:3px;}
.tile.hero .tile-l{color:rgba(255,255,255,.8);} .tile.hero .tile-v{color:var(--accent);} .tile.hero .tile-s{color:rgba(255,255,255,.6);}
.tile.ruim .tile-v{color:var(--bad);} .tile.atencao .tile-v{color:var(--warn);}

.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--wd-line);border-radius:14px;padding:10px 12px;margin-bottom:14px;box-shadow:var(--wd-shadow);}
.busca{flex:1 1 240px;position:relative;}
.busca input{width:100%;height:40px;padding-left:36px;}
.busca span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6;}
.seg{display:flex;gap:3px;background:var(--line-soft);padding:3px;border-radius:10px;flex-wrap:wrap;}
.seg button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:700;color:var(--ink-3);padding:7px 12px;border-radius:7px;cursor:pointer;white-space:nowrap;}
.seg button.on{background:var(--accent);color:var(--primary);box-shadow:0 1px 3px rgba(4,45,77,.18);}
.seg button.on b{color:var(--primary);opacity:.65;}
.seg button:not(.on):hover{color:var(--primary);background:rgba(255,255,255,.6);}
.seg button b{font-weight:700;color:var(--ink-4);margin-left:4px;}


/* (trazidos do equip-linhas) */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.tag.ok{background:var(--ok-bg);color:#166534;} .tag.warn{background:var(--warn-bg);color:#92400e;} .tag.gray{background:var(--line-soft);color:var(--ink-3);}
.vazio{text-align:center;padding:40px 16px;color:var(--ink-3);background:#fff;border:1.5px dashed var(--wd-line);border-radius:14px;}
.vazio b{display:block;color:var(--primary);font-size:15px;margin-top:6px;}
.ib{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--wd-line);background:#fff;font-size:14px;cursor:pointer;color:var(--primary);}
.ib:hover{border-color:var(--primary);} .ib.x{color:var(--bad);} .ib.x:hover{border-color:var(--bad);}
.ficha-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:14px;}
.ficha-c{background:#f8fafc;border-radius:10px;padding:10px 12px;}
.ficha-c span{display:block;font-size:11px;font-weight:700;color:var(--ink-4);}
.ficha-c b{display:block;font-size:13.5px;color:var(--primary);margin-top:2px;word-break:break-word;}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;}
.lnc{background:#fff;border:1px solid var(--wd-line);border-radius:16px;padding:16px;box-shadow:var(--wd-shadow);display:flex;flex-direction:column;gap:12px;min-width:0;}
.lnc.inat{opacity:.6;}
.lnc-top{display:flex;gap:14px;align-items:center;cursor:pointer;}
.lnc-ft{width:60px;height:60px;border-radius:14px;background:var(--line-soft);display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;flex-shrink:0;}
.lnc-ft img{width:100%;height:100%;object-fit:cover;}
.lnc-n b{display:block;font-size:18px;font-weight:800;color:var(--primary);}
.lnc-n small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px;}
.lnc-hm{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;background:#f8fafc;border-radius:12px;padding:10px 12px;}
.lnc-hm span{display:block;font-size:11.5px;font-weight:700;color:var(--ink-3);}
.lnc-hm b{font-size:22px;font-weight:800;color:var(--primary);letter-spacing:-.4px;font-variant-numeric:tabular-nums;}
.lnc-hm small{display:block;font-size:11px;color:var(--ink-4);}
.lnc-st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.lnc-st a,.lnc-st div{background:#f8fafc;border-radius:10px;padding:8px 10px;text-decoration:none;color:inherit;}
.lnc-st a:hover{background:var(--line-soft);}
.lnc-st span{display:block;font-size:11px;font-weight:700;color:var(--ink-4);}
.lnc-st b{font-size:16px;color:var(--primary);}
.md-l{display:flex;flex-direction:column;gap:5px;}
.md-i{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:6px 10px;border-radius:9px;background:#f8fafc;}
.md-i b{color:var(--primary);font-variant-numeric:tabular-nums;white-space:nowrap;}
.md-i.erro{background:var(--warn-bg);}
.md-i small{display:block;font-size:11px;color:#92400e;}
.lnc-a{display:flex;gap:6px;margin-top:auto;}
.lnc-a .b{flex:1;justify-content:center;}
/* editor de médias */
.md-ed{display:flex;flex-direction:column;gap:8px;}
.md-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 130px 38px;gap:8px;align-items:start;}
.md-row .msg{grid-column:1/-1;font-size:11.5px;color:#92400e;margin-top:-4px;}
.md-row .msg button{border:0;background:none;color:var(--info);font:inherit;font-weight:700;cursor:pointer;padding:0;}
.trava{font-size:11.5px;color:var(--ink-3);margin-top:4px;line-height:1.4;}
@media (max-width:760px){
  .cards{grid-template-columns:minmax(0,1fr);}
  .md-row{grid-template-columns:minmax(0,1fr) 90px 38px;}
  .md-row select.un{grid-column:1/3;}
  .eq-acts{width:100%;} .eq-acts .b{flex:1;justify-content:center;padding:0 8px;}
  .topbar-user > div:last-child{display:none;}
}
</style>
</head>
<body>
<div id="sidebar-container"></div>
<header class="topbar" id="topbar">
  <button class="topbar-open-sidebar" onclick="toggleSidebar()">☰</button>
  <div class="topbar-title">Linhas de Produção</div>
  <div class="topbar-right">
    <div class="topbar-user">
      <div class="user-avatar" style="width:32px;height:32px;font-size:12px;" id="top-avatar">SA</div>
      <div><div class="topbar-user-name" id="top-user-name">Super Admin</div><div class="topbar-user-profile" id="top-user-perfil">SADM</div></div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()" style="color:#64748b;">Sair</button>
  </div>
</header>

<main class="main-content" id="main-content">
  <div class="eq-head">
    <div><h1>Linhas de Produção</h1><p id="ln-sub">Linhas da fábrica, horímetro e médias por hora</p></div>
    <div class="eq-acts">
      <button class="b" onclick="exportarLista('csv')">📊 CSV</button>
      <button class="b" onclick="exportarLista('pdf')">📄 PDF</button>
      <button class="b pri" onclick="openModalLinha()">+ Nova linha</button>
    </div>
  </div>
  <div class="pend" id="ln-pend"></div>
  <div class="filtros">
    <div class="seg" id="seg-st" role="group" aria-label="Situação"></div>
  </div>
  <div class="cards" id="ln-lista"><div class="vazio" style="grid-column:1/-1;"><div class="spin" style="width:30px;height:30px;border-width:3px;margin:0 auto 10px;"></div>Carregando…</div></div>
</main>

<!-- EDITOR -->
<div id="modal-linha" class="modal-overlay hidden">
  <div class="modal modal-lg">
    <div class="modal-header"><div class="modal-title" id="modal-linha-title">Nova linha de produção</div><button class="modal-close" onclick="closeModal('modal-linha')" aria-label="Fechar">✕</button></div>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div style="display:flex;align-items:center;gap:16px;padding:14px;background:#f8fafc;border-radius:12px;">
        <div id="l-foto-preview" class="lnc-ft" style="width:72px;height:72px;cursor:pointer;" onclick="if(_lFoto)verFotoInline(_lFoto)">🏭</div>
        <div><div style="font-size:13px;font-weight:700;color:var(--primary);margin-bottom:6px;">Foto da linha</div>
          <div style="display:flex;gap:8px;"><button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('l-foto-input').click()">📷 Escolher</button>
          <button type="button" class="btn btn-ghost btn-sm" id="l-btn-rm-foto" onclick="removerFotoLinha()" style="display:none;color:#dc2626;">Remover</button></div>
          <input type="file" id="l-foto-input" accept="image/*" style="display:none;" onchange="previewFotoLinha(this)"></div>
      </div>
      <div class="form-grid-2">
        <div class="form-group"><label class="form-label" for="l-nome">Nome da linha <span class="req">*</span></label>
          <input id="l-nome" type="text" class="form-input" placeholder="Ex.: Linha 4"><div class="trava" id="l-nome-trava"></div></div>
        <div class="form-group"><label class="form-label" for="l-horimetro">Horímetro (h)</label>
          <input id="l-horimetro" type="number" class="form-input" min="0"><div class="trava" id="l-hm-dica"></div></div>
      </div>
      <div class="form-grid-2">
        <div class="form-group"><label class="form-label" for="l-status">Situação</label>
          <select id="l-status" class="form-input"><option value="ativo">Ativa</option><option value="inativo">Inativa</option></select></div>
        <div class="form-group"><label class="form-label" for="l-obs">Observações</label><input id="l-obs" type="text" class="form-input"></div>
      </div>
      <div style="border:1px solid var(--wd-line);border-radius:12px;padding:14px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap;">
          <div><div style="font-size:14px;font-weight:800;color:var(--primary);">Médias por hora</div>
            <div style="font-size:12px;color:var(--ink-3);margin-top:2px;">Uma por linha de produto. Usadas no planejamento, no custo e no OEE.</div></div>
          <button type="button" class="b sm" onclick="addMedia()">+ Adicionar</button>
        </div>
        <div class="md-ed" id="l-medias"></div>
      </div>
      <div id="l-error" class="hidden alert alert-danger"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-linha')">Cancelar</button>
      <button class="btn btn-primary" id="btn-salvar-linha" onclick="salvarLinha()">💾 Salvar</button>
    </div>
  </div>
</div>

<!-- FICHA -->
<div id="modal-view-linha" class="modal-overlay hidden">
  <div class="modal modal-lg">
    <div class="modal-header"><div class="modal-title" id="view-linha-title">Linha</div><button class="modal-close" onclick="closeModal('modal-view-linha')" aria-label="Fechar">✕</button></div>
    <div id="view-linha-body"></div>
    <div class="modal-footer" id="view-linha-foot"></div>
  </div>
</div>

<!-- HORÍMETRO -->
<div id="modal-horimetro" class="modal-overlay hidden">
  <div class="modal" style="max-width:440px;">
    <div class="modal-header"><div class="modal-title">Atualizar horímetro</div><button class="modal-close" onclick="closeModal('modal-horimetro')" aria-label="Fechar">✕</button></div>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div style="background:#f8fafc;border-radius:10px;padding:12px;"><div style="font-size:12px;color:var(--ink-3);">Linha</div><div style="font-weight:800;color:var(--primary);font-size:15px;" id="hm-nome">—</div></div>
      <div class="form-grid-2">
        <div class="form-group"><label class="form-label" for="hm-atual">Atual (h)</label><input id="hm-atual" type="number" class="form-input" readonly style="background:#f5f7fa;color:#888;"></div>
        <div class="form-group"><label class="form-label" for="hm-novo">Novo (h) <span class="req">*</span></label><input id="hm-novo" type="number" class="form-input" min="0"></div>
      </div>
      <div id="hm-origem" style="font-size:12px;color:#0369a1;background:#f0f9ff;border-radius:10px;padding:9px 11px;line-height:1.45;"></div>
      <div class="form-group"><label class="form-label" for="hm-motivo">Motivo</label><input id="hm-motivo" type="text" class="form-input" placeholder="Ex.: aferição, troca de horímetro"></div>
      <div id="hm-error" class="hidden alert alert-danger"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('modal-horimetro')">Cancelar</button><button class="btn btn-primary" onclick="salvarHorimetro()">✓ Atualizar</button></div>
  </div>
</div>
<div id="toast-container"></div>
<script>
let _editingLinhaId=null, _hmId=null, _linhas=[], _produtosLinha=[], _lFoto=null, _uso={}, _st='ativo';
const UNIDADES=['sacos','unidades','toneladas','kg','litros','sachês','caixas'];
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const _norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');   // mesma regra da produção (ignora espaço, acento, maiúscula)
const fN=(v,d=0)=>(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
function fmtHm(v){ return (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDataBR(d){ if(!d)return '—'; const p=String(d).slice(0,10).split('-'); return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:String(d); }
const _un=u=>({sacos:'sc',unidades:'un',toneladas:'t'}[u]||u||'un');

fetch('partials/sidebar.html').then(r=>r.text()).then(html=>{
  document.getElementById('sidebar-container').innerHTML=html;
  document.querySelector('[href="linhas.html"]')?.classList.add('active');
  openGroup('cadastros');
});
initSidebar('linhas.html');

/* HORÍMETRO — a fonte é a PRODUÇÃO (produtos_op[].hf das OPs). O cadastro é só o
   valor inicial/aferição. Lê só as OPs dos últimos 120 dias: o horímetro só anda
   para frente, então o maior valor está sempre nas mais recentes. */
let _hmProd={};
async function carregarHorimetroProducao(){
  _hmProd={};
  const d=new Date(); d.setDate(d.getDate()-120);
  const desde=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const{data:ops}=await _supabase.from('producao').select('linha,data,op_numero,produtos_op').gte('data',desde).order('data',{ascending:false}).limit(2000);
  (ops||[]).forEach(o=>{
    (Array.isArray(o.produtos_op)?o.produtos_op:[]).forEach(it=>{
      const hf=parseFloat(it&&it.hf); if(!isFinite(hf)||hf<=0) return;
      const at=_hmProd[o.linha]; if(!at||hf>at.hf) _hmProd[o.linha]={hf,data:o.data,op:o.op_numero||''};
    });
  });
}
const horimetroProducao=nome=>_hmProd[nome]||null;
function horimetroAtual(l){ const cad=parseFloat(l&&l.horimetro)||0, pr=horimetroProducao(l&&l.nome); return pr&&pr.hf>cad?pr.hf:cad; }
// grava no cadastro (e nos equipamentos da linha) o horímetro que veio da produção, quando estiver atrasado
async function sincronizarHorimetros(){
  const pend=_linhas.filter(l=>{ const pr=horimetroProducao(l.nome); return pr&&pr.hf>(parseFloat(l.horimetro)||0)+0.001; });
  for(const l of pend){ const pr=horimetroProducao(l.nome);
    try{ await _supabase.from('linhas_producao').update({horimetro:pr.hf,atualizado_em:new Date().toISOString()}).eq('id',l.id);
      await _supabase.from('equipamentos_linhas').update({horimetro:pr.hf}).eq('linha',l.nome); l.horimetro=pr.hf; }
    catch(e){ console.warn('[sync horímetro]',l.nome,e); } }
  return pend.length;
}

/* ═══════════════════════════════════════════
   CARGA
   ═══════════════════════════════════════════ */
async function init(){
  const[{data:ln},{data:pr}]=await Promise.all([
    _supabase.from('linhas_producao').select('*').order('nome'),
    _supabase.from('produtos').select('nome,linhas,unidade').eq('status','ativo')]);
  _linhas=ln||[];
  // linhas de produto do cadastro de produtos (é por este nome que a média é encontrada)
  const m={}; (pr||[]).forEach(p=>(p.linhas||[]).forEach(lp=>{ const k=String(lp||'').trim(); if(k&&!m[k]) m[k]={nome:k,unidade:p.unidade||'sacos',produtos:[]}; if(k) m[k].produtos.push(p.nome); }));
  _produtosLinha=Object.values(m).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  // uso de cada linha (OPs, equipamentos) — trava nome e exclusão
  const usos=await Promise.all(_linhas.map(async l=>{
    const [o,e,u]=await Promise.all([
      _supabase.from('producao').select('id',{count:'exact',head:true}).eq('linha',l.nome),
      _supabase.from('equipamentos_linhas').select('id',{count:'exact',head:true}).eq('linha',l.nome),
      _supabase.from('producao').select('data').eq('linha',l.nome).order('data',{ascending:false}).limit(1)]);
    return [l.id,{ops:o.count||0,eq:e.count||0,ult:(u.data&&u.data[0]&&u.data[0].data)||null}];
  }));
  _uso=Object.fromEntries(usos);
  await carregarHorimetroProducao();
  const sinc=await sincronizarHorimetros();
  renderLinhas();
  if(sinc) toast(`Horímetro atualizado pela produção em ${sinc} linha(s).`,'success');
}

/* média → existe no cadastro de produtos? (devolve o nome correto, se só a grafia difere) */
function conferirMedia(nome){
  const n=String(nome||'').trim(); if(!n) return {ok:false};
  if(_produtosLinha.some(p=>_norm(p.nome)===_norm(n))) return {ok:true};   // "Linha 25kg" = "Linha 25 kg" para a produção
  const quase=_produtosLinha.find(p=>_norm(p.nome).includes(_norm(n))||_norm(n).includes(_norm(p.nome)));
  return {ok:false,sugestao:quase?quase.nome:null};
}
function semMedia(){
  const com=new Set(); _linhas.filter(l=>l.status==='ativo').forEach(l=>(l.produtos||[]).forEach(p=>{ { const c=conferirMedia(p.nome); const alvo=c.ok?_produtosLinha.find(x=>_norm(x.nome)===_norm(p.nome)):null; if(alvo) com.add(alvo.nome); } }));
  return _produtosLinha.filter(p=>!com.has(p.nome));
}

/* ═══════════════════════════════════════════
   LISTA
   ═══════════════════════════════════════════ */
function setSt(s){ _st=s; renderLinhas(); }
function renderLinhas(){
  const atv=_linhas.filter(l=>l.status==='ativo');
  const erradas=[]; _linhas.forEach(l=>(l.produtos||[]).forEach(p=>{ if(!conferirMedia(p.nome).ok) erradas.push({l,p}); }));
  const sm=semMedia();
  document.getElementById('ln-sub').textContent=`${atv.length} linha(s) ativa(s) · ${_produtosLinha.length} linha(s) de produto no cadastro de produtos`;
  document.getElementById('ln-pend').innerHTML=
    (erradas.length?`<span class="pi" style="cursor:default;" title="${esc(erradas.map(x=>x.l.nome+': '+x.p.nome).join(' | '))}"><b>${erradas.length}</b> média(s) com nome diferente do cadastro de produtos — a produção só acha por aproximação, ou não acha</span>`:'')+
    (sm.length?`<span class="pi" style="cursor:default;"><b>${sm.length}</b> linha(s) de produto sem média: ${esc(sm.map(p=>p.nome).join(', '))}</span>`:'');
  document.getElementById('seg-st').innerHTML=[['ativo','Ativas',atv.length],['inativo','Inativas',_linhas.length-atv.length],['','Todas',_linhas.length]]
    .map(([k,r,n])=>`<button type="button" class="${_st===k?'on':''}" onclick="setSt('${k}')">${r}<b>${n}</b></button>`).join('');
  const lista=_linhas.filter(l=>!_st||l.status===_st);
  const el=document.getElementById('ln-lista');
  if(!lista.length){ el.innerHTML=`<div class="vazio" style="grid-column:1/-1;"><div style="font-size:34px;">🏭</div><b>Nenhuma linha aqui</b></div>`; return; }
  el.innerHTML=lista.map(l=>{
    const id=esc(l.id), u=_uso[l.id]||{ops:0,eq:0}, pr=horimetroProducao(l.nome), md=l.produtos||[];
    return `<div class="lnc${l.status!=='ativo'?' inat':''}">
      <div class="lnc-top" role="button" tabindex="0" onclick="visualizarLinha('${id}')" onkeydown="if(event.key==='Enter')visualizarLinha('${id}')">
        <div class="lnc-ft">${l.foto?`<img src="${esc(l.foto)}" alt="">`:'🏭'}</div>
        <div class="lnc-n"><b>${esc(l.nome)}</b><small>${l.status==='ativo'?'<span class="tag ok">Ativa</span>':'<span class="tag gray">Inativa</span>'}${l.obs?' · '+esc(l.obs):''}</small></div>
      </div>
      <div class="lnc-hm"><div><span>Horímetro</span><b>${fmtHm(horimetroAtual(l))} h</b></div>
        <small style="text-align:right;">${pr?`pela OP ${esc(pr.op||'')}<br>de ${fmtDataBR(pr.data)}`:'aferição manual'}</small></div>
      <div class="lnc-st">
        <a href="producao.html" title="OPs lançadas"><span>OPs</span><b>${fN(u.ops)}</b></a>
        <a href="equip-linhas.html" title="Equipamentos desta linha"><span>Equipamentos</span><b>${fN(u.eq)}</b></a>
        <div><span>Última OP</span><b style="font-size:13px;">${u.ult?fmtDataBR(u.ult):'—'}</b></div>
      </div>
      <div class="md-l">${md.length?md.map(p=>{ const c=conferirMedia(p.nome);
        return `<div class="md-i${c.ok?'':' erro'}"><span>${esc(p.nome)}${c.ok?'':`<small>${c.sugestao?`no cadastro de produtos é “${esc(c.sugestao)}” — use o mesmo nome`:'não existe no cadastro de produtos'}</small>`}</span><b>${fN(p.capHora)} ${esc(_un(p.unidade))}/h</b></div>`; }).join('')
        :'<div class="md-i erro"><span>Nenhuma média por hora cadastrada</span></div>'}</div>
      <div class="lnc-a">
        <button type="button" class="b sm" onclick="visualizarLinha('${id}')">Ficha</button>
        <button type="button" class="b sm" onclick="editarLinha('${id}')">✏️ Editar</button>
        <button type="button" class="b sm" onclick="abrirHorimetro('${id}')" aria-label="Atualizar horímetro">⏱️ Horímetro</button>
      </div></div>`;
  }).join('');
}

/* ═══════════════════════════════════════════
   EDITOR
   ═══════════════════════════════════════════ */
function _abrirEditor(l){
  _editingLinhaId=l?l.id:null; _lFoto=l?l.foto||null:null;
  document.getElementById('modal-linha-title').textContent=l?'Editar — '+l.nome:'Nova linha de produção';
  document.getElementById('l-nome').value=l?l.nome||'':'';
  document.getElementById('l-horimetro').value=l?(l.horimetro??''):'';
  document.getElementById('l-obs').value=l?l.obs||'':'';
  document.getElementById('l-status').value=l?l.status||'ativo':'ativo';
  const u=l?_uso[l.id]||{ops:0,eq:0}:{ops:0,eq:0}, trava=!!(l&&(u.ops||u.eq));
  const nm=document.getElementById('l-nome'); nm.readOnly=trava; nm.style.background=trava?'#f5f7fa':'';
  document.getElementById('l-nome-trava').textContent=trava?`🔒 Nome travado: ${u.ops} OP(s) e ${u.eq} equipamento(s) estão ligados a ele. Renomear deixaria o histórico solto.`:'';
  const pr=l?horimetroProducao(l.nome):null;
  document.getElementById('l-hm-dica').textContent=pr?`A produção já está em ${fmtHm(pr.hf)} h (OP de ${fmtDataBR(pr.data)}). Para aferir, use o botão Horímetro.`:'';
  _setFoto(_lFoto);
  document.getElementById('l-medias').innerHTML='';
  (l&&l.produtos||[]).forEach(p=>addMedia(p));
  if(!(l&&(l.produtos||[]).length)) addMedia();
  document.getElementById('l-error').classList.add('hidden');
  document.getElementById('modal-linha').classList.remove('hidden');
  setTimeout(()=>document.getElementById(trava?'l-obs':'l-nome').focus(),50);
}
function openModalLinha(){ _abrirEditor(null); }
function editarLinha(id){ const l=_linhas.find(x=>x.id===id); if(l){ closeModal('modal-view-linha'); _abrirEditor(l); } }
function addMedia(p){
  p=p||{}; const div=document.createElement('div'); div.className='md-row';
  const nomes=_produtosLinha.map(x=>x.nome), atual=String(p.nome||'').trim(), fora=atual&&!nomes.includes(atual);
  div.innerHTML=`<select class="form-input nm" aria-label="Linha de produto" onchange="mudouMedia(this)">
      <option value="">Linha de produto…</option>${nomes.map(n=>`<option${n===atual?' selected':''}>${esc(n)}</option>`).join('')}
      ${fora?`<option selected value="${esc(atual)}">${esc(atual)} (fora do cadastro)</option>`:''}</select>
    <input type="number" class="form-input cap" min="0" step="any" placeholder="Média/h" value="${esc(p.capHora??'')}" aria-label="Média por hora">
    <select class="form-input un" aria-label="Unidade">${UNIDADES.map(u=>`<option${u===(p.unidade||'sacos')?' selected':''}>${u}</option>`).join('')}</select>
    <button type="button" class="ib x" aria-label="Remover" onclick="this.parentNode.remove()">✕</button>
    <div class="msg"></div>`;
  document.getElementById('l-medias').appendChild(div); mudouMedia(div.querySelector('.nm'),true);
}
function mudouMedia(sel,inicial){
  const row=sel.closest('.md-row'), msg=row.querySelector('.msg'), v=sel.value, c=conferirMedia(v);
  if(!inicial){ const pl=_produtosLinha.find(x=>x.nome===v); if(pl) row.querySelector('.un').value=UNIDADES.includes(pl.unidade)?pl.unidade:row.querySelector('.un').value; }
  msg.innerHTML=!v||c.ok?'':`⚠️ Nome diferente do cadastro de produtos — a produção pode não achar esta média.${c.sugestao?` <button type="button" onclick="trocarNome(this,'${esc(c.sugestao)}')">Usar “${esc(c.sugestao)}”</button>`:''}`;
}
function trocarNome(btn,nome){ const sel=btn.closest('.md-row').querySelector('.nm'); [...sel.options].forEach(o=>{ if(o.textContent.endsWith('(fora do cadastro)')) o.remove(); }); sel.value=nome; mudouMedia(sel); }
function getMedias(){
  return [...document.querySelectorAll('#l-medias .md-row')].map(r=>({nome:r.querySelector('.nm').value.trim(),capHora:r.querySelector('.cap').value,unidade:r.querySelector('.un').value}))
    .filter(p=>p.nome&&p.capHora!=='').map(p=>({nome:p.nome,capHora:p.capHora,unidade:p.unidade}));   // mesmo formato de antes (capHora em texto)
}
async function salvarLinha(){
  if(!guardAction('linhas','edit')) return;
  const errEl=document.getElementById('l-error'), btn=document.getElementById('btn-salvar-linha');
  const erro=m=>{ errEl.textContent=m; errEl.classList.remove('hidden'); };
  const nome=document.getElementById('l-nome').value.trim().replace(/\s+/g,' ');
  if(!nome) return erro('Informe o nome da linha.');
  const dup=_linhas.find(x=>x.id!==_editingLinhaId&&_norm(x.nome)===_norm(nome)); if(dup) return erro(`Já existe a linha "${dup.nome}".`);
  const atual=_editingLinhaId?_linhas.find(x=>x.id===_editingLinhaId):null;
  if(atual&&atual.nome!==nome){ const u=_uso[atual.id]||{}; if(u.ops||u.eq) return erro('Esta linha tem histórico; o nome não pode mudar.'); }
  const medias=getMedias(), rep=medias.map(m=>m.nome).filter((n,i,a)=>a.indexOf(n)!==i);
  if(rep.length) return erro('Linha de produto repetida nas médias: '+[...new Set(rep)].join(', ')+'.');
  btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  try{
    if(_lFoto&&_lFoto.startsWith('data:')){ const u=await subirFotoStorage(_lFoto,'linhas_producao',_editingLinhaId); if(u) _lFoto=u; }
    const hmTxt=document.getElementById('l-horimetro').value;
    const dados={nome,foto:_lFoto||null,obs:document.getElementById('l-obs').value.trim()||null,status:document.getElementById('l-status').value,produtos:medias,atualizado_em:new Date().toISOString()};
    if(!atual||hmTxt!==String(atual.horimetro??'')) dados.horimetro=parseFloat(hmTxt)||0;   // não sobrescreve o que a produção sincronizou
    if(atual){ await db(_supabase.from('linhas_producao').update(dados).eq('id',atual.id),'atualizar linha'); await addLog('UPDATE','LINHAS',atual.id,'Atualizada: '+nome); toast('Linha atualizada!','success'); }
    else{ const{data}=await db(_supabase.from('linhas_producao').insert(dados).select().single(),'cadastrar linha'); await addLog('CREATE','LINHAS',data.id,'Nova linha: '+nome); toast('Linha cadastrada!','success'); }
    closeModal('modal-linha'); await init();
  }catch(e){ erro('Erro: '+e.message); }
  btn.disabled=false; btn.innerHTML='💾 Salvar';
}
async function excluirLinha(id){
  if(!guardAction('linhas','delete')) return;
  const l=_linhas.find(x=>x.id===id); if(!l) return; const u=_uso[id]||{};
  if(u.ops||u.eq){ alert(`"${l.nome}" tem ${u.ops||0} OP(s) e ${u.eq||0} equipamento(s) ligados a ela e não pode ser excluída.\n\nSe parou de rodar, edite e mude a situação para Inativa — o histórico continua.`); return; }
  if(!confirm(`Excluir a linha "${l.nome}"? Isto não pode ser desfeito.`)) return;
  try{ await db(_supabase.from('linhas_producao').delete().eq('id',id),'excluir linha'); await addLog('DELETE','LINHAS',id,'Excluída: '+l.nome);
    toast('Linha excluída.','warning'); closeModal('modal-view-linha'); await init(); }catch(e){ toast('Erro: '+e.message,'danger'); }
}

/* ═══════════════════════════════════════════
   FICHA / HORÍMETRO / FOTO / EXPORTAR
   ═══════════════════════════════════════════ */
function visualizarLinha(id){
  const l=_linhas.find(x=>x.id===id); if(!l) return; const u=_uso[id]||{ops:0,eq:0}, pr=horimetroProducao(l.nome);
  document.getElementById('view-linha-title').textContent=l.nome;
  const cel=(a,b)=>`<div class="ficha-c"><span>${a}</span><b>${b||'—'}</b></div>`;
  document.getElementById('view-linha-body').innerHTML=`
    ${l.foto?`<img src="${esc(l.foto)}" alt="" style="max-width:240px;border-radius:12px;cursor:pointer;margin-bottom:14px;" onclick="verFotoInline('${esc(l.foto)}')">`:''}
    <div class="ficha-g">${cel('Situação',l.status==='ativo'?'Ativa':'Inativa')}${cel('Horímetro',fmtHm(horimetroAtual(l))+' h')}
      ${cel('Origem do horímetro',pr?`OP ${esc(pr.op||'')} de ${fmtDataBR(pr.data)}`:'aferição manual')}${cel('OPs lançadas',fN(u.ops))}
      ${cel('Equipamentos',fN(u.eq))}${cel('Última OP',u.ult?fmtDataBR(u.ult):'—')}${l.obs?cel('Observações',esc(l.obs)):''}</div>
    <div style="font-size:14px;font-weight:800;color:var(--primary);margin:6px 0 8px;">Médias por hora</div>
    <div class="md-l">${(l.produtos||[]).map(p=>{ const c=conferirMedia(p.nome); const pl=_produtosLinha.find(x=>x.nome===p.nome);
      return `<div class="md-i${c.ok?'':' erro'}"><span>${esc(p.nome)}<small style="color:${c.ok?'var(--ink-4)':'#92400e'};">${c.ok?(pl?esc(pl.produtos.join(', ')):''):(c.sugestao?`no cadastro de produtos é “${esc(c.sugestao)}” — use o mesmo nome`:'não existe no cadastro de produtos')}</small></span><b>${fN(p.capHora)} ${esc(_un(p.unidade))}/h</b></div>`; }).join('')||'<div class="md-i erro"><span>Nenhuma média cadastrada</span></div>'}</div>`;
  document.getElementById('view-linha-foot').innerHTML=`<button class="btn btn-secondary" style="color:#dc2626;margin-right:auto;" onclick="excluirLinha('${esc(id)}')">Excluir</button>
    <button class="btn btn-secondary" onclick="abrirHorimetro('${esc(id)}')">⏱️ Horímetro</button><button class="btn btn-primary" onclick="editarLinha('${esc(id)}')">✏️ Editar</button>`;
  document.getElementById('modal-view-linha').classList.remove('hidden');
}
function abrirHorimetro(id){
  const l=_linhas.find(x=>x.id===id); if(!l) return; _hmId=id;
  document.getElementById('hm-nome').textContent=l.nome; document.getElementById('hm-atual').value=horimetroAtual(l);
  const pr=horimetroProducao(l.nome);
  document.getElementById('hm-origem').innerHTML=pr?`📋 Último horímetro lançado na produção: <b>${fmtHm(pr.hf)} h</b> — OP ${esc(pr.op||'—')} de ${fmtDataBR(pr.data)}. Só altere aqui em aferição ou troca de horímetro.`
    :'ℹ️ Esta linha ainda não tem OP com horímetro. O valor é de aferição manual.';
  document.getElementById('hm-novo').value=''; document.getElementById('hm-motivo').value=''; document.getElementById('hm-error').classList.add('hidden');
  document.getElementById('modal-horimetro').classList.remove('hidden'); setTimeout(()=>document.getElementById('hm-novo').focus(),50);
}
async function salvarHorimetro(){
  if(!guardAction('linhas','edit')) return;
  const novo=parseFloat(document.getElementById('hm-novo').value), atual=parseFloat(document.getElementById('hm-atual').value)||0;
  const motivo=document.getElementById('hm-motivo').value.trim(), errEl=document.getElementById('hm-error');
  if(isNaN(novo)||novo<0){ errEl.textContent='Informe um horímetro válido.'; errEl.classList.remove('hidden'); return; }
  if(novo<atual&&!confirm(`O novo valor (${fmtHm(novo)} h) é MENOR que o atual (${fmtHm(atual)} h). Confirmar mesmo assim?`)) return;
  try{
    const r=await _supabase.from('linhas_producao').update({horimetro:novo,atualizado_em:new Date().toISOString()}).eq('id',_hmId); if(r.error) throw r.error;
    const l=_linhas.find(x=>x.id===_hmId);
    if(l){ const{count}=await _supabase.from('equipamentos_linhas').select('id',{count:'exact',head:true}).eq('linha',l.nome);
      if(count){ await _supabase.from('equipamentos_linhas').update({horimetro:novo}).eq('linha',l.nome); }
      toast(`Horímetro ${fmtHm(novo)} h${count?` — ${count} equipamento(s) sincronizado(s)`:''}.`,'success');
      if(_hmProd[l.nome]&&novo>_hmProd[l.nome].hf) delete _hmProd[l.nome]; }
    await addLog('UPDATE','HORIMETRO',_hmId,`Horímetro: ${atual}h → ${novo}h${motivo?' ('+motivo+')':''}`);
    closeModal('modal-horimetro'); await init();
  }catch(e){ errEl.textContent='Erro: '+e.message; errEl.classList.remove('hidden'); }
}
function _setFoto(f){ _lFoto=f; document.getElementById('l-foto-preview').innerHTML=f?`<img src="${esc(f)}" alt="">`:'🏭'; document.getElementById('l-btn-rm-foto').style.display=f?'inline-flex':'none'; }
function previewFotoLinha(input){
  if(!input.files||!input.files[0]) return; const file=input.files[0]; if(!file.type.startsWith('image/')) return;
  const r=new FileReader();
  r.onload=e=>{ const img=new Image(); img.onload=()=>{   // reduz para no máx. 1000 px (antes a foto crua inflava a tabela)
    const maxD=1000; let w=img.width,h=img.height; if(w>maxD||h>maxD){ if(w>h){h=Math.round(h*maxD/w);w=maxD;}else{w=Math.round(w*maxD/h);h=maxD;} }
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); _setFoto(cv.toDataURL('image/jpeg',0.82)); }; img.src=e.target.result; };
  r.readAsDataURL(file); input.value='';
}
function removerFotoLinha(){ _setFoto(null); }
function exportarLista(tipo){
  const lista=_linhas.filter(l=>!_st||l.status===_st);
  const cab=['Linha','Situação','Horímetro','OPs','Equipamentos','Médias por hora'];
  const lin=lista.map(l=>[l.nome,l.status==='ativo'?'Ativa':'Inativa',fmtHm(horimetroAtual(l))+' h',fN((_uso[l.id]||{}).ops),fN((_uso[l.id]||{}).eq),
    (l.produtos||[]).map(p=>`${p.nome}: ${fN(p.capHora)} ${_un(p.unidade)}/h`).join(tipo==='csv'?' | ':'<br>')]);
  if(tipo==='csv') exportarCSV(cab,lin,'linhas-producao'); else exportarPDF('Linhas de Produção',cab,lin);
}
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return;
  for(const m of ['modal-horimetro','modal-linha','modal-view-linha']){ const el=document.getElementById(m); if(el&&!el.classList.contains('hidden')){ closeModal(m); return; } } });

init();
</script>
