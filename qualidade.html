<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central da Qualidade — ERP Industrial</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<!-- ═══════════════════════════════════════════════════════════════════
     CENTRAL DA QUALIDADE (10/2026)
     Caixa pessoal: o que é de CADA pessoa no BPF e no Laboratório, conforme
     o que foi marcado em BPF → POP → ⚙️ Configurar (designações + papéis).
     Avisos com som chegam em qualquer tela do ERP (AvisosQualidade, utils.js).
     ═══════════════════════════════════════════════════════════════════ -->
<style>
.cq{--ln:#e2e8f0;--mu:#64748b;--ok:#16a34a}
.cq-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.cq-head h1{font-size:24px;font-weight:800;color:var(--primary)}.cq-head p{color:var(--mu);font-size:13px;margin-top:2px}
.cq-som{min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--ln);background:#fff;font-family:inherit;font-weight:700;color:var(--primary);cursor:pointer}
.cq-som.on{background:#ecfdf5;border-color:#86efac;color:#166534}
.cq-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.cq-k{background:#fff;border:1px solid var(--ln);border-left:4px solid var(--ln);border-radius:12px;padding:14px 16px;cursor:pointer}
.cq-k .l{font-size:12px;font-weight:600;color:var(--mu)}.cq-k .v{font-size:26px;font-weight:800;color:var(--primary);margin-top:4px}.cq-k .s{font-size:12px;color:#94a3b8}
.cq-k.r{border-left-color:#dc2626}.cq-k.r .v{color:#dc2626}.cq-k.a{border-left-color:#7c3aed}.cq-k.b{border-left-color:#2563eb}.cq-k.l2{border-left-color:#f59e0b}
.cq-nav{display:flex;gap:6px;padding:6px;background:#fff;border:1px solid var(--ln);border-radius:16px;margin-bottom:14px;flex-wrap:wrap}
.cq-nav button{flex:1 0 auto;min-height:48px;border:none;border-radius:12px;background:transparent;font-family:inherit;font-weight:700;font-size:14.5px;color:var(--primary);cursor:pointer}
.cq-nav button.on{background:var(--primary);color:var(--accent)}
.cq-grp{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.cq-grp h3{font-size:14.5px;font-weight:800;color:var(--primary);margin:0 0 10px;display:flex;gap:8px;align-items:center}
.cq-grp h3 span{background:#f1f5f9;border-radius:99px;padding:1px 9px;font-size:12px}
.cq-it{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #eef2f6;border-left:4px solid #94a3b8;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.cq-it b{color:var(--primary);font-size:13.5px}.cq-it .m{font-size:12px;color:var(--mu);margin-top:2px}
.cq-it .tg{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.cq-vazio{font-size:13px;color:#94a3b8;padding:6px 0}
.cq-av{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid #f1f5f9;padding:10px 0}
.cq-av.novo b{color:#b91c1c}.cq-av .q{font-size:12px;color:var(--mu)}
@media(max-width:900px){.cq-kpis{grid-template-columns:repeat(2,1fr)}.cq-it{flex-direction:column;align-items:stretch}}
.cq-subnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.cq-sb{min-height:44px;border:1.5px solid var(--ln);background:#fff;border-radius:12px;padding:0 16px;font-family:inherit;font-weight:700;font-size:14px;color:var(--primary);cursor:pointer;}
.cq-sb b{background:#f1f5f9;border-radius:99px;padding:1px 8px;margin-left:4px;}
.cq-sb.on{background:var(--primary);color:var(--accent);border-color:var(--primary);}.cq-sb.on b{background:rgba(255,255,255,.15);}
.cq-acts{display:flex;gap:6px;align-items:center;flex-shrink:0;}
.cq-ck{width:22px;height:22px;flex-shrink:0;cursor:pointer;}
.cq-seta{color:#94a3b8;width:14px;display:inline-block;}
.cq-mais{width:100%;min-height:42px;border:1.5px dashed #cbd5e1;background:#f8fafc;border-radius:10px;font-family:inherit;font-weight:700;color:var(--primary);cursor:pointer;}
.cq-barsel{position:sticky;top:64px;z-index:5;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff;border:1.5px solid #c4b5fd;border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:13px;color:#4c1d95;box-shadow:0 4px 14px rgba(4,45,77,.06);}
.cq-dica{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:9px 12px;font-size:12.5px;color:#1e3a8a;margin-bottom:10px;}
.cq-ov{position:fixed;inset:0;background:rgba(2,20,40,.5);z-index:20000;display:flex;align-items:center;justify-content:center;padding:12px;}
.cq-mod{background:#fff;border-radius:16px;max-width:760px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.cq-mod-h{padding:14px 18px;border-bottom:1px solid var(--ln);display:flex;gap:8px;align-items:center;color:var(--primary);}
.cq-mod-h button{margin-left:auto;border:0;background:#f1f5f9;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:15px;}
.cq-mod-b{padding:14px 18px;overflow:auto;}.cq-mod-f{padding:12px 18px;border-top:1px solid var(--ln);display:flex;gap:8px;justify-content:flex-end;}
.cq-tb{width:100%;border-collapse:collapse;font-size:12.5px;}.cq-tb td{padding:6px 8px;border-bottom:1px solid #f1f5f9;}.cq-tb td:first-child{color:var(--mu);width:46%;}
@media(max-width:700px){.cq-it{flex-wrap:wrap;}.cq-acts{width:100%;justify-content:flex-end;}}
</style>
</head>
<body>
<div id="sidebar-container"></div>
<header class="topbar" id="topbar">
  <button class="topbar-open-sidebar" onclick="toggleSidebar()">☰</button>
  <div class="topbar-title">CENTRAL DA QUALIDADE</div>
  <div class="topbar-right">
    <div class="topbar-user">
      <div class="user-avatar" style="width:32px;height:32px;font-size:12px;" id="top-avatar">—</div>
      <div><div class="topbar-user-name" id="top-user-name">—</div><div class="topbar-user-profile" id="top-user-perfil">—</div></div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()" style="color:#64748b;">Sair</button>
  </div>
</header>
<main class="main-content" id="main-content"><div class="cq">
  <div class="cq-head">
    <div><h1>🎯 Central da Qualidade</h1><p id="cq-sub">O que é seu no BPF e no Laboratório</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="cq-som" onclick="AvisosQualidade.bip&&AvisosQualidade.bip(true)">🔊 Testar som</button>
    <button class="cq-som" id="cq-som" onclick="ativarAvisos()">🔔 Ativar som e avisos neste aparelho</button></div>
  </div>
  <div class="cq-kpis" id="cq-kpis"></div>
  <div class="cq-nav" id="cq-nav">
    <button class="on" data-t="caixa" onclick="aba('caixa')">📥 Minha caixa</button>
    <button data-t="avisos" onclick="aba('avisos')">🔔 Avisos <span id="cq-nav-av"></span></button>
    <button data-t="equipe" id="cq-nav-eq" onclick="aba('equipe')" style="display:none;">👥 Equipe</button>
  </div>
  <div id="cq-out"><div style="padding:24px;"><span class="spin"></span> Carregando…</div></div>
</div></main>
<script>
const LEITURA_TOTAL=['SADM','ADM','QLD','AUD','DIR','GPR','SGR'];
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const fmtD=d=>d?String(d).slice(0,10).split('-').reverse().join('/'):'—';
const fmtDH=d=>d?new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=null,_aba='caixa';
const ETAPA={a_preencher:['🖨️ A preencher','#94a3b8'],a_digitar:['⌨️ A digitar','#2563eb'],falta_foto:['📷 Falta foto','#f59e0b'],assinaturas:['✍️ Assinar','#7c3aed']};
function etapa(r,f){
  const lanc=!!r.lancado_em||['aguardando_assinatura','nao_conforme'].includes(r.status);
  if(!lanc)return (r.ficha_impressa_em||r.status==='a_digitar'||r.status==='rascunho')?'a_digitar':'a_preencher';
  if(!r.foto_ficha&&!(f&&f.sem_papel))return 'falta_foto';
  if(f&&f.conclui_com_anexo)return 'concluido';
  return faltam(r,f).length?'assinaturas':'concluido';
}
function faltam(r,f){ return ((f&&f.assinaturas)||[]).filter(a=>!(r.assinaturas||[]).some(x=>x.id===a.id)); }

async function carregar(){
  const u=getUser();const perms=u.permissoes||{};
  const [ds,fs,regs,tars,pops,fn]=await Promise.all([
    _supabase.from('bpf_designacoes').select('funcionario_nome,usuario_id,pop_cod,funcao_cod,papeis,ativo').eq('ativo',true),
    _supabase.from('bpf_formularios').select('codigo,titulo,pop_cod,assinaturas,sem_papel,conclui_com_anexo,campos'),
    selectTodos(_supabase.from('bpf_registros').select('id,numero,formulario_cod,pop_cod,data,hora,status,conforme,lancado_em,lancado_por,preenchido_por,foto_ficha,assinaturas,assinaturas_papel,campos,tarefa_id,ficha_impressa_em,cancelado_em').not('status','in','(concluido,cancelado)'),{max:50000}),
    selectTodos(_supabase.from('bpf_tarefas').select('id,prazo,registro_id,pop_cod,origem_det,formulario_cod,status').eq('status','aberta').gte('criado_em','2026-10-26'),{max:50000}),
    _supabase.from('bpf_documentos_mestre').select('codigo,titulo').eq('tipo','pop'),
    _supabase.from('bpf_funcoes').select('codigo,nome')]);
  const todas=(ds.data||[]);
  const minhas=todas.filter(d=>(u.id&&d.usuario_id===u.id)||norm(d.funcionario_nome)===norm(u.nome));
  const gestor=LEITURA_TOTAL.includes(u.perfil);
  let lab=[];
  const veLab=gestor||(perms.laboratorio&&perms.laboratorio.view)||['SADM','ADM'].includes(u.perfil);
  if(veLab){ const d15=new Date(Date.now()-15*864e5).toISOString().slice(0,10);
    const r=await _supabase.from('producao_pallets').select('id,codigo,data,produto,linha,status,estoque_status').in('status',['reprovado','aguardando_decisao']).gte('data',d15).order('data',{ascending:false}).limit(300);
    lab=(r.data||[]).filter(p=>p.estoque_status!=='carregado'); }
  D={u,gestor,todas,minhas,forms:fs.data||[],regs:(regs.data||[]).filter(r=>!r.cancelado_em),tars:tars.data||[],pops:pops.data||[],funcoes:fn.data||[],lab,veLab};
  montar();
}
// itens de UMA pessoa (lista de designações dela); gestor sem designação = tudo
function itensDe(desigs,todos){
  const F=c=>D.forms.find(f=>f.codigo===c);
  const pap=(pop,p)=>todos||desigs.some(d=>(!d.pop_cod||d.pop_cod===pop)&&(d.papeis||[]).includes(p));
  const fun=pop=>desigs.filter(d=>(!d.pop_cod||d.pop_cod===pop)&&(d.papeis||[]).includes('assina')).map(d=>d.funcao_cod);
  const agora=new Date().toISOString();
  const sete=new Date(Date.now()-7*864e5).toISOString();
  const atr=D.tars.filter(t=>t.prazo<agora&&t.prazo>=sete&&(pap(t.pop_cod,'responsavel')||pap(t.pop_cod,'lanca')||pap(t.pop_cod,'aviso')));
  const fazer=[],assinar=[];
  D.regs.forEach(r=>{const f=F(r.formulario_cod);const e=etapa(r,f);
    if(['a_preencher','a_digitar','falta_foto'].includes(e)&&pap(r.pop_cod,'lanca'))fazer.push({r,f,e});
    if(e==='assinaturas'){const fl=faltam(r,f);const mf=fun(r.pop_cod);
      if(todos?fl.length:fl.some(a=>mf.includes(a.funcao)))assinar.push({r,f,e,fl});}});
  return {atr,fazer,assinar,minhasFun:todos?null:desigs.filter(d=>(d.papeis||[]).includes('assina'))};
}
function montar(){
  const mine=itensDe(D.minhas,D.gestor&&!D.minhas.length);
  D.mine=mine;
  const nAv=(D.avisos||[]).filter(n=>!AvisosQualidade.vistos().has(n.id)).length;
  document.getElementById('cq-sub').textContent=D.minhas.length?`Você está em ${[...new Set(D.minhas.map(d=>d.pop_cod||'todos'))].length} POP(s) do BPF`:(D.gestor?'Visão de gestão: pendências de todos os POPs':'Você ainda não foi colocado em nenhum POP — peça à Qualidade (BPF → POP → ⚙️ Configurar)');
  const k=[['r','Atrasadas',mine.atr.length,'passaram do prazo',"_sub='atr';aba('caixa')"],['b','Para fazer',mine.fazer.length,'preencher · digitar · foto',"_sub='fazer';aba('caixa')"],
           ['a','Para assinar',mine.assinar.length,'aguardando você',"_sub='assinar';aba('caixa')"],['l2','Laboratório',D.veLab?D.lab.length:'—',D.veLab?'pallets reprovados / em decisão':'sem acesso',"_sub='lab';aba('caixa')"]];
  document.getElementById('cq-kpis').innerHTML=k.map(([c,l,v,s,on])=>`<div class="cq-k ${c}" onclick="${on}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');
  document.getElementById('cq-nav-eq').style.display=D.gestor?'':'none';
  document.getElementById('cq-nav-av').textContent=nAv?`(${nAv})`:'';
  aba(_aba);
}
function aba(t){
  _aba=t;document.querySelectorAll('#cq-nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  if(t==='caixa')caixa();else if(t==='avisos')avisos();else equipe();
}
const nomeF=c=>(D.funcoes.find(f=>f.codigo===c)||{}).nome||c;
const resumo=r=>{const c=r.campos||{};return [c.op&&'OP '+c.op,c.lote||c.lote_producao,c.embalagem,c.nome,c.fornecedor].filter(Boolean).slice(0,3).join(' · ');};
const abrir=id=>`<a class="btn btn-primary btn-sm" href="bpf.html?reg=${id}">Abrir no BPF ➜</a>`;
// ── MINHA CAIXA: uma parte por vez (abas), listas curtas com "mostrar mais", e assinatura AQUI MESMO ──
let _sub=null,_mais={},_sel=new Set();
function caixa(){
  const m=D.mine;
  const n={assinar:m.assinar.length,atr:m.atr.length,fazer:m.fazer.length,lab:D.veLab?D.lab.length:0};
  if(!_sub)_sub=n.assinar?'assinar':n.atr?'atr':n.fazer?'fazer':D.veLab?'lab':'assinar';
  const sb=(k,t)=>`<button class="cq-sb${_sub===k?' on':''}" onclick="_sub='${k}';_sel.clear();caixa()">${t} <b>${n[k]}</b></button>`;
  let h=`<div class="cq-subnav">${sb('assinar','✍️ Para assinar')}${sb('atr','⏰ Atrasadas')}${sb('fazer','📝 Para fazer')}${D.veLab?sb('lab','🧪 Laboratório'):''}</div>`;
  const item=(cor,tit,meta,btn,pre)=>`<div class="cq-it" style="border-left-color:${cor}">${pre||''}<div style="flex:1;min-width:0;"><b>${tit}</b><div class="m">${meta}</div></div><div class="cq-acts">${btn}</div></div>`;
  const pagina=(k,lista,fn)=>{const lim=_mais[k]||10;return lista.slice(0,lim).map(fn).join('')+(lista.length>lim?`<button class="cq-mais" onclick="_mais['${k}']=${lim+20};caixa()">Mostrar mais (${lista.length-lim} restantes)</button>`:'');};
  if(_sub==='assinar'){
    // agrupado por registro (ficha); cada grupo recolhe; seleção para assinar várias de uma vez
    const g={};m.assinar.forEach(x=>{(g[x.r.formulario_cod]=g[x.r.formulario_cod]||[]).push(x);});
    const ks=Object.keys(g).sort();
    h+=ks.length?`<div class="cq-barsel"><span>${_sel.size?`<b>${_sel.size}</b> selecionada(s)`:'Marque as fichas para assinar várias de uma vez, ou assine uma a uma.'}</span>
        ${_sel.size?`<button class="btn btn-secondary btn-sm" onclick="_sel.clear();caixa()">Desmarcar</button><button class="btn btn-primary" onclick="assinarAqui([..._sel])">✍️ Assinar ${_sel.size} selecionada(s)</button>`:''}</div>`+
      ks.map(k=>{const l=g[k].sort((a,b)=>String(a.r.data).localeCompare(String(b.r.data)));const f=l[0].f;const ab=!_fech.has('as:'+k);const todasSel=l.every(x=>_sel.has(x.r.id));
        return `<div class="cq-grp"><h3 style="cursor:pointer;" onclick="alternaGrp('as:${k}')"><span class="cq-seta">${ab?'▾':'▸'}</span> ${esc(l[0].r.pop_cod)} · ${esc(k)} — ${esc(f?f.titulo:'')} <span>${l.length}</span>
          ${ab?`<button class="btn btn-secondary btn-sm" style="margin-left:auto;" onclick="event.stopPropagation();selGrupo('${k}',${todasSel?0:1})">${todasSel?'Desmarcar todas':'Marcar todas'}</button>`:''}</h3>
          ${ab?pagina('as:'+k,l,({r,fl})=>item('#7c3aed',`${esc(r.numero)} · ${fmtD(r.data)}`,`${esc(resumo(r)||'—')} · falta: ${fl.map(a=>esc(a.label)).join(', ')}`,
            `<button class="btn btn-secondary btn-sm" onclick="verReg('${r.id}')">👁️ Ver</button><button class="btn btn-primary btn-sm" onclick="assinarAqui(['${r.id}'])">✍️ Assinar</button>`,
            `<input type="checkbox" class="cq-ck" ${_sel.has(r.id)?'checked':''} onclick="togSel('${r.id}')">`)):''}</div>`;}).join('')
      :'<div class="cq-vazio">✅ Nada para você assinar agora.</div>';
  }
  if(_sub==='atr'){
    const regPorId=id=>D.regs.find(r=>r.id===id);
    h+=`<div class="cq-grp">${m.atr.length?pagina('atr',m.atr.sort((a,b)=>a.prazo.localeCompare(b.prazo)),t=>{const r=regPorId(t.registro_id);
      return item('#dc2626',`${esc(t.pop_cod)} · ${esc(t.formulario_cod)}${r?' · '+esc(r.numero):''}`,`${esc(t.origem_det||'')} · prazo era <b style="color:#dc2626">${fmtDH(t.prazo)}</b>`,
        r?`<button class="btn btn-secondary btn-sm" onclick="verReg('${r.id}')">👁️ Ver</button><a class="btn btn-primary btn-sm" href="bpf.html?reg=${r.id}">Preencher no BPF ➜</a>`:'');})
      :'<div class="cq-vazio">✅ Nada atrasado nos últimos 7 dias.</div>'}</div>`;
  }
  if(_sub==='fazer'){
    const g={};m.fazer.forEach(({r,f,e})=>{const k=r.formulario_cod;(g[k]=g[k]||{f,pop:r.pop_cod,n:0,et:{},min:r.data,max:r.data});const o=g[k];o.n++;o.et[e]=(o.et[e]||0)+1;
      if(String(r.data)<String(o.min))o.min=r.data;if(String(r.data)>String(o.max))o.max=r.data;});
    const ks=Object.keys(g).sort();
    h+=`<div class="cq-dica">Preencher, digitar e fotografar a ficha é feito no BPF (é onde está o formulário). Cada botão abre direto o registro certo.</div>
      <div class="cq-grp">${ks.length?ks.map(k=>{const o=g[k];
      return item('#2563eb',`${esc(o.pop)} · ${esc(k)} — ${esc(o.f?o.f.titulo:'')}`,
        `${o.n} ficha(s) · ${Object.entries(o.et).map(([e,n])=>`${(ETAPA[e]||[e])[0]} ${n}`).join(' · ')} · de ${fmtD(o.min)} a ${fmtD(o.max)}`,
        `<a class="btn btn-primary btn-sm" href="bpf.html#pop=${encodeURIComponent(o.pop)}&aba=${encodeURIComponent(k)}">Abrir no BPF ➜</a>`);}).join('')
      :'<div class="cq-vazio">✅ Nenhuma ficha com você.</div>'}</div>`;
  }
  if(_sub==='lab'){
    const g={};D.lab.forEach(p=>{const k=(p.status==='reprovado'?'❌ Reprovado':'⏳ Aguardando decisão')+' · '+(p.produto||'—')+' · '+(p.linha||'—');(g[k]=g[k]||[]).push(p);});
    h+=`<div class="cq-grp">${Object.keys(g).length?Object.entries(g).map(([k,l])=>item(k.startsWith('❌')?'#dc2626':'#f59e0b',esc(k),`${l.length} pallet(s) · ${l.slice(0,6).map(p=>esc(p.codigo||'')).join(', ')}${l.length>6?'…':''}`,
      `<a class="btn btn-primary btn-sm" href="laboratorio.html">Abrir no Laboratório ➜</a>`)).join(''):'<div class="cq-vazio">✅ Nenhum pallet reprovado ou em decisão.</div>'}</div>`;
  }
  document.getElementById('cq-out').innerHTML=h;
}
let _fech=new Set((()=>{try{return JSON.parse(localStorage.getItem('cq_fechados')||'[]');}catch(e){return [];}})());
function alternaGrp(k){_fech.has(k)?_fech.delete(k):_fech.add(k);try{localStorage.setItem('cq_fechados',JSON.stringify([..._fech]));}catch(e){}caixa();}
function togSel(id){_sel.has(id)?_sel.delete(id):_sel.add(id);caixa();}
function selGrupo(k,marcar){D.mine.assinar.filter(x=>x.r.formulario_cod===k).forEach(x=>marcar?_sel.add(x.r.id):_sel.delete(x.r.id));caixa();}
// ── ver o registro antes de assinar (dados, foto da ficha e assinaturas) ──
async function verReg(id){
  const r=D.regs.find(x=>x.id===id);if(!r)return;const f=D.forms.find(x=>x.codigo===r.formulario_cod)||{};
  let foto='';
  if(r.foto_ficha&&r.foto_ficha.path){try{const {data}=await _supabase.storage.from('documentos').createSignedUrl(r.foto_ficha.path,600);
    if(data&&data.signedUrl)foto=/\.(png|jpe?g|webp|gif|bmp)$/i.test(r.foto_ficha.nome||r.foto_ficha.path)?`<img src="${data.signedUrl}" style="max-width:100%;border:1px solid #e2e8f0;border-radius:8px;">`:`<a class="btn btn-secondary btn-sm" href="${data.signedUrl}" target="_blank">📎 Abrir a ficha anexada</a>`;}catch(e){}}
  const val=(c,v)=>{if(v==null||v==='')return '—';if(v==='sim')return 'Sim';if(v==='nao')return 'Não';if(v==='na')return 'N/A';if(Array.isArray(v))return v.join(', ');if(typeof v==='object')return '—';if(c.tipo==='data')return fmtD(v);return String(v);};
  const fl=faltam(r,f);
  const ov=document.createElement('div');ov.className='cq-ov';ov.onclick=e=>{if(e.target===ov)ov.remove();};
  ov.innerHTML=`<div class="cq-mod"><div class="cq-mod-h"><b>${esc(r.numero)}</b> · ${esc(f.titulo||'')}<button onclick="this.closest('.cq-ov').remove()">✕</button></div>
    <div class="cq-mod-b"><div class="m" style="margin-bottom:8px;">${esc(r.pop_cod)} · ${fmtD(r.data)}${r.hora?' '+String(r.hora).slice(0,5):''} · preenchido por ${esc(r.preenchido_por||'—')} · lançado por ${esc(r.lancado_por||'—')}${r.conforme===false?' · <b style="color:#dc2626">NÃO CONFORME</b>':''}</div>
      <table class="cq-tb">${(f.campos||[]).filter(c=>c.tipo!=='secao').map(c=>`<tr><td>${esc(c.label)}</td><td><b>${esc(val(c,(r.campos||{})[c.id]))}</b></td></tr>`).join('')}</table>
      <div style="margin-top:10px;font-weight:800;color:var(--primary);font-size:13px;">Assinaturas</div>
      ${(f.assinaturas||[]).map(a=>{const x=(r.assinaturas||[]).find(y=>y.id===a.id);return `<div class="m" style="margin:4px 0;">${esc(a.label)}: ${x?`${x.img?`<img src="${x.img}" style="height:34px;vertical-align:middle;">`:''} ${esc(x.nome)} · ${fmtDH(x.em)}`:'<i>pendente</i>'}${(r.assinaturas_papel||{})[a.id]?' · no papel: '+esc(r.assinaturas_papel[a.id]):''}</div>`;}).join('')}
      ${foto?`<div style="margin-top:10px;font-weight:800;color:var(--primary);font-size:13px;">Foto da ficha</div>${foto}`:''}</div>
    <div class="cq-mod-f"><a class="btn btn-secondary" href="bpf.html?reg=${r.id}">Abrir no BPF</a>${fl.length&&etapa(r,f)==='assinaturas'?`<button class="btn btn-primary" onclick="this.closest('.cq-ov').remove();assinarAqui(['${r.id}'])">✍️ Assinar</button>`:''}</div></div>`;
  document.body.appendChild(ov);
}
// ── assinar AQUI (grava no mesmo registro do BPF: assinatura desenhada + trilha; conclui quando todas assinaram) ──
async function assinarAqui(ids){
  if(!guardAction('bpf','edit'))return;
  const u=getUser();if(!u)return;
  const minhas=D.mine.minhasFun;   // null = gestor sem designação: assina a 1ª pendente
  const alvo=ids.map(id=>{const r=D.regs.find(x=>x.id===id);if(!r)return null;const f=D.forms.find(x=>x.codigo===r.formulario_cod)||{};
    if(etapa(r,f)!=='assinaturas')return null;
    const fl=faltam(r,f).filter(a=>!minhas||minhas.some(d=>d.funcao_cod===a.funcao&&(!d.pop_cod||d.pop_cod===r.pop_cod)));
    return fl.length?{r,f,a:fl[0]}:null;}).filter(Boolean);
  if(!alvo.length){toast('Nada para você assinar nessas fichas.','warning');return;}
  const img=await padAssinatura({titulo:alvo.length>1?`Assinar ${alvo.length} fichas`:`Assinar como ${alvo[0].a.label} — ${alvo[0].r.numero}`,quem:u.nome||u.email,
    funcao:[...new Set(alvo.map(x=>x.a.label))].join(', '),detalhe:alvo.length>1?alvo.map(x=>x.r.numero).slice(0,6).join(', ')+(alvo.length>6?'…':''):''});
  if(!img)return;
  let ok=0,conc=0;
  for(const {r,f,a} of alvo){
    const em=new Date().toISOString();
    const novas=[...(r.assinaturas||[]).filter(x=>x.id!==a.id),{id:a.id,label:a.label,funcao:a.funcao,nome:u.nome||u.email,perfil:u.perfil||null,em,img}];
    const todas=(f.assinaturas||[]).every(x=>novas.some(y=>y.id===x.id));
    const patch={assinaturas:novas,atualizado_em:em};
    if(todas){patch.status='concluido';patch.concluido_em=em;}
    const {error}=await _supabase.from('bpf_registros').update(patch).eq('id',r.id);
    if(error){toast('Erro em '+r.numero+': '+error.message,'danger');continue;}
    await _supabase.from('bpf_registro_trilha').insert({registro_id:r.id,numero:r.numero,acao:'assinado',campo:a.label,valor_anterior:null,valor_novo:u.nome||u.email,motivo:'Assinatura de próprio punho (Central da Qualidade)',autor:u.nome||u.email});
    if(todas){await _supabase.from('bpf_registro_trilha').insert({registro_id:r.id,numero:r.numero,acao:'concluido',motivo:'Todas as assinaturas obrigatórias coletadas',autor:u.nome||u.email});conc++;
      if(r.tarefa_id)await _supabase.from('bpf_tarefas').update({status:'concluida',concluida_em:em}).eq('id',r.tarefa_id);}
    Object.assign(r,patch);ok++;
  }
  _sel.clear();
  toast(`✍️ ${ok} ficha(s) assinada(s)${conc?` · ${conc} concluída(s)`:''}.`,'success');
  await carregar();
}
async function avisos(){
  const u=D.u;const out=document.getElementById('cq-out');
  const desde=new Date(Date.now()-30*864e5).toISOString();
  const {data}=await _supabase.from('notificacoes').select('id,tipo,titulo,descricao,created_at').contains('destinatarios',[u.nome]).gte('created_at',desde).order('created_at',{ascending:false}).limit(200);
  D.avisos=data||[];const vs=AvisosQualidade.vistos();
  const novos=D.avisos.filter(n=>!vs.has(n.id));
  out.innerHTML=`<div class="cq-grp"><h3>🔔 Avisos para você (30 dias) <span>${novos.length} novo(s)</span>
      ${novos.length?`<button class="btn btn-secondary btn-sm" style="margin-left:auto;" onclick="vistoTodos()">✓ Marcar todos como vistos</button>`:''}</h3>
    ${D.avisos.length?D.avisos.map(n=>`<div class="cq-av ${vs.has(n.id)?'':'novo'}"><div style="font-size:20px;">${n.tipo==='urgente'?'🚨':'🔔'}</div>
      <div style="flex:1;"><b>${esc(n.titulo)}</b><div class="q">${esc(n.descricao||'')}</div><div class="q">${fmtDH(n.created_at)}</div></div>
      ${vs.has(n.id)?'<span class="q">visto</span>':`<button class="btn btn-ghost btn-sm" onclick="AvisosQualidade.marcarVisto(['${n.id}']);avisos();">✓ Visto</button>`}</div>`).join('')
      :'<div class="cq-vazio">Nenhum aviso para você nos últimos 30 dias.</div>'}</div>`;
  document.getElementById('cq-nav-av').textContent=novos.length?`(${novos.length})`:'';
}
function vistoTodos(){ AvisosQualidade.marcarVisto((D.avisos||[]).map(n=>n.id)); avisos(); }
function equipe(){
  const pessoas={};D.todas.forEach(d=>{const k=d.funcionario_nome||'—';(pessoas[k]=pessoas[k]||[]).push(d);});
  const linhas=Object.entries(pessoas).map(([nome,ds])=>{const it=itensDe(ds,false);return {nome,pops:[...new Set(ds.map(d=>d.pop_cod||'todos'))],...it,login:ds.some(d=>d.usuario_id)};})
    .sort((a,b)=>(b.atr.length-a.atr.length)||((b.fazer.length+b.assinar.length)-(a.fazer.length+a.assinar.length)));
  document.getElementById('cq-out').innerHTML=`<div class="cq-grp"><h3>👥 Pendências por pessoa</h3>
    <div class="table-wrap"><table><thead><tr><th>Pessoa</th><th>POPs</th><th style="text-align:right;">Atrasadas</th><th style="text-align:right;">Para fazer</th><th style="text-align:right;">Para assinar</th></tr></thead><tbody>
    ${linhas.map(l=>`<tr><td><b>${esc(l.nome)}</b>${l.login?'':' <span style="font-size:11px;color:#94a3b8;">(sem login)</span>'}</td><td style="font-size:12px;">${l.pops.map(esc).join(', ')}</td>
      <td style="text-align:right;${l.atr.length?'color:#dc2626;font-weight:800;':''}">${l.atr.length}</td><td style="text-align:right;">${l.fazer.length}</td><td style="text-align:right;">${l.assinar.length}</td></tr>`).join('')}
    </tbody></table></div></div>`;
}

}
fetch('partials/sidebar.html').then(r=>r.text()).then(h=>{document.getElementById('sidebar-container').innerHTML=h;
  document.querySelector('[href="qualidade.html"]')?.classList.add('active');if(typeof openGroup==='function')openGroup('qualidade');});

});
async function avisosContagem(){ const u=D.u;const desde=new Date(Date.now()-30*864e5).toISOString();
  const {data}=await _supabase.from('notificacoes').select('id').contains('destinatarios',[u.nome]).gte('created_at',desde).limit(200);
  D.avisos=data||[];const n=D.avisos.filter(x=>!AvisosQualidade.vistos().has(x.id)).length;document.getElementById('cq-nav-av').textContent=n?`(${n})`:''; }
