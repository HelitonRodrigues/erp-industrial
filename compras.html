  const p=S.peds.find(x=>x.id===id);if(!p)return; const f=S.forn.find(x=>x.id===p.fornecedor_id)||{};
  const corpo=`<div style="display:flex;justify-content:space-between;align-items:center;"><div style="font-size:16px;font-weight:800;">ORDEM DE COMPRA Nº ${pad4(p.numero)}</div>${p.emergencial?'<span class="carimbo" style="color:#b45309;border-color:#b45309;">⚡ EMERGENCIAL</span>':''}</div>
    <div class="g"><div><small>Fornecedor</small><b>${E(p.fornecedor||'')}</b></div><div><small>CNPJ</small>${E(f.cnpj||'—')}</div><div><small>Contato</small>${E([f.contato,f.fone].filter(Boolean).join(' · ')||'—')}</div><div><small>Data</small>${dBR(p.data)}</div>
      <div><small>Entrega</small>${p.prazo_entrega?dBR(p.prazo_entrega):'combinar'}</div><div><small>Pagamento</small>${E(p.condicao_pagamento||'combinar')}</div><div><small>Comprador</small>${E(compradorDe(p)||('Almoxarifado — '+nomeCurto(p.comprador)))}</div><div><small>Aprovado por</small>${E(p.aprovado_por||(p.emergencial?'emergencial':'—'))}</div></div>
    <table><tr><th>#</th><th style="text-align:left;">Item</th><th>Qtd</th><th>Un.</th><th>Preço un.</th><th>Total</th></tr>
      ${(p.itens||[]).map((i,ix)=>{const x=ccDoItem(i,solDe(p.solicitacao_id));return `<tr><td class="c">${ix+1}</td><td>${E(i.nome)}${x.cc||x.nat?'<span class="ref">'+E([ccNome(x.cc),natNome(x.nat)].filter(Boolean).join(' · '))+'</span>':''}</td><td class="n">${fq(i.qtd)}</td><td class="c">${E(i.unidade||'')}</td><td class="n">${brl(i.preco_unit)}</td><td class="n">${brl(num(i.preco_unit)*num(i.qtd))}</td></tr>`;}).join('')}
      ${p.frete?`<tr><td colspan="5" class="n">Frete</td><td class="n">${brl(p.frete)}</td></tr>`:''}<tr class="tot"><td colspan="5" class="n">TOTAL</td><td class="n">${brl(p.valor_total)}</td></tr></table>
    ${await assinPDF(p.solicitacao_id,{nome:compradorDe(p)||('Almoxarifado — '+nomeCurto(p.comprador)),img:p.assinatura_comprador,quando:p.data},{nome:p.ratificado_por||p.aprovado_por,img:p.assinatura_gerente,quando:p.ratificado_em||p.aprovado_em})}`;
  janela('Compra '+pad4(p.numero),corpo,false);
}

/* ═══════════════ MODAIS SIMPLES ═══════════════ */
function txtModal(tit,corpo,botoes){
  document.getElementById('txt-tit').textContent=tit; document.getElementById('txt-corpo').innerHTML=corpo;
  const pe=document.getElementById('txt-pe'); pe.innerHTML='<button class="btn btn-secondary" onclick="closeModal(\'m-txt\')">Fechar</button>';
  (botoes||[]).forEach(([t,fn])=>{const b=document.createElement('button');b.className='btn btn-primary';b.textContent=t;b.onclick=fn;pe.appendChild(b);});
  document.getElementById('m-txt').classList.remove('hidden');
}
function confirmar(msg,fn){txtModal('Confirmar',`<p style="font-size:14px;color:#475569;line-height:1.6;">${msg}</p>`,[['Confirmar',async()=>{closeModal('m-txt');await fn();}]]);}

/* ═══════════════ INÍCIO ═══════════════ */
(async()=>{
  if(!getUser()){location.href='index.html';return;}
  fetch('partials/sidebar.html').then(r=>r.text()).then(h=>{document.getElementById('sidebar-container').innerHTML=h;document.querySelector('[href="compras.html"]')?.classList.add('active');if(typeof openGroup==='function')openGroup('compras');}).catch(e=>console.warn('[sidebar]',e));
  initSidebar('compras.html');
  document.getElementById('f-mes').value=hojeISO().slice(0,7);
  if(podeAprovar())document.getElementById('tab-aprov').style.display='';
  if(!podeComprar())document.getElementById('bt-novo-forn').style.display='none';
  carregarEmpresaPDF().catch(()=>{});
  if(!(await carregar()))return;
  document.getElementById('carregando').style.display='none';
  popularFiltros();
  try{history.replaceState({cp:'lista'},'');}catch(e){}
  const q=new URLSearchParams(location.search);
  const qa=q.get('aba'); aba(['fila','aprovacao','pedidos','gastos','fornecedores','precos','regras'].includes(qa)?qa:'fila');
  if(q.get('aprovar')&&podeAprovar()){const c=S.cots.find(x=>x.id===q.get('aprovar'));if(c)abrirAprovar(c.id);const p=S.peds.find(x=>x.id===q.get('aprovar'));if(p)abrirConfirmar(p.id);}
  else if(q.get('pedido')){const p=S.peds.find(x=>x.id===q.get('pedido'));if(p)abrirPed(p.id);}
})();
</script>
