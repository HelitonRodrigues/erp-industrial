<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Compras — ERP Industrial</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   COMPRAS (nov/2026, migrações 115 + 116) — layout novo:
   lista (indicadores · abas · esteira · tabela) e PÁGINAS internas (sem modal,
   sem painel lateral): solicitação, cotação/mapa, pedido, compra direta,
   aprovação, fornecedor, ler proposta. Só confirmação curta usa o modal do sistema.
   Centro de custo e natureza acompanham cada item: solicitação → cotação → pedido.
   ══════════════════════════════════════════════════════════════════════════ */
:root{--bi:#a9b8ca;--cl:#e3e9f0;--cs:#f1f5f9;--c2:#475569;--c3:#64748b;--c4:#94a3b8;--red:#dc2626;--redb:#fee2e2;--org:#b45309;--orgb:#fef3c7;--grn:#16a34a;--grnb:#dcfce7;--blu:#1d4ed8;--blub:#dbeafe;}
/* topo do módulo */
.cp-top{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.cp-top h1{font-size:22px;font-weight:800;color:var(--primary);text-transform:uppercase;margin:0}
.cp-top p{font-size:13px;color:var(--c3);margin-top:3px}
.cp-top .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* indicadores */
.kp-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kp{background:#fff;border:1px solid var(--cl);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;cursor:pointer;position:relative;overflow:hidden;font:inherit;text-align:left}
.kp:hover{box-shadow:0 2px 10px rgba(4,45,77,.1)}
.kp:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--primary)}
.kp .ic{width:42px;height:42px;border-radius:12px;background:#eef3f8;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 42px}
.kp b{display:block;font-size:26px;font-weight:800;color:var(--primary);line-height:1}
.kp span{font-size:12px;font-weight:700;color:var(--c2)}
.kp small{display:block;font-size:11px;color:var(--c3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp.r:before{background:var(--red)} .kp.r b{color:var(--red)} .kp.r .ic{background:var(--redb)}
.kp.o:before{background:#f59e0b} .kp.o b{color:var(--org)} .kp.o .ic{background:var(--orgb)}
.kp.b:before{background:#3b82f6} .kp.b .ic{background:var(--blub)}
/* abas */
.tabs{margin-bottom:16px;overflow-x:auto}
.tab-btn{white-space:nowrap}
.tab-btn .bd{background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:1px 7px;margin-left:6px;font-weight:800}
/* filtros */
.fbar{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--cl);border-radius:14px;padding:10px 12px;margin-bottom:14px;flex-wrap:wrap}
.fbar .fi{height:38px;padding:7px 11px;font-size:13px;width:auto;max-width:168px;border:1.5px solid var(--cl);border-radius:10px;font-family:inherit;background:#fff;color:var(--text)}
.fbar .fi.on{border-color:var(--grn);background:#f0fdf4;color:#166534;font-weight:700}
.fbar .busca{flex:1;min-width:150px;max-width:none}
.fbar .limpa{border:0;background:none;font:inherit;font-size:12.5px;font-weight:700;color:var(--c3);cursor:pointer;text-decoration:underline}
/* esteira */
.est{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#fff;border:1px solid var(--cl);border-radius:14px;overflow:hidden;margin-bottom:14px}
.est button{border:0;background:#fff;font:inherit;padding:12px 14px;text-align:left;cursor:pointer;border-right:1px solid var(--cl);position:relative}
.est button:last-child{border-right:0}
.est button:hover{background:#f8fafc}
.est button b{display:block;font-size:22px;font-weight:800;color:var(--primary);line-height:1.1}
.est button span{font-size:12px;font-weight:700;color:var(--c2)}
.est button small{display:block;font-size:11px;color:var(--c3);margin-top:2px}
.est button.on{background:#f0fdf4}
.est button.on:after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--grn)}
.est button.on span{color:#166534}
.est .al{color:var(--red);font-weight:800}
/* tabelas */
.tw{background:#fff;border:1px solid var(--cl);border-radius:14px;overflow:auto}
.tw table thead th:first-child,.tw table thead th:last-child{border-radius:0}
.tw td{vertical-align:middle}
.tw tr.clk{cursor:pointer}
.tw td.ac{white-space:nowrap;text-align:right}
.itn b{display:block;color:var(--primary);font-size:13px}
.itn small{color:var(--c3);font-size:11.5px}
.ccc b{display:block;font-size:12.5px;color:var(--text);font-weight:700;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccc small{display:block;font-size:11.5px;color:var(--c3);max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.falta{color:var(--red);font-weight:700;font-size:12px}
.vazio{text-align:center;color:var(--c4);font-size:13px;padding:28px 10px}
.pri{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap}
.p-urg{background:var(--redb);color:var(--red)}.p-alta{background:var(--orgb);color:var(--org)}.p-nor{background:var(--cs);color:var(--c2)}
.p-azul{background:var(--blub);color:var(--blu)}.p-ok{background:var(--grnb);color:#166534}
.dias{font-weight:800;white-space:nowrap}.dias.r{color:var(--red)}.dias.o{color:var(--org)}
.n{text-align:right!important;white-space:nowrap}
.ref{display:block;font-size:11px;color:var(--c3);font-weight:500}
/* botões */
.bx{display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:9px;padding:7px 12px;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;border:1.5px solid var(--cl);background:#fff;color:var(--primary);white-space:nowrap;text-decoration:none}
.bx:hover{border-color:var(--primary)}
.bx:disabled{opacity:.45;cursor:not-allowed}
.bx.em{background:#f59e0b;border-color:#f59e0b;color:#fff}
.bx.pr{background:var(--primary);border-color:var(--primary);color:var(--accent)}
.bx.ok{background:var(--grn);border-color:var(--grn);color:#fff}
.bx.red{color:var(--red);border-color:#fecaca}
.bx.org{color:var(--org);border-color:#fde68a}
.bx.lg{padding:11px 18px;font-size:14px;border-radius:11px}
.bx.full{width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:20px;border:1.5px solid var(--cl);background:#fff;color:var(--c2);cursor:pointer}
.chip.on{background:var(--grn);border-color:var(--grn);color:#fff}
/* página interna */
.crumb{font-size:12.5px;color:var(--c3);margin-bottom:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--primary);font-weight:700;text-decoration:none;cursor:pointer}
.crumb a:hover{text-decoration:underline}
.dt-h{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--cl);border-radius:14px;padding:16px 18px;margin-bottom:12px;flex-wrap:wrap}
.dt-h .back{width:40px;height:40px;border-radius:11px;border:1.5px solid var(--cl);background:#fff;font-size:18px;color:var(--primary);cursor:pointer;flex:0 0 40px}
.dt-h .back:hover{border-color:var(--primary)}
.dt-h .tt{min-width:0;flex:1}
.dt-h h2{font-size:20px;font-weight:800;color:var(--primary);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0}
.dt-h .m{font-size:12.5px;color:var(--c3);margin-top:3px}
.dt-h .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.stp{display:flex;background:#fff;border:1px solid var(--cl);border-radius:14px;padding:14px 10px 10px;margin-bottom:12px}
.st{flex:1;text-align:center;font-size:11.5px;color:var(--c4);font-weight:700;position:relative;min-width:0}
.st .b{width:30px;height:30px;border-radius:50%;margin:0 auto 6px;background:#e2e8f0;color:#fff;font-size:13px;line-height:30px;font-weight:900;position:relative;z-index:1}
.st small{display:block;font-size:10.5px;font-weight:600;color:var(--c3);margin-top:1px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.ok .b{background:var(--grn)}.st.ok{color:#166534}
.st.at .b{background:var(--primary);color:var(--accent);box-shadow:0 0 0 5px #d5e2ee}.st.at{color:var(--primary)}
.st.no .b{background:#f59e0b}.st.no{color:var(--org)}
.st.sk .b{background:#cbd5e1}
.st:after{content:'';position:absolute;top:15px;left:calc(50% + 17px);right:calc(-50% + 17px);height:3px;background:#e2e8f0;border-radius:2px}
.st:last-child:after{display:none}.st.ok:after{background:var(--grn)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;align-items:start}
.cx{background:#fff;border:1px solid var(--cl);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.cx h3{font-size:11.5px;font-weight:800;color:var(--c3);text-transform:uppercase;letter-spacing:.4px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cx h3 em{font-style:normal;text-transform:none;font-weight:700}
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{background:#f8fafc;color:var(--c3);font-size:10.5px;text-transform:uppercase;padding:9px 10px;text-align:left;border-bottom:1.5px solid var(--cl);white-space:nowrap}
.tb td{padding:10px;border-bottom:1px solid var(--cs);vertical-align:middle}
.tb tbody tr:nth-child(even){background:transparent}.tb tbody tr:hover{background:#fafcff}
.tb tr.clk{cursor:pointer}
.tb tfoot td{font-weight:800;color:var(--primary);border-bottom:0}
.big{font-size:28px;font-weight:800;color:var(--primary);line-height:1.1}
.tl-i{display:flex;gap:10px;position:relative;padding-bottom:14px}
.tl-i:before{content:'';position:absolute;left:10px;top:22px;bottom:0;width:2px;background:#e2e8f0}
.tl-i:last-child{padding-bottom:0}.tl-i:last-child:before{display:none}
.tl-i .d{width:22px;height:22px;border-radius:50%;flex:0 0 22px;background:#e2e8f0;color:#fff;font-size:11px;font-weight:900;text-align:center;line-height:22px;z-index:1}
.tl-i.ok .d{background:var(--grn)}.tl-i.at .d{background:var(--primary);color:var(--accent)}.tl-i.no .d{background:#f59e0b}.tl-i.skip .d{background:#cbd5e1}
.tl-i b{font-size:13px;color:var(--primary)}.tl-i.pend b,.tl-i.skip b{color:var(--c4)}
.tl-i .q{font-size:12px;color:var(--c2);font-weight:600}.tl-i .o{font-size:11.5px;color:var(--c3)}
.av{border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.45;margin-bottom:10px}
.av-ok{background:#f0fdf4;color:#14532d;border:1px solid #bbf7d0}.av-w{background:var(--orgb);color:#7c2d12;border:1px solid #fde68a}.av-r{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kv div{background:#f8fafc;border-radius:10px;padding:8px 10px;font-size:11px;color:var(--c3);font-weight:600;min-width:0}
.kv b{display:block;font-size:14px;color:var(--primary);margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.lin{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--cs);font-size:13px}
.lin:last-child{border-bottom:0}.lin span{color:var(--c3)}.lin b{color:var(--primary);text-align:right}
/* centro de custo / natureza */
.ccn{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.ccin{flex:1;min-width:150px;border:1.5px solid var(--cl);border-radius:8px;padding:5px 8px;font:inherit;font-size:11.5px;color:var(--c2);background:#fff}
.ccin.falta{border-color:#fca5a5;background:#fef2f2}
.ccro{font-size:11.5px;color:var(--c3);margin-top:2px;font-weight:500}
.ccro .falta{font-size:11.5px}
.bar{height:8px;border-radius:5px;background:var(--cs);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--primary);border-radius:5px}
/* mapa */
.rk{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:12px}
.rk-c{background:#fff;border:1.5px solid var(--cl);border-radius:14px;padding:12px 14px;position:relative}
.rk-c.clk{cursor:pointer}.rk-c.clk:hover{border-color:var(--primary)}
.rk-c.win{border-color:var(--grn);background:#f0fdf4}
.rk-c .pos{font-size:11px;font-weight:800;color:var(--c3);float:right;margin-left:6px}
.rk-c.win .pos{color:#166534}
.rk-c .nm{font-size:14.5px;font-weight:800;color:var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-c .vl{font-size:24px;font-weight:800;color:var(--primary);margin:4px 0}
.rk-c.win .vl{color:#166534}
.rk-c .mt{font-size:11.5px;color:var(--c3);display:flex;gap:10px;flex-wrap:wrap}
.rk-c .ac{display:flex;gap:6px;margin-top:9px}
.rk-c .ac button{border:1px solid var(--cl);background:#fff;border-radius:8px;font:inherit;font-size:11.5px;font-weight:700;padding:5px 9px;cursor:pointer;color:var(--primary)}
.mpx{overflow:auto;border:1px solid var(--cl);border-radius:14px;background:#fff;max-height:70vh}
table.mp{border-collapse:separate;border-spacing:0;font-size:13px;width:100%}
table.mp th{background:var(--primary);color:var(--accent);font-size:11px;text-transform:uppercase;padding:10px;text-align:center;white-space:nowrap;border-radius:0!important;position:sticky;top:0;z-index:3}
table.mp th small{display:block;font-size:10px;color:#a9c3d8;text-transform:none;font-weight:600;margin-top:2px}
table.mp th.fx,table.mp td.fx{position:sticky;left:0;text-align:left}
table.mp th.fx{z-index:4}
table.mp td.fx{background:#fff;border-right:1px solid var(--cl);z-index:2;min-width:250px;max-width:320px;white-space:normal}
table.mp .ccn{flex-direction:column;gap:4px} table.mp .ccin{min-width:0;width:100%}
table.mp th.f{min-width:140px}
table.mp th.f.win{background:#166534}
table.mp td{padding:9px 10px;border-bottom:1px solid var(--cs);text-align:center;white-space:nowrap}
table.mp td.c{border-left:1px solid var(--cs)}
table.mp tbody tr:nth-child(even){background:transparent}
table.mp tbody tr:hover{background:transparent}
table.mp input.pr{width:108px;border:1.5px solid var(--cl);border-radius:8px;padding:6px 9px;font:inherit;font-weight:800;text-align:right}
table.mp input.pr:focus{border-color:var(--primary);outline:none}
table.mp input.pr.best{border-color:#86efac;background:#f0fdf4;color:#166534}
table.mp input.pr.alto{border-color:#fca5a5;background:#fef2f2;color:#b91c1c}
table.mp span.ro{display:inline-block;min-width:100px;border:1.5px solid var(--cl);border-radius:8px;padding:5px 9px;font-weight:800;text-align:right}
table.mp span.ro.best{border-color:#86efac;background:#f0fdf4;color:#166534}
table.mp span.ro.alto{border-color:#fca5a5;background:#fef2f2;color:#b91c1c}
table.mp tr.rod td{background:#f8fafc;font-weight:700;color:var(--c2)}
table.mp tr.rod td.fx{background:#f8fafc;text-align:right}
table.mp tr.rod input{width:108px;border:1.5px solid var(--cl);border-radius:8px;padding:5px 8px;font:inherit;font-size:12.5px;text-align:right}
table.mp tr.tot td{background:#eef3f8;font-weight:900;font-size:14.5px;color:var(--primary);border-bottom:0}
table.mp tr.tot td.fx{background:#eef3f8;text-align:right}
table.mp tr.tot td.win{background:#dcfce7;color:#166534}
.dec .op{display:flex;gap:8px;align-items:flex-start;border:1.5px solid var(--cl);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-size:13px}
.dec .op.on{border-color:var(--grn);background:#f0fdf4}
.dec .op b{color:var(--primary)} .dec .op small{display:block;color:var(--c3);font-size:11.5px}
.dec .op select{margin-top:6px;width:100%;border:1.5px solid var(--cl);border-radius:8px;padding:6px 8px;font:inherit;font-size:12.5px}
.dec .tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--cl);padding-top:10px;margin-top:6px}
.lbl{font-size:11.5px;font-weight:800;color:var(--c3);text-transform:uppercase;margin:12px 0 5px}
.ta{width:100%;border:1.5px solid var(--cl);border-radius:10px;padding:8px 10px;font:inherit;font-size:12.5px;resize:vertical}
/* formulários da página */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg .form-group{margin:0}
.fx-in{width:100%;border:1.5px solid var(--cl);border-radius:10px;padding:9px 11px;font:inherit;font-size:13px}
.mot{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mot button{border:1.5px solid var(--cl);border-radius:12px;padding:12px;font:inherit;font-size:13px;font-weight:800;color:var(--c2);background:#fff;cursor:pointer;text-align:left}
.mot button.on{border-color:#f59e0b;background:#fffbeb;color:var(--org)}
/* ler proposta */
.imp-drop{border:2px dashed #cbd5e1;border-radius:14px;padding:26px;text-align:center;color:var(--c3);font-size:13px;background:#fafcff}
.imp-drop.on{border-color:var(--primary);background:#f0f7ff}
.cf-row .txt{font-family:monospace;font-size:11px;color:var(--c2);max-width:420px;white-space:normal}
.cf-st{font-size:16px}
.cf-row select,.cf-row input{font:inherit;font-size:12.5px;border:1.5px solid var(--cl);border-radius:8px;padding:5px 7px}
.cf-row input{width:100px;text-align:right}
.imp-pe{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
/* aprovação */
.ap-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.ap-c{background:#fff;border:1.5px solid var(--cl);border-radius:14px;padding:14px 16px;cursor:pointer}
.ap-c:hover{border-color:var(--primary)} .ap-c.em{border-color:#fde68a;background:#fffbeb}
.ap-c .v{font-size:22px;font-weight:900;color:var(--primary);margin:4px 0}
.sec-t{font-size:12px;font-weight:800;color:var(--primary);text-transform:uppercase;margin:18px 0 8px}
.sec-t:first-child{margin-top:0}
/* ── ajuste fino: contraste, clique evidente, códigos, assinaturas ── */
.fx-in,.fbar .fi,.ccin,.ta,table.mp input.pr,table.mp tr.rod input,.cf-row select,.cf-row input,.dec .op select{border:1.5px solid var(--bi)!important;background:#fff;color:var(--text)}
.fx-in:focus,.fbar .fi:focus,.ccin:focus,.ta:focus,table.mp input:focus,.dec .op select:focus{outline:none;border-color:var(--primary)!important;box-shadow:0 0 0 3px rgba(4,45,77,.13)}
.fx-in:disabled{background:#f1f5f9;color:var(--c2)}
.fbar .fi.on{border-color:var(--grn)!important}
.form-label{font-weight:700;color:var(--c2)}
.dt-h .back{background:var(--primary);color:var(--accent);border:0;font-size:20px;font-weight:900;box-shadow:0 2px 6px rgba(4,45,77,.25)}
.dt-h .back:hover{background:#0e3b62;transform:translateX(-2px)}
.bx{border:1.5px solid #9fb0c4;box-shadow:0 1px 2px rgba(4,45,77,.1);transition:all .12s}
.bx:hover{border-color:var(--primary);background:#f0f6ff;transform:translateY(-1px);box-shadow:0 3px 8px rgba(4,45,77,.15)}
.bx.em:hover{background:#d97706;border-color:#d97706}.bx.pr:hover{background:#0e3b62;border-color:#0e3b62}.bx.ok:hover{background:#15803d;border-color:#15803d}
.bx.ic{padding:7px 9px;font-size:14px}
.kp{padding-bottom:24px;transition:all .12s}
.kp .go{position:absolute;right:12px;bottom:7px;font-size:11px;font-weight:800;color:var(--primary);opacity:.6}
.kp:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 6px 16px rgba(4,45,77,.14)}.kp:hover .go{opacity:1;text-decoration:underline}
.kp.g:before{background:var(--grn)} .kp.g b{color:#166534} .kp.g .ic{background:var(--grnb)}

<script src="js/qrcode.min.js"></script>
<script>
/* ═══════════════ BASE ═══════════════ */
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const A=s=>E(s).replace(/'/g,"\\'");
const N=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const num=v=>{const x=Number(v);return isFinite(x)?x:0;};
const brl=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fq=v=>{const n=Number(v)||0;return n.toLocaleString('pt-BR',{maximumFractionDigits:3});};
const fp=v=>v==null||v===''?'':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:4});
const pBR=t=>{t=String(t==null?'':t).trim().replace(/^R\$\s*/i,'');if(t==='')return null;if(/,/.test(t))t=t.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');const v=parseFloat(t);return isFinite(v)?v:null;};
const pad4=n=>String(n||0).padStart(4,'0');
const hojeISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const dBR=d=>d?String(d).slice(0,10).split('-').reverse().join('/'):'—';
const dhBR=d=>d?new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const diasDesde=d=>d?Math.max(0,Math.floor((Date.now()-new Date(String(d).length<=10?d+'T12:00:00':d).getTime())/86400000)):0;
const horasDesde=d=>d?Math.max(0,(Date.now()-new Date(d).getTime())/3600000):0;
const quem=()=>{const u=getUser();return (u&&(u.nome||u.email))||'—';};
const podeComprar=()=>isAdmin()||checkPerm('compras','edit')||checkPerm('compras','create');
const podeAprovar=()=>isAdmin()||checkPermTab('compras','aprovacao','aprovar');
const NAO_FECHADA=['aberta','aguardando_aprovacao','devolvida','aprovada_auto'];
const MOTIVOS={urgencia:'🔴 Máquina parada / urgência',unico:'🏷️ Fornecedor único',valor_pequeno:'🪙 Valor pequeno',contrato:'📄 Fornecedor com contrato'};
const PRIOR={urgente:{c:'urg',t:'URGENTE',o:3},alta:{c:'alta',t:'ALTA',o:2},normal:{c:'',t:'',o:1},baixa:{c:'',t:'',o:0}};
const prior=s=>PRIOR[(s&&s.prioridade)||'normal']||PRIOR.normal;
let S={sols:[],cots:[],peds:[],forn:[],cfg:{},alias:[],precos:{},ncs:[],ccs:[],nats:[]};
let _aba='fila',_pedFiltro='abertos';

/* ═══════════════ CARGA ═══════════════ */
function mesSel(){return document.getElementById('f-mes').value||hojeISO().slice(0,7);}
function faixaMes(){const m=mesSel();const [y,mm]=m.split('-').map(Number);const fim=new Date(y,mm,1);return {ini:m+'-01',fim:`${fim.getFullYear()}-${String(fim.getMonth()+1).padStart(2,'0')}-01`};}
async function carregar(){
  const {ini,fim}=faixaMes();
  const SOLC='id,numero,data,solicitante,centro_custo,prioridade,justificativa,status,origem,origem_id,origem_ref,equipamento,itens,aprovador,aprovado_em,created_at,atualizado_em,codigo,cancelado_motivo';
  const r=await Promise.all([
    db(_supabase.from('compras_solicitacoes').select(SOLC).in('status',['pendente','devolvida','aprovada','aguardando_cotacao','em_cotacao','em_pedido']).order('numero',{ascending:false}),'carregar solicitações'),
    db(_supabase.from('compras_cotacoes').select('*').in('status',NAO_FECHADA),'carregar cotações abertas'),
    db(_supabase.from('compras_cotacoes').select('*').gte('atualizado_em',ini).lt('atualizado_em',fim),'carregar cotações do mês'),
    db(_supabase.from('compras_pedidos').select('*').in('status',['emitido','aguardando_entrega','recebido_parcial']),'carregar pedidos abertos'),
    db(_supabase.from('compras_pedidos').select('*').or(`and(data.gte.${ini},data.lt.${fim}),and(atualizado_em.gte.${ini},atualizado_em.lt.${fim})`),'carregar pedidos do mês'),
    db(_supabase.from('almoxarifado_fornecedores').select('*').order('nome_fantasia'),'carregar fornecedores'),
    db(_supabase.from('empresa_config').select('id,compras_limite_emergencial,compras_prazo_ratificacao_h,compras_meta_emergencial_pct,compras_alerta_preco_pct').limit(1),'carregar regras'),
    db(_supabase.from('compras_aliases').select('*'),'carregar apelidos'),
    db(_supabase.from('compras_pedidos').select('data,fornecedor,itens,status,cotacao_id').neq('status','cancelado').order('data',{ascending:false}).limit(600),'carregar histórico de preços'),
  ]);
  if(r.some(x=>x.error)){document.getElementById('carregando').innerHTML='Não foi possível carregar o Compras. Veja o aviso acima.';return false;}
  const uniq=(a)=>{const m=new Map();a.forEach(x=>m.set(x.id,x));return [...m.values()];};
  S.sols=r[0].data||[];S.cots=uniq([...(r[1].data||[]),...(r[2].data||[])]);S.peds=uniq([...(r[3].data||[]),...(r[4].data||[])]);
  S.forn=r[5].data||[];S.cfg=(r[6].data&&r[6].data[0])||{};S.alias=r[7].data||[];
  // último preço pago por item (pedidos mais recentes primeiro)
  // preços pagos por item, do mais recente para o mais antigo (a referência ignora a própria compra)
  S.precos={};(r[8].data||[]).forEach(p=>(p.itens||[]).forEach(i=>{const pu=num(i.preco_unit);if(!(pu>0))return;const reg={preco:pu,fornecedor:p.fornecedor,data:p.data,cot:p.cotacao_id||null};
    [i.insumo_id,'n:'+N(i.nome)].filter(Boolean).forEach(k=>(S.precos[k]=S.precos[k]||[]).push(reg));}));
  // solicitações já atendidas/canceladas que ainda têm pedido ou cotação na tela (para os carimbos) + recebimentos dos pedidos
  const temSol=new Set(S.sols.map(x=>x.id));
  const faltam=[...new Set([...S.peds.map(p=>p.solicitacao_id),...S.cots.map(c=>c.solicitacao_id)].filter(id=>id&&!temSol.has(id)))];
  const pedIds=S.peds.map(p=>p.id);
  const r2=await Promise.all([
    faltam.length?db(_supabase.from('compras_solicitacoes').select(SOLC).in('id',faltam),'carregar solicitações dos pedidos'):{data:[]},
    db(_supabase.from('usuarios').select('nome,perfil'),'carregar usuários'),
    db(_supabase.from('perfis').select('id,codigo,nome,permissoes'),'carregar perfis'),
    db(_supabase.from('centros_custo').select('id,codigo,nome,status').order('nome'),'carregar centros de custo'),
    db(_supabase.from('naturezas_custo').select('id,codigo,nome,status,grupo').order('nome'),'carregar naturezas'),
    pedIds.length?db(_supabase.from('compras_recebimentos').select('id,pedido_id,numero,data,recebido_por,nota_fiscal,created_at').in('pedido_id',pedIds),'carregar recebimentos'):{data:[]},
  ]);
  S.solsX=r2[0].data||[]; S.users=r2[1].data||[]; S.perfis=r2[2].data||[]; S.ccs=r2[3].data||[]; S.nats=r2[4].data||[]; S.recs=r2[5].data||[];
  return true;
}
const cfg=k=>({limite:num(S.cfg.compras_limite_emergencial)||5000,horas:num(S.cfg.compras_prazo_ratificacao_h)||24,meta:num(S.cfg.compras_meta_emergencial_pct)||30,alerta:num(S.cfg.compras_alerta_preco_pct)||10}[k]);
const ultimo=(it,cotId)=>{const l=(it.insumo_id&&S.precos[it.insumo_id])||S.precos['n:'+N(it.nome)]||[];return l.find(x=>!cotId||x.cot!==cotId)||null;};
const fNome=id=>{const f=S.forn.find(x=>x.id===id);return f?(f.nome_fantasia||f.razao_social||'—'):'';};
const fornAtivos=()=>S.forn.filter(f=>!['bloqueado','inativo'].includes(f.status_homologacao));
const solDe=id=>S.sols.find(s=>s.id===id)||(S.solsX||[]).find(s=>s.id===id)||null;
const SOL_ABERTA=['aprovada','aguardando_cotacao','em_cotacao'];
// pedido que o almoxarifado lançou no recebimento (solicitacoes.html → "Receber" sem pedido): não passou pelo Compras
const viaReceb=p=>!!p&&!p.cotacao_id&&(/^Gerado no recebimento/i.test(p.obs||'')||/no recebimento/i.test(((p.historico||[])[0]||{}).obs||''));
const compradorDe=p=>(!p||viaReceb(p)||!ehComprador(p.comprador))?'':(p.comprador||'');   // almoxarife nunca é comprador
const recsDe=id=>(S.recs||[]).filter(r=>r.pedido_id===id).sort((a,b)=>String(a.data||a.created_at).localeCompare(String(b.data||b.created_at)));
const perguntou=p=>{if(!p||!p.emergencial||p.ratificado_em)return null;const h=(p.historico||[]).filter(x=>['questionado','resposta'].includes(x.acao));const u=h[h.length-1];return u&&u.acao==='questionado'?u:null;};
// cotação que perdeu o sentido: a solicitação já foi recebida/cancelada por outro caminho
function cotOrfa(c){if(!c||!NAO_FECHADA.includes(c.status))return null;const s=solDe(c.solicitacao_id);
  const outro=S.peds.find(p=>p.solicitacao_id===c.solicitacao_id&&p.status!=='cancelado'&&p.cotacao_id!==c.id);
  if(outro)return `A solicitação já tem a compra #${pad4(outro.numero)}${viaReceb(outro)?' (lançada pelo almoxarifado no recebimento)':''}.`;
  if(s&&s.status==='cancelada')return 'A solicitação foi cancelada'+(s.cancelado_motivo?': '+s.cancelado_motivo:'')+'.';
  if(s&&s.status==='atendida')return 'A solicitação já foi atendida.';
  return null;}
const cotDaSol=id=>S.cots.filter(c=>c.solicitacao_id===id&&NAO_FECHADA.includes(c.status)).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)))[0]||null;
const pedsDaSol=id=>S.peds.filter(p=>p.solicitacao_id===id&&p.status!=='cancelado');
const ccDe=s=>{const it=(s.itens||[])[0]||{};return s.centro_custo||it.centro_custo||'';};
const ccCurto=t=>String(t||'').replace(/^\d+\s*-\s*/,'').slice(0,26);
const itensTxt=(it,max)=>{it=it||[];max=max||2;return it.slice(0,max).map(i=>`${E(i.nome)} (${fq(i.quantidade!=null?i.quantidade:i.qtd)})`).join(' · ')+(it.length>max?` +${it.length-max}`:'');};

   Ficam em cada item (texto do cadastro: "101020100-M2 - MOINHO" / "201110600 - MANUTENCAO DE MAQUINAS").
   Na tela mostra só o nome; o código vai no "title". Pedido antigo sem CC → busca no item da solicitação. */
const ccLbl=c=>c?((c.codigo?c.codigo+'-':'')+c.nome):'';
const natLbl=n=>n?((n.codigo?n.codigo+' - ':'')+n.nome):'';
const ccCod=l=>{const m=String(l||'').match(/^(\d+)\s*-\s*(.*)$/);return m?{c:m[1],n:m[2].trim()}:{c:'',n:String(l||'').trim()};};
const natCod=l=>{const m=String(l||'').match(/^(\S+)\s+-\s+(.*)$/);return m?{c:m[1],n:m[2].trim()}:{c:'',n:String(l||'').trim()};};
const ccNome=l=>{const x=ccCod(l);return x.c?x.c+' · '+x.n:x.n;};      // texto com código (filtros, PDF)
const natNome=l=>{const x=natCod(l);return x.c?x.c+' · '+x.n:x.n;};
const ccHTML=l=>{if(!l)return '';const x=ccCod(l);return `${x.c?`<span class="cod">${E(x.c)}</span>`:''}${E(x.n)}`;};
const natHTML=l=>{if(!l)return '';const x=natCod(l);return `${x.c?`<span class="cod">${E(x.c)}</span>`:''}${E(x.n)}`;};
/* quem é comprador: perfil Comprador/ADM/SADM ou perfil com edição no Compras. Almoxarife nunca é comprador. */
function ehComprador(nome){
  if(!nome)return false; const u=(S.users||[]).find(x=>N(x.nome)===N(nome)); if(!u)return true;
  if(['SADM','ADM','CPR'].includes(u.perfil))return true;
  const p=(S.perfis||[]).find(x=>x.codigo===u.perfil||String(x.id)===String(u.perfil)); const c=p&&p.permissoes&&p.permissoes.compras;
  return !!(c&&c.view!==false&&(c.edit||c.create||Object.values(c.abas||{}).some(a=>a&&(a.edit||a.create))));
}
const quemCompra=p=>compradorDe(p)?nomeCurto(p.comprador):nomeCurto(p.comprador)+' (almoxarifado)';
function ccDoItem(i,s){
  let cc=(i&&i.centro_custo)||'', nat=(i&&i.natureza)||'';
  if((!cc||!nat)&&s){const m=(s.itens||[]).find(x=>(i.insumo_id&&x.insumo_id===i.insumo_id)||N(x.nome)===N(i.nome));if(m){cc=cc||m.centro_custo||'';nat=nat||m.natureza||'';}}
  if(!cc&&s&&s.centro_custo)cc=s.centro_custo;
  return {cc,nat};
}
function ccsDe(itens,s){const cc=new Set(),nat=new Set();(itens||[]).forEach(i=>{const x=ccDoItem(i,s);if(x.cc)cc.add(x.cc);if(x.nat)nat.add(x.nat);});return {cc:[...cc],nat:[...nat]};}
function ccCell(itens,s){

  return `<div class="ccc"><b title="${E(x.cc.join(' · '))}">${x.cc.length?ccHTML(x.cc[0])+mais(x.cc.length):'<span class="falta">sem centro de custo</span>'}</b>
    <small title="${E(x.nat.join(' · '))}">${x.nat.length?natHTML(x.nat[0])+mais(x.nat.length):'<span class="falta">sem natureza</span>'}</small></div>`;
}
const ccRO=i=>`<div class="ccro"><span title="Centro de custo">${i.centro_custo?ccHTML(i.centro_custo):'<span class="falta">sem centro de custo</span>'}</span><span title="Natureza">${i.natureza?natHTML(i.natureza):'<span class="falta">sem natureza</span>'}</span></div>`;
const ccEd=(i,fn)=>`<div class="ccn"><input class="ccin ${i.centro_custo?'':'falta'}" list="dl-cc" value="${E(i.centro_custo||'')}" placeholder="Centro de custo…" title="Centro de custo" onchange="${fn}('${i.k}','cc',this.value)"><input class="ccin ${i.natureza?'':'falta'}" list="dl-nat" value="${E(i.natureza||'')}" placeholder="Natureza…" title="Natureza" onchange="${fn}('${i.k}','nat',this.value)"></div>`;
function acharCad(lista,lbl,v){
  const q=N(v); if(!q)return null;
  return lista.find(c=>N(lbl(c))===q)||lista.find(c=>N(c.nome)===q)||lista.find(c=>c.codigo&&N(c.codigo)===q)||(()=>{const l=lista.filter(c=>N(lbl(c)).includes(q));return l.length===1?l[0]:null;})();
}
function aplicarCcNat(it,campo,v){
  v=String(v||'').trim();
  if(campo==='cc'){ if(!v){it.centro_custo='';it.centro_custo_id=null;return true;}
    const c=acharCad(S.ccs||[],ccLbl,v); if(!c){toast('Centro de custo não encontrado — escolha da lista.','warning');return false;} it.centro_custo=ccLbl(c); it.centro_custo_id=c.id; return true; }
  if(!v){it.natureza='';it.natureza_id=null;return true;}
  const n=acharCad(S.nats||[],natLbl,v); if(!n){toast('Natureza não encontrada — escolha da lista.','warning');return false;} it.natureza=natLbl(n); it.natureza_id=n.id; return true;
}
const semCcNat=itens=>(itens||[]).filter(i=>!i.centro_custo||!i.natureza);
function preencherVazios(itens){ // copia o CC/natureza do 1º item preenchido para os itens vazios
  const base=(itens||[]).find(i=>i.centro_custo&&i.natureza); if(!base)return 0; let n=0;
  itens.forEach(i=>{if(!i.centro_custo){i.centro_custo=base.centro_custo;i.centro_custo_id=base.centro_custo_id||null;n++;}if(!i.natureza){i.natureza=base.natureza;i.natureza_id=base.natureza_id||null;n++;}});
  return n;
}
/* rateio: quanto da compra cai em cada CC / natureza (preço escolhido × qtd) */
function rateioHTML(linhas){
  const por=(campo,nome)=>{const m={};let t=0;linhas.forEach(l=>{const k=l[campo]||'';m[k]=(m[k]||0)+l.v;t+=l.v;});
    return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin-bottom:7px;"><div style="display:flex;justify-content:space-between;gap:8px;font-size:12.5px;"><span title="${E(k)}" style="${k?'':'color:var(--red);font-weight:700;'}">${k?nome(k):'não informado'}</span><b style="color:var(--primary);white-space:nowrap;">${brl(v)}</b></div><div class="bar"><i style="width:${t?Math.max(2,Math.round(v/t*100)):0}%"></i></div></div>`).join('');};
  if(!linhas.length)return '<span class="ref">Sem preços ainda.</span>';
  return `<div class="lbl" style="margin-top:0;">Por centro de custo</div>${por('cc',ccHTML)}<div class="lbl">Por natureza</div>${por('nat',natHTML)}`;
}
function linhasRateioCot(c){
  const esc=c.escolha||{}, best=melhorPorItem(c), out=[];
  (c.itens||[]).forEach(i=>{let v=null;
    if(esc.modo==='item'){const b=best[i.k];if(b)v=b.v;}
    else if(esc.fornecedor_id){const p=(c.propostas||[]).find(x=>x.fornecedor_id===esc.fornecedor_id);const pv=p&&p.precos&&p.precos[i.k];if(pv!=null&&pv!=='')v=num(pv);}
    if(v!=null)out.push({cc:i.centro_custo||'',nat:i.natureza||'',v:v*num(i.qtd)});});
  return out;
}

const priTag=s=>{const p=(s&&s.prioridade)||'normal';return p==='urgente'?'<span class="pri p-urg">URGENTE</span>':p==='alta'?'<span class="pri p-alta">ALTA</span>':'<span class="pri p-nor">NORMAL</span>';};
const itensCel=(it)=>{it=it||[];const q=i=>fq(i.quantidade!=null?i.quantidade:i.qtd)+' '+String(i.unidade||'').replace(/^unidade$/i,'un');
  return `<div class="itl">${it.slice(0,3).map(i=>`<div class="il"><span class="q">${E(q(i))}</span><span class="nm">${E(i.nome)}</span></div>`).join('')}${it.length>3?`<div class="il mais2">+ ${it.length-3} ${it.length-3===1?'item':'itens'}</div>`:''}</div>`;};
const btnSol=id=>id?`<button class="bx ic" title="Ver a solicitação (documento com assinaturas)" onclick="event.stopPropagation();verSolicitacao('${id}')">📄</button>`:'';
const goCel='<td class="go">›</td>';
const tempo=h=>h<24?'há '+Math.max(1,Math.round(h))+' h':Math.floor(h/24)+(Math.floor(h/24)===1?' dia':' dias');

  document.getElementById('carregando').style.display='none';

  const atr=cols.pedido.filter(x=>atrasado(x.o)).length, dev=cols.cotando.filter(x=>x.o.status==='devolvida').length;
  const E5=[['comprar','1 · A comprar','necessidade aprovada'],['cotando','2 · Cotando',dev?`<span class="al">${dev} devolvida${dev>1?'s':''}</span>`:'montando o mapa'],['gerente','3 · Com o gerente','aguardando aprovação'],
    ['pedido','4 · Compra enviada',atr?`<span class="al">${atr} atrasado${atr>1?'s':''}</span>`:'esperando entrega'],['entregue','5 · Entregue em '+mes,'recebido no almoxarifado']];
  document.getElementById('est').innerHTML=E5.map(([k,t,d])=>`<button class="${_etapa===k?'on':''}" onclick="_etapa='${k}';renderTudo()"><b>${cols[k].length}</b><span>${t}</span><small>${d}</small><em class="go">ver ›</em></button>`).join('');
  const L=cols[_etapa].map(x=>x.o); const el=document.getElementById('fila-tab'); const pc=podeComprar();
  if(_etapa==='comprar'){

      return `<tr class="clk" onclick="abrirSol('${s.id}')"><td>${priTag(s)}</td><td><b>#${pad4(s.numero)}</b><span class="ref dias ${d>=7?'r':d>=3?'o':''}" title="Desde que a necessidade foi aprovada">${d?'há '+d+(d===1?' dia':' dias'):'chegou hoje'}</span></td><td>${itensCel(s.itens)}</td><td>${ccCell(s.itens,s)}</td><td>${E(nomeCurto(s.solicitante))}</td><td class="n"><b>${est.t?brl(est.t):'—'}</b><span class="ref">${est.falta?(est.t?est.falta+' sem preço ant.':'sem preço anterior'):'pelo último preço'}</span></td>
        <td class="ac" onclick="event.stopPropagation()">${btnSol(s.id)} ${pc?`<button class="bx" onclick="iniciarCotacao('${s.id}')">💬 Cotar</button> <button class="bx em" onclick="abrirDireto('${s.id}')">⚡ Comprar direto</button>`:''}</td>${goCel}</tr>`;}).join('')||`<tr><td colspan="9" class="vazio">Nada para comprar${fv().fb||fv().fcc||fv().fn?' com estes filtros':''}. ✅</td></tr>`}</tbody></table>`;
  }else if(_etapa==='cotando'||_etapa==='gerente'){

      return `<tr class="clk" onclick="abrirCot('${c.id}')"><td>${priTag(s)}</td><td><b>${c.tipo==='direta'?'⚡ Compra direta':'Cotação #'+pad4(c.numero)}</b><span class="ref">${s?'Solicitação #'+pad4(s.numero)+' · '+E(nomeCurto(s.solicitante)):''}</span>${orf?'<span class="pri p-urg">⚠ ENCERRAR</span>':c.status==='devolvida'?'<span class="pri p-alta">DEVOLVIDA</span>':''}</td>
        <td>${itensCel(c.itens)}</td><td>${ccCell(c.itens,s)}</td><td>${E(nomeCurto(c.comprador))}</td>
        <td>${ag?`<b style="color:var(--primary)">${brl(c.total)}</b><span class="ref">${c.tipo==='direta'?E((MOTIVOS[c.motivo_direto]||'').replace(/^\S+\s/,'')):props.length+' fornecedor'+(props.length===1?'':'es')}</span>`:props.length?`<b>${ok} de ${props.length}</b><span class="ref">com preço</span>`:'<span class="ref">sem fornecedor ainda</span>'}</td>
        <td><span class="dias ${horasDesde(ag?c.enviada_em:c.created_at)>=72?'o':''}">${tempo(horasDesde(ag?c.enviada_em:c.created_at))}</span></td>
        <td class="ac" onclick="event.stopPropagation()">${btnSol(c.solicitacao_id)} ${ag?(podeAprovar()?`<button class="bx ok" onclick="abrirAprovar('${c.id}')">✓ Decidir</button>`:`<button class="bx" onclick="abrirMapa('${c.id}')">👁️ Ver mapa</button>`):orf?`<button class="bx red" onclick="abrirCot('${c.id}')">Encerrar</button>`:(podeComprar()?`<button class="bx org ic" title="Voltar para A comprar (desfaz a cotação)" onclick="desistirCotacao('${c.id}')">↩</button> `:'')+(c.tipo==='direta'?`<button class="bx em" onclick="abrirDireto('${c.solicitacao_id}','${c.id}')">⚡ Continuar</button>`:`<button class="bx pr" onclick="abrirMapa('${c.id}')">📊 Abrir mapa</button>`)}</td>${goCel}</tr>`;}).join('')||'<tr><td colspan="9" class="vazio">Nenhuma compra nesta etapa.</td></tr>'}</tbody></table>`;
  }else{
    el.innerHTML=tabelaPedidos(L,_etapa==='entregue');

const ST_PED={emitido:['Enviado','p-azul'],aguardando_entrega:['Aguardando entrega','p-azul'],recebido_parcial:['Entrega parcial','p-alta'],recebido_total:['Entregue','p-ok'],cancelado:['Cancelado','p-nor']};
function tabelaPedidos(L,entregue){
  return `<table><thead><tr><th style="width:90px">Compra</th><th>Fornecedor</th><th>Itens</th><th>Centro de custo · Natureza</th><th>Comprador</th><th class="n">Valor</th><th>${entregue?'Recebido':'Entrega'}</th><th>Situação</th><th></th><th></th></tr></thead><tbody>${L.map(p=>{const s=solDe(p.solicitacao_id),vr=viaReceb(p),rc=recsDe(p.id).pop(),st=ST_PED[p.status]||[p.status,'p-nor'];
    return `<tr class="clk" onclick="abrirPed('${p.id}')"><td><b>#${pad4(p.numero)}</b><span class="ref">${dBR(p.data)}</span></td><td><b style="color:var(--primary)">${E(p.fornecedor||'')}</b>${p.emergencial?` <span class="pri p-alta">⚡${p.ratificado_em?'':' a confirmar'}</span>`:''}${perguntou(p)?' <span class="pri p-urg">❓ gerente perguntou</span>':''}</td>
      <td>${itensCel(p.itens)}</td><td>${ccCell(p.itens,s)}</td><td>${!compradorDe(p)?'<span class="pri p-nor">📥 Almoxarifado</span><span class="ref">'+E(nomeCurto(p.comprador))+(vr?' · no recebimento':'')+'</span>':E(nomeCurto(p.comprador))}</td><td class="n"><b>${brl(p.valor_total)}</b></td>
      <td style="${atrasado(p)?'color:var(--red);font-weight:800;':''}">${entregue?dBR((rc&&rc.data)||p.atualizado_em)+(rc&&rc.recebido_por?'<span class="ref">'+E(nomeCurto(rc.recebido_por))+'</span>':''):p.prazo_entrega?dBR(p.prazo_entrega)+(atrasado(p)?'<span class="ref" style="color:var(--red)">'+diasDesde(p.prazo_entrega)+' dias de atraso</span>':''):'—'}</td>
      <td><span class="pri ${st[1]}">${st[0]}</span></td><td class="ac" onclick="event.stopPropagation()">${btnSol(p.solicitacao_id)}</td>${goCel}</tr>`;}).join('')||'<tr><td colspan="10" class="vazio">Nenhuma compra.</td></tr>'}</tbody></table>`;
}

/* ═══════════════ STEPPER · CARIMBOS ═══════════════ */

/* ── CARIMBOS: quem fez cada etapa e quando ──────────────────────────────────
   1 Solicitado (setor) · 2 Necessidade aprovada (Solicitações) · 3 Cotação (comprador)
   4 Compra aprovada (gerente, aba Aprovação) · 5 Pedido · 6 Entregue (almoxarifado)  */
const ETAPAS=['Solicitado','Necessidade aprovada','Cotação','Compra aprovada','Compra enviada','Entregue'];
function etapas(s,c,peds){
  peds=(peds||[]).filter(p=>p&&p.status!=='cancelado');
  const p0=peds[0]||null, vr=peds.length&&peds.every(viaReceb), leg=peds.length&&!c&&!vr; // leg = pedido antigo, sem cotação
  const E6=[];
  E6.push(s?{st:'ok',quem:s.solicitante,quando:s.data,obs:[s.codigo?s.codigo+' em Solicitações':'',ccDe(s)?ccCurto(ccDe(s)):''].filter(Boolean).join(' · ')}:{st:'skip',obs:'compra sem solicitação vinculada'});
  E6.push(s&&s.aprovado_em?{st:'ok',quem:s.aprovador,quando:s.aprovado_em,obs:'gerente da área aprovou a necessidade (Solicitações)'}:s?{st:'at',obs:'aguardando aprovação em Solicitações'}:{st:'skip'});
  // 3 cotação
  if(vr)E6.push({st:'skip',obs:'sem cotação — '+nomeCurto(p0.comprador)+' (almoxarifado) comprou direto e lançou no recebimento'});
  else if(leg)E6.push({st:'ok',quem:quemCompra(p0),quando:p0.data,obs:'compra direta (sem cotação no sistema)'});
  else if(c){const env=c.enviada_em||['aprovada','aprovada_auto','reprovada'].includes(c.status);
    E6.push(env?{st:'ok',quem:c.comprador,quando:c.enviada_em||c.created_at,obs:c.tipo==='direta'?'⚡ compra direta · '+(MOTIVOS[c.motivo_direto]||'').replace(/^\S+\s/,''):'cotação #'+pad4(c.numero)+' · '+(c.propostas||[]).length+' fornecedor(es) · enviada ao gerente'}
      :{st:'at',quem:c.comprador,quando:c.created_at,obs:(c.status==='devolvida'?'devolvida pelo gerente — corrigir e reenviar':(c.tipo==='direta'?'compra direta em preparo':'cotando'))+' desde '+dBR(c.created_at)});}
  else E6.push({st:s&&s.aprovado_em?'at':'pend',obs:'aguardando o comprador cotar'});
  // 4 aprovação da compra (gerente)
  const em=peds.find(p=>p.emergencial);
  if(vr)E6.push({st:'skip',obs:'não passou pelo gerente do Compras'});
  else if(leg)E6.push(p0.aprovado_por?{st:'ok',quem:p0.aprovado_por,quando:p0.aprovado_em}:{st:'skip',obs:'compra antiga, sem aprovação registrada'});
  else if(em){E6.push(em.ratificado_em?{st:'ok',quem:em.ratificado_por,quando:em.ratificado_em,obs:'⚡ emergencial · gerente confirmou'}
      :{st:'at',quem:'⚡ liberada automática',quando:(em.historico||[])[0]&&em.historico[0].em,obs:'gerente confirma até '+dhBR(em.ratificar_ate)+(perguntou(em)?' · ❓ pediu explicação':'')});}
  else if(c&&c.status==='aprovada')E6.push({st:'ok',quem:c.aprovado_por,quando:c.aprovado_em,obs:c.decisao_obs||''});
  else if(c&&c.status==='reprovada')E6.push({st:'no',quem:c.aprovado_por,quando:c.aprovado_em,obs:'reprovada — '+(c.decisao_obs||'')});
  else if(c&&c.status==='aguardando_aprovacao')E6.push({st:'at',obs:'com o gerente desde '+dhBR(c.enviada_em)});
  else if(c&&c.status==='devolvida'){const h=(c.historico||[]).filter(x=>x.acao==='devolvida').pop();E6.push({st:'no',quem:h&&h.por,quando:h&&h.em,obs:'devolvida — '+(c.decisao_obs||'')});}
  else E6.push({st:'pend'});
  // 5 pedido
  E6.push(peds.length?{st:'ok',quem:quemCompra(p0),quando:p0.data,obs:peds.map(p=>'#'+pad4(p.numero)+' '+(p.fornecedor||'')+' · '+brl(p.valor_total)).join(' + ')+(vr?' · criado no recebimento':p0.emergencial?' · saiu na hora (emergencial)':p0.cotacao_id?' · gerado quando o gerente aprovou':'')}:{st:'pend'});
  // 6 entrega
  if(peds.length){const recs=peds.flatMap(p=>recsDe(p.id)), ult=recs[recs.length-1], tudo=peds.every(p=>p.status==='recebido_total'), alg=peds.some(p=>['recebido_total','recebido_parcial'].includes(p.status));
    const nfs=[...new Set(recs.map(r=>r.nota_fiscal).filter(Boolean))].join(', ');
    E6.push(tudo?{st:'ok',quem:ult&&ult.recebido_por,quando:ult?(ult.data||ult.created_at):null,obs:nfs?'NF '+nfs:''}
      :alg?{st:'at',quem:ult&&ult.recebido_por,quando:ult&&(ult.data||ult.created_at),obs:'entrega parcial'+(nfs?' · NF '+nfs:'')}
      :{st:'at',obs:atrasado(p0)?'atrasado — entrega era '+dBR(p0.prazo_entrega):p0.prazo_entrega?'previsto '+dBR(p0.prazo_entrega):'aguardando o fornecedor'});}
  else E6.push({st:'pend'});
  return E6;
}
function stepper(E6){
  const at=E6.findIndex(e=>!['ok','skip'].includes(e.st));
  const sub=e=>{const q=e.quem?nomeCurto(e.quem):'';const d=!e.quando?'':String(e.quando).length<=10?dBR(e.quando).slice(0,5):dhBR(e.quando).slice(0,5);return [q,d].filter(Boolean).join(' · ')||(e.st==='skip'?'não se aplica':'');};
  return `<div class="stp">${ETAPAS.map((t,i)=>{const e=E6[i];const cls=e.st==='ok'?'ok':e.st==='skip'?'sk':e.st==='no'?'no':i===at?'at':'';
    return `<div class="st ${cls}" title="${E(e.obs||'')}"><div class="b">${e.st==='ok'?'✓':e.st==='skip'?'–':e.st==='no'?'!':i+1}</div>${t}<small>${E(sub(e))||'&nbsp;'}</small></div>`;}).join('')}</div>`;
}
function carimbos(E6){
  const quando=d=>!d?'':String(d).length<=10?dBR(d):dhBR(d);
  return `<div class="cx"><h3>Carimbos — quem fez cada etapa</h3>${ETAPAS.map((t,i)=>{const e=E6[i];
    return `<div class="tl-i ${e.st}"><span class="d">${e.st==='ok'?'✓':e.st==='skip'?'–':e.st==='no'?'!':e.st==='at'?'●':i+1}</span><div><b>${t}</b>${e.quem||e.quando?` <span class="q">${E(e.quem||'')}${e.quem&&e.quando?' · ':''}${quando(e.quando)}</span>`:''}${e.obs?`<div class="o">${E(e.obs)}</div>`:''}</div></div>`;}).join('')}</div>`;
}
function estimativa(itens){let t=0,falta=0;(itens||[]).forEach(i=>{const u=ultimo(i);const q=num(i.quantidade!=null?i.quantidade:i.qtd);if(u)t+=u.preco*q;else if(num(i.custo_estimado))t+=num(i.custo_estimado);else falta++;});return {t,falta};}
function itensComPreco(itens,cotId,s){
  const un=u=>String(u||'').replace(/^unidade$/i,'un');
  return `<table class="tb tb-it"><thead><tr><th class="n" style="width:90px">Qtd</th><th>Item</th><th>Centro de custo</th><th>Natureza</th><th class="n">Último preço pago</th><th class="n">Estimativa</th></tr></thead><tbody>${(itens||[]).map(i=>{const u=ultimo(i,cotId);const q=i.quantidade!=null?i.quantidade:i.qtd;const x=ccDoItem(i,s);
    return `<tr><td class="n"><b>${fq(q)}</b> <span class="ref" style="display:inline">${E(un(i.unidade))}</span></td><td><b style="color:var(--primary)">${E(i.nome)}</b></td>
      <td>${x.cc?ccHTML(x.cc):'<span class="falta">não informado</span>'}</td><td>${x.nat?natHTML(x.nat):'<span class="falta">não informada</span>'}</td>
      <td class="n">${u?`<b>${brl(u.preco)}</b><span class="ref forn" title="${E(u.fornecedor||'')}">${E(u.fornecedor||'')} · ${dBR(u.data).slice(3)}</span>`:'<span class="ref">sem compra anterior</span>'}</td><td class="n"><b>${u?brl(u.preco*num(q)):'—'}</b></td></tr>`;}).join('')}</tbody></table>`;
}
/* assinaturas: solicitante e aprovador vêm do documento da solicitação; comprador e gerente da compra */
function assinCard(o){ // o:{solId, comprador:{nome,img,quando}, gerente:{nome,img,quando}}
  const id='ass-'+Math.random().toString(36).slice(2,8); setTimeout(()=>preencherAssin(id,o),0);
  return `<div class="cx"><h3>Assinaturas</h3><div class="ass-g" id="${id}"><div class="ref">Carregando…</div></div></div>`;
}
const assBox=(tit,nome,img,quando)=>`<div class="ass-c">${img?`<img src="${img}" alt="assinatura">`:'<div class="sem">aguardando</div>'}<b>${E(nomeCurto(nome)||'—')}</b><small>${E(tit)}${quando?' · '+(String(quando).length<=10?dBR(quando):dhBR(quando)):''}</small></div>`;
async function preencherAssin(id,o){
  const sn=o.solId?await getSnap(o.solId):null; const s=o.solId?solDe(o.solId):null; const el=document.getElementById(id); if(!el)return;
  el.innerHTML=assBox('Solicitante',(sn&&(sn.assin_nome||sn.responsavel_solic))||(s&&s.solicitante),sn&&sn.assinatura,s&&s.data)+assBox('Aprovou a necessidade',(sn&&sn.aprovado_por)||(s&&s.aprovador),sn&&sn.aprovador_assinatura,s&&s.aprovado_em)+
    assBox('Comprador',o.comprador&&o.comprador.nome,o.comprador&&o.comprador.img,o.comprador&&o.comprador.quando)+assBox('Gerente (compra)',o.gerente&&o.gerente.nome,o.gerente&&o.gerente.img,o.gerente&&o.gerente.quando);
}

/* ── página: solicitação ── */
function abrirSol(id){
  const s=solDe(id);if(!s)return; const d=diasDesde(s.aprovado_em||s.created_at), est=estimativa(s.itens), E6=etapas(s,null,[]), x=ccsDe(s.itens,s), pc=podeComprar();
  pagina(phead({crumb:[crumbFila('comprar'),['Solicitação #'+pad4(s.numero)]],titulo:'Solicitação #'+pad4(s.numero),tags:' '+priTag(s),
      sub:`${E(s.solicitante||'')}${s.codigo?' · '+E(s.codigo)+' em Solicitações':''}${s.aprovador?' · aprovada por '+E(nomeCurto(s.aprovador))+(s.aprovado_em?' em '+dBR(s.aprovado_em).slice(0,5):''):''} · ${d?'esperando há '+d+(d===1?' dia':' dias'):'chegou hoje'}`,
      acts:`<button class="bx" onclick="verSolicitacao('${s.id}')">📄 Ver solicitação</button>`+(pc?`<button class="bx red" onclick="cancelarSol('${s.id}')" title="Já resolvida, substituída ou não é mais necessária">🚫 Tirar da fila</button><button class="bx lg" onclick="iniciarCotacao('${s.id}')">💬 Cotar com fornecedores</button><button class="bx em lg" onclick="abrirDireto('${s.id}')">⚡ Comprar direto</button>`:'')})+
    stepper(E6)+
    `<div class="g2"><div>
      <div class="cx"><h3>Itens solicitados <em>${(s.itens||[]).length} ${(s.itens||[]).length===1?'item':'itens'}</em></h3>${itensComPreco(s.itens,null,s)}</div>
      ${s.justificativa||s.equipamento?`<div class="cx"><h3>Para que é</h3><div style="font-size:13.5px;line-height:1.5;">${E([s.equipamento,s.justificativa].filter(Boolean).join(' — '))}</div></div>`:''}
    </div><div>
      <div class="cx"><h3>Estimativa</h3><div class="big">${brl(est.t)}</div><span class="ref">pelo último preço pago${est.falta?' · '+est.falta+' item(ns) sem preço anterior':''}</span>
        <div class="av ${est.t<=cfg('limite')?'av-ok':'av-w'}" style="margin:10px 0 0;">${est.t<=cfg('limite')?`Abaixo do limite de <b>${brl(cfg('limite'))}</b>: se for máquina parada, pode sair como compra emergencial.`:`Acima do limite de <b>${brl(cfg('limite'))}</b>: mesmo urgente, a compra espera o gerente aprovar.`}</div>
        <div class="lbl">Centro de custo</div><div style="font-size:13px;font-weight:700;line-height:1.7;">${x.cc.map(ccHTML).join('<br>')||'<span class="falta">não informado</span>'}</div>
        <div class="lbl">Natureza</div><div style="font-size:13px;font-weight:700;line-height:1.7;">${x.nat.map(natHTML).join('<br>')||'<span class="falta">não informada</span>'}</div></div>
      ${carimbos(E6)}
      ${assinCard({solId:s.id})}
    </div></div>`);
}

/* ── página: cotação (resumo) ── */
function abrirCot(id){
  const c=S.cots.find(x=>x.id===id);if(!c)return; const s=solDe(c.solicitacao_id), ag=c.status==='aguardando_aprovacao', orf=cotOrfa(c), pc=podeComprar();
  const tots=totaisPorForn(c).sort((a,b)=>(b.completo-a.completo)||(a.total-b.total)), E6=etapas(s,c,S.peds.filter(p=>p.cotacao_id===c.id));
  const etapa=['aberta','devolvida'].includes(c.status)?'cotando':'gerente';
  const btn=orf?'':ag&&podeAprovar()?`<button class="bx ok lg" onclick="abrirAprovar('${c.id}')">✓ Decidir a compra</button>`:`<button class="bx ${c.tipo==='direta'&&!ag?'em':'pr'} lg" onclick="${c.tipo==='direta'&&!ag?`abrirDireto('${c.solicitacao_id}','${c.id}')`:`abrirMapa('${c.id}')`}">${ag?'👁️ Ver o mapa':c.tipo==='direta'?'⚡ Continuar':'📊 Abrir o mapa'}</button>`;
  pagina(phead({crumb:[crumbFila(etapa),...(s?[['Solicitação #'+pad4(s.numero),`abrirSol('${s.id}')`]]:[]),[c.tipo==='direta'?'Compra direta':'Cotação #'+pad4(c.numero)]],
      titulo:c.tipo==='direta'?'⚡ Compra direta':'Cotação #'+pad4(c.numero),tags:' '+(orf?'<span class="pri p-urg">⚠ ENCERRAR</span>':c.status==='devolvida'?'<span class="pri p-alta">DEVOLVIDA</span>':ag?'<span class="pri p-azul">COM O GERENTE</span>':'<span class="pri p-azul">COTANDO</span>'),
      sub:`${s?'Solicitação #'+pad4(s.numero)+' · '+E(s.solicitante||'')+' · ':''}comprador ${E(c.comprador||'—')} · aberta em ${dBR(c.data||c.created_at)}`,
      acts:`${s?`<button class="bx" onclick="verSolicitacao('${s.id}')">📄 Ver solicitação</button>`:''}<button class="bx" onclick="imprimirMapa('${c.id}')">🖨️ Mapa (PDF)</button>${pc&&orf?`<button class="bx red" onclick="desistirCotacao('${c.id}')">✕ Encerrar</button>`:pc&&!ag?`<button class="bx org" title="Desfazer a cotação: a solicitação volta para A comprar" onclick="desistirCotacao('${c.id}')">↩ Voltar para A comprar</button>`:''}${btn}`})+
    stepper(E6)+
    `<div class="g2"><div>
      ${orf?`<div class="av av-r">⚠ ${E(orf)} Esta cotação não vale mais — encerre.</div>`:''}
      ${c.status==='devolvida'&&c.decisao_obs?`<div class="av av-w">↩ <b>O gerente devolveu:</b> ${E(c.decisao_obs)}</div>`:''}
      <div class="cx"><h3>${c.tipo==='direta'?'Fornecedor':'Propostas'} <em>${tots.length} fornecedor${tots.length===1?'':'es'}</em></h3>${tots.length?`<table class="tb"><thead><tr><th>Fornecedor</th><th>Itens com preço</th><th class="n">Total</th></tr></thead><tbody>${tots.map((t,ix)=>`<tr><td><b style="color:var(--primary)">${E(t.nome)}</b>${ix===0&&t.completo&&tots.length>1?' <span class="pri p-ok">MENOR</span>':''}</td><td>${t.completo?'todos':'<span class="falta">faltam '+t.faltam+'</span>'}</td><td class="n"><b>${brl(t.total)}</b></td></tr>`).join('')}</tbody></table>`:'<span class="ref">Nenhum fornecedor ainda — abra o mapa e adicione.</span>'}
        ${c.tipo==='direta'&&c.motivo_direto?`<div class="ref" style="margin-top:8px;">Motivo: ${E(MOTIVOS[c.motivo_direto]||c.motivo_direto)}</div>`:''}</div>
      <div class="cx"><h3>Itens</h3>${itensComPreco(c.itens,c.id,s)}</div>
    </div><div>
      <div class="cx"><h3>${ag?'Total enviado ao gerente':'Total escolhido até agora'}</h3><div class="big">${brl(c.total||totalEscolha({...c,escolha:c.escolha||{modo:'fornecedor'},propostas:c.propostas||[]}).total)}</div>
        <div class="lbl">Rateio</div>${rateioHTML(linhasRateioCot({...c,escolha:c.escolha||{},propostas:c.propostas||[]}))}</div>
      ${carimbos(E6)}
      ${assinCard({solId:c.solicitacao_id,comprador:{nome:c.comprador,img:c.assinatura_comprador,quando:c.enviada_em},gerente:{nome:c.aprovado_por,img:c.assinatura_gerente,quando:c.aprovado_em}})}
    </div></div>`);
}

/* ── página: compra ── */
function abrirPed(id){
  const p=S.peds.find(x=>x.id===id);if(!p)return; const s=solDe(p.solicitacao_id), c=p.cotacao_id?S.cots.find(x=>x.id===p.cotacao_id):null, f=S.forn.find(x=>x.id===p.fornecedor_id)||{};
  const conf=p.emergencial&&!p.ratificado_em, vr=viaReceb(p), pg=perguntou(p), pc=podeComprar();
  const irmaos=p.solicitacao_id?S.peds.filter(x=>x.solicitacao_id===p.solicitacao_id&&(c?x.cotacao_id===c.id:x.id===p.id)):[p];
  const E6=etapas(s,c,irmaos.length?irmaos:[p]), st=ST_PED[p.status]||[p.status,'p-nor'];
  const lin=(p.itens||[]).map(i=>{const x=ccDoItem(i,s);return {cc:x.cc,nat:x.nat,v:num(i.preco_unit)*num(i.qtd)};});
  pagina(phead({crumb:[p.status==='recebido_total'?crumbFila('entregue'):['Compras feitas',"aba('pedidos')"],['Compra #'+pad4(p.numero)]],
      titulo:'Compra #'+pad4(p.numero),tags:` <span class="pri ${st[1]}">${st[0].toUpperCase()}</span>${vr?' <span class="pri p-nor">📥 ALMOXARIFADO</span>':''}${p.emergencial?' <span class="pri p-alta">⚡ EMERGENCIAL</span>':''}${atrasado(p)?' <span class="pri p-urg">ATRASADO</span>':''}`,
      sub:`${E(p.fornecedor||'')} · ${dBR(p.data)}${s?' · Solicitação #'+pad4(s.numero)+' · '+E(nomeCurto(s.solicitante)):''} · ${compradorDe(p)?'comprador '+E(p.comprador):'lançada pelo almoxarifado ('+E(nomeCurto(p.comprador))+')'+(vr?' no recebimento':'')}`,
      acts:`${s?`<button class="bx" onclick="verSolicitacao('${s.id}')">📄 Ver solicitação</button>`:''}<button class="bx" onclick="imprimirPedido('${p.id}')">🖨️ Compra (PDF)</button>${vr?'':`<button class="bx" onclick="enviarPedidoForn('${p.id}')">📤 Enviar ao fornecedor</button>`}
        ${pc&&!vr&&['emitido','aguardando_entrega'].includes(p.status)&&!(p.itens||[]).some(i=>num(i.qtd_recebida)>0)?`<button class="bx red" onclick="cancelarPedido('${p.id}')">Cancelar compra</button>`:''}
        ${pg&&pc?`<button class="bx pr lg" onclick="responderGerente('${p.id}')">💬 Responder ao gerente</button>`:''}`})+
    stepper(E6)+
    `<div class="g2"><div>
      ${pg?`<div class="av av-r">❓ <b>${E(nomeCurto(pg.por))} perguntou:</b> ${E(pg.obs||'')}</div>`:conf?`<div class="av av-w">⚡ Saiu como emergencial. O gerente confirma até ${dhBR(p.ratificar_ate)}.</div>`:''}
      ${vr?`<div class="av av-w">📥 Esta compra nasceu no recebimento (Solicitações): o almoxarifado comprou direto, sem cotação e sem aprovação de compra.</div>`:''}
      <div class="cx"><h3>Itens <em>${(p.itens||[]).length}</em></h3><table class="tb tb-it"><thead><tr><th class="n">Qtd</th><th>Item</th><th>Centro de custo</th><th>Natureza</th><th class="n">Recebido</th><th class="n">Preço un.</th><th class="n">Total</th></tr></thead><tbody>
        ${(p.itens||[]).map(i=>{const x=ccDoItem(i,s);return `<tr><td class="n"><b>${fq(i.qtd)}</b> <span class="ref" style="display:inline">${E(String(i.unidade||'').replace(/^unidade$/i,'un'))}</span></td><td><b style="color:var(--primary)">${E(i.nome)}</b></td><td>${x.cc?ccHTML(x.cc):'<span class="falta">não informado</span>'}</td><td>${x.nat?natHTML(x.nat):'<span class="falta">não informada</span>'}</td><td class="n" style="${num(i.qtd_recebida)>=num(i.qtd)?'color:var(--grn);font-weight:800;':''}">${fq(i.qtd_recebida||0)}</td><td class="n">${brl(i.preco_unit)}</td><td class="n"><b>${brl(num(i.preco_unit)*num(i.qtd))}</b></td></tr>`;}).join('')}
        </tbody>${p.frete?`<tfoot><tr><td colspan="6" class="n">Frete</td><td class="n">${brl(p.frete)}</td></tr></tfoot>`:''}</table></div>
      <div class="cx"><h3>Histórico da compra</h3><div style="font-size:12.5px;color:var(--c2);line-height:1.8;">${(p.historico||[]).map(h=>`<b>${dhBR(h.em)}</b> · ${E(h.acao||'')} · ${E(h.por||'')}${h.obs?' — '+E(h.obs):''}`).join('<br>')||'—'}</div></div>
    </div><div>
      <div class="cx"><h3>Valores</h3><div class="big">${brl(p.valor_total)}</div>
        <div style="margin-top:8px;"><div class="lin"><span>Entrega</span><b style="${atrasado(p)?'color:var(--red)':''}">${p.prazo_entrega?dBR(p.prazo_entrega):'—'}</b></div><div class="lin"><span>Pagamento</span><b>${E(p.condicao_pagamento||'—')}</b></div><div class="lin"><span>Frete</span><b>${p.frete?brl(p.frete):'—'}</b></div>
        <div class="lin"><span>Fornecedor</span><b>${E(p.fornecedor||'')}${f.fone?'<span class="ref">'+E(f.fone)+'</span>':''}</b></div></div>
        <div class="lbl">Rateio</div>${rateioHTML(lin)}</div>
      ${carimbos(E6)}
      ${assinCard({solId:p.solicitacao_id,comprador:compradorDe(p)?{nome:p.comprador,img:p.assinatura_comprador,quando:p.data}:{nome:'— (almoxarifado)'},gerente:{nome:p.ratificado_por||p.aprovado_por,img:p.assinatura_gerente,quando:p.ratificado_em||p.aprovado_em}})}
    </div></div>`);
}

/* ═══════════════ ESCOLHER FORNECEDOR (busca na própria página) ═══════════════
   modo 'multi' = mapa da cotação (marca vários e adiciona); modo 'um' = compra direta (clica e escolhe).
   Ordem: quem já vendeu estes itens ⭐ → quem mais vendeu para a fábrica → nome. */
let _fp=null;   // {modo, sel:Set, q}
function fpItens(){return _fp&&_fp.modo==='um'?(_dir?_dir.itens:[]):(_mp?_mp.itens:[]);}
function fpCandidatos(){
  const ja=new Set(_fp.modo==='multi'&&_mp?_mp.propostas.map(p=>p.fornecedor_id):[]);
  const vend={}; fpItens().forEach(i=>{const l=(i.insumo_id&&S.precos[i.insumo_id])||S.precos['n:'+N(i.nome)]||[];l.forEach(r=>{const f=S.forn.find(x=>N(x.nome_fantasia||x.razao_social)===N(r.fornecedor));if(f){vend[f.id]=vend[f.id]||{n:0,ult:null};vend[f.id].n++;if(!vend[f.id].ult||r.data>vend[f.id].ult.data)vend[f.id].ult=r;}});});
  const nPed={}; S.peds.forEach(p=>{if(p.fornecedor_id&&p.status!=='cancelado')nPed[p.fornecedor_id]=(nPed[p.fornecedor_id]||0)+1;});
  const q=N(_fp.q);
  return fornAtivos().filter(f=>!q||N([f.nome_fantasia,f.razao_social,f.categoria,f.cnpj,f.endereco].join(' ')).includes(q))
    .map(f=>({f,ja:ja.has(f.id),v:vend[f.id]||null,n:nPed[f.id]||0}))
    .sort((a,b)=>(!!b.v-!!a.v)||(b.n-a.n)||String(a.f.nome_fantasia||a.f.razao_social).localeCompare(String(b.f.nome_fantasia||b.f.razao_social)));
}
function fpLinhas(){
  const L=fpCandidatos();
  return L.map(({f,ja,v,n})=>{const on=_fp.sel.has(f.id), nome=f.nome_fantasia||f.razao_social;
    return `<div class="fp-row ${on?'on':''} ${ja?'ja':''}" onclick="${ja?'':`fpClique('${f.id}')`}">
      ${_fp.modo==='multi'?`<span class="ck">${on||ja?'✓':''}</span>`:'<span class="ck rd"></span>'}
      <div style="flex:1;min-width:0;"><b>${E(nome)}</b>${v?' <span class="pri p-ok">⭐ já vendeu estes itens</span>':''}${ja?' <span class="pri p-nor">já está na cotação</span>':''}
        <span class="ref">${E([f.categoria,f.endereco].filter(Boolean).join(' · ')||'sem categoria')}${v&&v.ult?' · último: '+brl(v.ult.preco)+' em '+dBR(v.ult.data):''}</span></div>
      <div class="n" style="font-size:12px;color:var(--c2);">${f.prazo_entrega?'⏱ '+f.prazo_entrega+(f.prazo_entrega==1?' dia':' dias'):''}${f.fone?'<span class="ref">'+E(f.fone)+'</span>':''}</div>
      <div class="n" style="min-width:74px;font-size:12px;color:var(--c3);">${n?n+(n===1?' compra':' compras'):'novo'}</div></div>`;}).join('')||'<div class="vazio">Nenhum fornecedor com esse nome. <a href="#" onclick="fpNovo();return false;">Cadastrar fornecedor novo</a></div>';
}
function fpHTML(){
  const multi=_fp.modo==='multi';
  return `<div class="cx fp" id="fp-box"><h3>${multi?'Adicionar fornecedores à cotação':'Escolha o fornecedor'} <em>${multi?'marque um ou vários':'clique no fornecedor'}</em></h3>
    <input class="fx-in" id="fp-q" placeholder="🔍 Digite o nome, categoria, cidade ou CNPJ…" value="${E(_fp.q||'')}" oninput="_fp.q=this.value;document.getElementById('fp-lista').innerHTML=fpLinhas();" autocomplete="off">
    <div class="fp-list" id="fp-lista">${fpLinhas()}</div>
    <div class="fp-pe"><a href="#" onclick="fpNovo();return false;">＋ Cadastrar fornecedor novo</a><span style="flex:1"></span>
      ${multi?`<button class="bx" onclick="_fp=null;renderMapa();">Cancelar</button><button class="bx pr" id="fp-ok" onclick="fpAdicionar()">${fpRotulo()}</button>`:(_dir&&_dir.fid?`<button class="bx" onclick="_fp=null;renderDireto();">Cancelar</button>`:'')}</div></div>`;
}
const fpRotulo=()=>_fp.sel.size?`＋ Adicionar ${_fp.sel.size} fornecedor${_fp.sel.size>1?'es':''}`:'Marque os fornecedores';
function fpClique(id){
  if(_fp.modo==='um'){_fp=null;escolherFornDirId(id);return;}
  _fp.sel.has(id)?_fp.sel.delete(id):_fp.sel.add(id);
  document.getElementById('fp-lista').innerHTML=fpLinhas(); const b=document.getElementById('fp-ok'); if(b)b.textContent=fpRotulo();
}
function fpAdicionar(){
  if(!_fp.sel.size)return toast('Marque ao menos um fornecedor.','warning');
  _fp.sel.forEach(id=>{const f=S.forn.find(x=>x.id===id);if(!f||_mp.propostas.some(p=>p.fornecedor_id===id))return;
    _mp.propostas.push({fornecedor_id:f.id,fornecedor:f.nome_fantasia||f.razao_social,precos:{},frete:null,prazo_dias:f.prazo_entrega||null,pagamento:f.prazo_pagamento||null,origem:'manual',anexos:[]});});
  const n=_fp.sel.size; _fp=null; renderMapa(); toast(n+' fornecedor(es) na cotação. Agora lance os preços ou use 📎 Ler proposta.');
}
function fpNovo(){const m=_fp&&_fp.modo;_fp=null;abrirFornecedor(null,m==='um'?'dir':'mapa');}
function addFornecedorMapa(){_fp={modo:'multi',sel:new Set(),q:''};renderMapa();setTimeout(()=>{const i=document.getElementById('fp-q');if(i){i.focus();i.scrollIntoView({block:'center',behavior:'smooth'});}},60);}
function escolherFornDirId(id){const f=S.forn.find(x=>x.id===id);if(!f)return;_dir.fid=f.id;if(_dir.prazo==null&&f.prazo_entrega)_dir.prazo=f.prazo_entrega;if(!_dir.pgto&&f.prazo_pagamento)_dir.pgto=f.prazo_pagamento;renderDireto();}

/* ═══════════════ DOCUMENTO DA SOLICITAÇÃO (igual ao PDF de Solicitações, com assinaturas) ═══════════════ */
S.snap={};
async function getSnap(solId){
  if(!solId)return null; if(S.snap[solId]!==undefined)return S.snap[solId];
  const {data}=await _supabase.from('compras_solicitacoes').select('snapshot').eq('id',solId).maybeSingle();
  S.snap[solId]=(data&&data.snapshot)||null; return S.snap[solId];
}
async function verSolicitacao(solId){
  const s=solDe(solId); if(!s)return; const sn=(await getSnap(solId))||{};
  const prods=(sn.produtos&&sn.produtos.length)?sn.produtos:(s.itens||[]).map(i=>({nome:i.nome,codigo:'',unidade:i.unidade,quantidade:i.quantidade,cc:i.centro_custo,natureza:i.natureza,obs:''}));
  const prL={urgente:'URGENTE',alta:'ALTA',normal:'NORMAL',baixa:'BAIXA'}, pr=sn.prioridade||s.prioridade||'normal';
  const prog=sn.programado==='data'&&sn.programado_data?'até '+dBR(sn.programado_data):sn.programado_dias?'em '+sn.programado_dias+' dias':'—';
  const box=(tit,nome,cargo,img)=>`<div class="ac">${img?`<img src="${img}">`:'<div class="ln"></div>'}<b>${E(nome||'—')}</b><small>${E(tit)}${cargo?' · '+E(cargo):''}</small></div>`;
  const corpo=`<div style="display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px;"><div style="font-size:16px;font-weight:800;">SOLICITAÇÃO DE COMPRAS ${E(sn.codigo||s.codigo||'')}</div><div style="font-size:9.5px;color:#64748b;text-align:right;">Compras #${pad4(s.numero)} · ${E(String(s.status||'').replace(/_/g,' '))}</div></div>
    <div class="g3"><div><small>Data</small><b>${dBR(sn.data||s.data)}</b></div><div><small>Solicitante</small><b>${E(sn.solicitante||s.solicitante||'—')}</b></div><div><small>Responsável</small><b>${E(sn.responsavel_solic||sn.assin_nome||s.solicitante||'—')}</b></div>
      <div><small>Prioridade</small><b>${prL[pr]||pr}</b></div><div><small>Programado para</small><b>${prog}</b></div><div><small>Aprovado por</small><b>${E(sn.aprovado_por||s.aprovador||'—')}</b></div></div>
    ${sn.obs||s.justificativa?`<div class="cmp"><small>Justificativa</small>${E(sn.obs||s.justificativa)}</div>`:''}
    ${sn.obs_aprovacao?`<div class="cmp"><small>Observação do aprovador</small>${E(sn.obs_aprovacao)}</div>`:''}
    <table style="margin-top:8px;"><tr><th>Código</th><th style="text-align:left;">Produto</th><th>Qtd</th><th>Unid.</th><th style="text-align:left;">Centro de custo</th><th style="text-align:left;">Natureza</th><th style="text-align:left;">Observação</th></tr>
      ${prods.map(p=>`<tr><td class="c" style="font-family:monospace;">${E(p.codigo||'—')}</td><td><b>${E(p.nome)}</b></td><td class="c">${fq(p.quantidade)}</td><td class="c">${E(p.unidade||'—')}</td><td>${E(p.cc||'—')}</td><td>${E(p.natureza||'—')}</td><td>${E(p.obs||'—')}</td></tr>`).join('')}</table>
    <div class="ass2">${box('Responsável da solicitação',sn.assin_nome||sn.responsavel_solic||s.solicitante,sn.assin_cargo,sn.assinatura)}${box('Aprovador',sn.aprovado_por||s.aprovador,sn.aprovador_cargo,sn.aprovador_assinatura)}</div>`;
  janela('Solicitação '+(sn.codigo||s.codigo||pad4(s.numero)),corpo,false);
}

/* ═══════════════ ASSINATURA DE PRÓPRIO PUNHO (padAssinatura do utils.js) ═══════════════ */
async function assinarCompra(titulo,detalhe){
  if(typeof padAssinatura!=='function'){toast('Assinatura indisponível (atualize o utils.js).','danger');return null;}
  const u=getUser()||{}; const p=(S.perfis||[]).find(x=>x.codigo===u.perfil||String(x.id)===String(u.perfil));
  return await padAssinatura({titulo,quem:quem(),funcao:(p&&p.nome)||u.perfil||'',detalhe});
}
async function assinPDF(solId,comp,ger){
  const sn=solId?await getSnap(solId):null, s=solId?solDe(solId):null;
  const bx=(tit,nome,img,q)=>`<div class="ac">${img?`<img src="${img}">`:'<div class="ln"></div>'}<b>${E(nome||'—')}</b><small>${E(tit)}${q?' · '+(String(q).length<=10?dBR(q):dhBR(q)):''}</small></div>`;
  return `<div class="ass4">${bx('Solicitante',(sn&&(sn.assin_nome||sn.responsavel_solic))||(s&&s.solicitante),sn&&sn.assinatura,s&&s.data)}${bx('Aprovou a necessidade',(sn&&sn.aprovado_por)||(s&&s.aprovador),sn&&sn.aprovador_assinatura,s&&s.aprovado_em)}${bx('Comprador',comp.nome,comp.img,comp.quando)}${bx('Gerente — compra',ger.nome,ger.img,ger.quando)}</div>`;
}

function responderGerente(id){
  const p=S.peds.find(x=>x.id===id);if(!p)return; const pg=perguntou(p);

function itensDaSol(s){return (s.itens||[]).map((i,ix)=>({k:'i'+ix,insumo_id:i.insumo_id||null,nome:i.nome,unidade:i.unidade||'un',qtd:num(i.quantidade!=null?i.quantidade:i.qtd),

async function proximoNumeroCot(){const {data}=await _supabase.from('compras_cotacoes').select('numero').order('numero',{ascending:false}).limit(1);return ((data&&data[0]&&num(data[0].numero))||0)+1;}
async function novaCotacao(s,tipo){

    escolha:{modo:'fornecedor'},historico:[{acao:'aberta',por:quem(),em:new Date().toISOString()}],atualizado_em:new Date().toISOString()};
  const {data,error}=await db(_supabase.from('compras_cotacoes').insert(reg).select().single(),'abrir cotação'); if(error)return null;

async function iniciarCotacao(solId){

let _mp=null;   // cotação aberta no mapa (cópia de trabalho)
function totaisPorForn(c){
  return (c.propostas||[]).map(p=>{let t=0,faltam=0;(c.itens||[]).forEach(i=>{const v=p.precos&&p.precos[i.k];if(v==null||v==='')faltam++;else t+=num(v)*num(i.qtd);});
    return {id:p.fornecedor_id,nome:p.fornecedor||fNome(p.fornecedor_id),total:t+num(p.frete),itens:t,frete:num(p.frete),faltam,completo:!faltam&&(c.itens||[]).length>0};});
}
function melhorPorItem(c){const m={};(c.itens||[]).forEach(i=>{let best=null;(c.propostas||[]).forEach(p=>{const v=p.precos&&p.precos[i.k];if(v==null||v==='')return;if(!best||num(v)<best.v)best={v:num(v),f:p.fornecedor_id};});m[i.k]=best;});return m;}
function totalEscolha(c){
  const esc=c.escolha||{}, tots=totaisPorForn(c);
  if(esc.modo==='item'){const best=melhorPorItem(c);let t=0,falta=[];const fs=new Set();(c.itens||[]).forEach(i=>{const b=best[i.k];if(!b)falta.push(i.nome);else{t+=b.v*num(i.qtd);fs.add(b.f);}});
    fs.forEach(f=>{const p=(c.propostas||[]).find(x=>x.fornecedor_id===f);t+=num(p&&p.frete);});return {total:t,falta,forns:[...fs]};}
  const t=tots.find(x=>x.id===esc.fornecedor_id); if(!t)return {total:0,falta:['escolha o fornecedor'],forns:[]};
  const p=(c.propostas||[]).find(x=>x.fornecedor_id===esc.fornecedor_id);
  return {total:t.total,falta:(c.itens||[]).filter(i=>{const v=p.precos&&p.precos[i.k];return v==null||v==='';}).map(i=>i.nome),forns:[esc.fornecedor_id]};
}

async function linhasPdf(f){

function scoreItem(linha,item){

      const nb=(t.match(/\d{3,}/)||[])[0]; return nb&&(em.includes(nb)||emC.includes(nb))?0.75:0; }
    return em.some(l=>!temDig(l)&&(l===t||(l.length>=3&&t.startsWith(l))||(t.length>=3&&l.startsWith(t))))?1:0;};
  let peso=0,ok=0; it.forEach(t=>{const w=temDig(t)?3:1;peso+=w;ok+=w*achou(t,lt,lc);});

  _foEd=id?S.forn.find(f=>f.id===id):null; _foVolta=volta||null; const f=_foEd||{}; const pc=podeComprar();
  const voltaJs=_foVolta==='dir'?'renderDireto()':_foVolta==='mapa'?'voltarMapa()':"aba('fornecedores')";
  const pp=_foEd?S.peds.filter(p=>p.fornecedor_id===f.id&&p.status!=='cancelado').sort((a,b)=>(b.numero||0)-(a.numero||0)).slice(0,12):[];
  const inp=(id,lab,val,extra)=>`<div class="form-group"><label class="form-label">${lab}</label><input class="fx-in" id="${id}" value="${E(val==null?'':val)}" ${extra||''} ${pc?'':'disabled'}></div>`;
  pagina(phead({crumb:[['Fornecedores',"aba('fornecedores')"],[_foEd?E(f.nome_fantasia||f.razao_social):'Novo fornecedor']],volta:voltaJs,
      titulo:_foEd?E(f.nome_fantasia||f.razao_social):'Novo fornecedor',sub:_foEd?E([f.razao_social,f.cnpj].filter(Boolean).join(' · ')):'Cadastro usado no Compras e no Almoxarifado',
      acts:pc?`<button class="bx" onclick="${voltaJs}">Cancelar</button><button class="bx pr lg" onclick="salvarFornecedor()">💾 Salvar</button>`:''})+
    `<div class="g2"><div class="cx"><h3>Dados do fornecedor</h3><div class="fg">
      ${inp('fo-nome','Nome fantasia <span class="req">*</span>',f.nome_fantasia)}${inp('fo-razao','Razão social',f.razao_social)}
      ${inp('fo-cnpj','CNPJ',f.cnpj)}${inp('fo-cat','Categoria',f.categoria,'placeholder="peças, rolamentos, embalagem…"')}
      ${inp('fo-fone','Telefone / WhatsApp',f.fone)}${inp('fo-email','E-mail',f.email)}
      ${inp('fo-contato','Contato',f.contato)}<div class="form-group"><label class="form-label">Situação</label><select class="fx-in" id="fo-st" ${pc?'':'disabled'}>${[['aprovado','Homologado'],['em_analise','Em análise'],['bloqueado','Bloqueado'],['inativo','Inativo']].map(([v,t])=>`<option value="${v}" ${(f.status_homologacao||'aprovado')===v||(v==='aprovado'&&f.status_homologacao==='homologado')?'selected':''}>${t}</option>`).join('')}</select></div>
      ${inp('fo-prazo','Prazo de entrega (dias)',f.prazo_entrega,'type="number"')}${inp('fo-pgto','Condição de pagamento',f.prazo_pagamento)}</div>
      <div class="form-group" style="margin-top:12px;"><label class="form-label">Endereço / cidade</label><input class="fx-in" id="fo-end" value="${E(f.endereco||'')}" ${pc?'':'disabled'}></div>
      <div class="form-group" style="margin-top:12px;"><label class="form-label">Observações</label><textarea class="ta" id="fo-obs" rows="3" ${pc?'':'disabled'}>${E(f.obs||'')}</textarea></div></div>
    <div><div class="cx"><h3>Compras com este fornecedor</h3>${pp.length?`<table class="tb"><tbody>${pp.map(p=>`<tr class="clk" onclick="abrirPed('${p.id}')"><td><b>#${pad4(p.numero)}</b><span class="ref">${dBR(p.data)}</span></td><td class="n"><b>${brl(p.valor_total)}</b><span class="ref">${(ST_PED[p.status]||[p.status])[0]}</span></td></tr>`).join('')}</tbody></table>`:'<span class="ref">Nenhuma compra aberta ou do mês.</span>'}</div></div></div>`);
  setTimeout(()=>{const n=document.getElementById('fo-nome');if(n&&!_foEd)n.focus();},60);
}
async function salvarFornecedor(){
  if(!podeComprar())return toast('Sem permissão.','warning');
  const g=i=>document.getElementById(i).value.trim();
  const reg={nome_fantasia:g('fo-nome'),razao_social:g('fo-razao')||g('fo-nome'),cnpj:g('fo-cnpj')||null,categoria:g('fo-cat')||null,fone:g('fo-fone')||null,email:g('fo-email')||null,contato:g('fo-contato')||null,
    status_homologacao:g('fo-st'),prazo_entrega:parseInt(g('fo-prazo'))||null,prazo_pagamento:g('fo-pgto')||null,endereco:g('fo-end')||null,obs:g('fo-obs')||null,atualizado_em:new Date().toISOString()};
  if(!reg.nome_fantasia)return toast('Informe o nome.','warning');
  const q=_foEd?_supabase.from('almoxarifado_fornecedores').update(reg).eq('id',_foEd.id).select().single():_supabase.from('almoxarifado_fornecedores').insert(reg).select().single();
  const {data,error}=await db(q,'salvar fornecedor'); if(error)return;
  if(_foEd){const i=S.forn.findIndex(f=>f.id===data.id);S.forn[i]=data;}else S.forn.push(data);
  S.forn.sort((a,b)=>String(a.nome_fantasia||'').localeCompare(String(b.nome_fantasia||'')));
  toast('Fornecedor salvo.'); popularFiltros();
  if(_foVolta==='dir'&&_dir){_dir.fid=data.id;if(_dir.prazo==null&&data.prazo_entrega)_dir.prazo=data.prazo_entrega;if(!_dir.pgto&&data.prazo_pagamento)_dir.pgto=data.prazo_pagamento;renderDireto();return;}
  if(_foVolta==='mapa'&&_mp){if(!_mp.propostas.some(p=>p.fornecedor_id===data.id))_mp.propostas.push({fornecedor_id:data.id,fornecedor:data.nome_fantasia||data.razao_social,precos:{},frete:null,prazo_dias:data.prazo_entrega||null,pagamento:data.prazo_pagamento||null,origem:'manual',anexos:[]});renderMapa();return;}
  aba('fornecedores');
}

async function cancelarPedido(id){
  const p=S.peds.find(x=>x.id===id);if(!p)return;
  txtModal(`Cancelar a compra #${pad4(p.numero)}?`,`<div class="form-group"><label class="form-label">Motivo</label><input class="form-input" id="cp-mot"></div><div class="ref">A solicitação volta para "A comprar".</div>`,[['Cancelar compra',async()=>{
    const mot=document.getElementById('cp-mot').value.trim();if(!mot)return toast('Escreva o motivo.','warning');
    const r=await db(_supabase.from('compras_pedidos').update({status:'cancelado',atualizado_em:new Date().toISOString(),historico:[...(p.historico||[]),{acao:'cancelado',por:quem(),em:new Date().toISOString(),obs:mot}]}).eq('id',id),'cancelar pedido'); if(r.error)return;
    if(p.solicitacao_id&&!S.peds.some(x=>x.id!==id&&x.solicitacao_id===p.solicitacao_id&&x.status!=='cancelado'))await db(_supabase.from('compras_solicitacoes').update({status:'aprovada',atualizado_em:new Date().toISOString()}).eq('id',p.solicitacao_id),'voltar solicitação');
    addLog('UPDATE','COMPRAS','ped-'+p.numero,'Compra cancelada: '+mot).catch(()=>{});
    closeModal('m-txt');await carregar();popularFiltros();mostrarLista();toast('Compra cancelada.');}]]);
}

async function renderHistPrecos(){
  const q=N(document.getElementById('hp-q').value); const box=document.getElementById('hp-res'); if(q.length<3){box.innerHTML='<div class="ref">Digite ao menos 3 letras.</div>';return;}
  const {data,error}=await db(_supabase.from('compras_pedidos').select('numero,data,fornecedor,itens,status').neq('status','cancelado').order('data',{ascending:false}).limit(600),'histórico de preços'); if(error)return;
