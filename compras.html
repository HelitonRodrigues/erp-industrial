<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Compras — ERP Industrial</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   COMPRAS (nov/2026, migração 115) — enxuto: o comprador cota e compra,
   o gerente aprova, o almoxarifado (solicitacoes.html) recebe.
   Fila: A comprar → Cotando → Aguardando gerente → Pedido enviado → Entregue.
   Cotação em mapa (itens × fornecedores), proposta lida de PDF/foto/planilha/texto
   (sem IA: pdf.js + OCR Tesseract + SheetJS) com conferência e apelidos.
   ⚡ Compra direta: urgência até o limite sai na hora; gerente confirma depois.
   ══════════════════════════════════════════════════════════════════════════ */
:root{--cl:#e3e9f0;--cs:#f1f5f9;--c2:#475569;--c3:#64748b;--c4:#94a3b8;--red:#dc2626;--redb:#fee2e2;--org:#b45309;--orgb:#fef3c7;--grn:#16a34a;--grnb:#dcfce7;}
.cp-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px;}
.cp-head h1{margin:0;font-size:24px;font-weight:800;color:var(--primary);} .cp-head .sub{font-size:12.5px;color:var(--c3);}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;}
.kpi{border:1.5px solid var(--cl);border-radius:12px;padding:6px 14px;min-width:118px;background:#fff;cursor:pointer;text-align:left;font:inherit;}
.kpi b{display:block;font-size:21px;color:var(--primary);line-height:1.15;} .kpi span{font-size:11.5px;color:var(--c2);font-weight:700;}
.kpi.al b{color:var(--red);} .kpi.em{background:#fffbeb;border-color:#fde68a;} .kpi.em b{color:var(--org);}
.cp-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--cl);border-radius:12px;padding:8px 10px;margin-bottom:12px;}
.cp-bar .form-input{height:36px;padding:6px 10px;font-size:12.5px;width:auto;}
.cp-bar .busca{flex:1;min-width:170px;}
.seg{display:flex;gap:3px;background:var(--cs);padding:3px;border-radius:10px;margin-left:auto;}
.seg button{border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:800;color:var(--c3);padding:7px 13px;border-radius:8px;cursor:pointer;position:relative;}
.seg button.on{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.15);}
.seg .bd{background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:0 6px;margin-left:4px;}
/* quadro */
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px;}
.col{background:#eef2f7;border-radius:12px;padding:9px;display:flex;flex-direction:column;gap:7px;min-height:240px;}
.col h3{margin:0 0 2px;font-size:11.5px;color:var(--c2);text-transform:uppercase;letter-spacing:.3px;display:flex;justify-content:space-between;align-items:center;}
.col h3 i{font-style:normal;background:#fff;border-radius:20px;padding:0 8px;color:var(--primary);}
.cd{background:#fff;border-radius:10px;padding:8px 10px;border-left:4px solid #cbd5e1;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer;}
.cd:hover{box-shadow:0 2px 8px rgba(4,45,77,.15);} .cd.urg{border-left-color:var(--red);} .cd.alta{border-left-color:#f59e0b;}
.cd .l1{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;font-weight:800;color:var(--primary);}
.cd .it{font-size:12px;color:#1e293b;margin-top:3px;line-height:1.35;} .cd .l3{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--c3);margin-top:5px;}
.cd .val{font-weight:800;color:var(--primary);white-space:nowrap;}
.dias{font-weight:800;white-space:nowrap;} .dias.r{color:var(--red);} .dias.o{color:var(--org);}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:1px 7px;border-radius:10px;white-space:nowrap;}
.t-urg{background:var(--redb);color:var(--red);} .t-alta{background:var(--orgb);color:var(--org);} .t-em{background:var(--orgb);color:var(--org);}
.t-ok{background:var(--grnb);color:#166534;} .t-cin{background:var(--cs);color:var(--c2);} .t-azul{background:#dbeafe;color:#1d4ed8;}
.vazio{text-align:center;color:var(--c4);font-size:12px;padding:14px 4px;}
/* painel lateral */
.dw-bg{position:fixed;inset:0;background:rgba(3,32,54,.35);z-index:900;}
.dw{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);background:#fff;box-shadow:-8px 0 24px rgba(0,0,0,.2);z-index:901;display:flex;flex-direction:column;}
.dw-h{padding:14px 18px;border-bottom:1px solid var(--cl);} .dw-h h2{margin:0;font-size:17px;color:var(--primary);display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.dw-h .m{font-size:12px;color:var(--c3);margin-top:3px;} .dw-x{float:right;border:0;background:none;font-size:20px;color:var(--c4);cursor:pointer;}
.step{display:flex;padding:12px 14px 2px;}
.st{flex:1;text-align:center;font-size:10px;color:var(--c4);font-weight:700;position:relative;}
.st .b{width:22px;height:22px;border-radius:50%;margin:0 auto 4px;background:#e2e8f0;color:#fff;font-size:11px;line-height:22px;font-weight:900;position:relative;z-index:1;}
.st.ok .b{background:var(--grn);} .st.ok{color:#166534;} .st.at .b{background:var(--primary);box-shadow:0 0 0 4px #c7d7e6;} .st.at{color:var(--primary);}
.st:after{content:'';position:absolute;top:11px;left:calc(50% + 12px);right:calc(-50% + 12px);height:2px;background:#e2e8f0;} .st:last-child:after{display:none;} .st.ok:after{background:var(--grn);}
.dw-b{padding:10px 18px;flex:1;overflow:auto;}
.box{border:1px solid var(--cl);border-radius:10px;padding:9px 11px;margin-bottom:9px;font-size:12.5px;}
.box h4{margin:0 0 6px;font-size:10.5px;color:var(--c3);text-transform:uppercase;letter-spacing:.3px;}
.tb{width:100%;border-collapse:collapse;font-size:12.5px;} .tb td,.tb th{padding:5px 4px;border-bottom:1px solid var(--cs);text-align:left;vertical-align:top;} .tb th{font-size:10px;color:var(--c3);text-transform:uppercase;}
.n{text-align:right!important;white-space:nowrap;} .ref{display:block;font-size:10.5px;color:var(--c3);font-weight:500;}
.dw-f{padding:12px 18px;border-top:1px solid var(--cl);display:flex;gap:8px;flex-wrap:wrap;}
.bbig{flex:1;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:900;font-size:14.5px;cursor:pointer;background:var(--primary);color:var(--accent);}
.bbig.em{background:#f59e0b;color:#fff;} .bbig.ok{background:var(--grn);color:#fff;}
.bsec{border:1.5px solid var(--cl);background:#fff;border-radius:12px;padding:12px 14px;font:inherit;font-weight:800;color:var(--primary);font-size:13px;cursor:pointer;}
.bsec.red{color:var(--red);border-color:#fecaca;} .bsec.org{color:var(--org);}
/* mapa */
.mp-wrap{position:fixed;inset:0;background:#f6f8fb;z-index:950;display:flex;flex-direction:column;}
.mp-h{background:var(--primary);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.mp-h h2{margin:0;font-size:18px;} .mp-h .s{font-size:12px;color:#a9c3d8;}
.mp-h .bt{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:9px;padding:7px 12px;font:inherit;font-weight:700;font-size:12.5px;cursor:pointer;}
.mp-h .sp{margin-left:auto;}
.mp-aviso{margin:10px 18px 0;}
.mp-b{flex:1;overflow:auto;padding:12px 18px;}
table.mp{border-collapse:collapse;font-size:13px;background:#fff;min-width:100%;}
table.mp th{background:#f8fafc;color:var(--c2);font-size:10.5px;text-transform:uppercase;padding:8px;border-bottom:2px solid var(--cl);text-align:center;}
table.mp th.f{background:#fff;color:var(--primary);font-size:13px;text-transform:none;border-left:1px solid var(--cl);min-width:190px;vertical-align:top;}
table.mp th.f small{display:block;font-size:10.5px;color:var(--c3);font-weight:600;margin-top:2px;}
table.mp th.f .acs{display:flex;gap:4px;justify-content:center;margin-top:5px;flex-wrap:wrap;}
table.mp th.f .acs button{border:1px solid var(--cl);background:#fff;border-radius:7px;font:inherit;font-size:11px;font-weight:700;padding:3px 7px;cursor:pointer;color:var(--primary);}
table.mp th.f.win{background:#f0fdf4;border-top:4px solid var(--grn);}
table.mp td{padding:7px 8px;border-bottom:1px solid var(--cs);} table.mp td.c{text-align:center;border-left:1px solid var(--cl);}
table.mp input.pr{width:104px;border:1.5px solid var(--cl);border-radius:8px;padding:5px 8px;font:inherit;font-weight:800;text-align:right;}
table.mp input.pr:focus{border-color:var(--primary);outline:none;}
table.mp input.pr.best{border-color:#86efac;background:#f0fdf4;color:#166534;} table.mp input.pr.alto{border-color:#fca5a5;background:#fef2f2;color:#b91c1c;}
table.mp span.ro{display:inline-block;min-width:90px;border:1.5px solid var(--cl);border-radius:8px;padding:4px 8px;font-weight:800;text-align:right;}
table.mp span.ro.best{border-color:#86efac;background:#f0fdf4;color:#166534;} table.mp span.ro.alto{border-color:#fca5a5;background:#fef2f2;color:#b91c1c;}
table.mp tr.rod td{background:#f8fafc;font-weight:800;color:var(--primary);} table.mp tr.rod input{width:110px;border:1.5px solid var(--cl);border-radius:8px;padding:4px 7px;font:inherit;font-size:12px;}
table.mp tr.tot td{background:var(--primary);color:#fff;font-weight:900;font-size:14px;} table.mp tr.tot td.win{background:#166534;color:var(--accent);}
table.mp td.esc{text-align:center;} table.mp td.esc input{transform:scale(1.2);}
.mp-f{display:flex;gap:10px;padding:12px 18px;align-items:center;border-top:1px solid var(--cl);background:#fff;flex-wrap:wrap;}
.mp-f .modo{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:700;color:var(--c2);flex-wrap:wrap;}
.mp-f .just{flex:1;min-width:220px;}
/* importação */
.imp-drop{border:2px dashed #cbd5e1;border-radius:12px;padding:18px;text-align:center;color:var(--c3);font-size:13px;}
.imp-drop.on{border-color:var(--primary);background:#f0f7ff;}
.cf-row td{vertical-align:middle;} .cf-row .txt{font-family:monospace;font-size:11px;color:var(--c2);max-width:330px;}
.cf-st{font-size:16px;} .cf-row select,.cf-row input{font:inherit;font-size:12.5px;border:1.5px solid var(--cl);border-radius:8px;padding:5px 7px;}
.cf-row input{width:100px;text-align:right;}
/* motivos */
.mot{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.mot button{border:1.5px solid var(--cl);border-radius:10px;padding:10px;font:inherit;font-size:13px;font-weight:800;color:var(--c2);background:#fff;cursor:pointer;text-align:left;}
.mot button.on{border-color:#f59e0b;background:#fffbeb;color:var(--org);}
.av{border-radius:10px;padding:9px 12px;font-size:12.5px;margin-top:8px;line-height:1.45;}
.av-ok{background:#f0fdf4;color:#14532d;border:1px solid #bbf7d0;} .av-w{background:var(--orgb);color:#7c2d12;} .av-r{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;}
/* aprovação */
.ap-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;}
.ap-c{background:#fff;border:1.5px solid var(--cl);border-radius:14px;padding:12px 14px;cursor:pointer;}
.ap-c:hover{border-color:var(--primary);} .ap-c.em{border-color:#fde68a;background:#fffbeb;}
.ap-c .v{font-size:22px;font-weight:900;color:var(--primary);}
.hero{background:#fff;border:1px solid var(--cl);border-radius:14px;padding:12px 14px;}
.hero .f{font-size:12px;color:var(--c3);font-weight:700;} .hero .v{font-size:28px;font-weight:900;color:var(--primary);margin:2px 0;}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;} .mini3 div{background:#f8fafc;border-radius:9px;padding:6px 8px;font-size:11px;color:var(--c3);} .mini3 b{display:block;color:var(--primary);font-size:13px;}
.sec-t{font-size:12px;font-weight:800;color:var(--primary);text-transform:uppercase;margin:16px 0 8px;}
.card2{background:#fff;border:1px solid var(--cl);border-radius:14px;padding:14px;}
.tbl2{width:100%;border-collapse:collapse;font-size:13px;} .tbl2 th{text-align:left;font-size:10.5px;text-transform:uppercase;color:var(--c3);padding:8px;border-bottom:1.5px solid var(--cl);}
.tbl2 td{padding:8px;border-bottom:1px solid var(--cs);} .tbl2 tr.clk{cursor:pointer;} .tbl2 tr.clk:hover td{background:#f8fafc;}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.chip{font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px;border:1.5px solid var(--cl);background:#fff;color:var(--c3);cursor:pointer;}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff;}
@media(max-width:760px){ .kpis{margin-left:0;} .kpi{min-width:0;flex:1 1 40%;} .cp-bar .form-input{width:100%;} .seg{margin-left:0;overflow-x:auto;width:100%;} .seg button{white-space:nowrap;padding:7px 10px;} .board{grid-template-columns:repeat(5,82vw);} .mot{grid-template-columns:1fr;} }
@media print{ .sidebar,.topbar,#sidebar-container{display:none!important;} }
</style>
</head>
<body>
<div id="sidebar-container"></div>
<header class="topbar" id="topbar">
  <button class="topbar-open-sidebar" onclick="toggleSidebar()">☰</button>
  <div class="topbar-title">Compras</div>
  <div class="topbar-right">
    <div class="topbar-user">
      <div class="user-avatar" style="width:32px;height:32px;font-size:12px;" id="top-avatar">SA</div>
      <div><div class="topbar-user-name" id="top-user-name">Super Admin</div><div class="topbar-user-profile" id="top-user-perfil">SADM</div></div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()" style="color:#64748b;">Sair</button>
  </div>
</header>

<main class="main-content" id="main-content">
  <div class="cp-head">
    <div><h1>Compras</h1><div class="sub">o que eu tenho para fazer hoje</div></div>
    <div class="kpis" id="kpis"></div>
  </div>
  <div class="cp-bar">
    <input type="month" id="f-mes" class="form-input" title="Concluídos e cancelados deste mês (o que está aberto aparece sempre)" onchange="mudouMes()">
    <select id="f-comprador" class="form-input" onchange="renderTudo()"><option value="">Comprador: todos</option></select>
    <select id="f-forn" class="form-input" onchange="renderTudo()"><option value="">Fornecedor: todos</option></select>
    <input id="f-busca" class="form-input busca" placeholder="🔍 item, nº, solicitante, fornecedor…" oninput="renderTudo()">
    <div class="seg" id="seg">
      <button data-t="fila" class="on" onclick="aba('fila')">Fila</button>
      <button data-t="pedidos" onclick="aba('pedidos')">Pedidos</button>
      <button data-t="fornecedores" onclick="aba('fornecedores')">Fornecedores</button>
      <button data-t="aprovacao" id="seg-aprov" style="display:none;" onclick="aba('aprovacao')">✅ Aprovação<span class="bd" id="bd-aprov" style="display:none;"></span></button>
      <button data-t="mais" onclick="aba('mais')">Mais ▾</button>
    </div>
  </div>
  <div id="carregando" class="vazio" style="padding:40px;">Carregando…</div>
  <div id="t-fila" class="tab" style="display:none;"><div class="board" id="board"></div></div>
  <div id="t-pedidos" class="tab" style="display:none;">
    <div class="chips" id="ped-chips"></div>
    <div class="card2" style="overflow-x:auto;"><table class="tbl2" id="ped-tab"></table></div>
  </div>
  <div id="t-fornecedores" class="tab" style="display:none;">
    <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
      <input id="fo-busca" class="form-input" style="flex:1;min-width:200px;" placeholder="🔍 nome, CNPJ, contato, cidade…" oninput="renderFornecedores()">
      <button class="btn btn-primary" onclick="abrirFornecedor()">＋ Novo fornecedor</button>
    </div>
    <div class="card2" style="overflow-x:auto;"><table class="tbl2" id="fo-tab"></table></div>
  </div>
  <div id="t-aprovacao" class="tab" style="display:none;"></div>
  <div id="t-mais" class="tab" style="display:none;"></div>
</main>
<div id="toast-container"></div>

<!-- painel lateral -->
<div id="dw-bg" class="dw-bg hidden" onclick="fecharDw()"></div>
<div id="dw" class="dw hidden"></div>

<!-- mapa da cotação (tela cheia) -->
<div id="mp" class="mp-wrap hidden"></div>

<!-- ler proposta -->
<div id="m-imp" class="modal-overlay hidden">
  <div class="modal modal-lg" style="max-width:900px;">
    <div class="modal-header"><div class="modal-title" id="imp-tit">📎 Ler proposta</div><button class="modal-close" onclick="closeModal('m-imp')">✕</button></div>
    <div id="imp-corpo"></div>
    <div class="modal-footer" id="imp-pe"></div>
  </div>
</div>

<!-- compra direta -->
<div id="m-dir" class="modal-overlay hidden">
  <div class="modal modal-lg" style="max-width:680px;">
    <div class="modal-header" style="background:#fffbeb;"><div><div class="modal-title" style="color:#b45309;">⚡ Comprar direto, sem cotação</div><div style="font-size:12px;color:#475569;margin-top:2px;" id="dir-sub"></div></div><button class="modal-close" onclick="closeModal('m-dir')">✕</button></div>
    <div id="dir-corpo"></div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('m-dir')">Cancelar</button><button class="bbig em" style="flex:0 0 auto;padding:11px 18px;" id="dir-btn" onclick="salvarDireto()">⚡ Gerar pedido</button></div>
  </div>
</div>

<!-- aprovação (gerente) -->
<div id="m-apv" class="modal-overlay hidden">
  <div class="modal modal-lg" style="max-width:1100px;width:96vw;">
    <div class="modal-header"><div class="modal-title" id="apv-tit">Aprovar compra</div><button class="modal-close" onclick="closeModal('m-apv')">✕</button></div>
    <div id="apv-corpo"></div>
    <div class="modal-footer" id="apv-pe"></div>
  </div>
</div>

<!-- fornecedor -->
<div id="m-forn" class="modal-overlay hidden">
  <div class="modal" style="max-width:620px;">
    <div class="modal-header"><div class="modal-title" id="fo-tit">Fornecedor</div><button class="modal-close" onclick="closeModal('m-forn')">✕</button></div>
    <div class="form-grid-2">
      <div class="form-group"><label class="form-label">Nome fantasia <span class="req">*</span></label><input class="form-input" id="fo-nome"></div>
      <div class="form-group"><label class="form-label">Razão social</label><input class="form-input" id="fo-razao"></div>
      <div class="form-group"><label class="form-label">CNPJ</label><input class="form-input" id="fo-cnpj"></div>
      <div class="form-group"><label class="form-label">Categoria</label><input class="form-input" id="fo-cat" placeholder="peças, rolamentos, embalagem…"></div>
      <div class="form-group"><label class="form-label">Telefone / WhatsApp</label><input class="form-input" id="fo-fone"></div>
      <div class="form-group"><label class="form-label">E-mail</label><input class="form-input" id="fo-email"></div>
      <div class="form-group"><label class="form-label">Contato</label><input class="form-input" id="fo-contato"></div>
      <div class="form-group"><label class="form-label">Situação</label><select class="form-input" id="fo-st"><option value="aprovado">Homologado</option><option value="em_analise">Em análise</option><option value="bloqueado">Bloqueado</option><option value="inativo">Inativo</option></select></div>
      <div class="form-group"><label class="form-label">Prazo de entrega (dias)</label><input type="number" class="form-input" id="fo-prazo"></div>
      <div class="form-group"><label class="form-label">Condição de pagamento</label><input class="form-input" id="fo-pgto"></div>
    </div>
    <div class="form-group"><label class="form-label">Endereço / cidade</label><input class="form-input" id="fo-end"></div>
    <div class="form-group"><label class="form-label">Observações</label><textarea class="form-input" id="fo-obs" rows="2"></textarea></div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('m-forn')">Cancelar</button><button class="btn btn-primary" onclick="salvarFornecedor()">💾 Salvar</button></div>
  </div>
</div>

<!-- texto livre (pedido de cotação, motivo, cancelamento) -->
<div id="m-txt" class="modal-overlay hidden">
  <div class="modal" style="max-width:560px;">
    <div class="modal-header"><div class="modal-title" id="txt-tit"></div><button class="modal-close" onclick="closeModal('m-txt')">✕</button></div>
    <div id="txt-corpo"></div>
    <div class="modal-footer" id="txt-pe"></div>
  </div>
</div>

<script src="js/qrcode.min.js"></script>
<script>
/* ═══════════════ BASE ═══════════════ */
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const A=s=>E(s).replace(/'/g,"\\'");
const N=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const num=v=>{const x=Number(v);return isFinite(x)?x:0;};
const brl=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fq=v=>{const n=Number(v)||0;return n.toLocaleString('pt-BR',{maximumFractionDigits:3});};
const fp=v=>v==null||v===''?'':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:4});
const pBR=t=>{t=String(t==null?'':t).trim().replace(/^R\$\s*/i,'');if(t==='')return null;if(/,/.test(t))t=t.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');const v=parseFloat(t);return isFinite(v)?v:null;};
const pad4=n=>String(n||0).padStart(4,'0');
const hojeISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const dBR=d=>d?String(d).slice(0,10).split('-').reverse().join('/'):'—';
const dhBR=d=>d?new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const diasDesde=d=>d?Math.max(0,Math.floor((Date.now()-new Date(String(d).length<=10?d+'T12:00:00':d).getTime())/86400000)):0;
const horasDesde=d=>d?Math.max(0,(Date.now()-new Date(d).getTime())/3600000):0;
const quem=()=>{const u=getUser();return (u&&(u.nome||u.email))||'—';};
const podeComprar=()=>isAdmin()||checkPerm('compras','edit')||checkPerm('compras','create');
const podeAprovar=()=>isAdmin()||checkPermTab('compras','aprovacao','aprovar');
const NAO_FECHADA=['aberta','aguardando_aprovacao','devolvida','aprovada_auto'];
const MOTIVOS={urgencia:'🔴 Máquina parada / urgência',unico:'🏷️ Fornecedor único',valor_pequeno:'🪙 Valor pequeno',contrato:'📄 Fornecedor com contrato'};
const PRIOR={urgente:{c:'urg',t:'URGENTE',o:3},alta:{c:'alta',t:'ALTA',o:2},normal:{c:'',t:'',o:1},baixa:{c:'',t:'',o:0}};
const prior=s=>PRIOR[(s&&s.prioridade)||'normal']||PRIOR.normal;
let S={sols:[],cots:[],peds:[],forn:[],cfg:{},alias:[],precos:{},ncs:[]};
let _aba='fila',_pedFiltro='abertos';

/* ═══════════════ CARGA ═══════════════ */
function mesSel(){return document.getElementById('f-mes').value||hojeISO().slice(0,7);}
function faixaMes(){const m=mesSel();const [y,mm]=m.split('-').map(Number);const fim=new Date(y,mm,1);return {ini:m+'-01',fim:`${fim.getFullYear()}-${String(fim.getMonth()+1).padStart(2,'0')}-01`};}
async function carregar(){
  const {ini,fim}=faixaMes();
  const SOLC='id,numero,data,solicitante,centro_custo,prioridade,justificativa,status,origem,origem_id,origem_ref,equipamento,itens,aprovador,aprovado_em,created_at,atualizado_em,codigo,cancelado_motivo';
  const r=await Promise.all([
    db(_supabase.from('compras_solicitacoes').select(SOLC).in('status',['pendente','devolvida','aprovada','aguardando_cotacao','em_cotacao','em_pedido']).order('numero',{ascending:false}),'carregar solicitações'),
    db(_supabase.from('compras_cotacoes').select('*').in('status',NAO_FECHADA),'carregar cotações abertas'),
    db(_supabase.from('compras_cotacoes').select('*').gte('atualizado_em',ini).lt('atualizado_em',fim),'carregar cotações do mês'),
    db(_supabase.from('compras_pedidos').select('*').in('status',['emitido','aguardando_entrega','recebido_parcial']),'carregar pedidos abertos'),
    db(_supabase.from('compras_pedidos').select('*').or(`and(data.gte.${ini},data.lt.${fim}),and(atualizado_em.gte.${ini},atualizado_em.lt.${fim})`),'carregar pedidos do mês'),
    db(_supabase.from('almoxarifado_fornecedores').select('*').order('nome_fantasia'),'carregar fornecedores'),
    db(_supabase.from('empresa_config').select('id,compras_limite_emergencial,compras_prazo_ratificacao_h,compras_meta_emergencial_pct,compras_alerta_preco_pct').limit(1),'carregar regras'),
    db(_supabase.from('compras_aliases').select('*'),'carregar apelidos'),
    db(_supabase.from('compras_pedidos').select('data,fornecedor,itens,status,cotacao_id').neq('status','cancelado').order('data',{ascending:false}).limit(600),'carregar histórico de preços'),
  ]);
  if(r.some(x=>x.error)){document.getElementById('carregando').innerHTML='Não foi possível carregar o Compras. Veja o aviso acima.';return false;}
  const uniq=(a)=>{const m=new Map();a.forEach(x=>m.set(x.id,x));return [...m.values()];};
  S.sols=r[0].data||[];S.cots=uniq([...(r[1].data||[]),...(r[2].data||[])]);S.peds=uniq([...(r[3].data||[]),...(r[4].data||[])]);
  S.forn=r[5].data||[];S.cfg=(r[6].data&&r[6].data[0])||{};S.alias=r[7].data||[];
  // último preço pago por item (pedidos mais recentes primeiro)
  // preços pagos por item, do mais recente para o mais antigo (a referência ignora a própria compra)
  S.precos={};(r[8].data||[]).forEach(p=>(p.itens||[]).forEach(i=>{const pu=num(i.preco_unit);if(!(pu>0))return;const reg={preco:pu,fornecedor:p.fornecedor,data:p.data,cot:p.cotacao_id||null};
    [i.insumo_id,'n:'+N(i.nome)].filter(Boolean).forEach(k=>(S.precos[k]=S.precos[k]||[]).push(reg));}));
  return true;
}
const cfg=k=>({limite:num(S.cfg.compras_limite_emergencial)||5000,horas:num(S.cfg.compras_prazo_ratificacao_h)||24,meta:num(S.cfg.compras_meta_emergencial_pct)||30,alerta:num(S.cfg.compras_alerta_preco_pct)||10}[k]);
const ultimo=(it,cotId)=>{const l=(it.insumo_id&&S.precos[it.insumo_id])||S.precos['n:'+N(it.nome)]||[];return l.find(x=>!cotId||x.cot!==cotId)||null;};
const fNome=id=>{const f=S.forn.find(x=>x.id===id);return f?(f.nome_fantasia||f.razao_social||'—'):'';};
const fornAtivos=()=>S.forn.filter(f=>!['bloqueado','inativo'].includes(f.status_homologacao));
const solDe=id=>S.sols.find(s=>s.id===id)||null;
const cotDaSol=id=>S.cots.filter(c=>c.solicitacao_id===id&&NAO_FECHADA.includes(c.status)).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)))[0]||null;
const pedsDaSol=id=>S.peds.filter(p=>p.solicitacao_id===id&&p.status!=='cancelado');
const ccDe=s=>{const it=(s.itens||[])[0]||{};return s.centro_custo||it.centro_custo||'';};
const ccCurto=t=>String(t||'').replace(/^\d+\s*-\s*/,'').slice(0,26);
const itensTxt=(it,max)=>{it=it||[];max=max||2;return it.slice(0,max).map(i=>`${E(i.nome)} (${fq(i.quantidade!=null?i.quantidade:i.qtd)})`).join(' · ')+(it.length>max?` +${it.length-max}`:'');};

/* ═══════════════ TOPO ═══════════════ */
function linhasFila(){
  const fc=document.getElementById('f-comprador').value, ff=document.getElementById('f-forn').value, fb=N(document.getElementById('f-busca').value);
  const {ini,fim}=faixaMes(); const noMes=d=>d&&String(d).slice(0,10)>=ini&&String(d).slice(0,10)<fim;
  const cols={comprar:[],cotando:[],gerente:[],pedido:[],entregue:[]};
  const passa=(txt,comp,forns)=>(!fc||comp===fc)&&(!ff||(forns||[]).includes(ff))&&(!fb||N(txt).includes(fb));
  S.sols.forEach(s=>{
    if(!['aprovada','aguardando_cotacao','em_cotacao'].includes(s.status))return;
    if(cotDaSol(s.id)||pedsDaSol(s.id).length)return;
    const txt=['#'+pad4(s.numero),s.codigo,s.solicitante,ccDe(s),(s.itens||[]).map(i=>i.nome).join(' ')].join(' ');
    if(passa(txt,'',[]))cols.comprar.push({k:'sol',o:s});
  });
  S.cots.forEach(c=>{
    const s=solDe(c.solicitacao_id); const forns=(c.propostas||[]).map(p=>p.fornecedor_id);
    const txt=['#'+pad4(c.numero),s?'#'+pad4(s.numero):'',c.comprador,(c.itens||[]).map(i=>i.nome).join(' '),(c.propostas||[]).map(p=>p.fornecedor).join(' ')].join(' ');
    if(!passa(txt,c.comprador||'',forns))return;
    if(['aberta','devolvida'].includes(c.status))cols.cotando.push({k:'cot',o:c});
    else if(c.status==='aguardando_aprovacao')cols.gerente.push({k:'cot',o:c});
  });
  S.peds.forEach(p=>{
    const txt=['#'+pad4(p.numero),p.fornecedor,p.comprador,(p.itens||[]).map(i=>i.nome).join(' ')].join(' ');
    if(!passa(txt,p.comprador||'',[p.fornecedor_id]))return;
    if(['emitido','aguardando_entrega','recebido_parcial'].includes(p.status))cols.pedido.push({k:'ped',o:p});
    else if(p.status==='recebido_total'&&noMes(p.atualizado_em||p.data))cols.entregue.push({k:'ped',o:p});
  });
  cols.comprar.sort((a,b)=>(prior(b.o).o-prior(a.o).o)||(diasDesde(b.o.aprovado_em||b.o.created_at)-diasDesde(a.o.aprovado_em||a.o.created_at)));
  cols.cotando.sort((a,b)=>String(a.o.created_at).localeCompare(String(b.o.created_at)));
  cols.gerente.sort((a,b)=>String(a.o.enviada_em).localeCompare(String(b.o.enviada_em)));
  cols.pedido.sort((a,b)=>String(a.o.prazo_entrega||'9').localeCompare(String(b.o.prazo_entrega||'9')));
  cols.entregue.sort((a,b)=>String(b.o.atualizado_em).localeCompare(String(a.o.atualizado_em)));
  return cols;
}
function atrasado(p){return p.prazo_entrega&&p.prazo_entrega<hojeISO()&&['emitido','aguardando_entrega','recebido_parcial'].includes(p.status);}
function renderKpis(cols){
  const {ini,fim}=faixaMes();
  const doMes=S.peds.filter(p=>p.cotacao_id&&String(p.data||'')>=ini&&String(p.data||'')<fim&&p.status!=='cancelado');
  const em=doMes.filter(p=>p.emergencial).length, pct=doMes.length?Math.round(em/doMes.length*100):null;
  const atr=S.peds.filter(atrasado).length, conf=S.peds.filter(p=>p.emergencial&&!p.ratificado_em&&p.status!=='cancelado').length;
  document.getElementById('kpis').innerHTML=
    `<button class="kpi" onclick="aba('fila')"><b>${cols.comprar.length}</b><span>A comprar</span></button>`+
    `<button class="kpi" onclick="${podeAprovar()?"aba('aprovacao')":"aba('fila')"}"><b>${cols.gerente.length+conf}</b><span>Aguardando gerente</span></button>`+
    `<button class="kpi ${atr?'al':''}" onclick="_pedFiltro='atrasados';aba('pedidos')"><b>${atr}</b><span>Pedidos atrasados</span></button>`+
    `<button class="kpi em" title="Compras emergenciais (⚡ máquina parada) sobre os pedidos do mês feitos pelo Compras — meta: até ${cfg('meta')}%"><b>${pct==null?'—':pct+'%'}</b><span>⚡ Emergenciais no mês</span></button>`;
  const b=document.getElementById('bd-aprov'); const n=cols.gerente.length+conf;
  b.style.display=n?'':'none'; b.textContent=n;
}
function popularFiltros(){
  const comp=[...new Set([...S.cots.map(c=>c.comprador),...S.peds.map(p=>p.comprador)].filter(Boolean))].sort();
  const sc=document.getElementById('f-comprador'), v=sc.value;
  sc.innerHTML='<option value="">Comprador: todos</option>'+comp.map(c=>`<option ${c===v?'selected':''}>${E(c)}</option>`).join('');
  const sf=document.getElementById('f-forn'), vf=sf.value;
  sf.innerHTML='<option value="">Fornecedor: todos</option>'+S.forn.map(f=>`<option value="${f.id}" ${f.id===vf?'selected':''}>${E(f.nome_fantasia||f.razao_social)}</option>`).join('');
}
function aba(t){
  if(t==='aprovacao'&&!podeAprovar())return;
  _aba=t; document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.querySelectorAll('.tab').forEach(x=>x.style.display='none');
  document.getElementById('t-'+t).style.display='';
  renderTudo();
}
async function mudouMes(){ if(await carregar())renderTudo(); }
function renderTudo(){
  const cols=linhasFila(); renderKpis(cols);
  if(_aba==='fila')renderFila(cols); else if(_aba==='pedidos')renderPedidos(); else if(_aba==='fornecedores')renderFornecedores();
  else if(_aba==='aprovacao')renderAprovacao(cols); else if(_aba==='mais')renderMais();
}

/* ═══════════════ FILA (quadro) ═══════════════ */
function cardSol(s){
  const pr=prior(s), d=diasDesde(s.aprovado_em||s.created_at);
  return `<div class="cd ${pr.c}" onclick="abrirSol('${s.id}')"><div class="l1"><span>Sol #${pad4(s.numero)}</span>${pr.t?`<span class="tag t-${pr.c}">${pr.t}</span>`:''}</div>
    <div class="it">${itensTxt(s.itens)}</div><div class="l3"><span>${E(String(s.solicitante||'').split(' ').slice(0,2).join(' '))}${ccDe(s)?' · '+E(ccCurto(ccDe(s))):''}</span><span class="dias ${d>=7?'r':d>=3?'o':''}">${d?d+(d===1?' dia':' dias'):'hoje'}</span></div></div>`;
}
function cardCot(c){
  const s=solDe(c.solicitacao_id), pr=prior(s), props=(c.propostas||[]), ok=props.filter(p=>Object.values(p.precos||{}).some(v=>v!=null&&v!=='')).length;
  const ag=c.status==='aguardando_aprovacao', h=horasDesde(ag?c.enviada_em:c.created_at);
  return `<div class="cd ${pr.c}" onclick="abrirCot('${c.id}')"><div class="l1"><span>${c.tipo==='direta'?'⚡ Direta':'Cot #'+pad4(c.numero)}${s?' · Sol #'+pad4(s.numero):''}</span>${ag&&c.total?`<span class="val">${brl(c.total)}</span>`:c.status==='devolvida'?'<span class="tag t-alta">DEVOLVIDA</span>':''}</div>
    <div class="it">${itensTxt((c.itens||[]).map(i=>({nome:i.nome,qtd:i.qtd})))}</div>
    <div class="l3"><span>${ag?(c.tipo==='direta'?E(MOTIVOS[c.motivo_direto]||'direta'):props.length+' fornecedor(es)'):ok+' de '+props.length+' com preço'}</span><span class="dias ${h>=72?'o':''}">${h<24?'há '+Math.round(h)+' h':Math.floor(h/24)+' dias'}</span></div></div>`;
}
function cardPed(p){
  const s=solDe(p.solicitacao_id), pr=prior(s), at=atrasado(p), conf=p.emergencial&&!p.ratificado_em;
  const ent=p.status==='recebido_total';
  return `<div class="cd ${pr.c}" onclick="abrirPed('${p.id}')"><div class="l1"><span>Ped #${pad4(p.numero)} · ${E(String(p.fornecedor||'').slice(0,18))}</span><span class="val">${brl(p.valor_total)}</span></div>
    <div class="it">${itensTxt(p.itens)}</div>
    <div class="l3"><span>${p.emergencial?`<span class="tag t-em">⚡${conf?' a confirmar':''}</span> `:''}${ent?'recebido pelo almoxarifado':at?`<b style="color:var(--red);">atrasado ${diasDesde(p.prazo_entrega)} dias</b>`:p.status==='recebido_parcial'?'entrega parcial':p.prazo_entrega?'entrega '+dBR(p.prazo_entrega):'sem prazo'}</span><span>${ent?dBR(p.atualizado_em):''}</span></div></div>`;
}
function renderFila(cols){
  document.getElementById('carregando').style.display='none';
  const col=(t,arr,fn,extra)=>`<div class="col"><h3>${t} <i>${arr.length}</i></h3>${arr.map(x=>fn(x.o)).join('')||'<div class="vazio">—</div>'}${extra||''}</div>`;
  const [y,m]=mesSel().split('-');
  document.getElementById('board').innerHTML=col('A comprar',cols.comprar,cardSol)+col('Cotando',cols.cotando,cardCot)+col('Aguardando gerente',cols.gerente,cardCot)+
    col('Pedido enviado',cols.pedido,cardPed)+col('Entregue · '+['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][Number(m)-1],cols.entregue,cardPed);
}

/* ═══════════════ PAINEL LATERAL ═══════════════ */
function fecharDw(){document.getElementById('dw').classList.add('hidden');document.getElementById('dw-bg').classList.add('hidden');}
function dw(html){const d=document.getElementById('dw');d.innerHTML=html;d.classList.remove('hidden');document.getElementById('dw-bg').classList.remove('hidden');}
function stepper(at){const P=['Solicitação','Aprovação','Compra','Gerente','Pedido','Entrega'];
  return `<div class="step">${P.map((t,i)=>`<div class="st ${i<at?'ok':i===at?'at':''}"><div class="b">${i<at?'✓':i+1}</div>${t}</div>`).join('')}</div>`;}
function itensComPreco(itens,cotId){
  return `<table class="tb"><tr><th>Item</th><th class="n">Qtd</th><th class="n">Último preço</th></tr>${(itens||[]).map(i=>{const u=ultimo(i,cotId);const q=i.quantidade!=null?i.quantidade:i.qtd;
    return `<tr><td><b>${E(i.nome)}</b></td><td class="n">${fq(q)} ${E(i.unidade||'')}</td><td class="n">${u?brl(u.preco)+`<span class="ref">${E(u.fornecedor||'')} · ${dBR(u.data).slice(3)}</span>`:'—'}</td></tr>`;}).join('')}</table>`;
}
function estimativa(itens){let t=0,falta=0;(itens||[]).forEach(i=>{const u=ultimo(i);const q=num(i.quantidade!=null?i.quantidade:i.qtd);if(u)t+=u.preco*q;else if(num(i.custo_estimado))t+=num(i.custo_estimado)*q;else falta++;});return {t,falta};}
function histSol(s){const l=[];l.push(`${dBR(s.data||s.created_at)} · ${E(s.solicitante||'')} pediu`);if(s.aprovado_em)l.push(`${dBR(s.aprovado_em)} · ${E(s.aprovador||'')} aprovou`);l.push(`${dBR(s.created_at)} · chegou no Compras`);return l.join('<br>');}
function abrirSol(id){
  const s=solDe(id);if(!s)return; const pr=prior(s), d=diasDesde(s.aprovado_em||s.created_at), est=estimativa(s.itens);
  dw(`<div class="dw-h"><button class="dw-x" onclick="fecharDw()">✕</button><h2>Solicitação #${pad4(s.numero)}${pr.t?`<span class="tag t-${pr.c}">${pr.t}</span>`:''}</h2>
      <div class="m">${E(s.solicitante||'')}${ccDe(s)?' · '+E(ccDe(s)):''}${s.aprovador?' · aprovada por '+E(s.aprovador)+' em '+dBR(s.aprovado_em):''} · ${d?'parada há '+d+(d===1?' dia':' dias'):'chegou hoje'}</div></div>
    ${stepper(2)}
    <div class="dw-b">
      <div class="box"><h4>Itens</h4>${itensComPreco(s.itens)}</div>
      ${s.justificativa||s.equipamento?`<div class="box"><h4>Para que é</h4>${E([s.equipamento,s.justificativa].filter(Boolean).join(' — '))}</div>`:''}
      <div class="box"><h4>Estimativa pelo último preço</h4><b style="font-size:19px;color:var(--primary);">${brl(est.t)}</b>${est.falta?` <span class="ref">${est.falta} item(ns) sem preço anterior</span>`:''}
        <div class="ref">${est.t<=cfg('limite')?'abaixo':'acima'} do limite de ${brl(cfg('limite'))} para compra emergencial</div></div>
      <div class="box" style="background:#f8fafc;"><h4>Histórico</h4><div style="font-size:12px;color:var(--c2);line-height:1.7;">${histSol(s)}</div></div>
    </div>
    <div class="dw-f">${podeComprar()?`<button class="bsec red" onclick="cancelarSol('${s.id}')" title="Já resolvida, substituída ou não é mais necessária">🚫</button>
      <button class="bsec" onclick="iniciarCotacao('${s.id}')">💬 Cotar</button><button class="bbig em" onclick="abrirDireto('${s.id}')">⚡ Comprar direto</button>`:'<div class="ref">Você só acompanha (sem permissão de compra).</div>'}</div>`);
}
function abrirCot(id){
  const c=S.cots.find(x=>x.id===id);if(!c)return; const s=solDe(c.solicitacao_id), ag=c.status==='aguardando_aprovacao';
  const tots=totaisPorForn(c);
  dw(`<div class="dw-h"><button class="dw-x" onclick="fecharDw()">✕</button><h2>${c.tipo==='direta'?'⚡ Compra direta':'Cotação #'+pad4(c.numero)}${c.status==='devolvida'?'<span class="tag t-alta">DEVOLVIDA</span>':ag?'<span class="tag t-azul">COM O GERENTE</span>':''}</h2>
      <div class="m">${s?'Solicitação #'+pad4(s.numero)+' · '+E(s.solicitante||'')+' · ':''}comprador ${E(c.comprador||'—')}${ag?' · enviada '+dhBR(c.enviada_em):''}</div></div>
    ${stepper(ag?3:2)}
    <div class="dw-b">
      ${c.status==='devolvida'&&c.decisao_obs?`<div class="av av-w" style="margin-top:0;margin-bottom:9px;">↩ <b>O gerente devolveu:</b> ${E(c.decisao_obs)}</div>`:''}
      <div class="box"><h4>Itens</h4>${itensComPreco(c.itens,c.id)}</div>

/* ═══════════════ COTAÇÃO ═══════════════ */
function itensDaSol(s){return (s.itens||[]).map((i,ix)=>({k:'i'+ix,insumo_id:i.insumo_id||null,nome:i.nome,unidade:i.unidade||'un',qtd:num(i.quantidade!=null?i.quantidade:i.qtd)}));}
async function proximoNumeroCot(){const {data}=await _supabase.from('compras_cotacoes').select('numero').order('numero',{ascending:false}).limit(1);return ((data&&data[0]&&num(data[0].numero))||0)+1;}
async function novaCotacao(s,tipo){
  const reg={numero:await proximoNumeroCot(),solicitacao_id:s.id,data:hojeISO(),comprador:quem(),status:'aberta',tipo,itens:itensDaSol(s),propostas:[],
    escolha:{modo:'fornecedor'},historico:[{acao:'aberta',por:quem(),em:new Date().toISOString()}],atualizado_em:new Date().toISOString()};
  const {data,error}=await db(_supabase.from('compras_cotacoes').insert(reg).select().single(),'abrir cotação'); if(error)return null;
  S.cots.push(data);
  if(['aprovada','aguardando_cotacao'].includes(s.status)){const r=await db(_supabase.from('compras_solicitacoes').update({status:'em_cotacao',atualizado_em:new Date().toISOString()}).eq('id',s.id),'marcar solicitação em cotação');if(!r.error)s.status='em_cotacao';}
  return data;
}
async function iniciarCotacao(solId){
  if(!podeComprar())return toast('Sem permissão.','warning');
  const s=solDe(solId);if(!s)return; const ja=cotDaSol(solId); if(ja){fecharDw();return abrirMapa(ja.id);}
  const c=await novaCotacao(s,'cotacao'); if(!c)return;
  addLog('CREATE','COMPRAS','cot-'+c.numero,'Cotação aberta para a solicitação #'+s.numero).catch(()=>{});
  fecharDw(); renderTudo(); abrirMapa(c.id);
}
async function desistirCotacao(id){
  const c=S.cots.find(x=>x.id===id);if(!c)return;
  confirmar(`Desistir da ${c.tipo==='direta'?'compra direta':'cotação #'+pad4(c.numero)}? A solicitação volta para <b>A comprar</b>.`,async()=>{
    const r=await db(_supabase.from('compras_cotacoes').update({status:'cancelada',atualizado_em:new Date().toISOString(),historico:[...(c.historico||[]),{acao:'cancelada',por:quem(),em:new Date().toISOString()}]}).eq('id',id),'cancelar cotação'); if(r.error)return;
    c.status='cancelada'; const s=solDe(c.solicitacao_id);
    if(s&&s.status==='em_cotacao'){await db(_supabase.from('compras_solicitacoes').update({status:'aprovada',atualizado_em:new Date().toISOString()}).eq('id',s.id),'voltar solicitação');s.status='aprovada';}
    fecharDw(); renderTudo(); toast('Cotação cancelada.');
  });
}
let _mp=null;   // cotação aberta no mapa (cópia de trabalho)
function totaisPorForn(c){
  return (c.propostas||[]).map(p=>{let t=0,faltam=0;(c.itens||[]).forEach(i=>{const v=p.precos&&p.precos[i.k];if(v==null||v==='')faltam++;else t+=num(v)*num(i.qtd);});
    return {id:p.fornecedor_id,nome:p.fornecedor||fNome(p.fornecedor_id),total:t+num(p.frete),itens:t,frete:num(p.frete),faltam,completo:!faltam&&(c.itens||[]).length>0};});
}
function melhorPorItem(c){const m={};(c.itens||[]).forEach(i=>{let best=null;(c.propostas||[]).forEach(p=>{const v=p.precos&&p.precos[i.k];if(v==null||v==='')return;if(!best||num(v)<best.v)best={v:num(v),f:p.fornecedor_id};});m[i.k]=best;});return m;}
function totalEscolha(c){
  const esc=c.escolha||{}, tots=totaisPorForn(c);
  if(esc.modo==='item'){const best=melhorPorItem(c);let t=0,falta=[];const fs=new Set();(c.itens||[]).forEach(i=>{const b=best[i.k];if(!b)falta.push(i.nome);else{t+=b.v*num(i.qtd);fs.add(b.f);}});
    fs.forEach(f=>{const p=(c.propostas||[]).find(x=>x.fornecedor_id===f);t+=num(p&&p.frete);});return {total:t,falta,forns:[...fs]};}
  const t=tots.find(x=>x.id===esc.fornecedor_id); if(!t)return {total:0,falta:['escolha o fornecedor'],forns:[]};
  const p=(c.propostas||[]).find(x=>x.fornecedor_id===esc.fornecedor_id);
  return {total:t.total,falta:(c.itens||[]).filter(i=>{const v=p.precos&&p.precos[i.k];return v==null||v==='';}).map(i=>i.nome),forns:[esc.fornecedor_id]};
}
function abrirMapa(id){
  const c=S.cots.find(x=>x.id===id);if(!c)return; fecharDw();
  _mp=JSON.parse(JSON.stringify(c)); _mp.propostas=_mp.propostas||[]; _mp.escolha=_mp.escolha||{modo:'fornecedor'};
  if(!_mp.itens||!_mp.itens.length){const s=solDe(c.solicitacao_id);_mp.itens=s?itensDaSol(s):[];}
  // cotação antiga (só preço total): vira proposta sem preço por item
  _mp.propostas.forEach(p=>{p.precos=p.precos||{};if(p.pagamento==null&&p.condicao_pagamento)p.pagamento=p.condicao_pagamento;});
  renderMapa(); document.getElementById('mp').classList.remove('hidden');
}
function fecharMapa(){document.getElementById('mp').classList.add('hidden');_mp=null;renderTudo();}
function mapaEditavel(){return _mp&&['aberta','devolvida'].includes(_mp.status)&&podeComprar();}
function celPreco(p,i,best,ed,cotId){
  const v=p.precos[i.k], u=ultimo(i,cotId), al=v!=null&&v!==''&&u&&num(v)>u.preco*(1+cfg('alerta')/100);
  const cls=(best&&best.f===p.fornecedor_id&&v!=null&&v!=='')?'best':al?'alto':'';
  const tot=v!=null&&v!==''?brl(num(v)*num(i.qtd)):'';
  return `<td class="c">${ed?`<input class="pr ${cls}" inputmode="decimal" value="${v==null?'':fp(v)}" placeholder="—" onchange="setPreco('${A(p.fornecedor_id)}','${i.k}',this.value)">`:`<span class="ro ${cls}">${v==null||v===''?'—':brl(v)}</span>`}
    <span class="ref">${al?'+'+Math.round((num(v)/u.preco-1)*100)+'% do último':tot}</span></td>`;
}
function tabelaMapa(c,ed){
  const best=melhorPorItem(c), tots=totaisPorForn(c), esc=c.escolha||{}, completos=tots.filter(t=>t.completo), menor=completos.length?Math.min(...completos.map(t=>t.total)):null;
  const win=id=>esc.modo==='item'?false:esc.fornecedor_id?esc.fornecedor_id===id:(menor!=null&&(tots.find(t=>t.id===id)||{}).total===menor&&(tots.find(t=>t.id===id)||{}).completo);
  const hd=c.propostas.map(p=>`<th class="f ${win(p.fornecedor_id)?'win':''}">${E(p.fornecedor||fNome(p.fornecedor_id))}<small>${p.respondido_em?'respondeu '+dBR(p.respondido_em):'sem resposta'}${p.origem&&p.origem!=='manual'?' · '+E(p.origem):''}${(p.anexos||[]).length?' · 📎'+p.anexos.length:''}</small>
      ${ed?`<div class="acs"><button onclick="abrirLeitura('${A(p.fornecedor_id)}')" title="PDF, foto, print, planilha ou texto colado">📎 Ler proposta</button><button onclick="removerForn('${A(p.fornecedor_id)}')" title="Tirar da cotação">✕</button></div>`:''}</th>`).join('');
  const rows=c.itens.map(i=>{const u=ultimo(i,c.id);return `<tr><td><b>${E(i.nome)}</b></td><td class="c">${fq(i.qtd)} ${E(i.unidade||'')}</td><td class="c">${u?brl(u.preco)+`<span class="ref">${E(u.fornecedor||'')} · ${dBR(u.data).slice(3)}</span>`:'—'}</td>
      ${c.propostas.map(p=>celPreco(p,i,best[i.k],ed,c.id)).join('')}${esc.modo==='item'?`<td class="c" style="font-size:11.5px;">${best[i.k]?'🥇 '+E(fNome(best[i.k].f)||((c.propostas.find(p=>p.fornecedor_id===best[i.k].f)||{}).fornecedor||'')):'<b style="color:var(--red);">sem preço</b>'}</td>`:''}</tr>`;}).join('');
  const rod=(rot,campo,tipo)=>`<tr class="rod"><td colspan="3" style="text-align:right;">${rot}</td>${c.propostas.map(p=>`<td class="c">${ed?`<input ${tipo==='n'?'inputmode="decimal"':''} value="${E(tipo==='n'?(p[campo]==null?'':fp(p[campo])):(p[campo]||''))}" placeholder="—" onchange="setCampo('${A(p.fornecedor_id)}','${campo}',this.value,'${tipo}')">`:E(tipo==='n'&&campo==='frete'?(p.frete?brl(p.frete):'grátis / —'):campo==='prazo_dias'?(p.prazo_dias!=null&&p.prazo_dias!==''?p.prazo_dias+' dias':'—'):(p[campo]||'—'))}</td>`).join('')}${esc.modo==='item'?'<td></td>':''}</tr>`;
  const totRow=`<tr class="tot"><td colspan="3" style="text-align:right;">TOTAL</td>${c.propostas.map(p=>{const t=tots.find(x=>x.id===p.fornecedor_id)||{};return `<td class="c ${win(p.fornecedor_id)?'win':''}">${brl(t.total)}${t.completo?(t.total===menor?' ✓ menor':''):` <span style="font-size:11px;font-weight:600;">(faltam ${t.faltam})</span>`}</td>`;}).join('')}${esc.modo==='item'?`<td class="c win">${brl(totalEscolha(c).total)}</td>`:''}</tr>`;
  return `<table class="mp"><thead><tr><th style="text-align:left;min-width:240px;">Item</th><th>Qtd</th><th>Último preço pago</th>${hd}${esc.modo==='item'?'<th>Vencedor</th>':''}</tr></thead>
    <tbody>${rows}${rod('Frete (R$)','frete','n')}${rod('Prazo (dias)','prazo_dias','i')}${rod('Pagamento','pagamento','t')}${totRow}</tbody></table>`;
}
function renderMapa(){
  const c=_mp, ed=mapaEditavel(), s=solDe(c.solicitacao_id);
  const tots=totaisPorForn(c), esc=c.escolha;
  const fOpts=tots.map(t=>`<option value="${E(t.id)}" ${esc.fornecedor_id===t.id?'selected':''}>${E(t.nome)} — ${brl(t.total)}${t.completo?'':' (incompleto)'}</option>`).join('');
  document.getElementById('mp').innerHTML=`<div class="mp-h"><div><h2>Cotação #${pad4(c.numero)}${s?' — Solicitação #'+pad4(s.numero):''}</h2><div class="s">${s?E(s.solicitante||'')+' · '+E(ccCurto(ccDe(s)))+' · ':''}${c.itens.length} itens · comprador ${E(c.comprador||'')}${c.status==='aguardando_aprovacao'?' · <b style="color:#C9FF64;">com o gerente</b>':''}</div></div>
      <span class="sp"></span>${ed?`<button class="bt" onclick="pedidoDeCotacao()">📤 Pedido de cotação</button><button class="bt" onclick="addFornecedorMapa()">＋ Fornecedor</button>`:''}<button class="bt" onclick="imprimirMapa()">🖨️ Imprimir</button><button class="bt" onclick="fecharMapa()">✕ Fechar</button></div>
    ${c.status==='devolvida'&&c.decisao_obs?`<div class="av av-w mp-aviso">↩ <b>O gerente devolveu:</b> ${E(c.decisao_obs)}</div>`:''}
    <div class="mp-b">${c.propostas.length?tabelaMapa(c,ed):`<div class="card2" style="text-align:center;padding:30px;color:var(--c3);">Adicione os fornecedores que vão cotar (botão <b>＋ Fornecedor</b>). Depois lance os preços ou use <b>📎 Ler proposta</b> com o PDF, foto, planilha ou texto que ele mandou.</div>`}</div>
    ${ed?`<div class="mp-f"><div class="modo">Comprar:
        <label><input type="radio" name="mp-modo" ${esc.modo!=='item'?'checked':''} onchange="setModo('fornecedor')"> tudo no</label>
        <select class="form-input" style="width:auto;max-width:320px;height:34px;padding:4px 8px;" onchange="_mp.escolha.fornecedor_id=this.value;renderMapa();" ${esc.modo==='item'?'disabled':''}><option value="">escolha…</option>${fOpts}</select>
        <label><input type="radio" name="mp-modo" ${esc.modo==='item'?'checked':''} onchange="setModo('item')"> o mais barato de cada item</label></div>
      <input class="form-input just" id="mp-just" placeholder="Justificativa (obrigatória se não for o menor total)…" value="${E(c.justificativa_escolha||'')}" onchange="_mp.justificativa_escolha=this.value">
      <button class="bsec" onclick="salvarMapa()">💾 Salvar</button><button class="bbig" style="flex:0 0 auto;padding:12px 20px;" onclick="enviarGerente()">Enviar ao gerente ▸</button></div>`:''}`;
}
function setPreco(fid,k,v){const p=_mp.propostas.find(x=>x.fornecedor_id===fid);if(!p)return;const n=pBR(v);if(n==null)delete p.precos[k];else p.precos[k]=n;if(!p.respondido_em)p.respondido_em=hojeISO();if(!p.origem)p.origem='manual';renderMapa();}
function setCampo(fid,campo,v,tipo){const p=_mp.propostas.find(x=>x.fornecedor_id===fid);if(!p)return;p[campo]=tipo==='n'?pBR(v):tipo==='i'?(parseInt(v)||null):(String(v).trim()||null);renderMapa();}
function setModo(m){_mp.escolha.modo=m;if(m==='item')delete _mp.escolha.fornecedor_id;renderMapa();}
function removerForn(fid){confirmar('Tirar este fornecedor da cotação? Os preços dele saem do mapa.',()=>{_mp.propostas=_mp.propostas.filter(p=>p.fornecedor_id!==fid);if(_mp.escolha.fornecedor_id===fid)delete _mp.escolha.fornecedor_id;renderMapa();});}

      closeModal('m-txt');renderMapa();}]]);
  setTimeout(()=>document.getElementById('af-q')&&document.getElementById('af-q').focus(),60);

async function gravarCot(c,extra){
  // modo "mais barato de cada item": grava qual fornecedor ficou com cada item (o banco gera 1 pedido por fornecedor)
  if(c.escolha&&c.escolha.modo==='item'){const b=melhorPorItem(c);c.escolha.por_item={};Object.entries(b).forEach(([k,v])=>{if(v)c.escolha.por_item[k]=v.f;});}
  else if(c.escolha)delete c.escolha.por_item;
  const reg={itens:c.itens,propostas:c.propostas,escolha:c.escolha,justificativa_escolha:c.justificativa_escolha||null,fornecedor_escolhido_id:c.escolha.modo==='fornecedor'?(c.escolha.fornecedor_id||null):null,
    fornecedor_escolhido:c.escolha.modo==='fornecedor'&&c.escolha.fornecedor_id?fNome(c.escolha.fornecedor_id)||((c.propostas.find(p=>p.fornecedor_id===c.escolha.fornecedor_id)||{}).fornecedor):null,
    total:totalEscolha(c).total||null,motivo_direto:c.motivo_direto||null,atualizado_em:new Date().toISOString(),...(extra||{})};
  const {data,error}=await db(_supabase.from('compras_cotacoes').update(reg).eq('id',c.id).select().single(),'salvar cotação');
  if(error)return null; const i=S.cots.findIndex(x=>x.id===c.id); if(i>=0)S.cots[i]=data; return data;
}
async function salvarMapa(){const d=await gravarCot(_mp);if(d){_mp=JSON.parse(JSON.stringify(d));renderMapa();toast('Cotação salva.');}}
function validarEnvio(c){
  if(!c.propostas.length)return 'Adicione ao menos um fornecedor com preço.';
  const te=totalEscolha(c);
  if(c.escolha.modo!=='item'&&!c.escolha.fornecedor_id)return 'Escolha o fornecedor (ou "o mais barato de cada item").';

async function linhasPdf(f){

async function ocrPdf(f){

const STOP=new Set(['DE','DA','DO','DAS','DOS','COM','C','P','PARA','E','EM','TIPO','A','O','UN','UND','UNID','PC','PCS','PÇ','CX','KG','M','MT','L','LT','RS','R','VALOR','TOTAL','UNIT','UNITARIO','QTD','QTDE','REF','COD','CODIGO']);
const toks=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9/,.\- ]+/g,' ').replace(/[,.](?=\D|$)/g,' ').split(/\s+/).filter(Boolean);
const compact=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const temDig=t=>/\d/.test(t);
function scoreItem(linha,item){
  // nota 0–1: quanto do nome do item aparece na linha (código/medida pesa 3) + quanto da linha é do item
  const lt=toks(linha).filter(t=>!STOP.has(t)), it=toks(item.nome).filter(t=>!STOP.has(t)), lc=compact(linha);
  if(!it.length||!lt.length)return 0;

  const achou=(t,em,emC)=>{
    if(temDig(t)){ if(em.includes(t)||(compact(t).length>=4&&emC.includes(compact(t))))return 1;
      const nb=(t.match(/\d{3,}/)||[])[0]; return nb&&(em.includes(nb)||emC.includes(nb))?0.75:0; }
    return em.some(l=>!temDig(l)&&(l===t||(l.length>=3&&t.startsWith(l))||(t.length>=3&&l.startsWith(t))))?1:0;};
  let peso=0,ok=0; it.forEach(t=>{const w=temDig(t)?3:1;peso+=w;ok+=w*achou(t,lt,lc);});
  const lv=toks(semValores(linha)).filter(t=>!STOP.has(t)), ic=compact(item.nome);
  let pv=0,ov=0; lv.forEach(t=>{const w=temDig(t)?3:1;pv+=w;ov+=w*achou(t,it,ic);});

const aliasNorm=desc=>toks(desc).filter(t=>!STOP.has(t)).join(' ').slice(0,120);
function numerosDaLinha(l){

function precoDaLinha(nums,Q){
  // par (unitário × qtd ≈ total)
  for(let a=nums.length-1;a>=0;a--)for(let b=nums.length-1;b>=0;b--){if(a===b)continue;const u=nums[a],t=nums[b];if(t>0&&u>0&&Q>0&&Math.abs(u*Q-t)/t<=0.02)return {u,ok:true};}

  if(sem.length>1){const t=sem[sem.length-1];return {u:Q?t/Q:t,ok:false,obs:'confira: usei o último valor como total'};}
  return null;

    const desc=descDaLinha(l), nums=numerosDaLinha(l); if(!desc||!nums.length||/^(total|subtotal|frete|valor total)\b/i.test(desc))return;
    const an=aliasNorm(semValores(l)), al=aliases.find(a=>a.texto_norm===an), itA=al?c.itens.find(i=>i.insumo_id&&i.insumo_id===al.insumo_id):null;

      <div><small>Entrega</small>${p.prazo_entrega?dBR(p.prazo_entrega):'combinar'}</div><div><small>Pagamento</small>${E(p.condicao_pagamento||'combinar')}</div><div><small>Comprador</small>${E(p.comprador||'')}</div><div><small>Aprovado por</small>${E(p.aprovado_por||(p.emergencial?'emergencial':'—'))}</div></div>
    <table><tr><th>#</th><th style="text-align:left;">Item</th><th>Qtd</th><th>Un.</th><th>Preço un.</th><th>Total</th></tr>
      ${(p.itens||[]).map((i,ix)=>`<tr><td class="c">${ix+1}</td><td>${E(i.nome)}</td><td class="n">${fq(i.qtd)}</td><td class="c">${E(i.unidade||'')}</td><td class="n">${brl(i.preco_unit)}</td><td class="n">${brl(num(i.preco_unit)*num(i.qtd))}</td></tr>`).join('')}
      ${p.frete?`<tr><td colspan="5" class="n">Frete</td><td class="n">${brl(p.frete)}</td></tr>`:''}<tr class="tot"><td colspan="5" class="n">TOTAL</td><td class="n">${brl(p.valor_total)}</td></tr></table>
    <div class="ass"><div>${E(p.comprador||'')}<small>Comprador</small></div><div>${E(p.aprovado_por||'')}<small>Gerente${p.aprovado_em?' · '+dhBR(p.aprovado_em):''}</small></div></div>`;
  janela('Pedido '+pad4(p.numero),corpo,false);
}

/* ═══════════════ MODAIS SIMPLES ═══════════════ */
function txtModal(tit,corpo,botoes){
  document.getElementById('txt-tit').textContent=tit; document.getElementById('txt-corpo').innerHTML=corpo;
  const pe=document.getElementById('txt-pe'); pe.innerHTML='<button class="btn btn-secondary" onclick="closeModal(\'m-txt\')">Fechar</button>';
  (botoes||[]).forEach(([t,fn])=>{const b=document.createElement('button');b.className='btn btn-primary';b.textContent=t;b.onclick=fn;pe.appendChild(b);});
  document.getElementById('m-txt').classList.remove('hidden');
}
function confirmar(msg,fn){txtModal('Confirmar',`<p style="font-size:14px;color:#475569;line-height:1.6;">${msg}</p>`,[['Confirmar',async()=>{closeModal('m-txt');await fn();}]]);}

/* ═══════════════ INÍCIO ═══════════════ */
(async()=>{
  if(!getUser()){location.href='index.html';return;}
  fetch('partials/sidebar.html').then(r=>r.text()).then(h=>{document.getElementById('sidebar-container').innerHTML=h;document.querySelector('[href="compras.html"]')?.classList.add('active');if(typeof openGroup==='function')openGroup('compras');}).catch(e=>console.warn('[sidebar]',e));
  initSidebar('compras.html');
  document.getElementById('f-mes').value=hojeISO().slice(0,7);
  if(podeAprovar())document.getElementById('seg-aprov').style.display='';
  carregarEmpresaPDF().catch(()=>{});
  if(!(await carregar()))return;
  document.getElementById('carregando').style.display='none';
  popularFiltros();
  const q=new URLSearchParams(location.search);
  if(q.get('aprovar')&&podeAprovar()){aba('aprovacao');const c=S.cots.find(x=>x.id===q.get('aprovar'));if(c)abrirAprovar(c.id);const p=S.peds.find(x=>x.id===q.get('aprovar'));if(p)abrirConfirmar(p.id);}
  else aba(q.get('aba')||'fila');
})();
</script>
