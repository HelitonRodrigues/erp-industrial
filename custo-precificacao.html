   LÊ a tabela `folhas_pagamento` para calcular o custo de mão de obra. */


/* ═══════════════════════════════════════════════════════════════════════════
   TAB: IMPACTO — simulação de decisão
   Responde três perguntas: (1) o que muda em CADA produto, (2) quanto isso
   custa em margem — não em custo total, (3) até onde eu aguento.
   Nada aqui altera as outras abas: o motor é o mesmo `computar`, e as
   alterações temporárias são aplicadas e desfeitas no mesmo ciclo.
   ═══════════════════════════════════════════════════════════════════════════ */

// Estado só desta aba, criado sob demanda (não entra no snapshot salvo → é de sessão).
function _impState() {
  if (!state._imp) {
    state._imp = {
      choque: { mp: 0, emb: 0, pallet: 0, energia: 0, lenha: 0, diesel: 0, manut: 0, folha: 0, venda: 0 },
      cenarios: [], _cenSeq: 0, limites: null, abertos: {},
    };
  }
  // Toda seção da aba pode ser ocultada. Chaves novas entram abertas, menos as duas
  // mais pesadas (cenários e limites), que só interessam quando a pessoa vai usar.
  const PADRAO = { capacidade: true, choques: false, narrativa: true, decisao: true, produto: true, fixo: true, pe: true, hora: true, repasse: true, cenarios: false, limite: false };
  if (!state._imp.abertos) state._imp.abertos = {};
  Object.keys(PADRAO).forEach((k) => { if (state._imp.abertos[k] === undefined) state._imp.abertos[k] = PADRAO[k]; });
  return state._imp;
}

const _IMP_CHOQUES = [
  { id: 'mp', lbl: 'MP mineral e química', dica: 'inclui a MP Cinza (base + frete)' },
  { id: 'emb', lbl: 'Embalagem', dica: 'sacaria, big bag' },
  { id: 'pallet', lbl: 'Pallet e stretch', dica: 'pallet + filme' },
  { id: 'energia', lbl: 'Energia elétrica', dica: 'grupos de rateio de energia' },
  { id: 'lenha', lbl: 'Lenha', dica: 'preço do m³' },
  { id: 'diesel', lbl: 'Diesel / combustível', dica: '' },
  { id: 'manut', lbl: 'Manutenção e moinho', dica: 'peças, desgaste, consumo' },
  { id: 'folha', lbl: 'Folha (dissídio)', dica: 'aplica sobre a folha inteira; o cartão-alimentação acompanha' },
  { id: 'venda', lbl: 'Preço de venda', dica: 'negativo = concorrente derrubando preço' },
];

/* ---------- motor: aplica alterações temporárias, calcula e desfaz ---------- */
// Mesmo padrão do computarSemSimulacao: mexe, calcula, devolve tudo ao lugar.
function _impSimular(mutar) {
  const undo = [];
  const set = (obj, chave, valor) => { if (!obj) return; undo.push([obj, chave, obj[chave]]); obj[chave] = valor; };
  try {
    mutar(set);
    return computar(state);
  } finally {
    for (let i = undo.length - 1; i >= 0; i--) undo[i][0][undo[i][1]] = undo[i][2];
  }
}
function _impZerarSimulacaoCapacidade(set) {
  (state.blocos || []).forEach((b) => (b.secoes || []).forEach((sec) => {
    set(sec, 'simuladoDesligado', false); set(sec, 'simuladoReducaoPct', 0);
    set(sec, 'simuladoDiasParados', 0); set(sec, 'simuladoHorasReduzidas', 0);
    set(sec, 'simuladoParadaInicio', null); set(sec, 'simuladoParadaFim', null);
  }));
}
// Choque de preço: multiplica os campos de preço ativos. Só o campo que o motor
// realmente usa tem efeito, então multiplicar os candidatos é seguro.
function _impAplicarChoque(choque, precoVendaBase, set) {
  const f = (pct) => 1 + (Number(pct) || 0) / 100;
  const CAMPOS = ['precoUnitarioEditado', 'custoPorTonEditado', 'valorMensalEditado', 'valorOverrideManual'];
  const mult = (obj, chave, fator) => {
    if (!obj) return; const v = Number(obj[chave]);
    if (obj[chave] == null || obj[chave] === '' || !isFinite(v)) return;
    set(obj, chave, v * fator);
  };
  const porClasse = (classes, fator) => (state.insumos || []).forEach((it) => {
    if (it.removido || !classes.includes(it.classe)) return;
    CAMPOS.forEach((c) => mult(it, c, fator));
  });

  if (Number(choque.mp)) {
    const fator = f(choque.mp);
    porClasse(['MP MINERAL', 'MP QUÍMICA'], fator);
    mult(state.mpCinza, 'precoBase', fator); mult(state.mpCinza, 'frete', fator);
  }
  if (Number(choque.emb)) porClasse(['EMBALAGEM'], f(choque.emb));
  if (Number(choque.pallet)) { porClasse(['PALLET'], f(choque.pallet)); mult(state.stretch, 'precoPorGrama', f(choque.pallet)); }
  if (Number(choque.energia)) { porClasse(['ENERGIA'], f(choque.energia)); ((state.energia || {}).grupos || []).forEach((g) => mult(g, 'valor', f(choque.energia))); }
  if (Number(choque.lenha)) { porClasse(['LENHA'], f(choque.lenha)); mult(state.lenha, 'precoM3', f(choque.lenha)); }
  if (Number(choque.diesel)) porClasse(['COMBUSTIVEL'], f(choque.diesel));
  if (Number(choque.manut)) porClasse(['MANUTENÇÃO', 'MAT. MOINHO', 'MAT. CONSUMO'], f(choque.manut));
  if (Number(choque.folha)) {
    porClasse(['FOLHA'], f(choque.folha));
    const fe = Number(state.fatorEncargos) > 0 ? Number(state.fatorEncargos) : 1;
    set(state, 'fatorEncargos', fe * f(choque.folha));
  }
  if (Number(choque.venda) && precoVendaBase) {
    BUCKETS_CUSTO.forEach((b) => set(state.precoVendaManual, b, (precoVendaBase[b] || 0) * f(choque.venda)));
  }
}

/* ---------- leitura de resultado ---------- */
function _impQtd(r, b) { return b === 'CAULIMGRANEL' ? r.plano.tonelagem.tonCAULIMGRANEL : (r.metas[b] || 0); }

// Margem de contribuição total e resultado operacional. É a régua da decisão:
// custo total cai quando se para a linha, margem é o que realmente se perde.
function _impResumo(r) {
  let mc = 0, receita = 0;
  BUCKETS_CUSTO.forEach((b) => {
    const q = _impQtd(r, b);
    mc += (r.margem[b].margemRS || 0) * q;
    receita += (r.precoVenda[b] || 0) * q;
  });
  const fixo = r.plano.porClassificacao.GERAL.FIXO;
  return {
    ton: r.plano.tonelagem.tonTotal, custo: r.plano.totais.GERAL, custoTon: r.plano.custoPorTon.GERAL,
    variavel: r.plano.porClassificacao.GERAL.VARIAVEL, fixo, mc, resultado: mc - fixo,
    receita, faturamento: r.faturamentoCalculado, alvo: r.alvo.atualPct, dentroDoAlvo: r.alvo.dentroDoAlvo,
    fixoPorTon: r.plano.tonelagem.tonTotal > 0 ? fixo / r.plano.tonelagem.tonTotal : 0,
  };
}

// Consolida por seção (linha + turno): horas disponíveis e margem que ela gera.
function _impPorSecao(r) {
  const mapa = {};
  (r.producao.detalhes || []).forEach((d) => {
    if (!mapa[d.secaoId]) mapa[d.secaoId] = { secaoId: d.secaoId, blocoId: d.blocoId, linhaNome: d.linhaNome, turnoNome: d.turnoNome, horas: d.horasDispSecao || 0, mc: 0, ton: 0 };
    const dest = (state.mapaProduto[d.produtoNome] || {}).destino;
    if (dest && r.margem[dest]) mapa[d.secaoId].mc += (r.margem[dest].margemRS || 0) * d.qtd;
    if (dest) mapa[d.secaoId].ton += qtdParaToneladas(dest, d.qtd, state.pesos);
  });
  return Object.values(mapa);
}
function _impSecaoSimulada(sec) {
  return !!(sec.simuladoDesligado || sec.simuladoReducaoPct > 0 || sec.simuladoDiasParados > 0 || sec.simuladoHorasReduzidas > 0 || (sec.simuladoParadaInicio && sec.simuladoParadaFim));
}

/* ---------- célula de comparação com sentido correto ---------- */
// 1. A cor não pode ser a mesma regra pra tudo: custo subindo é ruim,
// tonelagem caindo também. Cada métrica declara o que é "bom".
function _impCel(plan, ajus, fmt, sentido) {
  const d = ajus - plan;
  const bom = sentido === 'menorMelhor' ? d < 0 : d > 0;
  const cor = Math.abs(d) < 1e-9 ? '#64748b' : (bom ? '#15803d' : 'var(--danger)');
  const pct = Math.abs(plan) > 1e-9 ? (d / Math.abs(plan)) * 100 : null;
  const seta = Math.abs(d) < 1e-9 ? '' : (d > 0 ? '▲' : '▼');
  return `<td class="cp-num">${fmt(plan)}</td><td class="cp-num">${fmt(ajus)}</td>
    <td class="cp-num" style="color:${cor};font-weight:700;white-space:nowrap;">${seta} ${d > 0 ? '+' : ''}${fmt(d)}${pct != null && Math.abs(d) > 1e-9 ? `<div style="font-weight:600;font-size:11px;opacity:.85;">${d > 0 ? '+' : ''}${fmtNum(pct, 2)}%</div>` : ''}</td>`;
}
function _impLinhaCmp(label, plan, ajus, fmt, sentido, dica) {
  return `<tr><td>${label}${dica ? `<div class="cp-muted" style="font-size:11px;">${dica}</div>` : ''}</td>${_impCel(plan, ajus, fmt, sentido)}</tr>`;
}

/* ---------- ações da aba ---------- */
function impSetChoque(id, valor) {
  const imp = _impState();
  imp.choque[id] = Number(String(valor).replace(',', '.')) || 0;
  imp.limites = null;
  render();
}
function impAddChoque(id, delta) { const imp = _impState(); impSetChoque(id, (Number(imp.choque[id]) || 0) + delta); }
function impZerarChoques() { const imp = _impState(); Object.keys(imp.choque).forEach((k) => { imp.choque[k] = 0; }); imp.limites = null; render(); }
function impZerarTudo() {
  const imp = _impState();
  Object.keys(imp.choque).forEach((k) => { imp.choque[k] = 0; });
  (state.blocos || []).forEach((b) => (b.secoes || []).forEach((sec) => {
    sec.simuladoDesligado = false; sec.simuladoReducaoPct = 0; sec.simuladoDiasParados = 0;
    sec.simuladoHorasReduzidas = 0; sec.simuladoParadaInicio = null; sec.simuladoParadaFim = null;
  }));
  imp.limites = null;
  render();
}
function impToggleSecao(id) { const imp = _impState(); imp.abertos[id] = !imp.abertos[id]; render(); }
function impExpandirTudo(abrir) { const imp = _impState(); Object.keys(imp.abertos).forEach((k) => { imp.abertos[k] = !!abrir; }); render(); }

// 8. Cenário = foto da simulação inteira (capacidade + choques) com o resultado.
function impSalvarCenario(nome) {
  const imp = _impState();
  const rPlan = computarSemSimulacao(state);
  const rAj = _impResultadoAjustado(rPlan);
  const res = _impResumo(rAj);
  imp._cenSeq++;
  imp.cenarios.push({
    id: 'imp' + imp._cenSeq,
    nome: (nome || '').trim() || `Cenário ${imp.cenarios.length + 1}`,
    choque: JSON.parse(JSON.stringify(imp.choque)),
    capacidade: (state.blocos || []).map((b) => ({
      blocoId: b.id, linhaNome: b.linhaNome,
      secoes: (b.secoes || []).map((sec) => ({
        secaoId: sec.id, turnoNome: sec.turnoNome,
        simuladoDesligado: !!sec.simuladoDesligado, simuladoReducaoPct: sec.simuladoReducaoPct || 0,
        simuladoDiasParados: sec.simuladoDiasParados || 0, simuladoHorasReduzidas: sec.simuladoHorasReduzidas || 0,
        simuladoParadaInicio: sec.simuladoParadaInicio || null, simuladoParadaFim: sec.simuladoParadaFim || null,
      })),
    })),
    resumo: res,
    porProduto: BUCKETS_CUSTO.map((b) => ({ b, qtd: _impQtd(rAj, b), custoTon: rAj.plano.custoPorTon[b], margem: rAj.margem[b].margemRS, lucro: (rAj.margem[b].margemRS || 0) * _impQtd(rAj, b) })),
    criadoEm: new Date().toISOString(),
  });
  render();
}
function impRemoverCenario(id) { const imp = _impState(); imp.cenarios = imp.cenarios.filter((c) => c.id !== id); render(); }
function impAplicarCenario(id) {
  const imp = _impState();
  const c = imp.cenarios.find((x) => x.id === id);
  if (!c) return;
  imp.choque = JSON.parse(JSON.stringify(c.choque));
  (c.capacidade || []).forEach((cb) => {
    const bloco = (state.blocos || []).find((b) => b.id === cb.blocoId);
    if (!bloco) return;
    (cb.secoes || []).forEach((cs) => {
      const sec = (bloco.secoes || []).find((s) => s.id === cs.secaoId);
      if (!sec) return;
      sec.simuladoDesligado = cs.simuladoDesligado; sec.simuladoReducaoPct = cs.simuladoReducaoPct;
      sec.simuladoDiasParados = cs.simuladoDiasParados; sec.simuladoHorasReduzidas = cs.simuladoHorasReduzidas;
      sec.simuladoParadaInicio = cs.simuladoParadaInicio; sec.simuladoParadaFim = cs.simuladoParadaFim;
    });
  });
  imp.limites = null;
  render();
}

// 9. Inverte a pergunta: em vez de tentar 3, 5, 8 dias, o sistema acha o limite.
function impCalcularLimites() {
  const imp = _impState();
  const teto = Number(state.alvoMaximoPct) / 100;
  const diasUteis = contarDiasTrabalho(state.calendario) || 22;
  const alvoDe = (r) => (r && isFinite(r.alvo.atualPct) ? r.alvo.atualPct : Infinity);

  const rPlan = computarSemSimulacao(state);
  const partida = alvoDe(rPlan);

  // Máximo de dias úteis de parada (na fábrica toda) mantendo o alvo.
  let maxDias = null;
  if (partida <= teto) {
    maxDias = 0;
    for (let d = 1; d <= diasUteis; d++) {
      const rr = _impSimular((set) => {
        _impZerarSimulacaoCapacidade(set);
        (state.blocos || []).forEach((b) => (b.secoes || []).forEach((sec) => set(sec, 'simuladoDiasParados', d)));
      });
      if (alvoDe(rr) > teto) break;
      maxDias = d;
    }
  }
  // Máximo de alta de MP mantendo o alvo (passo de 1%).
  let maxMP = null;
  if (partida <= teto) {
    maxMP = 0;
    for (let p = 1; p <= 60; p++) {
      const rr = _impSimular((set) => { _impZerarSimulacaoCapacidade(set); _impAplicarChoque({ mp: p }, rPlan.precoVenda, set); });
      if (alvoDe(rr) > teto) break;
      maxMP = p;
    }
  }
  // Máxima queda de preço de venda mantendo o alvo (passo de 0,5%).
  let maxQueda = null;
  if (partida <= teto) {
    maxQueda = 0;
    for (let p = 0.5; p <= 40; p += 0.5) {
      const rr = _impSimular((set) => { _impZerarSimulacaoCapacidade(set); _impAplicarChoque({ venda: -p }, rPlan.precoVenda, set); });
      if (alvoDe(rr) > teto) break;
      maxQueda = p;
    }
  }
  imp.limites = { teto, partida, diasUteis, maxDias, maxMP, maxQueda, calculadoEm: new Date().toISOString() };
  render();
}

/* ---------- resultado ajustado (capacidade + choques) ---------- */
function _impResultadoAjustado(rPlan) {
  const imp = _impState();
  const temChoque = Object.keys(imp.choque).some((k) => Number(imp.choque[k]) !== 0);
  if (!temChoque) return computar(state);
  return _impSimular((set) => _impAplicarChoque(imp.choque, rPlan.precoVenda, set));
}

/* ══════════════════════ RENDER ══════════════════════ */
function renderImpacto(r) {
  if (!state.blocos.length) {
    return `<div class="card"><div class="empty-state"><div class="empty-icon">🧪</div><h3>Nenhuma linha configurada ainda</h3><p>Configure a Capacidade primeiro — os turnos aparecem aqui pra simular.</p></div></div>`;
  }
  const imp = _impState();
  const rPlan = computarSemSimulacao(state);
  const rAj = _impResultadoAjustado(rPlan);
  const P = _impResumo(rPlan), A = _impResumo(rAj);

  const temSimCap = state.blocos.some((b) => (b.secoes || []).some(_impSecaoSimulada));
  const temChoque = Object.keys(imp.choque).some((k) => Number(imp.choque[k]) !== 0);
  const temAlgo = temSimCap || temChoque;

  const sec = (id, titulo, corpo, subtitulo) => `<div class="card" style="margin-top:14px;">
    <div class="cp-secao-colapsavel-header" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;" onclick="impToggleSecao('${id}')">
      <h3 class="cp-h3" style="margin:0;">${titulo}${subtitulo ? ` <span class="cp-muted" style="font-weight:500;">— ${subtitulo}</span>` : ''}</h3>
      <span class="cp-muted">${imp.abertos[id] ? '▲' : '▼'}</span>
    </div>
    ${imp.abertos[id] ? `<div style="margin-top:12px;">${corpo}</div>` : ''}
  </div>`;

  return `<div class="card" style="margin-bottom:14px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
      <div>
        <h3 class="cp-h3" style="margin:0;">🧪 Simulação de impacto</h3>
        <p class="cp-ajuda" style="margin:2px 0 0;">Mexa nos turnos abaixo (ou nos choques de preço) e o resultado aparece logo em seguida.</p>
        <p class="cp-ajuda" style="margin:4px 0 0;"><strong>Choques de preço</strong> valem só nesta tela. Já as <strong>paradas de turno</strong> ficam gravadas no planejamento e mudam o número das outras abas enquanto estiverem ligadas — por isso o aviso aparece no topo. Use <strong>↺ Voltar ao planejado</strong> quando terminar.</p>
      </div>
      <div class="cp-field-row" style="gap:6px;flex-wrap:wrap;">
        ${temSimCap ? '<span class="badge badge-info">capacidade simulada</span>' : ''}
        ${temChoque ? '<span class="badge badge-warning">choque de preço ativo</span>' : ''}
        <button class="btn btn-secondary btn-sm" onclick="impExpandirTudo(true)">▼ Abrir tudo</button>
        <button class="btn btn-secondary btn-sm" onclick="impExpandirTudo(false)">▲ Fechar tudo</button>
        <button class="btn btn-secondary btn-sm" onclick="impZerarTudo()">↺ Voltar ao planejado</button>
      </div>
    </div>
  </div>`
    + sec('capacidade', '🏭 Turnos e paradas', _impControlesCapacidade(), 'o que muda na disponibilidade deste mês')
    + sec('choques', '💥 Choques de preço', _impControlesChoque(imp), 'e se a MP subir, o dissídio vier, o concorrente derrubar o preço?')
    + sec('narrativa', '📌 O que essa mudança provoca', _impNarrativa(rPlan, rAj, P, A), 'em português, sem tabela')
    + sec('decisao', '🎯 Resultado da simulação', _impPainelDecisao(P, A, temAlgo, temSimCap, temChoque), 'planejado × ajustado')
    + sec('produto', '📦 Impacto produto por produto', _impTabelaPorProduto(rPlan, rAj), 'o total esconde quem apanhou')
    + sec('fixo', '🧱 O fixo que continua correndo', _impFixo(P, A, rPlan, rAj), 'parada não zera gente')
    + sec('pe', '⚖️ Ponto de equilíbrio antes e depois', _impPontoEquilibrio(rPlan, rAj), 'a produção ajustada ainda paga o fixo?')
    + sec('hora', '⏱️ Margem por hora de linha', _impRankingHora(rAj), 'se for pra parar algo, pare o que rende menos')
    + sec('repasse', '🏷️ Repasse necessário', _impRepasse(rPlan, rAj), 'quanto o preço precisa subir pra manter a margem')
    + sec('cenarios', '🗂️ Cenários lado a lado', _impCenarios(imp, A), `${imp.cenarios.length} salvo(s) nesta sessão`)
    + sec('limite', '🎚️ Quanto eu aguento?', _impLimites(imp), 'o sistema acha o limite em vez de você tentar');
}

/* ---------- 1 + 3: painel de decisão ---------- */
function _impPainelDecisao(P, A, temAlgo, temSimCap, temChoque) {
  const dRes = A.resultado - P.resultado;
  const dMC = A.mc - P.mc;
  const dVar = A.variavel - P.variavel;
  const economia = -dVar;                 // custo variável que deixou de ser gasto
  const perda = -dMC;                     // margem de contribuição que deixou de existir
  const corRes = Math.abs(dRes) < 1 ? '#64748b' : (dRes > 0 ? '#15803d' : 'var(--danger)');

  const veredito = !temAlgo
    ? `<p class="cp-ajuda" style="margin:0;">Nenhuma simulação ativa — os dois lados são iguais. Mexa nos turnos ou nos choques de preço abaixo.</p>`
    : `<p style="margin:0;font-size:13.5px;line-height:1.65;color:var(--text);">
        ${economia > 0 ? `Você <strong>economiza ${fmtBRL(economia)}</strong> de custo variável` : `Seu custo variável <strong>aumenta ${fmtBRL(-economia)}</strong>`}
        e <strong style="color:var(--danger);">perde ${fmtBRL(Math.max(0, perda))}</strong> de margem de contribuição.
        Resultado da decisão: <strong style="color:${corRes};font-size:15px;">${dRes > 0 ? '+' : ''}${fmtBRL(dRes)} no mês</strong>
        ${dRes < 0 ? '— a economia não paga a produção que deixa de sair.' : dRes > 0 ? '— a mudança se paga.' : '.'}
      </p>`;

  const avisoFat = state.faturamentoManual.ativo
    ? alertBox('atencao', '⚠️ <strong>Faturamento manual está ligado.</strong> O Alvo usa o valor digitado e por isso <em>não reage</em> a esta simulação. Para o Alvo responder, desligue o faturamento manual na aba 🎯 Metas &amp; Produção.')
    : '';

  const kpi = (rot, valor, sub, cor) => `<div class="card cp-card"><div class="cp-kpi-linha"><span>${rot}</span><strong ${cor ? `style="color:${cor};"` : ''}>${valor}</strong></div>${sub ? `<div class="cp-muted" style="font-size:11px;margin-top:2px;">${sub}</div>` : ''}</div>`;
  const sinal = (v, fmt) => `${v > 0 ? '+' : ''}${fmt(v)}`;

  return `<div>
    ${veredito}
    ${avisoFat}
    <div class="cp-grid-cards" style="margin-top:12px;">
      ${kpi('Resultado (margem − fixo)', sinal(A.resultado - P.resultado, fmtBRL), `${fmtBRL(P.resultado)} → ${fmtBRL(A.resultado)}`, Math.abs(A.resultado - P.resultado) < 1 ? null : (A.resultado > P.resultado ? '#15803d' : 'var(--danger)'))}
      ${kpi('Margem de contribuição', sinal(A.mc - P.mc, fmtBRL), `${fmtBRL(P.mc)} → ${fmtBRL(A.mc)}`, Math.abs(A.mc - P.mc) < 1 ? null : (A.mc > P.mc ? '#15803d' : 'var(--danger)'))}
      ${kpi('Custo por tonelada', sinal(A.custoTon - P.custoTon, fmtBRL), `${fmtBRL(P.custoTon)} → ${fmtBRL(A.custoTon)}`, Math.abs(A.custoTon - P.custoTon) < 0.01 ? null : (A.custoTon < P.custoTon ? '#15803d' : 'var(--danger)'))}
      ${kpi('Tonelagem', sinal(A.ton - P.ton, (v) => fmtNum(v, 1) + ' ton'), `${fmtNum(P.ton, 1)} → ${fmtNum(A.ton, 1)} ton`, Math.abs(A.ton - P.ton) < 0.05 ? null : (A.ton > P.ton ? '#15803d' : 'var(--danger)'))}
      ${kpi('Alvo (custo ÷ faturamento)', fmtPct(A.alvo, 2), `de ${fmtPct(P.alvo, 2)} · teto ${state.alvoMaximoPct}%`, A.dentroDoAlvo ? '#15803d' : 'var(--danger)')}
    </div>
    <div class="table-wrap" style="margin-top:12px;"><table>
      <thead><tr><th>Indicador</th><th>Planejado</th><th>Ajustado</th><th>Diferença</th></tr></thead>
      <tbody>
        ${_impLinhaCmp('Tonelagem', P.ton, A.ton, (v) => fmtNum(v, 1) + ' t', 'maiorMelhor')}
        ${_impLinhaCmp('Faturamento', P.faturamento, A.faturamento, fmtBRL, 'maiorMelhor')}
        ${_impLinhaCmp('Custo variável', P.variavel, A.variavel, fmtBRL, 'menorMelhor', 'cai junto com a produção')}
        ${_impLinhaCmp('Custo fixo', P.fixo, A.fixo, fmtBRL, 'menorMelhor', 'continua correndo mesmo parado')}
        ${_impLinhaCmp('Custo total', P.custo, A.custo, fmtBRL, 'menorMelhor')}
        ${_impLinhaCmp('Custo por tonelada', P.custoTon, A.custoTon, fmtBRL, 'menorMelhor')}
        ${_impLinhaCmp('Margem de contribuição', P.mc, A.mc, fmtBRL, 'maiorMelhor')}
        ${_impLinhaCmp('Resultado operacional', P.resultado, A.resultado, fmtBRL, 'maiorMelhor', 'margem de contribuição − custo fixo')}
        ${_impLinhaCmp('Alvo', P.alvo, A.alvo, (v) => fmtPct(v, 2), 'menorMelhor')}
      </tbody>
    </table></div>
    ${!A.dentroDoAlvo && P.dentroDoAlvo ? alertBox('critico', '⚠️ Essa mudança faria o Alvo estourar o teto — hoje está dentro, ajustado ficaria fora.') : ''}
  </div>`;
}

  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px;align-items:start;">`
    + state.blocos.map((bloco) => `<div class="card cp-card" style="margin:0;">
    <strong style="color:var(--primary);">🏭 ${esc(bloco.linhaNome || '(sem nome)')}</strong>
    ${(bloco.secoes || []).map((secao) => `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);">
      <div class="cp-field-row"><span style="flex:1;font-weight:600;">${esc(secao.turnoNome || '(sem turno)')}</span>
        <label class="cp-check-sim"><input type="checkbox" ${secao.simuladoDesligado ? 'checked' : ''} onchange="toggleSimuladoDesligado('${bloco.id}','${secao.id}', this.checked)"> Parar totalmente o mês</label>
      </div>
      <div class="cp-field-row" style="margin-top:4px;">
        <span class="cp-muted" style="min-width:110px;">Reduzir disponibilidade em</span>
        <input class="form-input cp-input-sm" type="number" min="0" max="100" step="5" value="${secao.simuladoReducaoPct || 0}" ${secao.simuladoDesligado ? 'disabled' : ''} onchange="setSimuladoReducaoPct('${bloco.id}','${secao.id}', this.value)">
        <span class="cp-muted">%</span>
      </div>
      <div class="cp-field-row" style="margin-top:4px;">
        <span class="cp-muted" style="min-width:110px;">Ficar parado</span>
        <input class="form-input cp-input-sm" type="number" min="0" step="1" value="${secao.simuladoDiasParados || 0}" ${secao.simuladoDesligado ? 'disabled' : ''} onchange="setSimuladoDiasParados('${bloco.id}','${secao.id}', this.value)">
        <span class="cp-muted">dias no mês</span>
      </div>
      <div class="cp-field-row" style="margin-top:4px;flex-wrap:wrap;align-items:center;">
        <span class="cp-muted" style="min-width:110px;">Ou parar de</span>
        <input class="form-input cp-input-sm" type="date" value="${secao.simuladoParadaInicio || ''}" ${secao.simuladoDesligado ? 'disabled' : ''} onchange="setSimuladoParadaData('${bloco.id}','${secao.id}','inicio', this.value)">
        <span class="cp-muted">até</span>
        <input class="form-input cp-input-sm" type="date" value="${secao.simuladoParadaFim || ''}" ${secao.simuladoDesligado ? 'disabled' : ''} onchange="setSimuladoParadaData('${bloco.id}','${secao.id}','fim', this.value)">
        ${(secao.simuladoParadaInicio && secao.simuladoParadaFim) ? `<span class="badge badge-info" style="margin-left:4px;">${contarDiasTrabalhoIntervalo(state.calendario, secao.simuladoParadaInicio, secao.simuladoParadaFim)} dia(s) útil(eis) parado(s)</span><button class="cp-fechar-btn" onclick="limparSimuladoParadaData('${bloco.id}','${secao.id}')" title="Limpar período">✕</button>` : ''}
      </div>
      <div class="cp-field-row" style="margin-top:4px;">
        <span class="cp-muted" style="min-width:110px;">Perder</span>
        <input class="form-input cp-input-sm" type="number" min="0" step="1" value="${secao.simuladoHorasReduzidas || 0}" ${secao.simuladoDesligado ? 'disabled' : ''} onchange="setSimuladoHorasReduzidas('${bloco.id}','${secao.id}', this.value)">
        <span class="cp-muted">horas de disponibilidade</span>
      </div>
    </div>`).join('') || '<p class="cp-ajuda">Nenhum turno nesta linha.</p>'}
  </div>`).join('') + `</div>`;
}

/* ---------- 7: choques de preço ---------- */
function _impControlesChoque(imp) {
  const linhas = _IMP_CHOQUES.map((c) => {
    const v = Number(imp.choque[c.id]) || 0;
    const cor = v === 0 ? '#64748b' : (c.id === 'venda' ? (v < 0 ? 'var(--danger)' : '#15803d') : (v > 0 ? 'var(--danger)' : '#15803d'));
    return `<tr>
      <td><strong>${c.lbl}</strong>${c.dica ? `<div class="cp-muted" style="font-size:11px;">${c.dica}</div>` : ''}</td>
      <td style="white-space:nowrap;">
        <button class="cp-stepper-btn" onclick="impAddChoque('${c.id}', -5)" title="−5%">−5</button>
        <input class="form-input cp-input-sm" type="number" step="0.5" value="${v}" style="width:78px;text-align:right;color:${cor};font-weight:700;" onchange="impSetChoque('${c.id}', this.value)">
        <span class="cp-muted">%</span>
        <button class="cp-stepper-btn" onclick="impAddChoque('${c.id}', 5)" title="+5%">+5</button>
      </td>
    </tr>`;
  }).join('');
  return `<p class="cp-ajuda">Percentual sobre o preço atual de cada família de custo. Positivo = mais caro. Em <strong>Preço de venda</strong>, negativo é queda de preço (pressão do concorrente). Os choques se somam à simulação de capacidade acima.</p>
    <div class="table-wrap"><table><thead><tr><th>Família</th><th>Variação</th></tr></thead><tbody>${linhas}</tbody></table></div>
    <div class="cp-field-row" style="margin-top:10px;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-secondary btn-sm" onclick="impSetChoque('mp',10)">MP +10%</button>
      <button class="btn btn-secondary btn-sm" onclick="impSetChoque('folha',8)">Dissídio +8%</button>
      <button class="btn btn-secondary btn-sm" onclick="impSetChoque('energia',15)">Energia +15%</button>
      <button class="btn btn-secondary btn-sm" onclick="impSetChoque('venda',-5)">Venda −5%</button>
      <button class="btn btn-ghost btn-sm" onclick="impZerarChoques()">↺ Zerar choques</button>
    </div>
    <p class="cp-ajuda" style="margin-top:8px;">O choque de folha é aplicado sobre a folha inteira (via fator de encargos) — o cartão-alimentação, que é % do salário, acompanha sozinho. Nada disso altera a configuração salva: é temporário, só pra esta conta.</p>`;
}

/* ---------- mensagem em português: o que a mudança provoca ----------
   Uma tabela mostra o número; ela não explica por que o número é aquele.
   Esta seção conta a frase que a pessoa levaria pra reunião. */
function _impDescricaoParadas(rPlan, rAj) {
  const horasP = {}, horasA = {};
  (rPlan.producao.detalhes || []).forEach((d) => { horasP[d.secaoId] = d.horasDispSecao || 0; });
  (rAj.producao.detalhes || []).forEach((d) => { horasA[d.secaoId] = d.horasDispSecao || 0; });
  const itens = [];
  (state.blocos || []).forEach((bloco) => (bloco.secoes || []).forEach((sec) => {
    if (!_impSecaoSimulada(sec)) return;
    const partes = [];
    if (sec.simuladoDesligado) partes.push('parado o mês inteiro');
    else {
      if (sec.simuladoReducaoPct > 0) partes.push(`disponibilidade reduzida em ${fmtNum(sec.simuladoReducaoPct, 0)}%`);
      const diasPeriodo = contarDiasTrabalhoIntervalo(state.calendario, sec.simuladoParadaInicio, sec.simuladoParadaFim);
      const diasTotal = (Number(sec.simuladoDiasParados) || 0) + diasPeriodo;
      if (diasTotal > 0) partes.push(`parado ${fmtNum(diasTotal, 0)} dia${diasTotal > 1 ? 's' : ''} útil${diasTotal > 1 ? 'eis' : ''}${diasPeriodo > 0 ? ' (pelo período informado)' : ''}`);
      if (sec.simuladoHorasReduzidas > 0) partes.push(`${fmtNum(sec.simuladoHorasReduzidas, 0)} h de disponibilidade perdidas`);
    }
    const hP = horasP[sec.id] || 0, hA = horasA[sec.id] || 0;
    itens.push({
      secao: sec, linhaNome: bloco.linhaNome, turnoNome: sec.turnoNome,
      texto: partes.join(' + '), horasPlan: hP, horasAj: hA, horasPerdidas: hP - hA,
      diasParados: (Number(sec.simuladoDiasParados) || 0) + contarDiasTrabalhoIntervalo(state.calendario, sec.simuladoParadaInicio, sec.simuladoParadaFim),
    });
  }));
  return itens;
}

function _impNarrativa(rPlan, rAj, P, A) {
  const imp = _impState();
  const paradas = _impDescricaoParadas(rPlan, rAj);
  const choques = Object.keys(imp.choque).filter((k) => Number(imp.choque[k]) !== 0)
    .map((k) => ({ id: k, lbl: (_IMP_CHOQUES.find((x) => x.id === k) || {}).lbl || k, pct: Number(imp.choque[k]) }));

  if (!paradas.length && !choques.length) {
    return `<p class="cp-ajuda" style="margin:0;">Nada simulado ainda. Marque uma parada num turno acima — ou mexa num choque de preço — e aqui aparece, em texto corrido, o que aquilo provoca no mês.</p>`;
  }

  // ── o que foi mexido
  const listaMexida = `<ul style="margin:0 0 12px 18px;font-size:13px;line-height:1.7;">
    ${paradas.map((p) => `<li><strong>${esc(p.linhaNome)} · ${esc(p.turnoNome || 'turno')}</strong> — ${p.texto}
      <span class="cp-muted">(${fmtNum(p.horasPlan, 1)} h → ${fmtNum(p.horasAj, 1)} h disponíveis${p.horasPerdidas > 0.05 ? `, ${fmtNum(p.horasPerdidas, 1)} h a menos` : ''})</span></li>`).join('')}
    ${choques.map((c) => `<li><strong>${esc(c.lbl)}</strong> ${c.pct > 0 ? '+' : ''}${fmtNum(c.pct, 2)}%</li>`).join('')}
  </ul>`;

  // ── o que deixou de sair, produto por produto
  const perdas = BUCKETS_CUSTO.map((b) => {
    const qP = _impQtd(rPlan, b), qA = _impQtd(rAj, b);
    return { b, qP, qA, d: qA - qP, tonP: rPlan.plano.tonelagem['ton' + b] || 0, tonA: rAj.plano.tonelagem['ton' + b] || 0 };
  }).filter((x) => Math.abs(x.d) > 0.5);

  const frasePerda = perdas.length
    ? `Deixam de sair ${perdas.map((x) => `<strong>${fmtNum(Math.abs(x.d), 0)} ${UNIDADE_LABEL[x.b]}(s) de ${DESTINOS[x.b]}</strong>`).join(' e ')}
       — ${fmtNum(Math.abs(A.ton - P.ton), 1)} tonelada(s) a menos no mês (${fmtPct((A.ton - P.ton) / (P.ton || 1), 2)}).`
    : (paradas.length
      ? `<strong>A produção não caiu.</strong> Havia folga de capacidade nesses turnos, então a demanda planejada continuou sendo atendida mesmo com menos horas — só o custo de tempo (lenha, energia) muda. Se a intenção era medir perda de volume, aumente a parada ou confira se há demanda cadastrada acima da capacidade.`
      : `O volume não muda: choque de preço não mexe em quanto sai da linha, só no que custa.`);

  // ── por que o custo por tonelada se move
  const dCustoTon = A.custoTon - P.custoTon;
  const dFixoTon = A.fixoPorTon - P.fixoPorTon;
  // A alta do custo/ton é a soma de dois efeitos de sinais opostos: o fixo se dilui
  // sobre menos tonelada (empurra pra cima) e o variável por tonelada pode cair.
  // Somar isso numa frase só produzia "parte maior que o todo".
  const varPorTonP = P.ton > 0 ? P.variavel / P.ton : 0;
  const varPorTonA = A.ton > 0 ? A.variavel / A.ton : 0;
  const dVarTon = varPorTonA - varPorTonP;
  const fraseCusto = Math.abs(dCustoTon) < 0.01
    ? 'O custo por tonelada praticamente não se move.'
    : `O custo por tonelada ${dCustoTon > 0 ? 'sobe' : 'cai'} <strong>${fmtBRL(Math.abs(dCustoTon))}</strong>
       (de ${fmtBRL(P.custoTon)} para ${fmtBRL(A.custoTon)})${Math.abs(dFixoTon) > 0.01
        ? `. Esse número é a soma de duas forças: o custo fixo de ${fmtBRL(A.fixo)} continua correndo e, rateado sobre menos tonelada,
           ${dFixoTon > 0 ? 'empurra' : 'alivia'} <strong>${dFixoTon > 0 ? '+' : '−'}${fmtBRL(Math.abs(dFixoTon))} por tonelada</strong>;
           o custo variável por tonelada ${Math.abs(dVarTon) < 0.005 ? 'fica praticamente igual' : `${dVarTon > 0 ? 'soma' : 'devolve'} ${dVarTon > 0 ? '+' : '−'}${fmtBRL(Math.abs(dVarTon))}`}`
        : ''}.`;

  // ── o resultado financeiro
  const dRes = A.resultado - P.resultado, dMC = A.mc - P.mc, economia = P.variavel - A.variavel;
  const fraseDinheiro = `${economia > 0.5 ? `A fábrica gasta <strong>${fmtBRL(economia)}</strong> menos de custo variável` : economia < -0.5 ? `O custo variável <strong>aumenta ${fmtBRL(-economia)}</strong>` : 'O custo variável fica praticamente igual'},
    mas a margem de contribuição ${dMC < 0 ? `<strong style="color:var(--danger);">perde ${fmtBRL(-dMC)}</strong>` : `<strong style="color:#15803d;">ganha ${fmtBRL(dMC)}</strong>`}.
    No fim do mês, o resultado fica <strong style="color:${dRes < 0 ? 'var(--danger)' : '#15803d'};font-size:14.5px;">${dRes > 0 ? '+' : ''}${fmtBRL(dRes)}</strong>
    ${dRes < -0.5 ? '— ou seja, a economia não paga o que deixa de ser produzido.' : dRes > 0.5 ? '— a mudança se paga.' : '.'}`;

  // ── alvo
  const fraseAlvo = state.faturamentoManual.ativo
    ? `O Alvo não se move porque o faturamento está sendo informado manualmente.`
    : `O Alvo sai de <strong>${fmtPct(P.alvo, 2)}</strong> para <strong style="color:${A.dentroDoAlvo ? '#15803d' : 'var(--danger)'};">${fmtPct(A.alvo, 2)}</strong> (teto de ${state.alvoMaximoPct}%)${A.dentroDoAlvo ? ' — segue dentro.' : P.dentroDoAlvo ? ' — <strong>estoura o teto</strong>.' : ' — já estava fora e continua.'}`;

  // ── repasse, quando houver perda de margem unitária
  const repasses = BUCKETS_CUSTO.map((b) => {
    const falta = (rPlan.margem[b].margemRS || 0) - (rAj.margem[b].margemRS || 0);
    const preco = rAj.precoVenda[b] || 0;
    return { b, falta, pct: preco > 0 ? falta / preco : 0, qtd: _impQtd(rAj, b) };
  }).filter((x) => x.falta >= 0.005 && x.pct >= 0.001 && x.qtd > 0).sort((a, b) => b.pct - a.pct);
  const fraseRepasse = repasses.length
    ? `Para a margem unitária voltar ao que era, ${DESTINOS[repasses[0].b]} precisaria subir <strong>${fmtPct(repasses[0].pct, 2)}</strong> (${fmtBRL(repasses[0].falta)} por ${UNIDADE_LABEL[repasses[0].b]})${repasses.length > 1 ? `, e há mais ${repasses.length - 1} produto(s) na mesma situação` : ''}.`
    : '';

  // ── ponto de equilíbrio furado
  const furados = BUCKETS_CUSTO.filter((b) => { const q = _impQtd(rAj, b); const pe = rAj.pontoEquilibrio[b]; return q > 1e-9 && (!isFinite(pe) || q < pe); });
  const frasePE = furados.length
    ? `<div style="margin-top:10px;">${alertBox('critico', `Com essa mudança, ${furados.map((b) => `<strong>${DESTINOS[b]}</strong>`).join(' e ')} ${furados.length > 1 ? 'ficam' : 'fica'} abaixo do ponto de equilíbrio: a produção ajustada não cobre o custo fixo alocado.`)}</div>`
    : '';

  // ── aviso honesto sobre como o motor conta "dias parados"
  const avisos = [];
  const comDias = paradas.filter((p) => !p.secao.simuladoDesligado && p.diasParados > 0);
  if (comDias.length) {
    const p = comDias[0];
    const turno = (state.turnosReais || []).find((t) => t.nome === p.turnoNome);
    const hh = calcHorasSecao(state.calendario, turno, p.secao.eficiencia, p.secao.extras, (p.secao.paradas || []).reduce((a, x) => a + (Number(x.horas) || 0), 0), state.horasDomingoEspecial);
    if (hh.diasTrabalho > 0 && hh.liquidoH > 0) {
      const brutoDia = hh.horasBrutas / hh.diasTrabalho, liqDia = hh.liquidoH / hh.diasTrabalho;
      if (brutoDia - liqDia > 0.05) {
        avisos.push(`Um detalhe de leitura: cada "dia parado" desconta ${fmtNum(brutoDia, 2)} h (a jornada cheia) de uma disponibilidade que já está líquida de eficiência, onde o dia vale ${fmtNum(liqDia, 2)} h. Na prática, 1 dia parado está pesando como <strong>${fmtNum(brutoDia / liqDia, 2)} dia</strong>. A perda mostrada aqui é, portanto, conservadora (pessimista).`);
      }
    }
    avisos.push(`Parada por dias ou por percentual <strong>não reduz o consumo de lenha</strong> — hoje só "parar totalmente o mês" zera a lenha do turno. Em parada parcial, o custo de lenha aqui está integral.`);
  }

  return `<div style="font-size:13.5px;line-height:1.75;">
    <div class="cp-muted" style="font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.05em;margin-bottom:6px;">Você está simulando</div>
    ${listaMexida}
    <div class="cp-muted" style="font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.05em;margin-bottom:6px;">O que acontece</div>
    <p style="margin:0 0 8px;">${frasePerda}</p>
    <p style="margin:0 0 8px;">${fraseCusto}</p>
    <p style="margin:0 0 8px;">${fraseDinheiro}</p>
    <p style="margin:0 0 8px;">${fraseAlvo}</p>
    ${fraseRepasse ? `<p style="margin:0 0 8px;">${fraseRepasse}</p>` : ''}
    ${frasePE}
    ${avisos.length ? `<div style="margin-top:10px;">${alertBox('atencao', avisos.map((a) => `<div style="margin-bottom:4px;">⚠️ ${a}</div>`).join(''))}</div>` : ''}
  </div>`;
}

/* ---------- 2: impacto produto por produto ---------- */
function _impTabelaPorProduto(rPlan, rAj) {
  const linhas = BUCKETS_CUSTO.map((b) => {
    const qP = _impQtd(rPlan, b), qA = _impQtd(rAj, b);
    if (qP < 1e-9 && qA < 1e-9) return '';
    const un = UNIDADE_LABEL[b];
    const mP = rPlan.margem[b].margemRS || 0, mA = rAj.margem[b].margemRS || 0;
    const lucroP = mP * qP, lucroA = mA * qA;
    const dLucro = lucroA - lucroP;
    const intacto = Math.abs(dLucro) < 1;
    const corL = intacto ? '#64748b' : (dLucro > 0 ? '#15803d' : 'var(--danger)');
    const par = (a, bb, fmt, sentido) => {
      const d = bb - a;
      const bom = sentido === 'menorMelhor' ? d < 0 : d > 0;
      const cor = Math.abs(d) < 1e-9 ? '#64748b' : (bom ? '#15803d' : 'var(--danger)');
      return `${fmt(a)} <span class="cp-muted">→</span> <strong style="color:${cor};">${fmt(bb)}</strong>`;
    };
    return `<tr>
      <td><strong>${DESTINOS[b]}</strong>${intacto && (qP > 0) ? '<div><span class="badge badge-gray">não afetado</span></div>' : ''}</td>
      <td class="cp-num">${par(qP, qA, (v) => fmtNum(v, 0), 'maiorMelhor')}<div class="cp-muted" style="font-size:11px;">${un}(s)</div></td>
      <td class="cp-num">${par(rPlan.plano.custoPorTon[b] || 0, rAj.plano.custoPorTon[b] || 0, fmtBRL, 'menorMelhor')}<div class="cp-muted" style="font-size:11px;">por tonelada</div></td>
      <td class="cp-num">${par(mP, mA, fmtBRL, 'maiorMelhor')}<div class="cp-muted" style="font-size:11px;">por ${un}</div></td>
      <td class="cp-num">${fmtBRL(lucroP)} <span class="cp-muted">→</span> <strong>${fmtBRL(lucroA)}</strong></td>
      <td class="cp-num" style="color:${corL};font-weight:800;white-space:nowrap;">${dLucro > 0 ? '+' : ''}${fmtBRL(dLucro)}${Math.abs(lucroP) > 1e-9 && !intacto ? `<div style="font-size:11px;font-weight:600;">${dLucro > 0 ? '+' : ''}${fmtNum((dLucro / Math.abs(lucroP)) * 100, 1)}%</div>` : ''}</td>
    </tr>`;
  }).join('');

  const totP = BUCKETS_CUSTO.reduce((a, b) => a + (rPlan.margem[b].margemRS || 0) * _impQtd(rPlan, b), 0);
  const totA = BUCKETS_CUSTO.reduce((a, b) => a + (rAj.margem[b].margemRS || 0) * _impQtd(rAj, b), 0);
  const dTot = totA - totP;

  // Quem apanhou mais, em uma frase.
  const rank = BUCKETS_CUSTO.map((b) => ({ b, d: (rAj.margem[b].margemRS || 0) * _impQtd(rAj, b) - (rPlan.margem[b].margemRS || 0) * _impQtd(rPlan, b) }))
    .filter((x) => x.d < -1).sort((a, b) => a.d - b.d);

  return `<p class="cp-ajuda">Cada célula mostra <strong>planejado → ajustado</strong>. A última coluna é o que interessa: quanto de lucro do mês cada produto ganhou ou perdeu com a decisão.</p>
    ${rank.length ? alertBox(rank[0].d < -0.35 * Math.abs(totP) ? 'critico' : 'atencao', `Quem mais apanha é <strong>${DESTINOS[rank[0].b]}</strong>: ${fmtBRL(rank[0].d)} de lucro no mês${rank[1] ? `, seguido de ${DESTINOS[rank[1].b]} (${fmtBRL(rank[1].d)})` : ''}.`) : ''}
    <div class="table-wrap"><table>
      <thead><tr><th>Produto</th><th>Quantidade</th><th>Custo/tonelada</th><th>Margem unitária</th><th>Lucro do mês</th><th>Δ Lucro</th></tr></thead>
      <tbody>${linhas}</tbody>
      <tfoot><tr style="background:#f8fafc;font-weight:800;">
        <td colspan="4">TOTAL — margem de contribuição</td>
        <td class="cp-num">${fmtBRL(totP)} <span class="cp-muted">→</span> ${fmtBRL(totA)}</td>
        <td class="cp-num" style="color:${Math.abs(dTot) < 1 ? '#64748b' : (dTot > 0 ? '#15803d' : 'var(--danger)')};">${dTot > 0 ? '+' : ''}${fmtBRL(dTot)}</td>
      </tr></tfoot>
    </table></div>`;
}

/* ---------- 4: o fixo que continua correndo ---------- */
function _impFixo(P, A, rPlan, rAj) {
  const dFixoTon = A.fixoPorTon - P.fixoPorTon;
  const porProduto = BUCKETS_CUSTO.map((b) => {
    const fP = rPlan.plano.porClassificacao[b].FIXO, fA = rAj.plano.porClassificacao[b].FIXO;
    const tP = rPlan.plano.tonelagem['ton' + b] || 0, tA = rAj.plano.tonelagem['ton' + b] || 0;
    if (tP < 1e-9 && tA < 1e-9) return '';
    const uP = tP > 0 ? fP / tP : 0, uA = tA > 0 ? fA / tA : 0;
    return `<tr><td>${DESTINOS[b]}</td>
      <td class="cp-num">${fmtBRL(fP)} <span class="cp-muted">→</span> ${fmtBRL(fA)}</td>
      <td class="cp-num">${fmtNum(tP, 1)} <span class="cp-muted">→</span> ${fmtNum(tA, 1)} t</td>
      ${_impCel(uP, uA, fmtBRL, 'menorMelhor')}</tr>`;
  }).join('');

  return `<p class="cp-ajuda">Parar turno não manda gente embora e não devolve arrendamento: o custo fixo continua correndo e passa a ser rateado sobre menos tonelada — <strong>é por isso que o custo por tonelada sobe quando se produz menos</strong>.${Math.abs(A.fixo - P.fixo) > 1 ? ` <strong>Nesta simulação o próprio fixo mudou</strong> (${fmtBRL(P.fixo)} → ${fmtBRL(A.fixo)}) — isso só acontece quando o choque mexe em algo classificado como fixo, como a folha administrativa.` : ''}</p>
    <div class="cp-grid-cards" style="margin-bottom:12px;">
      <div class="card cp-card"><div class="cp-kpi-linha"><span>Custo fixo do mês</span><strong>${fmtBRL(A.fixo)}</strong></div><div class="cp-muted" style="font-size:11px;">continua correndo${Math.abs(A.fixo - P.fixo) > 1 ? ` (era ${fmtBRL(P.fixo)})` : ''}</div></div>
      <div class="card cp-card"><div class="cp-kpi-linha"><span>Rateado sobre</span><strong>${fmtNum(A.ton, 1)} ton</strong></div><div class="cp-muted" style="font-size:11px;">planejado: ${fmtNum(P.ton, 1)} ton</div></div>
      <div class="card cp-card"><div class="cp-kpi-linha"><span>Fixo por tonelada</span><strong style="color:${dFixoTon > 0.01 ? 'var(--danger)' : '#15803d'};">${fmtBRL(A.fixoPorTon)}</strong></div><div class="cp-muted" style="font-size:11px;">${dFixoTon > 0 ? '+' : ''}${fmtBRL(dFixoTon)} por tonelada de diluição</div></div>
    </div>
    ${Math.abs(dFixoTon) > 0.01 ? alertBox('atencao', `Cada tonelada que deixa de sair joga <strong>${fmtBRL(Math.abs(dFixoTon))}</strong> de custo fixo em cima das que continuam saindo.`) : ''}
    <div class="table-wrap"><table>
      <thead><tr><th>Produto</th><th>Fixo alocado</th><th>Tonelagem</th><th>Fixo/ton planejado</th><th>Ajustado</th><th>Diferença</th></tr></thead>
      <tbody>${porProduto}</tbody>
    </table></div>`;
}

/* ---------- 5: ponto de equilíbrio ---------- */
function _impPontoEquilibrio(rPlan, rAj) {
  const linhas = BUCKETS_CUSTO.map((b) => {
    const qA = _impQtd(rAj, b), qP = _impQtd(rPlan, b);
    if (qP < 1e-9 && qA < 1e-9) return '';
    const peP = rPlan.pontoEquilibrio[b], peA = rAj.pontoEquilibrio[b];
    const un = UNIDADE_LABEL[b];
    const abaixo = isFinite(peA) && qA < peA;
    const folga = isFinite(peA) ? qA - peA : null;
    return `<tr${abaixo ? ' style="background:#fff1f2;"' : ''}>
      <td><strong>${DESTINOS[b]}</strong></td>
      <td class="cp-num">${isFinite(peP) ? fmtNum(peP, 0) : '—'}</td>
      <td class="cp-num"><strong style="color:${isFinite(peA) && isFinite(peP) && peA > peP ? 'var(--danger)' : 'inherit'};">${isFinite(peA) ? fmtNum(peA, 0) : '—'}</strong></td>
      <td class="cp-num">${fmtNum(qA, 0)} <span class="cp-muted">${un}(s)</span></td>
      <td class="cp-num">${folga == null ? '—' : `<strong style="color:${folga < 0 ? 'var(--danger)' : '#15803d'};">${folga > 0 ? '+' : ''}${fmtNum(folga, 0)}</strong>`}</td>
      <td>${!isFinite(peA) ? '<span class="badge badge-danger">margem ≤ 0</span>' : abaixo ? '<span class="badge badge-danger">abaixo do equilíbrio</span>' : '<span class="badge badge-success">paga o fixo</span>'}</td>
    </tr>`;
  }).join('');
  const furados = BUCKETS_CUSTO.filter((b) => { const q = _impQtd(rAj, b); const pe = rAj.pontoEquilibrio[b]; return q > 1e-9 && (!isFinite(pe) || q < pe); });
  return `<p class="cp-ajuda">Ponto de equilíbrio = quanto precisa ser vendido pra cobrir o custo fixo alocado naquele produto. Quando a produção ajustada fica abaixo dele, aquele produto passa a dar prejuízo no mês.</p>
    ${furados.length ? alertBox('critico', `${furados.length} produto(s) ficam <strong>abaixo do ponto de equilíbrio</strong> nesta simulação: ${furados.map((b) => DESTINOS[b]).join(', ')}.`) : alertBox('ok', 'Todos os produtos com produção seguem acima do ponto de equilíbrio.')}
    <div class="table-wrap"><table>
      <thead><tr><th>Produto</th><th>PE planejado</th><th>PE ajustado</th><th>Produção ajustada</th><th>Folga</th><th>Situação</th></tr></thead>
      <tbody>${linhas}</tbody>
    </table></div>`;
}

/* ---------- 6: margem por hora de linha ---------- */
function _impRankingHora(rAj) {
  const secoes = _impPorSecao(rAj).map((s) => {
    const bloco = (state.blocos || []).find((b) => b.id === s.blocoId);
    const secObj = bloco ? (bloco.secoes || []).find((x) => x.id === s.secaoId) : null;
    return { ...s, rsHora: s.horas > 0 ? s.mc / s.horas : 0, simulada: secObj ? _impSecaoSimulada(secObj) : false, secObj, blocoId: s.blocoId };
  }).sort((a, b) => b.rsHora - a.rsHora);

  if (!secoes.length) return '<p class="cp-ajuda">Nenhum turno com produção na simulação atual.</p>';
  const melhor = secoes[0], pior = secoes[secoes.length - 1];
  const maxRs = Math.max(...secoes.map((s) => s.rsHora), 1);

  const linhas = secoes.map((s, i) => `<tr${s.simulada ? ' style="background:#fefce8;"' : ''}>
    <td class="cp-num">${i + 1}º</td>
    <td><strong>${esc(s.linhaNome)}</strong><div class="cp-muted" style="font-size:11px;">${esc(s.turnoNome || '—')}</div></td>
    <td class="cp-num">${fmtNum(s.horas, 1)} h</td>
    <td class="cp-num">${fmtNum(s.ton, 1)} t</td>
    <td class="cp-num">${fmtBRL(s.mc)}</td>
    <td class="cp-num"><strong>${fmtBRL(s.rsHora)}</strong>
      <div class="bar" style="height:5px;border-radius:3px;background:#e2e8f0;margin-top:3px;"><i style="display:block;height:100%;border-radius:3px;width:${Math.max(2, (s.rsHora / maxRs) * 100)}%;background:${s.rsHora <= 0 ? 'var(--danger)' : i === 0 ? '#15803d' : '#0369a1'};"></i></div></td>
    <td>${s.simulada ? '<span class="badge badge-warning">simulada</span>' : ''}${s.rsHora <= 0 ? '<span class="badge badge-danger">não paga a hora</span>' : ''}</td>
    <td>${s.simulada ? '' : `<button class="btn btn-ghost btn-sm" onclick="toggleSimuladoDesligado('${s.blocoId}','${s.secaoId}', true)" title="Simular parada deste turno">⏸️ parar</button>`}</td>
  </tr>`).join('');

  return `<p class="cp-ajuda">Se for preciso sacrificar disponibilidade, o critério não é "qual turno produz menos" — é <strong>qual gera menos margem por hora disponível</strong>. A hora de linha é o recurso escasso.</p>
    ${secoes.length > 1 ? alertBox('atencao', `Hora mais rentável: <strong>${esc(melhor.linhaNome)} · ${esc(melhor.turnoNome || '—')}</strong> (${fmtBRL(melhor.rsHora)}/h). Menos rentável: <strong>${esc(pior.linhaNome)} · ${esc(pior.turnoNome || '—')}</strong> (${fmtBRL(pior.rsHora)}/h) — é por aí que se começa a cortar.`) : ''}
    <div class="table-wrap"><table>
      <thead><tr><th>#</th><th>Linha / turno</th><th>Horas disp.</th><th>Tonelagem</th><th>Margem gerada</th><th>Margem por hora</th><th></th><th></th></tr></thead>
      <tbody>${linhas}</tbody>
    </table></div>`;
}

/* ---------- 7b: repasse necessário ---------- */
function _impRepasse(rPlan, rAj) {
  const linhas = BUCKETS_CUSTO.map((b) => {
    const qA = _impQtd(rAj, b);
    if (qA < 1e-9) return '';
    const mP = rPlan.margem[b].margemRS || 0, mA = rAj.margem[b].margemRS || 0;
    const precoA = rAj.precoVenda[b] || 0;
    const falta = mP - mA;                       // R$ por unidade pra voltar à margem do plano
    const un = UNIDADE_LABEL[b];
    if (falta < 0.005) {
      return `<tr><td><strong>${DESTINOS[b]}</strong></td><td class="cp-num">${fmtBRL(precoA)}</td>
        <td class="cp-num">${fmtBRL(mA)}</td><td colspan="3"><span class="badge badge-success">margem preservada — sem repasse</span></td></tr>`;
    }
    const novoPreco = precoA + falta;
    const pct = precoA > 0 ? falta / precoA : 0;
    return `<tr><td><strong>${DESTINOS[b]}</strong><div class="cp-muted" style="font-size:11px;">por ${un}</div></td>
      <td class="cp-num">${fmtBRL(precoA)}</td>
      <td class="cp-num" style="color:var(--danger);">${fmtBRL(mA)}<div class="cp-muted" style="font-size:11px;">era ${fmtBRL(mP)}</div></td>
      <td class="cp-num"><strong>+${fmtBRL(falta)}</strong></td>
      <td class="cp-num"><strong style="color:var(--danger);">+${fmtPct(pct, 2)}</strong></td>
      <td class="cp-num"><strong>${fmtBRL(novoPreco)}</strong><div class="cp-muted" style="font-size:11px;">${fmtBRL(falta * qA)} no mês</div></td></tr>`;
  }).join('');
  const totalFalta = BUCKETS_CUSTO.reduce((a, b) => {
    const falta = (rPlan.margem[b].margemRS || 0) - (rAj.margem[b].margemRS || 0);
    return a + (falta > 0 ? falta * _impQtd(rAj, b) : 0);
  }, 0);
  return `<p class="cp-ajuda">Transforma o impacto de custo em decisão comercial: quanto cada produto precisa subir de preço para a margem unitária voltar ao que era no planejado.</p>
    ${totalFalta > 1 ? alertBox('atencao', `Para recompor a margem de todos os produtos, o repasse total precisa gerar <strong>${fmtBRL(totalFalta)}</strong> no mês.`) : ''}
    <div class="table-wrap"><table>
      <thead><tr><th>Produto</th><th>Preço atual</th><th>Margem ajustada</th><th>Repasse (R$)</th><th>Repasse (%)</th><th>Preço necessário</th></tr></thead>
      <tbody>${linhas}</tbody>
    </table></div>`;
}

/* ---------- 8: cenários lado a lado ---------- */
function _impCenarios(imp, A) {
  const cabecalho = imp.cenarios.map((c) => `<th style="min-width:120px;">${esc(c.nome)}
      <div style="font-weight:400;font-size:10px;opacity:.8;">${new Date(c.criadoEm).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</div></th>`).join('');
  const linha = (rot, pega, fmt, sentido) => {
    const atual = pega(A);
    return `<tr><td>${rot}</td>${imp.cenarios.map((c) => {
      const v = pega(c.resumo);
      const d = v - atual;
      const bom = sentido === 'menorMelhor' ? d < 0 : d > 0;
      const cor = Math.abs(d) < 1e-9 ? '#64748b' : (bom ? '#15803d' : 'var(--danger)');
      return `<td class="cp-num">${fmt(v)}<div style="font-size:10px;color:${cor};font-weight:700;">${Math.abs(d) < 1e-9 ? '=' : (d > 0 ? '+' : '') + fmt(d)}</div></td>`;
    }).join('')}<td class="cp-num cp-num-forte">${fmt(atual)}</td></tr>`;
  };
  const acoes = imp.cenarios.map((c) => `<td style="text-align:center;">
      <button class="btn btn-ghost btn-sm" onclick="impAplicarCenario('${c.id}')" title="Carregar este cenário">▶️</button>
      <button class="cp-fechar-btn" onclick="impRemoverCenario('${c.id}')" title="Remover">✕</button></td>`).join('');

  const resumoDoCenario = (c) => {
    const paradas = (c.capacidade || []).flatMap((b) => (b.secoes || [])
      .filter((s) => s.simuladoDesligado || s.simuladoReducaoPct > 0 || s.simuladoDiasParados > 0 || s.simuladoHorasReduzidas > 0 || (s.simuladoParadaInicio && s.simuladoParadaFim))
      .map((s) => `${b.linhaNome}/${s.turnoNome}${s.simuladoDesligado ? ' parado' : s.simuladoReducaoPct ? ` −${s.simuladoReducaoPct}%` : s.simuladoDiasParados ? ` ${s.simuladoDiasParados}d` : ''}`));
    const choques = Object.keys(c.choque).filter((k) => Number(c.choque[k]) !== 0)
      .map((k) => `${(_IMP_CHOQUES.find((x) => x.id === k) || {}).lbl || k} ${c.choque[k] > 0 ? '+' : ''}${c.choque[k]}%`);
    return [...paradas, ...choques].join(' · ') || 'sem alteração';
  };

  return `<p class="cp-ajuda">Salva a simulação atual inteira (paradas + choques) e compara com as outras. A última coluna é sempre a simulação que está na tela agora. Os cenários valem para esta sessão — não vão para o planejamento salvo.</p>
    <div class="cp-field-row" style="gap:8px;flex-wrap:wrap;margin-bottom:12px;">
      <input class="form-input" id="cp-imp-cen-nome" type="text" style="flex:1;min-width:220px;" placeholder="Nome do cenário (ex.: Parar turno 3 em agosto)">
      <button class="btn btn-primary btn-sm" onclick="impSalvarCenario(document.getElementById('cp-imp-cen-nome').value); document.getElementById('cp-imp-cen-nome').value='';">💾 Salvar simulação atual</button>
    </div>
    ${!imp.cenarios.length ? '<p class="cp-ajuda">Nenhum cenário salvo ainda. Monte uma simulação, dê um nome e salve — depois monte outra e compare as duas lado a lado.</p>' : `
    <div class="table-wrap"><table>
      <thead><tr><th>Indicador</th>${cabecalho}<th>Na tela agora</th></tr></thead>
      <tbody>
        ${linha('Tonelagem', (x) => x.ton, (v) => fmtNum(v, 1) + ' t', 'maiorMelhor')}
        ${linha('Custo total', (x) => x.custo, fmtBRL, 'menorMelhor')}
        ${linha('Custo/tonelada', (x) => x.custoTon, fmtBRL, 'menorMelhor')}
        ${linha('Faturamento', (x) => x.faturamento, fmtBRL, 'maiorMelhor')}
        ${linha('Margem de contribuição', (x) => x.mc, fmtBRL, 'maiorMelhor')}
        ${linha('Resultado operacional', (x) => x.resultado, fmtBRL, 'maiorMelhor')}
        ${linha('Alvo', (x) => x.alvo, (v) => fmtPct(v, 2), 'menorMelhor')}
        <tr><td>O que muda</td>${imp.cenarios.map((c) => `<td class="cp-muted" style="font-size:11px;">${esc(resumoDoCenario(c))}</td>`).join('')}<td></td></tr>
        <tr><td></td>${acoes}<td></td></tr>
      </tbody>
    </table></div>`}`;
}

/* ---------- 9: quanto eu aguento ---------- */
function _impLimites(imp) {
  const L = imp.limites;
  const cartao = (rot, valor, sub, cor) => `<div class="card cp-card"><div class="cp-kpi-linha"><span>${rot}</span><strong ${cor ? `style="color:${cor};"` : ''}>${valor}</strong></div><div class="cp-muted" style="font-size:11px;margin-top:2px;">${sub}</div></div>`;
  return `<p class="cp-ajuda">Em vez de tentar 3, 5 e 8 dias até o Alvo estourar, o sistema procura o limite. O cálculo parte sempre do <strong>planejado original</strong> (ignora a simulação que está na tela) e usa o teto de ${state.alvoMaximoPct}%.</p>
    <button class="btn btn-secondary btn-sm" onclick="impCalcularLimites()">🎚️ ${L ? 'Recalcular limites' : 'Calcular limites'}</button>
    ${!L ? '' : (L.partida > L.teto
      ? alertBox('critico', `O planejado já está fora do teto (${fmtPct(L.partida, 2)} contra ${fmtPct(L.teto, 2)}). Não há folga para simular: primeiro é preciso voltar para dentro do alvo.`)
      : `<div class="cp-grid-cards" style="margin-top:12px;">
          ${cartao('Parada máxima da fábrica', L.maxDias != null ? `${L.maxDias} dia(s) útil(eis)` : '—', `de ${L.diasUteis} dias úteis no mês, mantendo o alvo`, L.maxDias === 0 ? 'var(--danger)' : null)}
          ${cartao('Alta máxima de MP', L.maxMP != null ? `+${L.maxMP}%` : '—', 'antes de furar o teto de custo', L.maxMP === 0 ? 'var(--danger)' : null)}
          ${cartao('Queda máxima de preço', L.maxQueda != null ? `−${fmtNum(L.maxQueda, 1)}%` : '—', 'quanto o preço aguenta cair', L.maxQueda === 0 ? 'var(--danger)' : null)}
        </div>
        <p class="cp-ajuda" style="margin-top:10px;">Partida: alvo de <strong>${fmtPct(L.partida, 2)}</strong> no planejado. Os três limites são independentes — cada um assume que os outros dois não acontecem.</p>
        ${L.maxDias === 0 ? alertBox('atencao', 'O plano não aguenta nenhum dia de parada sem furar o alvo — a folga já está no limite.') : ''}`)}`;
}

/* ---------- impressão da aba ---------- */
function _printImpacto(r) {
  const rPlan = computarSemSimulacao(state);
  const rAj = _impResultadoAjustado(rPlan);
  const P = _impResumo(rPlan), A = _impResumo(rAj);
  const l = (label, a, b, fmt) => `<tr><td>${label}</td><td class="num">${fmt(a)}</td><td class="num">${fmt(b)}</td><td class="num">${(b - a) > 0 ? '+' : ''}${fmt(b - a)}</td></tr>`;
  const porProduto = BUCKETS_CUSTO.map((bk) => {
    const qP = _impQtd(rPlan, bk), qA = _impQtd(rAj, bk);
    if (qP < 1e-9 && qA < 1e-9) return '';
    const lucroP = (rPlan.margem[bk].margemRS || 0) * qP, lucroA = (rAj.margem[bk].margemRS || 0) * qA;
    return `<tr><td>${DESTINOS[bk]}</td><td class="num">${fmtNum(qP, 0)}</td><td class="num">${fmtNum(qA, 0)}</td>
      <td class="num">${fmtBRL(rPlan.plano.custoPorTon[bk] || 0)}</td><td class="num">${fmtBRL(rAj.plano.custoPorTon[bk] || 0)}</td>

  }).join('');
  const imp = _impState();
  const choques = Object.keys(imp.choque).filter((k) => Number(imp.choque[k]) !== 0)
    .map((k) => `${(_IMP_CHOQUES.find((x) => x.id === k) || {}).lbl || k}: ${imp.choque[k] > 0 ? '+' : ''}${imp.choque[k]}%`).join(' · ');

  return `<div class="secao"><h2>Simulação de impacto — Planejado × Ajustado</h2>
    ${choques ? `<p><strong>Choques aplicados:</strong> ${esc(choques)}</p>` : ''}

      (economia de custo variável ${fmtBRL(P.variavel - A.variavel)} contra ${fmtBRL(P.mc - A.mc)} de margem perdida).</p>
    <table><thead><tr><th>Indicador</th><th>Planejado</th><th>Ajustado</th><th>Diferença</th></tr></thead><tbody>
      ${l('Tonelagem (ton)', P.ton, A.ton, (v) => fmtNum(v, 1))}
      ${l('Custo variável', P.variavel, A.variavel, fmtBRL)}
      ${l('Custo fixo', P.fixo, A.fixo, fmtBRL)}
      ${l('Custo total', P.custo, A.custo, fmtBRL)}
      ${l('Custo/tonelada', P.custoTon, A.custoTon, fmtBRL)}
      ${l('Fixo por tonelada', P.fixoPorTon, A.fixoPorTon, fmtBRL)}
      ${l('Faturamento', P.faturamento, A.faturamento, fmtBRL)}
      ${l('Margem de contribuição', P.mc, A.mc, fmtBRL)}
      ${l('Resultado operacional', P.resultado, A.resultado, fmtBRL)}
      ${l('Alvo (%)', P.alvo * 100, A.alvo * 100, (v) => fmtNum(v, 2) + '%')}
    </tbody></table></div>
    <div class="secao"><h2>Impacto por produto</h2>
    <table><thead><tr><th>Produto</th><th>Qtd plan.</th><th>Qtd ajust.</th><th>Custo/t plan.</th><th>Custo/t ajust.</th><th>Lucro plan.</th><th>Lucro ajust.</th><th>Δ Lucro</th></tr></thead>
    <tbody>${porProduto || '<tr><td colspan="8">—</td></tr>'}</tbody></table></div>`;
}

function renderGeral(r) {

        ${(() => {

  if (state._tabelaPlanejamentosExiste === false) {

           <button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="excluirPlanejamento('${p.id}')" title="Mandar pra Lixeira">✕</button>`}

      <tbody>${linhasTabela}</tbody>

// Régua usada por este plano — gravada junto pra o histórico não mudar de número se as
// regras evoluírem depois. Serve como prova de como aquele custo foi calculado.
const REGUA_VERSAO = '2026-07-admin-tonelagem';
function _reguaDoPlano() {
  return {
    versao: REGUA_VERSAO,
    administrativo: 'valor cheio rateado por tonelagem',
    refeicao: 'por pessoa',
    epi: 'por pessoa',

  };
}
function serializarEstadoAtual() {
  return {
    mes: state.mes, ano: state.ano, calendario: state.calendario, feriadosLocais: state.feriadosLocais,
    horasDomingoEspecial: state.horasDomingoEspecial, blocos: state.blocos, mapaProduto: state.mapaProduto,
    produtosExtras: state.produtosExtras, produtosOcultos: state.produtosOcultos, pesos: state.pesos,
    margemAlvo: state.margemAlvo, equipeAdmin: state.equipeAdmin,
    mpCinza: state.mpCinza, refeicao: state.refeicao, cartaoAlimentacao: state.cartaoAlimentacao, filtroManga: state.filtroManga, lenha: state.lenha, arrendamento: state.arrendamento, stretch: state.stretch, itensMultiplos: state.itensMultiplos, desgaste: state.desgaste, regua: _reguaDoPlano(), energia: state.energia, fatorEncargos: state.fatorEncargos, alvoMaximoPct: state.alvoMaximoPct,
    precoVendaManual: state.precoVendaManual, faturamentoManual: state.faturamentoManual,
    insumos: state.insumos, cenarios: state.cenarios, escopos: state.escopos,
    _blocoSeq: state._blocoSeq, _secaoSeq: state._secaoSeq, _produtoSeq: state._produtoSeq, _cenarioSeq: state._cenarioSeq, _insumoSeq: state._insumoSeq,
    /* >>>>> ABA PLANEJADO x REALIZADO — BLOCO REMOVIVEL */
    realizado: state.realizado, realizadoObs: state.realizadoObs,
    realizadoHoras: state.realizadoHoras, realizadoParadas: state.realizadoParadas, realizadoInsumos: state.realizadoInsumos,
    realizadoInsumosRS: state.realizadoInsumosRS, compartRateado: state.compartRateado, _realLinhaId: state._realLinhaId,
    realAjusteQtd: state.realAjusteQtd, realAjusteVU: state.realAjusteVU,
    /* <<<<< FIM ABA PLANEJADO x REALIZADO */
  };
}
function aplicarEstadoSalvo(snap) {
  if (!snap) return;
  Object.keys(snap).forEach((k) => { state[k] = snap[k]; });
  // Preenche campos novos que planos antigos não tinham, com padrões seguros:
  /* >>>>> ABA PLANEJADO x REALIZADO — BLOCO REMOVIVEL */
  if (!state.realizado || typeof state.realizado !== 'object') state.realizado = {};
  if (!state.realizadoObs || typeof state.realizadoObs !== 'object') state.realizadoObs = {};
  if (!state.realizadoHoras || typeof state.realizadoHoras !== 'object') state.realizadoHoras = {};
  if (!state.realizadoParadas || typeof state.realizadoParadas !== 'object') state.realizadoParadas = {};
  if (!state.compartRateado || typeof state.compartRateado !== 'object') state.compartRateado = {};
  if (!state.realizadoInsumos || typeof state.realizadoInsumos !== 'object') state.realizadoInsumos = {};
  if (!state.realizadoInsumosRS || typeof state.realizadoInsumosRS !== 'object') state.realizadoInsumosRS = {};
  if (!state.realAjusteQtd || typeof state.realAjusteQtd !== 'object') state.realAjusteQtd = {};
  if (!state.realAjusteVU || typeof state.realAjusteVU !== 'object') state.realAjusteVU = {};
  state._real = null; state._realEscopo = '__TOTAL__';   // o realizado é do mês do plano: recarrega ao trocar de plano
  /* <<<<< FIM ABA PLANEJADO x REALIZADO */
  if (!(Number(state.fatorEncargos) > 0)) state.fatorEncargos = 1.00;
  // Arrendamento e Energia agora usam GRUPOS DE RATEIO. Migra formatos antigos:
  const migrarParaGrupos = (config, nomeGrupo) => {
    if (config && Array.isArray(config.grupos)) return config; // já novo formato
    const antigo = config || {};
    let valor = Number(antigo.valorTotal) || 0;
    if (!valor) valor = (Number(antigo.valorLongaVida) || 0) + (Number(antigo.valorOutrasLinhas) || 0); // formato bem antigo
    const blocoIds = (state.blocos || []).map((b) => b.id);
    const grupos = valor > 0 ? [{ id: 'g1', nome: nomeGrupo, valor, blocoIds }] : [];
    return { grupos };
  };
  state.arrendamento = migrarParaGrupos(state.arrendamento, 'Arrendamento');
  state.energia = migrarParaGrupos(state.energia, 'Energia');
  // ESCOPO DE LINHAS + GRUPOS EXTRA — plano salvo antes disso vem sem nada: {} significa
  // "todo item em todas as linhas", exatamente como era, então o número não muda.
  if (!state.escopos || typeof state.escopos !== 'object') state.escopos = {};
  {
    const idsAtuais = (state.blocos || []).map((b) => b.id);
    Object.keys(state.escopos).forEach((itemId) => {
      const e = state.escopos[itemId];
      if (!e || typeof e !== 'object' || !ESCOPO_IDS.includes(itemId)) { delete state.escopos[itemId]; return; }
      e.grupos = (Array.isArray(e.grupos) ? e.grupos : []).filter((g) => g && typeof g === 'object').map((g, i) => ({
        id: g.id || ('ge' + i + Math.floor(Math.random() * 1000)),
        nome: g.nome || ('Grupo ' + (i + 1)),
        valor: Number(g.valor) || 0,
        blocoIds: (Array.isArray(g.blocoIds) ? g.blocoIds : []).filter((id) => idsAtuais.includes(id)),
      })).filter((g) => g.blocoIds.length > 0);
      if (Array.isArray(e.blocoIds)) {
        const validos = e.blocoIds.filter((id) => idsAtuais.includes(id));
        // escopo que perdeu todas as linhas válidas (as linhas do plano mudaram) volta pra
        // "todas" — melhor recalcular certo do que zerar um custo real sem ninguém ver
        e.blocoIds = validos.length ? validos : null;
      } else e.blocoIds = null;
      if (e.blocoIds === null && !e.grupos.length) delete state.escopos[itemId];
    });
  }
  // pesos do desgaste (massa útil) — planos antigos não tinham
  if (!state.desgaste || typeof state.desgaste !== 'object') state.desgaste = JSON.parse(JSON.stringify(DESGASTE_PESOS_PADRAO));
  MATMOINHO_IDS.forEach((id) => {
    if (!state.desgaste[id]) state.desgaste[id] = { ...DESGASTE_PESOS_PADRAO[id] };
    if (state.desgaste[id].modo !== 'linha' && state.desgaste[id].modo !== 'fabrica') {
      state.desgaste[id].modo = DESGASTE_MODO_LINHA_FIXO.includes(id) ? 'linha' : 'fabrica';
    }
    // itens no modo "total do mês": limpa quantidade antiga deixada nas linhas (senão o
    // campo do total ficava escondido e a quantidade virava manual sem você pedir)
    if (state.desgaste[id].modo === 'fabrica') {
      (state.blocos || []).forEach((b) => { if (b.matMoinho) b.matMoinho[id] = 0; });
    }
  });
  // garante matMoinho por linha em planos antigos
  (state.blocos || []).forEach((b) => { if (!b.matMoinho) b.matMoinho = { martelo: 0, gaveta: 0, grelha: 0, eixos: 0 }; });
  _aplicarEspelhoRecolhidas(); // mantém as linhas recolhidas depois de recarregar a página
  if (!state.itensMultiplos) state.itensMultiplos = { epi: [], adm_geral: [], limpeza: [] };
  if (!state.stretch || typeof state.stretch.gramasPorPallet !== 'number') state.stretch = { gramasPorPallet: 360, precoPorGrama: 0.03 };
  // planos salvos com o valor antigo (25 g) sobem pro padrão real da fábrica (360 g por pallet)
  if (Number(state.stretch.gramasPorPallet) === 25) state.stretch.gramasPorPallet = 360;
  // remove cenários fixos antigos da planilha (Programado/Realizado Maio) que planos salvos ainda carregam
  if (Array.isArray(state.cenarios)) state.cenarios = state.cenarios.filter((c) => c.id !== 'programado_planilha' && c.id !== 'realizado_maio_planilha');
  // Reconcilia os insumos salvos com o esquema ATUAL — planos salvos numa versão anterior
  // do módulo podem ter campos antigos ou faltando (o modelo já mudou algumas vezes).
  // Isso preserva o que a pessoa editou, mas preenche o resto com os padrões de hoje,
  // em vez de deixar campo importante undefined (causa raiz de itens sumindo/zerados).
  if (snap.insumos) {
    const salvosPorId = {};
    snap.insumos.forEach((it) => { salvosPorId[it.id] = it; });
    state.insumos = INSUMOS_BASE.map((base) => {
      const fresh = {
        ...base,
        custoPorTonEditado: (base.tipoRateio !== 'direto' && !base.especial && !base.temPrecoQtd && base.classificacao !== 'FIXO') ? base.custoPorTon : null,
        valorMensalEditado: (!base.especial && base.classificacao === 'FIXO') ? base.valorMensal : null,
        fatorEditado: base.temPrecoQtd ? (base.qtdBaseReal / TONELAGEM_TOTAL_REAL_MAIO) : null,
        precoUnitarioEditado: (base.tipoRateio === 'direto' || base.qtdPrecoLivre) ? base.precoUnitarioEditado : null,
        quantidadeManualEditado: base.tipoRateio === 'direto' && base.formulaQtd === 'manual' ? (base.quantidadeManual || 0) : null,
        sacosPorPalletEditado: base.tipoRateio === 'direto' && base.formulaQtd === 'pallet' ? base.sacosPorPallet : null,
        quantidadeLivreEditada: base.qtdPrecoLivre ? base.quantidadeLivre : null,
        historico3m: null,
        pctManual: null,
        valorOverrideManual: null,
        removido: null,
        naturezaId: null, centroCustoId: null, precoUnitarioRef: null, pesoUnidadeRef: null,
      };
      const salvo = salvosPorId[base.id];
      if (!salvo) return fresh;
      const merged = { ...fresh };
      if (typeof salvo.custoPorTonEditado === 'number') merged.custoPorTonEditado = salvo.custoPorTonEditado;
      if (typeof salvo.valorMensalEditado === 'number') merged.valorMensalEditado = salvo.valorMensalEditado;
      if (typeof salvo.fatorEditado === 'number') merged.fatorEditado = salvo.fatorEditado;
      if (typeof salvo.precoUnitarioEditado === 'number') merged.precoUnitarioEditado = salvo.precoUnitarioEditado;
      if (typeof salvo.quantidadeManualEditado === 'number') merged.quantidadeManualEditado = salvo.quantidadeManualEditado;
      if (typeof salvo.sacosPorPalletEditado === 'number') merged.sacosPorPalletEditado = salvo.sacosPorPalletEditado;
      if (typeof salvo.quantidadeLivreEditada === 'number') merged.quantidadeLivreEditada = salvo.quantidadeLivreEditada;
      if (Array.isArray(salvo.historico3m)) merged.historico3m = salvo.historico3m;
      if (salvo.pctManual) merged.pctManual = salvo.pctManual;
      if (typeof salvo.valorOverrideManual === 'number') merged.valorOverrideManual = salvo.valorOverrideManual;
      if (typeof salvo.removido === 'boolean') merged.removido = salvo.removido;
      if (salvo.naturezaId) merged.naturezaId = salvo.naturezaId;
      if (salvo.centroCustoId) merged.centroCustoId = salvo.centroCustoId;
      if (typeof salvo.precoUnitarioRef === 'number') merged.precoUnitarioRef = salvo.precoUnitarioRef;
      if (typeof salvo.pesoUnidadeRef === 'number') merged.pesoUnidadeRef = salvo.pesoUnidadeRef;
      if (salvo.classificacao) merged.classificacao = salvo.classificacao;
      return merged;
    });
    // preserva itens personalizados (adicionados pela pessoa) que não existem no INSUMOS_BASE
    const idsBase = new Set(INSUMOS_BASE.map((b) => b.id));
    const personalizadosSalvos = snap.insumos.filter((it) => it.personalizado && !idsBase.has(it.id));
    state.insumos = state.insumos.concat(personalizadosSalvos.map((it) => ({
      ...it,
      custoPorTonEditado: typeof it.custoPorTonEditado === 'number' ? it.custoPorTonEditado : (it.classificacao === 'FIXO' ? null : 0),
      valorMensalEditado: typeof it.valorMensalEditado === 'number' ? it.valorMensalEditado : (it.classificacao === 'FIXO' ? 0 : null),
    })));
  }
}

async function atualizarPlanejamentoAtual() {
  if (!state._planejamentoAtualId) { if (typeof toast === 'function') toast('Nenhum planejamento carregado — use "Salvar como novo".', 'warning'); return; }
  // SEM simulação: o `totais` gravado é o do plano. Antes, salvar com um turno
  // desligado na aba Impacto gravava o número simulado como se fosse o planejado.
  const r = computarSemSimulacao(state);
  const registro = {
    mes: state.mes, ano: state.ano, estado: serializarEstadoAtual(),
    totais: { total: r.plano.totais.GERAL, custoPorTon: r.plano.custoPorTon.GERAL, faturamento: r.faturamentoCalculado,
              alvoPct: r.alvo.atualPct, alvoTeto: (Number(state.alvoMaximoPct) || 38) / 100 },
    atualizado_em: new Date().toISOString(),
  };
  try {
    const { error } = await _supabase.from(TABELA_PLANEJAMENTOS).update(registro).eq('id', state._planejamentoAtualId);
    if (error) throw error;

    console.error('Erro ao atualizar planejamento:', e);

  }
}

async function carregarPlanejamento(id) {

// Limpa o nome do insumo pra exibição em relatório/PDF: remove os parênteses de ajuda
// ("ajustável", "clique para abrir", "fórmula a definir", etc.) que poluem uma apresentação.
function _nomeInsumoLimpo(nome) {
  let n = String(nome || '');
  // remove qualquer parêntese que contenha termos de UI/ajuda
  n = n.replace(/\s*\([^)]*(ajust[áa]vel|clique|f[óo]rmula a definir|dilu[íi]do|litros abastecidos|gramas por pallet|quantidade usada|por turno|sobre a folha|valor total|s[óo] lan[çc]amento|cadastro|abrir modal|R\$ por)[^)]*\)/gi, '');
  // remove parênteses vazios ou sobras de espaço
  n = n.replace(/\s*\(\s*\)/g, '').replace(/\s{2,}/g, ' ').trim();
  return n;
}

function _printCapacidade() {
  if (!state.blocos.length) return `<div class="secao"><h2>Capacidade — linhas, turnos e produtos</h2><p class="sub">Nenhuma linha configurada neste plano.</p></div>`;
  const blocosHtml = state.blocos.map((bloco) => {
    const secoesHtml = (bloco.secoes || []).map((secao) => {
      const turno = state.turnosReais.find((t) => t.nome === secao.turnoNome);
      const paradasHoras = (secao.paradas || []).reduce((a, p) => a + (Number(p.horas) || 0), 0);
      const h = calcHorasSecao(state.calendario, turno, secao.eficiencia, secao.extras, paradasHoras, state.horasDomingoEspecial);
      const ativos = (secao.produtos || []).filter((p) => p.ativo !== false);
      const produtosCalc = ativos.map((p) => ({ id: p.id, capHora: Number(p.capHora) || 0, demanda: Number(p.demanda) || 0 }));
      const dist = distribuirHorasProdutos(produtosCalc, h.dispH);
      const produtosHtml = ativos.map((p) => {
        const d = dist[p.id] || { horasDispProd: 0, qtdMax: 0 };
        const demanda = Number(p.demanda) || 0;
        const auto = p.qtdManual === null || p.qtdManual === undefined;
        const qtd = !auto ? Number(p.qtdManual) : (demanda > 0 ? demanda : d.qtdMax);
        const excede = demanda > 0 && d.qtdMax > 0 && demanda > d.qtdMax + 1;
        return `<tr>
          <td>${esc(p.nome)}</td><td class="num">${fmtNum(p.capHora, 0)}</td><td class="num">${demanda ? fmtNum(demanda, 0) : '—'}</td>
          <td class="num">${fmtNum(qtd, 0)}</td><td class="num">${p.capHora > 0 ? (qtd / p.capHora).toFixed(1) + 'h' : '—'}</td>
          <td>${excede ? '⚠️ excede capacidade' : '—'}</td>
        </tr>`;
      }).join('');
      return `<div class="secao">
        <h3>Turno: ${esc(secao.turnoNome || '—')} · Eficiência ${secao.eficiencia}% · Extras ${secao.extras}h/dia</h3>
        <p class="sub">Dias: ${h.diasTrabalho} · Brutas: ${h.horasBrutas.toFixed(1)}h · Perda efic.: ${h.perdaH.toFixed(1)}h · Paradas: ${h.paradaH.toFixed(1)}h · <strong>Disponíveis: ${h.dispH.toFixed(1)}h</strong></p>

}

function _printPainel(r) {
  const gargalos = r.producao.detalhes.filter((d) => d.excede);
  const qtdPorBucket = {}; BUCKETS_CUSTO.forEach((p) => { qtdPorBucket[p] = p === 'CAULIMGRANEL' ? r.plano.tonelagem.tonCAULIMGRANEL : r.metas[p]; });
  const lucroTotal = {}; BUCKETS_CUSTO.forEach((p) => { lucroTotal[p] = r.margem[p].margemRS * qtdPorBucket[p]; });
  const maisRentavel = BUCKETS_CUSTO.map((p) => ({ p, valor: lucroTotal[p] })).sort((a, b) => b.valor - a.valor)[0];
  const custoFixoTotal = r.plano.porClassificacao.GERAL.FIXO;
  const alertasHtml = [];
  gargalos.forEach((g) => alertasHtml.push(`<div class="alerta alerta-danger">⚠️ <strong>${esc(g.produtoNome)}</strong> (${esc(g.linhaNome)} / ${esc(g.turnoNome)}): demanda de ${fmtNum(g.demanda, 0)} excede o máximo de ${fmtNum(g.qtdMax, 0)}.</div>`));
  BUCKETS_CUSTO.forEach((p) => { if (r.margem[p].margemRS < 0) alertasHtml.push(`<div class="alerta alerta-danger">⚠️ ${NOMES_PRODUTO[p]}: margem negativa de ${fmtBRL(r.margem[p].margemRS)}.</div>`); });
  if (r.producao.naoMapeados.length) alertasHtml.push(`<div class="alerta alerta-warning">⚠️ ${r.producao.naoMapeados.length} produto(s) sem linha de custo: ${r.producao.naoMapeados.map((x) => esc(x.nome)).join(', ')}.</div>`);
  return `<div class="secao"><h2>Painel executivo</h2>
    <p><strong>Gargalo:</strong> ${gargalos.length ? gargalos.length + ' produto(s) com demanda acima da capacidade — ver alertas abaixo.' : 'nenhum gargalo neste plano.'}</p>
    <p><strong>Mais rentável:</strong> ${NOMES_PRODUTO[maisRentavel.p]} — ${fmtBRL(maisRentavel.valor)} de margem total no mês.</p>
    <p><strong>Custo fixo do mês:</strong> ${fmtBRL(custoFixoTotal)}</p>
    ${alertasHtml.join('') || '<div class="alerta alerta-success">Nenhum alerta no momento.</div>'}
  </div>`;
}
