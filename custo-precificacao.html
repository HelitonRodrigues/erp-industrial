<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP Industrial — Custo &amp; Precificação</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<style>
/* ── Custo & Precificação — estilos específicos do módulo (cp-*) ── */
.cp-resumo-topo{display:flex;flex-wrap:wrap;gap:0;background:var(--primary);color:#fff;border-radius:14px;padding:14px 20px;margin-bottom:18px;}
.cp-resumo-item{display:flex;flex-direction:column;gap:2px;padding:4px 22px;border-right:1px solid rgba(255,255,255,.15);}
.cp-resumo-item:last-child{border-right:none;}
.cp-resumo-item span{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#7aa3c0;}
.cp-resumo-item strong{font-size:16px;font-weight:800;}
.cp-destaque{color:#15803d;font-weight:800;}

.cp-h3{font-size:13px;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:.03em;margin-bottom:12px;}
.cp-ajuda{color:#64748b;font-size:12.5px;margin:4px 0 14px;}
.cp-muted{color:#94a3b8;font-weight:400;text-transform:none;font-size:.85em;}
.cp-unid{font-size:12px;color:#64748b;}

.cp-grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;}
@media (max-width:720px){ .cp-grid-2{grid-template-columns:1fr !important;} }

.cp-card{padding:18px;}
.cp-card-header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;}
.cp-card-header strong{font-size:13px;text-transform:uppercase;letter-spacing:.02em;color:var(--primary);}
.cp-card-destaque{border-left:4px solid var(--accent);}

.cp-field-row{flex-direction:row !important;align-items:center;gap:8px;margin:8px 0 !important;flex-wrap:wrap;}
.cp-field-row .form-label{flex:1 1 auto;min-width:150px;margin:0;}
.cp-field-row .form-input{width:120px;flex:none;}
.cp-input-sm{width:70px !important;}
.cp-input-tabela{width:90px !important;padding:5px 7px !important;font-size:12.5px;}


.cp-kpi-linha{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:12.5px;border-bottom:1px dotted #eef2f6;}
.cp-kpi-linha span{color:#64748b;}
.cp-kpi-linha strong{font-size:14px;font-variant-numeric:tabular-nums;}

.cp-num{text-align:right;font-variant-numeric:tabular-nums;}
/* Blocos de KPI e tabelas de poucas colunas dentro de cards de largura cheia.
   Sem limite, o .cp-kpi-linha (justify-content:space-between) joga o número no
   extremo oposto da tela: em 1440px o vão entre rótulo e valor chegava a 1.271px.
   Em card estreito nada muda — o max-width só age quando sobra largura. */
.cp-bloco-estreito{max-width:620px;}
.cp-tabela-estreita{max-width:660px;}
/* Tabelinha Variável/Fixo dentro do card de resultado: com o padding padrão da
   tabela ela não cabia na largura do card e ficava cortada. */
.cp-tabela-mini{width:100%;margin-top:8px;table-layout:fixed;border-collapse:collapse;}
.cp-tabela-mini th,.cp-tabela-mini td{padding:3px 4px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cp-tabela-mini td{font-variant-numeric:tabular-nums;}
.cp-tabela-mini th:first-child,.cp-tabela-mini td:first-child{width:38%;}
/* ── Participação na tonelagem (barra empilhada part-to-whole) ──
   Paleta categórica validada (checagem de daltonismo/contraste): os 5 tons são
   fixos por família — a cor segue a FAMÍLIA, nunca a posição na lista, então
   filtrar uma família não repinta as outras. */
.cp-mix{margin:2px 0 14px;}
.cp-mix-bar{display:flex;height:34px;border-radius:6px;overflow:hidden;background:#eef2f6;}
.cp-mix-seg{display:flex;align-items:center;justify-content:center;min-width:0;margin-right:2px;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap;}
.cp-mix-seg:last-child{margin-right:0;}
/* Sem bloco de legenda: a tabela logo abaixo já traz a MESMA bolinha de cor ao
   lado de cada família, com toneladas e % — ela é a legenda. Repetir isso numa
   faixa acima só polui. A identidade nunca fica só na cor, e passar o mouse no
   segmento mostra família, toneladas e percentual. */
.cp-mix-swatch{width:11px;height:11px;border-radius:3px;flex:none;display:inline-block;}
.cp-mix-vazio{font-size:12.5px;color:#94a3b8;padding:10px 0;}
/* linhas de custo sem produção: presentes, mas recuadas visualmente */
tr.cp-linha-zerada td{color:#a8b3c2;}
.cp-toggle-zeradas{font-size:11.5px;color:#64748b;display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;}
.cp-num-forte{font-weight:800;}

.cp-gauge{margin:10px 0 2px;}
.cp-gauge-track{position:relative;height:10px;background:#e2e8f0;border-radius:5px;}
.cp-gauge-fill{height:100%;border-radius:5px;transition:width .2s ease;}
.cp-gauge-marker{position:absolute;top:-3px;width:2px;height:16px;background:var(--primary);}

.cp-legenda-cal{display:flex;gap:14px;margin:8px 0 12px;font-size:11px;color:#64748b;flex-wrap:wrap;}
.cp-calendario2{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:640px;}
.cp-cal-cabecalho{text-align:center;font-size:10.5px;font-weight:700;color:#94a3b8;padding:4px 0;text-transform:uppercase;}
.cp-dia2{border:1.5px solid;border-radius:8px;padding:6px 2px;text-align:center;cursor:pointer;transition:transform .1s;}
.cp-dia2:hover{transform:scale(1.04);}

.cp-blocos-list{display:flex;flex-direction:column;gap:14px;margin-bottom:8px;}
.cp-bloco{padding:16px;}
.cp-bloco-header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.cp-bloco-label{font-size:13px;font-weight:700;color:#64748b;white-space:nowrap;}

.cp-secao{border:1.5px solid var(--border);border-radius:10px;padding:14px;margin-top:10px;background:#fbfcfe;}
/* ── turnos lado a lado ──────────────────────────────────────────────────
   1 turno: ocupa a largura toda (igual a antes).
   2+ turnos: viram colunas. Abaixo de ~1100px de área útil eles voltam a
   empilhar sozinhos, então no celular/notebook estreito nada aperta.
   As regras "--multi" só valem quando há 2+ turnos: com um só, o layout
   continua exatamente o de sempre. */
/* align-items:stretch (padrão) => as colunas de turno ficam SEMPRE da mesma altura */
.cp-secoes-grid{display:grid;grid-template-columns:1fr;gap:14px;padding:0 16px 16px;align-items:stretch;}
.cp-secoes-grid .cp-secao{display:flex;flex-direction:column;}
/* linha do topo do turno: seletor à esquerda, remover à direita */
.cp-secao-topo{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed var(--border);}
.cp-secao-topo .cp-secao-acoes{display:flex;gap:4px;align-items:center;flex:none;}
.cp-secao-topo .cp-secao-acoes .btn{white-space:nowrap;}
/* eficiência digitável */
.cp-efic-campo{display:flex;align-items:center;gap:2px;}
.cp-efic-input{width:56px !important;padding:4px 6px !important;text-align:center;font-weight:800;font-size:14px;}
.cp-efic-pct{font-weight:800;font-size:13px;color:var(--primary);}
/* simulação rápida recolhível */
.cp-stepper-sim{flex-basis:100%;border-top:1px dashed var(--border);padding-top:10px;margin-top:2px;}
.cp-sim-toggle{display:inline-flex;align-items:center;gap:8px;background:none;border:none;padding:0;cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.03em;}
.cp-sim-toggle:hover{color:var(--primary);}
.cp-sim-toggle-ativa{color:#b45309;}
.cp-sim-flag{background:#fef3c7;color:#b45309;border-radius:20px;padding:1px 8px;font-size:10px;font-weight:800;text-transform:none;}
.cp-sim-off{color:#cbd5e1;font-size:10px;font-weight:600;text-transform:none;}
.cp-sim-corpo{margin-top:8px;}
/* badge da equipe da linha, um pouco maior */
.cp-badge-equipe{font-size:12.5px;padding:5px 12px;}
.cp-secoes-grid .cp-secao{margin-top:0;}
.cp-secoes-grid--multi{grid-template-columns:repeat(auto-fit,minmax(540px,1fr));}
/* cabeçalho do turno em 2 colunas fixas: Turno|Eficiência, H.Extra|Lenha,
   Simulação (linha inteira) e o botão remover à direita — sem itens soltos */
.cp-secoes-grid--multi .cp-secao-header{gap:12px 16px;}
.cp-secoes-grid--multi .cp-sim-corpo .cp-stepper-row{display:inline-flex;margin-right:14px;}
.cp-secoes-grid--multi .cp-stepper-presets .btn{padding:3px 6px;font-size:10px;}
/* resumo de horas: mantém as 6 caixas, mas deixa quebrar em 2 fileiras */
.cp-secoes-grid--multi .cp-resumo-secao{grid-template-columns:repeat(auto-fit,minmax(76px,1fr));}
.cp-secoes-grid--multi .cp-produtos-grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
/* caixa interna com borda — agrupa um assunto dentro de um card (ex.: Lenha, Filtro de manga) */
.cp-box{border:1.5px solid var(--border);border-radius:10px;padding:14px;background:#fbfcfe;}
.cp-box .cp-ajuda{margin-bottom:0;}
.cp-box-tit{font-size:12px;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);}
/* seção "Linhas, turnos e produtos": moldura em volta do cabeçalho + lista de linhas */
.cp-plano-secao{border:1.5px solid var(--border);border-radius:12px;background:#f8fafc;padding:16px;margin-bottom:16px;}
.cp-plano-secao-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:12px;margin-bottom:14px;border-bottom:1.5px solid var(--border);}
.cp-plano-secao .cp-blocos-list{margin-bottom:0;}
.cp-secao-header{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:10px;}
.cp-stepper{display:flex;flex-direction:column;gap:4px;}
.cp-stepper-row{display:flex;align-items:center;gap:8px;}
.cp-stepper-btn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);background:#fff;font-size:16px;line-height:1;cursor:pointer;color:var(--primary);}
.cp-stepper-btn:hover{background:#f1f5f9;}
.cp-stepper-btn-danger{border-color:var(--danger);color:var(--danger);}
.cp-stepper-btn-success{border-color:var(--success);color:var(--success);}
.cp-stepper-valor{font-weight:800;font-size:14px;min-width:46px;text-align:center;}
.cp-stepper-presets{display:flex;gap:4px;flex-wrap:wrap;}
.cp-stepper-presets .btn{padding:3px 8px;font-size:10.5px;}

.cp-paradas{margin-bottom:10px;}
.cp-parada-row{display:flex;gap:8px;align-items:center;margin-top:6px;}

.cp-resumo-secao{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0;}
.cp-resumo-secao > div{text-align:center;background:#eef2f6;border-radius:6px;padding:6px 4px;}
.cp-resumo-secao strong{display:block;font-size:14px;font-weight:800;color:var(--primary);}
.cp-resumo-secao span{font-size:9px;color:#64748b;text-transform:uppercase;}
.cp-resumo-secao-disp{background:var(--accent) !important;}
.cp-resumo-secao-disp strong{color:var(--primary) !important;}

.cp-produtos{border-top:1px dashed var(--border);padding-top:10px;}
.cp-produtos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
.cp-prod-card{padding:14px;background:#fff;}
.cp-prod-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.cp-prod-card-header strong{font-size:12.5px;color:var(--primary);}
.cp-field-stack{margin:8px 0;}
.cp-field-stack .form-label{display:block;margin:0 0 4px;font-size:11px;}
.cp-field-stack .form-input{width:100%;box-sizing:border-box;}
.cp-fechar-btn{background:none;border:none;font-size:14px;line-height:1;cursor:pointer;color:#94a3b8;padding:2px 4px;border-radius:4px;}
.cp-fechar-btn:hover{color:var(--danger);background:#ffe4e6;}
.cp-equipe{border-top:1px dashed var(--border);margin-top:10px;padding-top:10px;}
.cp-equipe-row{display:grid;grid-template-columns:1.2fr 1.4fr auto;align-items:center;gap:8px;padding:5px 0;font-size:12.5px;border-bottom:1px dotted var(--border);cursor:pointer;}
.cp-equipe-row:hover{background:#f8fafc;}
.cp-equipe-row .cp-input-tabela{width:100%!important;}
.cp-formula{font-size:10.5px;color:#94a3b8;font-style:italic;margin:2px 0 8px;}
.cp-bucket-cell{position:relative;}
.cp-excluir-mini{background:none;border:none;color:#cbd5e1;font-size:10px;cursor:pointer;margin-left:3px;padding:0;vertical-align:middle;}
.cp-excluir-mini:hover{color:var(--danger);}
.cp-alvo-input{width:38px;font-family:inherit;font-size:11px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:inherit;border-radius:4px;padding:1px 3px;text-align:center;}
.cp-check-sim{display:flex;align-items:center;gap:5px;font-size:11px;color:#64748b;white-space:nowrap;}
.cp-linha-pct td{padding:2px 8px 8px !important;background:#fbfcfe;}
.cp-linha-pct summary{cursor:pointer;font-size:10.5px;color:#64748b;}
.cp-folha-row{cursor:pointer;}
.cp-folha-row:hover{background:#f8fafc;}
.cp-insumo-row{cursor:pointer;}
.cp-insumo-row:hover{background:#f8fafc;}
.cp-modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;}
.cp-modal-box{background:#fff;border-radius:14px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.cp-modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;border-radius:14px 14px 0 0;}
.cp-modal-body{padding:16px 20px;}
.cp-modal-footer{padding:14px 20px;border-top:1px solid var(--border);text-align:right;}
.cp-modal-formula{margin-top:14px;padding:12px;background:#f8fafc;border-radius:8px;font-size:11.5px;color:#475569;line-height:1.7;}
.cp-modal-total{font-weight:800;color:var(--primary);font-size:13px;margin-top:4px;}
.cp-calc-auxiliar{margin:6px 0 10px;padding:10px;background:#f8fafc;border-radius:8px;border:1px dashed var(--border);}
.cp-calc-auxiliar summary{cursor:pointer;font-size:11.5px;color:var(--primary);font-weight:600;}
.cp-calc-auxiliar .cp-field-row{margin:6px 0;}
.cp-modal-box-largo{max-width:92vw;}
.cp-modal-body-colunas{display:flex;gap:0;overflow-x:auto;padding:0;}
.cp-folha-coluna{flex:0 0 260px;padding:16px;border-right:1px solid var(--border);}
.cp-folha-coluna:last-child{border-right:none;}
.cp-folha-coluna-header{display:flex;flex-direction:column;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--primary);}
.cp-folha-coluna-header strong{font-size:13px;}
.cp-pct-editor{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
.cp-pct-editor label{display:flex;flex-direction:column;font-size:9.5px;color:#64748b;gap:2px;}
.cp-pct-editor input{width:60px;}
.cp-secao-colapsavel{margin-bottom:14px;padding:0;overflow:hidden;}
.cp-secao-colapsavel-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;cursor:pointer;background:#f8fafc;}
.cp-secao-colapsavel-header:hover{background:#eef2f6;}
.cp-secao-colapsavel-header strong{font-size:13px;color:var(--primary);text-transform:uppercase;letter-spacing:.02em;}
.cp-secao-colapsavel-corpo{padding:18px;border-top:1px solid var(--border);}
.cp-mini-resultado{font-size:11.5px;color:#64748b;margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);}
.cp-mini-resultado strong{color:var(--primary);font-size:13px;}
.cp-auto{font-size:9px;background:#dbeafe;color:#1d4ed8;padding:1px 5px;border-radius:8px;margin-left:4px;text-transform:none;font-weight:700;}
.cp-reabrir-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;}
.cp-chip-add{font-size:11px;background:#f1f5f9;border:1px dashed var(--border);color:#64748b;padding:4px 10px;border-radius:20px;cursor:pointer;}
.cp-chip-add:hover{background:#eef2f6;color:var(--primary);border-color:var(--primary);}


.cp-barra-classif{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:10px;background:#e2e8f0;}
.cp-seg-abs{background:var(--primary);}
.cp-seg-ajust{background:#7aa3c0;}
.cp-seg-fixo{background:#94a3b8;}
.cp-legenda{display:flex;gap:12px;margin-top:6px;font-size:11px;color:#64748b;flex-wrap:wrap;}
.cp-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;}
.cp-dot-abs{background:var(--primary);} .cp-dot-ajust{background:#7aa3c0;} .cp-dot-fixo{background:#94a3b8;}

.cp-resposta-grande{font-size:15px;padding:6px 0 14px;line-height:1.6;}
.cp-resposta-grande strong{color:var(--primary);}

.cp-lista-alertas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
.cp-alerta-item{padding:10px 14px;border-radius:8px;font-size:12.5px;border-left:3px solid var(--border);}
.cp-alerta-success{background:#dcfce7;border-left-color:var(--success);}
.cp-alerta-warning{background:#fef9c3;border-left-color:var(--warning);}
.cp-alerta-danger{background:#ffe4e6;border-left-color:var(--danger);}

.cp-table-scroll{overflow-x:auto;}
</style>
</head>
<body>
<div id="sidebar-container"></div>
<header class="topbar" id="topbar">
  <button class="topbar-open-sidebar" onclick="toggleSidebar()">☰</button>
  <div class="topbar-title">Custo &amp; Precificação</div>
  <div class="topbar-right">
    <div class="topbar-user">
      <div class="user-avatar" style="width:32px;height:32px;font-size:12px;" id="top-avatar">SA</div>
      <div><div class="topbar-user-name" id="top-user-name">Super Admin</div><div class="topbar-user-profile" id="top-user-perfil">SADM</div></div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()" style="color:#64748b;">Sair</button>
  </div>
</header>
<main class="main-content" id="main-content">
  <div class="page-header">
    <div class="page-header-left">
      <h1>Custo &amp; Precificação</h1>
      <p>Simulador de capacidade, custo e margem — planeje o mês, veja o custo por linha e o preço de venda antes de fechar nada.</p>
    </div>
    <div style="display:flex;gap:10px;align-items:center;" id="cp-header-actions">
    </div>
  </div>


  <div class="card" id="cp-tabs-card" style="padding:0;margin-bottom:18px;overflow:hidden;">
    <div class="tabs" style="margin:0;padding:0 12px;">
      <!-- >>>>> ABA RESUMO — BLOCO REMOVIVEL (nao mexer no resto) -->
      <button class="tab-btn active" id="tbtn-resumo" onclick="showTab('resumo')">📊 Resumo</button>
      <!-- <<<<< FIM ABA RESUMO -->
      <button class="tab-btn" id="tbtn-config" onclick="showTab('config')">📅 Capacidade</button>
      <button class="tab-btn" id="tbtn-metas" onclick="showTab('metas')">🎯 Metas &amp; Produção</button>
      <button class="tab-btn" id="tbtn-linha" onclick="showTab('linha')">⚙️ Configuração da Linha</button>
      <button class="tab-btn" id="tbtn-custos" onclick="showTab('custos')">🧾 Custos &amp; Resultado</button>
      <button class="tab-btn" id="tbtn-impacto" onclick="showTab('impacto')">🧪 Impacto</button>
      <button class="tab-btn" id="tbtn-geral" onclick="showTab('geral')">📋 Geral</button>
      <!-- >>>>> ABA PLANEJADO x REALIZADO — BLOCO REMOVIVEL (nao mexer no resto) -->
      <button class="tab-btn" id="tbtn-real" onclick="showTab('real')">⚖️ Planejado x Realizado</button>
      <!-- <<<<< FIM ABA PLANEJADO x REALIZADO -->
    </div>
  </div>

  <div id="cp-app"></div>

</main>

<script>
/* ============================================================================
   SILICATE — MOTOR DE PLANEJAMENTO E CUSTO (protótipo standalone)
   Baseado na aba "CUSTO REAL" (MAIO/2026) da planilha de controle de produção.
   Este arquivo é puro JS (sem DOM) para poder ser testado no Node e depois
   embutido, sem alterações, dentro do <script> do index.html.
   ========================================================================== */

/* ----------------------------------------------------------------------------
   1) CATÁLOGO DE INSUMOS — extraído linha a linha da aba CUSTO REAL (bloco GERAL).
   Cada item guarda o valor REAL observado em Maio/2026 só como ponto de
   partida editável — nada aqui é fórmula fixa, é o "chute inicial" que o
   usuário pode mudar.

   tipoRateio:

/* ----------------------------------------------------------------------------
   2) CALENDÁRIO / CAPACIDADE — portado de planejamento.html para ficar
   idêntico ao resto do sistema. A implementação completa (feriados, estado do
   dia, horas por seção) fica na seção 6, mais abaixo — aqui só o essencial
   que o resto do arquivo usa cedo.
---------------------------------------------------------------------------- */

function diasDoMes(ano, mes) { // mes: 1-12
  return new Date(ano, mes, 0).getDate();
}

// Ciclo de estados ao clicar num dia — mesma regra de planejamento.html:
// feriado alterna feriado/trabalha; domingo alterna folga/trabalha/domingo-especial;
// dia normal alterna trabalha/folga.
function proximoEstadoDia(estadoAtual, isDomingo, isFeriado) {
  const estados = isFeriado ? ['feriado', 'trabalha'] : isDomingo ? ['folga', 'trabalha', 'domingo-especial'] : ['trabalha', 'folga'];
  const idx = estados.indexOf(estadoAtual);
  return estados[(idx < 0 ? 0 : idx + 1) % estados.length];
}

/* ----------------------------------------------------------------------------
   3) TONELAGEM E RATEIO — mesma lógica da "tabela de premissas" da CUSTO REAL,
   mas com UMA ÚNICA base de rateio (tonelagem) usada para as 3 linhas —
   isso corrige a inconsistência encontrada no arquivo original (ver README /
   painel de alertas do HTML).
---------------------------------------------------------------------------- */

const BUCKETS_CUSTO = ['L20', 'CONC', 'CAULIM25', 'CAULIMBB', 'CAULIMGRANEL'];

function calcularTonelagem(metas, pesos) {
  // metas: { L20, CONC, CAULIM25, CAULIMBB, CAULIMGRANEL } — sacos/unidades, exceto
  // CAULIMGRANEL que já vem em toneladas (produto vendido a granel, sem embalagem)
  // pesos: { pesoL20Kg, pesoCONCKg, pesoCAULIM25Kg, pesoBigBagKg } em kg/unidade
  const tonL20 = (metas.L20 * pesos.pesoL20Kg) / 1000;
  const tonCONC = (metas.CONC * pesos.pesoCONCKg) / 1000;
  const tonCAULIM25 = (metas.CAULIM25 * pesos.pesoCAULIM25Kg) / 1000;
  const tonCAULIMBB = (metas.CAULIMBB * pesos.pesoBigBagKg) / 1000;
  const tonCAULIMGRANEL = metas.CAULIMGRANEL || 0;
  const tonTotal = tonL20 + tonCONC + tonCAULIM25 + tonCAULIMBB + tonCAULIMGRANEL;
  const pct = (v) => (tonTotal > 0 ? v / tonTotal : 0);
  return {
    tonL20, tonCONC, tonCAULIM25, tonCAULIMBB, tonCAULIMGRANEL, tonTotal,
    pctL20: pct(tonL20), pctCONC: pct(tonCONC), pctCAULIM25: pct(tonCAULIM25), pctCAULIMBB: pct(tonCAULIMBB), pctCAULIMGRANEL: pct(tonCAULIMGRANEL),
  };
}

/* ----------------------------------------------------------------------------
   4) MOTOR DE CUSTO — para cada insumo, calcula quantidade, valor total e
   valor alocado em cada uma das 5 linhas de custo, dado o plano de produção.
---------------------------------------------------------------------------- */

/**
 * Quantidade automática de um insumo direto, conforme a fórmula da sua classe
 * (Embalagem/MP Mineral escalam com a capacidade/demanda; Pallet divide pelos sacos por
 * pallet; itens "manuais" como perdas e clientes especiais usam o valor informado à mão).
 */
function calcularQuantidadeDireto(item, metas, tonelagem) {
  if (item.formulaQtd === 'manual') {
    const qtdManual = item.quantidadeManualEditado != null ? item.quantidadeManualEditado : item.quantidadeManual;
    return Number(qtdManual) || 0;
  }
  const capacidade = (b) => (b === 'CAULIMGRANEL' ? (tonelagem.tonCAULIMGRANEL || 0) : (Number(metas[b]) || 0));
  switch (item.formulaQtd) {
    case 'direta': return capacidade(item.produtoBase);
    case 'pallet': {
      const sacosRaw = item.sacosPorPalletEditado != null ? item.sacosPorPalletEditado : item.sacosPorPallet;
      const sacos = Number(sacosRaw) || 1;
      return capacidade(item.produtoBase) / sacos;
    }
    case 'mp_20': return (capacidade(item.produtoBase) * 20) / 1000;
    case 'mp_10': return (capacidade(item.produtoBase) * 10) / 1000;
    case 'mp_25': return (capacidade(item.produtoBase) * 25) / 1000;
    case 'mp_caulim_total': {
      const qtd25 = (capacidade('CAULIM25') * 25) / 1000;
      const qtdBigBag = capacidade('CAULIMBB'); // x1000kg ÷ 1000 = 1:1 (cada big bag = 1 tonelada de MP)
      const qtdGranel = tonelagem.tonCAULIMGRANEL || 0; // já em toneladas
      return qtd25 + qtdBigBag + qtdGranel;
    }
    default: return 0;
  }
}

function calcularCustoItem(item, metas, tonelagem) {
  const linhas = {}; BUCKETS_CUSTO.forEach((b) => { linhas[b] = 0; });
  let novaQtd = null, valorTotal = 0;

  if (item.tipoRateio === 'direto') {
    // Quantidade (sacos, pallets, toneladas de MP...) calculada conforme a fórmula da
    // classe (Embalagem/Pallet/MP Mineral/etc.), com qualquer ajuste manual já aplicado.
    novaQtd = calcularQuantidadeDireto(item, metas, tonelagem);
    valorTotal = novaQtd * (Number(item.precoUnitarioEditado) || 0);
    if (item.produtoBase === 'CAULIM_TOTAL') {
      // MP Caulim é matéria-prima compartilhada pelos 3 formatos de Caulim —
      // rateia pelo peso de cada formato dentro da tonelagem total de Caulim.
      const totalCaulimTon = tonelagem.tonCAULIM25 + tonelagem.tonCAULIMBB + tonelagem.tonCAULIMGRANEL;
      if (totalCaulimTon > 0) {
        linhas.CAULIM25 = valorTotal * (tonelagem.tonCAULIM25 / totalCaulimTon);
        linhas.CAULIMBB = valorTotal * (tonelagem.tonCAULIMBB / totalCaulimTon);
        linhas.CAULIMGRANEL = valorTotal * (tonelagem.tonCAULIMGRANEL / totalCaulimTon);
      }
    } else {
      linhas[item.produtoBase] = valorTotal;
    }
  } else {
    // compartilhado — rateia pela tonelagem entre as linhas de custo aplicáveis
    let valorGeralNovo;
    if (item.valorTotalOverride != null) {
      // itens "especiais" (folha, lenha, filtro de manga, refeição, cartão alimentação) —
      // o valor já vem pronto de quem chamou o motor (calculado por linha/turno/equipe)
      valorGeralNovo = item.valorTotalOverride;
    } else if (item.qtdPrecoLivre) {
      // itens sem relação direta entre quantidade e preço (ex.: Frete) — os dois campos
      // ficam totalmente livres pra digitar, sem fórmula nenhuma por trás.
      const qtdLivreRaw = item.quantidadeLivreEditada != null ? item.quantidadeLivreEditada : item.quantidadeLivre;
      novaQtd = Number(qtdLivreRaw) || 0;
      valorGeralNovo = novaQtd * (Number(item.precoUnitarioEditado) || 0);
    } else if (item.temPrecoQtd) {
      // martelo/gaveta/grelha/eixos — mantém rastreio de quantidade pro alerta de consumo
      const taxaPorTon = item.qtdBaseReal / TONELAGEM_TOTAL_REAL_MAIO;
      novaQtd = taxaPorTon * tonelagem.tonTotal;
      valorGeralNovo = novaQtd * item.precoUnitario;
    } else if (item.classificacao === 'FIXO') {
      valorGeralNovo = item.valorMensal || 0;
    } else {
      valorGeralNovo = (item.custoPorTon || 0) * tonelagem.tonTotal;
    }
    valorTotal = valorGeralNovo;
    if (item.pctOverride) {
      // rateio customizado, calculado por quem chamou o motor (ex.: por headcount) —
      // usado tal qual, sem recalcular a partir da tonelagem
      BUCKETS_CUSTO.forEach((b) => { linhas[b] = valorGeralNovo * (item.pctOverride[b] || 0); });
    } else if (item.escopoLinhas) {
      // item só se aplica a um subconjunto de linhas (ex.: Pallet só nos ensacados,
      // não em Big Bag/Granel) — rateia pela tonelagem, mas só entre as linhas do escopo
      const escopo = item.escopoLinhas;
      const tonEscopo = escopo.reduce((a, b) => a + tonelagem['ton' + b], 0);
      BUCKETS_CUSTO.forEach((b) => {
        linhas[b] = escopo.includes(b) && tonEscopo > 0 ? valorGeralNovo * (tonelagem['ton' + b] / tonEscopo) : 0;
      });
    } else {
      BUCKETS_CUSTO.forEach((b) => { linhas[b] = valorGeralNovo * tonelagem['pct' + b]; });
    }
  }

  return { id: item.id, novaQtd, valorTotal, linhas };
}

/**
 * Ranking de sensibilidade: quanto o custo total sobe se o preço/valor de CADA
 * insumo subir 10%, mantendo tudo o mais igual. Como o custo é linear no preço
 * de cada item (valorTotal = quantidade fixa × preço), o impacto de +10% é
 * sempre exatamente 10% do valorTotal atual do item — não precisa re-rodar o
 * motor inteiro pra cada item, só ordenar pelo valorTotal.
 */
function calcularSensibilidade(resultadosItens, top) {
  const ranked = resultadosItens
    .map((r) => ({ id: r.item.id, insumo: r.item.insumo, valorTotal: r.calc.valorTotal, impacto10pct: r.calc.valorTotal * 0.10 }))
    .filter((r) => r.valorTotal > 0)
    .sort((a, b) => b.valorTotal - a.valorTotal);
  return top ? ranked.slice(0, top) : ranked;
}

function calcularPlanoCompleto(insumos, metas, pesos) {
  const tonelagem = calcularTonelagem(metas, pesos);
  const resultadosItens = insumos.map((it) => ({ item: it, calc: calcularCustoItem(it, metas, tonelagem) }));

  const totais = { GERAL: 0 }; BUCKETS_CUSTO.forEach((b) => { totais[b] = 0; });
  const porClassificacao = { GERAL: { VARIAVEL: 0, FIXO: 0 } };
  BUCKETS_CUSTO.forEach((b) => { porClassificacao[b] = { VARIAVEL: 0, FIXO: 0 }; });

  for (const { item, calc } of resultadosItens) {
    totais.GERAL += calc.valorTotal;
    BUCKETS_CUSTO.forEach((b) => { totais[b] += calc.linhas[b]; });
    const classif = item.classificacao;
    if (porClassificacao.GERAL[classif] !== undefined) {
      porClassificacao.GERAL[classif] += calc.valorTotal;
      BUCKETS_CUSTO.forEach((b) => { porClassificacao[b][classif] += calc.linhas[b]; });
    }
  }

  const custoPorTon = { GERAL: tonelagem.tonTotal > 0 ? totais.GERAL / tonelagem.tonTotal : 0 };
  BUCKETS_CUSTO.forEach((b) => { custoPorTon[b] = tonelagem['ton' + b] > 0 ? totais[b] / tonelagem['ton' + b] : 0; });

  const custoPorUnidade = {};
  BUCKETS_CUSTO.forEach((b) => {
    const q = b === 'CAULIMGRANEL' ? tonelagem.tonCAULIMGRANEL : metas[b]; // granel: custo por tonelada (já é a unidade nativa)
    custoPorUnidade[b] = q > 0 ? totais[b] / q : 0;
  });

  return { tonelagem, resultadosItens, totais, porClassificacao, custoPorTon, custoPorUnidade };
}

/* ----------------------------------------------------------------------------
   5) MARGEM DE CONTRIBUIÇÃO / PONTO DE EQUILÍBRIO
---------------------------------------------------------------------------- */

// Custo variável por saco = (Absoluto + Ajustável) da linha / sacos da linha.
// Custo fixo entra só no ponto de equilíbrio, não no custo variável unitário.
function margemContribuicao(precoVenda, custoVariavelUnitario) {
  const margemRS = precoVenda - custoVariavelUnitario;
  const margemPct = precoVenda > 0 ? margemRS / precoVenda : 0;
  return { margemRS, margemPct };
}

function precoSugerido(custoVariavelUnitario, margemAlvoPct) {
  if (margemAlvoPct >= 1) return Infinity;
  return custoVariavelUnitario / (1 - margemAlvoPct);
}

function pontoDeEquilibrio(custoFixoTotal, margemContribuicaoUnitaria) {
  if (margemContribuicaoUnitaria <= 0) return Infinity;
  return custoFixoTotal / margemContribuicaoUnitaria;
}

/* ----------------------------------------------------------------------------
   6) CALENDÁRIO, TURNOS E CAPACIDADE POR SEÇÃO — a mesma lógica do
   planejamento.html (feriados nacionais, estados do dia, cálculo de horas
   por seção com eficiência/extras/paradas, e distribuição de horas entre
   produtos de uma mesma linha/turno).
---------------------------------------------------------------------------- */

const DIAS_SEMANA = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];

// Feriados nacionais fixos + móveis (Páscoa/Carnaval/Corpus Christi via cálculo de Gauss),
// idêntico ao usado em planejamento.html.
function getFeriadosNacionais(ano, mes) {
  const f = [];
  const fixos = [[1, 1, 'Ano Novo'], [4, 21, 'Tiradentes'], [5, 1, 'Dia do Trabalho'], [9, 7, 'Independência'],
    [10, 12, 'N.Sra.Aparecida'], [11, 2, 'Finados'], [11, 15, 'Proclamação da República'], [11, 20, 'Consciência Negra'], [12, 25, 'Natal']];
  fixos.forEach(([m, d, nome]) => { if (m === mes) f.push({ dia: d, nome }); });
  const a = ano % 19, b = Math.floor(ano / 100), c = ano % 100, d2 = Math.floor(b / 4), e = b % 4,
    fi = Math.floor((b + 8) / 25), g = Math.floor((b - fi + 1) / 3), h = (19 * a + b - d2 - g + 15) % 30,
    i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m2 = Math.floor((a + 11 * h + 22 * l) / 451);
  const mesPascoa = Math.floor((h + l - 7 * m2 + 114) / 31), diaPascoa = (h + l - 7 * m2 + 114) % 31 + 1;
  const pascoa = new Date(ano, mesPascoa - 1, diaPascoa);
  const sf = new Date(pascoa); sf.setDate(pascoa.getDate() - 2);
  const carnaval = new Date(pascoa); carnaval.setDate(pascoa.getDate() - 47);
  const cc = new Date(pascoa); cc.setDate(pascoa.getDate() + 60);
  if (mesPascoa === mes) f.push({ dia: diaPascoa, nome: 'Páscoa' });
  if (sf.getMonth() + 1 === mes) f.push({ dia: sf.getDate(), nome: 'Sexta-feira Santa' });
  if (carnaval.getMonth() + 1 === mes) f.push({ dia: carnaval.getDate(), nome: 'Carnaval' });
  if (cc.getMonth() + 1 === mes) f.push({ dia: cc.getDate(), nome: 'Corpus Christi' });
  return f;
}

// Gera (ou atualiza) o mapa { 'AAAA-MM-DD': estado } para um mês, preservando
// qualquer estado já escolhido manualmente para datas daquele mesmo mês.
function gerarCalendarioMes(ano, mes, feriadosLocais, calendarioExistente) {
  const diasNoMes = new Date(ano, mes, 0).getDate();
  const prefixo = `${ano}-${String(mes).padStart(2, '0')}-`;
  const feriadosNac = getFeriadosNacionais(ano, mes);
  const feriadosDias = new Set([...feriadosNac.map((x) => x.dia), ...(feriadosLocais || []).map((x) => x.dia)]);
  const calendario = {};
  // preserva estados já definidos para este mês
  Object.entries(calendarioExistente || {}).forEach(([k, v]) => { if (k.startsWith(prefixo)) calendario[k] = v; });
  for (let d = 1; d <= diasNoMes; d++) {
    const dateKey = `${prefixo}${String(d).padStart(2, '0')}`;
    if (calendario[dateKey] !== undefined) continue;
    const dow = new Date(ano, mes - 1, d).getDay();
    calendario[dateKey] = feriadosDias.has(d) ? 'feriado' : (dow === 0 ? 'folga' : 'trabalha');
  }
  return calendario;
}

function calcMinutos(ini, fim) {
  if (!ini || !fim) return 0;
  const [h1, m1] = ini.split(':').map(Number);
  let [h2, m2] = fim.split(':').map(Number);
  let mins = (h2 * 60 + m2) - (h1 * 60 + m1);
  if (mins < 0) mins += 1440;
  return mins;
}

/**
 * Calcula as horas de uma seção (uma linha rodando em um turno específico),
 * exatamente como calcHorasSecao() do planejamento.html:
 *   bruto → (- refeição, + extras) → perda por eficiência → líquido → (- paradas) → disponível
 *
 * calendarioMes: { 'AAAA-MM-DD': 'trabalha'|'folga'|'feriado'|'domingo-especial' }
 * turno: { nome, refeicao_min, calendario: { 'Segunda': {inicio,fim}, ... } }
 */
function calcHorasSecao(calendarioMes, turno, eficienciaPct, extrasPorDia, paradasHoras, horasDomingoEspecial) {
  const refM = Number(turno && (turno.refeicao_min || turno.refeicaoMin)) || 0;
  const extrasMins = Math.round((extrasPorDia || 0) * 60);
  let minsBrutos = 0, diasTrabalho = 0;
  Object.entries(calendarioMes || {}).forEach(([dateKey, estado]) => {
    if (estado === 'trabalha' || estado === 'domingo-especial') {
      diasTrabalho++;
      if (estado === 'domingo-especial') {
        minsBrutos += Math.round((horasDomingoEspecial || 0) * 60) + extrasMins;
      } else {
        const dow = new Date(dateKey + 'T12:00:00').getDay();
        const nomeDia = DIAS_SEMANA[dow];
        const cal = (turno && turno.calendario) || {};
        const diaInfo = cal[nomeDia];
        let mDia = 0; // sem expediente definido (ou dia inativo) = 0h, o turno simplesmente não roda
        if (diaInfo && diaInfo.ativo !== false && diaInfo.inicio && diaInfo.fim) {
          mDia = Math.max(0, calcMinutos(diaInfo.inicio, diaInfo.fim) - refM);
        }
        if (mDia > 0) minsBrutos += mDia + extrasMins;
      }
    }
  });
  const paradasMins = Math.round((paradasHoras || 0) * 60);
  const perdaMins = Math.round(minsBrutos * (100 - eficienciaPct) / 100);
  const liquidoMins = minsBrutos - perdaMins;
  const dispMins = Math.max(0, liquidoMins - paradasMins);
  return {
    minsBrutos, perdaMins, liquidoMins, paradasMins, dispMins, diasTrabalho,
    horasBrutas: minsBrutos / 60, perdaH: perdaMins / 60, liquidoH: liquidoMins / 60,
    paradaH: paradasMins / 60, dispH: dispMins / 60,
  };
}

/**
 * Distribui as horas disponíveis de uma seção entre os produtos cadastrados
 * nela, igual a _recalcProdutosSecao(): produtos COM demanda recebem
 * primeiro (limitado ao disponível), produtos SEM demanda dividem o restante.
 * produtos: [{ id, capHora, demanda }]
 * Retorna: { [id]: { horasDispProd, qtdMax } }
 */
function distribuirHorasProdutos(produtos, horasDisp) {
  let horasNecTotal = 0;
  const necPorId = {};
  const semDemanda = [];
  (produtos || []).forEach((p) => {
    if (p.demanda > 0) {
      const nec = p.capHora > 0 ? p.demanda / p.capHora : 0;
      necPorId[p.id] = nec;
      horasNecTotal += nec;
    } else semDemanda.push(p);
  });
  // se a soma das demandas passa do disponível, racionaliza proporcionalmente entre
  // quem tem demanda (em vez de cada um pegar seu pedido cheio independente dos outros)
  const fatorRateio = horasNecTotal > horasDisp && horasNecTotal > 0 ? horasDisp / horasNecTotal : 1;
  let horasComDemanda = 0;
  const alocadoComDemanda = {};
  Object.entries(necPorId).forEach(([id, nec]) => {
    const alocado = nec * fatorRateio;
    alocadoComDemanda[id] = alocado;
    horasComDemanda += alocado;
  });
  const horasRestantes = Math.max(0, horasDisp - horasComDemanda);
  const horasPorSemDem = semDemanda.length > 0 ? horasRestantes / semDemanda.length : 0;
  const resultado = {};
  (produtos || []).forEach((p) => {
    const horasDispProd = p.demanda > 0 ? alocadoComDemanda[p.id] : horasPorSemDem;
    const qtdMax = p.capHora > 0 ? Math.round(horasDispProd * p.capHora) : 0;
    resultado[p.id] = { horasDispProd, qtdMax };
  });
  return resultado;
}

/**
 * Custo mensal completo de um funcionário — usa a Ficha de Cadastro dele
 * (funcionarios.html: salário base + adicional + insalubridade, com encargos)
 * se estiver preenchida; senão cai no valor arbitrado localmente (sem gravar
 * nada no cadastro de RH). Em cima disso, soma horas extras (55%/100%) e
 * desconta faltas — os mesmos campos da planilha que o RH manda pra contabilidade.
 *
 * func: { id, custos: { salario_base, adicional_fixo, insalubridade, encargos_pct, horas_mensais } }
 * dados: { salarioOverride, faltas, atestados, horas55, horas100, horasTrabalhadas }
 */
function calcularCustoMensalFuncionario(func, dados) {
  const d = dados || {};
  const custoBase = (Number(d.salarioBase) || 0) + (Number(d.adicionalFixo) || 0) + (Number(d.insalubridade) || 0);
  const encargosPct = Number(d.encargosPct) || 0;
  const custoComEncargos = custoBase * (1 + encargosPct / 100);
  const horasMensais = Number(d.horasMensais) > 0 ? Number(d.horasMensais) : 220;
  const valorHora = horasMensais > 0 ? custoComEncargos / horasMensais : 0;
  const valorDiario = custoComEncargos / 30;

  const custoHoras55 = (Number(d.horas55) || 0) * valorHora * 1.55;
  const custoHoras100 = (Number(d.horas100) || 0) * valorHora * 2.0;
  const descontoFaltas = (Number(d.faltas) || 0) * valorDiario;

  const custoTotal = Math.max(0, custoComEncargos + custoHoras55 + custoHoras100 - descontoFaltas);
  return { custoBase, custoComEncargos, encargosPct, valorHora, valorDiario, custoHoras55, custoHoras100, descontoFaltas, custoTotal };
}

/**
 * Compara o consumo do plano atual contra a média histórica (últimos 3 meses)
 * de um insumo de desgaste. Sinaliza quando o desvio passa do limiar (padrão 15%).
 */
/* As duas funções abaixo não são chamadas por nenhuma tela: elas fazem parte da
   API do motor (module.exports, no fim deste bloco) e existem para ser testadas
   e reaproveitadas. Ficam de propósito — não são código esquecido. */
function calcularAlertaConsumo(consumoAtual, mediaHistorica, limiarPct) {
  const limiar = limiarPct == null ? 0.15 : limiarPct;
  if (!mediaHistorica || mediaHistorica <= 0) return { desvioPct: 0, foraDoPadrao: false };
  const desvioPct = (consumoAtual - mediaHistorica) / mediaHistorica;
  return { desvioPct, foraDoPadrao: Math.abs(desvioPct) > limiar };
}

/* rótulo dentro do segmento: branco ou tinta escura, pelo brilho do fundo */
function _tintaSobre(hex) {
  const c = String(hex || '').replace('#', '');
  const canal = (i) => { const v = parseInt(c.substr(i, 2), 16) / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  const lum = 0.2126 * canal(0) + 0.7152 * canal(2) + 0.0722 * canal(4);
  return lum > 0.42 ? '#1e293b' : '#ffffff';
}
