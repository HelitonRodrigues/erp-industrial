/* ══════════════════════════════════════════════════════════════════════════
   ABA CUSTOS & RESULTADO — utilidades da própria aba
   Nada aqui toca no motor (`computar`, `calcularPlanoCompleto`): são só funções que
   leem o resultado que o motor já devolveu.
   ══════════════════════════════════════════════════════════════════════════ */

// Quantidade planejada de um produto, na unidade dele (granel é em tonelada).
function _qtdDoBucket(r, b) {
  return Number(b === 'CAULIMGRANEL' ? r.plano.tonelagem.tonCAULIMGRANEL : r.metas[b]) || 0;
}
// Só os produtos que realmente têm produção no plano. Sem este filtro, um produto com
// meta zero entra na tela com custo variável R$ 0,00 e margem de 100%, e aparece como
// o mais lucrativo da fábrica.
function _bucketsProduzidos(r) {
  return BUCKETS_CUSTO.filter((b) => _qtdDoBucket(r, b) > 0);
}
// Custo CHEIO por unidade (variável + fixo rateado). É o piso real de preço: abaixo
// disso o produto dá prejuízo mesmo com margem de contribuição positiva.
function _custoCheioPorUnidade(r, b) {
  const q = _qtdDoBucket(r, b);
  return q > 0 ? r.plano.totais[b] / q : 0;
}
// Preço de tabela: o piso acrescido da mesma margem alvo já usada para sugerir preço.
// Entre o piso e a tabela fica a zona onde dá pra negociar sem perder dinheiro.
function _precoDeTabela(r, b) {
  const m = Number(state.margemAlvo[b]) || 0;
  const piso = _custoCheioPorUnidade(r, b);
  return m >= 1 ? Infinity : piso / (1 - m);
}
/* Ponto de equilíbrio EM REAIS.
   Dividir o custo fixo pela margem média POR UNIDADE devolve uma QUANTIDADE, não
   reais — era exatamente o que o painel da fábrica exibia com cifrão na frente. Além
   disso a média por unidade sozinha não significa nada aqui, porque as unidades são
   diferentes (saco de 10, 20 e 25 kg, big bag e tonelada). Multiplicando pelo preço
   médio a mistura se cancela e sobra a conta certa: custo fixo ÷ razão de margem de
   contribuição — a mesma que o resumo da linha e o PDF já faziam. */
function _equilibrioEmReais(custoFixo, itens) {
  let margemTotal = 0, receitaTotal = 0;
  (itens || []).forEach((x) => {
    const q = Number(x.qtd) || 0;
    margemTotal += (Number(x.margemRS) || 0) * q;
    receitaTotal += (Number(x.preco) || 0) * q;
  });
  if (!(receitaTotal > 0) || !(margemTotal > 0)) return Infinity;
  return custoFixo / (margemTotal / receitaTotal);
}

// Aviso de faturamento manual. O botão fica na aba Metas & Produção, mas é AQUI
// que o faturamento decide tudo: alvo, ponto de equilíbrio, "como chegar no alvo" e
// as alavancas de preço. Sem o aviso, um alvo confortável podia ser só um número
// digitado em outra tela — e a coluna "% do faturamento" deixa de somar 100%.
function _avisoFaturamentoManual(r) {
  if (!state.faturamentoManual || !state.faturamentoManual.ativo) return '';
  const auto = r.faturamentoAutomatico || 0;
  const man = r.faturamentoCalculado || 0;
  const dif = man - auto;
  return alertBox('atencao', `<strong>Faturamento informado à mão:</strong> ${fmtBRL(man)}. A soma de quantidade × preço dos produtos dá ${fmtBRL(auto)} — uma diferença de ${fmtBRL(dif)}. Tudo nesta aba (alvo, ponto de equilíbrio, plano pra chegar no alvo) usa o valor manual, e por isso a coluna "% do faturamento" não fecha 100%. Pra voltar ao automático, desmarque a opção na aba <strong>🎯 Metas &amp; Produção</strong>.`);
}
function renderCustosResultado(r) {
  return _avisoFaturamentoManual(r)
    + renderSecaoColapsavel('insumos', '🧾 Insumos & Custos', renderInsumos(r))
    + renderSecaoColapsavel('resultado', '📊 Resultado por Linha', renderResultado(r))
    + renderSecaoColapsavel('precificacao', '💵 Precificação', renderPrecificacao(r))
    + renderSecaoColapsavel('painel', '🚦 Painel Executivo', renderPainel(r))
    + renderSecaoColapsavel('alvo-plano', '🎯 Como chegar no alvo', renderComoChegarNoAlvo(r));
}
function selecionarLinhaConfig(blocoId) { state.linhaSelecionadaId = blocoId; render(); }

function renderConfigLinha(r) {
  if (!state.blocos.length) {
    return `<div class="card"><div class="empty-state"><div class="empty-icon">🏭</div><h3>Nenhuma linha configurada ainda</h3><p>Configure uma linha na aba <strong>Capacidade</strong> primeiro — ela aparece aqui automaticamente.</p></div></div>`;
  }
  if (!state.linhaSelecionadaId || !state.blocos.find((b) => b.id === state.linhaSelecionadaId)) {
    state.linhaSelecionadaId = state.blocos[0].id;
  }
  const bloco = state.blocos.find((b) => b.id === state.linhaSelecionadaId);
  const info = r.tonPorBloco[bloco.id];
  const bucketsRelevantes = info ? BUCKETS_CUSTO.filter((b) => info.tonPorBucket[b] > 1e-9) : [];
  const custoLinhaFisica = r.custoPorLinhaFisica.find((lf) => lf.blocoId === bloco.id);

  /* ------------------------------------------------------------------------
     BASE DE CUSTO DESTA LINHA — calculada UMA vez e usada por todo mundo.
     Antes o card de resumo mostrava `tonelada × custo/ton` enquanto as tabelas
     somavam item a item com as regras especiais (folha pela equipe, lenha por
     linha, energia por grupo). Os dois números não batiam e os percentuais das
     tabelas não fechavam 100%. Agora a base é a soma real das linhas exibidas:
        base = TOTAL DIRETOS + TOTAL COMPARTILHADOS
     ------------------------------------------------------------------------ */
  const totalGeralParaPct = r.plano.totais.GERAL;
  const metasDaLinha = _metasDaLinha(r, bloco.id);
  const diretos = r.plano.resultadosItens.filter((x) => x.item.tipoRateio === 'direto' && !x.item.removido && (x.item.formulaQtd === 'manual' ? bucketsRelevantes.includes(x.item.produtoBase) : bucketsRelevantes.some((b) => x.calc.linhas[b] > 0)));
  // total dos diretos: soma exatamente o mesmo "Valor Total" que cada linha exibe
  const _valorDiretoDaLinha = (it) => calcularQuantidadeDireto(it, metasDaLinha.metas, metasDaLinha.tonelagem) * (Number(it.precoUnitarioEditado) || 0);
  const totalDiretosLinha = diretos.reduce((acc, x) => acc + _valorDiretoDaLinha(x.item), 0);
  const tonLinhaDiretos = info ? info.tonTotal : 0;

  const SEMPRE_VISIVEIS_LINHA = MATMOINHO_IDS.concat(['diesel', 'dieselterc', 'lenha', 'frete']);
  const OCULTAR_SE_ZERADO = ['aguamineral']; // itens que você ainda não usa: só aparecem quando tiverem valor
  const compartilhados = r.plano.resultadosItens.filter((x) => x.item.tipoRateio === 'compartilhado' && !x.item.removido
    && !(OCULTAR_SE_ZERADO.includes(x.item.id) && x.calc.valorTotal <= 0.01)
    && (x.item.personalizado || x.item.especial || SEMPRE_VISIVEIS_LINHA.includes(x.item.id) || _escopoAtivo(state, x.item.id) || bucketsRelevantes.some((b) => x.calc.linhas[b] > 0.01)));
  // Tabela agrupada por CLASSE, com subtotal de cada grupo. Colunas enxutas e sempre com o
  // mesmo significado: quantidade da linha, valor na linha, % da linha e R$/tonelada.
  const tonLinhaTab = info ? info.tonTotal : 0;
  const valorNaLinha = (x) => _valorCompartilhadoDaLinha(x.item, x.calc, bloco, info, r.plano.tonelagem, r, state);
  const totalCompartLinha = compartilhados.reduce((a, x) => a + valorNaLinha(x), 0);
  const _totFabricaCompart = compartilhados.reduce((a, x) => a + (x.calc.valorTotal || 0), 0);
  // ESTA é a base única: bate com a soma das duas tabelas, centavo a centavo.
  const custoTotalDaLinha = totalDiretosLinha + totalCompartLinha;
  const custoPorTonLinha = tonLinhaDiretos > 0 ? custoTotalDaLinha / tonLinhaDiretos : 0;
  const pctDoTotalFabrica = r.plano.totais.GERAL > 0 ? custoTotalDaLinha / r.plano.totais.GERAL : 0;

  // faturamento e fixo/variável desta linha: prorateia cada linha de custo (bucket) pela
  // fatia de tonelagem que ESTA linha física especificamente produziu daquele bucket
  let faturamentoLinha = 0, fixoLinha = 0, variavelLinha = 0;
  bucketsRelevantes.forEach((b) => {
    const tonTotalBucket = r.plano.tonelagem['ton' + b];
    const tonNestaLinha = info ? info.tonPorBucket[b] : 0;
    const share = tonTotalBucket > 0 ? tonNestaLinha / tonTotalBucket : 0;
    const qtyTotalBucket = b === 'CAULIMGRANEL' ? r.plano.tonelagem.tonCAULIMGRANEL : r.metas[b];
    faturamentoLinha += qtyTotalBucket * r.precoVenda[b] * share;
    fixoLinha += r.plano.porClassificacao[b].FIXO * share;
    variavelLinha += r.plano.porClassificacao[b].VARIAVEL * share;
  });
  const totalClassifLinha = fixoLinha + variavelLinha;

  // cada botão já mostra tonelagem e custo/ton, pra escolher a linha sabendo o que tem dentro
  const _totaisPorBloco = {};
  state.blocos.forEach((b) => { _totaisPorBloco[b.id] = _totaisDaLinhaFisica(r, b, state); });
  const seletor = `<div class="card" style="margin-bottom:16px;">
    <h3 class="cp-h3">Selecione a linha pra ajustar</h3>
    <div class="cp-field-row" style="display:flex;gap:12px;flex-wrap:wrap;align-items:stretch;">
      ${state.blocos.map((b) => {
        const t = _totaisPorBloco[b.id];
        const sel = b.id === bloco.id;
        return `<button class="btn ${sel ? 'btn-primary' : 'btn-ghost'}" style="display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;font-size:15px;font-weight:700;padding:12px 20px;text-align:left;line-height:1.25;" onclick="selecionarLinhaConfig('${b.id}')">
          <span>🏭 ${esc(b.linhaNome || '(sem nome)')}</span>
          <span style="font-size:11px;font-weight:600;opacity:${sel ? '.85' : '.7'};font-variant-numeric:tabular-nums;">${fmtNum(t.ton, 1)} t · ${fmtBRL(t.total)} · ${t.ton > 0 ? fmtBRL(t.porTon) + '/t' : 'sem produção'}</span>
        </button>`;
      }).join('')}
    </div>
    <p class="cp-ajuda">Verifique e ajuste aqui antes de olhar o resultado consolidado na aba Custos &amp; Resultado.</p>
  </div>`;

  // produtos desta linha, com checkbox de incluir/excluir da conta (reusa o mesmo "ativo" já usado em Capacidade)
  const produtosDestaLinha = [];
  (bloco.secoes || []).forEach((secao) => {
    (secao.produtos || []).forEach((p) => {
      const mp = garantirMapaProduto(p.nome);
      if (mp.destino) produtosDestaLinha.push({ produto: p, secao, destino: mp.destino });
    });
  });
  const produtosToggleHtml = produtosDestaLinha.length ? produtosDestaLinha.map(({ produto, secao, destino }) => `
    <label class="cp-check-sim" style="display:flex;gap:6px;margin:4px 0;">
      <input type="checkbox" ${produto.ativo !== false ? 'checked' : ''}
        onchange="this.checked ? reabrirProdutoSecao('${bloco.id}','${secao.id}','${produto.id}') : fecharProdutoSecao('${bloco.id}','${secao.id}','${produto.id}')">
      ${esc(produto.nome)} <span class="cp-muted">— ${DESTINOS[destino]}, turno ${esc(secao.turnoNome || '(sem turno)')}${produto.ativo === false ? ' — EXCLUÍDO DA CONTA' : ''}</span>
    </label>`).join('') : '<p class="cp-ajuda">Nenhum produto mapeado nesta linha ainda.</p>';

  const produtosBreakdownHtml = bucketsRelevantes.length ? bucketsRelevantes.map((b) => {
    const infoProduto = (custoLinhaFisica && custoLinhaFisica.porProduto[b]) || { ton: 0 };
    const pctProduto = custoLinhaFisica && custoLinhaFisica.tonTotal > 0 ? infoProduto.ton / custoLinhaFisica.tonTotal : 0;
    return `<div class="cp-kpi-linha"><span>${DESTINOS[b]}</span><strong>${fmtNum(infoProduto.ton, 2)} ton <span class="cp-muted">(${fmtPct(pctProduto, 2)})</span></strong></div>`;
  }).join('') : '<p class="cp-ajuda" style="margin:4px 0;">Nenhum produto nesta linha ainda.</p>';

  /* Composição do custo desta linha: Diretos × Folha da equipe × Demais compartilhados.
     Mesma leitura da barra da aba Metas — a porcentagem vai dentro da cor, sem legenda. */
  const _folhaDaLinhaComp = compartilhados.filter((x) => x.item.id === 'folha_mod').reduce((a, x) => a + valorNaLinha(x), 0);
  const _outrosCompart = totalCompartLinha - _folhaDaLinhaComp;
  const _fatias = [
    { rot: 'Insumos diretos', v: totalDiretosLinha, cor: '#2a78d6' },
    { rot: 'Folha da equipe', v: _folhaDaLinhaComp, cor: '#eb6834' },
    { rot: 'Demais compartilhados', v: _outrosCompart, cor: '#1baf7a' },
  ].filter((x) => x.v > 0.005);
  const _somaFatias = _fatias.reduce((a, x) => a + x.v, 0);
  const composicaoHtml = _somaFatias > 0 ? `<div style="margin:4px 0 12px;">
    <label class="form-label" style="font-size:11px;">Composição do custo desta linha</label>
    <div class="cp-mix-bar">${_fatias.map((x) => {
      const pct = (x.v / _somaFatias) * 100;
      // fatia estreita não deixa de mostrar o número: só diminui a fonte. Abaixo de 1,5%
      // não cabe nem no menor corpo — aí fica só a cor, e o valor aparece na legenda.
      const corpo = pct >= 7 ? '' : pct >= 3.5 ? 'font-size:10px;' : 'font-size:8.5px;letter-spacing:-.02em;';
      return `<div class="cp-mix-seg" style="flex:0 1 ${pct}%;background:${x.cor};color:${_tintaSobre(x.cor)};${corpo}" title="${esc(x.rot)}: ${fmtBRL(x.v)} (${fmtPct(x.v / _somaFatias, 2)})">${pct >= 1.5 ? fmtPct(x.v / _somaFatias, 2) : ''}</div>`;
    }).join('')}</div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:var(--text-muted);">
      ${_fatias.map((x) => `<span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${x.cor};margin-right:5px;"></span>${esc(x.rot)} · <strong style="color:var(--primary);">${fmtPct(x.v / _somaFatias, 2)}</strong> · ${fmtBRL(x.v)}</span>`).join('')}
    </div>
  </div>` : '';

  const resumoHtml = `
    <label class="form-label" style="font-size:11px;">Produtos produzidos por esta linha</label>
    ${produtosBreakdownHtml}
    <div class="cp-kpi-linha" style="border-top:1px solid var(--border);margin-top:6px;padding-top:8px;"><span>Total geral da linha</span><strong>${fmtNum(custoLinhaFisica ? custoLinhaFisica.tonTotal : 0, 2)} ton</strong></div>
    ${composicaoHtml}
    <div class="cp-kpi-linha"><span>Custo total atribuído <span class="cp-muted">(diretos + compartilhados desta linha)</span></span><strong>${fmtBRL(custoTotalDaLinha)}</strong></div>
    <div class="cp-kpi-linha"><span>Custo / tonelada</span><strong>${fmtBRL(custoPorTonLinha)}</strong></div>
    <div class="cp-kpi-linha"><span>% do custo total da fábrica</span><strong>${fmtPct(pctDoTotalFabrica, 2)}</strong></div>
    <div class="cp-kpi-linha"><span>Participação na tonelagem da fábrica</span><strong>${fmtPct(r.plano.tonelagem.tonTotal > 0 && info ? info.tonTotal / r.plano.tonelagem.tonTotal : 0, 2)} <span class="cp-muted">(${fmtNum(info ? info.tonTotal : 0, 1)} t de ${fmtNum(r.plano.tonelagem.tonTotal, 1)} t)</span></strong></div>
    <div class="cp-kpi-linha"><span>Faturamento estimado desta linha</span><strong>${fmtBRL(faturamentoLinha)}</strong></div>
    <div class="cp-kpi-linha"><span>Custo Variável desta linha</span><strong>${fmtBRL(variavelLinha)} <span class="cp-muted">(${fmtPct(totalClassifLinha > 0 ? variavelLinha / totalClassifLinha : 0, 2)})</span></strong></div>
    <div class="cp-kpi-linha"><span>Custo Fixo desta linha</span><strong>${fmtBRL(fixoLinha)} <span class="cp-muted">(${fmtPct(totalClassifLinha > 0 ? fixoLinha / totalClassifLinha : 0, 2)})</span></strong></div>
    <div style="margin-top:10px;border-top:1px dashed var(--border);padding-top:8px;">
      <label class="form-label" style="font-size:11px;">Produtos entrando na conta desta linha <span class="cp-muted">— vem automático do que foi escolhido em Capacidade; desmarque pra ignorar um produto sem apagar o planejamento dele</span></label>
      ${produtosToggleHtml}
    </div>`;

  /* Total por turno. Atenção à diferença: a linha de cada pessoa mostra o salário
     CHEIO, mas quem está escalado em mais de um turno entra no custo dividido
     entre eles. Por isso o total traz os dois números quando eles diferem — o que
     soma na tela e o que de fato entra no custo. */
  const _nAloc = _alocacoesPorFuncionario(state);
  const _totaisTurno = (secao) => {
    const eq = secao.equipe || [];
    const cheio = eq.reduce((acc, fid) => acc + custoMensalFuncionario(fid, state.mes, state.ano), 0);
    const atribuido = eq.reduce((acc, fid) => acc + custoMensalFuncionario(fid, state.mes, state.ano) / (_nAloc[fid] || 1), 0);
    const divididos = eq.filter((fid) => (_nAloc[fid] || 1) > 1)
      .map((fid) => { const f = state.funcionariosReais.find((x) => x.id === fid); return { nome: f ? f.nome : fid, vezes: _nAloc[fid] }; });
    return { cheio, atribuido, divididos, pessoas: eq.length };
  };
  let _somaLinhaCheio = 0, _somaLinhaAtrib = 0;
  const equipeHtml = ((bloco.secoes || []).map((secao) => {
    const t = _totaisTurno(secao);
    _somaLinhaCheio += t.cheio; _somaLinhaAtrib += t.atribuido;
    const divergente = Math.abs(t.cheio - t.atribuido) > 0.005;
    return `<div class="cp-secao" style="margin-bottom:10px;">
    <strong style="font-size:12px;color:var(--primary);">Turno: ${esc(secao.turnoNome || '(sem turno selecionado)')}</strong>
    ${renderEquipeSecao(bloco, secao)}
    <div class="cp-kpi-linha" style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px;">
      <span>Total do turno <span class="cp-muted">(${t.pessoas} pessoa${t.pessoas === 1 ? '' : 's'})</span></span>
      <strong>${fmtBRL(t.cheio)}</strong></div>
    ${divergente ? `<div class="cp-kpi-linha" style="border-bottom:none;">
      <span class="cp-muted">Entra no custo desta linha <span title="${esc(t.divididos.map((d) => `${d.nome} está em ${d.vezes} turnos`).join(' · '))}">— ${esc(t.divididos.map((d) => d.nome).join(', '))} dividido entre turnos</span></span>
      <strong style="color:#b45309;">${fmtBRL(t.atribuido)}</strong></div>` : ''}
  </div>`;

  const removidosCompart = state.insumos.filter((it) => it.tipoRateio === 'compartilhado' && it.removido);
  const removidosHtml = (removidosDiretos.length || removidosCompart.length) ? `<div style="margin-top:10px;">

  </div>` : '';

  const resultadoLinhaHtml = bucketsRelevantes.length
    ? `<div class="cp-grid-cards">${bucketsRelevantes.map((b) => cardResultadoLinha(r, b, DESTINOS[b], bloco)).join('')}</div>`

  return seletor
    + renderSecaoColapsavel('linha-resumo', `🏭 ${esc(bloco.linhaNome || '(sem nome)')} — resumo desta linha`, resumoHtml)
    + renderSecaoColapsavel('linha-equipe', '👷 Equipe e folha desta linha', equipeHtml + equipeAdminHtml
      + `<p class="cp-ajuda" style="margin-top:10px;border-top:1px dashed var(--border);padding-top:8px;">⚠️ Este valor <strong>já está dentro</strong> do total de Insumos compartilhados, na linha <strong>Folha MOD</strong>. Ele aparece aqui só pra você ver quem compõe. <strong>Não some</strong> esta seção com as tabelas abaixo — daria folha em dobro. O custo total da linha é <strong>Insumos diretos + Insumos compartilhados</strong>.</p>`)

      <div class="cp-field-row" style="margin-top:12px;">

        <button class="btn btn-secondary btn-sm" onclick="adicionarInsumoCustom(document.getElementById('cp-novo-insumo-nome').value); document.getElementById('cp-novo-insumo-nome').value='';">+ Adicionar item de custo</button>

    + renderSecaoColapsavel('linha-resultado', '📊 Resultado desta linha', resultadoLinhaHtml)
    + renderSecaoColapsavel('linha-precificacao', '💵 Precificação desta linha', renderPrecificacaoLinha(r, bloco))
    + renderSecaoColapsavel('linha-painel', '🚦 Resumo executivo desta linha', renderResumoExecutivoLinha(r, bloco));
}

/* >>>>> ABA PLANEJADO x REALIZADO — BLOCO REMOVIVEL */
/* Estes dois sobrepoem de proposito as versoes originais (declaracao de funcao
   posterior vence). Assim NENHUMA linha original precisou ser alterada, e apagar
   as regioes marcadas devolve o arquivo byte a byte ao que era antes. */
function showTab(tab) {
  if (typeof guardTab === 'function' && !guardTab(MODULO_ID, tab)) return;
  state.tab = tab;
  ['config', 'metas', 'linha', 'custos', 'impacto', 'geral', 'real'].forEach((t) => {
    const btn = document.getElementById('tbtn-' + t);
    if (btn) btn.classList.toggle('active', t === tab);
  });
  if (tab === 'real') carregarRealizado();
  render();
}
function renderConteudo(r) {
  switch (state.tab) {
    case 'config': return renderConfig(r);
    case 'metas': return renderMetas(r);
    case 'linha': return renderConfigLinha(r);
    case 'custos': return renderCustosResultado(r);
    case 'impacto': return renderImpacto(r);
    case 'geral': return renderGeral(r);
    case 'real': return renderPlanRealizado(r);
    default: return '';
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   ABA PLANEJADO × REALIZADO
   ---------------------------------------------------------------------------
   O PLANEJADO vem da configuração por linha deste mesmo planejamento.
   O REALIZADO vem do que os outros módulos já lançaram no banco, no mês/ano do
   plano. Cada número da tela declara de onde veio:
     • automático  — somado de um lançamento real
     • sem fonte   — não existe origem no sistema; assume o planejado
     • manual      — você digitou por cima
   Nada aqui é chutado: quando não há de onde tirar, a tela diz isso em vez de
   mostrar R$ 0,00 com cara de realizado.

   FONTES (conferidas no banco, ago/2026):
     producao ................ OP por linha/turno; produtos_op traz `linha_produto`,
                               que é a linha de custo — é o que casa realizado com
                               planejado, inclusive quando a produção sai numa linha
                               diferente da planejada.
     insumos_movimentos ...... consumo real por OP (tipo=consumo, origem=OP).
                               Liga na linha por origem_id = producao.op_numero.
                               Cobre insumos diretos + stretch + lenha, com custo.
     desgaste_registros ...... martelo/grelha/eixo/gaveta por linha, em kg gastos.
     abastecimento_registros . diesel; tipo_veiculo separa frota de terceiro.
     abastecimento_entradas .. preço do litro.
   ═══════════════════════════════════════════════════════════════════════════ */

const REAL_ORIGEM = { AUTO: 'auto', SEM_FONTE: 'semfonte', MANUAL: 'manual' };

/* Itens compartilhados: de onde cada um tira o realizado. `fonte:null` = não existe
   origem no sistema, assume o planejado (decisão registrada com o dono). */
const REAL_FONTE_COMPART = {
