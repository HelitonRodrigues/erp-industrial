function _printConfigLinha(r, blocoArg) {
  if (!state.blocos.length) return '<p class="sub">Nenhuma linha configurada.</p>';
  const bloco = blocoArg || state.blocos.find((b) => b.id === state.linhaSelecionadaId) || state.blocos[0];
  const info = r.tonPorBloco[bloco.id];
  const bucketsRelevantes = info ? BUCKETS_CUSTO.filter((b) => info.tonPorBucket[b] > 1e-9) : [];
  const custoLinhaFisica = r.custoPorLinhaFisica.find((lf) => lf.blocoId === bloco.id);
  let custoTotalLinha = custoLinhaFisica ? custoLinhaFisica.custoTotal : 0;

  // Faturamento, fixo e variável desta linha: prorateia cada bucket pela fatia de tonelagem
  // que ESTA linha física produziu daquele bucket.
  let faturamentoLinha = 0, fixoLinha = 0, variavelLinha = 0;
  const resultadoPorProduto = [];
  bucketsRelevantes.forEach((b) => {
    const tonTotalBucket = r.plano.tonelagem['ton' + b];
    const tonNestaLinha = info ? info.tonPorBucket[b] : 0;
    const share = tonTotalBucket > 0 ? tonNestaLinha / tonTotalBucket : 0;
    const qtyTotalBucket = b === 'CAULIMGRANEL' ? r.plano.tonelagem.tonCAULIMGRANEL : r.metas[b];
    const qtyLinha = qtyTotalBucket * share;
    const fatBucket = qtyLinha * r.precoVenda[b];
    faturamentoLinha += fatBucket;
    fixoLinha += r.plano.porClassificacao[b].FIXO * share;
    variavelLinha += r.plano.porClassificacao[b].VARIAVEL * share;
    resultadoPorProduto.push({ b, qtyLinha, ton: tonNestaLinha, preco: r.precoVenda[b], margemRS: r.margem[b].margemRS, margemPct: r.margem[b].margemPct, faturamento: fatBucket, lucro: r.margem[b].margemRS * qtyLinha });
  });
  let custoPorTonLinha = custoLinhaFisica ? custoLinhaFisica.custoPorTon : 0;
  let sobraLinha = faturamentoLinha - custoTotalLinha;
  let alvoPctLinha = faturamentoLinha > 0 ? (custoTotalLinha / faturamentoLinha) * 100 : 0;
  let dentroAlvo = alvoPctLinha <= state.alvoMaximoPct;

  // Funcionários desta linha (com custo real da folha)
  const funcs = [];
  (bloco.secoes || []).forEach((sec) => {
    (sec.equipe || []).forEach((fid) => {
      const f = state.funcionariosReais.find((x) => x.id === fid);
      if (f) funcs.push({ nome: f.nome, turno: sec.turnoNome, custo: custoMensalFuncionario(fid, state.mes, state.ano) });
    });
  });
  const totalFuncs = funcs.reduce((a, x) => a + x.custo, 0);

  const diretos = r.plano.resultadosItens.filter((x) => x.item.tipoRateio === 'direto' && !x.item.removido && (x.item.formulaQtd === 'manual' ? bucketsRelevantes.includes(x.item.produtoBase) : bucketsRelevantes.some((b) => x.calc.linhas[b] > 0)));
  // MESMO filtro da tela (antes o PDF perdia os itens "especiais": folha, lenha, energia…)
  const _SEMPRE_PDF = MATMOINHO_IDS.concat(['diesel', 'dieselterc', 'lenha', 'frete']);
  const compartilhados = r.plano.resultadosItens.filter((x) => x.item.tipoRateio === 'compartilhado' && !x.item.removido
    && !(x.item.id === 'aguamineral' && x.calc.valorTotal <= 0.01)
    && (x.item.personalizado || x.item.especial || _SEMPRE_PDF.includes(x.item.id) || _escopoAtivo(state, x.item.id) || bucketsRelevantes.some((b) => x.calc.linhas[b] > 0.01)));
  const metasLinhaPdf = _metasDaLinha(r, bloco.id);
  const qtdDiretoLinha = (it) => calcularQuantidadeDireto(it, metasLinhaPdf.metas, metasLinhaPdf.tonelagem);
  const valorDiretoLinha = (it) => qtdDiretoLinha(it) * (Number(it.precoUnitarioEditado) || 0);
  const valorCompartLinha = (x) => _valorCompartilhadoDaLinha(x.item, x.calc, bloco, info, r.plano.tonelagem, r, state);
  const totalDiretos = diretos.reduce((a, x) => a + valorDiretoLinha(x.item), 0);
  const totalCompart = compartilhados.reduce((a, x) => a + valorCompartLinha(x), 0);
  // base reconciliada — o PDF passa a mostrar o mesmo número da tela
  custoTotalLinha = totalDiretos + totalCompart;
  custoPorTonLinha = (info && info.tonTotal > 0) ? custoTotalLinha / info.tonTotal : 0;
  alvoPctLinha = faturamentoLinha > 0 ? (custoTotalLinha / faturamentoLinha) * 100 : 0;
  dentroAlvo = alvoPctLinha <= state.alvoMaximoPct;
  sobraLinha = faturamentoLinha - custoTotalLinha;

  // Precificação por produto desta linha
  const precificacaoRows = _precificacaoDaLinha(r, bloco).map((p) => `<tr><td>${DESTINOS[p.b]}</td><td class="num">${fmtBRL(p.custoVarUnid)}</td><td class="num">${fmtBRL(p.preco)}</td><td class="num">${fmtBRL(p.margemRS)} (${fmtPct(p.margemPct, 0)})</td><td class="num">${isFinite(p.pe) ? fmtNum(p.pe, 0) + ' ' + UNIDADE_LABEL[p.b] + 's/mês' : '—'}</td></tr>`).join('');

  // Resumo executivo DESTA linha
  const gargalosLinha = r.producao.detalhes.filter((d) => d.blocoId === bloco.id && d.excede).sort((a, b) => (b.demanda - b.qtdMax) - (a.demanda - a.qtdMax));
  const piorGargalo = gargalosLinha[0];
  const rentaveis = resultadoPorProduto.slice().sort((a, b) => b.lucro - a.lucro);
  const maisRentavel = rentaveis[0];
  // faturamento mínimo pra esta linha se pagar: custo fixo ÷ margem média por unidade = unidades de equilíbrio; × preço médio = faturamento de equilíbrio
  let numMargem = 0, denMargem = 0;
  resultadoPorProduto.forEach((p) => { numMargem += p.margemRS * p.qtyLinha; denMargem += p.qtyLinha; });
  const margemMediaLinha = denMargem > 0 ? numMargem / denMargem : 0;
  const custoFixoLinha = fixoLinha;
  const precoMedioLinha = denMargem > 0 ? faturamentoLinha / denMargem : 0;
  const unidadesEquilibrio = margemMediaLinha > 0 ? custoFixoLinha / margemMediaLinha : 0;
  const faturamentoMinimoLinha = unidadesEquilibrio * precoMedioLinha;
  const resumoExecutivoItens = [];
  if (piorGargalo) resumoExecutivoItens.push(`<li><strong>Gargalo:</strong> ${esc(piorGargalo.produtoNome)} — demanda de ${fmtNum(piorGargalo.demanda, 0)} acima do máximo de ${fmtNum(piorGargalo.qtdMax, 0)} (faltam ${fmtNum((piorGargalo.demanda - piorGargalo.qtdMax) / (piorGargalo.capHora || 1), 1)}h de capacidade).</li>`);
  else resumoExecutivoItens.push('<li><strong>Capacidade:</strong> a linha dá conta da demanda planejada, sem gargalo.</li>');
  if (maisRentavel) resumoExecutivoItens.push(`<li><strong>Mais rentável:</strong> ${DESTINOS[maisRentavel.b]} gera o maior lucro da linha (${fmtBRL(maisRentavel.lucro)} no mês).</li>`);
  resumoExecutivoItens.push(`<li><strong>Ponto de equilíbrio da linha:</strong> precisa faturar cerca de ${fmtBRL(faturamentoMinimoLinha)} pra cobrir o custo fixo de ${fmtBRL(custoFixoLinha)}.</li>`);
  resumoExecutivoItens.push(`<li><strong>Alvo:</strong> está em ${fmtNum(alvoPctLinha, 2)}% (custo ÷ faturamento) — ${dentroAlvo ? 'dentro' : 'acima'} do alvo de ${state.alvoMaximoPct}%.</li>`);

  return `<div class="secao"><h2>🏭 ${esc(bloco.linhaNome || '(sem nome)')}</h2>
    <table><tbody>
      <tr><td>Produtos</td><td class="num">${bucketsRelevantes.map((b) => DESTINOS[b]).join(', ') || '—'}</td></tr>
      <tr><td>Tonelagem</td><td class="num">${fmtNum(custoLinhaFisica ? custoLinhaFisica.tonTotal : 0, 2)} ton</td></tr>
      <tr><td><strong>Faturamento previsto da linha</strong></td><td class="num"><strong>${fmtBRL(faturamentoLinha)}</strong></td></tr>
      <tr><td>Custo total da linha</td><td class="num">${fmtBRL(custoTotalLinha)}</td></tr>
      <tr><td>Custo / tonelada</td><td class="num">${fmtBRL(custoPorTonLinha)}</td></tr>
      <tr><td>Alvo (custo ÷ faturamento)</td><td class="num">${fmtNum(alvoPctLinha, 2)}% ${dentroAlvo ? '✓ dentro do alvo' : '✗ acima do alvo de ' + state.alvoMaximoPct + '%'} </td></tr>
      <tr><td>Composição</td><td class="num">Fixo ${fmtBRL(fixoLinha)} · Variável ${fmtBRL(variavelLinha)}</td></tr>
    </tbody></table></div>

    <div class="secao"><h2>Resultado por produto</h2>
    <table><thead><tr><th>Produto</th><th>Produção</th><th>Preço venda</th><th>Margem/unid.</th><th>Faturamento</th><th>Lucro</th></tr></thead>
    <tbody>${resultadoPorProduto.map((p) => `<tr><td>${DESTINOS[p.b]}</td><td class="num">${fmtNum(p.qtyLinha, 0)} ${UNIDADE_LABEL[p.b]}(s)</td><td class="num">${fmtBRL(p.preco)}</td><td class="num">${fmtBRL(p.margemRS)} (${fmtPct(p.margemPct, 0)})</td><td class="num">${fmtBRL(p.faturamento)}</td><td class="num">${fmtBRL(p.lucro)}</td></tr>`).join('') || '<tr><td colspan="6">—</td></tr>'}</tbody></table></div>

    <div class="secao"><h2>Equipe desta linha</h2>
    <table><thead><tr><th>Funcionário</th><th>Turno</th><th>Custo mensal</th></tr></thead>
    <tbody>${funcs.map((x) => `<tr><td>${esc(x.nome)}</td><td>${esc(x.turno || '—')}</td><td class="num">${fmtBRL(x.custo)}</td></tr>`).join('') || '<tr><td colspan="3">Nenhum funcionário alocado</td></tr>'}
    <tr><td colspan="2"><strong>Total da equipe</strong></td><td class="num"><strong>${fmtBRL(totalFuncs)}</strong></td></tr></tbody></table></div>

    <div class="secao"><h2>Insumos diretos desta linha</h2>
    <table><thead><tr><th>Insumo</th><th>Preço Unitário</th><th>Quantidade</th><th>Valor total</th></tr></thead>
    <tbody>${diretos.map((x) => `<tr><td>${esc(_nomeInsumoLimpo(x.item.insumo))}</td><td class="num">${fmtBRL(x.item.precoUnitarioEditado)}/${esc(x.item.unidade)}</td><td class="num">${fmtNum(qtdDiretoLinha(x.item), 2)}</td><td class="num">${fmtBRL(valorDiretoLinha(x.item))}</td></tr>`).join('') || '<tr><td colspan="4">Nenhum</td></tr>'}
    <tr><td colspan="3"><strong>Total insumos diretos</strong></td><td class="num"><strong>${fmtBRL(totalDiretos)}</strong></td></tr></tbody></table></div>

    <div><h2>Insumos compartilhados</h2>
    <table><thead><tr><th>Insumo</th><th>Regra</th><th>Valor nesta linha</th><th>R$/ton</th></tr></thead>
    <tbody>${compartilhados.map((x) => { const v = valorCompartLinha(x); const tl = custoLinhaFisica ? custoLinhaFisica.tonTotal : 0; return `<tr><td>${esc(_nomeInsumoLimpo(x.item.insumo))}</td><td>${esc(_regraDoInsumo(x.item).txt + _escopoTextoCurto(x.item.id))}</td><td class="num">${fmtBRL(v)}</td><td class="num">${fmtBRL(tl > 0 ? v / tl : 0)}</td></tr>`; }).join('') || '<tr><td colspan="4">Nenhum</td></tr>'}
    <tr><td colspan="2"><strong>Total compartilhados</strong></td><td class="num"><strong>${fmtBRL(totalCompart)}</strong></td><td class="num"><strong>${fmtBRL((custoLinhaFisica && custoLinhaFisica.tonTotal > 0) ? totalCompart / custoLinhaFisica.tonTotal : 0)}</strong></td></tr></tbody></table></div>

    <div class="secao"><h2>Precificação</h2>
    <table><thead><tr><th>Produto</th><th>Custo variável/unid.</th><th>Preço de venda</th><th>Margem de contribuição</th><th>Ponto de equilíbrio</th></tr></thead>
    <tbody>${precificacaoRows || '<tr><td colspan="5">—</td></tr>'}</tbody></table></div>

    <div class="secao"><h2>Resumo executivo da linha</h2>
    <ul style="margin:6px 0 0;padding-left:18px;line-height:1.6;">${resumoExecutivoItens.join('')}</ul></div>`;
}

/* ═══════════════════════ ABA RESUMO — BLOCO REMOVIVEL ═══════════════════════
   Tela de abertura do módulo: o mês inteiro numa página. Plano e realizado lado
   a lado, o alvo, onde deu desvio, e uma conferência que diz na cara se algum
   número não fecha. Tudo sai de computar() + _realConsolidar() — nenhuma conta
   nova mora aqui, senão o resumo diverge do detalhe.
   ══════════════════════════════════════════════════════════════════════════ */

/* Bar chart deitado, ordenado do maior pro menor, uma cor só: o comprimento já
   diz a magnitude, então gastar 8 matizes aqui só atrapalharia quem não enxerga
   cor. Valor e percentual escritos em toda linha — ninguém depende da barra. */
function _resBarrasRanking(itens, total) {
  const vivos = itens.filter((x) => Math.abs(x.valor) > 0.005).sort((a, b) => b.valor - a.valor);
  if (!vivos.length || total <= 0) return '<p class="cp-ajuda">Sem custo apurado neste plano.</p>';
  const TOPO = 7;
  const mostra = vivos.slice(0, TOPO);
  const resto = vivos.slice(TOPO);
  if (resto.length) mostra.push({ rotulo: `Outros (${resto.length})`, valor: resto.reduce((a, x) => a + x.valor, 0) });
  const max = Math.max(...mostra.map((x) => x.valor), 1);
  return `<div>${mostra.map((x) => `
    <div style="margin-bottom:9px;">
      <div style="display:flex;justify-content:space-between;gap:10px;font-size:11.5px;margin-bottom:3px;">
        <strong style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(x.rotulo)}</strong>
        <span style="flex:none;font-variant-numeric:tabular-nums;">${fmtBRL(x.valor)} <span class="cp-muted">${fmtPct(x.valor / total, 2)}</span></span>
      </div>
      <div style="background:#eef2f6;border-radius:4px;height:12px;">
        <div title="${esc(x.rotulo)}: ${fmtBRL(x.valor)}" style="width:${Math.max(1.5, (x.valor / max) * 100)}%;height:100%;background:var(--primary);border-radius:0 4px 4px 0;"></div>
      </div>
    </div>`).join('')}</div>`;
}

/* Régua do alvo: uma razão contra um teto. O preenchimento carrega a gravidade
   (dentro = verde, fora = vermelho) e o teto é uma marca fixa na régua. */
function _resReguaAlvo(pct, teto, rotulo, detalhe) {
  if (pct == null || !isFinite(pct)) return '';
  const escala = Math.max(pct, teto) * 1.25 || 1;
  const larg = Math.min(100, (pct / escala) * 100);
  const posTeto = Math.min(100, (teto / escala) * 100);
  const dentro = pct <= teto;
  return `<div style="margin-bottom:12px;">
    <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px;">
      <strong>${esc(rotulo)}</strong>
      <span style="font-weight:800;color:${dentro ? 'var(--success)' : 'var(--danger)'};">${fmtPct(pct, 2)}</span>
    </div>
    <div style="position:relative;background:#E3E9EF;border-radius:4px;height:16px;">
      <div style="width:${larg}%;height:100%;background:${dentro ? 'var(--success)' : 'var(--danger)'};border-radius:0 4px 4px 0;"></div>
      <div title="Teto: ${fmtPct(teto, 2)}" style="position:absolute;top:-3px;bottom:-3px;left:${posTeto}%;width:2px;background:var(--primary);"></div>
    </div>
    <div class="cp-muted" style="font-size:10.5px;margin-top:3px;">teto ${fmtPct(teto, 2)} · ${detalhe}</div>
  </div>`;
}

/* Confere se os números fecham entre si. Não é enfeite: se um dia eu quebrar um
   rateio, é aqui que aparece — na tela da pessoa, não num teste meu. */
function _resConferencia(r, cons) {
  const p = [];
  const TOL = 0.05;
  const somaBuckets = BUCKETS_CUSTO.reduce((a, b) => a + (r.plano.totais[b] || 0), 0);
  if (Math.abs(somaBuckets - r.plano.totais.GERAL) > TOL) p.push(`As famílias somam ${fmtBRL(somaBuckets)} e o total do plano é ${fmtBRL(r.plano.totais.GERAL)}.`);
  const somaItens = r.plano.resultadosItens.filter((x) => !x.item.removido).reduce((a, x) => a + x.calc.valorTotal, 0);
  if (Math.abs(somaItens - r.plano.totais.GERAL) > TOL) p.push(`Os insumos somam ${fmtBRL(somaItens)} e o total do plano é ${fmtBRL(r.plano.totais.GERAL)}.`);
  const somaLinhasPlano = (r.custoPorLinhaFisica || []).reduce((a, l) => a + l.custoTotal, 0);
  if ((r.custoPorLinhaFisica || []).length && Math.abs(somaLinhasPlano - r.plano.totais.GERAL) > TOL) p.push(`As linhas físicas somam ${fmtBRL(somaLinhasPlano)} no planejado e o total é ${fmtBRL(r.plano.totais.GERAL)}.`);
  if (cons) {
    let sr = 0; cons.linhas.forEach((e) => { sr += cons.custo[e].total; });
    if (Math.abs(sr - cons.custo['__TOTAL__'].total) > TOL) p.push(`No realizado, as linhas somam ${fmtBRL(sr)} e o total é ${fmtBRL(cons.custo['__TOTAL__'].total)} — ${fmtBRL(cons.custo['__TOTAL__'].total - sr)} sem linha neste plano.`);
    const t = cons.custo['__TOTAL__'];
    if (Math.abs((t.diretos + t.compart) - t.total) > TOL) p.push('No realizado, diretos + compartilhados não fecham com o total.');
  }
  if (p.length) return alertBox('aviso', `<strong>A conferência encontrou divergência:</strong><div style="margin-top:5px;">${p.map((x) => esc(x)).join('<br>')}</div>`);
  return alertBox('sucesso', `<strong>Conferência OK.</strong> Famílias, insumos, linhas físicas e o realizado fecham com os totais (tolerância de ${fmtBRL(TOL)}).`);
}

function _resKpi(rotulo, valor, detalhe, cor) {
  const grande = String(valor).replace(/<[^>]*>/g, '').length > 13;
  return `<div style="flex:1 1 150px;min-width:150px;border:1px solid var(--border, #e2e8f0);border-radius:10px;padding:10px 12px;background:#fff;">
    <div style="font-size:${grande ? 15 : 19}px;font-weight:800;line-height:1.25;white-space:nowrap;${cor ? `color:${cor};` : ''}">${valor}</div>
    <div class="cp-muted" style="font-size:11px;margin-top:2px;">${esc(rotulo)}</div>
    ${detalhe ? `<div class="cp-muted" style="font-size:10.5px;margin-top:1px;">${detalhe}</div>` : ''}
  </div>`;
}

function renderResumoMes() {
  const r = computar(state);
  if (!state.blocos.length) {
    return `<div class="card"><div class="empty-state"><div class="empty-icon">📊</div>
      <h3>Nenhuma linha configurada</h3>
      <p>O resumo do mês nasce da <strong>Capacidade</strong> e da <strong>Configuração da Linha</strong> — configure-as primeiro.</p></div></div>`;
  }
  const cons = state._real ? _realConsolidar(r) : null;
  const k = cons ? cons.kpi['__TOTAL__'] : null;
  const cob = _realCobertura();
  const teto = (Number(state.alvoMaximoPct) || 38) / 100;

  // ---- unidades planejadas x realizadas ----
  let unPlan = 0, unReal = 0;
  BUCKETS_CUSTO.forEach((b) => {
    if (b === 'CAULIMGRANEL') return;                    // granel não tem "unidade"
    unPlan += Number((r.metas || {})[b]) || 0;
  });
  if (cons) Object.values(cons.prodReal.porLinha).forEach((bs) => Object.entries(bs).forEach(([b, cc]) => { if (b !== 'CAULIMGRANEL') unReal += cc.sacos; }));
  const atend = unPlan > 0 ? unReal / unPlan : null;

  // ---- produção fora da linha planejada / não planejada / não produzida ----
  let foraDeLinha = 0, naoPlanejado = 0, naoProduzido = 0;
  const linhasFora = new Set();
  if (cons) {
    cons.linhas.forEach((ln) => {
      const plan = cons.prodPlan[ln] || {}, real = (cons.prodReal.porLinha[ln] || {});
      Object.entries(real).forEach(([b, cc]) => {
        if (!(plan[b] && plan[b].ton > 0)) { foraDeLinha += cc.sacos; naoPlanejado += cc.sacos; linhasFora.add(ln); }
      });
      Object.entries(plan).forEach(([b, cc]) => { if (!real[b]) naoProduzido += Number(cc.sacos) || 0; });
    });
  }

  // ---- famílias dentro do alvo ----
  let famDentro = 0, famTotal = 0;
  BUCKETS_CUSTO.forEach((b) => {
    const custo = r.plano.totais[b] || 0;
    const qtd = Number((r.metas || {})[b]) || 0;
    if (custo <= 0 || qtd <= 0) return;
    const fat = qtd * (r.precoVenda[b] || 0);
    if (fat <= 0) return;
    famTotal++; if (custo / fat <= teto) famDentro++;
  });

  const desvioCusto = cons ? cons.custo['__TOTAL__'].total - r.plano.totais.GERAL : null;

  const kpis = `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
    ${_resKpi('planejado (un)', fmtNum(unPlan, 0), null)}
    ${_resKpi('realizado (un)', cons ? fmtNum(unReal, 0) : '…', null, 'var(--primary)')}
    ${_resKpi('atendimento do plano', atend == null ? '—' : fmtPct(atend, 2), cob.fechado ? null : `${cob.cobertos} de ${cob.uteis} dias úteis`, atend == null ? null : (atend >= 1 ? 'var(--success)' : (cob.fechado ? 'var(--danger)' : '#64748b')))}
    ${_resKpi('custo planejado', fmtBRL(r.plano.totais.GERAL), null)}
    ${_resKpi('custo realizado', cons ? fmtBRL(cons.custo['__TOTAL__'].total) : '—', cob.fechado ? null : 'mês em aberto', 'var(--primary)')}
    ${/* com o mês aberto, gastar menos que o plano do mês inteiro não é economia:
          é produção que ainda não aconteceu. Fica neutro e avisado. */ ''}
    ${_resKpi('desvio de custo', desvioCusto == null ? '—' : (desvioCusto > 0 ? '+' : '') + fmtBRL(desvioCusto),
        cob.fechado ? null : 'não é economia: mês em aberto',
        desvioCusto == null || !cob.fechado ? '#64748b' : (desvioCusto <= 0 ? 'var(--success)' : 'var(--danger)'))}
    ${_resKpi('produzido fora da linha planejada (un)', fmtNum(foraDeLinha, 0), null, foraDeLinha ? 'var(--warning)' : null)}
    ${_resKpi('planejado e não produzido (un)', fmtNum(naoProduzido, 0), null, naoProduzido ? 'var(--danger)' : null)}
    ${_resKpi(`famílias dentro do alvo de ${fmtPct(teto, 2)}`, `${famDentro}<span class="cp-muted" style="font-size:13px;font-weight:600;"> / ${famTotal}</span>`, null)}
  </div>`;

  // ---- composição do custo planejado, por classe ----
  const porClasse = {};
  r.plano.resultadosItens.filter((x) => !x.item.removido).forEach((x) => {
    const cl = x.item.classe || '—';
    porClasse[cl] = (porClasse[cl] || 0) + x.calc.valorTotal;
  });
  const composicao = Object.entries(porClasse).map(([rotulo, valor]) => ({ rotulo, valor }));

  // ---- réguas de alvo ----
  const alvoPlan = r.faturamentoCalculado > 0 ? r.plano.totais.GERAL / r.faturamentoCalculado : null;
  const alvoReal = (k && k.alvoR != null) ? k.alvoR : null;
  const excesso = (alvoPlan != null && alvoPlan > teto) ? r.plano.totais.GERAL - teto * r.faturamentoCalculado : 0;
  const reguas = _resReguaAlvo(alvoPlan, teto, 'Alvo planejado — custo total ÷ faturamento',
      alvoPlan == null ? '' : (alvoPlan <= teto
        ? `dentro do alvo, com folga de ${fmtBRL(teto * r.faturamentoCalculado - r.plano.totais.GERAL)}`
        : `fora do alvo: cortar ${fmtBRL(excesso)} de custo ou faturar mais ${fmtBRL(r.plano.totais.GERAL / teto - r.faturamentoCalculado)}`))
    + (alvoReal != null ? _resReguaAlvo(alvoReal, teto, 'Alvo realizado — custo ÷ faturamento do que saiu',
        cob.fechado ? 'mês fechado' : `mês em aberto (${fmtPct(cob.fracao, 2)} dos dias úteis com produção) — só é comparável com o mês fechado`) : '');

  // ---- leitura rápida ----
  const maior = cons ? (() => {
    const todos = [...cons.detalhe['__TOTAL__'].diretos, ...cons.detalhe['__TOTAL__'].compart]
      .map((x) => ({ nome: _nomeInsumoLimpo(x.reg.item.insumo), d: x.valor - (x.planFlex != null ? x.planFlex : x.plan) }))
      .filter((x) => isFinite(x.d));
    todos.sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
    return todos[0];
  })() : null;

  const leitura = `<div class="card" style="margin-top:14px;">
    <h3 class="cp-h3">🧭 Leitura rápida do mês</h3>
    <div style="font-size:13px;line-height:1.95;">
      <strong>O que foi planejado?</strong> ${fmtNum(r.plano.tonelagem.tonTotal, 2)} ton (${fmtNum(unPlan, 0)} un) a um custo de ${fmtBRL(r.plano.totais.GERAL)}, ou ${fmtBRL(r.plano.custoPorTon.GERAL)} por tonelada.<br>
      <strong>O que saiu?</strong> ${cons ? `${fmtNum(k.tonR, 2)} ton (${fmtNum(unReal, 0)} un)${atend != null ? ` — ${fmtPct(atend, 2)} do plano` : ''}` : 'realizado ainda não carregado.'}<br>
      <strong>Quanto custou?</strong> ${cons ? (cob.fechado
        ? `${fmtBRL(cons.custo['__TOTAL__'].total)} realizado contra ${fmtBRL(r.plano.totais.GERAL)} planejado${desvioCusto != null ? ` → ${desvioCusto <= 0 ? 'gastou ' + fmtBRL(-desvioCusto) + ' a menos' : 'gastou ' + fmtBRL(desvioCusto) + ' a mais'}` : ''}`
        : `${fmtBRL(cons.custo['__TOTAL__'].total)} até aqui, com ${cob.cobertos} de ${cob.uteis} dias úteis lançados. <span class="cp-muted">Não compare com os ${fmtBRL(r.plano.totais.GERAL)} do plano: aquilo é o mês inteiro. O desvio insumo a insumo, esse sim já vale — está na aba Planejado × Realizado, medido contra o plano ajustado à produção que saiu.</span>`) : '—'}<br>
      <strong>Estamos dentro do alvo de ${fmtPct(teto, 2)}?</strong> ${alvoPlan == null ? 'sem faturamento calculado.' : (alvoPlan <= teto ? `<strong style="color:var(--success);">Sim</strong> — o plano está em ${fmtPct(alvoPlan, 2)}.` : `<strong style="color:var(--danger);">Não</strong> — o plano está em ${fmtPct(alvoPlan, 2)}, ${fmtBRL(excesso)} acima do teto.`)}<br>
      <strong>Onde deu o maior desvio?</strong> ${maior ? `${esc(maior.nome)} — ${maior.d > 0 ? '+' : ''}${fmtBRL(maior.d)} contra o plano ajustado.` : 'nada apurado ainda.'}<br>
      <strong>Alguma linha produziu fora do planejado?</strong> ${linhasFora.size ? [...linhasFora].map(esc).join(', ') + ` (${fmtNum(naoPlanejado, 0)} un).` : 'nenhuma.'}<br>
      <strong>Planejado e não produzido:</strong> ${fmtNum(naoProduzido, 0)} un.
      ${cons && cons.orfaos.length ? `<br><strong>Consumo sem item no plano:</strong> ${fmtBRL(cons.orfaos.reduce((a, o) => a + o.valor, 0))} em ${cons.orfaos.length} insumo(s) — fora do custeio.` : ''}
    </div>
  </div>`;

  /* Os dois gráficos que valem no Resumo são os mesmos da aba Planejado ×
     Realizado — chamo as MESMAS funções de propósito: dois desenhos da mesma
     coisa acabam divergindo, e aí ninguém sabe qual acreditar. */
  const grafs = cons ? (() => {
    const kb = Object.entries(k.buckets || {}).filter(([, c]) => c.sacosP > 0 || c.sacosR > 0 || c.tonP > 0 || c.tonR > 0);
    return `<div class="cp-grid-2" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:14px;">
      <div class="card"><h3 class="cp-h3">⚖️ Planejado × Realizado <span class="cp-muted">— por linha de custo, em unidades</span></h3>
        ${_realGraficoBarras(kb.map(([bk, c]) => ({ rotulo: DESTINOS[bk], un: UNIDADE_LABEL[bk] + 's',
          plan: bk === 'CAULIMGRANEL' ? c.tonP : c.sacosP, real: bk === 'CAULIMGRANEL' ? c.tonR : c.sacosR })))}</div>
      <div class="card"><h3 class="cp-h3">📈 Avanço acumulado do mês <span class="cp-muted">— em toneladas</span></h3>
        ${_realGraficoAvanco(cons, '__TOTAL__') || '<p class="cp-ajuda">Sem produção lançada no período.</p>'}</div>
    </div>`;
  })() : '';

  const cabecalho = `<div class="card" style="margin-bottom:14px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
      <div>
        <h3 class="cp-h3" style="margin:0;">📊 Resumo do mês <span class="cp-muted">— ${String(state.mes).padStart(2, '0')}/${state.ano}</span></h3>
        <p class="cp-ajuda" style="margin:2px 0 0;">O mês inteiro numa página: o que o plano previa, o que saiu, e onde os dois se afastaram.</p>
      </div>
      <div class="cp-field-row" style="gap:6px;flex-wrap:wrap;">
        <button class="btn btn-secondary btn-sm" onclick="imprimirResumoMes()">🖨️ PDF do resumo</button>
        <button class="btn btn-secondary btn-sm" onclick="imprimirRelatorioPlanRealizado()">🖨️ PDF planejado × realizado</button>
      </div>
    </div></div>`;

  return _avisoPlanoDivergente() + _avisoVinculoPorNome() + _avisoSimulacaoAtiva()
    + cabecalho
    + kpis
    + _resConferencia(r, cons)
    + (cons ? '' : alertBox('info', 'O realizado ainda não foi carregado. Abra a aba <strong>Planejado × Realizado</strong> uma vez para buscar do banco — os blocos de realizado desta tela preenchem sozinhos depois disso.'))
    + `<div class="cp-grid-2" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:14px;">
        <div class="card"><h3 class="cp-h3">💰 Composição do custo planejado</h3>
          <p class="cp-ajuda">Por classe de insumo, do maior para o menor. Total ${fmtBRL(r.plano.totais.GERAL)}.</p>
          ${_resBarrasRanking(composicao, r.plano.totais.GERAL)}</div>
        <div class="card"><h3 class="cp-h3">🎯 Alvo</h3>
          <p class="cp-ajuda">Quanto do faturamento o custo consome. A marca escura na régua é o teto.</p>
          ${reguas || '<p class="cp-ajuda">Sem faturamento calculado.</p>'}</div>
      </div>`
    + grafs
    + leitura;
}
/* Mesmo truque do bloco anterior: sobrepõe showTab/renderConteudo declarando
   depois. Nenhuma linha das versões originais precisou mudar, e apagar a região
   marcada devolve o arquivo ao que era. */
function showTab(tab) {
  if (typeof guardTab === 'function' && !guardTab(MODULO_ID, tab)) return;
  state.tab = tab;
  ['resumo', 'config', 'metas', 'linha', 'custos', 'impacto', 'geral', 'real'].forEach((t) => {
    const btn = document.getElementById('tbtn-' + t);
    if (btn) btn.classList.toggle('active', t === tab);
  });
  // o Resumo também mostra realizado: busca do banco na primeira visita
  if (tab === 'real' || tab === 'resumo') carregarRealizado();
  render();
}
function renderConteudo(r) {
  switch (state.tab) {
    case 'resumo': return renderResumoMes();
    case 'config': return renderConfig(r);
    case 'metas': return renderMetas(r);
    case 'linha': return renderConfigLinha(r);
    case 'custos': return renderCustosResultado(r);
    case 'impacto': return renderImpacto(r);
    case 'geral': return renderGeral(r);
    case 'real': return renderPlanRealizado(r);
    default: return '';
  }
}
/* ═════════════════════ FIM ABA RESUMO — BLOCO REMOVIVEL ═════════════════════ */


/* ═════════════ IMPRESSÃO — RESUMO E PLANEJADO x REALIZADO ═════════════════
   Mesma linguagem visual dos outros relatórios do módulo: tabela simples, sem
   cor de fundo, porque isso vai pra papel e pra PDF arquivado.
   ═══════════════════════════════════════════════════════════════════════════ */

function _printResumoMes(r, cons) {
  const teto = (Number(state.alvoMaximoPct) || 38) / 100;
  const k = cons ? cons.kpi['__TOTAL__'] : null;
  const alvoPlan = r.faturamentoCalculado > 0 ? r.plano.totais.GERAL / r.faturamentoCalculado : null;
  const desvio = cons ? cons.custo['__TOTAL__'].total - r.plano.totais.GERAL : null;
  const cob = _realCobertura();
  const porClasse = {};
  r.plano.resultadosItens.filter((x) => !x.item.removido).forEach((x) => {
    porClasse[x.item.classe || '—'] = (porClasse[x.item.classe || '—'] || 0) + x.calc.valorTotal;
  });
  const comp = Object.entries(porClasse).sort((a, b) => b[1] - a[1]);
  return `<div class="secao"><h2>Resumo do mês</h2>
    <table><thead><tr><th>Indicador</th><th class="num">Planejado</th><th class="num">Realizado</th><th class="num">Desvio</th></tr></thead>
    <tbody>
      <tr><td>Tonelagem</td><td class="num">${fmtNum(r.plano.tonelagem.tonTotal, 2)}</td><td class="num">${k ? fmtNum(k.tonR, 2) : '—'}</td><td class="num">${k ? fmtNum(k.tonR - r.plano.tonelagem.tonTotal, 2) : '—'}</td></tr>
      <tr><td>Custo total</td><td class="num">${fmtBRL(r.plano.totais.GERAL)}</td><td class="num">${cons ? fmtBRL(cons.custo['__TOTAL__'].total) : '—'}</td><td class="num">${desvio == null ? '—' : (desvio > 0 ? '+' : '') + fmtBRL(desvio)}</td></tr>
      <tr><td>Custo por tonelada</td><td class="num">${fmtBRL(r.plano.custoPorTon.GERAL)}</td><td class="num">${k && k.tonR > 0 ? fmtBRL(k.custoTonR) : '—'}</td><td class="num">${k && k.tonR > 0 ? fmtBRL(k.custoTonR - r.plano.custoPorTon.GERAL) : '—'}</td></tr>
      <tr><td>Faturamento</td><td class="num">${fmtBRL(r.faturamentoCalculado)}</td><td class="num">${k ? fmtBRL(k.fatR) : '—'}</td><td class="num">${k ? fmtBRL(k.fatR - r.faturamentoCalculado) : '—'}</td></tr>
      <tr><td>Alvo — custo ÷ faturamento (teto ${fmtPct(teto, 2)})</td><td class="num">${alvoPlan == null ? '—' : fmtPct(alvoPlan, 2)}</td><td class="num">${k && k.alvoR != null ? fmtPct(k.alvoR, 2) : '—'}</td><td class="num">—</td></tr>
    </tbody></table>
    ${cons && !cob.fechado ? `<p class="sub">Mês em aberto: ${cob.cobertos} de ${cob.uteis} dias úteis com produção lançada. O planejado é do mês inteiro, então o desvio de custo e o alvo realizado só ficam comparáveis com o mês fechado.</p>` : ''}
  </div>
  <div class="secao"><h2>Composição do custo planejado</h2>
    <table><thead><tr><th>Classe</th><th class="num">Valor</th><th class="num">% do total</th></tr></thead>
    <tbody>${comp.map(([cl, v]) => `<tr><td>${esc(cl)}</td><td class="num">${fmtBRL(v)}</td><td class="num">${fmtPct(v / r.plano.totais.GERAL, 2)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td><strong>Total</strong></td><td class="num"><strong>${fmtBRL(r.plano.totais.GERAL)}</strong></td><td class="num"><strong>100,00%</strong></td></tr></tfoot>
    </table></div>`;
}

/* Uma seção de Planejado × Realizado — serve pro total da fábrica e pra cada
   linha, com o mesmo código, pra não existirem duas versões do mesmo número. */
function _printRealEscopo(cons, escopo) {
  const det = cons.detalhe[escopo], cu = cons.custo[escopo], k = cons.kpi[escopo];
  if (!det) return '';
  const titulo = escopo === '__TOTAL__' ? 'Total da fábrica' : escopo;
  const linhaTab = (d) => {
    const base = d.planFlex != null ? d.planFlex : d.plan;
    const dif = Math.abs(d.valor - base) < 0.005 ? 0 : d.valor - base;
    return `<tr>
      <td>${esc(_nomeInsumoLimpo(d.reg.item.insumo))}${d.origem === REAL_ORIGEM.SEM_FONTE ? ' <em>(sem fonte)</em>' : ''}${d.origem === REAL_ORIGEM.MANUAL ? ' <em>(manual)</em>' : ''}</td>
      <td class="num">${fmtBRL(d.plan)}</td>
      <td class="num">${d.planFlex == null ? '—' : fmtBRL(d.planFlex)}</td>
      <td class="num">${d.qtd == null ? '—' : fmtNum(d.qtd, 2)}</td>
      <td class="num">${fmtBRL(d.valor)}</td>
      <td class="num">${dif > 0 ? '+' : ''}${fmtBRL(dif)}</td>
    </tr>`;
  };
  const tabela = (tit, lista) => {
    if (!lista.length) return '';
    const flex = lista.reduce((a, x) => a + (x.planFlex != null ? x.planFlex : x.plan), 0);
    const real = lista.reduce((a, x) => a + x.valor, 0);
    const plan = lista.reduce((a, x) => a + x.plan, 0);
    const ord = lista.slice().sort((a, b) => Math.abs(b.valor - (b.planFlex != null ? b.planFlex : b.plan)) - Math.abs(a.valor - (a.planFlex != null ? a.planFlex : a.plan)));
    return `<h3 style="font-size:11px;margin:8px 0 3px;">${tit}</h3>
      <table><thead><tr><th>Insumo</th><th class="num">Plano do mês</th><th class="num">Plano ajustado</th><th class="num">Qtd real</th><th class="num">Realizado</th><th class="num">Desvio</th></tr></thead>
      <tbody>${ord.map(linhaTab).join('')}</tbody>
      <tfoot><tr><td><strong>Total</strong></td><td class="num"><strong>${fmtBRL(plan)}</strong></td><td class="num"><strong>${fmtBRL(flex)}</strong></td><td></td><td class="num"><strong>${fmtBRL(real)}</strong></td><td class="num"><strong>${Math.abs(real - flex) < 0.005 ? fmtBRL(0) : (real - flex > 0 ? '+' : '') + fmtBRL(real - flex)}</strong></td></tr></tfoot>
      </table>`;
  };
  return `<div class="secao"><h2>Planejado × Realizado — ${esc(titulo)}</h2>
    <table><thead><tr><th class="num">Tonelagem plan.</th><th class="num">Tonelagem real</th><th class="num">Atingido</th><th class="num">Custo plan.</th><th class="num">Custo real</th><th class="num">Custo/ton real</th><th class="num">Alvo real</th></tr></thead>
    <tbody><tr>
      <td class="num">${fmtNum(k.tonP, 2)}</td><td class="num">${fmtNum(k.tonR, 2)}</td>
      <td class="num">${k.tonP > 0 ? fmtPct(k.tonR / k.tonP, 2) : '—'}</td>
      <td class="num">${fmtBRL(k.custoP)}</td><td class="num">${fmtBRL(cu.total)}</td>
      <td class="num">${k.tonR > 0 ? fmtBRL(k.custoTonR) : '—'}</td>
      <td class="num">${k.alvoR != null ? fmtPct(k.alvoR, 2) : '—'}</td>
    </tr></tbody></table>
    ${tabela('Insumos diretos', det.diretos)}
    ${tabela('Insumos compartilhados', det.compart)}
  </div>`;
}

function _printReal(r) {
  const cons = state._real ? _realConsolidar(r) : null;
  if (!cons) return `<div class="secao"><h2>Planejado × Realizado</h2><p class="sub">O realizado ainda não foi carregado do banco. Abra a aba Planejado × Realizado antes de imprimir.</p></div>`;
  const cob = _realCobertura();
  let soma = 0; cons.linhas.forEach((e) => { soma += cons.custo[e].total; });
  const resto = cons.custo['__TOTAL__'].total - soma;
  return `<div class="secao"><h2>Como ler este relatório</h2>
      <p class="sub"><strong>Plano ajustado</strong> é o planejado recalculado para a produção que realmente saiu — é contra ele que o desvio é medido, senão produzir menos apareceria como economia. Nos insumos diretos a régua é a ficha técnica de insumos.html. Itens marcados <em>(sem fonte)</em> não têm origem no sistema e repetem o planejado, por isso aparecem com desvio zero.
      ${cob.fechado ? '' : ` Mês em aberto: ${cob.cobertos} de ${cob.uteis} dias úteis com produção lançada.`}</p>
      ${Math.abs(resto) > 0.01 ? `<p class="sub"><strong>Atenção:</strong> ${fmtBRL(resto)} do custo realizado não tem linha neste plano — aparece no total da fábrica, mas em nenhuma linha.</p>` : ''}
    </div>
    ${_printRealEscopo(cons, '__TOTAL__')}
    ${cons.linhas.map((e) => _printRealEscopo(cons, e)).join('')}`;
}

/* Sobrepõe a versão original declarando depois, pra ensinar as duas abas novas
   sem tocar no switch original. */
function imprimirAbaAtual() {
  const r = computar(state);
  switch (state.tab) {
    case 'resumo': imprimirResumoMes(); return;
    case 'real': imprimirRelatorioPlanRealizado(); return;
    case 'config': _abrirJanelaImpressao('Capacidade', _printCapacidade() + _printProducaoETonelagem(r)); return;
    case 'metas': _abrirJanelaImpressao('Metas & Produção', _printProducaoETonelagem(r)); return;
    case 'linha': _abrirJanelaImpressao('Configuração da Linha', _printConfigLinha(r)); return;
    case 'custos': _abrirJanelaImpressao('Custos & Resultado', _printResultado(r) + _printInsumos(r) + _printPrecificacao(r) + _printPainel(r)); return;
    case 'impacto': _abrirJanelaImpressao('Simulação de Impacto', _printImpacto(r)); return;
    case 'geral': _abrirJanelaImpressao('Visão Geral', _printGeral(r)); return;
    default: imprimirRelatorioCompleto(); return;
  }
}

function imprimirRelatorioPlanRealizado() {
  const r = computar(state);
  _abrirJanelaImpressao(`Planejado × Realizado — ${String(state.mes).padStart(2, '0')}/${state.ano}`, _printReal(r));
}
function imprimirResumoMes() {
  const r = computar(state);
  const cons = state._real ? _realConsolidar(r) : null;
  _abrirJanelaImpressao(`Resumo do mês — ${String(state.mes).padStart(2, '0')}/${state.ano}`, _printResumoMes(r, cons));
}
/* ══════════ FIM IMPRESSÃO — RESUMO E PLANEJADO x REALIZADO ══════════ */


/* Bootstrap da página — igual ao padrão dos outros módulos do ERP
   (fetch do partial da sidebar + initSidebar + inicialização do módulo). */
fetch('partials/sidebar.html').then((r) => r.text()).then((html) => {
  document.getElementById('sidebar-container').innerHTML = html;
  openGroup('producao');
});
initSidebar('custo-precificacao.html');
initCustoPrecificacao();

</script>
</body>
</html>
