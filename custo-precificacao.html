// Fatia de um insumo COMPARTILHADO que cabe a UMA linha física.
// Regra geral (frete, lenha, mat.moinho, energia, arrend, diesel, epi, adm limpeza, etc.):
//   soma, por bucket, do valor do item × (tonelada da linha nesse bucket ÷ tonelada total do bucket).
// Casos especiais que NÃO seguem tonelagem:
//   folha_mod → salários dos funcionários DAQUELA linha (vinculados na Capacidade)
//   folha_admin → custo geral que entra CHEIO, rateado por tonelagem entre as linhas
//   valealim → % sobre (folha_mod da linha + fatia do admin da linha)
function _fatiaLinhaTonelagem(calc, info, tonelagem, s) {
  // Linha sem nenhuma produção nem aparece em tonPorBloco (info fica undefined). Ela
  // continua com tonelada zero, mas precisa entrar na divisão do resíduo abaixo.
  const porBucket = (info && info.tonPorBucket) || {};
  // Quantas linhas existem no plano — usado só no plano B abaixo.
  const nBlocos = (s && s.blocos && s.blocos.length) ? s.blocos.length : 1;
  let valor = 0, distribuido = 0;
  BUCKETS_CUSTO.forEach((b) => {
    const val = calc.linhas[b] || 0;
    const totBucket = tonelagem['ton' + b] || 0;
    const tonLinha = porBucket[b] || 0;
    if (totBucket > 0) { valor += val * (tonLinha / totBucket); distribuido += val; }

     base de Maio/2026 eram R$ 131.120,73 de manutenção, mat. moinho e diesel de

function _valorCompartilhadoDaLinha(item, calc, bloco, info, tonelagem, r, s) {

  // (zero se ela ficou de fora, + a parte dos grupos extra em que ela participa).
  if (_atribEscopoDe(s, item.id)) return _valorEscopoDoBloco(s, item.id, bloco.id);
  if (item.id === 'folha_mod') return _folhaModDaLinha(bloco, s);

  if (item.id === 'lenha') return _lenhaDaLinha(bloco, s);
  if (item.id === 'filtromanga') return _filtroMangaDaLinha(bloco, s);

  if (item.id === 'refeicao') return `${fmtNum(pessoasAtribuidas * dias, 0)} refeição(ões) <span class="cp-muted">(${fmtNum(pessoasAtribuidas, 1)} pessoas × ${dias}d)</span>`;

      <button class="btn btn-ghost btn-sm" onclick="abrirModalInsumo('${it.id}')">✏️</button>
    </td>`}
  </tr>`;
}
function renderInsumos(r) {
  // Ordenado por valor: 80% do custo está em meia dúzia de itens e eles ficavam
  // espalhados pela tabela, na ordem em que foram cadastrados.
  const porValor = (a, b) => b.calc.valorTotal - a.calc.valorTotal;
  const diretos = r.plano.resultadosItens.filter((x) => x.item.tipoRateio === 'direto').slice().sort(porValor);
  const compartilhados = r.plano.resultadosItens.filter((x) => x.item.tipoRateio === 'compartilhado').slice().sort(porValor);
  const totalDireto = diretos.reduce((a, x) => a + x.calc.valorTotal, 0);
  const totalCompart = compartilhados.reduce((a, x) => a + x.calc.valorTotal, 0);
  const totalGeral = r.plano.totais.GERAL;
  const tonTotal = r.plano.tonelagem.tonTotal;
  return `
  <div class="card" style="margin-bottom:16px;background:#f8fafc;">
    <p class="cp-ajuda" style="margin:0;">📖 Somente leitura — pra ajustar qualquer insumo, vá em <strong>⚙️ Configuração da Linha</strong>. Aqui é só o resultado consolidado.${(() => {
      const zerados = r.plano.resultadosItens.filter((x) => Math.abs(x.calc.valorTotal) <= 0.01).length;
      return zerados ? ` Esta tela lista os ${r.plano.resultadosItens.length} itens cadastrados, inclusive os ${zerados} que estão em R$ 0,00 neste plano; <strong>o PDF traz só os ${r.plano.resultadosItens.length - zerados} com valor</strong>.` : '';
    })()}</p>
  </div>
  <div class="card" style="margin-bottom:16px;">
    <h3 class="cp-h3">Insumos diretos <span class="cp-muted">— 100% de uma linha</span></h3>
    <div class="table-wrap cp-table-scroll"><table>
      <thead><tr><th>Classe</th><th>Insumo</th><th>Fixo/Variável</th><th>Preço Unitário</th><th>Quantidade</th><th>Unidade</th><th>Valor Total</th><th>% do Total</th></tr></thead>
      <tbody>${diretos.map((x) => linhaInsumoDireto(x.item, x.calc, totalGeral, true)).join('')}</tbody>
      <tfoot><tr style="font-weight:800;"><td colspan="6" style="padding:10px 16px;">Subtotal diretos</td><td class="cp-num" style="padding:10px 16px;">${fmtBRL(totalDireto)}</td><td class="cp-num" style="padding:10px 16px;">${fmtPct(totalGeral > 0 ? totalDireto / totalGeral : 0, 2)}</td></tr></tfoot>
    </table></div>
  </div>
  <div class="card" style="margin-bottom:16px;">
    <h3 class="cp-h3">Insumos compartilhados <span class="cp-muted">— rateados pela tonelagem (ou por linha/turno, quando aplicável)</span></h3>
    <div class="table-wrap cp-table-scroll"><table>
      <thead><tr><th>Classe</th><th>Insumo</th><th>Fixo/Variável</th><th>Base de cálculo</th><th>Quantidade total</th><th>% do total</th><th>Valor total</th></tr></thead>
      <tbody>${compartilhados.map((x) => linhaInsumoCompartilhado(x.item, x.calc, r.alertasConsumo, totalGeral, true, null, r.plano.tonelagem)).join('')}</tbody>
      <tfoot><tr style="font-weight:800;"><td colspan="5" style="padding:10px 16px;">Subtotal compartilhados</td><td class="cp-num" style="padding:10px 16px;">${fmtPct(totalGeral > 0 ? totalCompart / totalGeral : 0, 2)}</td><td class="cp-num" style="padding:10px 16px;">${fmtBRL(totalCompart)}</td></tr></tfoot>
    </table></div>
  </div>
  <div class="card cp-card-destaque">
    <div class="cp-kpi-linha cp-bloco-estreito"><span>Subtotal diretos</span><strong>${fmtBRL(totalDireto)} <span class="cp-muted">(${fmtPct(totalGeral > 0 ? totalDireto / totalGeral : 0, 2)})</span></strong></div>
    <div class="cp-kpi-linha cp-bloco-estreito"><span>Subtotal compartilhados</span><strong>${fmtBRL(totalCompart)} <span class="cp-muted">(${fmtPct(totalGeral > 0 ? totalCompart / totalGeral : 0, 2)})</span></strong></div>
    <div class="cp-kpi-linha cp-bloco-estreito" style="border-top:2px solid var(--primary);padding-top:6px;margin-top:4px;"><span><strong>TOTAL GERAL DO PLANO</strong></span><strong class="cp-destaque" style="font-size:16px;">${fmtBRL(totalDireto + totalCompart)}</strong></div>
    <div class="cp-kpi-linha cp-bloco-estreito"><span>Custo por tonelada</span><strong>${fmtBRL(tonTotal > 0 ? (totalDireto + totalCompart) / tonTotal : 0)} <span class="cp-muted">em ${fmtNum(tonTotal, 1)} ton</span></strong></div>
    <p class="cp-ajuda" style="margin:6px 0 0;">Diretos + compartilhados é a base de custo usada em todos os percentuais deste módulo — este total tem que bater com o card do topo da página e com o PDF.${Math.abs((totalDireto + totalCompart) - totalGeral) > 0.01 ? ` <strong style="color:var(--danger);">Divergência de ${fmtBRL((totalDireto + totalCompart) - totalGeral)} contra o total do motor — reporte.</strong>` : ''}</p>
  </div>`;
}

/* ---------- Modal de confirmação reutilizável (substitui o confirm() do navegador) ---------- */
function abrirConfirmacao(cfg) {
  state._confirmacao = {
    titulo: cfg.titulo || 'Confirmar',
    mensagem: cfg.mensagem || '',
    detalhes: cfg.detalhes || '',
    labelConfirmar: cfg.labelConfirmar || 'Confirmar',
    tipo: cfg.tipo || 'perigo', // perigo | atencao | normal
    acao: cfg.acao,
  };
  render();
}
function fecharConfirmacao() { state._confirmacao = null; render(); }
async function confirmarAcaoPendente() {
  const c = state._confirmacao;
  if (!c) return;
  state._confirmacao = null;
  render();
  if (typeof c.acao === 'function') await c.acao();
}
function renderModalConfirmacao() {
  const c = state._confirmacao;
  if (!c) return '';
  const cores = {
    perigo: { icone: '⚠️', cor: 'var(--danger)', btn: 'background:var(--danger);color:#fff;border-color:var(--danger);' },
    atencao: { icone: '🗑️', cor: '#b45309', btn: 'background:#b45309;color:#fff;border-color:#b45309;' },
    normal: { icone: 'ℹ️', cor: 'var(--primary)', btn: '' },
  };
  const est = cores[c.tipo] || cores.perigo;
  return `<div class="cp-modal-overlay" onclick="if(event.target===this) fecharConfirmacao();">
    <div class="cp-modal-box" style="max-width:440px;">
      <div class="cp-modal-header" style="border-bottom:2px solid ${est.cor};">
        <strong>${est.icone} ${esc(c.titulo)}</strong>
        <button class="cp-fechar-btn" onclick="fecharConfirmacao()">✕</button>
      </div>
      <div class="cp-modal-body">
        <p style="margin:0 0 8px;font-size:13.5px;line-height:1.5;">${c.mensagem}</p>
        ${c.detalhes ? `<div class="cp-modal-formula" style="font-size:12px;">${c.detalhes}</div>` : ''}
      </div>
      <div class="cp-modal-footer" style="display:flex;gap:8px;justify-content:flex-end;">
        <button class="btn btn-secondary" onclick="fecharConfirmacao()">Cancelar</button>
        <button class="btn" style="${est.btn}" onclick="confirmarAcaoPendente()">${esc(c.labelConfirmar)}</button>
      </div>
    </div>
  </div>`;
}

      + (it.valorOverrideManual != null ? campoFolhaHtml('Valor mensal (R$, sobrescrito)', 'valorOverrideManual', it.valorOverrideManual, `setInsumoOverrideValor('${it.id}', this.value)`) : ''));
    formulaHtml = `<div class="cp-modal-formula"><p class="cp-ajuda" style="margin:0 0 6px;">${it.valorOverrideManual != null ? 'Valor sobrescrito manualmente (o cálculo automático abaixo é só referência):' : 'Este item é calculado automaticamente:'}</p>${especialExplicacao(it.id)}<div class="cp-modal-total">= ${fmtBRL(calc.valorTotal)}</div></div>`;
  } else if (it.classificacao === 'FIXO') {
    camposValor = campoFolhaHtml('Valor mensal (R$)', 'valorMensal', it.valorMensalEditado, `setInsumoValorMensal('${it.id}', this.value)`);
    formulaHtml = `<div class="cp-modal-formula"><div>Valor fixo, não muda com a produção: <strong>${fmtBRL(calc.valorTotal)}</strong></div></div>`;
  } else {
    camposValor = campoFolhaHtml('Custo por tonelada (R$/ton, produção total)', 'custoPorTon', it.custoPorTonEditado, `setInsumoCustoPorTon('${it.id}', this.value)`) + renderCalculadoraCustoPorTon(it.id);
    formulaHtml = `<div class="cp-modal-formula"><div>${fmtBRL(it.custoPorTonEditado)}/ton × ${fmtNum(r.plano.tonelagem.tonTotal, 2)} ton = <strong>${fmtBRL(calc.valorTotal)}</strong></div></div>`;
  }

  const pctBreakdown = `<div class="cp-modal-formula" style="margin-top:10px;">
    <div style="font-weight:700;margin-bottom:6px;">Como se divide entre as linhas: ${it.pctManual ? `<button class="cp-fechar-btn" onclick="resetInsumoPct('${it.id}')" title="Voltar pro automático">🔄 resetar</button>` : ''}</div>
    ${BUCKETS_CUSTO.map((b) => `<div class="cp-field-row" style="margin-bottom:4px;"><span style="flex:1;">${DESTINOS[b]}</span>
      <input class="form-input cp-input-sm" type="number" min="0" max="100" step="1" style="width:70px;"
        value="${it.pctManual ? it.pctManual[b] : arred((calc.valorTotal > 0 ? calc.linhas[b] / calc.valorTotal : 0) * 100, 1)}"
        onchange="setInsumoPctManual('${it.id}','${b}', this.value)"> % = ${fmtBRL(calc.linhas[b])}</div>`).join('')}
  </div>`;

  const escopoHtml = ESCOPO_IDS.includes(it.id) ? renderEscopoInsumo(it.id) : '';

  return `<div class="cp-modal-overlay" onclick="if(event.target===this) fecharModalInsumo();">
    <div class="cp-modal-box">
      <div class="cp-modal-header"><strong>${esc(it.insumo)}</strong><button class="cp-fechar-btn" onclick="fecharModalInsumo()">✕</button></div>
      <div class="cp-modal-body">
        <div class="form-group cp-field-row"><label class="form-label">Classificação</label>${classifSelect}</div>
        <div class="form-group cp-field-row"><label class="form-label">Natureza</label>${naturezaSelectHtml(it)}</div>
        <div class="form-group cp-field-row"><label class="form-label">Centro de custo</label>${centroCustoSelectHtml(it)}</div>
        ${camposValor}
        ${formulaHtml}
        ${escopoHtml}
        ${it.tipoRateio === 'compartilhado' && !it.especial ? pctBreakdown : ''}
      </div>
      <div class="cp-modal-footer"><button class="btn btn-primary" onclick="fecharModalInsumo();">Concluído</button></div>
    </div>
  </div>`;
}
/* ---- campo simples de número (usado no modal de insumo) ---- */
// Interpreta um número digitado em formato brasileiro OU americano, sem quebrar:
//  "8.000,56" -> 8000.56 | "8000,56" -> 8000.56 | "8000.56" -> 8000.56 | "1.234.567,89" -> 1234567.89
function parseNumeroBR(texto) {
  if (typeof texto === 'number') return texto;
  let s = String(texto == null ? '' : texto).trim();
  if (!s) return 0;
  s = s.replace(/[^\d.,-]/g, ''); // tira R$, espaços, etc.
  const temVirgula = s.includes(',');
  const temPonto = s.includes('.');
  if (temVirgula && temPonto) {
    // o último separador que aparecer é o decimal
    if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.'); // BR: ponto=milhar, vírgula=decimal
    else s = s.replace(/,/g, ''); // US: vírgula=milhar, ponto=decimal
  } else if (temVirgula) {
    s = s.replace(',', '.'); // só vírgula = decimal brasileiro
  }
  // só ponto: já está no formato certo (US) — não mexe
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function campoFolhaHtml(label, campo, valor, onchangeExpr) {
  const v = (valor == null || valor === '') ? '' : Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
  return `<div class="form-group cp-field-row"><label class="form-label">${label}</label>
    <input class="form-input" type="text" inputmode="decimal" value="${v}" onchange="${onchangeExpr}"></div>`;
}
// Campo do MODAL: grava a cada tecla (oninput → setter silencioso, sem re-render) e atualiza a

function campoModalHtml(label, valor, silentExpr, changeExpr) {

}

  if (id === 'epi') return '<div>Soma de quantidade × preço unitário de cada EPI cadastrado abaixo.</div>';
  if (id === 'adm_geral') return '<div>Soma de quantidade × preço unitário de cada item administrativo cadastrado abaixo.</div>';
  if (id === 'matconsumo') return '<div>Soma de quantidade × preço unitário de cada produto de limpeza cadastrado abaixo.</div>';
  if (id === 'energia') {
    const ativosIds = (state.blocos || []).map((b) => b.id);
    const total = _totalGrupos(state.energia, ativosIds);
    const nGrupos = (state.energia.grupos || []).length;
    return `<div>Soma dos grupos de rateio da energia: <strong>${nGrupos} grupo(s)</strong>, total <strong>R$${fmtNum(total, 2)}</strong>. Cada grupo divide seu valor entre as linhas marcadas, proporcional à tonelagem.</div>`;
  }
  if (id === 'diesel') return '<div>Consumo total de diesel próprio no mês (litros) × preço do litro. O valor é rateado entre as linhas pela tonelagem de cada uma.</div>';
  return '';
}

function _totalPalletsFabrica() { return state._ultimoTotalPallets || 0; }
function renderCalculadoraCustoPorTon(id) {

function aplicarCalculoCustoPorTon(id) {

/* ---------- TAB: Resultado por linha (igual antes) ---------- */

// `bloco` OPCIONAL: sem ele o card mostra a fábrica inteira (aba Custos & Resultado);
// com ele mostra só a fatia DESTA linha (aba Configuração da Linha). Antes a aba da
// linha chamava sem bloco, então a seção "Resultado desta linha" exibia o total do
// produto na fábrica inteira — somando o que as OUTRAS linhas produzem do mesmo item.
function cardResultadoLinha(r, p, label, bloco) {
  let qTon = r.plano.tonelagem['ton' + p] || 0; // toneladas deste produto
  let qUnid = p === 'CAULIMGRANEL' ? qTon : (Number(r.metas[p]) || 0); // sacos/bags deste produto
  let total = r.plano.totais[p]; let custoTon = r.plano.custoPorTon[p]; let custoUnit = r.plano.custoPorUnidade[p]; let c = r.plano.porClassificacao[p];
  if (bloco) {
    const info = r.tonPorBloco[bloco.id];
    const cb = _custosDaLinhaPorBucket(r, bloco);
    qTon = info ? (info.tonPorBucket[p] || 0) : 0;
    qUnid = p === 'CAULIMGRANEL' ? qTon : (cb.qtdB[p] || 0);
    c = { VARIAVEL: cb.varB[p] || 0, FIXO: cb.fixB[p] || 0 };
    total = c.VARIAVEL + c.FIXO;
    custoTon = qTon > 0 ? total / qTon : 0;
    custoUnit = qUnid > 0 ? total / qUnid : 0;
  }
  return `<div class="card cp-card">
    <div class="cp-card-header"><strong>${label}</strong>${bloco ? '<span class="cp-muted" style="font-size:10px;">só desta linha</span>' : ''}</div>
    <div class="cp-kpi-linha"><span>Custo total</span><strong>${fmtBRL(total)}</strong></div>
    <div class="cp-kpi-linha"><span>Custo / tonelada</span><strong>${fmtBRL(custoTon)}</strong></div>
    ${UNIDADE_LABEL[p] !== 'tonelada' ? `<div class="cp-kpi-linha"><span>Custo / ${UNIDADE_LABEL[p]}</span><strong>${fmtBRL(custoUnit)}</strong></div>` : ''}
    <div class="cp-barra-classif">
      <div class="cp-seg cp-seg-abs" style="width:${total > 0 ? c.VARIAVEL / total * 100 : 0}%"></div>
      <div class="cp-seg cp-seg-fixo" style="width:${total > 0 ? c.FIXO / total * 100 : 0}%"></div>
    </div>
    <div class="cp-legenda">
      <span><i class="cp-dot cp-dot-abs"></i>Variável ${fmtPct(total > 0 ? c.VARIAVEL / total : 0, 2)}</span>
      <span><i class="cp-dot cp-dot-fixo"></i>Fixo ${fmtPct(total > 0 ? c.FIXO / total : 0, 2)}</span>
    </div>
    ${(() => {
      // Tabela TRANSPOSTA: antes eram 4 colunas (rótulo + Total + R$/ton + R$/unid.) e
      // não cabiam nos ~270px do card — a última coluna ficava cortada, com barra de
      // rolagem. Agora são sempre 3 colunas (métrica + Variável + Fixo), o "R$" sai das
      // células e vai pro cabeçalho, e os rótulos da esquerda são curtos.
      const un = UNIDADE_LABEL[p];
      const linhas = [
        ['Total', c.VARIAVEL, c.FIXO],
        ['por tonelada', qTon > 0 ? c.VARIAVEL / qTon : 0, qTon > 0 ? c.FIXO / qTon : 0],
      ];
      if (un !== 'tonelada') linhas.push([`por ${un}`, qUnid > 0 ? c.VARIAVEL / qUnid : 0, qUnid > 0 ? c.FIXO / qUnid : 0]);
      return `<table class="cp-tabela-mini">
        <thead><tr><th>Em R$</th><th class="cp-num">Variável</th><th class="cp-num">Fixo</th></tr></thead>
        <tbody>${linhas.map(([rot, v, f]) => `<tr><td>${rot}</td><td class="cp-num">${fmtNum(v, 2)}</td><td class="cp-num">${fmtNum(f, 2)}</td></tr>`).join('')}</tbody>
      </table>`;
    })()}
  </div>`;
}

        <tr><td>Alvo (custo ÷ faturamento)</td>${state.cenarios.map((c) => `<td class="cp-num">${c.dados.alvoPct != null ? fmtPct(c.dados.alvoPct, 2) : '<span class="cp-muted">—</span>'}</td>`).join('')}<td class="cp-num cp-num-forte">${fmtPct(r.alvo.atualPct, 2)}</td></tr>
      </tbody>

/* Custo por linha física.
   ANTES: usava `r.custoPorLinhaFisica`, que rateia puro por tonelagem. Isso fazia a
   MESMA linha aparecer com valores diferentes aqui e na aba Configuração da Linha
   (Linha 2: R$ 155.172,58 aqui × R$ 147.578,85 lá; Emitec: R$ 0,00 aqui × R$ 23.173,33
   lá). A Configuração da Linha já tinha sido migrada para `_totaisDaLinhaFisica`
   — diretos + compartilhados da linha, com o resíduo das linhas sem tonelagem
   dividido entre elas — e esta aba tinha ficado para trás.
   AGORA: as duas usam a mesma base. O detalhe por produto vem de
   `_custosDaLinhaPorBucket`; o que sobra dele (o resíduo de linha parada, que não
   tem produto onde cair) aparece numa linha própria em vez de sumir. */
function renderCustoPorLinhaFisica(r) {
  const blocos = state.blocos || [];
  if (!blocos.length) return `<div class="card" style="margin-top:16px;">
    <h3 class="cp-h3">Custo por linha física</h3>
    <p class="cp-ajuda">Configure a Capacidade para ver o custo por linha física.</p></div>`;

  let somaLinhas = 0;
  const secoes = blocos.map((bloco) => {
    const t = _totaisDaLinhaFisica(r, bloco, state);
    const cb = _custosDaLinhaPorBucket(r, bloco);
    const info = r.tonPorBloco[bloco.id];
    somaLinhas += t.total;
    const produtos = BUCKETS_CUSTO
      .map((b) => ({ b, ton: info ? (info.tonPorBucket[b] || 0) : 0, custo: (cb.varB[b] || 0) + (cb.fixB[b] || 0) }))
      .filter((x) => x.ton > 1e-9 || Math.abs(x.custo) > 0.01)
      .sort((a, b) => b.custo - a.custo);
    const somaProdutos = produtos.reduce((a, x) => a + x.custo, 0);
    const residuo = t.total - somaProdutos;   // custo fixo de linha sem tonelagem
    return `<div class="cp-secao" style="margin-top:14px;">
      <div class="cp-kpi-linha cp-bloco-estreito" style="border-bottom:2px solid var(--primary);padding-bottom:5px;">
        <span style="color:var(--primary);font-weight:800;">🏭 ${esc(bloco.linhaNome || '(sem nome)')}</span>
        <strong>${fmtNum(t.ton, 1)} ton · ${fmtBRL(t.total)}${t.ton > 0 ? ` · ${fmtBRL(t.porTon)}/ton` : ' <span class="cp-muted" style="font-weight:400;">· sem produção</span>'}</strong>
      </div>
      <div class="table-wrap cp-tabela-estreita"><table>
        <thead><tr><th>Produto</th><th class="cp-num">Toneladas</th><th class="cp-num">Custo atribuído</th><th class="cp-num">% da linha</th></tr></thead>
        <tbody>
          ${produtos.map((x) => `<tr><td>${DESTINOS[x.b]}</td><td class="cp-num">${fmtNum(x.ton, 2)}</td><td class="cp-num">${fmtBRL(x.custo)}</td><td class="cp-num">${fmtPct(t.total > 0 ? x.custo / t.total : 0, 2)}</td></tr>`).join('')}
          ${Math.abs(residuo) > 0.01 ? `<tr><td colspan="2"><em>Custo fixo sem produção para absorver</em> <span class="cp-muted">— a linha não tem tonelagem planejada, então este valor é dividido igualmente entre as linhas</span></td><td class="cp-num">${fmtBRL(residuo)}</td><td class="cp-num">${fmtPct(t.total > 0 ? residuo / t.total : 0, 2)}</td></tr>` : ''}
        </tbody>
        <tfoot><tr style="font-weight:800;"><td>Total da linha</td><td class="cp-num">${fmtNum(t.ton, 2)}</td><td class="cp-num">${fmtBRL(t.total)}</td><td class="cp-num">${fmtPct(1, 2)}</td></tr></tfoot>
      </table></div>
    </div>`;
  }).join('');

  const dif = somaLinhas - r.plano.totais.GERAL;
  return `<div class="card" style="margin-top:16px;">
    <h3 class="cp-h3">Custo por linha física <span class="cp-muted">— cada linha e o que ela produziu</span></h3>
    <p class="cp-ajuda">Mesma base da aba <strong>⚙️ Configuração da Linha</strong>: diretos da linha + a fatia dela em cada compartilhado. Linha sem tonelagem planejada ainda carrega custo fixo, e essa parcela aparece numa linha própria da tabela.</p>
    ${secoes}
    <div class="cp-kpi-linha cp-bloco-estreito" style="margin-top:14px;border-top:2px solid var(--primary);padding-top:6px;">
      <span><strong>Soma das linhas</strong></span>
      <strong>${fmtBRL(somaLinhas)}${Math.abs(dif) > 0.01 ? ` <span style="color:var(--danger);">— não fecha com o total do plano (${fmtBRL(dif)})</span>` : ' <span class="cp-muted">= total do plano</span>'}</strong>
    </div>
  </div>`;
}

/* ---------- TAB: Precificação & margem (igual antes) ---------- */

/* Card de precificação — SOMENTE LEITURA.
   Preço e margem alvo são editados na aba Configuração da Linha; ter dois lugares
   editando o mesmo campo já causou divergência antes. O ramo editável que existia
   aqui nunca era chamado (o único chamador passava `editavel = false`) e foi removido.

   O que mudou: o card mostrava só o custo VARIÁVEL, então um produto que cobre o
   variável mas não o custo cheio aparecia verde, com margem positiva, enquanto perdia
   dinheiro. Agora o custo cheio é o piso, e entre o piso e o preço de tabela fica a
   zona de negociação. */
function cardPrecificacao(r, p, label, unidade) {
  const custoVar = r.custoVariavelPorUnidade[p];
  const custoCheio = _custoCheioPorUnidade(r, p);
  const preco = r.precoVenda[p];
  const tabela = _precoDeTabela(r, p);
  const qtd = _qtdDoBucket(r, p);
  const m = r.margem[p];
  const pe = r.pontoEquilibrio[p];
  const resultadoUnid = preco - custoCheio;          // lucro/prejuízo REAL por unidade
  const resultadoMes = resultadoUnid * qtd;
  const abaixoDoVariavel = m.margemRS < 0;
  const abaixoDoCheio = !abaixoDoVariavel && preco < custoCheio;
  const abaixoDaTabela = !abaixoDoVariavel && !abaixoDoCheio && isFinite(tabela) && preco < tabela;
  const corResultado = resultadoUnid < 0 ? 'var(--danger)' : '#15803d';

  // Faixa de preço: onde o preço de hoje cai entre prejuízo, negociação e tabela.
  const escala = Math.max(preco, isFinite(tabela) ? tabela : 0, custoCheio) * 1.15 || 1;
  const pctEsc = (v) => Math.max(0, Math.min(100, (v / escala) * 100));
  const barra = `<div style="margin-top:8px;">
    <div style="position:relative;height:12px;border-radius:7px;overflow:hidden;background:#e2e8f0;">
      <div style="position:absolute;left:0;width:${pctEsc(custoVar)}%;height:100%;background:#b91c1c;"></div>
      <div style="position:absolute;left:${pctEsc(custoVar)}%;width:${Math.max(0, pctEsc(custoCheio) - pctEsc(custoVar))}%;height:100%;background:#f87171;"></div>
      <div style="position:absolute;left:${pctEsc(custoCheio)}%;width:${Math.max(0, (isFinite(tabela) ? pctEsc(tabela) : 100) - pctEsc(custoCheio))}%;height:100%;background:#fbbf24;"></div>
      <div style="position:absolute;left:${isFinite(tabela) ? pctEsc(tabela) : 100}%;right:0;height:100%;background:#22c55e;"></div>
      <div title="preço de hoje" style="position:absolute;top:-4px;left:${pctEsc(preco)}%;width:4px;height:20px;background:#0f172a;border:1px solid #fff;border-radius:2px;transform:translateX(-50%);box-shadow:0 0 0 1px rgba(15,23,42,.35);"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:9.5px;color:#64748b;margin-top:3px;">
      <span>prejuízo</span><span>piso ${fmtBRL(custoCheio)}</span><span>negociação</span><span>tabela ${isFinite(tabela) ? fmtBRL(tabela) : '—'}</span>
    </div>
  </div>`;

  return `<div class="card cp-card">
    <div class="cp-card-header"><strong>${label}</strong><span class="cp-muted" style="font-size:10px;">${fmtNum(qtd, 0)} ${unidade}(s) no plano</span></div>
    <div class="cp-kpi-linha"><span>Custo variável / ${unidade}</span><strong>${fmtBRL(custoVar)}</strong></div>
    <div class="cp-kpi-linha"><span>Custo cheio / ${unidade} <span class="cp-muted">(variável + fixo)</span></span><strong>${fmtBRL(custoCheio)}</strong></div>
    <div class="cp-kpi-linha"><span>Preço de venda / ${unidade}</span><strong>${fmtBRL(preco)}</strong></div>
    ${barra}
    <div class="cp-kpi-linha" style="margin-top:8px;"><span>Piso <span class="cp-muted">— abaixo disso é prejuízo</span></span><strong>${fmtBRL(custoCheio)}</strong></div>
    <div class="cp-kpi-linha"><span>Preço de tabela <span class="cp-muted">— piso + margem alvo de ${fmtPct(state.margemAlvo[p], 2)}</span></span><strong>${isFinite(tabela) ? fmtBRL(tabela) : '—'}</strong></div>
    <div class="cp-kpi-linha" style="border-top:1px dashed var(--border);padding-top:4px;"><span>Margem de contribuição</span><strong style="${abaixoDoVariavel ? 'color:var(--danger)' : ''}">${fmtBRL(m.margemRS)} (${fmtPct(m.margemPct, 2)})</strong></div>
    <div class="cp-kpi-linha"><span><strong>Resultado / ${unidade}</strong> <span class="cp-muted">pelo custo cheio</span></span><strong style="color:${corResultado};">${fmtBRL(resultadoUnid)}</strong></div>
    <div class="cp-kpi-linha"><span><strong>Resultado no mês</strong></span><strong style="color:${corResultado};">${fmtBRL(resultadoMes)}</strong></div>
    <div class="cp-kpi-linha"><span>Ponto de equilíbrio</span><strong>${isFinite(pe) ? fmtNum(pe, 0) + ' ' + unidade + 's/mês' : '— (margem negativa)'}</strong></div>
    ${abaixoDoVariavel ? alertBox('critico', `Preço abaixo do <strong>custo variável</strong>: cada ${unidade} vendido aumenta o prejuízo. Prejuízo de ${fmtBRL(-resultadoUnid)} por ${unidade}, ${fmtBRL(-resultadoMes)} no mês.`) : ''}
    ${abaixoDoCheio ? alertBox('critico', `Cobre o custo variável, mas <strong>não o custo cheio</strong> de ${fmtBRL(custoCheio)}. A margem de contribuição acima é positiva e ainda assim o produto perde ${fmtBRL(-resultadoUnid)} por ${unidade} — ${fmtBRL(-resultadoMes)} no mês. Preço mínimo para empatar: ${fmtBRL(custoCheio)}.`) : ''}
    ${abaixoDaTabela ? alertBox('atencao', `Dá lucro, mas está <strong>abaixo do preço de tabela</strong> de ${fmtBRL(tabela)} — ${fmtBRL(tabela - preco)} de espaço por ${unidade}, ${fmtBRL((tabela - preco) * qtd)} no mês.`) : ''}
  </div>`;
}
function renderPrecificacao(r, buckets) {
  // Só produtos com produção: sem isso um bucket zerado aparece com custo R$ 0,00 e
  // margem de 100%, liderando a tela sem existir no plano.
  const lista = buckets || _bucketsProduzidos(r);
  if (!lista.length) return '<p class="cp-ajuda">Nenhum produto com produção neste plano — configure a Capacidade.</p>';
  const cardsHtml = lista.map((b) => cardPrecificacao(r, b, DESTINOS[b], UNIDADE_LABEL[b])).join('');
  return `<h3 class="cp-h3">Precificação e margem por produto</h3>
  <p class="cp-ajuda">O <strong>piso</strong> é o custo cheio (variável + fixo rateado): abaixo dele o produto dá prejuízo, mesmo que a margem de contribuição esteja positiva. O <strong>preço de tabela</strong> é o piso com a margem alvo. Entre os dois está a zona de negociação.</p>
  <div class="cp-grid-cards">${cardsHtml}</div>
  <p class="cp-ajuda">Preço de venda e margem alvo são definidos na aba <strong>⚙️ Configuração da Linha</strong> — aqui é só leitura.</p>`;
}

/* ---------- TAB: Painel executivo (gargalo agora é por produto real) ---------- */

function renderAlvoDetalhado(r) {
  const alvoPct = state.alvoMaximoPct; // ex.: 38 (%)
  const atualPct = r.alvo.atualPct * 100; // custo produtivo ÷ faturamento, em %
  const faturamento = r.faturamentoCalculado || 0;
  const custoProdutivo = r.plano.totais.GERAL;
  const sobra = faturamento - custoProdutivo; // "lucro bruto" antes de impostos/comercial
  const sobraPct = faturamento > 0 ? (sobra / faturamento) * 100 : 0;

  // 3 faixas: verde (folgado, <= alvo-8), amarelo (perto, entre alvo-8 e alvo), vermelho (estourou, > alvo)
  const zonaVerdeAte = Math.max(0, alvoPct - 8);
  let zona, zonaCor, zonaTexto;
  if (atualPct <= zonaVerdeAte) { zona = 'verde'; zonaCor = '#15803d'; zonaTexto = 'Folgado — bem dentro do alvo'; }
  else if (atualPct <= alvoPct) { zona = 'amarelo'; zonaCor = '#b45309'; zonaTexto = 'No limite — perto do teto do alvo'; }
  else { zona = 'vermelho'; zonaCor = '#b91c1c'; zonaTexto = 'Estourou — custo acima do alvo'; }

  const distancia = alvoPct - atualPct; // + = folga, - = quanto passou
  const posicaoPonteiro = Math.max(0, Math.min(100, (atualPct / Math.max(alvoPct * 1.5, atualPct * 1.1, 1)) * 100));

  return `<div class="card cp-card-destaque" style="margin-bottom:14px;">
    <h3 class="cp-h3">🎯 Alvo de custo — estamos no verde?</h3>
    <div style="display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;">
      <div style="flex:1;min-width:220px;">
        <div style="font-size:28px;font-weight:800;color:${zonaCor};line-height:1;">${fmtNum(atualPct, 2)}%</div>
        <div style="font-size:12.5px;color:${zonaCor};font-weight:700;margin-top:4px;">${zonaTexto}</div>
        <div class="cp-ajuda" style="margin-top:6px;">Custo total do plano ÷ faturamento — inclui folha administrativa e arrendamento. Alvo máximo:
          <input class="cp-alvo-input" type="number" step="1" value="${alvoPct}" onchange="setAlvoMaximoPct(this.value)" style="width:56px;">%
          ${distancia >= 0 ? `<span style="color:#15803d;font-weight:700;">— sobra ${fmtNum(distancia, 2)} p.p. de folga</span>` : `<span style="color:#b91c1c;font-weight:700;">— passou ${fmtNum(Math.abs(distancia), 2)} p.p. do teto</span>`}
        </div>
      </div>
      <div style="flex:1;min-width:220px;">
        <div class="cp-kpi-linha"><span>Faturamento ${state.faturamentoManual && state.faturamentoManual.ativo ? '<strong style="color:#b45309;">informado à mão</strong>' : 'estimado <span class="cp-muted">(qtd × preço)</span>'}</span><strong>${fmtBRL(faturamento)}</strong></div>
        <div class="cp-kpi-linha"><span>Custo total do plano</span><strong>${fmtBRL(custoProdutivo)}</strong></div>
        <div class="cp-kpi-linha" style="border-top:1px dashed var(--border);padding-top:4px;"><span>Sobra (antes de impostos/comercial)</span><strong style="color:${sobra >= 0 ? '#15803d' : '#b91c1c'};">${fmtBRL(sobra)} (${fmtNum(sobraPct, 2)}%)</strong></div>
      </div>
    </div>
    <div style="margin-top:14px;">
      <div style="position:relative;height:14px;border-radius:8px;overflow:hidden;background:linear-gradient(90deg,#15803d 0%,#15803d ${(zonaVerdeAte / Math.max(alvoPct * 1.5, 1) * 100)}%,#f59e0b ${(zonaVerdeAte / Math.max(alvoPct * 1.5, 1) * 100)}%,#f59e0b ${(alvoPct / Math.max(alvoPct * 1.5, 1) * 100)}%,#b91c1c ${(alvoPct / Math.max(alvoPct * 1.5, 1) * 100)}%,#b91c1c 100%);">
        <div style="position:absolute;top:-3px;left:${posicaoPonteiro}%;width:3px;height:20px;background:#0f172a;border-radius:2px;transform:translateX(-50%);"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:#64748b;margin-top:3px;">
        <span>0%</span><span>Folga até ${fmtNum(zonaVerdeAte, 0)}%</span><span>Alvo ${fmtNum(alvoPct, 0)}%</span><span>${fmtNum(Math.max(alvoPct * 1.5, 1), 0)}%</span>
      </div>
    </div>
    <p class="cp-ajuda" style="margin-top:10px;">${zona === 'vermelho'
      ? 'Pra voltar ao alvo: suba o preço de venda, reduza custo dos itens que mais pesam (veja o ranking de sensibilidade abaixo) ou aumente a produção diluindo os custos fixos.'
      : zona === 'amarelo'
      ? 'Está no limite. Uma queda de preço ou aumento de custo pode estourar o alvo — vale acompanhar de perto.'
      : 'Boa folga em relação ao alvo. Espaço pra negociar preço ou absorver um aumento pontual de custo.'}</p>
  </div>`;
}

// Resumo executivo DESTA linha (só dados da linha): gargalo da linha, produto mais rentável
// da linha, ponto de equilíbrio da linha e status do alvo. Nada de geral da fábrica aqui.
function _dadosResumoLinha(r, bloco) {
  const info = r.tonPorBloco[bloco.id];
  const bucketsRelevantes = info ? BUCKETS_CUSTO.filter((b) => info.tonPorBucket[b] > 1e-9) : [];
  // MESMA base do topo da aba (diretos + compartilhados desta linha). Usar
  // `custoPorLinhaFisica` aqui deixava o resumo executivo com um total diferente
  // do card de resumo e das tabelas, na MESMA tela.
  const custoTotalLinha = _totaisDaLinhaFisica(r, bloco, state).total;
  let faturamentoLinha = 0, fixoLinha = 0;
  const resultadoPorProduto = [];
  bucketsRelevantes.forEach((b) => {
    const tonTotalBucket = r.plano.tonelagem['ton' + b];
    const tonNestaLinha = info ? info.tonPorBucket[b] : 0;
    const share = tonTotalBucket > 0 ? tonNestaLinha / tonTotalBucket : 0;
    const qtyTotalBucket = b === 'CAULIMGRANEL' ? r.plano.tonelagem.tonCAULIMGRANEL : r.metas[b];
    const qtyLinha = qtyTotalBucket * share;
    faturamentoLinha += qtyLinha * r.precoVenda[b];
    fixoLinha += r.plano.porClassificacao[b].FIXO * share;
  });
  // margem REAL desta linha (custo variável da linha ÷ quantidade da linha)
  _precificacaoDaLinha(r, bloco).forEach((p) => resultadoPorProduto.push({ b: p.b, qtyLinha: p.qtd, margemRS: p.margemRS, lucro: p.lucro }));
  const alvoPctLinha = faturamentoLinha > 0 ? (custoTotalLinha / faturamentoLinha) * 100 : 0;
  const dentroAlvo = alvoPctLinha <= state.alvoMaximoPct;
  const gargalosLinha = r.producao.detalhes.filter((d) => d.blocoId === bloco.id && d.excede).sort((a, b) => (b.demanda - b.qtdMax) - (a.demanda - a.qtdMax));
  const maisRentavel = resultadoPorProduto.slice().sort((a, b) => b.lucro - a.lucro)[0];
  let numMargem = 0, denMargem = 0;
  resultadoPorProduto.forEach((p) => { numMargem += p.margemRS * p.qtyLinha; denMargem += p.qtyLinha; });
  const margemMediaLinha = denMargem > 0 ? numMargem / denMargem : 0;
  const precoMedioLinha = denMargem > 0 ? faturamentoLinha / denMargem : 0;
  const faturamentoMinimoLinha = margemMediaLinha > 0 ? (fixoLinha / margemMediaLinha) * precoMedioLinha : 0;
  return { faturamentoLinha, custoTotalLinha, fixoLinha, alvoPctLinha, dentroAlvo, piorGargalo: gargalosLinha[0], maisRentavel, faturamentoMinimoLinha };
}
function renderResumoExecutivoLinha(r, bloco) {
  if (!bloco) return '<p class="cp-ajuda">Selecione uma linha.</p>';
  const d = _dadosResumoLinha(r, bloco);
  const itens = [];
  if (d.piorGargalo) itens.push(`<li><strong>Gargalo:</strong> ${esc(d.piorGargalo.produtoNome)} — demanda de ${fmtNum(d.piorGargalo.demanda, 0)} acima do máximo de ${fmtNum(d.piorGargalo.qtdMax, 0)} que a linha consegue produzir.</li>`);
  else itens.push('<li><strong>Capacidade:</strong> a linha dá conta da demanda planejada, sem gargalo.</li>');
  if (d.maisRentavel) itens.push(`<li><strong>Mais rentável:</strong> ${DESTINOS[d.maisRentavel.b]} gera o maior lucro desta linha (${fmtBRL(d.maisRentavel.lucro)} no mês).</li>`);
  itens.push(`<li><strong>Ponto de equilíbrio:</strong> a linha precisa faturar cerca de ${fmtBRL(d.faturamentoMinimoLinha)} pra cobrir o custo fixo de ${fmtBRL(d.fixoLinha)}.</li>`);
  itens.push(`<li><strong>Alvo de custo:</strong> está em <strong style="color:${d.dentroAlvo ? '#15803d' : '#b91c1c'};">${fmtNum(d.alvoPctLinha, 1)}%</strong> (custo ÷ faturamento) — ${d.dentroAlvo ? 'dentro' : 'acima'} do alvo de ${state.alvoMaximoPct}%.</li>`);
  return `<div class="card" style="padding:12px;">
    <div class="cp-kpi-linha"><span>Faturamento previsto da linha</span><strong>${fmtBRL(d.faturamentoLinha)}</strong></div>
    <div class="cp-kpi-linha"><span>Custo total da linha</span><strong>${fmtBRL(d.custoTotalLinha)}</strong></div>
    <ul style="margin:8px 0 0;padding-left:18px;line-height:1.7;">${itens.join('')}</ul>
  </div>`;
}

// Custo VARIÁVEL e FIXO reais DESTA linha, por produto (bucket), com a quantidade da linha.
// É a base da margem por linha: cada linha tem seu próprio custo variável por unidade, em vez
// de usar a média da fábrica (duas linhas que fazem o mesmo produto podem ter margens diferentes).
function _custosDaLinhaPorBucket(r, bloco) {
  const info = r.tonPorBloco[bloco.id];
  const varB = {}, fixB = {}, qtdB = {};
  BUCKETS_CUSTO.forEach((b) => { varB[b] = 0; fixB[b] = 0; qtdB[b] = 0; });
  const tonTotalLinha = info ? info.tonTotal : 0;
  const shareBucket = (b) => {
    const tonTotalBucket = r.plano.tonelagem['ton' + b] || 0;
    const tonLinha = info ? (info.tonPorBucket[b] || 0) : 0;
    return tonTotalBucket > 0 ? tonLinha / tonTotalBucket : 0;
  };
  BUCKETS_CUSTO.forEach((b) => {
    const qTot = b === 'CAULIMGRANEL' ? r.plano.tonelagem.tonCAULIMGRANEL : (Number(r.metas[b]) || 0);
    qtdB[b] = qTot * shareBucket(b);
  });
  r.plano.resultadosItens.forEach((x) => {
    if (x.item.removido) return;
    const alvo = x.item.classificacao === 'FIXO' ? fixB : varB;
    if (x.item.tipoRateio === 'direto') {
      // insumo direto: a parte da linha em cada produto
      BUCKETS_CUSTO.forEach((b) => { alvo[b] += (x.calc.linhas[b] || 0) * shareBucket(b); });
    } else {
      // compartilhado: valor da linha, distribuído entre os produtos que ELA faz
      const vLinha = _valorCompartilhadoDaLinha(x.item, x.calc, bloco, info, r.plano.tonelagem, r, state);
      BUCKETS_CUSTO.forEach((b) => {
        const tonLinhaB = info ? (info.tonPorBucket[b] || 0) : 0;
        alvo[b] += tonTotalLinha > 0 ? vLinha * (tonLinhaB / tonTotalLinha) : 0;
      });
    }
  });
  return { varB, fixB, qtdB };
}
// Precificação DESTA linha: custo variável por unidade da própria linha, margem e ponto de equilíbrio.
function _precificacaoDaLinha(r, bloco) {
  const { varB, fixB, qtdB } = _custosDaLinhaPorBucket(r, bloco);
  const info = r.tonPorBloco[bloco.id];
  const buckets = info ? BUCKETS_CUSTO.filter((b) => (info.tonPorBucket[b] || 0) > 1e-9) : [];
  return buckets.map((b) => {
    const custoVarUnid = qtdB[b] > 0 ? varB[b] / qtdB[b] : 0;
    const preco = r.precoVenda[b];
    const margemRS = preco - custoVarUnid;
    const margemPct = preco > 0 ? margemRS / preco : 0;
    const pe = margemRS > 0 ? fixB[b] / margemRS : Infinity;
    return { b, qtd: qtdB[b], custoVarUnid, preco, margemRS, margemPct, pe, fixo: fixB[b], variavel: varB[b], lucro: margemRS * qtdB[b] };
  });
}
// Precificação da linha na tela: custo variável REAL da linha por unidade, margem e equilíbrio.
function renderPrecificacaoLinha(r, bloco) {
  const itens = _precificacaoDaLinha(r, bloco);
  if (!itens.length) return '<p class="cp-ajuda">Esta linha ainda não tem produção — configure na aba Capacidade.</p>';
  const cards = itens.map((p) => {
    const manual = state.precoVendaManual[p.b];
    return `<div class="card cp-card">
      <h4 class="cp-h4" style="margin:0 0 6px;">${DESTINOS[p.b]}</h4>
      <div class="form-group cp-field-row"><label class="form-label">Preço de venda / ${UNIDADE_LABEL[p.b]} (R$)</label>
        <input class="form-input" type="number" step="0.01" value="${manual != null ? manual : arred(p.preco, 2)}" onchange="setPrecoVendaManual('${p.b}', this.value)"></div>
      ${manual != null ? `<button class="btn btn-ghost btn-sm" onclick="setPrecoVendaManual('${p.b}','')">🔄 usar sugestão pela margem</button>` : ''}
      <div class="form-group cp-field-row"><label class="form-label">Margem alvo (%) <span class="cp-muted">— sugere o preço se não houver preço manual</span></label>
        <input class="form-input cp-input-sm" type="number" step="1" value="${arred(state.margemAlvo[p.b] * 100, 1)}" onchange="setMargemAlvo('${p.b}', this.value)"></div>
      <div class="cp-kpi-linha"><span>Produção desta linha</span><strong>${fmtNum(p.qtd, 0)} ${UNIDADE_LABEL[p.b]}(s)</strong></div>
      <div class="cp-kpi-linha"><span>Custo variável / ${UNIDADE_LABEL[p.b]} <span class="cp-muted">(desta linha)</span></span><strong>${fmtBRL(p.custoVarUnid)}</strong></div>
      <div class="cp-kpi-linha"><span>Margem de contribuição</span><strong style="${p.margemRS < 0 ? 'color:var(--danger);' : 'color:#15803d;'}">${fmtBRL(p.margemRS)} (${fmtPct(p.margemPct, 2)})</strong></div>
      <div class="cp-kpi-linha"><span>Ponto de equilíbrio</span><strong>${isFinite(p.pe) ? fmtNum(p.pe, 0) + ' ' + UNIDADE_LABEL[p.b] + 's/mês' : '—'}</strong></div>
      <div class="cp-kpi-linha"><span>Lucro no mês</span><strong>${fmtBRL(p.lucro)}</strong></div>
      ${p.margemRS < 0 ? alertBox('perigo', 'Margem negativa: o preço não cobre o custo variável desta linha.') : ''}
    </div>`;
  }).join('');
  return `<p class="cp-ajuda">O custo variável por unidade é calculado com os custos <strong>desta linha</strong> (não a média da fábrica) — a margem aqui é a margem real dela. O preço de venda é o mesmo do produto em toda a fábrica.</p>
    <div class="cp-grid-cards">${cards}</div>`;
}

// PLANO PRA CHEGAR NO ALVO: mostra exatamente quanto falta e quais alavancas fecham a conta.
// Matemática: para custo/faturamento = alvo, vale  (corte de custo) + alvo × (receita nova) = falta.
// Ou seja: R$1 economizado vale R$1; R$1 de receita nova vale R$ alvo (ex.: R$0,38).
// MIX DE PRODUÇÃO: quando a fábrica está cheia, a pergunta certa não é "qual produto tem a
// melhor margem %", é "qual produto rende mais por HORA de máquina". Uma hora só pode ser
// usada uma vez — então ela deve ir pro produto que gera mais margem nela.
function _mixPorHora(r) {
  const itens = [];
  (state.blocos || []).forEach((bloco) => {
    (bloco.secoes || []).forEach((sec) => {
      (sec.produtos || []).filter((p) => p.ativo !== false && Number(p.capHora) > 0).forEach((p) => {
        const mp = garantirMapaProduto(p.nome);
        if (!mp.destino || !r.margem[mp.destino]) return;
        const demanda = Number(p.demanda) || 0;
        const auto = p.qtdManual === null || p.qtdManual === undefined;
        const dist = r.producao.detalhes.find((d) => d.blocoId === bloco.id && d.secaoId === sec.id && d.produtoNome === p.nome);
        const qtd = dist ? dist.qtd : (demanda > 0 ? demanda : 0);
        const capHora = Number(p.capHora);
        const margemUnid = r.margem[mp.destino].margemRS;
        const horas = capHora > 0 ? qtd / capHora : 0;
        const chave = p.nome + '|' + (bloco.linhaNome || '');
        const achado = itens.find((x) => x.chave === chave);
        if (achado) { achado.horas += horas; achado.qtd += qtd; }
        else itens.push({ chave, produto: p.nome, linha: bloco.linhaNome || '(sem linha)', capHora, margemUnid, margemHora: margemUnid * capHora, horas, qtd, bucket: mp.destino });
      });
    });
  });
  // Produto sem horas alocadas não disputa hora de máquina com ninguém: entrava no
  // ranking com margem/hora cheia e 0h, e o ganho sugerido saía R$ 0,00.
  return itens.filter((x) => x.horas > 0 && x.qtd > 0).sort((a, b) => b.margemHora - a.margemHora);
}
function renderMixPorHora(r) {
  const itens = _mixPorHora(r);
  if (itens.length < 2) return '';
  const melhor = itens[0], pior = itens[itens.length - 1];
  const linhas = itens.map((x, i) => `<tr${i === 0 ? ' style="background:#f0fdf4;"' : (x === pior ? ' style="background:#fef2f2;"' : '')}>
    <td>${esc(x.produto)} <span class="cp-muted">— ${esc(x.linha)}</span></td>
    <td class="cp-num">${fmtNum(x.capHora, 0)}/h</td>
    <td class="cp-num">${fmtBRL(x.margemUnid)}</td>
    <td class="cp-num cp-num-forte">${fmtBRL(x.margemHora)}</td>
    <td class="cp-num">${fmtNum(x.horas, 1)}h</td>
    <td class="cp-num">${fmtBRL(x.margemHora * x.horas)}</td>
  </tr>`).join('');
  const ganhoPorHora = melhor.margemHora - pior.margemHora;
  const ganhoTotal = ganhoPorHora * pior.horas;
  return `<div class="card" style="padding:12px;margin-top:12px;">
    <h4 class="cp-h4" style="margin:0 0 6px;">⚙️ Mix de produção — o que vale mais por hora</h4>
    <p class="cp-ajuda" style="margin:0 0 8px;">Com a fábrica cheia, uma hora só pode ser usada uma vez. O que decide não é a margem %, é <strong>quanto cada hora de máquina gera de margem</strong>.</p>
    <div class="table-wrap"><table>
      <thead><tr><th>Produto / linha</th><th>Capacidade</th><th>Margem/unid.</th><th>Margem por hora</th><th>Horas hoje</th><th>Margem gerada</th></tr></thead>
      <tbody>${linhas}</tbody></table></div>
    ${ganhoPorHora > 0 ? alertBox('ok', `Cada hora que sai de <strong>${esc(pior.produto)}</strong> (${esc(pior.linha)}, ${fmtBRL(pior.margemHora)}/h) e vai pra <strong>${esc(melhor.produto)}</strong> (${esc(melhor.linha)}, ${fmtBRL(melhor.margemHora)}/h) rende <strong>${fmtBRL(ganhoPorHora)} a mais</strong>. Se as ${fmtNum(pior.horas, 0)}h de ${esc(pior.produto)} virassem ${esc(melhor.produto)}, seriam <strong>${fmtBRL(ganhoTotal)}</strong> de margem extra no mês.${pior.linha !== melhor.linha ? ` <strong>Atenção:</strong> são linhas físicas diferentes (${esc(pior.linha)} → ${esc(melhor.linha)}) — a troca só existe se a ${esc(melhor.linha)} tiver hora livre e conseguir fazer o produto.` : ''} E desde que haja demanda pra vender.`) : ''}
  </div>`;
}
function renderComoChegarNoAlvo(r) {
  const custo = r.plano.totais.GERAL;
  const fat = r.faturamentoCalculado;
  const alvo = (Number(state.alvoMaximoPct) || 0) / 100;
  if (!(fat > 0) || !(alvo > 0)) return '<p class="cp-ajuda">Informe os preços de venda e o alvo de custo pra ver o plano.</p>';
  const atual = custo / fat;
  const custoMax = alvo * fat;
  const falta = custo - custoMax;              // quanto cortar se for só por custo
  const fatNec = custo / alvo;                 // faturamento necessário se for só por preço
  const precisaReceita = fatNec - fat;
  if (falta <= 0) {
    return `<div class="card" style="padding:14px;">
      ${alertBox('sucesso', `Você já está <strong>dentro do alvo</strong>: ${fmtPct(atual, 2)} contra o máximo de ${state.alvoMaximoPct}%.`)}
      <div class="cp-kpi-linha cp-bloco-estreito"><span>Folga até o alvo</span><strong>${fmtBRL(custoMax - custo)} de custo</strong></div>
      <div class="cp-kpi-linha cp-bloco-estreito"><span>Ou seja, dá pra absorver</span><strong>${fmtPct((custoMax - custo) / custo, 2)} de aumento de custo</strong></div>
    </div>`;
  }
  // ---- alavancas de CUSTO: os maiores itens da conta
  const itens = r.plano.resultadosItens.filter((x) => !x.item.removido && x.calc.valorTotal > 0)
    .map((x) => ({ nome: _nomeInsumoLimpo(x.item.insumo), valor: x.calc.valorTotal }))
    .sort((a, b) => b.valor - a.valor).slice(0, 6);
  const linhasCusto = itens.map((it) => `<tr>
    <td>${esc(it.nome)}</td>
    <td class="cp-num">${fmtBRL(it.valor)}</td>
    <td class="cp-num">${fmtPct(it.valor / custo, 2)}</td>
    <td class="cp-num">${fmtBRL(it.valor * 0.05)}</td>
    <td class="cp-num">${fmtPct((it.valor * 0.05) / falta, 2)}</td>
  </tr>`).join('');
  // ---- alavancas de PREÇO: por produto, o que 5% a mais rende
  const produtos = _bucketsProduzidos(r).map((b) => {
    const q = _qtdDoBucket(r, b);
    const receita = q * r.precoVenda[b];
    const custoCheioUnid = _custoCheioPorUnidade(r, b);
    return { b, q, receita, preco: r.precoVenda[b], custoCheioUnid, prejuizo: r.precoVenda[b] < custoCheioUnid };
  }).sort((a, b) => b.receita - a.receita);
  const linhasPreco = produtos.map((p) => `<tr${p.prejuizo ? ' style="background:#fef2f2;"' : ''}>
    <td>${DESTINOS[p.b]}${p.prejuizo ? ' <span class="badge badge-danger" style="font-size:9px;">abaixo do custo</span>' : ''}</td>
    <td class="cp-num">${fmtBRL(p.preco)}</td>
    <td class="cp-num">${fmtBRL(p.custoCheioUnid)}</td>
    <td class="cp-num">${fmtPct(p.receita / fat, 2)}</td>
    <td class="cp-num">${fmtBRL(p.receita * 0.05)}</td>
    <td class="cp-num">${fmtPct((p.receita * 0.05 * alvo) / falta, 2)}</td>
  </tr>`).join('');
  const prejuizos = produtos.filter((p) => p.prejuizo);
  const maior = produtos[0];
  const pctPrecoTudo = precisaReceita / fat;
  return `<div class="card" style="padding:14px;margin-bottom:12px;">
    <div class="cp-kpi-linha cp-bloco-estreito"><span>Você está em</span><strong style="color:${atual <= alvo ? '#15803d' : '#b91c1c'};">${fmtPct(atual, 2)}</strong></div>
    <div class="cp-kpi-linha cp-bloco-estreito"><span>Alvo</span><strong>${state.alvoMaximoPct}%</strong></div>
    <div class="cp-kpi-linha cp-bloco-estreito"><span><strong>Falta fechar</strong></span><strong>${fmtBRL(falta)} de custo <span class="cp-muted">ou</span> ${fmtBRL(precisaReceita)} de receita (+${fmtPct(pctPrecoTudo, 2)} no preço)</strong></div>
    <p class="cp-ajuda" style="margin-top:8px;">A conta que fecha o alvo: <strong>corte de custo + ${fmtPct(alvo, 0)} × receita nova = ${fmtBRL(falta)}</strong>. Cada R$1 economizado vale R$1; cada R$1 de venda nova vale ${fmtBRL(alvo)}.</p>
  </div>
  ${prejuizos.length ? alertBox('perigo', `<strong>${prejuizos.map((p) => DESTINOS[p.b]).join(', ')}</strong> ${prejuizos.length > 1 ? 'estão sendo vendidos' : 'está sendo vendido'} <strong>abaixo do custo cheio</strong>. Corrigir o preço deste(s) produto(s) é o primeiro passo — hoje ${prejuizos.length > 1 ? 'eles consomem' : 'ele consome'} margem dos outros.`) : ''}
  <div class="card" style="padding:12px;margin-bottom:12px;">
    <h4 class="cp-h4" style="margin:0 0 6px;">💰 Onde cortar custo</h4>
    <div class="table-wrap"><table>
      <thead><tr><th>Insumo</th><th>Custo hoje</th><th>% do total</th><th>Cortando 5%</th><th>Fecha</th></tr></thead>
      <tbody>${linhasCusto}</tbody></table></div>
    <p class="cp-ajuda" style="margin-top:6px;">A coluna "Fecha" mostra quanto da meta cada corte de 5% resolve.</p>
  </div>
  <div class="card" style="padding:12px;">
    <h4 class="cp-h4" style="margin:0 0 6px;">🏷️ Onde mexer no preço</h4>
    <div class="table-wrap"><table>
      <thead><tr><th>Produto</th><th>Preço hoje</th><th>Custo cheio/un.</th><th>% do faturamento${state.faturamentoManual && state.faturamentoManual.ativo ? ' *' : ''}</th><th>+5% rende</th><th>Fecha</th></tr></thead>
      <tbody>${linhasPreco}</tbody></table></div>
    ${state.faturamentoManual && state.faturamentoManual.ativo ? `<p class="cp-ajuda" style="margin-top:6px;color:#b45309;">* O faturamento é manual, então esta coluna não soma 100% — a diferença é a parte do faturamento que não vem dos produtos planejados.</p>` : ''}
    ${maior ? `<p class="cp-ajuda" style="margin-top:6px;"><strong>${DESTINOS[maior.b]}</strong> é ${fmtPct(maior.receita / fat, 0)} do seu faturamento — é a alavanca de preço mais forte que você tem.</p>` : ''}
  </div>
  ${renderMixPorHora(r)}`;
}

function renderPainel(r) {
  const gargalos = r.producao.detalhes.filter((d) => d.excede).sort((a, b) => (b.demanda - b.qtdMax) - (a.demanda - a.qtdMax));
  const piorGargalo = gargalos[0];

  // Só produtos com produção: um bucket zerado entra com custo variável R$ 0,00 e
  // aparece com margem de 100% no topo da tabela, sem existir no plano.
  const produzidos = _bucketsProduzidos(r);
  const qtdPorBucket = {};
  produzidos.forEach((p) => { qtdPorBucket[p] = _qtdDoBucket(r, p); });
  const lucroTotal = {};
  produzidos.forEach((p) => { lucroTotal[p] = r.margem[p].margemRS * qtdPorBucket[p]; });
  const maisRentavelTotal = produzidos.map((p) => ({ p, valor: lucroTotal[p] })).sort((a, b) => b.valor - a.valor)[0];

  const custoFixoTotal = r.plano.porClassificacao.GERAL.FIXO;
  const faturamentoParaEquilibrio = _equilibrioEmReais(custoFixoTotal,
    produzidos.map((p) => ({ qtd: qtdPorBucket[p], margemRS: r.margem[p].margemRS, preco: r.precoVenda[p] })));

  const alertasDinamicos = [];
  gargalos.forEach((g) => {
    alertasDinamicos.push(`<li class="cp-alerta-item cp-alerta-danger"><strong>${esc(g.produtoNome)}</strong> (${esc(g.linhaNome)} / ${esc(g.turnoNome)}): demanda de ${fmtNum(g.demanda, 0)} excede o máximo possível de ${fmtNum(g.qtdMax, 0)} — faltam ${fmtNum((g.demanda - g.qtdMax) / (g.capHora || 1), 1)}h de capacidade.</li>`);
  });
  produzidos.forEach((p) => {
    const cheio = _custoCheioPorUnidade(r, p);
    const preco = r.precoVenda[p];
    if (r.margem[p].margemRS < 0) alertasDinamicos.push(`<li class="cp-alerta-item cp-alerta-danger"><strong>${NOMES_PRODUTO[p]}:</strong> preço de venda abaixo do custo variável — margem negativa de ${fmtBRL(r.margem[p].margemRS)} por ${UNIDADE_LABEL[p]}.</li>`);
    else if (preco < cheio) alertasDinamicos.push(`<li class="cp-alerta-item cp-alerta-danger"><strong>${NOMES_PRODUTO[p]}:</strong> cobre o custo variável mas não o custo cheio de ${fmtBRL(cheio)} — prejuízo de ${fmtBRL(cheio - preco)} por ${UNIDADE_LABEL[p]}, ${fmtBRL((cheio - preco) * qtdPorBucket[p])} no mês.</li>`);
  });
  if (r.producao.naoMapeados.length) alertasDinamicos.push(`<li class="cp-alerta-item cp-alerta-warning"><strong>${r.producao.naoMapeados.length} produto(s) sem linha de custo:</strong> ${r.producao.naoMapeados.map((x) => esc(x.nome)).join(', ')} — mapeie na aba Capacidade.</li>`);
  r.alertasConsumo.forEach((a) => {
    const direcao = a.desvioPct > 0 ? `${fmtPct(a.desvioPct, 2)} acima` : `${fmtPct(Math.abs(a.desvioPct), 2)} abaixo`;
    alertasDinamicos.push(`<li class="cp-alerta-item cp-alerta-warning"><strong>${esc(a.insumo)}:</strong> consumo do plano ${direcao} da média histórica de 3 meses (${fmtNum(a.mediaHistorica, 1)} → ${fmtNum(a.consumoAtual, 1)}).</li>`);
  });
  if (r.atribFolha.naoAlocados.length > 0) alertasDinamicos.push(`<li class="cp-alerta-item cp-alerta-warning"><strong>Folha:</strong> ${r.atribFolha.naoAlocados.length} funcionário(s) ainda não alocados em nenhum turno (${r.atribFolha.naoAlocados.slice(0, 5).map((f) => esc(f.nome)).join(', ')}${r.atribFolha.naoAlocados.length > 5 ? '...' : ''}).</li>`);

  return `
  <div class="card cp-card-destaque" style="margin-bottom:14px;">
    <h3 class="cp-h3">1. Onde está o gargalo esse mês?</h3>
    <div class="cp-resposta-grande">
      ${piorGargalo
        ? `<strong>${esc(piorGargalo.produtoNome)}</strong> (${esc(piorGargalo.linhaNome)} / ${esc(piorGargalo.turnoNome)}) — demanda de ${fmtNum(piorGargalo.demanda, 0)} excede o máximo de ${fmtNum(piorGargalo.qtdMax, 0)}. Considere hora extra, turno adicional ou reduzir a demanda.`
        : `Nenhum gargalo — todas as demandas cabem na capacidade planejada.`}
    </div>
  </div>
  <div class="card cp-card-destaque" style="margin-bottom:14px;">
    <h3 class="cp-h3">2. Qual linha de custo dá mais lucro no plano atual?</h3>
    <div class="cp-resposta-grande">${maisRentavelTotal ? `<strong>${NOMES_PRODUTO[maisRentavelTotal.p]}</strong> — ${fmtBRL(maisRentavelTotal.valor)} de margem de contribuição total no mês.` : 'Nenhum produto com produção no plano ainda.'}</div>
    <div class="table-wrap"><table>
      <thead><tr><th>Linha de custo</th><th>Margem / unidade</th><th>Qtd. planejada</th><th>Margem total</th></tr></thead>
      <tbody>${produzidos.map((p) => `<tr><td>${NOMES_PRODUTO[p]}</td><td class="cp-num">${fmtBRL(r.margem[p].margemRS)}</td><td class="cp-num">${fmtNum(qtdPorBucket[p], 0)}</td><td class="cp-num cp-num-forte">${fmtBRL(lucroTotal[p])}</td></tr>`).join('') || '<tr><td colspan="4" class="cp-ajuda">Nenhum produto com produção no plano.</td></tr>'}</tbody>
    </table></div>
  </div>
  <div class="card cp-card-destaque" style="margin-bottom:14px;">
    <h3 class="cp-h3">3. Quanto preciso vender para não ficar no vermelho?</h3>
    <div class="cp-resposta-grande">Custo fixo total do mês: <strong>${fmtBRL(custoFixoTotal)}</strong> · Faturamento mínimo: <strong>${isFinite(faturamentoParaEquilibrio) ? fmtBRL(faturamentoParaEquilibrio) : '—'}</strong></div>
    <p class="cp-ajuda">Faturamento mínimo = custo fixo ÷ razão de margem de contribuição, no mix planejado. Abaixo desse valor a fábrica não paga o próprio custo fixo.</p>
    ${isFinite(faturamentoParaEquilibrio) ? `<div class="cp-kpi-linha cp-bloco-estreito"><span>Faturamento planejado</span><strong style="color:${r.faturamentoCalculado >= faturamentoParaEquilibrio ? '#15803d' : '#b91c1c'};">${fmtBRL(r.faturamentoCalculado)} — ${r.faturamentoCalculado >= faturamentoParaEquilibrio ? 'acima' : 'ABAIXO'} do equilíbrio em ${fmtBRL(Math.abs(r.faturamentoCalculado - faturamentoParaEquilibrio))}</strong></div>` : alertBox('critico', 'Não há margem de contribuição positiva no mix atual — nenhum volume de venda cobre o custo fixo. É preço, não volume.')}
    <div class="table-wrap cp-tabela-estreita"><table><thead><tr><th>Linha de custo</th><th>Ponto de equilíbrio</th></tr></thead><tbody>
      ${produzidos.map((p) => `<tr><td>${NOMES_PRODUTO[p]}</td><td class="cp-num">${isFinite(r.pontoEquilibrio[p]) ? fmtNum(r.pontoEquilibrio[p], 0) + ' ' + UNIDADE_LABEL[p] + 's/mês' : '— (margem negativa)'}</td></tr>`).join('') || '<tr><td colspan="2" class="cp-ajuda">Nenhum produto com produção no plano.</td></tr>'}
    </tbody></table></div>
  </div>
  ${renderAlvoDetalhado(r)}
  <div class="card">
    <h3 class="cp-h3">Alertas deste mês <span class="cp-muted">— recalcula ao vivo</span></h3>
    <ul class="cp-lista-alertas">${alertasDinamicos.join('') || '<li class="cp-alerta-item cp-alerta-success">Nenhum alerta no momento.</li>'}</ul>
  </div>
  <div class="card" style="margin-top:14px;">
    <h3 class="cp-h3">📈 Ranking de sensibilidade <span class="cp-muted">— o que mais pesa no custo total</span></h3>
    <p class="cp-ajuda">Se o preço/valor de cada item subir 10%, é isso que acontece com o custo total — foque a negociação com fornecedor nos itens do topo.${(() => {
      const comValor = r.plano.resultadosItens.filter((x) => x.calc.valorTotal > 0);
      const fora = comValor.length - r.sensibilidade.length;
      if (fora <= 0) return '';
      const somaFora = comValor.slice().sort((a, b) => b.calc.valorTotal - a.calc.valorTotal).slice(r.sensibilidade.length).reduce((a, x) => a + x.calc.valorTotal, 0);
      return ` <strong>Mostrando os ${r.sensibilidade.length} maiores de ${comValor.length} itens</strong> — os outros ${fora} somam ${fmtBRL(somaFora)} (${fmtPct(r.plano.totais.GERAL > 0 ? somaFora / r.plano.totais.GERAL : 0, 2)} do custo).`;
    })()}</p>
    <div class="table-wrap"><table>
      <thead><tr><th>#</th><th>Insumo</th><th>Valor no plano</th><th>% do custo total</th><th>Impacto de +10%</th></tr></thead>
      <tbody>${r.sensibilidade.map((s, i) => `<tr><td>${i + 1}</td><td>${esc(s.insumo)}</td><td class="cp-num">${fmtBRL(s.valorTotal)}</td><td class="cp-num">${fmtPct(r.plano.totais.GERAL > 0 ? s.valorTotal / r.plano.totais.GERAL : 0, 2)}</td><td class="cp-num cp-num-forte">+${fmtBRL(s.impacto10pct)}</td></tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}
