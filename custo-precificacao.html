/* Quantos dias úteis do mês já têm produção lançada. Sem isso o Alvo realizado
   vira armadilha: os itens SEM FONTE assumem o valor cheio do mês (arrendamento,
   folha, manutenção) enquanto a produção é de poucos dias — o custo fica de mês
   inteiro contra uma receita de meia dúzia de dias, e a razão explode. */
function _realCobertura() {
  const per = _realPeriodo();
  let uteis = 0;
  const diasUteis = new Set();
  for (let d = 1; d <= per.dias; d++) {
    const key = `${state.ano}-${String(state.mes).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    if ((state.calendario[key] || 'trabalha') !== 'folga') { uteis++; diasUteis.add(key); }
  }
  const comLancamento = new Set();
  ((state._real || {}).ops || []).forEach((o) => { if (diasUteis.has(o.data)) comLancamento.add(o.data); });
  const cobertos = comLancamento.size;
  return { uteis, cobertos, fracao: uteis > 0 ? cobertos / uteis : 0, fechado: uteis > 0 && cobertos >= uteis };
}
function toggleRealProRata() { state._realProRata = !state._realProRata; render(); }

function _realPeriodo() {
  const ini = `${state.ano}-${String(state.mes).padStart(2, '0')}-01`;
  const ultimo = diasDoMes(state.ano, state.mes);
  return { ini, fim: `${state.ano}-${String(state.mes).padStart(2, '0')}-${String(ultimo).padStart(2, '0')}`, dias: ultimo };
}

/* Busca tudo de uma vez e guarda em state._real. Só refaz quando muda o mês/ano
   ou quando a pessoa pede pra atualizar. */
async function carregarRealizado(forcar) {
  const per = _realPeriodo();
  const chave = per.ini + '|' + per.fim;
  if (!forcar && state._real && state._real.chave === chave) return state._real;
  if (typeof _supabase === 'undefined' || !_supabase) return null;
  state._realCarregando = true; render();
  const r = { chave, periodo: per, ops: [], consumo: [], desgaste: [], diesel: [], precoDiesel: 0, erro: null, carregadoEm: new Date().toISOString() };
  try {
    const [prod, mov, insu, desg, padr, abast, entr] = await Promise.all([
      _supabase.from('producao').select('id,data,linha,turno,op_numero,produtos_op,consumo_lenha,ht,hp,total_sacos').gte('data', per.ini).lte('data', per.fim),
      _supabase.from('insumos_movimentos').select('insumo_id,data,tipo,quantidade,qtd_teorica,custo_unitario,origem,origem_id,produto').eq('tipo', 'consumo').eq('origem', 'OP').gte('data', per.ini).lte('data', per.fim),
      _supabase.from('insumos').select('id,nome,unidade_estoque'),
      _supabase.from('desgaste_registros').select('peca,linha,data_retirada,data_devolucao,peso_inicial,peso_final,quantidade,peso_unitario').gte('data_retirada', per.ini).lte('data_retirada', per.fim),
      _supabase.from('desgaste_padroes').select('peca,peso_novo,peso_descarte'),
      _supabase.from('abastecimento_registros').select('data,litros,tipo_veiculo').gte('data', per.ini).lt('data', per.fim + 'T23:59:59'),
      _supabase.from('abastecimento_entradas').select('data,litros,valor_litro').order('data', { ascending: false }).limit(12),
    ]);
    const err = [prod, mov, insu, desg, padr, abast, entr].map((x) => x && x.error).filter(Boolean);
    if (err.length) throw new Error(err.map((e) => e.message).join(' · '));
    r.ops = prod.data || [];
    const nomeInsumo = {}; (insu.data || []).forEach((i) => { nomeInsumo[i.id] = i; });
    const linhaDaOp = {}; r.ops.forEach((o) => { if (o.op_numero) linhaDaOp[o.op_numero] = o.linha; });
    r.consumo = (mov.data || []).map((m) => ({
      insumoId: m.insumo_id,
      nome: (nomeInsumo[m.insumo_id] || {}).nome || '(insumo removido)',
      unidade: (nomeInsumo[m.insumo_id] || {}).unidade_estoque || '',
      linha: linhaDaOp[m.origem_id] || null,        // null = OP fora do período ou apagada
      qtd: Number(m.quantidade) || 0,
      qtdTeorica: Number(m.qtd_teorica) || 0,
      custoUnit: Number(m.custo_unitario) || 0,
      produto: m.produto || null,
    }));
    /* Cada registro é um JOGO montado na linha: peso_inicial quando entra,
       peso_final quando sai. Jogo ainda rodando (sem devolução/peso final) não
       tem desgaste medido — contar o peso de entrada inteiro como gasto inflava
       o custo do mês com metal que ainda está na máquina. */
    r.desgaste = (desg.data || []).map((d) => {
      const aberto = d.data_devolucao == null || d.peso_final == null;
      return {
        peca: String(d.peca || '').toLowerCase(), linha: d.linha || null,
        aberto,
        pesoInicial: Number(d.peso_inicial) || 0,
        // massa útil consumida — mesma régua do planejado
        kg: aberto ? 0 : Math.max(0, (Number(d.peso_inicial) || 0) - (Number(d.peso_final) || 0)),
        pecas: Number(d.quantidade) || 0,
      };
    });
    r.padroes = {};
    (padr.data || []).forEach((x) => { r.padroes[String(x.peca || '').toLowerCase()] = { novo: Number(x.peso_novo) || 0, descarte: Number(x.peso_descarte) || 0 }; });
    r.diesel = (abast.data || []).map((a) => ({ tipo: String(a.tipo_veiculo || '').toLowerCase(), litros: Number(a.litros) || 0 }));
    const comPreco = (entr.data || []).filter((e) => Number(e.valor_litro) > 0);
    r.precoDiesel = comPreco.length ? comPreco.reduce((a, e) => a + Number(e.valor_litro), 0) / comPreco.length : 0;
  } catch (e) {
    console.error('Realizado: erro ao carregar', e);
    r.erro = e && e.message ? e.message : String(e);
  }
  state._real = r; state._realCarregando = false; render();
  return r;
}

/* ─────────────────────── consolidação: planejado × realizado ───────────────
   Chave de tudo: (linha física × linha de custo). O `linha_produto` de cada item
   do produtos_op JÁ é a linha de custo, então quando você planeja 25 kg na Linha 2
   e produz na 2 e na 3, o realizado aparece nas duas — a Linha 3 com planejado
   zero. Isso não é erro de rateio, é o desvio que se quer enxergar.
   ────────────────────────────────────────────────────────────────────────── */

function _realBucketDoNome(nome) {
  if (!nome) return null;
  const mp = garantirMapaProduto(nome);
  if (mp && mp.destino) return mp.destino;
  // tolera grafias diferentes entre módulos ("Linha 25 kg" x "Linha 25kg")
  const alvo = _normalizarNomeFolha(nome).replace(/\s+/g, '');
  const achou = Object.keys(state.mapaProduto || {}).find((k) => _normalizarNomeFolha(k).replace(/\s+/g, '') === alvo);
  return achou ? (state.mapaProduto[achou].destino || null) : null;
}

// Produção realizada por (linha física × bucket), a partir das OPs do mês.
function _realProducao(real) {
  const porLinha = {};       // { linhaNome: { bucket: {sacos, ton, pallets, ops} } }
  const porDia = {};         // { 'YYYY-MM-DD': { ton, sacos } }  — pro avanço acumulado
  let semMapa = [];
  (real.ops || []).forEach((op) => {
    const linha = op.linha || '(sem linha)';
    const itens = Array.isArray(op.produtos_op) ? op.produtos_op : [];
    itens.forEach((x) => {
      const bucket = _realBucketDoNome(x.linha_produto) || _realBucketDoNome(x.produto);
      const sacos = Number(x.total_sacos) || 0;
      if (!bucket) { if (sacos > 0) semMapa.push(x.linha_produto || x.produto || '?'); return; }
      const pallets = (x.pallets || []).reduce((a, pp) => a + (Number(pp.qtd) || 0), 0);
      const ton = qtdParaToneladas(bucket, sacos, state.pesos);
      porLinha[linha] = porLinha[linha] || {};
      const c = porLinha[linha][bucket] = porLinha[linha][bucket] || { sacos: 0, ton: 0, pallets: 0, ops: 0, perda: 0 };
      c.sacos += sacos; c.ton += ton; c.pallets += pallets; c.ops += 1;
      c.perda += Number(x.perda_embalagem) || 0;   // saco rasgado/perdido: a OP já separa
      const d = op.data;
      porDia[d] = porDia[d] || { ton: 0, sacos: 0 };
      porDia[d].ton += ton; porDia[d].sacos += sacos;
    });
  });
  return { porLinha, porDia, semMapa: [...new Set(semMapa)] };
}

// Produção PLANEJADA por (linha física × bucket) — sai do próprio plano.
function _planProducao(r) {
  const porLinha = {};
  (state.blocos || []).forEach((b) => {
    const nome = b.linhaNome || '(sem nome)';
    const info = r.tonPorBloco[b.id];
    if (!info) return;
    BUCKETS_CUSTO.forEach((bk) => {
      const ton = info.tonPorBucket[bk] || 0;
      if (ton <= 1e-9) return;
      const m = _metasDaLinha(r, b.id);
      porLinha[nome] = porLinha[nome] || {};
      porLinha[nome][bk] = { sacos: Number(m.metas[bk]) || 0, ton };
    });
  });
  return porLinha;
}

/* Quantidade PLANEJADA de um insumo compartilhado. Boa parte dos itens não
   guarda quantidade (o plano é um valor mensal em R$ e ponto) — nesses a coluna
   fica em branco de propósito. Onde existe preço unitário dá pra reconstruir:
   valor ÷ preço. Converte pra unidade do apontamento quando as duas falam de
   grandezas equivalentes (g/kg/ton), senão mostra na unidade do próprio plano. */
const _REAL_FATOR_UN = { 'g|kg': 0.001, 'kg|g': 1000, 'kg|ton': 0.001, 'ton|kg': 1000, 'g|ton': 0.000001, 'ton|g': 1000000, 'l|l': 1 };
function _realConverteQtd(qtd, de, para) {
  const a = String(de || '').toLowerCase().trim(), b = String(para || '').toLowerCase().trim();
  if (!a || !b || a === b) return qtd;
  const f = _REAL_FATOR_UN[a + '|' + b];
  return f != null ? qtd * f : null;
}
function _realPrecoUnitPlano(item) {
  if (item.especial === 'lenha') return Number((state.lenha || {}).precoM3) || 0;
  if (item.especial === 'stretch') return Number((state.stretch || {}).precoPorGrama) || 0;
  if (item.unidade === 'ton') return Number(item.custoPorTonEditado != null ? item.custoPorTonEditado : item.custoPorTon) || 0;
  return Number(item.precoUnitarioEditado != null ? item.precoUnitarioEditado : item.precoUnitario) || 0;
}
function _realPlanQtdCompart(reg, planValor, res) {
  const item = reg.item;
  const un = item.unidade || '';
  if (!un || un === 'R$') return null;             // planejado direto em reais: não há quantidade
  let qtd = (reg.planQtd != null && Math.abs(Number(reg.planQtd)) > 1e-9) ? Number(reg.planQtd) : null;
  if (qtd != null) {
    // planQtd é do mês inteiro: por linha, acompanha o mesmo rateio do valor
    if (Math.abs(reg.planValor) > 1e-9) qtd *= planValor / reg.planValor;
  } else {
    // aqui planValor JÁ é o da linha, então dividir pelo preço já dá a qtd da linha
    const pu = _realPrecoUnitPlano(item);
    if (!(pu > 0)) return null;
    qtd = planValor / pu;
  }
  const alvo = (res && res.qtd != null ? (reg.unidade || un) : un);
  const conv = _realConverteQtd(qtd, un, alvo);
  return conv != null ? { qtd: conv, un: alvo } : { qtd, un };
}

/* Realizado de UM insumo compartilhado, por linha. Devolve sempre
   { porLinha:{linha:{qtd,valor}}, total:{qtd,valor}, origem, obs, unidade }. */
function _realCompartDoItem(item, real, rPlan, prodReal) {
  const cfg = REAL_FONTE_COMPART[item.id] || { fonte: null, desc: 'sem origem mapeada' };
  const vazio = () => ({ porLinha: {}, total: { qtd: 0, valor: 0 }, origem: REAL_ORIGEM.SEM_FONTE, obs: cfg.desc, unidade: item.unidade || '' });
  /* O módulo respondeu e não tinha nada: isso é zero de verdade, não é falta de
     fonte. Repetir o planejado aqui seria inventar gasto que não houve. */
  const zeroMedido = (motivo) => (real.erro ? vazio() : { porLinha: {}, total: { qtd: 0, valor: 0 }, origem: REAL_ORIGEM.AUTO, obs: motivo, unidade: item.unidade || '' });
  const linhasPlano = (state.blocos || []).map((b) => b.linhaNome || '(sem nome)');
  const tonPorLinhaReal = {};
  let tonTotalReal = 0;
  Object.entries(prodReal.porLinha).forEach(([ln, buckets]) => {
    const t = Object.values(buckets).reduce((a, x) => a + x.ton, 0);
    tonPorLinhaReal[ln] = t; tonTotalReal += t;
  });

  if (!cfg.fonte) return vazio();

  if (cfg.fonte === 'tonelagem') {                       // frete
    const rsTon = Number(item.custoPorTonEditado != null ? item.custoPorTonEditado : item.custoPorTon) || 0;
    const porLinha = {};
    Object.entries(tonPorLinhaReal).forEach(([ln, t]) => { porLinha[ln] = { qtd: t, valor: t * rsTon }; });
    const obsPorLinha = {};
    Object.entries(porLinha).forEach(([ln, o]) => { obsPorLinha[ln] = `${fmtNum(o.qtd, 2)} ton produzidas nesta linha × ${fmtBRL(rsTon)}/ton do plano`; });
    return { porLinha, total: { qtd: tonTotalReal, valor: tonTotalReal * rsTon }, origem: REAL_ORIGEM.AUTO,
             obs: `${fmtNum(tonTotalReal, 2)} ton × ${fmtBRL(rsTon)}/ton`, obsPorLinha, unidade: 'ton' };
  }

  if (cfg.fonte === 'consumo') {                         // lenha, stretch
    const linhas = (real.consumo || []).filter((c) => cfg.insumo.test(c.nome));
    if (!linhas.length) return zeroMedido('nenhuma baixa deste insumo no mês');
    const porLinha = {}; let q = 0, v = 0;
    linhas.forEach((c) => {
      const ln = c.linha || '(sem linha)';
      porLinha[ln] = porLinha[ln] || { qtd: 0, valor: 0 };
      porLinha[ln].qtd += c.qtd; porLinha[ln].valor += c.qtd * c.custoUnit;
      q += c.qtd; v += c.qtd * c.custoUnit;
    });
    const un0 = linhas[0].unidade || item.unidade || '';
    const nPorLinha = {};
    linhas.forEach((c) => { const ln = c.linha || '(sem linha)'; nPorLinha[ln] = (nPorLinha[ln] || 0) + 1; });
    const obsPorLinha = {};
    Object.entries(porLinha).forEach(([ln, o]) => { obsPorLinha[ln] = `${cfg.desc} · ${fmtNum(o.qtd, 2)} ${un0} em ${nPorLinha[ln] || 0} lançamento(s) desta linha`; });
    return { porLinha, total: { qtd: q, valor: v }, origem: REAL_ORIGEM.AUTO,
             obs: `${cfg.desc} · ${fmtNum(q, 2)} ${un0} em ${linhas.length} lançamento(s)`, obsPorLinha, unidade: un0 };
  }

  if (cfg.fonte === 'desgaste') {                        // martelo, gaveta, grelha, eixos
    const regs = (real.desgaste || []).filter((d) => d.peca === cfg.peca);
    if (!regs.length) return zeroMedido('nenhuma troca registrada no mês');
    /* Massa útil de UMA peça — é a régua que converte kg gastos em peças. Vem do
       plano; se ele estiver zerado, cai no padrão cadastrado em desgaste.html. Sem
       nenhum dos dois não dá pra converter: aí é SEM FONTE e assume o planejado,
       em vez de mostrar R$ 0,00 com selo de automático. */
    const pad = (state.desgaste || {})[cfg.peca === 'eixo' ? 'eixos' : cfg.peca] || {};
    let util = Math.max(0, (Number(pad.pesoNovo) || 0) - (Number(pad.pesoDescarte) || 0));
    let origemUtil = 'plano';
    if (util <= 0) {
      const pb = (real.padroes || {})[cfg.peca] || {};
      util = Math.max(0, (Number(pb.novo) || 0) - (Number(pb.descarte) || 0));
      origemUtil = 'padrão do desgaste.html';
    }
    const preco = Number(item.precoUnitarioEditado) || 0;
    if (util <= 0) {
      const kgTot = regs.reduce((a, d) => a + d.kg, 0);
      return { porLinha: {}, total: { qtd: 0, valor: 0 }, origem: REAL_ORIGEM.SEM_FONTE,
               obs: `${fmtNum(kgTot, 1)} kg gastos, mas falta o peso novo/descarte da peça — sem isso não dá pra converter em peças`, unidade: 'peça' };
    }
    const porLinha = {}; let kg = 0, jogos = 0, abertos = 0;
    regs.forEach((d) => {
      const ln = d.linha || '(sem linha)';
      porLinha[ln] = porLinha[ln] || { qtd: 0, valor: 0, kg: 0, jogos: 0, abertos: 0 };
      porLinha[ln].kg += d.kg;
      if (d.aberto) { porLinha[ln].abertos++; abertos++; } else { porLinha[ln].jogos++; jogos++; }
      kg += d.kg;
    });
    if (kg <= 0) return zeroMedido(abertos ? `${abertos} jogo(s) montado(s) e ainda sem devolução — nada medido no mês` : 'nenhuma troca registrada no mês');
    let q = 0, v = 0;
    Object.values(porLinha).forEach((o) => {
      o.qtd = util > 0 ? o.kg / util : 0;      // kg gastos ÷ massa útil = peças equivalentes
      o.valor = o.qtd * preco; q += o.qtd; v += o.valor;
    });
    /* Cada registro do desgaste.html é um JOGO inteiro; a conta do custo é por
       PEÇA. Deixo as duas leituras à vista pra dar pra conferir com a tela do
       desgaste: jogos fechados, kg medidos e o quanto isso dá em peças. */
    const frase = (nJogos, nAbertos, nKg) => `${nJogos} jogo(s) fechado(s)${nAbertos ? ` (+${nAbertos} ainda na máquina, não entra)` : ''} · ${fmtNum(nKg, 2)} kg medidos ÷ ${fmtNum(util, 2)} kg úteis por peça (${origemUtil}) = ${fmtNum(nKg / util, 2)} peças${nJogos > 0 ? ` ≈ ${fmtNum((nKg / util) / nJogos, 1)} por jogo` : ''} · × ${fmtBRL(preco)} por peça`;
    const obsPorLinha = {};
    Object.entries(porLinha).forEach(([ln, o]) => { obsPorLinha[ln] = frase(o.jogos, o.abertos, o.kg); });
    return { porLinha, total: { qtd: q, valor: v }, origem: REAL_ORIGEM.AUTO,
             obs: frase(jogos, abertos, kg), obsPorLinha,
             unidade: 'peça' };
  }

  if (cfg.fonte === 'diesel') {                          // próprio e terceiros
    const litros = (real.diesel || []).filter((d) => d.tipo === cfg.tipoVeiculo).reduce((a, d) => a + d.litros, 0);
    if (!litros) return vazio();
    const preco = real.precoDiesel || Number(item.precoUnitarioEditado) || 0;
    const valor = litros * preco;
    // não há vínculo com linha no abastecimento: rateia por tonelagem produzida
    const porLinha = {};
    if (tonTotalReal > 0) Object.entries(tonPorLinhaReal).forEach(([ln, t]) => {
      porLinha[ln] = { qtd: litros * (t / tonTotalReal), valor: valor * (t / tonTotalReal) };
    });
    const obsPorLinha = {};
    Object.entries(porLinha).forEach(([ln, o]) => {
      const share = tonTotalReal > 0 ? (tonPorLinhaReal[ln] || 0) / tonTotalReal : 0;
      obsPorLinha[ln] = `${fmtNum(litros, 1)} L da fábrica × ${fmtPct(share, 2)} da tonelagem desta linha = ${fmtNum(o.qtd, 1)} L × ${fmtBRL(preco)}/L (o abastecimento não guarda linha)`;
    });
    return { porLinha, total: { qtd: litros, valor }, origem: REAL_ORIGEM.AUTO,
             obs: `${fmtNum(litros, 1)} L × ${fmtBRL(preco)}/L · rateado por tonelagem (o abastecimento não guarda linha)`, obsPorLinha,
             unidade: 'L' };
  }
  return vazio();
}

/* ─────────── ajustes manuais: valor unitário e quantidade, por item ────────
   Guardados dentro do JSON do planejamento (sem migration). Escopo é o nome da
   linha física, ou '__TOTAL__' quando o ajuste vale para a fábbrica inteira. */
function _realAjuste(escopo, itemId) {
  const q = ((state.realAjusteQtd || {})[escopo] || {})[itemId];
  const v = ((state.realAjusteVU || {})[escopo] || {})[itemId];
  return { qtd: (q === '' || q == null) ? null : Number(q), vu: (v === '' || v == null) ? null : Number(v) };
}
function setRealAjuste(campo, escopo, itemId, valor) {
  const alvo = campo === 'qtd' ? 'realAjusteQtd' : 'realAjusteVU';
  state[alvo] = state[alvo] || {};
  state[alvo][escopo] = state[alvo][escopo] || {};
  const n = parseNumeroBR(valor);
  if (valor === '' || valor == null || !isFinite(n)) delete state[alvo][escopo][itemId];
  else state[alvo][escopo][itemId] = n;
  render();
}
function limparRealAjustes() {
  abrirConfirmacao({
    titulo: 'Limpar todos os ajustes manuais',
    mensagem: 'Os valores digitados à mão no Realizado voltam para o automático (ou para o planejado, onde não há fonte).',
    labelConfirmar: 'Limpar ajustes', tipo: 'perigo',
    acao: () => { state.realAjusteQtd = {}; state.realAjusteVU = {}; render(); },
  });
}

/* Consolida tudo o que a aba precisa. Uma função só, para o número da tela e o
   número do total virem sempre da mesma conta. */
function _realConsolidar(r) {
  const real = state._real;
  const prodReal = real ? _realProducao(real) : { porLinha: {}, porDia: {}, semMapa: [] };
  const prodPlan = _planProducao(r);
  /* Linha entra na lista se o plano previu, se produziu, OU se apenas gastou
     alguma coisa (troca de martelo numa linha parada, por exemplo). Fora isso o
     gasto ficaria só no total e a soma das linhas não fecharia. */
  const linhasGasto = new Set();
  if (real) {
    (real.consumo || []).forEach((x) => { if (x.linha) linhasGasto.add(x.linha); });
    (real.desgaste || []).forEach((x) => { if (x.linha && x.kg > 0) linhasGasto.add(x.linha); });
  }
  const linhas = [...new Set([...Object.keys(prodPlan), ...Object.keys(prodReal.porLinha), ...linhasGasto])].sort();

  // ---- insumos DIRETOS: planejado do motor, realizado do consumo por OP ----
  const diretosPlan = r.plano.resultadosItens.filter((x) => x.item.tipoRateio === 'direto' && !x.item.removido);

  /* Casar insumo do PLANO com insumo do ESTOQUE por nome não funciona: "MP (Cinza)"
     serve o item de 10 kg e o de 20 kg, e "Big Bag" aparece dentro do nome da MP.
     O vínculo certo tem duas chaves, e as duas já existem no dado:
       BUCKET  — o consumo guarda o `produto`, que o mapaProduto converte em linha
                 de custo; o item do plano guarda `produtoBase`.
       FAMÍLIA — embalagem, mp_cinza, mp_caulim, aditivo ou pallet.
     Com as duas, o consumo de MP Cinza numa OP de Concentrado vai SÓ pro item de
     10 kg — e a Emitec, que não faz 20 kg, não recebe nada do item de 20 kg. */
  const _familia = (nome) => {
    const n = _normalizarNomeFolha(nome);
    if (/PALLET/.test(n)) return 'pallet';
    if (/ADITIVO/.test(n)) return 'aditivo';
    if (/CINZA/.test(n)) return 'mp_cinza';
    if (/MP \(CAULIM|MP \(CAULIM\)/.test(n) || /^MP /.test(n)) return 'mp_caulim';
    if (/SACO|EMBALAGEM|BIG BAG|CAULIM 25|CAULIM BIG/.test(n)) return 'embalagem';
    return 'outro';
  };
  const _bucketsDoItemPlano = (it) => {
    if (it.produtoBase === 'CAULIM_TOTAL') return ['CAULIM25', 'CAULIMBB', 'CAULIMGRANEL'];
    return it.produtoBase ? [it.produtoBase] : [];
  };
  /* Quanto de embalagem foi baixado por (linha × bucket) e quanto disso a OP
     apontou como perda. Com esses dois números o saco perdido vai pro item
     "— perda" em vez de engordar a embalagem boa. */
  const _ehPerda = (it) => /—\s*perda\s*$/i.test(_nomeInsumoLimpo(it.insumo || ''));
  const _ehCliente = (it) => /para cliente\s*$/i.test(_nomeInsumoLimpo(it.insumo || ''));
  const baixaEmb = {};
  (real ? (real.consumo || []) : []).forEach((c) => {
    if (_familia(c.nome) !== 'embalagem') return;
    const bk = c.produto ? _realBucketDoNome(c.produto) : null;
    if (!bk) return;
    const k = (c.linha || '(sem linha)') + '|' + bk;
    baixaEmb[k] = (baixaEmb[k] || 0) + c.qtd;
  });
  const fatiaPerda = (linha, bk) => {
    const perda = ((prodReal.porLinha[linha] || {})[bk] || {}).perda || 0;
    const total = baixaEmb[(linha || '(sem linha)') + '|' + bk] || 0;
    return total > 0 ? Math.min(1, perda / total) : 0;
  };

  const donosDoConsumo = (real ? (real.consumo || []) : []).map((c) => {
    const bk = c.produto ? _realBucketDoNome(c.produto) : null;
    const fam = _familia(c.nome);
    let donos = diretosPlan.filter((x) => _familia(x.item.insumo) === fam
      && (!bk || _bucketsDoItemPlano(x.item).includes(bk)));

    /* Embalagem tem medição própria pra perda: a OP diz quantos sacos se
       perderam, então não é rateio nenhum — cada saco vai pro item certo. */
    if (fam === 'embalagem' && bk && donos.some((x) => _ehPerda(x.item))) {
      const fp = fatiaPerda(c.linha, bk);
      const principal = donos.filter((x) => !_ehPerda(x.item) && !_ehCliente(x.item));
      const perdaItens = donos.filter((x) => _ehPerda(x.item));
      const fatias = new Map();
      perdaItens.forEach((x) => fatias.set(x, fp / perdaItens.length));
      principal.forEach((x) => fatias.set(x, (1 - fp) / (principal.length || 1)));
      const usados = [...perdaItens, ...principal].filter((x) => (fatias.get(x) || 0) > 0);
      if (usados.length) return { c, donos: usados, fatias, somaPlan: 0, bucket: bk, familia: fam, porMedicao: true };
    }

    // dentro do mesmo bucket+família ainda pode haver mais de um item (Aditivo 1 e 2,
    // ou embalagem normal/perda/cliente): rateia pelo planejado, e quem tem plano zero
    // não reclama nada quando existe alguém com plano.
    const comPlano = donos.filter((x) => Math.abs(x.calc.valorTotal) > 0.005);
    if (comPlano.length) donos = comPlano;
    const somaPlan = donos.reduce((a, x) => a + Math.abs(x.calc.valorTotal), 0);
    return { c, donos, somaPlan, bucket: bk, familia: fam };
  });

  /* De onde saiu o número desta célula, em uma frase — a pessoa precisa poder
     conferir contra o almoxarifado sem abrir o banco. */
  const _obsDireto = (casados, rateado) => {
    const bruto = casados.reduce((a, c) => a + (c._brutoQtd || 0), 0);
    const meu = casados.reduce((a, c) => a + c.qtd, 0);
    const un = casados[0].unidade || '';
    if (casados.some((c) => c._medido)) {
      return `${fmtNum(bruto, 2)} ${un} baixados em ${casados.length} lançamento(s) → ${fmtNum(meu, 2)} ${un} deste item (a OP aponta a perda saco a saco)`;
    }
    if (rateado) {
      return `${fmtNum(bruto, 2)} ${un} baixados em ${casados.length} lançamento(s) · o almoxarifado tem um insumo só para os dois itens do plano, então dividimos na proporção do planejado: ${fmtPct(casados[0]._fatia, 2)} = ${fmtNum(meu, 2)} ${un}`;
    }
    return `${fmtNum(meu, 2)} ${un} baixados em ${casados.length} lançamento(s) por OP`;
  };

  const diretos = diretosPlan.map((x) => {
    const casados = [];
    donosDoConsumo.forEach((d) => {
      if (!d.donos.includes(x)) return;
      const fatia = d.fatias ? (d.fatias.get(x) || 0)
        : (d.donos.length === 1 ? 1
          : (d.somaPlan > 0 ? Math.abs(x.calc.valorTotal) / d.somaPlan : 1 / d.donos.length));
      if (fatia <= 0) return;
      casados.push({ ...d.c, qtd: d.c.qtd * fatia, _rateado: d.donos.length > 1 && !d.porMedicao,
                     _medido: !!d.porMedicao, _fatia: fatia, _brutoQtd: d.c.qtd });
    });
    const porLinha = {}; let q = 0, v = 0, t = 0;
    casados.forEach((c) => {
      const ln = c.linha || '(sem linha)';
      porLinha[ln] = porLinha[ln] || { qtd: 0, valor: 0, teorico: 0 };
      porLinha[ln].qtd += c.qtd; porLinha[ln].valor += c.qtd * c.custoUnit;
      // qtd_teorica é a FICHA TÉCNICA aplicada ao que a OP produziu — é ela que
      // diz quanto deveria ter saído, não a quantidade do item do plano.
      porLinha[ln].teorico += (c.qtdTeorica || 0) * (c._fatia != null ? c._fatia : 1);
      q += c.qtd; v += c.qtd * c.custoUnit; t += (c.qtdTeorica || 0) * (c._fatia != null ? c._fatia : 1);
    });
    const rateado = casados.some((c) => c._rateado);
    return { item: x.item, planValor: x.calc.valorTotal, planQtd: x.calc.novaQtd,
             buckets: _bucketsDoItemPlano(x.item),
             realPorLinha: porLinha, realQtd: q, realValor: v, teoricoQtd: t,
             origem: casados.length ? REAL_ORIGEM.AUTO : REAL_ORIGEM.SEM_FONTE,
             obs: casados.length ? _obsDireto(casados, rateado) : 'sem baixa lançada para este insumo',
             obsPorLinha: (() => {
               const g = {};
               casados.forEach((c) => { const ln = c.linha || '(sem linha)'; (g[ln] = g[ln] || []).push(c); });
               const o = {};
               Object.entries(g).forEach(([ln, arr]) => { o[ln] = _obsDireto(arr, rateado); });
               return o;
             })(),
             unidade: casados.length ? casados[0].unidade : (x.item.unidade || '') };
  });

  // ---- insumos COMPARTILHADOS ----
  const compartPlan = r.plano.resultadosItens.filter((x) => x.item.tipoRateio === 'compartilhado' && !x.item.removido);
  const compart = compartPlan.map((x) => {
    const base = real ? _realCompartDoItem(x.item, real, r, prodReal) : { porLinha: {}, total: { qtd: 0, valor: 0 }, origem: REAL_ORIGEM.SEM_FONTE, obs: 'realizado ainda não carregado', unidade: x.item.unidade || '' };
    return { item: x.item, planValor: x.calc.valorTotal, planQtd: x.calc.novaQtd, ...base };
  });

  /* Aplica o ajuste manual e resolve o "sem fonte". Regra combinada:
     sem fonte → assume o planejado; manual → o que foi digitado manda. */
  const resolver = (reg, escopo, planValor, planPorLinha, flexDireto) => {
    const aj = _realAjuste(escopo, reg.item.id);
    if (aj.qtd != null || aj.vu != null) {
      const qtd = aj.qtd != null ? aj.qtd : (escopo === '__TOTAL__' ? (reg.total ? reg.total.qtd : reg.realQtd) : ((reg.porLinha || reg.realPorLinha)[escopo] || {}).qtd || 0);
      const vuAuto = (() => {
        const q = escopo === '__TOTAL__' ? (reg.total ? reg.total.qtd : reg.realQtd) : ((reg.porLinha || reg.realPorLinha)[escopo] || {}).qtd || 0;
        const v = escopo === '__TOTAL__' ? (reg.total ? reg.total.valor : reg.realValor) : ((reg.porLinha || reg.realPorLinha)[escopo] || {}).valor || 0;
        return q > 0 ? v / q : 0;
      })();
      const vu = aj.vu != null ? aj.vu : vuAuto;
      return { qtd, vu, valor: qtd * vu, origem: REAL_ORIGEM.MANUAL };
    }
    if (reg.origem === REAL_ORIGEM.SEM_FONTE) {
      const v = escopo === '__TOTAL__' ? planValor : (planPorLinha || 0);
      // Insumo DIRETO sem baixa: ele só se gasta quando o produto sai, então o
      // realizado acompanha a produção. Sem produção nenhuma, gasto nenhum —
      // senão embalagem de um produto que não rodou entra cheia no custo do mês.
      if (flexDireto != null) {
        return { qtd: null, vu: null, valor: v * flexDireto, origem: REAL_ORIGEM.SEM_FONTE, semProducao: flexDireto === 0 };
      }
      // Compartilhado: é contrato/conta do mês. Com o mês aberto, opcionalmente
      // rateia pelo que já foi trabalhado.
      const cob = _realCobertura();
      const fator = (state._realProRata && !cob.fechado) ? cob.fracao : 1;
      return { qtd: null, vu: null, valor: v * fator, origem: REAL_ORIGEM.SEM_FONTE, proRata: fator < 1 };
    }
    const o = escopo === '__TOTAL__' ? (reg.total || { qtd: reg.realQtd, valor: reg.realValor }) : ((reg.porLinha || reg.realPorLinha)[escopo] || { qtd: 0, valor: 0 });
    return { qtd: o.qtd, vu: o.qtd > 0 ? o.valor / o.qtd : 0, valor: o.valor, origem: REAL_ORIGEM.AUTO };
  };

  // planejado por linha de cada item (pra usar quando não há fonte)
  const planPorLinhaItem = {};
  (state.blocos || []).forEach((b) => {
    const nome = b.linhaNome || '(sem nome)';
    const info = r.tonPorBloco[b.id];
    planPorLinhaItem[nome] = {};
    compartPlan.forEach((x) => {
      planPorLinhaItem[nome][x.item.id] = _valorCompartilhadoDaLinha(x.item, x.calc, b, info, r.plano.tonelagem, r, state) || 0;
    });
    const bucketsRel = info ? BUCKETS_CUSTO.filter((bk) => info.tonPorBucket[bk] > 1e-9) : [];
    const m = _metasDaLinha(r, b.id);
    diretosPlan.forEach((x) => {
      planPorLinhaItem[nome][x.item.id] = bucketsRel.length
        ? calcularQuantidadeDireto(x.item, m.metas, m.tonelagem) * (Number(x.item.precoUnitarioEditado) || 0) : 0;
    });
  });

  /* Plano AJUSTADO à produção real (orçamento flexível).
     Comparar o consumo de 6,82% de produção contra o plano do mês inteiro faz TUDO
     parecer economia. O que interessa é: para a tonelagem que realmente saiu, o plano
     previa quanto? A razão é por tonelada do(s) bucket(s) do item — assim sobra só o
     desvio de eficiência, sem o efeito de volume. Item FIXO não flexiona: ele corre
     igual, produzindo ou não. */
  const tonPlanBucket = {}, tonRealBucket = {};   // { escopo: { bucket: ton } }
  ['__TOTAL__', ...linhas].forEach((e) => {
    tonPlanBucket[e] = {}; tonRealBucket[e] = {};
    const fp = e === '__TOTAL__' ? Object.values(prodPlan) : [prodPlan[e] || {}];
    fp.forEach((bs) => Object.entries(bs).forEach(([bk, c]) => { tonPlanBucket[e][bk] = (tonPlanBucket[e][bk] || 0) + c.ton; }));
    const fr = e === '__TOTAL__' ? Object.values(prodReal.porLinha) : [prodReal.porLinha[e] || {}];
    fr.forEach((bs) => Object.entries(bs).forEach(([bk, c]) => { tonRealBucket[e][bk] = (tonRealBucket[e][bk] || 0) + c.ton; }));
  });
  const fatorFlex = (escopo, buckets, classificacao) => {
    if (classificacao === 'FIXO') return 1;
    const bs = (buckets && buckets.length) ? buckets : BUCKETS_CUSTO;
    let tp = 0, tr = 0;
    bs.forEach((bk) => { tp += tonPlanBucket[escopo][bk] || 0; tr += tonRealBucket[escopo][bk] || 0; });
    return tp > 0 ? tr / tp : null;   // null = o plano não previa nada desse produto
  };
  // buckets que interessam a cada linha: o que ela planejou OU o que ela produziu
  const bucketsDaLinha = {};
  ['__TOTAL__', ...linhas].forEach((e) => {
    const set = new Set([...Object.keys(tonPlanBucket[e]), ...Object.keys(tonRealBucket[e])]);
    bucketsDaLinha[e] = set;
  });

  // ---- totais e por linha ----
  const escopos = ['__TOTAL__', ...linhas];
  const custo = {}; const detalhe = {};
  escopos.forEach((e) => {
    let cd = 0, cc = 0;
    const linhasDet = { diretos: [], compart: [] };
    diretos.forEach((d) => {
      const pl = e === '__TOTAL__' ? d.planValor : ((planPorLinhaItem[e] || {})[d.item.id] || 0);
      // fora dos produtos da linha: nem planejado nem produzido — não faz parte dela
      const relevante = e === '__TOTAL__' || !d.buckets.length || d.buckets.some((bk) => bucketsDaLinha[e].has(bk));
      if (!relevante && Math.abs(pl) < 0.005) return;
      const fRaw = fatorFlex(e, d.buckets, d.item.classificacao);
      const res = resolver(d, e, d.planValor, pl, fRaw == null ? null : fRaw);
      /* Régua do insumo direto é a FICHA TÉCNICA, não a quantidade do item do
         plano: a ficha diz que o Concentrado leva 0,009 kg de aditivo por saco,
         então para 22.096 sacos o justo são 198,86 kg. O item do plano pode
         estar numa base diferente (1 kg por saco) — se eu medisse contra ele,
         inventaria R$ 7 mil de economia que nunca existiu. */
      const tq = d.origem === REAL_ORIGEM.AUTO
        ? (e === '__TOTAL__' ? d.teoricoQtd : ((d.realPorLinha[e] || {}).teorico || 0))
        : null;
      const precoPlano = (d.planQtd != null && Math.abs(d.planQtd) > 1e-9) ? d.planValor / d.planQtd : null;
      const fichaFlex = (tq != null && precoPlano != null) ? tq * precoPlano : null;
      // Sem fonte, o realizado é uma suposição — então o plano de comparação é a
      // mesma suposição e o desvio dá zero. Inventar desvio onde não houve
      // medição é o que fazia falta de produção virar "economia".
      const f = fRaw;
      cd += res.valor;
      if (Math.abs(pl) < 0.005 && Math.abs(res.valor) < 0.005 && res.origem !== REAL_ORIGEM.MANUAL) return;
      const planFlex = fichaFlex != null ? fichaFlex : (f == null ? null : pl * f);
      linhasDet.diretos.push({ reg: d, plan: pl, planFlex, fator: f,
                               planQtdFlex: tq, viaFicha: fichaFlex != null, precoPlano, ...res });
    });
    compart.forEach((c) => {
      const pl = e === '__TOTAL__' ? c.planValor : ((planPorLinhaItem[e] || {})[c.item.id] || 0);
      const res = resolver(c, e, c.planValor, pl);
      const f = res.origem === REAL_ORIGEM.SEM_FONTE ? null : fatorFlex(e, null, c.item.classificacao);
      cc += res.valor;
      if (Math.abs(pl) < 0.005 && Math.abs(res.valor) < 0.005 && res.origem !== REAL_ORIGEM.MANUAL) return;
      const pq = _realPlanQtdCompart(c, pl, res);
      linhasDet.compart.push({ reg: c, plan: pl, planFlex: f == null ? null : pl * f, fator: f,
                               planQtdBase: pq ? pq.qtd : null, planQtdUn: pq ? pq.un : null, ...res });
    });
    custo[e] = { diretos: cd, compart: cc, total: cd + cc };
    detalhe[e] = linhasDet;
  });

  // ---- tonelagem, faturamento e ALVO realizado ----
  const kpi = {};
  escopos.forEach((e) => {
    let tonR = 0, tonP = 0, fatR = 0, fatP = 0;
    const buckets = {};
    const fontes = e === '__TOTAL__' ? Object.entries(prodReal.porLinha) : [[e, prodReal.porLinha[e] || {}]];
    fontes.forEach(([, bs]) => Object.entries(bs).forEach(([bk, c]) => {
      buckets[bk] = buckets[bk] || { sacosR: 0, tonR: 0, sacosP: 0, tonP: 0 };
      buckets[bk].sacosR += c.sacos; buckets[bk].tonR += c.ton;
      tonR += c.ton; fatR += (bk === 'CAULIMGRANEL' ? c.ton : c.sacos) * (r.precoVenda[bk] || 0);
    }));
    const fontesP = e === '__TOTAL__' ? Object.entries(prodPlan) : [[e, prodPlan[e] || {}]];
    fontesP.forEach(([, bs]) => Object.entries(bs).forEach(([bk, c]) => {
      buckets[bk] = buckets[bk] || { sacosR: 0, tonR: 0, sacosP: 0, tonP: 0 };
      buckets[bk].sacosP += c.sacos; buckets[bk].tonP += c.ton;
      tonP += c.ton; fatP += (bk === 'CAULIMGRANEL' ? c.ton : c.sacos) * (r.precoVenda[bk] || 0);
    }));
    const cR = custo[e].total;
    const cP = e === '__TOTAL__' ? r.plano.totais.GERAL : _totaisDaLinhaFisica(r, (state.blocos || []).find((b) => (b.linhaNome || '(sem nome)') === e) || { id: '', secoes: [] }, state).total;
    kpi[e] = {
      tonR, tonP, fatR, fatP, buckets,
      custoR: cR, custoP: cP,
      custoTonR: tonR > 0 ? cR / tonR : 0, custoTonP: tonP > 0 ? cP / tonP : 0,
      alvoR: fatR > 0 ? cR / fatR : null, alvoP: fatP > 0 ? cP / fatP : null,
    };
  });

  /* Consumo lançado que NENHUM item do plano reclamou. Sem isso ele sumiria em
     silêncio — e sumir em silêncio é o que essa aba existe pra evitar. */
  const reclamados = new Set();
  donosDoConsumo.forEach((d) => { if (d.donos.length) reclamados.add(d.c); });
  (real ? (real.consumo || []) : []).forEach((c) => {
    Object.values(REAL_FONTE_COMPART).forEach((cfg) => { if (cfg.insumo && cfg.insumo.test(c.nome)) reclamados.add(c); });
  });
  const orfaos = {};
  (real ? (real.consumo || []) : []).forEach((c) => {
    if (reclamados.has(c)) return;
    orfaos[c.nome] = orfaos[c.nome] || { nome: c.nome, unidade: c.unidade, qtd: 0, valor: 0 };
    orfaos[c.nome].qtd += c.qtd; orfaos[c.nome].valor += c.qtd * c.custoUnit;
  });

  return { real, prodReal, prodPlan, linhas, escopos, diretos, compart, custo, detalhe, kpi, planPorLinhaItem,
           orfaos: Object.values(orfaos).sort((a, b) => b.valor - a.valor) };
}

/* ─────────────────────────────── gráficos ──────────────────────────────────
   Dois marcadores só: planejado em cinza-azulado recessivo, realizado no navy da
   marca. O par foi validado — separação CVD ΔE 34 e contraste ≥3:1 nos dois —
   e mesmo assim todo valor aparece escrito, e a tabela logo abaixo repete tudo:
   ninguém depende de enxergar cor pra ler o número.
   ────────────────────────────────────────────────────────────────────────── */
const REAL_COR_PLAN = '#7C8DA6';
const REAL_COR_REAL = '#042D4D';

function _realGraficoBarras(itens) {
  const vivos = itens.filter((x) => x.plan > 0 || x.real > 0);
  if (!vivos.length) return '<p class="cp-ajuda">Nada produzido nem planejado neste recorte.</p>';
  const max = Math.max(...vivos.map((x) => Math.max(x.plan, x.real)), 1);
  const linhas = vivos.map((x) => {
    const pct = (v) => Math.max(v > 0 ? 1.5 : 0, (v / max) * 100);
    const d = x.real - x.plan;
    const cor = Math.abs(d) < 1e-9 ? '#64748b' : (d > 0 ? 'var(--success)' : 'var(--danger)');
    return `<div style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px;">
        <strong>${esc(x.rotulo)}</strong>
        <span style="color:${cor};font-weight:700;">${d > 0 ? '+' : ''}${fmtNum(d, 0)} ${esc(x.un || '')}</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;">
        <span style="font-size:10px;color:#64748b;width:62px;flex:none;">planejado</span>
        <div style="flex:1;background:#eef2f6;border-radius:4px;height:14px;"><div title="Planejado: ${fmtNum(x.plan, 0)}" style="width:${pct(x.plan)}%;height:100%;background:${REAL_COR_PLAN};border-radius:4px;"></div></div>
        <span style="font-size:11px;font-variant-numeric:tabular-nums;width:78px;text-align:right;flex:none;">${fmtNum(x.plan, 0)}</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="font-size:10px;color:#64748b;width:62px;flex:none;">realizado</span>
        <div style="flex:1;background:#eef2f6;border-radius:4px;height:14px;"><div title="Realizado: ${fmtNum(x.real, 0)}" style="width:${pct(x.real)}%;height:100%;background:${REAL_COR_REAL};border-radius:4px;"></div></div>
        <span style="font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;width:78px;text-align:right;flex:none;">${fmtNum(x.real, 0)}</span>
      </div>
    </div>`;
  }).join('');
  return `<div>${linhas}
    <div style="display:flex;gap:14px;font-size:10.5px;color:#64748b;margin-top:2px;">
      <span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${REAL_COR_PLAN};margin-right:4px;"></i>Planejado</span>
      <span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${REAL_COR_REAL};margin-right:4px;"></i>Realizado</span>
    </div></div>`;
}

/* Avanço acumulado: quanto do mês já saiu, contra o ritmo que o plano pede.
   A linha do plano sobe só nos dias úteis do calendário — em fim de semana ela
   fica plana, senão o realizado pareceria atrasado sem estar. */
function _realGraficoAvanco(cons, escopo) {
  const per = _realPeriodo();
  const k = cons.kpi[escopo];
  if (!k || (k.tonP <= 0 && k.tonR <= 0)) return '';
  const diasUteis = [];
  for (let d = 1; d <= per.dias; d++) {
    const key = `${state.ano}-${String(state.mes).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    if ((state.calendario[key] || 'trabalha') !== 'folga') diasUteis.push(key);
  }
  const totalUteis = diasUteis.length || 1;
  const porDia = cons.prodReal.porDia || {};
  // acumulado realizado só conta a linha escolhida quando não é o total
  const tonDoDia = (key) => {
    if (escopo === '__TOTAL__') return (porDia[key] || {}).ton || 0;
    let t = 0;
    (cons.real ? cons.real.ops : []).forEach((op) => {
      if (op.data !== key || (op.linha || '(sem linha)') !== escopo) return;
      (Array.isArray(op.produtos_op) ? op.produtos_op : []).forEach((x) => {
        const bk = _realBucketDoNome(x.linha_produto) || _realBucketDoNome(x.produto);
        if (bk) t += qtdParaToneladas(bk, Number(x.total_sacos) || 0, state.pesos);
      });
    });
    return t;
  };
  const pontos = []; let acR = 0, iUtil = 0; let ultimoComDado = 0;
  for (let d = 1; d <= per.dias; d++) {
    const key = `${state.ano}-${String(state.mes).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const util = (state.calendario[key] || 'trabalha') !== 'folga';
    if (util) iUtil++;
    const t = tonDoDia(key);
    acR += t; if (t > 0) ultimoComDado = d;
    pontos.push({ d, key, acR, acP: k.tonP * (iUtil / totalUteis), util, temDado: t > 0 });
  }
  const maxY = Math.max(k.tonP, acR, 1);
  const W = 640, H = 150, PL = 46, PB = 18, PT = 8;
  const x = (d) => PL + ((d - 1) / Math.max(1, per.dias - 1)) * (W - PL - 8);
  const y = (v) => PT + (1 - v / maxY) * (H - PT - PB);
  const linha = (campo, cor, tracejado, ate) => `<polyline fill="none" stroke="${cor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${tracejado ? ' stroke-dasharray="5 4"' : ''}
      points="${pontos.filter((p) => ate == null || p.d <= ate).map((p) => `${x(p.d).toFixed(1)},${y(p[campo]).toFixed(1)}`).join(' ')}" />`;
  const ateHoje = ultimoComDado || 1;
  const pR = pontos[ateHoje - 1] || pontos[0];
  const pP = pontos[ateHoje - 1] || pontos[0];
  const atraso = pR.acR - pP.acP;
  return `<div class="cp-secao" style="margin-top:6px;">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-width:${W}px;" role="img" aria-label="Avanço acumulado do mês em toneladas">
      ${[0, 0.5, 1].map((f) => `<line x1="${PL}" x2="${W - 8}" y1="${y(maxY * f)}" y2="${y(maxY * f)}" stroke="#e2e8f0" stroke-width="1"/>
        <text x="${PL - 6}" y="${y(maxY * f) + 3.5}" text-anchor="end" font-size="9" fill="#94a3b8">${fmtNum(maxY * f, 0)}</text>`).join('')}
      ${linha('acP', REAL_COR_PLAN, true)}
      ${linha('acR', REAL_COR_REAL, false, ateHoje)}
      <circle cx="${x(ateHoje)}" cy="${y(pR.acR)}" r="3.5" fill="${REAL_COR_REAL}" stroke="#fff" stroke-width="1.5"><title>Dia ${ateHoje}: ${fmtNum(pR.acR, 1)} ton acumuladas</title></circle>
      ${[1, Math.round(per.dias / 2), per.dias].map((d) => `<text x="${x(d)}" y="${H - 4}" text-anchor="middle" font-size="9" fill="#94a3b8">${String(d).padStart(2, '0')}</text>`).join('')}
    </svg>
    <div class="cp-kpi-linha cp-bloco-estreito" style="margin-top:2px;">
      <span>Acumulado até o dia ${String(ateHoje).padStart(2, '0')}</span>
      <strong>${fmtNum(pR.acR, 1)} de ${fmtNum(k.tonP, 1)} ton <span class="cp-muted">(${fmtPct(k.tonP > 0 ? pR.acR / k.tonP : 0, 2)} do mês)</span></strong>
    </div>
    <div class="cp-kpi-linha cp-bloco-estreito">
      <span>Contra o ritmo do plano</span>
      <strong style="color:${atraso >= 0 ? 'var(--success)' : 'var(--danger)'};">${atraso >= 0 ? '+' : ''}${fmtNum(atraso, 1)} ton ${atraso >= 0 ? 'à frente' : 'atrás'}</strong>
    </div>
    <p class="cp-ajuda">Tracejado é o ritmo que o plano pede, subindo só nos dias úteis do calendário. Cheio é o que saiu.</p>
  </div>`;
}

/* ───────────────────────────── render da aba ─────────────────────────────── */

function setRealEscopo(e) { state._realEscopo = e; render(); }

function _realSelo(origem) {
  if (origem === REAL_ORIGEM.MANUAL) return '<span class="badge badge-info" style="font-size:9px;">manual</span>';
  if (origem === REAL_ORIGEM.SEM_FONTE) return '<span class="badge badge-warning" style="font-size:9px;">sem fonte</span>';
  return '<span class="badge badge-success" style="font-size:9px;">automático</span>';
}

/* A explicação tem que ser a DA LINHA que está na tela. Mostrar "471 kg da
   fábrica" na linha da Emitec é o mesmo que não explicar nada. */
function _realObsDe(d, escopo) {
  const o = d.reg.obsPorLinha;
  if (escopo !== '__TOTAL__' && o && o[escopo]) return o[escopo];
  return d.reg.obs || '';
}

// Linha de insumo: planejado, realizado, diferença, origem e os dois campos de ajuste.
function _realLinhaInsumo(d, escopo) {
  const id = d.reg.item.id;
  const aj = _realAjuste(escopo, id);
  // O desvio que importa é contra o PLANO AJUSTADO — comparar com o plano cheio do
  // mês transforma falta de produção em "economia".
  const base = d.planFlex != null ? d.planFlex : d.plan;
  // sem isto o arredondamento produz "-R$ 0,00", que lê como se algo tivesse sobrado
  const dif = Math.abs(d.valor - base) < 0.005 ? 0 : d.valor - base;
  const cor = Math.abs(dif) < 0.01 ? '#64748b' : (dif > 0 ? 'var(--danger)' : 'var(--success)');
  const un = d.reg.unidade || d.reg.item.unidade || '';
  const ehDireto = d.reg.item.tipoRateio === 'direto';
  const planQtd = ehDireto
    ? (d.reg.planQtd != null ? d.reg.planQtd * (escopo === '__TOTAL__' ? 1 : (Math.abs(d.plan) > 0 && Math.abs(d.reg.planValor) > 0 ? d.plan / d.reg.planValor : 1)) : null)
    : (d.planQtdBase != null ? d.planQtdBase : null);
  const planUn = ehDireto ? un : (d.planQtdUn || un);
  // nos diretos a régua ajustada é a ficha técnica; nos demais, o plano flexionado
  const planQtdFlex = d.planQtdFlex != null ? d.planQtdFlex
                    : ((planQtd != null && d.fator != null) ? planQtd * d.fator : null);
  /* O item do plano prevê uma dosagem e a ficha técnica prevê outra. Quem manda no
     realizado é a ficha, mas o item do plano continua errando o orçamento do mês
     até ser corrigido — então aviso em vez de esconder. */
  const planQtdPeloItem = (planQtd != null && d.fator != null) ? planQtd * d.fator : null;
  const razao = (ehDireto && d.viaFicha && planQtdPeloItem > 0.0001 && planQtdFlex > 0.0001)
    ? planQtdPeloItem / planQtdFlex : null;
  const baseDivergente = razao != null && (razao > 5 || razao < 0.2);
  return `<tr${d.origem === REAL_ORIGEM.MANUAL ? ' style="background:#f0f9ff;"' : ''}>
    <td><strong>${esc(_nomeInsumoLimpo(d.reg.item.insumo))}</strong>
      <div class="cp-muted" style="font-size:10.5px;">${_realSelo(d.origem)}${d.proRata ? ' <span class="badge badge-gray" style="font-size:9px;">rateado pelo mês</span>' : ''}${baseDivergente ? ` <span class="badge badge-warning" style="font-size:9px;" title="Para esta produção o item do plano pede ${fmtNum(planQtdPeloItem, 2)} ${esc(un)} e a ficha técnica de insumos.html pede ${fmtNum(planQtdFlex, 2)} ${esc(un)}. O desvio é medido pela ficha, que é a dosagem de verdade; mas o item do plano está em outra base e vai continuar errando o orçamento do mês até ser corrigido na aba Config.">plano fora da ficha</span>` : ''} ${esc(_realObsDe(d, escopo))}</div></td>
    <td class="cp-num">${planQtd == null ? `<span class="cp-muted" title="Item planejado direto em reais — não tem quantidade.">—</span>` : fmtNum(planQtd, 2) + (planUn && planUn !== un ? ` <span class="cp-muted" style="font-size:10px;">${esc(planUn)}</span>` : '')}<div class="cp-muted" style="font-size:10px;">${fmtBRL(d.plan)}</div></td>
    <td class="cp-num">${d.planFlex == null ? '<span class="cp-muted">—</span>' : (planQtdFlex != null ? fmtNum(planQtdFlex, 2) + '<div class="cp-muted" style="font-size:10px;">' + fmtBRL(d.planFlex) + '</div>' : fmtBRL(d.planFlex))}${d.viaFicha ? '<div class="cp-muted" style="font-size:10px;">ficha técnica</div>' : (d.fator != null && d.fator !== 1 ? `<div class="cp-muted" style="font-size:10px;">${fmtPct(d.fator, 2)} do plano</div>` : '')}</td>
    <td class="cp-num">${d.qtd == null ? '<span class="cp-muted">—</span>' : fmtNum(d.qtd, 2) + (un ? ' <span class="cp-muted" style="font-size:10px;">' + esc(un) + '</span>' : '')}</td>
    <td class="cp-num">${d.vu == null ? '<span class="cp-muted">—</span>' : fmtBRL(d.vu)}</td>
    <td class="cp-num"><strong>${fmtBRL(d.valor)}</strong></td>
    <td class="cp-num" style="color:${cor};font-weight:700;">${dif > 0 ? '+' : ''}${fmtBRL(dif)}
      ${Math.abs(base) > 0.01 ? `<div style="font-size:10px;font-weight:600;opacity:.85;">${dif > 0 ? '+' : ''}${fmtPct(dif / Math.abs(base), 2)}</div>` : ''}</td>
    <td style="white-space:nowrap;">
      <input class="form-input cp-input-sm" style="width:88px;" type="text" inputmode="decimal" placeholder="qtd"
        value="${aj.qtd != null ? fmtNum(aj.qtd, 2) : ''}" title="Quantidade à mão — em branco volta ao automático"
        onchange="setRealAjuste('qtd', '${escopo}', '${id}', this.value)">
      <input class="form-input cp-input-sm" style="width:88px;" type="text" inputmode="decimal" placeholder="R$/un"
        value="${aj.vu != null ? fmtNum(aj.vu, 4) : ''}" title="Valor unitário à mão — em branco volta ao automático"
        onchange="setRealAjuste('vu', '${escopo}', '${id}', this.value)">
    </td>
  </tr>`;
}

/* "Plano ajustado" é o conceito que mais gera dúvida na aba, então em vez de
   definir em abstrato eu mostro a conta com uma linha que está na própria tela. */
function _realExplicaAjustado(ordenado) {
  const elegiveis = ordenado.filter((x) => x.planFlex != null && x.fator != null && x.fator > 0 && x.fator < 1 && Math.abs(x.plan) > 1);
  const comDesvio = elegiveis.filter((x) => Math.abs(x.valor - x.planFlex) > 1);
  const ex = (comDesvio.length ? comDesvio : elegiveis).sort((a, b) => Math.abs(b.plan) - Math.abs(a.plan))[0];
  const generico = 'É o planejado do mês recalculado para a produção que realmente saiu. Se a linha fez metade do previsto, o plano de embalagem também cai pela metade — e o desvio passa a comparar coisas comparáveis. Sem isso, produzir menos apareceria como economia.';
  if (!ex) return alertBox('info', `<strong>O que é “Plano ajustado”.</strong> ${generico}`);
  return alertBox('info', `<strong>O que é “Plano ajustado”.</strong> ${generico}
    <div style="margin-top:6px;">Nesta tela, por exemplo — <strong>${esc(_nomeInsumoLimpo(ex.reg.item.insumo))}</strong>:
    o plano do mês era ${fmtBRL(ex.plan)}, saiu <strong>${fmtPct(ex.fator, 2)}</strong> da produção prevista,
    então o plano justo vira ${fmtBRL(ex.plan)} × ${fmtPct(ex.fator, 2)} = <strong>${fmtBRL(ex.planFlex)}</strong>.
    Gastou ${fmtBRL(ex.valor)} → desvio de ${fmtBRL(ex.valor - ex.planFlex)}.</div>
    <div class="cp-muted" style="margin-top:4px;">Item <strong>FIXO</strong> não encolhe: arrendamento e folha entram cheios, produzindo muito ou pouco.</div>`);
}

function _realTabelaInsumos(titulo, ajuda, lista, escopo, totalPlan, totalReal) {
  if (!lista.length) return '';
  const baseDe = (x) => (x.planFlex != null ? x.planFlex : x.plan);
  const ordenado = lista.slice().sort((a, b) => Math.abs(b.valor - baseDe(b)) - Math.abs(a.valor - baseDe(a)));
  const totalFlex = lista.reduce((a, x) => a + baseDe(x), 0);
  const dif = Math.abs(totalReal - totalFlex) < 0.005 ? 0 : totalReal - totalFlex;
  return `<div class="card" style="margin-top:14px;">
    <h3 class="cp-h3">${titulo}</h3>
    <p class="cp-ajuda">${ajuda} Ordenado pelo maior desvio; os dois campos da direita sobrescrevem o valor e, em branco, voltam ao automático.</p>
    <div class="table-wrap"><table>
      <thead><tr><th>Insumo</th>
        <th class="cp-num" title="O que o plano do mês inteiro previa: quantidade em cima, valor embaixo.">Plan. qtd / R$</th>
        <th class="cp-num" title="O mesmo plano recalculado só para a produção que realmente saiu. É a régua justa do desvio.">Plano ajustado</th>
        <th class="cp-num">Qtd real</th><th class="cp-num">R$/un</th><th class="cp-num">Realizado</th>
        <th class="cp-num" title="Realizado menos Plano ajustado. Positivo = gastou mais do que a produção pedia.">Desvio</th>
        <th>Ajuste manual</th></tr></thead>
      <tbody>${ordenado.map((d) => _realLinhaInsumo(d, escopo)).join('')}</tbody>
      <tfoot><tr style="font-weight:800;">
        <td>Total</td><td class="cp-num">${fmtBRL(totalPlan)}</td><td class="cp-num">${fmtBRL(totalFlex)}</td><td></td><td></td>
        <td class="cp-num">${fmtBRL(totalReal)}</td>
        <td class="cp-num" style="color:${Math.abs(dif) < 0.01 ? '#64748b' : (dif > 0 ? 'var(--danger)' : 'var(--success)')};">${dif > 0 ? '+' : ''}${fmtBRL(dif)}</td><td></td>
      </tr></tfoot>
    </table></div>
  </div>`;
}

function renderPlanRealizado(r) {
  if (!state.blocos.length) {
    return `<div class="card"><div class="empty-state"><div class="empty-icon">⚖️</div><h3>Nenhuma linha configurada</h3><p>O planejado desta aba vem da <strong>Configuração da Linha</strong> — configure a Capacidade primeiro.</p></div></div>`;
  }
  const cons = _realConsolidar(r);
  const escopo = (state._realEscopo && (state._realEscopo === '__TOTAL__' || cons.linhas.includes(state._realEscopo))) ? state._realEscopo : '__TOTAL__';
  const k = cons.kpi[escopo] || {};
  const per = _realPeriodo();
  const real = state._real;
  const cob = _realCobertura();

  const botoes = ['__TOTAL__', ...cons.linhas].map((e) => {
    const kk = cons.kpi[e] || {};
    const at = e === escopo;
    return `<button class="btn ${at ? 'btn-primary' : 'btn-secondary'} btn-sm" style="text-align:left;" onclick="setRealEscopo('${e}')">
      ${e === '__TOTAL__' ? '🏭 Total da fábrica' : '🏭 ' + esc(e)}
      <div style="font-size:10px;font-weight:500;opacity:.85;">${fmtNum(kk.tonR || 0, 1)} de ${fmtNum(kk.tonP || 0, 1)} ton</div></button>`;
  }).join('');

  const cab = `<div class="card" style="margin-bottom:14px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
      <div>
        <h3 class="cp-h3" style="margin:0;">⚖️ Planejado × Realizado <span class="cp-muted">— ${String(state.mes).padStart(2, '0')}/${state.ano}</span></h3>
        <p class="cp-ajuda" style="margin:2px 0 0;">O <strong>planejado</strong> é a configuração por linha deste planejamento. O <strong>realizado</strong> é o que os outros módulos lançaram no mês. Cada valor diz de onde veio.</p>
      </div>
      <div class="cp-field-row" style="gap:6px;flex-wrap:wrap;">
        <button class="btn btn-secondary btn-sm" onclick="carregarRealizado(true)">${state._realCarregando ? '⏳ Buscando...' : '↻ Atualizar do banco'}</button>
        <button class="btn btn-ghost btn-sm" onclick="limparRealAjustes()">🧹 Limpar ajustes</button>
        <button class="btn btn-secondary btn-sm" onclick="imprimirRelatorioPlanRealizado()">🖨️ PDF do mês (geral + por linha)</button>
      </div>
    </div>
    ${!real ? alertBox('atencao', 'Realizado ainda não carregado — clique em <strong>Atualizar do banco</strong>.')
      : real.erro ? alertBox('critico', `Erro ao buscar o realizado: ${esc(real.erro)}`)
      : `<p class="cp-ajuda" style="margin-top:6px;">Fontes lidas: <strong>${real.ops.length}</strong> OP(s) de produção, <strong>${real.consumo.length}</strong> baixa(s) de insumo, <strong>${real.desgaste.length}</strong> registro(s) de desgaste, <strong>${real.diesel.length}</strong> abastecimento(s).</p>`}
    ${cons.prodReal.semMapa.length ? alertBox('atencao', `Produzido mas <strong>sem linha de custo mapeada</strong>: ${cons.prodReal.semMapa.map(esc).join(', ')}. Mapeie na aba Capacidade — enquanto isso essa produção fica fora do realizado.`) : ''}
    ${real && !cob.fechado ? alertBox('atencao', `📅 <strong>Mês em aberto:</strong> ${cob.cobertos} de ${cob.uteis} dias úteis com produção lançada (${fmtPct(cob.fracao, 2)}).
      Os itens <strong>sem fonte</strong> — arrendamento, folha, manutenção, energia — entram com o valor cheio do mês, então o custo é de mês inteiro contra uma produção parcial:
      <strong>o Alvo realizado só é comparável com o mês fechado</strong>.
      <label style="margin-left:8px;white-space:nowrap;"><input type="checkbox" ${state._realProRata ? 'checked' : ''} onchange="toggleRealProRata()"> ratear os itens sem fonte por ${fmtPct(cob.fracao, 2)}</label>`) : ''}
    <div class="cp-field-row" style="margin-top:10px;flex-wrap:wrap;gap:6px;">${botoes}</div>
  </div>`;

  const kpiCard = (rot, plan, realv, fmt, menorMelhor, sub) => {
    const d = (realv || 0) - (plan || 0);
    const bom = menorMelhor ? d <= 0 : d >= 0;
    const cor = Math.abs(d) < 1e-9 ? '#64748b' : (bom ? 'var(--success)' : 'var(--danger)');
    return `<div class="card cp-card">
      <div class="cp-kpi-linha"><span>${rot}</span><strong>${fmt(realv)}</strong></div>
      <div class="cp-muted" style="font-size:11px;">plano ${fmt(plan)} · <span style="color:${cor};font-weight:700;">${d > 0 ? '+' : ''}${fmt(d)}</span>${sub ? ' · ' + sub : ''}</div>
    </div>`;
  };
  const alvoTexto = (v) => v == null ? '—' : fmtPct(v, 2);
  const dentro = k.alvoR != null && k.alvoR <= (Number(state.alvoMaximoPct) || 0) / 100;

  const kpis = `<div class="cp-grid-cards" style="margin-bottom:14px;">
    ${kpiCard('Tonelagem', k.tonP, k.tonR, (v) => fmtNum(v || 0, 1) + ' t', false)}
    ${kpiCard('Custo total', k.custoP, k.custoR, fmtBRL, true)}
    ${kpiCard('Custo / tonelada', k.custoTonP, k.custoTonR, fmtBRL, true)}
    ${kpiCard('Faturamento', k.fatP, k.fatR, fmtBRL, false)}
    <div class="card cp-card">
      <div class="cp-kpi-linha"><span>🎯 Alvo no realizado</span><strong style="color:${k.alvoR == null ? '#64748b' : (cob.fechado ? (dentro ? 'var(--success)' : 'var(--danger)') : '#b45309')};">${alvoTexto(k.alvoR)}</strong></div>
      <div class="cp-muted" style="font-size:11px;">plano ${alvoTexto(k.alvoP)} · teto ${state.alvoMaximoPct}%${k.alvoR == null ? ' · sem faturamento realizado' : (cob.fechado ? (dentro ? ' · dentro' : ' · estourou') : ' · <strong>mês em aberto</strong>')}</div>
    </div>
  </div>`;

  const buckets = Object.entries(k.buckets || {}).filter(([, c]) => c.sacosP > 0 || c.sacosR > 0 || c.tonP > 0 || c.tonR > 0);
  const graf = `<div class="cp-grid-2" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;">
    <div class="card"><h3 class="cp-h3">Planejado × Realizado <span class="cp-muted">— por linha de custo, em unidades</span></h3>
      ${_realGraficoBarras(buckets.map(([bk, c]) => ({ rotulo: DESTINOS[bk], un: UNIDADE_LABEL[bk] + 's',
        plan: bk === 'CAULIMGRANEL' ? c.tonP : c.sacosP, real: bk === 'CAULIMGRANEL' ? c.tonR : c.sacosR })))}</div>
    <div class="card"><h3 class="cp-h3">Avanço acumulado do mês <span class="cp-muted">— em toneladas</span></h3>
      ${_realGraficoAvanco(cons, escopo) || '<p class="cp-ajuda">Sem produção lançada no período.</p>'}</div>
  </div>`;

  const tabProd = `<div class="card" style="margin-top:14px;">
    <h3 class="cp-h3">Produção por linha de custo</h3>
    <p class="cp-ajuda">Quando um produto sai numa linha diferente da planejada, ele aparece aqui com planejado zero — não é erro de rateio, é o desvio.</p>
    <div class="table-wrap cp-tabela-estreita"><table>
      <thead><tr><th>Linha de custo</th><th class="cp-num">Plan. (un)</th><th class="cp-num">Real (un)</th><th class="cp-num">Plan. (t)</th><th class="cp-num">Real (t)</th><th class="cp-num">Atingido</th></tr></thead>
      <tbody>${buckets.map(([bk, c]) => {
        const up = bk === 'CAULIMGRANEL' ? c.tonP : c.sacosP, ur = bk === 'CAULIMGRANEL' ? c.tonR : c.sacosR;
        const at = up > 0 ? ur / up : null;
        return `<tr><td>${DESTINOS[bk]}${up <= 0 && ur > 0 ? ' <span class="badge badge-warning" style="font-size:9px;">fora do plano</span>' : ''}</td>
          <td class="cp-num">${fmtNum(up, 0)}</td><td class="cp-num"><strong>${fmtNum(ur, 0)}</strong></td>
          <td class="cp-num">${fmtNum(c.tonP, 2)}</td><td class="cp-num"><strong>${fmtNum(c.tonR, 2)}</strong></td>
          <td class="cp-num">${at == null ? '<span class="cp-muted">—</span>' : fmtPct(at, 2)}</td></tr>`;
      }).join('') || '<tr><td colspan="6" class="cp-ajuda">Nada planejado nem produzido neste recorte.</td></tr>'}</tbody>
    </table></div>
  </div>`;

  const det = cons.detalhe[escopo] || { diretos: [], compart: [] };
  const cu = cons.custo[escopo] || { diretos: 0, compart: 0, total: 0 };
  const planD = det.diretos.reduce((a, x) => a + x.plan, 0);
  const planC = det.compart.reduce((a, x) => a + x.plan, 0);

  return cab + kpis + graf + tabProd
    + `<div style="margin-top:14px;">${_realExplicaAjustado([...det.diretos, ...det.compart])}</div>`
    + _realTabelaInsumos('🧾 Insumos diretos', 'Realizado vem da baixa por OP em insumos.html.', det.diretos, escopo, planD, cu.diretos)
    + _realTabelaInsumos('🔗 Insumos compartilhados', 'Cada um tem sua própria origem; onde não existe fonte no sistema, o realizado assume o planejado e a linha fica marcada.', det.compart, escopo, planC, cu.compart)
    + (cons.orfaos.length && escopo === '__TOTAL__' ? `<div class="card" style="margin-top:14px;">
        <h3 class="cp-h3">📎 Consumo lançado sem item no plano</h3>
        <p class="cp-ajuda">Saiu do estoque por OP no mês, mas nenhum insumo deste planejamento reclamou. <strong>Não entra no custo realizado acima</strong> — ou falta cadastrar o insumo no plano, ou o nome está diferente dos dois lados.</p>
        <div class="table-wrap cp-tabela-estreita"><table>
          <thead><tr><th>Insumo (estoque)</th><th class="cp-num">Quantidade</th><th class="cp-num">Valor</th></tr></thead>
          <tbody>${cons.orfaos.map((o) => `<tr><td>${esc(o.nome)}</td><td class="cp-num">${fmtNum(o.qtd, 2)} <span class="cp-muted">${esc(o.unidade || '')}</span></td><td class="cp-num">${fmtBRL(o.valor)}</td></tr>`).join('')}</tbody>
          <tfoot><tr style="font-weight:800;"><td>Total fora do custeio</td><td></td><td class="cp-num">${fmtBRL(cons.orfaos.reduce((a, o) => a + o.valor, 0))}</td></tr></tfoot>
        </table></div>
      </div>` : '')
    + _realAvisoResiduo(cons, escopo)
    + `<div class="card" style="margin-top:14px;">
        <div class="cp-kpi-linha cp-bloco-estreito"><span>Diretos</span><strong>${fmtBRL(cu.diretos)} <span class="cp-muted">plano ${fmtBRL(planD)}</span></strong></div>
        <div class="cp-kpi-linha cp-bloco-estreito"><span>Compartilhados</span><strong>${fmtBRL(cu.compart)} <span class="cp-muted">plano ${fmtBRL(planC)}</span></strong></div>
        <div class="cp-kpi-linha cp-bloco-estreito" style="border-top:2px solid var(--primary);padding-top:6px;">
          <span><strong>CUSTO REALIZADO ${escopo === '__TOTAL__' ? 'DA FÁBRICA' : '— ' + esc(escopo)}</strong></span>
          <strong class="cp-destaque" style="font-size:16px;">${fmtBRL(cu.total)}</strong></div>
      </div>`;
}


/* Se a soma das linhas não fecha com o total da fábrica, é porque algum custo
   não tem linha nesse plano (grupo de rateio sem alocação, por exemplo). Não dá
   pra escolher uma linha por conta própria — mas sumir com o dinheiro é pior:
   mostra quanto é e de quê. */
function _realAvisoResiduo(cons, escopo) {
  if (escopo !== '__TOTAL__') return '';
  let soma = 0;
  cons.linhas.forEach((e) => { soma += cons.custo[e].total; });
  const resto = cons.custo['__TOTAL__'].total - soma;
  if (Math.abs(resto) < 0.01) return '';
  const culpados = [];
  ['diretos', 'compart'].forEach((tipo) => {
    cons.detalhe['__TOTAL__'][tipo].forEach((t) => {
      let s = 0;
      cons.linhas.forEach((e) => {
        const x = cons.detalhe[e][tipo].find((y) => y.reg.item.id === t.reg.item.id);
        if (x) s += x.valor;
      });
      const d = t.valor - s;
      if (Math.abs(d) > 0.01) culpados.push({ nome: _nomeInsumoLimpo(t.reg.item.insumo), valor: d });
    });
  });
  culpados.sort((a, b) => Math.abs(b.valor) - Math.abs(a.valor));
  return alertBox('aviso', `<strong>${fmtBRL(resto)} do custo realizado não tem linha neste plano.</strong>
    O total da fábrica está certo, mas abrindo linha a linha esse valor não aparece em nenhuma:
    o rateio do plano não distribui esses itens entre as linhas.
    <div style="margin-top:6px;">${culpados.slice(0, 6).map((x) => `${esc(x.nome)} <strong>${fmtBRL(x.valor)}</strong>`).join(' · ')}${culpados.length > 6 ? ` · e mais ${culpados.length - 6}` : ''}</div>
    <div class="cp-muted" style="margin-top:4px;">Para fechar, dê a esses itens um grupo de rateio com linhas na aba Config.</div>`);
}

// Resumo de ociosidade do TURNO: quantas horas sobraram e o que dava pra produzir nelas.
// É o que mostra que uma demanda baixa deixa capacidade (e dinheiro) na mesa.
// Horas que o turno tem livres depois de atender tudo o que foi planejado.
function _horasOciosasSecao(ativos, dist, h) {
  let horasUsadas = 0;
  (ativos || []).forEach((p) => {
    const d = dist[p.id] || { qtdMax: 0 };
    const demanda = Number(p.demanda) || 0;
    const auto = p.qtdManual === null || p.qtdManual === undefined;
    const qtd = !auto ? Number(p.qtdManual) : (demanda > 0 ? demanda : d.qtdMax);
    if (p.capHora > 0) horasUsadas += qtd / p.capHora;
  });
  return { horasUsadas, horasOciosas: Math.max(0, h.dispH - horasUsadas) };
}
function _resumoOciosidadeSecao(ativos, dist, h) {
  let horasUsadas = 0;
  const sobras = [];
  ativos.forEach((p) => {
    const d = dist[p.id] || { horasDispProd: 0, qtdMax: 0 };
    const demanda = Number(p.demanda) || 0;
    const auto = p.qtdManual === null || p.qtdManual === undefined;
    const qtd = !auto ? Number(p.qtdManual) : (demanda > 0 ? demanda : d.qtdMax);
    if (p.capHora > 0) horasUsadas += qtd / p.capHora;
  });
  const horasOciosas = Math.max(0, h.dispH - horasUsadas);
  // o que ainda daria pra produzir NAS HORAS OCIOSAS (é o dinheiro que fica na mesa)
  ativos.forEach((p) => {
    if (p.capHora > 0 && horasOciosas > 0.5) sobras.push(`${fmtNum(horasOciosas * p.capHora, 0)} ${esc(p.unidade)} de ${esc(p.nome)}`);
  });
  if (horasOciosas < 0.5 && !sobras.length) {
    return `<div class="cp-mini-resultado" style="background:#f0fdf4;border-left:3px solid #15803d;margin-top:8px;">
      ✅ Turno <strong>cheio</strong>: ${horasUsadas.toFixed(1)}h de ${h.dispH.toFixed(1)}h disponíveis.</div>`;
  }
  const pctOcioso = h.dispH > 0 ? horasOciosas / h.dispH : 0;
  return `<div class="cp-mini-resultado" style="background:#fffbeb;border-left:3px solid #b45309;margin-top:8px;">
    <div>⏳ <strong>${horasOciosas.toFixed(1)}h ociosas</strong> de ${h.dispH.toFixed(1)}h disponíveis <span class="cp-muted">(${fmtPct(pctOcioso, 0)} do turno parado por falta de demanda)</span></div>
    <div style="font-size:11px;">Usando ${horasUsadas.toFixed(1)}h${sobras.length ? ` · ainda cabe: ${sobras.join(' ou ')}` : ''}</div>
  </div>`;
}
function renderProdutoCard(bloco, secao, p, dist, horasOciosasSecao) {
  const d = dist[p.id] || { horasDispProd: 0, qtdMax: 0 };
  const demanda = Number(p.demanda) || 0;
  const auto = p.qtdManual === null || p.qtdManual === undefined;
  const qtd = !auto ? Number(p.qtdManual) : (demanda > 0 ? demanda : d.qtdMax);
  const horasNec = p.capHora > 0 ? qtd / p.capHora : 0;
  const excede = demanda > 0 && d.qtdMax > 0 && demanda > d.qtdMax + 1;
  // Sobra de capacidade. Atenção: quando o produto TEM demanda, ele recebe só as horas que a
  // demanda precisa — então qtdMax = demanda e a sobra do próprio produto fica zero. O que
  // realmente sobra são as HORAS OCIOSAS DO TURNO, e é isso que este produto ainda poderia
  // transformar em produto. É esse número que mostra o dinheiro que fica na mesa.
  const ociosasTurno = Number(horasOciosasSecao) || 0;
  const sobraPorHoras = (p.capHora > 0 && ociosasTurno > 0.05) ? ociosasTurno * p.capHora : 0;
  const sobraPropria = d.qtdMax > qtd + 1 ? d.qtdMax - qtd : 0;
  const sobra = Math.max(sobraPropria, sobraPorHoras);
  const horasOciosas = sobraPorHoras > sobraPropria ? ociosasTurno : (p.capHora > 0 ? Math.max(0, d.horasDispProd - horasNec) : 0);
  const potencial = qtd + sobra;
  const ocupacao = potencial > 0 ? qtd / potencial : 0;
  return `<div class="card cp-prod-card">
    <div class="cp-prod-card-header">
      <strong>📦 ${esc(p.nome)}</strong>
      <button class="cp-fechar-btn" title="Tirar este produto do turno" onclick="fecharProdutoSecao('${bloco.id}','${secao.id}','${p.id}')">✕</button>
    </div>
    <div class="cp-field-stack"><label class="form-label">Média/h (${esc(p.unidade)})</label>
      <input class="form-input" type="number" min="0" value="${p.capHora}" onchange="setProdutoCampo('${bloco.id}','${secao.id}','${p.id}','capHora',this.value)"></div>
    <div class="cp-field-stack"><label class="form-label">Demanda</label>
      <input class="form-input" type="number" min="0" placeholder="0" value="${p.demanda || ''}" onchange="setProdutoCampo('${bloco.id}','${secao.id}','${p.id}','demanda',this.value)"></div>
    <div class="cp-field-stack"><label class="form-label">Qtd planejada ${auto ? '<span class="cp-auto">auto</span>' : ''}</label>
      <input class="form-input" type="number" min="0" value="${isFinite(qtd) ? arred(qtd, 0) : ''}" onchange="setProdutoCampo('${bloco.id}','${secao.id}','${p.id}','qtdManual',this.value)"></div>
    <div class="cp-mini-resultado">Horas necessárias: <strong>${p.capHora > 0 ? horasNec.toFixed(1) + 'h' : '—'}</strong>
      ${p.capHora > 0 ? ` de ${d.horasDispProd.toFixed(1)}h disponíveis` : ''}</div>
    ${sobra > 0 ? `<div class="cp-mini-resultado" style="background:#eff6ff;border-left:3px solid #1d4ed8;">
      <div>💤 <strong>Ainda cabe +${fmtNum(sobra, 0)} ${esc(p.unidade)}</strong> <span class="cp-muted">(daria ${fmtNum(potencial, 0)} no total)</span></div>
      <div style="font-size:11px;">${horasOciosas.toFixed(1)}h livres no turno · você está usando ${fmtPct(ocupacao, 0)} do que dava pra produzir</div>
    </div>` : ''}
    ${excede ? alertBox('critico', `🚫 Capacidade excedida! Máximo: ${fmtNum(d.qtdMax, 0)} ${esc(p.unidade)} (${d.horasDispProd.toFixed(1)}h disponíveis).`) : ''}
  </div>`;
}

/* ---------- Linhas recolhidas na Capacidade: fica gravado no navegador, então continua
   recolhido depois de atualizar a página (só abre se você clicar). ---------- */
const CHAVE_LINHAS_RECOLHIDAS = 'cp_linhas_recolhidas';
// Recolher linha: a verdade fica NA PRÓPRIA LINHA (bloco.recolhida), então persiste junto com
// o planejamento salvo (banco) e não vaza de um plano pro outro. O localStorage é só um espelho
// por plano, pra sobreviver a um F5 antes de salvar.
function _chaveEspelhoRecolhidas() {
  return CHAVE_LINHAS_RECOLHIDAS + '_' + (state._planejamentoAtualId || 'novo');
}
function _lerEspelhoRecolhidas() {
  try {
    const bruto = window.localStorage.getItem(_chaveEspelhoRecolhidas());
    const arr = bruto ? JSON.parse(bruto) : [];
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}
function _gravarEspelhoRecolhidas() {
  try {
    const ids = (state.blocos || []).filter((b) => b.recolhida).map((b) => b.id);
    window.localStorage.setItem(_chaveEspelhoRecolhidas(), JSON.stringify(ids));
  } catch (e) { /* sem localStorage: continua funcionando, só não sobrevive ao F5 sem salvar */ }
}
// Ao carregar um plano: se os blocos não trazem o estado, usa o espelho local.
function _aplicarEspelhoRecolhidas() {
  const semEstado = (state.blocos || []).every((b) => b.recolhida === undefined);
  if (!semEstado) return;
  const ids = _lerEspelhoRecolhidas();
  (state.blocos || []).forEach((b) => { b.recolhida = ids.includes(b.id); });
}
function linhaRecolhida(blocoId) {
  const b = (state.blocos || []).find((x) => x.id === blocoId);
  return !!(b && b.recolhida);
}
function toggleLinhaRecolhida(blocoId) {
  const b = (state.blocos || []).find((x) => x.id === blocoId);
  if (b) b.recolhida = !b.recolhida;
  _gravarEspelhoRecolhidas();
  render();
}
function recolherTodasLinhas(recolher) {
  (state.blocos || []).forEach((b) => { b.recolhida = !!recolher; });
  _gravarEspelhoRecolhidas();
  render();
}

      ${headcountBloco > 0 ? `<span class="badge badge-info cp-badge-equipe">👷 ${headcountBloco} colaborador${headcountBloco > 1 ? 'es' : ''} · ${fmtBRL(custoFolhaBloco)}/mês</span>` : ''}
      ${infoLinha ? `<span class="badge badge-gray">${fmtNum(infoLinha.tonTotal, 1)} ton</span>` : ''}
      <button class="btn btn-ghost btn-sm" title="${recolhida ? 'Abrir esta linha' : 'Esconder esta linha'}" onclick="event.stopPropagation(); toggleLinhaRecolhida('${bloco.id}')">${recolhida ? '▸ abrir' : '▾ recolher'}</button>
      <button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="event.stopPropagation(); removeBloco('${bloco.id}')">✕ Remover linha</button>

    ${!recolhida && bloco.linhaNome ? `<div class="cp-field-row" style="padding:0 16px 10px;">
      <label class="form-label" style="margin:0;">🕸️ Filtro de manga nesta linha — quantidade</label>
      <input class="form-input cp-input-sm" type="number" min="0" value="${bloco.filtroMangaQuantidade || 0}" onchange="setBlocoFiltroManga('${bloco.id}', this.value)">
      <span class="cp-muted">× ${fmtBRL(state.filtroManga.precoUnitario)} ÷ ${state.filtroManga.vidaUtilMeses} meses</span>
    </div>` : ''}
    ${recolhida ? '' : ((bloco.secoes || []).length ? `<div class="cp-secoes-grid ${(bloco.secoes || []).length > 1 ? 'cp-secoes-grid--multi' : ''}">${bloco.secoes.map((secao) => renderSecao(bloco, secao)).join('')}</div>` : '<div style="padding:0 16px 16px;"><p class="cp-ajuda" style="margin:0;">Clique em "+ Turno" para adicionar um turno a esta linha.</p></div>')}
  </div>`;
}

function renderMetas(r) {
  const pesoRow = (id, label) => `

  // De onde veio a quantidade planejada de cada produto — só rótulo, não muda conta.
  const rotuloOrigem = (agg) => {
    const tipos = Object.keys(agg.origens || {});
    if (tipos.length !== 1) return tipos.length > 1 ? '<span class="badge badge-gray" title="Este produto aparece em mais de um turno, com origens diferentes">misto</span>' : '';
    if (tipos[0] === 'demanda') return '<span class="badge badge-info" title="A quantidade veio da demanda que você informou">por demanda</span>';
    if (tipos[0] === 'manual') return '<span class="badge badge-gray" title="Quantidade digitada à mão no turno">manual</span>';
    return '<span class="badge badge-gray" title="Sem demanda informada: o plano usou tudo que a capacidade do turno permite">pela capacidade</span>';
  };
  const totQtd = Object.values(r.producao.porProduto).reduce((a, x) => a + (x.qtd || 0), 0);
  const totDem = Object.values(r.producao.porProduto).reduce((a, x) => a + (x.demanda || 0), 0);
  const linhasProduto = Object.entries(r.producao.porProduto).map(([nome, agg]) => {
    const mp = garantirMapaProduto(nome);
    return `<tr><td>${esc(nome)} ${rotuloOrigem(agg)}</td><td class="cp-num">${fmtNum(agg.qtd, 0)}</td><td class="cp-num">${fmtNum(agg.demanda, 0)}</td><td>${mp.destino ? DESTINOS[mp.destino] : '<span class="cp-muted">não mapeado</span>'}</td></tr>`;
  }).join('') || `<tr><td colspan="4" class="cp-muted">Nenhuma produção planejada ainda — configure a aba Capacidade.</td></tr>`;
  const unidadesDistintas = new Set(Object.keys(r.producao.porProduto).map((n) => (garantirMapaProduto(n).destino || '')).filter(Boolean)).size > 1;

// Monta as "metas" (produção por bucket, na unidade de cada um: sacos/bags/ton) e a tonelagem
// de UMA linha física específica, a partir dos detalhes de produção. Isso permite recalcular
// cada insumo direto com a MESMA fórmula da fábrica, mas usando só o que a linha produz.
function _metasDoBloco(producao, blocoId) {
  const metas = { L20: 0, CONC: 0, CAULIM25: 0, CAULIMBB: 0, CAULIMGRANEL: 0 };
  ((producao && producao.detalhes) || []).forEach((d) => {
    if (d.blocoId !== blocoId) return;
    const mp = garantirMapaProduto(d.produtoNome);
    if (mp.destino && metas[mp.destino] !== undefined) metas[mp.destino] += d.qtd;
  });
  return { metas, tonelagem: { tonCAULIMGRANEL: metas.CAULIMGRANEL || 0 } };
}
// Pallets produzidos por UMA linha: soma dos insumos diretos com fórmula de pallet, calculados
// com a produção da própria linha. Linha que não paletiza (só Big Bag/Granel) dá zero.
function _palletsDoBloco(s, producao, blocoId) {
  const m = _metasDoBloco(producao, blocoId);
  return (s.insumos || []).filter((it) => it.tipoRateio === 'direto' && it.formulaQtd === 'pallet' && !it.removido)
    .reduce((a, it) => a + calcularQuantidadeDireto(it, m.metas, m.tonelagem), 0);

// Stretch: o custo cai EXATAMENTE nos produtos que têm pallet. Antes ele era espalhado por

// Caulim 25 que divide a mesma linha — inflando o custo do Big Bag e baixando o do Caulim 25.
function calcularAtribuicaoStretch(s, producao) {
  const g = Number(s.stretch.gramasPorPallet) || 0;
  const p = Number(s.stretch.precoPorGrama) || 0;
  const contribBucket = { L20: 0, CONC: 0, CAULIM25: 0, CAULIMBB: 0, CAULIMGRANEL: 0 };
  const itensPallet = (s.insumos || []).filter((it) => it.tipoRateio === 'direto' && it.formulaQtd === 'pallet' && !it.removido);
  (s.blocos || []).forEach((bloco) => {
    const m = _metasDoBloco(producao, bloco.id);
    itensPallet.forEach((it) => {
      const pallets = calcularQuantidadeDireto(it, m.metas, m.tonelagem);
      if (pallets > 0 && contribBucket[it.produtoBase] !== undefined) contribBucket[it.produtoBase] += pallets * g * p;
    });
  });
  const totalAtribuido = BUCKETS_CUSTO.reduce((a, b) => a + contribBucket[b], 0);
  let pctOverride = null;
  if (totalAtribuido > 0) {
    pctOverride = {};
    BUCKETS_CUSTO.forEach((b) => { pctOverride[b] = contribBucket[b] / totalAtribuido; });
  }
  return { pctOverride, contribBucket, totalAtribuido };
}
// Itens compartilhados VISÍVEIS pra uma linha — mesma régua usada pela tabela da aba,

// alguns insumos vêm sem classe ('—'); na tabela agrupada isso virava "Subtotal —"

function _compartVisiveisDaLinha(r, bucketsRel, s) {

    && (x.item.personalizado || x.item.especial || SEMPRE.includes(x.item.id) || _escopoAtivo(s, x.item.id) || bucketsRel.some((b) => x.calc.linhas[b] > 0.01)));

// equipe, lenha por linha, energia por grupo) — esta é a que fecha com a tela.
function _totaisDaLinhaFisica(r, bloco, s) {

    .reduce((a, x) => a + calcularQuantidadeDireto(x.item, m.metas, m.tonelagem) * (Number(x.item.precoUnitarioEditado) || 0), 0);

function _metasDaLinha(r, blocoId) {
