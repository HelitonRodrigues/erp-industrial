/* <<<<< FIM ABA PLANEJADO x REALIZADO */
    escopos: {}, // escopo de linhas + grupos extra por insumo (ver ESCOPO_IDS). {} = todo item em todas as linhas
    fatorEncargos: 1.00, // multiplicador sobre o salário bruto da folha (impostos/encargos não inclusos na folha). 1.00 = sem acréscimo; 1.80 = +80%
    _itemMultiploSeq: 0,
    alvoMaximoPct: 38, // Custo produtivo ÷ Faturamento não deveria passar disso (%)
    faturamentoManual: { ativo: false, valor: 0 }, // opção de informar o faturamento na mão em vez do automático (qtd x preço)
    secoesAbertas: { insumos: true, resultado: false, precificacao: false, painel: false, 'linha-resumo': true, 'linha-equipe': true, 'linha-diretos': true, 'linha-compartilhados': true, 'alvo-plano': false }, // fluxo "verifique, esconda, próximo"
    insumoModal: { aberto: false },
    explicarCompartId: null, // qual insumo compartilhado está com a explicação aberta na Config da Linha
    linhaSelecionadaId: null, // qual linha está selecionada na aba "Configuração da Linha"
    funcionariosReais: [], // populado via Supabase (funcionarios) — {id, nome, funcao, setor, status, custos:{salario_base,adicional_fixo,insalubridade,encargos_pct}}
    produtosCadastro: [], // populado via Supabase (produtos.html) — {nome, linhas:[...], capacidades:[...], unidade, centro_custo, ...} — fonte principal do mapeamento
    naturezasCusto: [], // populado via Supabase (custos.html) — {id, codigo, nome, grupo}
    centrosCusto: [], // populado via Supabase (custos.html) — {id, codigo, nome, tipo}
    // Folha de Pagamento é editada no módulo RH (rh.html); aqui só LEMOS os salários.
    folhasPagamento: [], // histórico completo (Supabase): [{id, codigo, numero, mes, ano, nome, dados, totais}]
    _tabelaFolhasPagamentoExiste: null,
    cenarios: [],
    insumos: INSUMOS_BASE.map((it) => ({
      ...it,
      custoPorTonEditado: (it.tipoRateio !== 'direto' && !it.especial && !it.temPrecoQtd && it.classificacao !== 'FIXO') ? it.custoPorTon : null,
      valorMensalEditado: (!it.especial && it.classificacao === 'FIXO') ? it.valorMensal : null,
      fatorEditado: it.temPrecoQtd ? (it.qtdBaseReal / TONELAGEM_TOTAL_REAL_MAIO) : null,
      precoUnitarioEditado: (it.tipoRateio === 'direto' || it.qtdPrecoLivre) ? it.precoUnitarioEditado : null,
      quantidadeLivreEditada: it.qtdPrecoLivre ? it.quantidadeLivre : null,
      quantidadeManualEditado: it.tipoRateio === 'direto' && it.formulaQtd === 'manual' ? (it.quantidadeManual || 0) : null,
      sacosPorPalletEditado: it.tipoRateio === 'direto' && it.formulaQtd === 'pallet' ? it.sacosPorPallet : null,
      // desgaste (martelo/gaveta/grelha/eixos): 3 meses de histórico, usados pra achar a média
      // e alertar se o mês simulado foge do padrão. Começa repetindo o único mês real que temos
      // (Maio/2026) — atualize com os 3 meses de verdade quando tiver.
      historico3m: null,
      pctManual: null, // % manual por produto (ajuste ou exclusão interativa), null = usa o rateio automático por tonelagem/bloco
      valorOverrideManual: null, // pros itens "especiais" (folha/lenha/filtro de manga/refeição/cartão) — sobrescreve o cálculo automático quando não-nulo
      removido: null, // true = tirado da conta inteiramente (fica na lista de "removidos" pra poder restaurar depois)
      naturezaId: null, centroCustoId: null, // vínculo opcional com o cadastro real de custos.html (Natureza/Centro de Custo)
      precoUnitarioRef: null, pesoUnidadeRef: null, // preço/peso usados na calculadora auxiliar — guardados só pra mostrar na tabela (preço unitário + quantidade)
    })),
    _blocoSeq: 0, _secaoSeq: 0, _produtoSeq: 0, _cenarioSeq: 0,
    _planejamentoAtualId: null, _planejamentoAtualCodigo: null,
    _planejamentosSalvos: [], _tabelaPlanejamentosExiste: null, // null = ainda não checou
  };
  state.calendario = gerarCalendarioMes(state.ano, state.mes, state.feriadosLocais, {});
  return state;
}

var state = criarEstadoInicial();

/* ------------------------------ heurísticas de mapeamento ------------------------------ */

function destinoPadrao(nome) {
  const n = (nome || '').toUpperCase();
  if (n.includes('GRANEL')) return 'CAULIMGRANEL';
  if (n.includes('BAG') || n.includes('BIG')) return 'CAULIMBB';
  if (n.includes('CAULIM') || n.includes('25')) return 'CAULIM25';
  if (n.includes('CONCENTRADO') || n.includes('10')) return 'CONC';
  if (n.includes('20')) return 'L20';
  return '';
}
function garantirMapaProduto(nome) {
  if (!state.mapaProduto[nome]) state.mapaProduto[nome] = { destino: destinoPadrao(nome) };
  return state.mapaProduto[nome];
}
function produtosDisponiveisDaLinha(nomeLinha) {
  const l = state.linhasReais.find((x) => x.nome === nomeLinha);
  return (l && l.produtos) || [];
}
function todosProdutosCadastrados() {
  const vistos = new Set(); const lista = [];
  // fonte principal: cadastro de Produtos (produtos.html) — é o que o usuário pediu pra usar
  (state.produtosCadastro || []).forEach((p) => { if (!vistos.has(p.nome)) { vistos.add(p.nome); lista.push(p); } });
  // fallback: produtos que só existem dentro de uma linha (linhas_producao) mas nao no cadastro de Produtos
  state.linhasReais.forEach((l) => (l.produtos || []).forEach((p) => {
    if (!vistos.has(p.nome)) { vistos.add(p.nome); lista.push(p); }
  }));
  (state.produtosExtras || []).forEach((p) => { if (!vistos.has(p.nome)) { vistos.add(p.nome); lista.push(p); } });
  const ocultos = new Set(state.produtosOcultos || []);
  return lista.filter((p) => !ocultos.has(p.nome));
}
function adicionarProdutoMapeamento(nome) {
  const n = (nome || '').trim(); if (!n) return;
  const jaExiste = state.produtosExtras.some((p) => p.nome === n)
    || (state.produtosCadastro || []).some((p) => p.nome === n)
    || state.linhasReais.some((l) => (l.produtos || []).some((p) => p.nome === n));
  if (!jaExiste) {
    state.produtosExtras.push({ nome: n, capHora: 0, unidade: 'un' });
  }
  state.produtosOcultos = state.produtosOcultos.filter((x) => x !== n);
  garantirMapaProduto(n);
  render();
  if (typeof toast === 'function') toast(`Produto "${n}" adicionado ao mapeamento.`, 'success');
}
function removerProdutoMapeamento(nome) {
  if (!state.produtosOcultos.includes(nome)) state.produtosOcultos.push(nome);
  render();
}

/* ------------------------------ agregação: capacidade -> produção planejada ------------------------------ */

function agregarProducaoPlanejada(s) {
  const detalhes = []; // uma linha por (bloco, seção, produto)
  const porProduto = {}; // nome -> { qtd, demanda, qtdMax, horasDisp }

  s.blocos.forEach((bloco) => {
    bloco.secoes.forEach((secao) => {
      const turno = s.turnosReais.find((t) => t.nome === secao.turnoNome);
      const paradasHoras = (secao.paradas || []).reduce((a, p) => a + (Number(p.horas) || 0), 0);
      const h = calcHorasSecao(s.calendario, turno, secao.eficiencia, secao.extras, paradasHoras, s.horasDomingoEspecial);
      // Simulação rápida: testar "e se eu desligasse esse turno", "reduzisse a disponibilidade em %",
      // "ficasse X dias parado" ou "perdesse X horas" — SEM apagar a configuração real, só ajusta
      // as horas disponíveis pra esse cálculo. Os modos são cumulativos (exceto desligar, que zera tudo).
      let temSimSecaoParada = false;
      if (secao.simuladoDesligado) {
        h.dispH = 0;
        temSimSecaoParada = true;
      } else {
        if (secao.simuladoReducaoPct > 0) { h.dispH = h.dispH * (1 - secao.simuladoReducaoPct / 100); temSimSecaoParada = true; }
        // Parada por PERÍODO de datas: conta os dias úteis no intervalo e soma aos dias parados manuais.
        const diasParadaPeriodo = contarDiasTrabalhoIntervalo(s.calendario, secao.simuladoParadaInicio, secao.simuladoParadaFim);
        const diasParadosTotal = (Number(secao.simuladoDiasParados) || 0) + diasParadaPeriodo;
        if (diasParadosTotal > 0 && h.diasTrabalho > 0) {
          const horasPorDia = h.horasBrutas / h.diasTrabalho;
          h.dispH = Math.max(0, h.dispH - diasParadosTotal * horasPorDia);
          temSimSecaoParada = true;
        }
        if (secao.simuladoHorasReduzidas > 0) { h.dispH = Math.max(0, h.dispH - secao.simuladoHorasReduzidas); temSimSecaoParada = true; }
      }
      const produtosAtivos = (secao.produtos || []).filter((p) => p.ativo !== false);
      const produtosCalc = produtosAtivos.map((p) => ({ id: p.id, capHora: Number(p.capHora) || 0, demanda: Number(p.demanda) || 0 }));
      const dist = distribuirHorasProdutos(produtosCalc, h.dispH);

      produtosAtivos.forEach((p) => {
        const d = dist[p.id] || { horasDispProd: 0, qtdMax: 0 };
        const demanda = Number(p.demanda) || 0;
        // Normalmente a meta é a demanda (planejamento guiado pela demanda). MAS quando há uma
        // parada simulada nesta seção, a produção fica limitada ao que a capacidade reduzida
        // permite (qtdMax) — é isso que mostra o impacto real de parar a linha.
        const qtd = (p.qtdManual !== null && p.qtdManual !== undefined && p.qtdManual !== '')
          ? Number(p.qtdManual)
          : (demanda > 0 ? (temSimSecaoParada ? Math.min(demanda, d.qtdMax) : demanda) : d.qtdMax);
        const horasNec = p.capHora > 0 ? qtd / Number(p.capHora) : 0;
        const excede = demanda > 0 && d.qtdMax > 0 && demanda > d.qtdMax + 1;
        detalhes.push({
          blocoId: bloco.id, linhaNome: bloco.linhaNome, secaoId: secao.id, turnoNome: secao.turnoNome,
          produtoNome: p.nome, unidade: p.unidade, capHora: Number(p.capHora) || 0, demanda, qtd, qtdMax: d.qtdMax,
          horasNec, horasDispSecao: h.dispH, paradaSecao: (h.perdaH || 0) + (h.paradaH || 0), excede,
        });
        if (!porProduto[p.nome]) porProduto[p.nome] = { qtd: 0, demanda: 0, qtdMax: 0, horasDisp: 0, origens: {} };
        // de onde veio a quantidade deste item (só informativo — não entra em conta nenhuma)
        const _origem = (p.qtdManual !== null && p.qtdManual !== undefined && p.qtdManual !== '') ? 'manual' : (demanda > 0 ? 'demanda' : 'capacidade');
        porProduto[p.nome].origens[_origem] = (porProduto[p.nome].origens[_origem] || 0) + 1;
        porProduto[p.nome].qtd += qtd;
        porProduto[p.nome].demanda += demanda;
        porProduto[p.nome].qtdMax += d.qtdMax;
        porProduto[p.nome].horasDisp += d.horasDispProd;
      });
    });
  });

  const metas = { L20: 0, CONC: 0, CAULIM25: 0, CAULIMBB: 0, CAULIMGRANEL: 0 };
  const naoMapeados = [];
  Object.entries(porProduto).forEach(([nome, agg]) => {
    const mp = garantirMapaProduto(nome);
    if (mp.destino && metas[mp.destino] !== undefined) metas[mp.destino] += agg.qtd;
    else naoMapeados.push({ nome, qtd: agg.qtd });
  });

  return { detalhes, porProduto, metas, naoMapeados };
}

/* ---------------------------- agregação por linha física (bloco) ---------------------------- */

function qtdParaToneladas(destino, qtd, pesos) {
  switch (destino) {
    case 'L20': return (qtd * pesos.pesoL20Kg) / 1000;
    case 'CONC': return (qtd * pesos.pesoCONCKg) / 1000;
    case 'CAULIM25': return (qtd * pesos.pesoCAULIM25Kg) / 1000;
    case 'CAULIMBB': return (qtd * pesos.pesoBigBagKg) / 1000;
    case 'CAULIMGRANEL': return qtd; // já vem em toneladas
    default: return 0;
  }
}

// Tonelagem produzida, por bloco (linha física) e por linha de custo — usado tanto
// pra ratear a Folha por headcount quanto pra montar a visão "custo por linha física".
function calcularTonelagemPorBloco(s, detalhes) {
  const porBloco = {};
  detalhes.forEach((d) => {
    const mp = garantirMapaProduto(d.produtoNome);
    if (!mp.destino) return;
    const ton = qtdParaToneladas(mp.destino, d.qtd, s.pesos);
    if (!porBloco[d.blocoId]) {
      porBloco[d.blocoId] = { linhaNome: d.linhaNome, tonPorBucket: { L20: 0, CONC: 0, CAULIM25: 0, CAULIMBB: 0, CAULIMGRANEL: 0 }, tonTotal: 0 };
    }
    porBloco[d.blocoId].tonPorBucket[mp.destino] += ton;
    porBloco[d.blocoId].tonTotal += ton;
  });
  return porBloco;
}

// A Folha agora é a ÚNICA fonte de dados de mão de obra — cada mês tem sua própria
// folha lançada no módulo Folha, e Custo & Precificação sempre busca o Salário Bruto
// da folha correspondente ao mês/ano do planejamento atual.
function folhaDoMes(mes, ano) {
  return state.folhasPagamento.find((f) => Number(f.mes) === Number(mes) && Number(f.ano) === Number(ano)) || null;
}
function _normalizarNomeFolha(nome) {
  return (nome || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().trim().replace(/\s+/g, ' ');
}
// Nome de um registro da folha: extras guardam nomeExtra; os normais são pela chave (id do cadastro).
function _nomeDoRegistroFolha(chave, registro) {
  if (registro && registro.extra) return registro.nomeExtra || '';
  const f = state.funcionariosReais.find((x) => x.id === chave);
  return f ? f.nome : '';
}
// Dois nomes são a mesma pessoa? Igualdade exata (sem acento/caixa) ou primeiro+último nome iguais
// (cobre "José C. Silva" vs "José Carlos Silva", nome do meio abreviado etc.).
function _nomesCompativeis(a, b) {
  const na = _normalizarNomeFolha(a), nb = _normalizarNomeFolha(b);
  if (!na || !nb) return false;
  if (na === nb) return true;
  const pa = na.split(' '), pb = nb.split(' ');
  return pa.length > 1 && pb.length > 1 && pa[0] === pb[0] && pa[pa.length - 1] === pb[pb.length - 1];
}
// Procura o funcionário DENTRO de uma folha: pelo ID e, se não achar, por nome em TODOS os
// registros (não só nos "extra") — é o que fazia gente com valor aparecer como "sem dados".
function _buscarRegistroNaFolha(folha, funcionarioId) {
  if (!folha || !folha.dados) return null;
  if (folha.dados[funcionarioId]) return folha.dados[funcionarioId];
  const func = state.funcionariosReais.find((f) => f.id === funcionarioId);
  if (!func) return null;
  const achado = Object.entries(folha.dados).find(([chave, reg]) => _nomesCompativeis(_nomeDoRegistroFolha(chave, reg), func.nome));
  return achado ? achado[1] : null;
}
function _folhasMaisRecentesPrimeiro() {
  return (state.folhasPagamento || []).slice().sort((a, b) => (Number(b.ano) - Number(a.ano)) || (Number(b.mes) - Number(a.mes)));
}
// Registro do funcionário: primeiro na folha do mês do plano; se não houver, na folha mais
// recente que tenha essa pessoa com valor — "se tem valor, tem que trazer".
function registroFolhaDoFuncionario(funcionarioId, mes, ano) {
  const doMes = _buscarRegistroNaFolha(folhaDoMes(mes, ano), funcionarioId);
  if (doMes) return doMes;
  for (const f of _folhasMaisRecentesPrimeiro()) {
    const reg = _buscarRegistroNaFolha(f, funcionarioId);
    if (reg && (Number(reg.salarioBruto) || 0) > 0) return reg;
  }
  return null;
}
// Se o valor veio de outro mês, devolve a folha de origem (pra avisar na tela). Senão, null.
function folhaOrigemDoFuncionario(funcionarioId, mes, ano) {
  if (_buscarRegistroNaFolha(folhaDoMes(mes, ano), funcionarioId)) return null;
  for (const f of _folhasMaisRecentesPrimeiro()) {
    const reg = _buscarRegistroNaFolha(f, funcionarioId);
    if (reg && (Number(reg.salarioBruto) || 0) > 0) return f;
  }
  return null;
}
// Rótulo de origem do valor da folha: do próprio mês ou de um mês anterior (com aviso).
// O registro desta pessoa foi achado pelo ID do cadastro, ou por semelhança de NOME?
// Casar por nome funciona, mas é frágil: basta a folha do mês que vem grafar diferente
// e o salário sai da conta em silêncio. Quem depende disso precisa aparecer na tela.
function _vinculoPorNome(funcionarioId) {
  const folha = folhaDoMes(state.mes, state.ano);
  if (!folha || !folha.dados) return null;
  if (folha.dados[funcionarioId]) return null;              // achou pelo ID: tudo certo
  const func = (state.funcionariosReais || []).find((f) => f.id === funcionarioId);
  if (!func) return null;
  const achado = Object.entries(folha.dados).find(([chave, reg]) => _nomesCompativeis(_nomeDoRegistroFolha(chave, reg), func.nome));
  if (!achado) return null;
  const reg = achado[1];
  return { nomeNaFolha: (reg && reg.extra) ? (reg.nomeExtra || '') : '', extra: !!(reg && reg.extra), valor: (Number(reg && reg.salarioBruto) || 0) };
}
function _rotuloOrigemFolha(funcionarioId) {
  const porNome = _vinculoPorNome(funcionarioId);
  const origem = folhaOrigemDoFuncionario(funcionarioId, state.mes, state.ano);
  if (porNome) {
    const titulo = `Esta pessoa não foi encontrada na folha pelo cadastro — o valor veio de um lançamento ${porNome.extra ? 'AVULSO' : ''} casado por semelhança de nome${porNome.nomeNaFolha ? ` ("${esc(porNome.nomeNaFolha)}")` : ''}. Se o nome mudar na próxima folha, este salário sai do custo sem aviso.`;
    return `<span class="badge badge-warning" style="font-size:9px;" title="${titulo}">🔗 casado por nome</span>`;
  }
  if (!origem) return 'vem da Folha';
  return `⚠️ valor de ${String(origem.mes).padStart(2, '0')}/${origem.ano}`;
}
// Resumo pro topo: quantas pessoas dependem de casamento por nome e quanto isso vale.
function _resumoVinculoPorNome() {
  const alvo = [];
  const vistos = new Set();
  const push = (fid) => { if (!fid || vistos.has(fid)) return; vistos.add(fid); const v = _vinculoPorNome(fid); if (v) alvo.push({ fid, ...v }); };
  (state.blocos || []).forEach((b) => (b.secoes || []).forEach((sec) => (sec.equipe || []).forEach(push)));
  (state.equipeAdmin || []).forEach(push);
  const fator = Number(state.fatorEncargos) > 0 ? Number(state.fatorEncargos) : 1;
  return { lista: alvo, total: alvo.reduce((a, x) => a + x.valor * fator, 0) };
}
function _avisoVinculoPorNome() {
  const { lista, total } = _resumoVinculoPorNome();
  if (!lista.length) return '';
  const nomes = lista.map((x) => {
    const f = (state.funcionariosReais || []).find((y) => y.id === x.fid);
    return esc(f ? f.nome : x.fid);
  }).join(', ');
  return alertBox('atencao', `🔗 <strong>${lista.length} pessoa(s) entram no custo por semelhança de nome</strong>, não pelo cadastro: ${nomes}. São <strong>${fmtBRL(total)}</strong> com encargos. Funciona hoje, mas se a próxima folha grafar o nome de outro jeito esse valor sai da conta sem aviso — o ideal é lançar essas pessoas na Folha pelo cadastro.`);
}
function custoMensalFuncionario(funcionarioId, mes, ano) {
  const registro = registroFolhaDoFuncionario(funcionarioId, mes, ano);
  if (!registro) return 0;
  const bruto = Number(registro.salarioBruto) || 0;
  const fator = Number(state.fatorEncargos) > 0 ? Number(state.fatorEncargos) : 1;
  return bruto * fator;
}

// Distribui a Folha (mão de obra direta) entre as linhas de custo, com base em
// QUEM PRODUZ o quê: cada bloco soma o custo real dos funcionários alocados nos
// seus turnos, e reparte entre os produtos daquele bloco proporcional à tonelagem
// de cada um DENTRO do bloco (ex.: Caulim Ensacado/Bag/Granel na mesma linha).
// Distribui um custo mensal calculado POR LINHA FÍSICA (bloco) entre as linhas de custo,
// proporcional à tonelagem de cada produto DENTRO daquele bloco. Reusado por Folha, Lenha
// e Filtro de manga — a única diferença entre eles é como se calcula o custo de cada bloco.
function calcularAtribuicaoPorBloco(s, tonPorBloco, custoBlocoFn) {
  const contribBucket = { L20: 0, CONC: 0, CAULIM25: 0, CAULIMBB: 0, CAULIMGRANEL: 0 };
  let custoSemProducao = 0;
  (s.blocos || []).forEach((bloco) => {
    const custoBloco = custoBlocoFn(bloco) || 0;
    if (custoBloco <= 0) return;
    const info = tonPorBloco[bloco.id];
    if (info && info.tonTotal > 0) {
      BUCKETS_CUSTO.forEach((b) => { contribBucket[b] += custoBloco * (info.tonPorBucket[b] / info.tonTotal); });
    } else {
      // Linha COM custo e SEM produção (ex.: turno parado na simulação). A fábrica paga de
      // qualquer forma, mas essa linha não tem produto pra absorver — então o custo cai no
      // que foi realmente produzido. O total nunca se perde.
      custoSemProducao += custoBloco;
    }
  });
  const totalComProducao = BUCKETS_CUSTO.reduce((a, b) => a + contribBucket[b], 0);
  if (custoSemProducao > 0 && totalComProducao > 0) {
    const fator = (totalComProducao + custoSemProducao) / totalComProducao;
    BUCKETS_CUSTO.forEach((b) => { contribBucket[b] *= fator; });
  }
  const totalAtribuido = BUCKETS_CUSTO.reduce((a, b) => a + contribBucket[b], 0) + (totalComProducao > 0 ? 0 : custoSemProducao);
  let pctOverride = null;
  if (totalComProducao > 0) {
    const somaFinal = BUCKETS_CUSTO.reduce((a, b) => a + contribBucket[b], 0);
    pctOverride = {};
    BUCKETS_CUSTO.forEach((b) => { pctOverride[b] = contribBucket[b] / somaFinal; });
  }
  return { pctOverride, contribBucket, totalAtribuido, custoSemProducao };
}

// Em quantos turnos cada funcionário está escalado. Serve pra NÃO contar o salário duas vezes
// quando a mesma pessoa aparece em mais de um turno/linha: o custo dela é dividido entre eles.
function _alocacoesPorFuncionario(s) {
  const mapa = {};
  (s.blocos || []).forEach((b) => (b.secoes || []).forEach((sec) => (sec.equipe || []).forEach((fid) => {
    mapa[fid] = (mapa[fid] || 0) + 1;
  })));
  return mapa;
}
// Quem está escalado em mais de um turno (normalmente é engano de lançamento).
function _funcionariosDuplicados(s) {
  const mapa = _alocacoesPorFuncionario(s);
  return Object.keys(mapa).filter((fid) => mapa[fid] > 1).map((fid) => {
    const f = (s.funcionariosReais || []).find((x) => x.id === fid);
    return { id: fid, nome: f ? f.nome : fid, vezes: mapa[fid] };
  });
}
function calcularAtribuicaoFolha(s, tonPorBloco) {
  const nAloc = _alocacoesPorFuncionario(s);
  const idsAlocados = new Set();
  const r = calcularAtribuicaoPorBloco(s, tonPorBloco, (bloco) => {
    let custo = 0;
    (bloco.secoes || []).forEach((sec) => {
      // ATENÇÃO: turno parado na simulação NÃO tira a pessoa da folha. Ela continua sendo
      // paga mesmo com a linha parada — é justamente isso que faz o custo/tonelada disparar.
      (sec.equipe || []).forEach((fid) => {
        // dividido pelas alocações da pessoa: o salário entra UMA vez no total da fábrica
        custo += custoMensalFuncionario(fid, s.mes, s.ano) / (nAloc[fid] || 1);
        idsAlocados.add(fid);
      });
    });
    return custo;
  });
  let headcountAlocado = idsAlocados.size; // pessoas ÚNICAS, não alocações
  (s.equipeAdmin || []).forEach((fid) => { if (!idsAlocados.has(fid)) { idsAlocados.add(fid); headcountAlocado++; } });
  const naoAlocados = (s.funcionariosReais || []).filter((f) => !idsAlocados.has(f.id));
  return { ...r, headcountAlocado, naoAlocados };
}

// Lenha: m³ consumido por turno rodando (configurável por seção — pode variar de 1,5 a 3m³
// dependendo do turno) x dias de trabalho no mês x preço do m³. Turno "desligado" não consome.
function calcularAtribuicaoLenha(s, tonPorBloco) {
  const diasTrabalho = contarDiasTrabalho(s.calendario);
  return calcularAtribuicaoPorBloco(s, tonPorBloco, (bloco) => {
    let m3Total = 0;
    (bloco.secoes || []).forEach((sec) => {
      if (sec.simuladoDesligado) return;
      m3Total += (Number(sec.lenhaM3PorTurno) || 0) * diasTrabalho;
    });
    return m3Total * (Number(s.lenha.precoM3) || 0);
  });
}

// Filtro de manga: quantidade de mangas daquela linha específica x preço unitário,
// amortizado pela vida útil em meses (ex.: 96 mangas x R$200 / 18 meses).
function calcularAtribuicaoFiltroManga(s, tonPorBloco) {
  return calcularAtribuicaoPorBloco(s, tonPorBloco, (bloco) => {
    const qtd = Number(bloco.filtroMangaQuantidade) || 0;
    return (qtd * (Number(s.filtroManga.precoUnitario) || 0)) / (Number(s.filtroManga.vidaUtilMeses) || 18);
  });
}

function calcularAtribuicaoAdmin(s) {
  const equipe = s.equipeAdmin || [];
  const custoTotal = equipe.reduce((a, fid) => a + custoMensalFuncionario(fid, s.mes, s.ano), 0);
  return { custoTotal, headcount: equipe.length };
}

// Custo GERAL da fábrica (energia, arrendamento, administrativo): o valor é compartilhado
// entre TODAS as linhas da fábrica. Se o plano atual tem menos linhas ativas do que o total,
// só a fatia das linhas ativas entra na conta — não o valor inteiro numa linha só.
// Ex.: R$38.000 de admin ÷ 4 linhas da fábrica = R$9.500/linha. Plano com 1 linha ativa
// → entra R$9.500 (não R$38.000). Plano com as 4 → entra R$38.000.

// ---- GRUPOS DE RATEIO (arrendamento, energia) ----
// Cada grupo {id, nome, valor, blocoIds[]} divide seu valor IGUALMENTE entre as linhas (blocos)
// escolhidas que estão ativas no plano. Uma linha pode estar em vários grupos.
function _blocosAtivosIds(tonPorBloco) {
  return Object.keys(tonPorBloco).filter((id) => tonPorBloco[id].tonTotal > 0);
}
// O GRUPO define QUAIS linhas dividem; a TONELAGEM define QUANTO cada uma paga.
// (Dividir igual castigava a linha pequena: ela pagava o mesmo que uma linha grande e o
// custo/tonelada dela explodia.)
/* Grupo com TODAS as linhas paradas ainda tem que ser pago.
   Antes, `membrosAtivos.length === 0` fazia o grupo inteiro devolver zero e o valor
   sumia da conta: parar a Longa Vida apagava os R$ 35.000 do grupo dela, e com a
   fábrica toda parada o arrendamento ia a R$ 0,00. Isso fazia "parar a linha" parecer
   mais barato do que é, justamente na aba criada pra decidir isso.
   Agora, quando nenhum membro produz, o valor é dividido igualmente entre os membros
   do grupo. Cada um vira uma linha COM custo e SEM produção — e o
   `calcularAtribuicaoPorBloco` já sabe tratar esse caso: joga o custo em cima do que
   foi realmente produzido e, se nada foi, mantém no total. O total nunca se perde.
   Quando existe pelo menos um membro ativo, nada muda em relação a antes. */
// Um item de grupo continua sendo pago com a linha parada? Depende da classificação
// dele: FIXO é contrato (arrendamento) e corre parado; VARIÁVEL é consumo (energia)
// e não corre. A resposta sai do próprio cadastro do insumo, não de constante no código.
function _grupoPagaParado(s, itemId) {
  const it = ((s || state).insumos || []).find((x) => x.id === itemId);
  return !!(it && !it.removido && it.classificacao === 'FIXO');
}
function _membrosDoGrupoQuePagam(g, ativosIds, pagaParado) {
  const membros = g.blocoIds || [];
  const ativos = membros.filter((id) => ativosIds.includes(id));
  if (ativos.length) return { ids: ativos, porTonelagem: true };
  return pagaParado ? { ids: membros, porTonelagem: false } : { ids: [], porTonelagem: false };
}
function _valorGrupoDoBloco(config, blocoId, ativosIds, tonPorBloco, pagaParado) {
  let v = 0;
  (config && config.grupos ? config.grupos : []).forEach((g) => {
    const { ids: membros, porTonelagem } = _membrosDoGrupoQuePagam(g, ativosIds, pagaParado);
    if (membros.length === 0 || !membros.includes(blocoId)) return;
    const valor = Number(g.valor) || 0;
    if (porTonelagem && tonPorBloco) {
      const tonGrupo = membros.reduce((a, id) => a + ((tonPorBloco[id] && tonPorBloco[id].tonTotal) || 0), 0);
      const tonEsta = (tonPorBloco[blocoId] && tonPorBloco[blocoId].tonTotal) || 0;
      if (tonGrupo > 0) { v += valor * (tonEsta / tonGrupo); return; }
    }
    v += valor / membros.length; // sem tonelagem (nada produzido): divide igual
  });
  return v;
}
function _totalGrupos(config, ativosIds, pagaParado) {
  return (config && config.grupos ? config.grupos : []).reduce((a, g) => {
    const { ids } = _membrosDoGrupoQuePagam(g, ativosIds, pagaParado);
    return a + (ids.length > 0 ? (Number(g.valor) || 0) : 0);
  }, 0);
}
function calcularAtribuicaoGrupos(s, tonPorBloco, config, itemId) {
  const ativos = _blocosAtivosIds(tonPorBloco);
  const pagaParado = itemId ? _grupoPagaParado(s, itemId) : false;
  return calcularAtribuicaoPorBloco(s, tonPorBloco, (bloco) => _valorGrupoDoBloco(config, bloco.id, ativos, tonPorBloco, pagaParado));
}

// ---- ESCOPO DE LINHAS + GRUPOS EXTRA (genérico — vale pros itens de ESCOPO_IDS) ----
// Leitura do escopo. Ausente ou blocoIds null = TODAS as linhas (padrão de antes).
function _escopoDoItem(s, itemId) {
  const e = (s && s.escopos) ? s.escopos[itemId] : null;
  return (e && typeof e === 'object') ? e : null;
}
function _escopoBlocoIds(s, itemId) {
  const e = _escopoDoItem(s, itemId);
  return (e && Array.isArray(e.blocoIds)) ? e.blocoIds : null;
}
function _escopoGrupos(s, itemId) {
  const e = _escopoDoItem(s, itemId);
  return (e && Array.isArray(e.grupos)) ? e.grupos : [];
}
function _blocoNoEscopo(s, itemId, blocoId) {
  const ids = _escopoBlocoIds(s, itemId);
  return ids === null ? true : ids.includes(blocoId);
}
function _escopoGruposDoBloco(s, itemId, blocoId) {
  return _escopoGrupos(s, itemId).filter((g) => (g.blocoIds || []).includes(blocoId));
}
// Tem escopo DE VERDADE configurado? (alguma linha de fora, ou algum grupo extra).
// Se não tem, o item segue o caminho de cálculo antigo, sem passar por aqui.
function _escopoAtivo(s, itemId) {
  if (!ESCOPO_IDS.includes(itemId)) return false;
  const ids = _escopoBlocoIds(s, itemId);
  const restrito = ids !== null && (s.blocos || []).some((b) => !ids.includes(b.id));
  return restrito || _escopoGrupos(s, itemId).length > 0;
}

// A RÉGUA do item: quanto cada linha pesa na divisão do valor base.
// Por tonelada é o padrão; refeição/EPI vão por gente; mat. moinho no modo "por linha"
// vai pela quantidade de peças lançada em cada uma; cartão alimentação pela folha.
function _pesoEscopoDoBloco(s, itemId, bloco, tonPorBloco) {
  const info = tonPorBloco[bloco.id];
  const tonLinha = info ? info.tonTotal : 0;
  const tonFabrica = Object.values(tonPorBloco).reduce((a, i) => a + i.tonTotal, 0);
  const share = tonFabrica > 0 ? tonLinha / tonFabrica : 0;
  if (itemId === 'refeicao' || itemId === 'epi') {
    return _headcountDaLinha(bloco) + ((s.equipeAdmin || []).length * share);
  }
  if (itemId === 'valealim') {
    return _folhaModDaLinha(bloco, s) + (_custoTotalAdmin(s) * share);
  }
  if (MATMOINHO_IDS.includes(itemId) && _desgasteModo(s, itemId) === 'linha') {
    return (bloco.matMoinho && Number(bloco.matMoinho[itemId])) || 0;
  }
  return tonLinha;
}

// Valor total do item ANTES do escopo — espelha exatamente o que o motor calcularia
// sozinho, pra o escopo só mudar a DIVISÃO entre as linhas, nunca o total.
function _valorBaseEscopo(s, item, tonelagem, ctx) {
  if (item.valorOverrideManual != null) return Number(item.valorOverrideManual) || 0;
  const id = item.id;
  if (id === 'folha_admin') return _custoTotalAdmin(s);
  if (id === 'refeicao') return (Number(ctx.headcountAlocado) || 0) * (Number(ctx.diasPorMes) || 0) * (Number(s.refeicao.valorPorMarmita) || 0);
  if (id === 'epi') return totalItensMultiplos('epi');
  if (id === 'valealim') return ((Number(ctx.folhaTotal) || 0) + _custoTotalAdmin(s)) * ((Number(s.cartaoAlimentacao.percentualSobreSalario) || 0) / 100);
  if (MATMOINHO_IDS.includes(id)) {
    const preco = _precoMatMoinho(s, id);
    if (_desgasteModo(s, id) === 'linha') {
      // "quantidade de cada linha": o total é a soma das linhas DENTRO do escopo —
      // linha excluída não consome peça, então ela não entra nem no total.
      return (s.blocos || []).reduce((a, b) => a + (_blocoNoEscopo(s, id, b.id) ? ((b.matMoinho && Number(b.matMoinho[id])) || 0) : 0), 0) * preco;
    }
    return _qtdFabricaDesgaste(s, id) * preco;
  }
  if (item.qtdPrecoLivre) {
    const q = item.quantidadeLivreEditada != null ? item.quantidadeLivreEditada : item.quantidadeLivre;
    return (Number(q) || 0) * (Number(item.precoUnitarioEditado) || 0);
  }
  if (item.classificacao === 'FIXO') {
    const v = item.valorMensalEditado != null ? item.valorMensalEditado : item.valorMensal;
    return Number(v) || 0;
  }
  const cpt = item.custoPorTonEditado != null ? item.custoPorTonEditado : item.custoPorTon;
  return (Number(cpt) || 0) * (Number(tonelagem.tonTotal) || 0);
}

// Divide o valor base entre as linhas DO ESCOPO (pela régua do item) e soma os grupos
// extra. Devolve o rateio por produto (pctOverride, que o motor usa) e o valor de CADA
// linha — é ele que a Configuração da Linha mostra, e a soma fecha com o total do item.
function calcularAtribuicaoEscopo(s, tonPorBloco, itemId, valorBase) {
  const blocos = s.blocos || [];
  const ativos = _blocosAtivosIds(tonPorBloco);
  const escopo = _escopoDoItem(s, itemId);
  const dentro = blocos.filter((b) => _blocoNoEscopo(s, itemId, b.id));
  const pesos = {}; let somaPeso = 0;
  dentro.forEach((b) => {
    const p = Math.max(0, Number(_pesoEscopoDoBloco(s, itemId, b, tonPorBloco)) || 0);
    pesos[b.id] = p; somaPeso += p;
  });
  // Régua zerada dentro do escopo (ex.: só linhas paradas): divide igual entre as marcadas.
  if (somaPeso <= 0 && dentro.length > 0) { dentro.forEach((b) => { pesos[b.id] = 1; }); somaPeso = dentro.length; }
  // Nenhuma linha marcada: o valor não pode desaparecer da fábrica — volta pra todas.
  if (somaPeso <= 0 && blocos.length > 0) { blocos.forEach((b) => { pesos[b.id] = 1; }); somaPeso = blocos.length; }
  const vBase = Number(valorBase) || 0;
  const porBlocoBase = {}, porBlocoGrupos = {}, porBloco = {};
  blocos.forEach((b) => {
    porBlocoBase[b.id] = somaPeso > 0 ? vBase * ((pesos[b.id] || 0) / somaPeso) : 0;
    porBlocoGrupos[b.id] = _valorGrupoDoBloco(escopo, b.id, ativos, tonPorBloco);
    porBloco[b.id] = porBlocoBase[b.id] + porBlocoGrupos[b.id];
  });
  const r = calcularAtribuicaoPorBloco(s, tonPorBloco, (b) => porBloco[b.id] || 0);
  return { ...r, porBloco, porBlocoBase, porBlocoGrupos, valorBase: vBase, totalGrupos: _totalGrupos(escopo, ativos) };
}

// Acesso ao resultado já calculado (cache preenchido por computar()).
function _atribEscopoDe(s, itemId) { return (s && s._atribEscopo) ? (s._atribEscopo[itemId] || null) : null; }
function _valorEscopoDoBloco(s, itemId, blocoId) {
  const a = _atribEscopoDe(s, itemId);
  return (a && a.porBloco) ? (a.porBloco[blocoId] || 0) : 0;
}
// Fração da PARTE BASE que cabe a esta linha — usada só pra mostrar quantidade física
// (litros, peças, refeições). Grupo extra é valor digitado, não tem quantidade.
function _fracaoBaseEscopo(s, itemId, blocoId) {
  const a = _atribEscopoDe(s, itemId);
  if (!a || !(a.valorBase > 0)) return 0;
  return (a.porBlocoBase[blocoId] || 0) / a.valorBase;
}

// ---- MAT. MOINHO / DESGASTE ----
// Preço por peça (global, vem do insumo).
function _precoMatMoinho(s, itemId) {
  const it = (s.insumos || []).find((x) => x.id === itemId);
  return it ? (Number(it.precoUnitarioEditado) || 0) : 0;
}
// Quantidade total planejada no mês para a fábrica (em PEÇAS).
function _qtdFabricaDesgaste(s, itemId) {
  const it = (s.insumos || []).find((x) => x.id === itemId);
  if (!it) return 0;
  const q = it.quantidadeLivreEditada != null ? it.quantidadeLivreEditada : it.quantidadeLivre;
  return Number(q) || 0;
}
// Massa útil de uma peça = peso novo − peso de descarte. É o que realmente se consome.
// Zero/negativo = sem peso informado → o item é cobrado por peça.
function _massaUtilPeca(s, itemId) {
  const p = (s.desgaste && s.desgaste[itemId]) || {};
  const util = (Number(p.pesoNovo) || 0) - (Number(p.pesoDescarte) || 0);
  return util > 0 ? util : 0;
}
function _precoPorKgDesgaste(s, itemId) {
  const util = _massaUtilPeca(s, itemId);
  return util > 0 ? _precoMatMoinho(s, itemId) / util : 0;
}
// Alguma linha tem quantidade lançada à mão para este item?
// 'fabrica' = você lança o total do mês e o sistema divide entre as linhas pela tonelagem.
// 'linha'   = você lança a quantidade de cada linha (caso da gaveta: 1 por linha).
// O modo é EXPLÍCITO e fica salvo — não muda sozinho por causa de valor deixado numa linha.
function _desgasteModo(s, itemId) {
  const cfg = (s.desgaste && s.desgaste[itemId]) || {};
  if (cfg.modo === 'linha' || cfg.modo === 'fabrica') return cfg.modo;
  return DESGASTE_MODO_LINHA_FIXO.includes(itemId) ? 'linha' : 'fabrica';
}
function setDesgasteModo(itemId, modo) {
  if (!state.desgaste) state.desgaste = JSON.parse(JSON.stringify(DESGASTE_PESOS_PADRAO));
  if (!state.desgaste[itemId]) state.desgaste[itemId] = { pesoNovo: 0, pesoDescarte: 0 };
  state.desgaste[itemId].modo = (modo === 'linha') ? 'linha' : 'fabrica';
  render();
}
// Quantidade (em peças) que cabe a ESTA linha.
function _qtdDesgasteDaLinha(s, itemId, bloco, info, tonTotalFabrica) {
  if (_desgasteModo(s, itemId) === 'linha') {
    if (!_blocoNoEscopo(s, itemId, bloco.id)) return 0; // linha fora do escopo não consome peça
    return (bloco.matMoinho && Number(bloco.matMoinho[itemId])) || 0;
  }
  // com escopo, a fatia de peças acompanha a fatia do valor (só as linhas marcadas dividem)
  if (_atribEscopoDe(s, itemId)) return _qtdFabricaDesgaste(s, itemId) * _fracaoBaseEscopo(s, itemId, bloco.id);
  // sem tonelagem no plano (metas ainda não lançadas / fábrica parada) as peças não
  // podem sumir da tela: divide igual entre as linhas, como o resto do rateio
  const nBlocos = (s && s.blocos && s.blocos.length) ? s.blocos.length : 1;
  // atenção: `info` é undefined quando a linha não produziu nada — isso é tonelada ZERO,
  // não motivo pra cair no plano B. O plano B só vale quando a FÁBRICA inteira zerou.
  const share = tonTotalFabrica > 0 ? ((info ? info.tonTotal : 0) / tonTotalFabrica) : 1 / nBlocos;
  return _qtdFabricaDesgaste(s, itemId) * share;
}
function _matMoinhoDaLinha(bloco, itemId, s, info, tonTotalFabrica) {
  return _qtdDesgasteDaLinha(s, itemId, bloco, info, tonTotalFabrica) * _precoMatMoinho(s, itemId);
}
// Atribuição usada só no modo 'linha' (soma das quantidades lançadas nas linhas).
function calcularAtribuicaoMatMoinho(s, tonPorBloco, itemId) {
  const tonTotal = Object.values(tonPorBloco).reduce((a, i) => a + i.tonTotal, 0);
  return calcularAtribuicaoPorBloco(s, tonPorBloco, (bloco) => _matMoinhoDaLinha(bloco, itemId, s, tonPorBloco[bloco.id], tonTotal));
}

// ---- BASE "POR PESSOA" (refeição, EPI): o valor é dividido pelo total de pessoas.
// Cada linha paga pelas SUAS pessoas + a parte dos administrativos, essa rateada por
// tonelagem (mesma régua do administrativo, pra não ter duas explicações diferentes).
function _headcountDaLinha(bloco) {
  const ids = new Set();
  (bloco.secoes || []).forEach((sec) => (sec.equipe || []).forEach((fid) => ids.add(fid)));
  return ids.size;
}
function _headcountTotalFabrica(s) {
  const ids = new Set();
  (s.blocos || []).forEach((b) => (b.secoes || []).forEach((sec) => (sec.equipe || []).forEach((fid) => ids.add(fid))));
  (s.equipeAdmin || []).forEach((fid) => ids.add(fid));
  return ids.size;
}
function calcularAtribuicaoPorPessoa(s, tonPorBloco, valorTotal) {
  const totalPessoas = _headcountTotalFabrica(s);
  const valorPorPessoa = totalPessoas > 0 ? (Number(valorTotal) || 0) / totalPessoas : 0;
  const nAdmin = (s.equipeAdmin || []).length;
  const tonTotal = Object.values(tonPorBloco).reduce((a, i) => a + i.tonTotal, 0);
  return calcularAtribuicaoPorBloco(s, tonPorBloco, (bloco) => {
    const info = tonPorBloco[bloco.id];
    const share = tonTotal > 0 && info ? info.tonTotal / tonTotal : 0;
    return valorPorPessoa * (_headcountDaLinha(bloco) + nAdmin * share);
  });
}
// Soma da folha dos administrativos (custo geral da fábrica).
function _custoTotalAdmin(s) {
  return (s.equipeAdmin || []).reduce((a, fid) => a + custoMensalFuncionario(fid, s.mes, s.ano), 0);
}
// Parte do administrativo que cabe a ESTA linha: proporcional à tonelagem dela.
function _adminDaLinhaPorTonelagem(r, info, s, bloco) {
  // com escopo configurado no administrativo, a parte da linha é a do escopo
  if (bloco && _atribEscopoDe(s, 'folha_admin')) return _valorEscopoDoBloco(s, 'folha_admin', bloco.id);
  const tonTotal = r.plano.tonelagem.tonTotal;
  const tonLinha = info ? info.tonTotal : 0;
  if (tonTotal > 0) return _custoTotalAdmin(s) * (tonLinha / tonTotal);
  // fábrica sem produção planejada: o administrativo não some — divide igual
  const nBlocos = (s && s.blocos && s.blocos.length) ? s.blocos.length : 0;
  return nBlocos > 0 ? _custoTotalAdmin(s) / nBlocos : 0;
}
function calcularCustoPorLinhaFisica(tonPorBloco, custoPorTon) {
  return Object.entries(tonPorBloco).map(([blocoId, info]) => {
    let custoTotal = 0;
    const porProduto = {};
    BUCKETS_CUSTO.forEach((b) => {
      const ton = info.tonPorBucket[b];
      if (ton > 1e-9) {
        const custo = ton * (custoPorTon[b] || 0);
        porProduto[b] = { ton, custo };
        custoTotal += custo;
      }
    });
    return { blocoId, linhaNome: info.linhaNome, tonTotal: info.tonTotal, custoTotal, custoPorTon: info.tonTotal > 0 ? custoTotal / info.tonTotal : 0, porProduto };
  });
}



function contarDiasTrabalho(calendario) {
  return Object.values(calendario || {}).filter((estado) => estado === 'trabalha' || estado === 'domingo-especial').length;
}
// Conta os dias ÚTEIS (que a fábrica trabalha) dentro de um intervalo de datas [inicio, fim],
// segundo o calendário do mês. Datas em formato 'YYYY-MM-DD'. Inclusivo nas duas pontas.
function contarDiasTrabalhoIntervalo(calendario, dataInicio, dataFim) {
  if (!dataInicio || !dataFim) return 0;
  let ini = dataInicio, fim = dataFim;
  if (ini > fim) { const tmp = ini; ini = fim; fim = tmp; } // tolera datas invertidas
  let count = 0;
  Object.entries(calendario || {}).forEach(([dateKey, estado]) => {
    if (dateKey >= ini && dateKey <= fim && (estado === 'trabalha' || estado === 'domingo-especial')) count++;
  });
  return count;
}

function calcularQuantidadeDireto(item, metas, tonelagem) {
  if (item.formulaQtd === 'manual') return Number(item.quantidadeManualEditado) || 0;
  const capacidade = (b) => (b === 'CAULIMGRANEL' ? (tonelagem.tonCAULIMGRANEL || 0) : (Number(metas[b]) || 0));
  switch (item.formulaQtd) {
    case 'direta': return capacidade(item.produtoBase);
    case 'pallet': {
      const sacos = Number(item.sacosPorPalletEditado) || 1;
      return capacidade(item.produtoBase) / sacos;
    }
    case 'mp_20': return (capacidade(item.produtoBase) * 20) / 1000;
    case 'mp_10': return (capacidade(item.produtoBase) * 10) / 1000;
    case 'mp_25': return (capacidade(item.produtoBase) * 25) / 1000;
    case 'mp_caulim_total': {
      const qtd25 = (capacidade('CAULIM25') * 25) / 1000;
      const qtdBigBag = capacidade('CAULIMBB'); // x1000kg ÷ 1000 = 1:1 (cada big bag = 1 tonelada de MP)
      const qtdGranel = tonelagem.tonCAULIMGRANEL || 0; // já em toneladas
      return qtd25 + qtdBigBag + qtdGranel;
    }
    default: return 0;
  }
}

function insumosParaEngine(insumos, atribFolha, atribAdmin, atribLenha, atribFiltroManga, s, metas, tonelagem, totalPalletsFabrica) {
  const diasPorMes = (s.refeicao.diasPorMes != null && s.refeicao.diasPorMes !== '') ? Number(s.refeicao.diasPorMes) : contarDiasTrabalho(s.calendario);
  return insumos.map((it) => {
    let item = it;
    if (item.tipoRateio === 'direto') { /* motor calcula a quantidade sozinho a partir de formulaQtd */ }
    else if (item.temPrecoQtd) item = { ...item, qtdBaseReal: item.fatorEditado * TONELAGEM_TOTAL_REAL_MAIO };
    else if (item.classificacao === 'FIXO') item = { ...item, valorMensal: item.valorMensalEditado };
    else item = { ...item, custoPorTon: item.custoPorTonEditado };

    if (item.id === 'mpcinza20' || item.id === 'mpcinza10' || item.id === 'mpcaulim') item = { ...item, precoUnitarioEditado: (Number(s.mpCinza.precoBase) || 0) + (Number(s.mpCinza.frete) || 0) };
    if (item.id === 'folha_mod' && atribFolha) {
      item = { ...item, valorTotalOverride: atribFolha.totalAtribuido };
      if (atribFolha.pctOverride) item = { ...item, pctOverride: atribFolha.pctOverride };
    }
    if (item.id === 'folha_admin') {
      // Administrativo é custo que a fábrica paga INDEPENDENTE de quantas linhas rodam.
      // Entra 100% do valor e o motor rateia por TONELAGEM (quem produziu mais, carrega mais).
      item = { ...item, valorTotalOverride: _custoTotalAdmin(s) };
    }
    if (item.id === 'lenha' && atribLenha) {
      item = { ...item, valorTotalOverride: atribLenha.totalAtribuido };
      if (atribLenha.pctOverride) item = { ...item, pctOverride: atribLenha.pctOverride };
    }
    if (item.id === 'filtromanga' && atribFiltroManga) {
      item = { ...item, valorTotalOverride: atribFiltroManga.totalAtribuido };
      if (atribFiltroManga.pctOverride) item = { ...item, pctOverride: atribFiltroManga.pctOverride };
    }
    if (item.id === 'arrend') {
      // Arrendamento: grupos de rateio — cada grupo divide seu valor entre as linhas escolhidas.
      const atrib = s._atribArrend;
      if (atrib) {
        item = { ...item, valorTotalOverride: atrib.totalAtribuido };
        if (atrib.pctOverride) item = { ...item, pctOverride: atrib.pctOverride };
      }
    }
    if (item.id === 'refeicao' && atribFolha) {
      // 1 refeição por pessoa por dia útil. Base POR PESSOA (não por tonelagem):
      // a linha paga pelas suas pessoas + a parte dos administrativos.
      const total = (atribFolha.headcountAlocado || 0) * diasPorMes * (Number(s.refeicao.valorPorMarmita) || 0);
      const atribPessoa = calcularAtribuicaoPorPessoa(s, s._tonPorBlocoCache || {}, total);
      item = { ...item, valorTotalOverride: total };
      if (atribPessoa && atribPessoa.pctOverride) item = { ...item, pctOverride: atribPessoa.pctOverride };
    }
    if (item.id === 'valealim' && atribFolha && atribAdmin) {
      // % sobre a folha da linha + % sobre o administrativo INTEIRO (ele entra cheio na conta).
      // O motor rateia esse total por tonelagem, igual ao próprio administrativo.
      const total = (atribFolha.totalAtribuido + _custoTotalAdmin(s)) * ((Number(s.cartaoAlimentacao.percentualSobreSalario) || 0) / 100);
      item = { ...item, valorTotalOverride: total };
    }
    if (item.id === 'stretch') {
      // Plástico stretch segue o PALLET, não a tonelagem: linha que não paletiza não paga.
      const total = (Number(totalPalletsFabrica) || 0) * (Number(s.stretch.gramasPorPallet) || 0) * (Number(s.stretch.precoPorGrama) || 0);
      item = { ...item, valorTotalOverride: total };
      const atribStr = s._atribStretch;
      if (atribStr && atribStr.pctOverride) item = { ...item, pctOverride: atribStr.pctOverride };
    }
    if (item.id === 'epi') {
      // EPI: valor do mês dividido POR PESSOA (é gente que usa EPI, não tonelada).
      const totalEpi = totalItensMultiplos('epi');
      const atribEpi = calcularAtribuicaoPorPessoa(s, s._tonPorBlocoCache || {}, totalEpi);
      item = { ...item, valorTotalOverride: totalEpi };
      if (atribEpi && atribEpi.pctOverride) item = { ...item, pctOverride: atribEpi.pctOverride };
    }
    if (item.id === 'adm_geral') item = { ...item, valorTotalOverride: totalItensMultiplos('adm_geral') };
    if (item.id === 'matconsumo') item = { ...item, valorTotalOverride: totalItensMultiplos('limpeza') };
    if (item.id === 'energia') {
      // Energia: grupos de rateio — cada grupo divide seu valor entre as linhas escolhidas.
      const atrib = s._atribEnergia;
      if (atrib) {
        item = { ...item, valorTotalOverride: atrib.totalAtribuido };
        if (atrib.pctOverride) item = { ...item, pctOverride: atrib.pctOverride };
      }
    }
    if (MATMOINHO_IDS.includes(item.id) && _desgasteModo(s, item.id) === 'linha') {
      // Quantidade lançada POR LINHA (gaveta, ou quando você digita a quantidade de alguma linha):
      // o total do item passa a ser a soma das linhas.
      const atrib = s._atribMatMoinho && s._atribMatMoinho[item.id];
      if (atrib) {
        item = { ...item, valorTotalOverride: atrib.totalAtribuido };
        if (atrib.pctOverride) item = { ...item, pctOverride: atrib.pctOverride };
      }
    }
    if (item.especial && item.valorOverrideManual != null) {
      // sobrescreve o cálculo automático com o valor que a pessoa arbitrou — cai no
      // rateio normal por tonelagem (a menos que também tenha % manual configurada)
      item = { ...item, valorTotalOverride: item.valorOverrideManual, pctOverride: undefined };
    }
    // ESCOPO DE LINHAS + GRUPOS EXTRA: substitui o rateio deste item pelo do escopo —
    // linha de fora recebe zero, o valor se redistribui entre as que ficaram e os grupos
    // extra somam por cima. Só age quando existe escopo configurado pro item.
    const atribEscopo = s._atribEscopo && s._atribEscopo[item.id];
    if (atribEscopo) {
      item = { ...item, valorTotalOverride: atribEscopo.totalAtribuido, pctOverride: atribEscopo.pctOverride || undefined };
    }
    // % manual por produto tem prioridade sobre qualquer rateio automático (inclusive os
    // acima) — tanto serve pra ajustar (ex.: Diesel em %) quanto pra "excluir" um item de
    // um produto específico (basta zerar a % daquele produto).
    if (item.pctManual) {
      const somaManual = BUCKETS_CUSTO.reduce((a, b) => a + (Number(item.pctManual[b]) || 0), 0);
      const pctOverride = {};
      BUCKETS_CUSTO.forEach((b) => { pctOverride[b] = somaManual > 0 ? (Number(item.pctManual[b]) || 0) / somaManual : 0; });
      item = { ...item, pctOverride };
    }
    return item;
  });
}

// Recalcula o plano como se nenhuma simulação rápida estivesse ativa (todos os turnos
// "ligados" e sem redução) — usado pra comparar Planejado x Ajustado na aba Impacto.
function computarSemSimulacao(s) {
  const snapshot = [];
  (s.blocos || []).forEach((bloco) => {
    (bloco.secoes || []).forEach((secao) => {
      snapshot.push({ secao, simuladoDesligado: secao.simuladoDesligado, simuladoReducaoPct: secao.simuladoReducaoPct, simuladoDiasParados: secao.simuladoDiasParados, simuladoHorasReduzidas: secao.simuladoHorasReduzidas, simuladoParadaInicio: secao.simuladoParadaInicio, simuladoParadaFim: secao.simuladoParadaFim });
      secao.simuladoDesligado = false;
      secao.simuladoReducaoPct = 0;
      secao.simuladoDiasParados = 0;
      secao.simuladoHorasReduzidas = 0;
      secao.simuladoParadaInicio = null;
      secao.simuladoParadaFim = null;
    });
  });
  const resultado = computar(s);
  snapshot.forEach(({ secao, simuladoDesligado, simuladoReducaoPct, simuladoDiasParados, simuladoHorasReduzidas, simuladoParadaInicio, simuladoParadaFim }) => {
    secao.simuladoDesligado = simuladoDesligado;
    secao.simuladoReducaoPct = simuladoReducaoPct;
    secao.simuladoDiasParados = simuladoDiasParados;
    secao.simuladoHorasReduzidas = simuladoHorasReduzidas;
    secao.simuladoParadaInicio = simuladoParadaInicio;
    secao.simuladoParadaFim = simuladoParadaFim;
  });
  return resultado;
}

function computar(s) {
  const producao = agregarProducaoPlanejada(s);
  const metas = producao.metas;
  const tonelagemPreCalc = calcularTonelagem(metas, s.pesos);
  const tonPorBloco = calcularTonelagemPorBloco(s, producao.detalhes);
  const atribFolha = calcularAtribuicaoFolha(s, tonPorBloco);
  const atribAdmin = calcularAtribuicaoAdmin(s);
  const atribLenha = calcularAtribuicaoLenha(s, tonPorBloco);
  const atribFiltroManga = calcularAtribuicaoFiltroManga(s, tonPorBloco);
  const atribArrend = calcularAtribuicaoGrupos(s, tonPorBloco, s.arrendamento, 'arrend');
  const atribEnergia = calcularAtribuicaoGrupos(s, tonPorBloco, s.energia, 'energia');
  s._atribArrend = atribArrend; s._atribEnergia = atribEnergia; // cache pro insumosParaEngine
  s._tonPorBlocoCache = tonPorBloco; // usado pelas bases "por pessoa" (refeição, EPI)
  // stretch: rateado pelos PALLETS de cada linha (quem não paletiza não paga)
  s._atribStretch = calcularAtribuicaoStretch(s, producao);
  s._producaoCache = producao; // usado pelo valor/quantidade de stretch por linha
  s._atribMatMoinho = {}; MATMOINHO_IDS.forEach((id) => { s._atribMatMoinho[id] = calcularAtribuicaoMatMoinho(s, tonPorBloco, id); });
  // ESCOPO DE LINHAS + GRUPOS EXTRA: só entra pros itens com escopo configurado. Sem
  // configuração o item nem aparece neste cache e segue o cálculo de sempre.
  const _diasPorMesEsc = (s.refeicao.diasPorMes != null && s.refeicao.diasPorMes !== '') ? Number(s.refeicao.diasPorMes) : contarDiasTrabalho(s.calendario);
  const _ctxEsc = { diasPorMes: _diasPorMesEsc, headcountAlocado: atribFolha.headcountAlocado, folhaTotal: atribFolha.totalAtribuido };
  s._atribEscopo = {};
  ESCOPO_IDS.forEach((id) => {
    if (!_escopoAtivo(s, id)) return;
    const itemEsc = (s.insumos || []).find((x) => x.id === id);
    if (!itemEsc || itemEsc.removido) return;
    s._atribEscopo[id] = calcularAtribuicaoEscopo(s, tonPorBloco, id, _valorBaseEscopo(s, itemEsc, tonelagemPreCalc, _ctxEsc));
  });
  const totalPalletsFabrica = s.insumos.filter((it) => it.tipoRateio === 'direto' && it.formulaQtd === 'pallet' && !it.removido)
    .reduce((a, it) => a + calcularQuantidadeDireto(it, metas, tonelagemPreCalc), 0);
  s._ultimoTotalPallets = totalPalletsFabrica; // cache pra exibição (tabela mostra qtd de pallets sem precisar recomputar tudo)
  const insumosEngine = insumosParaEngine(s.insumos, atribFolha, atribAdmin, atribLenha, atribFiltroManga, s, metas, tonelagemPreCalc, totalPalletsFabrica).filter((it) => !it.removido);
  const plano = calcularPlanoCompleto(insumosEngine, metas, s.pesos);
  const custoPorLinhaFisica = calcularCustoPorLinhaFisica(tonPorBloco, plano.custoPorTon);
  const sensibilidade = calcularSensibilidade(plano.resultadosItens, 10);

  const alertasConsumo = [];


  const custoVariavelPorUnidade = {};
  BUCKETS_CUSTO.forEach((b) => {
    const q = b === 'CAULIMGRANEL' ? plano.tonelagem.tonCAULIMGRANEL : metas[b];
    custoVariavelPorUnidade[b] = q > 0 ? plano.porClassificacao[b].VARIAVEL / q : 0;
  });

  // preço de venda: se a pessoa digitou um preço manual pra essa linha, usa ele;
  // senão sugere automaticamente = custo variável ÷ (1 − margem de contribuição).
  const precoVenda = {}; const margem = {}; const pe = {};
  BUCKETS_CUSTO.forEach((b) => {
    const manual = s.precoVendaManual && s.precoVendaManual[b];
    precoVenda[b] = (manual != null) ? manual : precoSugerido(custoVariavelPorUnidade[b], s.margemAlvo[b]);
    margem[b] = margemContribuicao(precoVenda[b], custoVariavelPorUnidade[b]);
    pe[b] = pontoDeEquilibrio(plano.porClassificacao[b].FIXO, margem[b].margemRS);
  });

  const faturamentoAutomatico = BUCKETS_CUSTO.reduce((a, b) => {
    const q = b === 'CAULIMGRANEL' ? plano.tonelagem.tonCAULIMGRANEL : metas[b];
    return a + q * precoVenda[b];
  }, 0);
  const faturamentoCalculado = s.faturamentoManual.ativo ? (Number(s.faturamentoManual.valor) || 0) : faturamentoAutomatico;
  const custoSobreFaturamento = faturamentoCalculado > 0 ? plano.totais.GERAL / faturamentoCalculado : 0;
  const alvo = { metaPct: s.alvoMaximoPct / 100, atualPct: custoSobreFaturamento, dentroDoAlvo: custoSobreFaturamento <= s.alvoMaximoPct / 100 };

  return { metas, producao, plano, custoVariavelPorUnidade, precoVenda, margem, pontoEquilibrio: pe, faturamentoCalculado, faturamentoAutomatico, custoSobreFaturamento, alvo, tonPorBloco, atribFolha, atribAdmin, atribLenha, atribFiltroManga, custoPorLinhaFisica, sensibilidade, alertasConsumo };
}

/* ---------------------------------- utilidades ---------------------------------- */

function arred(v, dec) { const f = Math.pow(10, dec); return Math.round((v + Number.EPSILON) * f) / f; }
function fmtBRL(v) { if (v == null || !isFinite(v)) return '—'; return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
function fmtNum(v, dec) { if (v == null || !isFinite(v)) return '—'; return Number(v).toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
function fmtPct(v, dec) { if (v == null || !isFinite(v)) return '—'; return (Number(v) * 100).toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + '%'; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
/* O `.alert` do css/style.css é `display:flex`, então cada elemento do conteúdo
   virava uma COLUNA — uma frase com <strong> no meio saía picotada em blocos.
   Envolver num único <div> devolve o texto a um fluxo só. */
function alertBox(status, html) {
  // Apelidos: a aba Custos & Resultado chamava com 'sucesso'/'perigo', que não existiam
  // no mapa e caíam no fallback amarelo — alerta crítico saía com cor de aviso.
  const cls = { ok: 'alert-success', sucesso: 'alert-success', atencao: 'alert-warning',
    critico: 'alert-danger', perigo: 'alert-danger' }[status] || 'alert-warning';
  return `<div class="alert ${cls}"><div style="flex:1;min-width:0;line-height:1.55;">${html}</div></div>`;
}

/* ------------------------------------ ações: navegação ------------------------------------ */

function showTab(tab) {
  if (typeof guardTab === 'function' && !guardTab(MODULO_ID, tab)) return;
  state.tab = tab;
  ['config', 'metas', 'linha', 'custos', 'impacto', 'geral'].forEach((t) => {
    const btn = document.getElementById('tbtn-' + t);
    if (btn) btn.classList.toggle('active', t === tab);
  });
  render();
}

/* ------------------------------------ ações: calendário ------------------------------------ */

function setMesAno(campo, valor) {
  state[campo] = Number(valor);
  state.calendario = gerarCalendarioMes(state.ano, state.mes, state.feriadosLocais, state.calendario);
  render();
}
function toggleDiaCalendario(dateKey) {
  const dow = new Date(dateKey + 'T12:00:00').getDay();
  const atual = state.calendario[dateKey] || 'trabalha';
  const feriadosNac = getFeriadosNacionais(state.ano, state.mes);
  const dia = Number(dateKey.split('-')[2]);
  const isFeriado = feriadosNac.some((f) => f.dia === dia) || state.feriadosLocais.some((f) => f.dia === dia);
  // a regra do ciclo mora em proximoEstadoDia (motor). Tinha uma cópia dela aqui:
  // duas versões da mesma regra é meio caminho pra elas divergirem em silêncio.
  state.calendario[dateKey] = proximoEstadoDia(atual, dow === 0, isFeriado);
  render();
}
function setHorasDomingoEspecial(valor) { state.horasDomingoEspecial = Number(valor); render(); }
function marcarTodosDias(trabalha) {
  const feriadosNac = getFeriadosNacionais(state.ano, state.mes);
  const feriadosDias = new Set([...feriadosNac.map((f) => f.dia), ...state.feriadosLocais.map((f) => f.dia)]);
  const totalDias = diasDoMes(state.ano, state.mes);
  for (let d = 1; d <= totalDias; d++) {
    const dateKey = `${state.ano}-${String(state.mes).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    if (feriadosDias.has(d)) { state.calendario[dateKey] = 'feriado'; continue; }
    state.calendario[dateKey] = trabalha ? 'trabalha' : 'folga';
  }
  render();
}

/* ------------------------------------ ações: blocos / seções / produtos ------------------------------------ */

function addBloco() {
  state._blocoSeq++;
  state.blocos.push({ id: 'bloco' + state._blocoSeq, linhaNome: '', filtroMangaQuantidade: 0, matMoinho: { martelo: 0, gaveta: 0, grelha: 0, eixos: 0 }, secoes: [] });
  render();
}
function removeBloco(blocoId) { state.blocos = state.blocos.filter((b) => b.id !== blocoId); _limparEscoposDeBloco(blocoId); render(); }
function setBlocoLinha(blocoId, nomeLinha) {
  const b = state.blocos.find((x) => x.id === blocoId); if (!b) return;
  b.linhaNome = nomeLinha;
  const produtosDaLinha = produtosDisponiveisDaLinha(nomeLinha);
  produtosDaLinha.forEach((p) => garantirMapaProduto(p.nome));
  b.secoes.forEach((secao) => { secao.produtos = produtosDaLinha.map((p) => novoProdutoSecao(p)); });
  render();
}
function novoProdutoSecao(p) {
  state._produtoSeq++;
  return { id: 'prod' + state._produtoSeq, nome: p.nome, capHora: Number(p.capHora) || 0, unidade: p.unidade || 'un', demanda: 0, qtdManual: null, ativo: true };
}
function addSecao(blocoId) {
  const b = state.blocos.find((x) => x.id === blocoId); if (!b) return;
  state._secaoSeq++;
  const produtosDaLinha = produtosDisponiveisDaLinha(b.linhaNome);
  b.secoes.push({ id: 'secao' + state._secaoSeq, turnoNome: '', eficiencia: 85, extras: 0, equipe: [], paradas: [], simuladoDesligado: false, simuladoReducaoPct: 0, simuladoDiasParados: 0, simuladoHorasReduzidas: 0, lenhaM3PorTurno: 3, produtos: produtosDaLinha.map((p) => novoProdutoSecao(p)) });
  render();
}
function removeSecao(blocoId, secaoId) {
  const b = state.blocos.find((x) => x.id === blocoId); if (!b) return;
  b.secoes = b.secoes.filter((s) => s.id !== secaoId);
  render();
}
function _acharSecao(blocoId, secaoId) {
  const b = state.blocos.find((x) => x.id === blocoId); if (!b) return null;
  return b.secoes.find((s) => s.id === secaoId) || null;
}
/* Turno repetido na MESMA linha contaria as horas do mesmo turno físico duas
   vezes e dobraria a capacidade da linha em silêncio. Por isso a troca é
   recusada com aviso — e planos antigos que já tenham a duplicata mostram
   alerta vermelho no próprio turno (ver renderSecao). */
function _turnoJaNaLinha(bloco, secaoId, turnoNome) {
  const nome = (turnoNome || '').trim();
  if (!nome || !bloco) return false;
  return (bloco.secoes || []).some((x) => x.id !== secaoId && (x.turnoNome || '').trim() === nome);
}
function setSecaoTurno(blocoId, secaoId, turnoNome) {
  const b = state.blocos.find((x) => x.id === blocoId); if (!b) return;
  const s = (b.secoes || []).find((x) => x.id === secaoId); if (!s) return;
  const nome = (turnoNome || '').trim();
  if (_turnoJaNaLinha(b, secaoId, nome)) {
    if (typeof toast === 'function') toast(`"${nome}" já está nesta linha. Dois turnos iguais somariam as mesmas horas duas vezes e dobrariam a capacidade — escolha outro turno.`, 'warning');
    render();   // devolve o seletor ao valor anterior
    return;
  }
  s.turnoNome = nome;
  render();
}
/* Duplicar turno: copia a configuração (eficiência, h.extra, lenha, paradas,
   produtos e simulação) e deixa em branco só o que TEM de ser diferente —
   o turno (repetido dobraria a linha) e a equipe (cada turno tem a sua gente). */
function duplicarSecao(blocoId, secaoId) {
  const b = state.blocos.find((x) => x.id === blocoId); if (!b) return;
  const orig = (b.secoes || []).find((x) => x.id === secaoId); if (!orig) return;
  state._secaoSeq++;
  const copia = JSON.parse(JSON.stringify(orig));
  copia.id = 'secao' + state._secaoSeq;
  copia.turnoNome = '';
  copia.equipe = [];
  copia.produtos = (orig.produtos || []).map((prod) => {
    state._produtoSeq++;
    return { ...JSON.parse(JSON.stringify(prod)), id: 'prod' + state._produtoSeq };
  });
  b.secoes.splice(b.secoes.findIndex((x) => x.id === secaoId) + 1, 0, copia);
  render();
  if (typeof toast === 'function') toast('Turno duplicado — escolha o turno e monte a equipe dele.', 'success');
}
/* Simulação rápida: fica FECHADA por padrão pra ganhar espaço. Se o turno tiver
   qualquer simulação ligada, o botão mostra "ativa" e o painel abre sozinho —
   simulação escondida mexendo no número seria pegadinha. O estado de aberto/fechado
   fica na própria seção, então acompanha o plano salvo. */
function _simAtiva(secao) {
  return !!(secao && (secao.simuladoDesligado || Number(secao.simuladoReducaoPct) > 0
    || Number(secao.simuladoDiasParados) > 0 || Number(secao.simuladoHorasReduzidas) > 0));
}
function _simAberta(secao) {
  if (!secao) return false;
  if (secao.simAberta === undefined) return _simAtiva(secao);   // ativa → abre; senão fecha
  return !!secao.simAberta;
}
function toggleSimAberta(blocoId, secaoId) {
  const s = _acharSecao(blocoId, secaoId); if (!s) return;
  s.simAberta = !_simAberta(s);
  render();
}
function ajustarEficSecao(blocoId, secaoId, delta) { const s = _acharSecao(blocoId, secaoId); if (!s) return; s.eficiencia = Math.min(100, Math.max(1, s.eficiencia + delta)); render(); }
function setEficSecao(blocoId, secaoId, v) { const s = _acharSecao(blocoId, secaoId); if (!s) return; const n = Math.round(Number(v)); s.eficiencia = isFinite(n) ? Math.min(100, Math.max(1, n)) : s.eficiencia; render(); }
function ajustarExtrasSecao(blocoId, secaoId, delta) { const s = _acharSecao(blocoId, secaoId); if (!s) return; s.extras = Math.max(0, Math.round((s.extras + delta) * 10) / 10); render(); }
function addFuncionarioSecao(blocoId, secaoId, funcionarioId) {
  const s = _acharSecao(blocoId, secaoId); if (!s || !funcionarioId) return;
  if (!s.equipe) s.equipe = [];
  if (!s.equipe.includes(funcionarioId)) s.equipe.push(funcionarioId);
  render();
}
function removeFuncionarioSecao(blocoId, secaoId, funcionarioId) {
  const s = _acharSecao(blocoId, secaoId); if (!s) return;
  s.equipe = (s.equipe || []).filter((id) => id !== funcionarioId);
  render();
}
function addFuncionarioAdmin(funcionarioId) {
  if (!funcionarioId) return;
  if (!state.equipeAdmin.includes(funcionarioId)) state.equipeAdmin.push(funcionarioId);
  render();
}
function removeFuncionarioAdmin(funcionarioId) { state.equipeAdmin = state.equipeAdmin.filter((id) => id !== funcionarioId); render(); }
function addParada(blocoId, secaoId) { const s = _acharSecao(blocoId, secaoId); if (!s) return; s.paradas.push({ motivo: '', horas: 0 }); render(); }
function removeParada(blocoId, secaoId, idx) { const s = _acharSecao(blocoId, secaoId); if (!s) return; s.paradas.splice(idx, 1); render(); }
function setParadaCampo(blocoId, secaoId, idx, campo, valor) { const s = _acharSecao(blocoId, secaoId); if (!s) return; s.paradas[idx][campo] = campo === 'horas' ? Number(valor) : valor; render(); }
function setProdutoCampo(blocoId, secaoId, produtoId, campo, valor) {
  const s = _acharSecao(blocoId, secaoId); if (!s) return;

  if (campo === 'qtdManual') p.qtdManual = valor === '' ? null : Number(valor);
  else p[campo] = Number(valor);
  render();
}
function fecharProdutoSecao(blocoId, secaoId, produtoId) {

}
function reabrirProdutoSecao(blocoId, secaoId, produtoId) {
  const s = _acharSecao(blocoId, secaoId); if (!s) return;

}

/* ---- ESCOPO DE LINHAS + GRUPOS EXTRA: um único código pros itens de ESCOPO_IDS ---- */
function _garantirEscopo(itemId) {
  if (!state.escopos || typeof state.escopos !== 'object') state.escopos = {};
  if (!state.escopos[itemId]) state.escopos[itemId] = { blocoIds: null, grupos: [] };
  const e = state.escopos[itemId];
  if (!Array.isArray(e.grupos)) e.grupos = [];
  return e;
}
function toggleEscopoBloco(itemId, blocoId, incluir) {
  const e = _garantirEscopo(itemId);
  // "todas as linhas" (null) precisa virar lista concreta antes de desmarcar uma
  if (!Array.isArray(e.blocoIds)) e.blocoIds = (state.blocos || []).map((b) => b.id);
  if (incluir) { if (!e.blocoIds.includes(blocoId)) e.blocoIds.push(blocoId); }
  else e.blocoIds = e.blocoIds.filter((id) => id !== blocoId);
  // marcou todas de novo: volta pro padrão (null) pra linha nova já entrar automaticamente
  const todasIds = (state.blocos || []).map((b) => b.id);
  if (todasIds.length && todasIds.every((id) => e.blocoIds.includes(id))) e.blocoIds = null;
  render();
}
function marcarTodasLinhasEscopo(itemId) {
  const e = _garantirEscopo(itemId);
  e.blocoIds = null; // null = todas (e linha criada depois já entra)
  render();
}
function adicionarGrupoEscopo(itemId) {
  const e = _garantirEscopo(itemId);
  e.grupos.push({ id: 'ge' + Date.now() + Math.floor(Math.random() * 1000), nome: 'Grupo ' + (e.grupos.length + 1), valor: 0, blocoIds: [] });
  render();
}
function removerGrupoEscopo(itemId, grupoId) {
  const e = _garantirEscopo(itemId);
  e.grupos = e.grupos.filter((g) => g.id !== grupoId);

}
function _grupoEscopo(itemId, grupoId) { return _garantirEscopo(itemId).grupos.find((g) => g.id === grupoId); }
function setGrupoEscopoNome(itemId, grupoId, nome) {
  const g = _grupoEscopo(itemId, grupoId);

}
function setGrupoEscopoValor(itemId, grupoId, valor) { const g = _grupoEscopo(itemId, grupoId); if (g) g.valor = parseNumeroBR(valor); }
function setGrupoEscopoValorRender(itemId, grupoId, valor) { setGrupoEscopoValor(itemId, grupoId, valor); render(); }
function toggleGrupoEscopoBloco(itemId, grupoId, blocoId, incluir) {
  const g = _grupoEscopo(itemId, grupoId); if (!g) return;
  if (!Array.isArray(g.blocoIds)) g.blocoIds = [];
  if (incluir) { if (!g.blocoIds.includes(blocoId)) g.blocoIds.push(blocoId); }
  else g.blocoIds = g.blocoIds.filter((id) => id !== blocoId);
  render();
}
// Limpa referências a uma linha apagada (senão o escopo ficaria preso num bloco que não existe).
function _limparEscoposDeBloco(blocoId) {
  const mapa = state.escopos || {};
  Object.keys(mapa).forEach((itemId) => {
    const e = mapa[itemId];
    if (!e) return;
    if (Array.isArray(e.blocoIds)) {
      e.blocoIds = e.blocoIds.filter((id) => id !== blocoId);
      if (!e.blocoIds.length) e.blocoIds = null; // sem nenhuma linha marcada: volta pra todas
    }
    if (Array.isArray(e.grupos)) {
      e.grupos.forEach((g) => { g.blocoIds = (g.blocoIds || []).filter((id) => id !== blocoId); });
      e.grupos = e.grupos.filter((g) => (g.blocoIds || []).length > 0);
    }
    if (e.blocoIds === null && (!e.grupos || !e.grupos.length)) delete mapa[itemId];
  });
}

}

function _avisoProporcaoEixos(itemId) {
  if (itemId !== 'eixos' && itemId !== 'martelo') return '';
  const qtdMartelo = _qtdFabricaDesgaste(state, 'martelo');
  const qtdEixos = _qtdFabricaDesgaste(state, 'eixos');
  if (qtdMartelo <= 0 || qtdEixos <= 0) return '';
  const esperado = qtdMartelo / 3; // 6 martelos : 2 eixos
  const desvio = Math.abs(qtdEixos - esperado) / esperado;
  if (desvio <= 0.2) return '';
  return `<div class="badge badge-warning" style="margin-top:6px;display:inline-block;">⚠️ Conferir: para ${fmtNum(qtdMartelo, 0)} martelos, a proporção 6:2 daria ~${fmtNum(esperado, 0)} eixos (lançado: ${fmtNum(qtdEixos, 0)}).</div>`;
}

/* Coluna com dado alinhado à direita precisa de cabeçalho alinhado à direita.
   Sem isso o número da coluna 1 encosta no título da coluna 2 e a leitura engana —
   parece que o valor pertence à coluna seguinte. Em vez de marcar 30 `<th>` na mão
   (e esquecer os próximos), o alinhamento do cabeçalho é espelhado do corpo:
   se a célula i do corpo é `cp-num`/`num`, o cabeçalho i vai pra direita.
   Vale pra tela e pras janelas de impressão. */
function alinharCabecalhosNumericos(raiz) {
  if (!raiz || typeof raiz.querySelectorAll !== 'function') return;
  const ehNum = (el) => /(^|\s)(cp-num|num)(\s|$)/.test((el && el.className) || '');
  raiz.querySelectorAll('table').forEach((t) => {
    const ths = t.querySelectorAll('thead th');
    if (!ths.length) return;
    // Percorre TODAS as linhas somando colspan, em vez de exigir uma linha com o mesmo
    // número de células do cabeçalho. Tabelas em que toda linha tem colspan — como a de
    // Repasse necessário, onde o selo "margem preservada" ocupa 3 colunas — ficavam de
    // fora e o cabeçalho continuava à esquerda enquanto o número ia pra direita.
    const direita = new Array(ths.length).fill(false);
    t.querySelectorAll('tbody tr').forEach((tr) => {
      let col = 0;
      for (let i = 0; i < tr.children.length && col < ths.length; i++) {
        const cel = tr.children[i];
        const span = Math.max(1, parseInt(cel.getAttribute('colspan') || '1', 10) || 1);
        if (span === 1 && ehNum(cel)) direita[col] = true;   // célula mesclada não decide coluna
        col += span;
      }
    });
    for (let i = 0; i < ths.length; i++) if (direita[i]) ths[i].style.textAlign = 'right';
  });
}

/* A simulação de capacidade mora em state.blocos[].secoes[] e o render() de TODAS as
   abas usa computar(state) — ou seja, um turno deixado desligado na aba Impacto muda o
   número da Custos & Resultado, da Geral e do topo, sem nada na tela dizendo isso.
   Este aviso aparece em todas as abas enquanto houver simulação ligada. */
function _secoesSimuladas() {
  const lista = [];
  (state.blocos || []).forEach((b) => (b.secoes || []).forEach((sec) => {
    if (typeof _impSecaoSimulada === 'function' && _impSecaoSimulada(sec)) {
      lista.push(`${b.linhaNome || 'linha'} · ${sec.turnoNome || 'turno'}`);
    }
  }));
  return lista;
}
/* O `estado` de um planejamento NÃO guarda a folha de pagamento nem o cadastro de
   funcionários — o recálculo de hoje usa o que está no banco AGORA. Um plano aprovado
   mês passado pode abrir com outro número, em silêncio. Esta trava compara o total
   recalculado com o que ficou gravado na coluna `totais` e avisa quando divergirem.
   Só compara o PLANEJADO (sem simulação), senão a simulação dispararia o aviso à toa. */
function _avisoPlanoDivergente() {
  const grav = state._totaisGravados;
  if (!grav || !(Number(grav.total) > 0)) return '';
  let atual;
  try { atual = computarSemSimulacao(state).plano.totais.GERAL; } catch (e) { return ''; }
  const dif = atual - Number(grav.total);
  if (Math.abs(dif) < 0.02) return '';
  const pct = Math.abs(dif) / Number(grav.total);
  const quando = state._gravadoEm ? new Date(state._gravadoEm).toLocaleDateString('pt-BR') : null;
  return alertBox(pct > 0.02 ? 'critico' : 'atencao', `📌 <strong>Este plano recalcula diferente do que foi gravado.</strong>
    Gravado${quando ? ' em ' + quando : ''}: <strong>${fmtBRL(Number(grav.total))}</strong> · recalculado agora: <strong>${fmtBRL(atual)}</strong> ·
    diferença de <strong>${fmtBRL(dif)}</strong> (${fmtPct(dif / Number(grav.total), 2)}).
    O planejamento guarda a configuração, mas <strong>não guarda a folha nem o cadastro de funcionários</strong> — estes vêm do banco e podem ter mudado desde então.
    Confira antes de usar este número, e salve de novo se o recalculado for o correto.`);
}
function _avisoSimulacaoAtiva() {
  const sims = _secoesSimuladas();
  if (!sims.length) return '';
  return alertBox('atencao', `🧪 <strong>Simulação de capacidade ligada</strong> em ${sims.length} turno(s): ${esc(sims.join(', '))}. Todos os números desta tela — custo, custo por tonelada, alvo e margem — estão <strong>com a simulação aplicada</strong>, não com o planejado. <button class="btn btn-ghost btn-sm" style="margin-left:6px;" onclick="impZerarTudo()">↺ Voltar ao planejado</button>`);
