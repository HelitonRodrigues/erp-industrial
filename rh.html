<script>
/* ══════════════════════════════════════════════════════════════════════════
   ESCALAS — só leitura. Quem monta é o escala.html; aqui o RH visualiza a
   escala montada e imprime. O desenho da escalação (fichas, turnos, banco) é
   PORTADO do escala.html de propósito, para o papel sair idêntico ao que a
   fábrica já conhece — se eu inventasse outro layout aqui, existiriam duas
   escalas diferentes com o mesmo nome.
   ══════════════════════════════════════════════════════════════════════════ */
let _escalas = [], _escCarregado = false, _escFiltro = '', _escStatus = '';
let _escFuncionarios = [], _escEmpresa = {}, _escTurnos = [], _escFotoMap = { id: {}, cpf: {}, nome: {}, email: {} };
let _escVendo = null;

fetch('partials/sidebar.html').then(r=>r.text()).then(html=>{
  document.getElementById('sidebar-container').innerHTML=html;
  document.querySelector('[href="rh.html"]')?.classList.add('active');
  openGroup('rh');
});
initSidebar('rh.html');

function escEsc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escNorm(s) { return (s || '').toString().trim().toLowerCase(); }

/* ─── helpers portados do escala.html (mesma regra, mesmo desenho) ─── */
const TIPO_AUSENCIA = { afastamento: 'Afastamento', licenca: 'Licença médica', folga: 'Folga' };
const _CORES = ['#0E3B62', '#2563eb', '#7c3aed', '#db2777', '#ea580c', '#16a34a', '#0891b2', '#9333ea', '#dc2626', '#0d9488'];

function temT2(e) {
  const t = e && e.turno2;
  return !!(t && (t.encarregado || t.operador || (t.linhas || []).length ||
    (t.limpeza || []).length || (t.ferias || []).length || (t.ausencias || []).length || t.turno_id));
}
/* HORÁRIO DO TURNO — vem de turnos.html, no `calendario` (um início/fim por dia
   da semana). Quase sempre a semana inteira tem a mesma faixa; quando não tem
   (o Administrativo sai mais cedo no sábado), mostro cada faixa com os dias a
   que ela pertence, em vez de escolher uma e mentir sobre as outras. */
const _DIAS_ORDEM = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
const _DIAS_CURTO = { Segunda: 'Seg', 'Terça': 'Ter', Quarta: 'Qua', Quinta: 'Qui', Sexta: 'Sex', 'Sábado': 'Sáb', Domingo: 'Dom' };
function horarioDoTurno(turnoIdOuNome) {
  const t = _escTurnos.find((x) => String(x.id) === String(turnoIdOuNome))
        || _escTurnos.find((x) => escNorm(x.nome) === escNorm(turnoIdOuNome));
  const cal = t && t.calendario;
  if (!cal) return '';
  const faixas = new Map();
  _DIAS_ORDEM.forEach((d) => {
    const c = cal[d];
    if (!c || c.ativo === false || !c.inicio || !c.fim) return;
    const chave = `${c.inicio} às ${c.fim}`;
    if (!faixas.has(chave)) faixas.set(chave, []);
    faixas.get(chave).push(_DIAS_CURTO[d] || d);
  });
  if (!faixas.size) return '';
  if (faixas.size === 1) return [...faixas.keys()][0];
  return [...faixas.entries()].map(([h, dias]) => `${dias.join('/')} ${h}`).join(' · ');
}

function iniciais(nome) { return (nome || '?').split(' ').filter(Boolean).map(x => x[0]).join('').substring(0, 2).toUpperCase(); }
function primeiroENome(nome) {
  const p = (nome || '').trim().split(/\s+/);
  if (p.length <= 1) return p[0] || '';
  return p[0] + ' ' + p[p.length - 1];
}
function corDeNome(nome) {
  let h = 0; const s = nome || 'x';
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return _CORES[h % _CORES.length];
}
function fmtDataEsc(d) {
  if (!d) return '—';
  const p = String(d).slice(0, 10).split('-');
  return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : d;
}
function escStatusBadge(s) {
  const map = { rascunho: ['badge-gray', 'Rascunho'], ativa: ['badge-success', 'Ativa'], finalizada: ['badge-info', 'Finalizada'] };
  const [cls, lbl] = map[s] || map.rascunho;
  return `<span class="badge ${cls}">${lbl}</span>`;
}
function membroFoto(m) {
  if (!m) return null;
  if (m.funcionario_id && _escFotoMap.id[m.funcionario_id]) return _escFotoMap.id[m.funcionario_id];
  const cpf = (m.cpf || '').replace(/\D/g, '');
  if (cpf && _escFotoMap.cpf[cpf]) return _escFotoMap.cpf[cpf];
  if (m.email && _escFotoMap.email[escNorm(m.email)]) return _escFotoMap.email[escNorm(m.email)];
  if (m.nome && _escFotoMap.nome[escNorm(m.nome)]) return _escFotoMap.nome[escNorm(m.nome)];
  return null;
}
function avatarMini(m, size) {
  const foto = membroFoto(m);
  const fs = Math.round(size / 2.6);
  const inner = foto
    ? `<img src="${foto}" alt="" style="width:100%;height:100%;object-fit:cover;display:block;">`
    : `<span style="color:#fff;font-weight:800;font-size:${fs}px;">${iniciais(m.nome)}</span>`;
  const bg = foto ? '#e2e8f0' : corDeNome(m.nome);
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;background:${bg};">${inner}</div>`;
}
function playerToken(m, roleLabel, staff, compact) {
  const foto = membroFoto(m);
  /* IMPRESSÃO (compact): o gerador de PDF encolhe a folha inteira para caber em
     um A4 — antes ele reduzia a 70%, e um nome de 10px virava 7px no papel.
     Como o AVATAR é o que domina a altura da ficha, e não o texto, dá pra
     encolher o círculo e crescer bastante a letra sem passar de uma folha.
     A largura da ficha acompanha, senão o nome quebra em duas linhas — e aí a
     altura volta a subir e o ganho evapora. */
  const sz = compact ? (staff ? 34 : 30) : (staff ? 60 : 54);
  const w = compact ? 140 : 90;
  const nameFs = compact ? 17 : 11;
  const roleFs = compact ? 11 : 9;
  const initFs = compact ? (staff ? 14 : 12) : (staff ? 18 : 16);
  const ring = staff ? '3px solid #042D4D' : '2px solid #cbd5e1';
  const inner = foto
    ? `<img src="${foto}" style="width:100%;height:100%;object-fit:cover;display:block;">`
    : `<span style="color:#fff;font-weight:800;font-size:${initFs}px;">${iniciais(m.nome)}</span>`;
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:${compact ? 3 : 5}px;width:${w}px;text-align:center;">
    <div style="width:${sz}px;height:${sz}px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:${foto ? '#e2e8f0' : corDeNome(m.nome)};border:${ring};box-shadow:0 1px 5px rgba(4,45,77,.18);">${inner}</div>
    <div style="color:#042D4D;font-size:${nameFs}px;font-weight:800;line-height:1.2;max-width:${w}px;">${escEsc(primeiroENome(m.nome))}</div>
    <div style="color:#64748b;font-size:${roleFs}px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;">${escEsc(roleLabel || m.funcao || '')}</div>
  </div>`;
}
function rowHTML(label, players, destaque, compact) {
  if (!players.length) return '';
  const barCor = destaque ? '#042D4D' : '#7aa3c0';
  const headPad = compact ? '4px 12px' : '8px 14px';
  const bodyPad = compact ? '6px 12px' : '18px 14px';
  const gap = compact ? '4px 16px' : '18px 22px';
  return `<div style="border-bottom:1px solid #eef2f6;">
    <div style="background:#f1f5f9;color:#042D4D;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;padding:${headPad};border-left:4px solid ${barCor};">${escEsc(label)}</div>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:${gap};padding:${bodyPad};">${players.join('')}</div>
  </div>`;
}
function escalacaoHTML(e, opts) {
  opts = opts || {};
  const emp = _escEmpresa || {};
  const logo = emp.logo ? `<img src="${emp.logo}" style="height:54px;width:54px;object-fit:contain;border-radius:8px;background:#fff;padding:2px;">` : '';
  let cab = `<div style="display:flex;align-items:center;gap:14px;border-bottom:2px solid #042D4D;padding-bottom:12px;margin-bottom:14px;">${logo}<div>`;
  if (emp.nome_fantasia) cab += `<div style="font-size:17px;font-weight:900;color:#042D4D;">${escEsc(emp.nome_fantasia)}</div>`;
  if (emp.razao_social) cab += `<div style="font-size:11px;color:#64748b;">${escEsc(emp.razao_social)}</div>`;
  if (emp.cnpj) cab += `<div style="font-size:11px;color:#64748b;">CNPJ: ${escEsc(emp.cnpj)}</div>`;
  cab += `</div></div>`;

  const info = `<div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;margin-bottom:14px;">
    <div>
      <div style="font-size:16px;font-weight:900;color:#042D4D;text-transform:uppercase;">${escEsc(e.nome || 'Escala de Equipe')}</div>
      <div style="font-size:12px;color:#475569;margin-top:2px;">Período: <b>${fmtDataEsc(e.periodo_inicio)}</b> até <b>${fmtDataEsc(e.periodo_fim)}</b></div>
    </div>
    <div>${escStatusBadge(e.status || 'rascunho')}</div>
  </div>`;

  const c = !!opts.compact;

  function turnoBloco(t) {
    const staffPlayers = [];
    if (t.encarregado) staffPlayers.push(playerToken(t.encarregado, 'Encarregado', true, c));
    if (t.operador) staffPlayers.push(playerToken(t.operador, 'Operador', true, c));
    let rows = '';
    if (staffPlayers.length) rows += rowHTML('Coordenação', staffPlayers, true, c);
    (t.linhas || []).forEach((l) => {
      const ps = (l.membros || []).map((m) => playerToken(m, m.funcao, false, c));
      if (ps.length) rows += rowHTML(l.nome || 'Linha', ps, false, c);
    });
    if (!rows) rows = `<div style="text-align:center;color:#94a3b8;font-weight:600;padding:${c ? 16 : 30}px;">Nenhum colaborador escalado.</div>`;
    const campo = `<div style="background:#ffffff;border-radius:14px 14px 0 0;overflow:hidden;">${rows}</div>`;
    const benchCol = (titulo, arr, vazio) => {
      const items = (arr || []).length
        ? arr.map((m) => `<div style="display:flex;align-items:center;gap:${c ? 7 : 9}px;font-size:${c ? 11 : 12}px;color:#042D4D;font-weight:600;margin-bottom:${c ? 5 : 7}px;">${avatarMini(m, c ? 28 : 34)}<div><div>${escEsc(m.nome)}</div>${m.tipo ? `<div style="font-size:${c ? 9 : 10}px;color:#94a3b8;font-weight:700;text-transform:uppercase;">${TIPO_AUSENCIA[m.tipo] || m.tipo}</div>` : (m.funcao ? `<div style="font-size:${c ? 9 : 10}px;color:#94a3b8;">${escEsc(m.funcao)}</div>` : '')}</div></div>`).join('')
        : `<div style="font-size:11px;color:#94a3b8;font-style:italic;">${vazio}</div>`;
      return `<div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:${c ? 9 : 12}px;"><div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:#475569;margin-bottom:${c ? 7 : 10}px;">${titulo}</div>${items}</div>`;
    };
    const banco = `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:${c ? 9 : 12}px;padding:${c ? '10px 12px' : '14px 16px'};background:#f8fafc;border-radius:0 0 14px 14px;">
      ${benchCol('🧹 Limpeza', t.limpeza, 'Ninguém escalado')}
      ${benchCol('🏖️ Férias', t.ferias, 'Ninguém de férias')}
      ${benchCol('🚷 Ausências', t.ausencias, 'Nenhuma ausência')}
    </div>`;
    return `<div style="border:1px solid #e2e8f0;border-radius:14px;overflow:hidden;">${campo}${banco}</div>`;
  }

  const turnoHead = (nome, turnoId, cor) => {
    const hora = horarioDoTurno(turnoId || nome);
    return `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:${c ? '10px 0 6px' : '18px 0 8px'};">
      <span style="background:${cor};color:#fff;border-radius:8px;padding:4px 12px;font-size:12px;font-weight:800;letter-spacing:.5px;">${escEsc(nome || 'TURNO')}</span>
      ${hora ? `<span style="font-size:12px;font-weight:700;color:#475569;">🕐 ${escEsc(hora)}</span>` : ''}
    </div>`;
  };

  const bloco1 = turnoBloco({ encarregado: e.encarregado, operador: e.operador, linhas: e.linhas, limpeza: e.limpeza, ferias: e.ferias, ausencias: e.ausencias });
  let corpo = turnoHead(e.turno_nome, e.turno_id, '#0E3B62') + bloco1;
  if (temT2(e)) {
    const col1 = turnoHead(e.turno_nome, e.turno_id, '#0E3B62') + bloco1;
    const col2 = turnoHead(e.turno2.turno_nome, e.turno2.turno_id, '#7c3aed') + turnoBloco(e.turno2);
    corpo = opts.ladoALado
      ? `<div style="display:flex;gap:16px;align-items:flex-start;"><div style="flex:1;min-width:0;">${col1}</div><div style="flex:1;min-width:0;">${col2}</div></div>`
      : col1 + col2;
  }
  const obs = e.observacoes ? `<div style="margin-top:${c ? 10 : 14}px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:${c ? 9 : 12}px;font-size:12px;color:#475569;"><b>Observações:</b> ${escEsc(e.observacoes)}</div>` : '';
  const assImg = e.assinatura_img ? `<img src="${e.assinatura_img}" style="max-height:${c ? 56 : 72}px;max-width:240px;object-fit:contain;display:block;margin:0 auto 2px;">` : `<div style="height:${c ? 30 : 42}px;"></div>`;
  const sign = `<div style="display:flex;justify-content:center;padding:${c ? '12px 24px 4px' : '24px 24px 6px'};">
    <div style="text-align:center;width:300px;">${assImg}
      <div style="border-top:1.5px solid #94a3b8;padding-top:6px;font-size:12px;color:#475569;font-weight:700;">${escEsc(e.assinatura_responsavel || '')}</div>
      <div style="font-size:10px;color:#94a3b8;">Planejamento</div></div>
  </div>`;
  return cab + info + corpo + obs + sign;
}

/* ─── impressão: mesma folha A4 paisagem do escala.html ─── */
function imprimirEscala(id) {
  const e = _escalas.find((x) => x.id === id);
  if (!e) return;
  const w = window.open('', '_blank');
  if (!w) { if (typeof toast === 'function') toast('Permita pop-ups para imprimir.', 'warning'); return; }
  const PW = 1056, PH = 718;
  const css = `*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
    @page{size:A4 landscape;margin:10mm;}
    html,body{margin:0;padding:0;color:#032036;background:#fff;}
    body{text-align:center;}
    #pdf-wrap{display:inline-block;text-align:left;transform-origin:top center;}
    @media print{body{padding:0;}}`;
  let inner = escalacaoHTML(e, { ladoALado: true, compact: true });
  inner += `<div style="margin-top:12px;font-size:10px;color:#94a3b8;border-top:1px solid #e2e8f0;padding-top:8px;">${escEsc(_escEmpresa.nome_fantasia || 'ERP Industrial')} · Escala gerada em ${new Date().toLocaleString('pt-BR')}</div>`;
  let doc = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Escala — ${escEsc(e.nome || '')}</title><style>${css}</style></head><body>`;
  doc += `<div id="pdf-wrap">${inner}</div>`;
  doc += `<script>
    (function(){
      var PW=${PW},PH=${PH};
      function ajustar(){
        var wrap=document.getElementById('pdf-wrap'); if(!wrap) return;
        wrap.style.width=PW+'px';
        var h1=wrap.scrollHeight, fator=1;
        if(h1>PH){ var f=PH/h1, novaLarg=Math.min(PW/f,PW*1.8);
          wrap.style.width=novaLarg+'px';
          var h2=wrap.scrollHeight; fator=Math.min(PH/h2,PW/novaLarg)*0.99; }
        if(fator<1){ if('zoom' in wrap.style){ wrap.style.zoom=fator; }
          else { wrap.style.transform='scale('+fator.toFixed(4)+')'; wrap.style.height=(wrap.scrollHeight*fator)+'px'; } }
        setTimeout(function(){ try{ window.focus(); window.print(); }catch(err){} },150);
      }
      var imgs=Array.prototype.slice.call(document.images||[]);
      var pend=imgs.filter(function(im){return !im.complete;});
      if(!pend.length){ setTimeout(ajustar,150); return; }
      var done=0;
      pend.forEach(function(im){ im.addEventListener('load',check); im.addEventListener('error',check); });
      function check(){ if(++done>=pend.length) setTimeout(ajustar,100); }
      setTimeout(ajustar,1500);
    })();
  <\/script></body></html>`;
  w.document.write(doc); w.document.close();
}

/* ─── carga e lista ─── */
async function initEscalas(forcar) {
  if (_escCarregado && !forcar) { renderEscalas(); return; }
  const app = document.getElementById('esc-app');
  if (app) app.innerHTML = '<div class="card" style="text-align:center;padding:30px;color:#94a3b8;">Carregando escalas…</div>';
  const [esc, fun, emp, tur] = await Promise.all([
    _supabase.from('escalas').select('*').order('periodo_inicio', { ascending: false }),
    _supabase.from('funcionarios').select('id,nome,cpf,email,foto').order('nome'),
    _supabase.from('empresa_config').select('nome_fantasia,razao_social,logo,cnpj').limit(1).maybeSingle(),
    _supabase.from('turnos').select('id,nome,status,calendario').order('nome'),
  ]);
  if (esc && esc.error) {
    if (app) app.innerHTML = `<div class="card"><div class="alert-info" style="background:#fef2f2;border-color:#fca5a5;color:#991b1b;">
      Não consegui ler as escalas: ${escEsc(esc.error.message || 'erro desconhecido')}</div></div>`;
    console.error('Escalas:', esc.error);
    return;
  }
  _escalas = (esc && esc.data) || [];
  _escFuncionarios = (fun && fun.data) || [];
  _escEmpresa = (emp && emp.data) || {};
  _escTurnos = ((tur && tur.data) || []).filter((t) => !t.status || t.status === 'ativo');
  _escFotoMap = { id: {}, cpf: {}, nome: {}, email: {} };
  _escFuncionarios.forEach((f) => {
    if (!f.foto) return;
    if (f.id) _escFotoMap.id[f.id] = f.foto;
    const cpf = (f.cpf || '').replace(/\D/g, '');
    if (cpf) _escFotoMap.cpf[cpf] = f.foto;
    if (f.nome) _escFotoMap.nome[escNorm(f.nome)] = f.foto;
    if (f.email) _escFotoMap.email[escNorm(f.email)] = f.foto;
  });
  _escCarregado = true;
  renderEscalas();
}

function escTurnos(e) {
  const t = [];
  const base = { turno_nome: e.turno_nome, encarregado: e.encarregado, operador: e.operador,
                 linhas: e.linhas, limpeza: e.limpeza, ferias: e.ferias, ausencias: e.ausencias };
  if (base.turno_nome || (base.linhas || []).length) t.push(base);
  if (temT2(e)) t.push(e.turno2);
  return t;
}
function escTotalPessoas(e) {
  const ids = new Set();
  escTurnos(e).forEach((t) => {
    (t.linhas || []).forEach((l) => (l.membros || []).forEach((m) => ids.add(m.funcionario_id || m.nome)));
    (t.limpeza || []).forEach((m) => ids.add(m.funcionario_id || m.nome));
    [t.encarregado, t.operador].forEach((p) => { if (p && (p.funcionario_id || p.nome)) ids.add(p.funcionario_id || p.nome); });
  });
  return ids.size;
}
function escContar(e, campo) { return escTurnos(e).reduce((a, t) => a + ((t[campo] || []).length), 0); }

/* ---------- MÓDULO: Folha de Pagamento (independente, um mês por competência) ---------- */

function _acharFolhaAberta() {

function novoRegistroFolha(func) {
  return {
    numTitulo: '', codigoFornecedor: func && func.codigo_fornecedor ? String(func.codigo_fornecedor) : '',
    salarioLiquido: 0, dsr: 0, adNoturno: 0, extra100: 0, extra55: 0, vale: 0,
    fgts: 0, inss: 0, desconto: 0, irrf: 0, contAssist: 0, salarioBruto: 0,
    local: (func && (func.setor || func.funcao)) || '', natureza: '',
  };
}
function calcularTotaisFolha(dados) {
  const vals = Object.values(dados || {});
  return {
    funcionarios: vals.length,
    totalBruto: vals.reduce((a, d) => a + (Number(d.salarioBruto) || 0), 0),
    totalLiquido: vals.reduce((a, d) => a + (Number(d.salarioLiquido) || 0), 0),
  };
}
function nomeFuncionarioNaFolha(funcionarioId, registro) {

  const func = state.funcionariosReais.find((f) => f.id === funcionarioId);
  return func ? func.nome : '(removido do cadastro)';
}
function funcaoFuncionarioNaFolha(funcionarioId, registro) {
  if (registro && registro.extra) return registro.funcaoExtra || '';
  const func = state.funcionariosReais.find((f) => f.id === funcionarioId);
  return func ? (func.funcao || '') : '';
}

async function criarNovaFolhaPagamento(mes, ano, nome, copiarDeId) {
  state._folhaErroCriar = null;
  if (typeof _supabase === 'undefined' || !_supabase) { state._folhaErroCriar = 'Sem conexão com o banco (Supabase não disponível).'; render(); return; }
  const jaExiste = folhaDoMes(mes, ano);
  if (jaExiste) { if (typeof toast === 'function') toast(`Já existe uma folha para ${String(mes).padStart(2, '0')}/${ano} (${jaExiste.codigo}).`, 'warning'); state.folhaAtualId = jaExiste.id; render(); return; }
  let dados = {};
  if (copiarDeId) {
    const origem = state.folhasPagamento.find((f) => f.id === copiarDeId);
    if (origem) dados = JSON.parse(JSON.stringify(origem.dados || {}));
  } else {
    state.funcionariosReais.forEach((f) => { dados[f.id] = novoRegistroFolha(f); });
  }
  const numero = state.folhasPagamento.reduce((max, f) => Math.max(max, f.numero || 0), 0) + 1;
  const codigo = 'FP-' + String(numero).padStart(4, '0');
  const totais = calcularTotaisFolha(dados);
  try {
    const { data, error } = await _supabase.from(TABELA_FOLHAS_PAGAMENTO).insert({ codigo, numero, nome: nome || codigo, mes, ano, dados, totais }).select().single();
    if (error) throw error;
    state.folhasPagamento.unshift(data);
    state.folhaAtualId = data.id;
    state._folhaFormAberto = false;
    if (typeof addLog === 'function') addLog('CREATE', 'folhas_pagamento', data.id, `Folha ${codigo} criada (${mes}/${ano})`);
    render();
    if (typeof toast === 'function') toast(`Folha ${codigo} criada.`, 'success');
  } catch (e) {
    console.error(e);
    state._folhaErroCriar = 'Erro ao criar folha: ' + (e && e.message ? e.message : String(e));
    render();
    if (typeof toast === 'function') toast(state._folhaErroCriar, 'danger');
  }
}
async function confirmarCriarFolha() {
  const mes = Number((document.getElementById('cp-novafolha-mes') || {}).value) || state.mes;
  const ano = Number((document.getElementById('cp-novafolha-ano') || {}).value) || state.ano;
  const nome = (document.getElementById('cp-novafolha-nome') || {}).value || '';
  const copiarDeId = (document.getElementById('cp-novafolha-copiar') || {}).value || null;
  const btn = document.getElementById('cp-btn-confirmar-criar-folha');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Criando...'; }
  await criarNovaFolhaPagamento(mes, ano, nome, copiarDeId);
  if (btn) { btn.disabled = false; btn.textContent = 'Criar'; }
}
function _normalizarNomeFolha(nome) {
  return (nome || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().trim().replace(/\s+/g, ' ');
}
// Converte "HELITON JOSE DE ALMEIDA RODRIGUES" -> "Heliton José de Almeida Rodrigues"
// (conectores como de/da/do/dos/das/e ficam em minúsculo, exceto se forem a primeira palavra)
const CONECTORES_NOME_MINUSCULO = ['de', 'da', 'do', 'das', 'dos', 'e'];
function _tituloCaseNome(nome) {
  const partes = (nome || '').trim().toLowerCase().split(/\s+/);
  return partes.map((p, i) => (i > 0 && CONECTORES_NOME_MINUSCULO.includes(p)) ? p : (p.charAt(0).toUpperCase() + p.slice(1))).join(' ');
}
// Próximo número de título automático: maior número já usado nesta folha + 1 (só considera os que já são numéricos)
function _proximoNumTitulo(folha) {
  const numeros = Object.values(folha.dados || {}).map((d) => parseInt(d.numTitulo, 10)).filter((n) => !isNaN(n));
  if (!numeros.length) return '';
  return String(Math.max(...numeros) + 1);
}

async function criarFolhaJulho2026ComPlanilha() {
  if (folhaDoMes(7, 2026)) { if (typeof toast === 'function') toast('Já existe uma folha para 07/2026.', 'warning'); return; }
  const dados = {};
  let matchCount = 0;
  DADOS_PLANILHA_SILICATE_FILIAL.forEach((linha) => {
    const [numTitulo, codigoFornecedor, nomePlanilha, salarioLiquido, dsr, adNoturno, extra100, extra55, vale, fgts, inss, irrf, desconto, contAssist, salarioBruto] = linha;
    const nomeNormalizado = _normalizarNomeFolha(nomePlanilha);
    const funcMatch = state.funcionariosReais.find((f) => _normalizarNomeFolha(f.nome) === nomeNormalizado);
    const registro = { numTitulo, codigoFornecedor, salarioLiquido, dsr, adNoturno, extra100, extra55, vale, fgts, inss, irrf, desconto, contAssist, salarioBruto, local: 'PRODUÇÃO', natureza: '201110801' };
    if (funcMatch) {
      matchCount++;
      dados[funcMatch.id] = registro;
    } else {
      state._itemMultiploSeq = (state._itemMultiploSeq || 0) + 1;
      const idExtra = 'extra_' + state._itemMultiploSeq;
      dados[idExtra] = { ...registro, nomeExtra: _tituloCaseNome(nomePlanilha), funcaoExtra: '', extra: true };
    }
  });
  const numero = state.folhasPagamento.reduce((max, f) => Math.max(max, f.numero || 0), 0) + 1;
  const codigo = 'FP-' + String(numero).padStart(4, '0');
  const totais = calcularTotaisFolha(dados);
  try {
    const { data, error } = await _supabase.from(TABELA_FOLHAS_PAGAMENTO).insert({ codigo, numero, nome: 'Folha Julho/2026 (base planilha enviada)', mes: 7, ano: 2026, dados, totais }).select().single();
    if (error) throw error;
    state.folhasPagamento.unshift(data);
    state.folhaAtualId = data.id;
    render();
    if (typeof toast === 'function') toast(`Folha Julho/2026 criada: ${matchCount} funcionário(s) encontrados no cadastro, ${DADOS_PLANILHA_SILICATE_FILIAL.length - matchCount} incluído(s) como extra.`, 'success');
  } catch (e) {
    console.error(e);
    state._folhaErroCriar = 'Erro ao criar folha de Julho/2026: ' + (e && e.message ? e.message : String(e));
    render();
  }
}

function setNomeFolhaAtual(valor) {
  const folha = _acharFolhaAberta(); if (!folha) return;
  folha.nome = valor;
  render();
  salvarFolhaPagamentoAtual();
}
let _folhaPgtoSaveTimer = null;
function _agendarSalvarFolhaPagamento() {
  clearTimeout(_folhaPgtoSaveTimer);
  _folhaPgtoSaveTimer = setTimeout(() => { salvarFolhaPagamentoAtual(); }, 700);
}
async function salvarFolhaPagamentoAtual() {
  const folha = _acharFolhaAberta(); if (!folha || typeof _supabase === 'undefined' || !_supabase) return;
  try {
    const { error } = await _supabase.from(TABELA_FOLHAS_PAGAMENTO).update({ dados: folha.dados, totais: folha.totais, nome: folha.nome, atualizado_em: new Date().toISOString() }).eq('id', folha.id);
    if (error) throw error;
  } catch (e) { console.error('Erro ao salvar folha:', e); }
}
async function excluirFolhaPagamento(id) {
  if (typeof _supabase === 'undefined' || !_supabase) return;
  try {
    const { error } = await _supabase.from(TABELA_FOLHAS_PAGAMENTO).delete().eq('id', id);
    if (error) throw error;
    state.folhasPagamento = state.folhasPagamento.filter((f) => f.id !== id);
    if (state.folhaAtualId === id) state.folhaAtualId = null;
    render();
    if (typeof toast === 'function') toast('Folha excluída.', 'success');
  } catch (e) { console.error(e); if (typeof toast === 'function') toast('Erro ao excluir: ' + e.message, 'danger'); }
}
function setFolhaPagamentoCampo(funcionarioId, campo, valor) {
  const folha = _acharFolhaAberta(); if (!folha) return;
  if (!folha.dados[funcionarioId]) folha.dados[funcionarioId] = novoRegistroFolha();
  const camposTexto = ['numTitulo', 'codigoFornecedor', 'local', 'natureza'];
  folha.dados[funcionarioId][campo] = camposTexto.includes(campo) ? valor : (Number(valor) || 0);
  folha.totais = calcularTotaisFolha(folha.dados);
  render();
  _agendarSalvarFolhaPagamento();
}
function adicionarFuncionarioNaFolha(funcionarioId) {
  const folha = _acharFolhaAberta(); if (!folha || !funcionarioId) return;
  if (folha.dados[funcionarioId]) return;
  const func = state.funcionariosReais.find((f) => f.id === funcionarioId);
  folha.dados[funcionarioId] = { ...novoRegistroFolha(func), numTitulo: _proximoNumTitulo(folha) };
  folha.totais = calcularTotaisFolha(folha.dados);
  render();
  salvarFolhaPagamentoAtual();
}
function removerFuncionarioDaFolha(funcionarioId) {
  const folha = _acharFolhaAberta(); if (!folha) return;
  delete folha.dados[funcionarioId];
  folha.totais = calcularTotaisFolha(folha.dados);
  render();
  salvarFolhaPagamentoAtual();
}
function adicionarFuncionarioExtraNaFolha(nome, funcao) {
  const folha = _acharFolhaAberta(); if (!folha) return;
  const n = (nome || '').trim(); if (!n) { if (typeof toast === 'function') toast('Informe o nome do funcionário.', 'warning'); return; }
  const nomeNorm = _normalizarNomeFolha(n);
  // se o nome digitado bate com alguém do cadastro real (funcionarios.html), vincula pelo ID de
  // verdade em vez de criar um "extra" duplicado
  const jaNoCadastro = state.funcionariosReais.find((f) => _normalizarNomeFolha(f.nome) === nomeNorm);
  if (jaNoCadastro) {
    if (folha.dados[jaNoCadastro.id]) { if (typeof toast === 'function') toast(`"${jaNoCadastro.nome}" já está nesta folha.`, 'warning'); return; }
    folha.dados[jaNoCadastro.id] = { ...novoRegistroFolha(jaNoCadastro), numTitulo: _proximoNumTitulo(folha) };
    folha.totais = calcularTotaisFolha(folha.dados);
    render();
    salvarFolhaPagamentoAtual();
    if (typeof toast === 'function') toast(`"${jaNoCadastro.nome}" já existe no cadastro — vinculado automaticamente (sem duplicar).`, 'success');
    return;
  }
  const jaComoExtra = Object.values(folha.dados).some((d) => d.extra && _normalizarNomeFolha(d.nomeExtra) === nomeNorm);
  if (jaComoExtra) { if (typeof toast === 'function') toast(`"${n}" já está incluído nesta folha.`, 'warning'); return; }
  state._folhaSeq = (state._folhaSeq || 0) + 1;
  const id = 'extra_' + state._folhaSeq;
  folha.dados[id] = { ...novoRegistroFolha(), numTitulo: _proximoNumTitulo(folha), nomeExtra: _tituloCaseNome(n), funcaoExtra: (funcao || '').trim(), extra: true };
  folha.totais = calcularTotaisFolha(folha.dados);
  render();
  salvarFolhaPagamentoAtual();
  if (typeof toast === 'function') toast(`"${_tituloCaseNome(n)}" incluído nesta folha.`, 'success');
}

/* Um lançamento "extra" é alguém digitado à mão, sem vínculo com o cadastro.
   Acontece de a pessoa JÁ existir em funcionarios.html e o lançamento ter sido
   feito pelo caminho errado — foi assim que Jose Elizar, Juraci e Kaique
   entraram. Enquanto ficam soltos, o Custo & Precificação precisa casá-los por
   NOME, que quebra na primeira folha grafada diferente. Aqui eu acho o dono e
   ofereço o vínculo; quem aperta o botão é você. */
function _candidatoDoCadastro(registro) {
  if (!registro || !registro.extra) return null;
  const alvo = _normalizarNomeFolha(registro.nomeExtra || '');
  if (!alvo) return null;
  const lista = state.funcionariosReais || [];
  const exato = lista.find((f) => _normalizarNomeFolha(f.nome) === alvo);
  if (exato) return { func: exato, exato: true };
  /* Sem match exato, tenta ignorando os conectores (de/da/do/dos/das/e):
     "Kaique de Oliveira Proença" x "Kaique Oliveira Proença". Só aceito quando
     UM único funcionário sobra — dois candidatos viram nenhum, porque adivinhar
     qual é seria pior do que deixar como extra. */
  const semConect = (n) => _normalizarNomeFolha(n).split(' ').filter((w) => !['DE','DA','DO','DAS','DOS','E'].includes(w)).join(' ');
  const alvoS = semConect(registro.nomeExtra || '');
  const quase = lista.filter((f) => semConect(f.nome) === alvoS);
  return quase.length === 1 ? { func: quase[0], exato: false } : null;
}

function vincularExtraAoCadastro(chaveExtra) {
  const folha = _acharFolhaAberta(); if (!folha) return;
  const registro = (folha.dados || {})[chaveExtra];
  const cand = _candidatoDoCadastro(registro);
  if (!cand) return;
  if (folha.dados[cand.func.id]) {
    if (typeof toast === 'function') toast('Esse funcionário já tem uma linha nesta folha. Junte as duas antes de vincular.', 'warning');
    return;
  }
  const msg = `Vincular "${registro.nomeExtra}" ao cadastro de ${cand.func.nome}?`
    + (cand.exato ? '' : '\n\nO nome está grafado diferente nos dois lugares — confira antes de confirmar.')
    + '\n\nOs valores lançados são mantidos; muda só o vínculo.';
  if (!confirm(msg)) return;
  const novo = { ...registro };
  delete novo.extra; delete novo.nomeExtra; delete novo.funcaoExtra;
  folha.dados[cand.func.id] = novo;
  delete folha.dados[chaveExtra];
  folha.totais = calcularTotaisFolha(folha.dados);
  render();
  salvarFolhaPagamentoAtual();
  if (typeof toast === 'function') toast(`Vinculado a ${cand.func.nome}.`, 'success');
}

function linhaFolhaPagamento(funcionarioId, registro) {
  const nome = nomeFuncionarioNaFolha(funcionarioId, registro);
  const funcao = funcaoFuncionarioNaFolha(funcionarioId, registro);
  const campoNum = (campo) => campoMoedaFolhaHtml(funcionarioId, campo, registro[campo]);
  const campoTxt = (campo, largura) => `<input class="form-input cp-input-tabela" style="width:${largura || '90px'};" type="text" value="${esc(registro[campo] || '')}" onchange="setFolhaPagamentoCampo('${funcionarioId}','${campo}', this.value)">`;
  return `<tr>
    <td>${campoTxt('numTitulo', '90px')}</td>
    <td>${campoTxt('codigoFornecedor', '80px')}</td>
    <td style="white-space:nowrap;">${esc(nome)}${funcao ? ` <span class="cp-muted">(${esc(funcao)})</span>` : ''}${(() => {
      if (!registro.extra) return '';
      const cand = _candidatoDoCadastro(registro);
      if (!cand) return ' <span class="badge badge-gray" title="Lançado à mão: este nome não existe no cadastro de funcionários.">extra</span>';
      return ` <span class="badge badge-warning" title="Lançado à mão, mas esta pessoa existe no cadastro${cand.exato ? '' : ' (com o nome grafado um pouco diferente)'}.">extra</span>
        <button class="btn btn-ghost btn-sm" style="padding:1px 7px;font-size:11px;border:1px solid var(--primary);color:var(--primary);"
          title="Vincular ao cadastro de ${esc(cand.func.nome)}${cand.exato ? '' : ' — atenção: a grafia difere'}"
          onclick="vincularExtraAoCadastro('${esc(funcionarioId)}')">🔗 vincular${cand.exato ? '' : ' ?'}</button>`;
    })()}</td>
    <td>${campoNum('salarioLiquido')}</td>
    <td>${campoNum('dsr')}</td>
    <td>${campoNum('adNoturno')}</td>
    <td>${campoNum('extra100')}</td>
    <td>${campoNum('extra55')}</td>
    <td>${campoNum('vale')}</td>
    <td>${campoNum('fgts')}</td>
    <td>${campoNum('inss')}</td>
    <td>${campoNum('desconto')}</td>
    <td>${campoNum('irrf')}</td>
    <td>${campoNum('contAssist')}</td>
    <td>${campoNum('salarioBruto')}</td>
    <td>${campoTxt('local', '110px')}</td>
    <td>${campoTxt('natureza', '100px')}</td>
    <td><button class="cp-fechar-btn" onclick="removerFuncionarioDaFolha('${funcionarioId}')" title="Remover desta folha">✕</button></td>
  </tr>`;
}

function renderFolhaEdicao(folha) {
  const idsNaFolha = new Set(Object.keys(folha.dados || {}));
  const disponiveis = state.funcionariosReais.filter((f) => !idsNaFolha.has(f.id));
  const opcoes = disponiveis.map((f) => `<option value="${f.id}">${esc(f.nome)}${f.funcao ? ' — ' + esc(f.funcao) : ''}</option>`).join('');
  const entradasOrdenadas = Object.entries(folha.dados || {}).sort(([fidA, regA], [fidB, regB]) => {
    return nomeFuncionarioNaFolha(fidA, regA).localeCompare(nomeFuncionarioNaFolha(fidB, regB), 'pt-BR', { sensitivity: 'base' });
  });
  const linhas = entradasOrdenadas.map(([fid, reg]) => linhaFolhaPagamento(fid, reg)).join('');
  /* Resumo em cima: quem está solto mas tem dono no cadastro. Sem isto, achar
     as linhas no meio de 40 é trabalho manual. */
  const vinculaveis = Object.entries(folha.dados || {})
    .map(([fid, reg]) => ({ fid, reg, cand: _candidatoDoCadastro(reg) }))
    .filter((x) => x.cand);
  const avisoVinculo = vinculaveis.length ? `<div class="alert-info" style="background:#fffbeb;border-color:#fcd34d;color:#78350f;margin-bottom:12px;">
    <strong>${vinculaveis.length} pessoa(s) desta folha foram lançadas à mão, mas já existem no cadastro:</strong>
    ${vinculaveis.map((x) => `${esc(x.reg.nomeExtra || '')} → <strong>${esc(x.cand.func.nome)}</strong>${x.cand.exato ? '' : ' <em>(grafia diferente)</em>'}`).join(' · ')}.
    <div style="margin-top:6px;">Enquanto ficarem soltas, o Custo &amp; Precificação precisa casá-las por nome — e isso quebra na primeira folha grafada de outro jeito. Use o botão <strong>🔗 vincular</strong> na linha de cada uma.</div>
  </div>` : '';
  const totais = folha.totais || calcularTotaisFolha(folha.dados);
  return `<div class="card" style="margin-bottom:14px;">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <div>
        <button class="btn btn-ghost btn-sm" style="color:#1e3a5f;font-weight:700;border:1px solid #cbd5e1;" onclick="voltarParaHistoricoFolha()">◀ Voltar ao histórico</button>
        <h3 class="cp-h3" style="margin:6px 0 2px;">📋 ${esc(folha.codigo)} — ${String(folha.mes).padStart(2, '0')}/${folha.ano}</h3>
        <input class="form-input" style="max-width:320px;" type="text" value="${esc(folha.nome || '')}" placeholder="Nome da folha" onchange="setNomeFolhaAtual(this.value)">
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary" onclick="salvarFolhaPagamentoAtual(); if(typeof toast==='function') toast('Folha salva.','success');">💾 Salvar</button>
        <button class="btn btn-secondary" onclick="imprimirFolhaPagamento('${folha.id}')">🖨️ Gerar PDF</button>
      </div>
    </div>
  </div>
  <div class="card" style="margin-bottom:14px;">
    <div class="cp-kpi-linha"><span>Funcionários nesta folha</span><strong>${totais.funcionarios}</strong></div>
    <div class="cp-kpi-linha"><span>Total Salário Bruto <span class="cp-muted">(alimenta Custo &amp; Precificação)</span></span><strong class="cp-destaque">${fmtBRL(totais.totalBruto)}</strong></div>
    <div class="cp-kpi-linha"><span>Total Salário Líquido</span><strong>${fmtBRL(totais.totalLiquido)}</strong></div>
  </div>
  ${avisoVinculo}
  <div class="card">
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
      <select class="form-input" style="flex:1;min-width:240px;" onchange="adicionarFuncionarioNaFolha(this.value); this.value='';">
        <option value="">+ Adicionar funcionário do cadastro...</option>${opcoes}
      </select>
      <input class="form-input" style="max-width:220px;" type="text" id="cp-folha-extra-nome" placeholder="Nome do novo funcionário">
      <input class="form-input" style="max-width:160px;" type="text" id="cp-folha-extra-funcao" placeholder="Função">
      <button class="btn btn-secondary" onclick="adicionarFuncionarioExtraNaFolha(document.getElementById('cp-folha-extra-nome').value, document.getElementById('cp-folha-extra-funcao').value); document.getElementById('cp-folha-extra-nome').value=''; document.getElementById('cp-folha-extra-funcao').value='';">+ Incluir novo funcionário</button>
    </div>
    <div class="table-wrap cp-table-scroll"><table>
      <thead><tr><th>Nº Título</th><th>Cód. Fornec.</th><th>Funcionário</th><th>Salário Líq.</th><th>DSR</th><th>Ad. Noturno</th><th>Extra 100%</th><th>Extra 55%</th><th>Vale</th><th>FGTS</th><th>INSS</th><th>Desconto</th><th>IRRF</th><th>Cont/Assist</th><th>Salário Bruto</th><th>Local</th><th>Natureza</th><th></th></tr></thead>
      <tbody>${linhas || '<tr><td colspan="18" class="cp-muted">Nenhum funcionário nesta folha ainda.</td></tr>'}</tbody>
    </table></div>
  </div>`;
}

function imprimirFolhaPagamento(folhaId) {
  const folha = state.folhasPagamento.find((f) => f.id === folhaId);
  if (!folha) return;
  const w = window.open('', '_blank');
  if (!w) { if (typeof toast === 'function') toast('Permita pop-ups para gerar o relatório.', 'warning'); return; }
  const linhas = Object.entries(folha.dados || {})
    .sort(([fidA, regA], [fidB, regB]) => nomeFuncionarioNaFolha(fidA, regA).localeCompare(nomeFuncionarioNaFolha(fidB, regB), 'pt-BR', { sensitivity: 'base' }))
    .map(([fid, reg]) => {
    const nome = nomeFuncionarioNaFolha(fid, reg);
    return `<tr><td>${esc(reg.numTitulo || '')}</td><td>${esc(reg.codigoFornecedor || '')}</td><td>${esc(nome)}</td>
      <td class="num">${fmtBRL(reg.salarioLiquido)}</td><td class="num">${fmtBRL(reg.dsr)}</td><td class="num">${fmtBRL(reg.adNoturno)}</td>
      <td class="num">${fmtBRL(reg.extra100)}</td><td class="num">${fmtBRL(reg.extra55)}</td><td class="num">${fmtBRL(reg.vale)}</td>
      <td class="num">${fmtBRL(reg.fgts)}</td><td class="num">${fmtBRL(reg.inss)}</td><td class="num">${fmtBRL(reg.desconto)}</td>
      <td class="num">${fmtBRL(reg.irrf)}</td><td class="num">${fmtBRL(reg.contAssist)}</td><td class="num">${fmtBRL(reg.salarioBruto)}</td>
      <td>${esc(reg.local || '')}</td><td>${esc(reg.natureza || '')}</td></tr>`;
  }).join('');
  const totais = folha.totais || calcularTotaisFolha(folha.dados);
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Folha de Pagamento — ${String(folha.mes).padStart(2, '0')}/${folha.ano}</title>
    <style>${_printCSS()}table{font-size:9px;}</style></head><body>
    ${_printCabecalho()}
    <h1>FOLHA DE PAGAMENTO — ${String(folha.mes).padStart(2, '0')}/${folha.ano}</h1>
    <p class="sub">${esc(folha.codigo)}${folha.nome ? ' — ' + esc(folha.nome) : ''} · Emitido em ${new Date().toLocaleString('pt-BR')}</p>
    <table><thead><tr><th>Nº Título</th><th>Cód.Forn.</th><th>Funcionário</th><th>Sal.Líq.</th><th>DSR</th><th>Ad.Not.</th><th>Extra100%</th><th>Extra55%</th><th>Vale</th><th>FGTS</th><th>INSS</th><th>Desconto</th><th>IRRF</th><th>Cont/Assist</th><th>Sal.Bruto</th><th>Local</th><th>Natureza</th></tr></thead>
    <tbody>${linhas}</tbody>
    <tfoot><tr><td colspan="14">Total (${totais.funcionarios} funcionários)</td><td class="num">${fmtBRL(totais.totalBruto)}</td><td colspan="2"></td></tr></tfoot></table>
    </body></html>`;
  w.document.write(html);
  w.document.close();
  setTimeout(() => w.print(), 500);
}

/* carga da folha — só na primeira vez que a aba é aberta */
async function carregarFolhasPagamento() {
  if (typeof _supabase === 'undefined' || !_supabase) return;
  try {
    const { data, error } = await _supabase.from(TABELA_FOLHAS_PAGAMENTO).select('*').order('ano', { ascending: false }).order('mes', { ascending: false });
    if (error) {
      if (/does not exist|relation|42P01/i.test(error.message || '')) { state._tabelaFolhasPagamentoExiste = false; return; }
      throw error;
    }
    state._tabelaFolhasPagamentoExiste = true;
    state.folhasPagamento = data || [];
  } catch (e) {
    console.error('Erro ao carregar folhas de pagamento:', e);
    state._tabelaFolhasPagamentoExiste = false;
  }
}

async function initFolhaPagamento() {
  if (_fpCarregado) { render(); return; }
  const app = document.getElementById('fp-app');
  if (app) app.innerHTML = '<div class="card" style="text-align:center;padding:30px;color:#94a3b8;">Carregando folhas…</div>';
  /* `codigo_fornecedor` NÃO existe na tabela funcionarios: pedir a coluna fazia
     o PostgREST devolver erro, `data` vinha nulo, a lista ficava vazia e TODO
     funcionário da folha aparecia como "(removido do cadastro)". O código do
     fornecedor já é digitado por linha na própria folha, então não faz falta
     aqui. Se um dia a coluna existir, é só voltar a pedi-la. */
  const [funcs, emp] = await Promise.all([
    _supabase.from('funcionarios').select('id,nome,funcao,setor,status').eq('status', 'ativo').order('nome'),
    _supabase.from('empresa_config').select('nome_fantasia,razao_social,logo,cnpj,ie,cep,rua,numero,complemento,bairro,cidade,uf,telefone,email').limit(1).maybeSingle(),
  ]);
  /* Falha de leitura não pode virar lista vazia em silêncio — foi assim que o
     defeito passou despercebido. Agora ela aparece na tela. */
  state._erroFuncionarios = (funcs && funcs.error) ? (funcs.error.message || 'erro ao ler o cadastro') : null;
  if (state._erroFuncionarios) console.error('Folha: erro ao ler funcionarios', funcs.error);
  state.funcionariosReais = (funcs && funcs.data) || [];
  state.empresa = (emp && emp.data) || {};
  await carregarFolhasPagamento();
  _fpCarregado = true;
  render();
}

document.head.insertAdjacentHTML('beforeend','<style>.tab-btn{padding:10px 20px;background:none;border:none;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;color:#64748b;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;}.tab-btn.active{color:var(--accent);border-bottom-color:var(--primary);}.alert-info{background:#eff6ff;border:1px solid #93c5fd;color:#1e40af;padding:12px 16px;border-radius:8px;margin-bottom:8px;}</style>');
init();
</script>
