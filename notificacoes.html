<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP Industrial — Notificações</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<script src="js/regras.js"></script>
<script src="js/notificacoes-aviso.js"></script>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   NOTIFICAÇÕES (out/2026) — caixa de entrada ao vivo
   Tempo real (Realtime) + som por tipo + aviso na tela do computador.
   Uma notificação por condição: ela some sozinha quando o problema acaba.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --ok:#16a34a; --ok-bg:#dcfce7; --ok-line:#22c55e;
  --warn:#b45309; --warn-bg:#fef3c7; --warn-line:#f59e0b;
  --bad:#dc2626; --bad-bg:#fee2e2; --bad-line:#ef4444;
  --info:#2563eb; --info-bg:#dbeafe; --info-line:#3b82f6;
  --line:#e3e9f0; --line-soft:#f1f5f9;
  --ink-2:#475569; --ink-3:#64748b; --ink-4:#94a3b8; --ink-5:#cbd5e1;
}
[role="button"],button{cursor:pointer;}
button:focus-visible,a:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}

.nt-wrap{max-width:1100px;}
.nt-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.nt-head h1{margin:0;font-size:26px;font-weight:800;color:var(--primary);letter-spacing:-.4px;}
.nt-live{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--ink-3);font-weight:600;flex-wrap:wrap;}
.nt-live .dot{width:9px;height:9px;border-radius:50%;background:var(--ink-5);flex-shrink:0;}
.nt-live.on .dot{background:var(--ok-line);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:ntPulso 2s infinite;}
.nt-live.on b{color:var(--ok);}
@keyframes ntPulso{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
@media (prefers-reduced-motion:reduce){.nt-live.on .dot{animation:none;}}
.nt-acts{display:flex;gap:8px;flex-wrap:wrap;}
.nt-btn{height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:13.5px;
  font-weight:700;color:var(--primary);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;text-decoration:none;}
.nt-btn:hover{border-color:var(--primary);}
.nt-btn.pri{background:var(--primary);border-color:var(--primary);color:var(--accent);}
.nt-btn.pri:hover{filter:brightness(1.12);}
.nt-btn:disabled{opacity:.6;cursor:default;}
.nt-btn.mudo{color:var(--ink-3);}

/* faixas de aviso (som bloqueado, migração) */
.nt-faixa{display:flex;align-items:center;gap:12px;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:13.5px;font-weight:600;}
.nt-faixa.som{background:#fff1f2;color:#9f1239;border:1.5px solid #fecdd3;cursor:pointer;}
.nt-faixa.som:hover{background:#ffe4e6;}
.nt-faixa.mig{background:var(--warn-bg);color:#7c2d12;border:1.5px solid #fcd34d;}
.nt-faixa .ic{font-size:22px;}
.nt-faixa .tx{flex:1;}
.nt-faixa small{display:block;font-weight:500;opacity:.85;margin-top:2px;}
.nt-faixa .bt{background:#fff;border:0;border-radius:9px;padding:9px 14px;font:inherit;font-weight:800;color:inherit;white-space:nowrap;}

.nt-prog{height:3px;background:transparent;border-radius:3px;overflow:hidden;margin:-6px 0 12px;}
.nt-prog span{display:block;height:100%;width:0;background:var(--primary);transition:width .25s;}

/* abas */
.nt-tabs{display:flex;gap:4px;background:var(--line-soft);padding:4px;border-radius:12px;margin-bottom:14px;width:fit-content;max-width:100%;overflow-x:auto;}
.nt-tab{border:0;background:transparent;font:inherit;font-size:14px;font-weight:700;color:var(--ink-3);padding:9px 16px;border-radius:9px;white-space:nowrap;}
.nt-tab b{display:inline-block;min-width:22px;padding:1px 7px;margin-left:6px;border-radius:20px;background:#fff;color:var(--ink-2);font-size:12px;text-align:center;}
.nt-tab.on{background:var(--accent);color:var(--primary);box-shadow:0 1px 3px rgba(4,45,77,.18);}
.nt-tab.on b{background:var(--primary);color:var(--accent);}
.nt-tab b.alerta{background:var(--bad);color:#fff;}

/* resumo por gravidade */
.nt-sev{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px;}
.sv{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;font:inherit;display:flex;align-items:center;gap:12px;}
.sv:hover{border-color:#b9c8d8;}
.sv .n{font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;min-width:34px;}
.sv .l{font-size:13px;font-weight:700;color:var(--ink-2);}
.sv .l small{display:block;font-size:11.5px;font-weight:500;color:var(--ink-4);}
.sv.urgente .n{color:var(--bad);} .sv.aviso .n{color:var(--warn);} .sv.info .n{color:var(--info);}
.sv.on.urgente{border-color:var(--bad-line);background:#fff5f5;}
.sv.on.aviso{border-color:var(--warn-line);background:#fffbf0;}
.sv.on.info{border-color:var(--info-line);background:#f5f9ff;}
.sv.zero{opacity:.55;}

/* módulos */
.nt-mods{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.md{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-2);}
.md b{color:var(--ink-4);font-weight:700;margin-left:4px;}
.md.on{background:var(--accent);border-color:var(--accent);color:var(--primary);}
.md.on b{color:var(--primary);opacity:.65;}

/* lista */
.grp{margin-bottom:18px;}
.grp-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--ink-2);margin:0 0 8px 2px;}
.grp-h i{width:10px;height:10px;border-radius:3px;}
.ni{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:start;background:#fff;
  border:1px solid var(--line);border-radius:14px;padding:14px 16px 14px 18px;margin-bottom:8px;box-shadow:0 1px 2px rgba(4,45,77,.04);}
.ni::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--ink-5);}
.ni.urgente::before{background:var(--bad-line);} .ni.aviso::before{background:var(--warn-line);} .ni.info::before{background:var(--info-line);}
.ni.novo{border-color:#cbd8e6;box-shadow:0 2px 10px rgba(4,45,77,.08);}
.ni.chegou{animation:ntChegou 1.4s ease-out;}
@keyframes ntChegou{0%{background:#f3ffd9;transform:translateY(-6px);opacity:.3}30%{opacity:1;transform:none}100%{background:#fff}}
@media (prefers-reduced-motion:reduce){.ni.chegou{animation:none;}}
.ni-ic{width:44px;height:44px;border-radius:12px;background:var(--line-soft);display:flex;align-items:center;justify-content:center;font-size:21px;}
.ni.urgente .ni-ic{background:var(--bad-bg);} .ni.aviso .ni-ic{background:var(--warn-bg);} .ni.info .ni-ic{background:var(--info-bg);}
.ni-t{font-size:15px;font-weight:800;color:var(--primary);line-height:1.3;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.ni-nova{font-size:10.5px;font-weight:800;background:var(--accent);color:var(--primary);padding:2px 7px;border-radius:5px;}
.ni-d{font-size:13.5px;color:var(--ink-2);margin-top:3px;line-height:1.45;}
.ni-m{font-size:12px;color:var(--ink-4);margin-top:6px;display:flex;gap:4px 12px;flex-wrap:wrap;}
.ni-m b{color:var(--ink-3);font-weight:700;}
.ni-det{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;}
.ni-det span{background:var(--line-soft);border-radius:8px;padding:5px 9px;font-size:12px;color:var(--ink-2);}
.ni-det span em{font-style:normal;color:var(--ink-4);margin-right:4px;}
.ni-mais{border:0;background:none;padding:0;margin-top:6px;font:inherit;font-size:12px;font-weight:700;color:var(--info);}
.ni-a{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.ni-b{height:40px;padding:0 13px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:13px;font-weight:700;
  color:var(--primary);display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap;}
.ni-b:hover{border-color:var(--primary);}
.ni-b.ok{background:var(--ok-bg);border-color:transparent;color:#166534;}
.ni-b.ok:hover{background:#bbf7d0;}
.ni.resolvida{opacity:.78;}
.ni.resolvida::before{background:var(--ok-line);}
.ni.resolvida .ni-ic{background:var(--ok-bg);}

.nt-vazio{text-align:center;padding:56px 20px;background:#fff;border:1.5px dashed var(--line);border-radius:16px;color:var(--ink-3);}
.nt-vazio .ic{font-size:40px;}
.nt-vazio b{display:block;font-size:16px;color:var(--primary);margin-top:8px;}
.nt-vazio p{margin:4px 0 0;font-size:13px;}
.nt-rodape{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}

/* configuração (gaveta) */
.nt-ov{position:fixed;inset:0;z-index:600;background:rgba(3,32,54,.45);display:none;justify-content:flex-end;}
.nt-ov.on{display:flex;}
.nt-drw{width:min(420px,100%);height:100%;background:#fff;box-shadow:-12px 0 40px rgba(4,45,77,.2);display:flex;flex-direction:column;}
.nt-drw-h{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);}
.nt-drw-h h2{margin:0;font-size:17px;font-weight:800;color:var(--primary);}
.nt-drw-h p{margin:2px 0 0;font-size:12px;color:var(--ink-3);}
.nt-x{width:38px;height:38px;border-radius:10px;border:0;background:var(--line-soft);font-size:16px;color:var(--ink-3);}
.nt-drw-b{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px;}
.cf-sec h3{margin:0 0 8px;font-size:13px;font-weight:800;color:var(--ink-2);}
.cf-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;background:#f8fafc;margin-bottom:6px;}
.cf-row .tx{flex:1;font-size:14px;font-weight:700;color:var(--primary);}
.cf-row .tx small{display:block;font-size:12px;font-weight:500;color:var(--ink-3);margin-top:1px;}
.cf-row .tst{height:34px;padding:0 10px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:12px;font-weight:700;color:var(--primary);}
.sw{position:relative;width:46px;height:26px;flex-shrink:0;}
.sw input{opacity:0;width:0;height:0;position:absolute;}
.sw span{position:absolute;inset:0;background:var(--ink-5);border-radius:20px;transition:background .15s;cursor:pointer;}
.sw span::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.sw input:checked+span{background:var(--primary);}
.sw input:checked+span::after{transform:translateX(20px);background:var(--accent);}
.sw input:focus-visible+span{outline:2px solid var(--primary);outline-offset:2px;}
.cf-vol{display:flex;align-items:center;gap:10px;padding:6px 12px;}
.cf-vol input{flex:1;accent-color:var(--primary);height:28px;}
.cf-nota{font-size:12px;color:var(--ink-3);line-height:1.5;background:var(--line-soft);border-radius:10px;padding:10px 12px;}

@media (max-width:700px){
  .nt-sev{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;}
  .sv{flex-direction:column;align-items:flex-start;gap:4px;padding:10px;}
  .sv .n{font-size:24px;}
  .sv .l small{display:none;}
  .ni{grid-template-columns:36px minmax(0,1fr);gap:10px;padding:12px 12px 12px 16px;}
  .ni-ic{width:36px;height:36px;font-size:17px;border-radius:10px;}
  .ni-a{grid-column:1/-1;justify-content:stretch;}
  .ni-a>*{flex:1;justify-content:center;}
  .nt-acts{width:100%;} .nt-acts .nt-btn{flex:1;justify-content:center;}
  #notif-clock{display:none;}
  .topbar-user > div:last-child{display:none;}
}
</style>
</head>
<body>
<div id="sidebar-container"></div>

<header class="topbar" id="topbar">
  <button class="topbar-open-sidebar" onclick="toggleSidebar()">☰</button>
  <div class="topbar-title">Notificações</div>
  <div class="topbar-right">
    <span id="notif-clock" style="font-size:13px;color:#64748b;font-weight:500;"></span>
    <div class="topbar-user">
      <div class="user-avatar" style="width:34px;height:34px;font-size:13px;" id="top-avatar">SA</div>
      <div>
        <div class="topbar-user-name" id="top-user-name">Super Admin</div>
        <div class="topbar-user-profile" id="top-user-perfil">SADM</div>
      </div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()" style="color:#94a3b8;">Sair</button>
  </div>
</header>

<main class="main-content" id="main-content">
 <div class="nt-wrap">

  <div class="nt-head">
    <div>
      <h1>Notificações</h1>
      <div class="nt-live" id="nt-live"><span class="dot"></span><span id="nt-live-txt">Conectando…</span></div>
    </div>
    <div class="nt-acts">
      <button type="button" class="nt-btn" id="btn-som" onclick="abrirConfig()">🔊 Som e avisos</button>
      <button type="button" class="nt-btn pri" id="btn-verificar" onclick="verificarAlertas(true)">Verificar agora</button>
    </div>
  </div>

  <div id="nt-faixas"></div>
  <div class="nt-prog" id="nt-prog"><span id="nt-prog-fill"></span></div>

  <div class="nt-tabs" role="tablist" id="nt-tabs">
    <button type="button" class="nt-tab on" role="tab" data-v="abertas" onclick="setView('abertas')">Para resolver<b id="c-abertas">0</b></button>
    <button type="button" class="nt-tab" role="tab" data-v="novas" onclick="setView('novas')">Novas<b id="c-novas">0</b></button>
    <button type="button" class="nt-tab" role="tab" data-v="resolvidas" onclick="setView('resolvidas')">Resolvidas<b id="c-resolvidas">0</b></button>
  </div>

  <div class="nt-sev" id="nt-sev"></div>
  <div class="nt-mods" id="nt-mods"></div>
  <div id="notif-falhas"></div>

  <div id="notif-loading" style="text-align:center;padding:60px 20px;color:var(--ink-4);">
    <div class="spin" style="width:36px;height:36px;border-width:3px;margin:0 auto 14px;"></div>
    <div style="font-size:14px;font-weight:600;">Conferindo os módulos…</div>
  </div>
  <div id="nt-lista"></div>
 </div>
</main>

<!-- CONFIGURAÇÃO: som e avisos deste aparelho -->
<div class="nt-ov" id="nt-cfg" onclick="if(event.target===this)fecharConfig()">
  <div class="nt-drw" role="dialog" aria-modal="true" aria-labelledby="cfg-tit">
    <div class="nt-drw-h">
      <div><h2 id="cfg-tit">Som e avisos</h2><p>Vale para este computador ou celular</p></div>
      <button type="button" class="nt-x" onclick="fecharConfig()" aria-label="Fechar">✕</button>
    </div>
    <div class="nt-drw-b" id="cfg-body"></div>
  </div>
</div>

<div id="toast-container"></div>

<script>
/* ═══════════════════════════════════════════════════════
   ESTADO
   ═══════════════════════════════════════════════════════ */
let _notifs = [];
let _view = 'abertas', _sev = '', _mod = '';
const _detAberto = new Set();
let _semMigracao = false, _verificando = false, _ultimaVerif = 0;
const VERIF_MS = 5 * 60 * 1000;

const MODULOS = {
  producao:      { icon:'⚙️', label:'Produção',      href:'producao.html' },
  laboratorio:   { icon:'🧪', label:'Laboratório',   href:'laboratorio.html' },
  manutencao:    { icon:'🔧', label:'Manutenção',    href:'manutencao.html' },
  almoxarifado:  { icon:'📦', label:'Almoxarifado',  href:'almoxarifado.html' },
  insumos:       { icon:'🧱', label:'Insumos',       href:'insumos.html' },
  epi:           { icon:'🦺', label:'EPI',           href:'epi.html' },
  portaria:      { icon:'🚛', label:'Portaria',      href:'portaria.html' },
  expedicao:     { icon:'📤', label:'Expedição',     href:'expedicao.html' },
  frota:         { icon:'🚗', label:'Frota',         href:'frota.html' },
  abastecimento: { icon:'⛽', label:'Abastecimento', href:'abastecimento.html' },
  bpf:           { icon:'📋', label:'BPF',           href:'bpf.html' },
  rh:            { icon:'👥', label:'RH',            href:'rh.html' },
  equipamentos:  { icon:'🛠️', label:'Equipamentos',  href:'equip-gerais.html' },
  compras:       { icon:'🛒', label:'Compras',       href:'compras.html' },
  carregamento:  { icon:'🚚', label:'Carregamento',  href:'carregamento.html' },
  terceiros:     { icon:'🤝', label:'Terceiros',     href:'terceiros.html' },
  sistema:       { icon:'🔔', label:'Sistema',       href:'' },
};
const SEV = {
  urgente:{ rot:'Urgente',     sub:'pede ação agora',   cor:'var(--bad-line)'  },
  aviso:  { rot:'Aviso',       sub:'resolver hoje',     cor:'var(--warn-line)' },
  info:   { rot:'Informativo', sub:'para acompanhar',   cor:'var(--info-line)' },
};
const ORD_SEV = { urgente:0, aviso:1, info:2 };

/* ── utilitários ── */
function _hojeLocal(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function _diaLocal(n){ const d=new Date(); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fmtData(d){ return d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}):'—'; }
const esc = v => String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function haQuanto(iso){
  if(!iso) return '';
  const s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<60) return 'agora';
  if(s<3600) return `há ${Math.floor(s/60)} min`;
  if(s<86400) return `há ${Math.floor(s/3600)} h`;
  const d=Math.floor(s/86400); if(d===1) return 'ontem';
  if(d<7) return `há ${d} dias`;
  return new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
}
const _st   = n => n.status_notif || (n.lida ? 'visto' : 'novo');
const _tipo = n => (n.tipo==='alerta' ? 'urgente' : (SEV[n.tipo] ? n.tipo : 'info'));
const _nomeUser = () => { try{ const u=getUser(); return (u&&(u.nome||u.login))||'Usuário'; }catch(e){ return 'Usuário'; } };
const _chaveBase = c => String(c||'').replace(/_\d{4}-\d{2}(-\d{2})?$/,'');
const _qtd = t => { const m=String(t||'').match(/\d+/); return m?parseInt(m[0]):0; };
function _detObj(d){ if(!d) return null; if(typeof d==='object') return d; try{ return JSON.parse(d); }catch(e){ return null; } }
const _ROT_DET = { quantidade:'Quantidade', linhas:'Linhas', linha:'Linha', dia:'Dia', data:'Data', itens:'Itens', os:'OS', veiculos:'Veículos',
  reprovados:'Reprovados', pendentes:'Pendentes', total:'Total', ordens:'Ordens', documentos:'Documentos', nome:'Nome', atual:'Atual', min:'Mínimo' };
function _detHTML(d){
  const o=_detObj(d); if(!o||typeof o!=='object') return '';
  const val=v=>Array.isArray(v)
    ? v.map(x=>(x&&typeof x==='object')?Object.entries(x).map(([k,y])=>(_ROT_DET[k]?_ROT_DET[k]+': ':'')+(y??'—')).join(' · '):x).join(' | ')
    : (v&&typeof v==='object'?Object.values(v).join(' · '):v);
  return Object.entries(o).filter(([k,v])=>k!=='chave'&&v!==''&&v!=null&&!(Array.isArray(v)&&!v.length))
    .map(([k,v])=>`<span><em>${esc(_ROT_DET[k]||k)}</em>${esc(val(v))}</span>`).join('');
}

/* ═══════════════════════════════════════════════════════
   CARREGAR
   ═══════════════════════════════════════════════════════ */
async function carregarSalvas(){
  try{
    const lim = new Date(Date.now()-7*86400000).toISOString();
    const r = await _supabase.from('notificacoes').select('*')
      .or(`status_notif.neq.concluido,resolvido_em.gte.${lim}`).order('created_at',{ascending:false}).limit(500);
    if(r.error){
      // tabela ainda sem as colunas da migração 061
      if(/status_notif|resolvido_em|column/i.test(r.error.message||'')){
        _semMigracao = true;
        const r2 = await _supabase.from('notificacoes').select('*').order('created_at',{ascending:false}).limit(300);
        _notifs = r2.data||[];
        return;
      }
      throw r.error;
    }
    _semMigracao = false;
    _notifs = r.data||[];
  }catch(e){ console.warn('[notificações] carregar:',e); }
}
/* ═══════════════════════════════════════════════════════
   VERIFICAR — confere os módulos e sincroniza com o banco
   Roda ao abrir, a cada 5 min com a tela aberta e no botão.
   ═══════════════════════════════════════════════════════ */
async function verificarAlertas(manual){
  if(_verificando) return;
  _verificando = true;
  const btn=document.getElementById('btn-verificar');
  if(btn){ btn.disabled=true; btn.textContent='Verificando…'; }
  const fill=document.getElementById('nt-prog-fill');
  const hoje=_hojeLocal(), em7dias=_diaLocal(7);
  const gerados=[], falhas=[], fontesOk=new Set();

  async function passo(pct, label, fn){
    if(fill) fill.style.width=pct+'%';
    const fonte = String(label).replace(/[^A-Za-zÀ-ÿ ]/g,'').replace(/Verificando/i,'').trim().toLowerCase();
    const out=[];
    try{
      await fn(out, hoje, em7dias);
      fontesOk.add(fonte);
      out.forEach(n=>{ n.fonte=fonte; n.chave=_chaveBase(n.chave); n.detalhe=_detObj(n.detalhe); gerados.push(n); });
    }catch(e){
      falhas.push({ fonte: fonte || label, erro: (e && e.message) ? e.message : String(e) });
      console.warn('[notificações] falhou:', label, e);
    }
  }

  // ── 01 PRODUÇÃO ──────────────────────────────────────
  await passo(6, '⚙️ Verificando Produção...', async(out)=>{
    const mes = _hojeLocal().slice(0,7);
    const {data:lancs} = await _supabase.from('producao').select('id,linha,status,data,turno').gte('data',mes+'-01').lte('data',mes+'-31');
    const l = lancs||[];
    const reprovados = l.filter(x=>x.status==='reprovado');
    const emAnalise  = l.filter(x=>x.status==='em_analise');
    // Sem lançamento ONTEM por linha (o fechamento da fábrica é D-1; domingo não cobra)
    const {data:linhas} = await _supabase.from('linhas_producao').select('nome').eq('status','ativo');
    const ontem_ = _diaLocal(-1);
    const {data:lancOntem} = await _supabase.from('producao').select('linha').eq('data',ontem_);
    const linhasOntem = new Set((lancOntem||[]).map(x=>x.linha));
    if(new Date(ontem_+'T12:00:00').getDay()!==0)
      (linhas||[]).forEach(ln=>{
        if(!linhasOntem.has(ln.nome))
          out.push({tipo:'aviso',modulo:'producao',titulo:`${ln.nome}: sem OP lançada ontem`,
            descricao:`A linha ${ln.nome} não tem lançamento de produção em ${fmtData(ontem_)}. Se a linha rodou, falta lançar a OP.`,

      out.push({tipo:'urgente',modulo:'producao',titulo:'Lançamentos reprovados',
        descricao:`${reprovados.length} lançamento(s) com status REPROVADO no mês atual.`,
        detalhe:JSON.stringify({quantidade:reprovados.length,linhas:[...new Set(reprovados.map(x=>x.linha))].join(', ')}),
        chave:`prod_reprovados_${mes}`});
    if(emAnalise.length)
      out.push({tipo:'aviso',modulo:'producao',titulo:'Lançamentos em análise',
        descricao:`${emAnalise.length} lançamento(s) aguardando aprovação do laboratório.`,
        detalhe:JSON.stringify({quantidade:emAnalise.length}),chave:`prod_analise_${hoje}`});
  });

  // ── 02 LABORATÓRIO ───────────────────────────────────

        detalhe:JSON.stringify({quantidade:vencidas.length,tipos:[...new Set(vencidas.map(x=>x.tipo))].join(', ')}),

    if(aVencer.length)
      out.push({tipo:'aviso',modulo:'laboratorio',titulo:'Análises externas do Caulim vencendo',
        descricao:`${aVencer.length} análise(s) externa(s) vencendo nos próximos 60 dias — providencie a renovação.`,
        detalhe:JSON.stringify({quantidade:aVencer.length,tipos:[...new Set(aVencer.map(x=>x.tipo))].join(', ')}),
        chave:`caulim_ext_avencer_${hoje}`});
    const {data:lotes} = await _supabase.from('caulim_lotes_producao').select('id,numero,status').in('status',['bloqueado','reprovado']);
    if((lotes||[]).length)
      out.push({tipo:'urgente',modulo:'laboratorio',titulo:'Lotes de Caulim bloqueados/reprovados',
        descricao:`${lotes.length} lote(s) de produção do Caulim BLOQUEADO(S) ou REPROVADO(S).`,
        detalhe:JSON.stringify({lotes:lotes.map(x=>x.numero).join(', ')}),chave:`caulim_lotes_bloq_${hoje}`});
  });

  // ── 14 COMPRAS ────────────────────────────────────────
  await passo(88, '🛒 Verificando Compras...', async(out)=>{
    const {data:peds} = await _supabase.from('compras_pedidos').select('id,status').in('status',['emitido','em_cotacao','aprovada','pendente']);
    if((peds||[]).length>5)
      out.push({tipo:'aviso',modulo:'compras',titulo:'Pedidos de compra em aberto',
        descricao:`${peds.length} pedido(s) de compra em aberto aguardando recebimento/fechamento.`,
        detalhe:JSON.stringify({quantidade:peds.length}),chave:`compras_peds_${hoje}`});
    const {data:sols} = await _supabase.from('compras_solicitacoes').select('id').in('status',['aberta','pendente']);
    if((sols||[]).length)
      out.push({tipo:'info',modulo:'compras',titulo:'Solicitações de compra pendentes',
        descricao:`${sols.length} solicitação(ões) de compra aguardando cotação/aprovação.`,
        detalhe:JSON.stringify({quantidade:sols.length}),chave:`compras_sols_${hoje}`});
  });

  // ── 15 CARREGAMENTO ───────────────────────────────────
  await passo(94, '📦 Verificando Carregamento...', async(out)=>{
    const em3dias = new Date(Date.now()-3*86400000).toISOString().split('T')[0];
    // Status real do romaneio: recebido | em_carregamento | carregado | finalizado
    const {data:roms} = await _supabase.from('romaneios').select('id,status,data_emissao').in('status',['recebido','em_carregamento']);
    const parados = (roms||[]).filter(x=>x.data_emissao && x.data_emissao < em3dias);

  });

  // ── 16 TERCEIROS ──────────────────────────────────────
  await passo(97, '🤝 Verificando Terceiros...', async(out)=>{
    const em15dias = new Date(Date.now()-15*86400000).toISOString().split('T')[0];
    const {data:servs} = await _supabase.from('terceiros_servicos').select('id,status,data').in('status',['aberto','medido']);
    const antigos = (servs||[]).filter(x=>x.data && x.data<em15dias);

      out.push({tipo:'aviso',modulo:'terceiros',titulo:'Serviços de terceiros em aberto há mais de 15 dias',

  if(fill) fill.style.width='100%';

  render();
  setTimeout(()=>{ if(fill) fill.style.width='0'; }, 600);
  if(btn){ btn.disabled=false; btn.textContent='Verificar agora'; }
  _verificando = false;
  if(manual && typeof toast==='function') toast('Verificação concluída.','success');
}

/* Uma notificação ABERTA por condição (chave):
   • condição nova            → insere (toca o som)
   • piorou (mais itens ou
     tipo mais grave)         → atualiza e volta para "Nova" (toca de novo)
   • mudou o texto            → só atualiza
   • deixou de existir        → resolvida sozinha (só se a fonte respondeu)   */
async function sincronizar(gerados, fontesOk){
  await carregarSalvas();
  if(_semMigracao){
    // sem as colunas novas não dá para gravar: mostra o que foi encontrado agora, só na tela
    _notifs = _notifs.concat(gerados.map((g,i)=>({...g, id:'tmp-'+i, status_notif:'novo', created_at:new Date().toISOString(), _tmp:true})));
    return;
  }
  const abertas = _notifs.filter(n=>_st(n)!=='concluido' && n.chave);
  const porChave = new Map(abertas.map(n=>[n.chave,n]));
  const chavesAgora = new Set(gerados.map(g=>g.chave));
  const agora = new Date().toISOString();
  const tarefas = [], chegaram = [];

  for(const g of gerados){
    const ex = porChave.get(g.chave);
    if(!ex){
      tarefas.push((async()=>{
        const {data,error} = await _supabase.from('notificacoes').insert({
          tipo:g.tipo, modulo:g.modulo, titulo:g.titulo, descricao:g.descricao, detalhe:g.detalhe||null,
          chave:g.chave, fonte:g.fonte, status_notif:'novo', lida:false }).select('*').single();
        if(!error && data){ _notifs.unshift(data); chegaram.push(data); }
      })());
      continue;
    }
    const piorou = (ORD_SEV[g.tipo]??2) < (ORD_SEV[_tipo(ex)]??2) || _qtd(g.descricao) > _qtd(ex.descricao);
    if(piorou || ex.descricao!==g.descricao || ex.titulo!==g.titulo || ex.tipo!==g.tipo){
      const upd = { tipo:g.tipo, titulo:g.titulo, descricao:g.descricao, detalhe:g.detalhe||null, atualizado_em:agora };
      if(piorou && _st(ex)!=='novo') Object.assign(upd,{ status_notif:'novo', lida:false });
      tarefas.push((async()=>{
        const {data,error} = await _supabase.from('notificacoes').update(upd).eq('id',ex.id).select('*').single();
        if(!error && data){ Object.assign(ex,data); if(piorou) chegaram.push(ex); }
      })());
    }
  }
  for(const n of abertas){
    if(n.fonte && fontesOk.has(n.fonte) && !chavesAgora.has(n.chave)){
      const upd = { status_notif:'concluido', lida:true, resolvido_em:agora, resolvido_por:'Sistema — o problema deixou de existir' };
      tarefas.push(_supabase.from('notificacoes').update(upd).eq('id',n.id).then(({error})=>{ if(!error){ Object.assign(n,upd); AvisoNotif.confirmar(n.id); } }));
    }
  }
  // resolvidas há mais de 30 dias saem do banco
  tarefas.push(_supabase.from('notificacoes').delete().eq('status_notif','concluido')
    .lt('resolvido_em', new Date(Date.now()-30*86400000).toISOString()).then(()=>{},()=>{}));
  await Promise.all(tarefas.map(t=>Promise.resolve(t).catch(e=>console.warn('[notificações] gravar:',e))));
  // um som só (o do mais grave); o resto entra calado na lista
  chegaram.sort((a,b)=>(ORD_SEV[_tipo(a)]??2)-(ORD_SEV[_tipo(b)]??2));
  chegaram.forEach((n,i)=>{ _chegou.add(n.id); AvisoNotif.anunciar(n,{silencioso:i>0,denovo:true}); });
  if(chegaram.length>1 && typeof toast==='function') toast(`${chegaram.length} notificações novas`,'warning');
}
/* ═══════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════ */
const _chegou = new Set();   // ids que acabaram de chegar (animação)
function setView(v){ _view=v; _sev=''; _mod=''; render(); }
function setSev(s){ _sev=_sev===s?'':s; render(); }
function setMod(m){ _mod=_mod===m?'':m; render(); }

function render(){
  const abertas = _notifs.filter(n=>_st(n)!=='concluido');
  const novas   = _notifs.filter(n=>_st(n)==='novo');
  const resolv  = _notifs.filter(n=>_st(n)==='concluido');
  const cn=document.getElementById('c-novas');
  document.getElementById('c-abertas').textContent=abertas.length;
  cn.textContent=novas.length; cn.classList.toggle('alerta',novas.some(n=>_tipo(n)==='urgente'));
  document.getElementById('c-resolvidas').textContent=resolv.length;
  document.querySelectorAll('.nt-tab').forEach(b=>{ const on=b.dataset.v===_view; b.classList.toggle('on',on); b.setAttribute('aria-selected',on); });
  document.title = (novas.length?`(${novas.length}) `:'')+'Notificações — ERP Industrial';

  const base = _view==='novas'?novas:_view==='resolvidas'?resolv:abertas;

  // resumo por gravidade (não aparece em Resolvidas)
  const sevEl=document.getElementById('nt-sev');
  sevEl.style.display=_view==='resolvidas'?'none':'';
  sevEl.innerHTML=Object.entries(SEV).map(([k,c])=>{
    const q=base.filter(n=>_tipo(n)===k).length;
    return `<button type="button" class="sv ${k}${_sev===k?' on':''}${q?'':' zero'}" onclick="setSev('${k}')" aria-pressed="${_sev===k}">
      <span class="n">${q}</span><span class="l">${c.rot}<small>${c.sub}</small></span></button>`;
  }).join('');

  let lista = base.filter(n=>!_sev||_tipo(n)===_sev);
  // módulos presentes
  const mods={}; lista.forEach(n=>{ const m=MODULOS[n.modulo]?n.modulo:'sistema'; mods[m]=(mods[m]||0)+1; });
  if(_mod&&!mods[_mod]) _mod='';
  document.getElementById('nt-mods').innerHTML=Object.keys(mods).length>1||_mod
    ? Object.entries(mods).sort((a,b)=>b[1]-a[1]).map(([m,q])=>`<button type="button" class="md${_mod===m?' on':''}" onclick="setMod('${m}')">${MODULOS[m].icon} ${MODULOS[m].label}<b>${q}</b></button>`).join('')
    : '';
  if(_mod) lista=lista.filter(n=>(MODULOS[n.modulo]?n.modulo:'sistema')===_mod);

  const el=document.getElementById('nt-lista');
  if(!lista.length){
    const msg = _view==='resolvidas'
      ? ['📭','Nada resolvido nos últimos 7 dias','']
      : ['✅','Tudo em ordem', _view==='novas'?'Nenhuma notificação nova.':'Nenhum problema aberto nos módulos verificados.'];
    el.innerHTML=`<div class="nt-vazio"><div class="ic">${msg[0]}</div><b>${msg[1]}</b><p>${msg[2]}</p></div>`;
    return;
  }

  if(_view==='resolvidas'){
    lista.sort((a,b)=>String(b.resolvido_em||b.created_at).localeCompare(String(a.resolvido_em||a.created_at)));
    el.innerHTML=lista.map(itemHTML).join('')+
      `<div class="nt-rodape"><button type="button" class="nt-btn" onclick="limparResolvidas()">Limpar resolvidas</button></div>`;
  } else {
    lista.sort((a,b)=>{
      const sa=_st(a)==='novo'?0:1, sb=_st(b)==='novo'?0:1; if(sa!==sb) return sa-sb;
      return String(b.atualizado_em||b.created_at).localeCompare(String(a.atualizado_em||a.created_at));
    });
    el.innerHTML=Object.keys(SEV).map(k=>{
      const it=lista.filter(n=>_tipo(n)===k); if(!it.length) return '';
      return `<section class="grp"><div class="grp-h"><i style="background:${SEV[k].cor};"></i>${SEV[k].rot} · ${it.length}</div>${it.map(itemHTML).join('')}</section>`;
    }).join('')+(novas.length&&_view!=='resolvidas'
      ? `<div class="nt-rodape"><button type="button" class="nt-btn" onclick="marcarTodasVistas()">Marcar todas como vistas</button></div>`:'');
  }
  _chegou.clear();
}

function itemHTML(n){
  const st=_st(n), tp=_tipo(n), cfg=MODULOS[n.modulo]||MODULOS.sistema;
  const det=_detHTML(n.detalhe), aberto=_detAberto.has(n.id);
  const atual = n.atualizado_em && n.created_at && (new Date(n.atualizado_em)-new Date(n.created_at))>60000;
  const meta=[`<b>${cfg.label}</b>`, haQuanto(n.created_at)];
  if(st!=='concluido' && atual) meta.push('atualizada '+haQuanto(n.atualizado_em));
  if(st==='visto' && n.visto_por) meta.push('vista por '+esc(n.visto_por));
  if(st==='concluido') meta.push('resolvida '+haQuanto(n.resolvido_em||n.atualizado_em)+(n.resolvido_por?' · '+esc(n.resolvido_por):''));
  const id=esc(n.id), tmp=!!n._tmp;
  const acoes = st==='concluido' ? (cfg.href?`<a class="ni-b" href="${cfg.href}">Abrir ${cfg.label}</a>`:'') :
    `${cfg.href?`<a class="ni-b" href="${cfg.href}" onclick="return abrirModulo(event,'${id}','${cfg.href}')">Abrir</a>`:''}
     ${st==='novo'&&!tmp?`<button type="button" class="ni-b" onclick="marcarVisto('${id}')">✓ Vi</button>`:''}
     ${!tmp?`<button type="button" class="ni-b ok" onclick="resolver('${id}')">Resolvido</button>`:''}`;
  return `<article class="ni ${tp} ${st==='novo'?'novo':''} ${st==='concluido'?'resolvida':''} ${_chegou.has(n.id)?'chegou':''}" id="ni-${id}">
    <div class="ni-ic" aria-hidden="true">${st==='concluido'?'✅':cfg.icon}</div>
    <div>
      <div class="ni-t">${esc(n.titulo||'—')}${st==='novo'?'<span class="ni-nova">NOVA</span>':''}</div>
      <div class="ni-d">${esc(n.descricao||n.mensagem||'')}</div>
      <div class="ni-m">${meta.map(m=>`<span>${m}</span>`).join('')}</div>
      ${det?(aberto?`<div class="ni-det">${det}</div><button type="button" class="ni-mais" onclick="togDet('${id}')">Esconder detalhes</button>`
                   :`<button type="button" class="ni-mais" onclick="togDet('${id}')">Ver detalhes</button>`):''}
    </div>
    <div class="ni-a">${acoes}</div>
  </article>`;
}
function togDet(id){ _detAberto.has(id)?_detAberto.delete(id):_detAberto.add(id); render(); }

/* ═══════════════════════════════════════════════════════
   AÇÕES
   ═══════════════════════════════════════════════════════ */
async function _gravar(id, upd){
  const n=_notifs.find(x=>String(x.id)===String(id)); if(!n||n._tmp) return false;
  const antes={...n}; Object.assign(n,upd); render();
  const {error}=await _supabase.from('notificacoes').update(upd).eq('id',id);
  if(error){ Object.assign(n,antes); render(); if(typeof toast==='function') toast('Não foi possível gravar: '+error.message,'danger'); return false; }
  return true;
}
function marcarVisto(id, rerender=true){
  const n=_notifs.find(x=>String(x.id)===String(id));
  AvisoNotif.confirmar(id);
  if(!n||_st(n)!=='novo') return;
  const p=_gravar(id,{status_notif:'visto',lida:true,visto_em:new Date().toISOString(),visto_por:_nomeUser()});
  if(!rerender) return p;
}
async function abrirModulo(ev,id,href){
  ev.preventDefault();
  try{ await Promise.race([marcarVisto(id,false), new Promise(r=>setTimeout(r,1200))]); }catch(e){}
  location.href=href; return false;
}
async function resolver(id){
  AvisoNotif.confirmar(id);
  const ok=await _gravar(id,{status_notif:'concluido',lida:true,resolvido_em:new Date().toISOString(),resolvido_por:_nomeUser()});
  if(ok&&typeof toast==='function') toast('Marcada como resolvida. Se o problema continuar, ela volta na próxima verificação.','success');
}
async function marcarTodasVistas(){
  AvisoNotif.confirmar(null);
  const ids=_notifs.filter(n=>_st(n)==='novo'&&!n._tmp).map(n=>n.id); if(!ids.length) return;
  const upd={status_notif:'visto',lida:true,visto_em:new Date().toISOString(),visto_por:_nomeUser()};
  _notifs.forEach(n=>{ if(ids.includes(n.id)) Object.assign(n,upd); }); render();
  const {error}=await _supabase.from('notificacoes').update(upd).in('id',ids);
  if(error&&typeof toast==='function') toast('Não foi possível gravar: '+error.message,'danger');
}
async function limparResolvidas(){
  if(typeof guardAction==='function' && !guardAction('notificacoes','delete')) return;
  const {error}=await _supabase.from('notificacoes').delete().eq('status_notif','concluido');
  if(error){ if(typeof toast==='function') toast('Não foi possível limpar: '+error.message,'danger'); return; }
  _notifs=_notifs.filter(n=>_st(n)!=='concluido'); render();
}

/* Fonte que não respondeu: sem isso, um alerta que parou de funcionar parece "está tudo bem". */
function _renderFalhasFontes(falhas){
  const box=document.getElementById('notif-falhas');
  if(!falhas||!falhas.length){ box.innerHTML=''; return; }
  box.innerHTML=`<div class="nt-faixa mig"><span class="ic">⚠️</span><span class="tx">${falhas.length} verificação(ões) não responderam: ${falhas.map(f=>esc(f.fonte)).join(', ')}
    <small>Enquanto isso, essas áreas não geram aviso — ausência de notificação aqui não quer dizer que está tudo certo.</small></span></div>`;
}

    <div class="cf-sec"><h3>Aviso na tela do computador</h3>
      <div class="cf-row"><span class="tx">Mostrar quando o ERP estiver em segundo plano<small>${tela}</small></span>
        ${st.tela==='granted'?_sw('cf-tela',p.tela,"cfgSet('tela',this.checked)"):st.tela==='default'?`<button type="button" class="tst" onclick="AvisoNotif.pedirTela().then(()=>renderEstado(AvisoNotif.estado()))">Permitir</button>`:''}</div>
    </div>
    <div class="cf-nota">Os módulos são conferidos ao abrir esta tela e a cada 5 minutos enquanto ela estiver aberta. Notificação gravada por outro módulo (ex.: pedido de correção do laboratório) chega na hora em qualquer tela que use este aviso.</div>`;
}

/* ═══════════════════════════════════════════════════════
   INÍCIO
   ═══════════════════════════════════════════════════════ */
fetch('partials/sidebar.html').then(r=>r.text()).then(html=>{
  document.getElementById('sidebar-container').innerHTML=html;
  document.querySelector('[href="notificacoes.html"]')?.classList.add('active');
  openGroup('principal');
  initSidebar('notificacoes.html');
});
setInterval(()=>{
  const c=document.getElementById('notif-clock');
  if(c) c.textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
},1000);
setInterval(()=>{ renderEstado(); const lista=document.getElementById('nt-lista'); if(!lista.contains(document.activeElement)) render(); }, 30000);   // "há X min" anda sozinho
setInterval(()=>{ if(!document.hidden||Date.now()-_ultimaVerif>2*VERIF_MS) verificarAlertas(false); }, VERIF_MS);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') fecharConfig(); });

async function init(){
  AvisoNotif.iniciar({
    // gravada por outro módulo/aba → entra na lista na hora
    aoChegar: n=>{ if(!_notifs.some(x=>String(x.id)===String(n.id))){ _notifs.unshift(n); _chegou.add(n.id); } render(); },
    aoMudar:  n=>{ const x=_notifs.find(y=>String(y.id)===String(n.id)); if(x){ Object.assign(x,n); render(); } },
  });
  AvisoNotif.aoMudarEstado(renderEstado);
  await carregarSalvas();
  render();
  document.getElementById('notif-loading').style.display=_notifs.length?'none':'';
  await verificarAlertas(false);
  renderEstado();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
</script>
</body>
