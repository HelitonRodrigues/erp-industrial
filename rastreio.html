<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rastreabilidade — Pallet</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<style>
:root{--primary:#042D4D;--accent:#C9FF64;--bg:#f4f7fb;--text:#0b2a4a;--border:#e3e9f0;--muted:#64748b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:16px;-webkit-font-smoothing:antialiased;}
.wrap{max-width:780px;margin:0 auto;}
.head{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:14px 18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(4,45,77,.05);}
.logo{width:56px;height:56px;border-radius:14px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;flex-shrink:0;}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff;}
.head h1{font-size:15.5px;font-weight:800;color:var(--primary);line-height:1.25;}
.head p{font-size:11.5px;color:var(--muted);margin-top:2px;}
.btn-print{margin-left:auto;background:var(--primary);color:#fff;border:0;border-radius:11px;width:42px;height:42px;font-size:17px;cursor:pointer;flex-shrink:0;}
.hero{background:var(--primary);color:#fff;border-radius:20px;padding:20px 22px;margin-bottom:14px;position:relative;overflow:hidden;}
.hero small{display:block;font-size:11.5px;font-weight:700;color:rgba(255,255,255,.7);}
.hero .prod{font-size:24px;font-weight:800;line-height:1.15;margin:4px 0 10px;}
.hero .cod{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700;background:rgba(255,255,255,.1);padding:4px 10px;border-radius:8px;color:var(--accent);}
.hero .st{position:absolute;top:18px;right:18px;}
.hero .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;}
.hero .kpis div{background:rgba(255,255,255,.08);border-radius:12px;padding:9px 11px;}
.hero .kpis small{font-size:10.5px;} .hero .kpis b{display:block;font-size:15px;font-weight:800;margin-top:2px;}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(4,45,77,.05);}
.sec{font-size:14px;font-weight:800;color:var(--primary);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.sec::before{content:'';width:4px;height:16px;border-radius:3px;background:var(--accent);box-shadow:0 0 0 1px var(--primary) inset;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;}
.it{background:#f8fafc;border-radius:12px;padding:10px 12px;}
.it small{display:block;font-size:10.5px;font-weight:700;color:#94a3b8;}
.it b{display:block;font-size:14px;font-weight:700;color:var(--primary);margin-top:2px;word-break:break-word;}
.it.w{grid-column:1/-1;}
.eq{display:flex;flex-direction:column;gap:4px;margin-top:4px;} .eq span{font-size:13.5px;font-weight:700;color:var(--primary);}
.badge{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:800;}
.b-ok{background:#dcfce7;color:#166534;}.b-pend{background:#fef3c7;color:#92400e;}.b-rej{background:#fee2e2;color:#991b1b;}.b-info{background:#dbeafe;color:#1e40af;}.b-gray{background:#f1f5f9;color:#475569;}
.qual{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.an{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-top:12px;}
.vazio{font-size:13px;color:var(--muted);}
.tl{display:flex;flex-direction:column;gap:0;margin-top:2px;}
.tl div{display:grid;grid-template-columns:22px 1fr;gap:10px;padding-bottom:12px;position:relative;}
.tl div::before{content:'';position:absolute;left:10px;top:22px;bottom:0;width:2px;background:#e2e8f0;} .tl div:last-child::before{display:none;}
.tl i{width:22px;height:22px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:11px;font-style:normal;} .tl i.on{background:var(--accent);}
.tl b{font-size:13.5px;color:var(--primary);} .tl span{display:block;font-size:12px;color:var(--muted);}
table{width:100%;border-collapse:collapse;}
th{background:#f1f5f9;color:#475569;padding:8px 10px;text-align:left;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;}
td{padding:9px 10px;border-top:1px solid #f1f5f9;font-size:12.5px;vertical-align:top;}
.foot{text-align:center;font-size:11px;color:var(--muted);margin-top:18px;}
.loading,.err{text-align:center;padding:40px 20px;color:var(--muted);background:#fff;border:1px solid var(--border);border-radius:18px;}
.err{color:#92400e;}
@media (max-width:560px){ .hero .kpis{grid-template-columns:1fr 1fr;} .hero .prod{font-size:20px;} .hero .st{position:static;margin-bottom:8px;} }
@media print{.no-print{display:none;}body{padding:0;background:#fff;}.card,.head{box-shadow:none;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo" id="logo">🏭</div>
    <div style="min-width:0;"><h1 id="empresa">Rastreabilidade</h1><p id="emp-info"></p><p id="sub">Rastreabilidade do produto</p></div>
    <button class="btn-print no-print" onclick="window.print()" title="Imprimir">🖨️</button>
  </div>
  <div id="conteudo"><div class="loading">Carregando informações…</div></div>
  <div class="foot">Consulta de rastreabilidade · <span id="ts"></span></div>
</div>

<script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtData(d){if(!d)return '—';try{return new Date((''+d).length<=10?d+'T12:00':d).toLocaleDateString('pt-BR');}catch(e){return d;}}
function fmtDataHora(d){if(!d)return '—';try{return new Date(d).toLocaleString('pt-BR');}catch(e){return d;}}
function palCodigo(p){if(p.codigo)return p.codigo;const lin=(p.linha||'').replace(/[^A-Za-z0-9]/g,'').substring(0,3).toUpperCase()||'LIN';const dt=(p.data||'').replace(/-/g,'');const op=(p.producao&&p.producao.op_numero)?String(p.producao.op_numero).split('-').pop():'0000';return `${lin}-${dt}-${op}-P${String(p.numero||0).padStart(3,'0')}`;}
function poMatch(p){const po=p.producao&&p.producao.produtos_op;if(Array.isArray(po))return po.find(x=>x.produto===p.produto)||po[0]||{};return {};}
function loteDe(p){const m=poMatch(p);return m.lote||p.lote||(p.producao&&p.producao.lote_mp)||'—';}
// Validade fixa (não depende do cadastro de produtos, que nem sempre tem
// validade_dias preenchido): 3 anos (1095 dias) para produtos com ficha
// técnica regulatória (25kg/bigbag/granel/Caulim), 2 anos (730 dias) para
// os demais — mesma regra usada na emissão do rótulo em aferidor.html.
function isFichaPallet(p){
  const linhaProd=poMatch(p).linha_produto||'';
  const lp=linhaProd.toLowerCase().replace(/\s/g,'');
  return lp.includes('25kg')||lp.includes('bag')||lp.includes('granel')||lp.includes('granl')||lp.includes('bigbag');
}
function validadeDe(p){
  const vp=poMatch(p).validade; if(vp) return fmtData(vp);   // validade gravada na OP manda
  const dias=isFichaPallet(p)?1095:730;
  const base=p.data?new Date(((''+p.data).length<=10?p.data+'T12:00':p.data)):null;
  if(!base||isNaN(base.getTime()))return '—';
  base.setDate(base.getDate()+dias);
  return base.toLocaleDateString('pt-BR');
}
function turnoDe(p){return p.turno||(p.producao&&p.producao.turno)||'—';}
function encarregadoDe(p){return (p.producao&&p.producao.encarregado)||p.encarregado||'—';}
function equipeLista(p){let eq=p.equipe||(p.producao&&p.producao.equipe);
  if(typeof eq==='string'){ const t=eq.trim(); if(/^[\[{]/.test(t)){ try{ eq=JSON.parse(t.replace(/^\{/,'[').replace(/\}$/,']')); }catch(e){ eq=t.replace(/^[\[{]|[\]}]$/g,'').split(','); } } else eq=t.split(','); }
  return (Array.isArray(eq)?eq:[]).map(x=>String(x&&x.nome||x||'').replace(/^"|"$/g,'').trim()).filter(Boolean);}
function equipeDe(p){const l=equipeLista(p);return l.length?l.join(', '):'—';}
function statusBadge(p){const s=p.status||'pendente';if(s==='aprovado')return '<span class="badge b-ok">✓ Aprovado</span>';if(s==='reprovado')return '<span class="badge b-rej">✕ Reprovado</span>';return '<span class="badge b-pend">⏳ Aguardando análise</span>';}
function analiseTxt(p){if(!p.analise)return '';if(typeof p.analise==='string')return p.analise;try{return JSON.stringify(p.analise,null,2);}catch(e){return String(p.analise);}}

const SEL='*,producao(op_numero,produtos_op,encarregado,equipe,turno,data,lote_mp)';

let _rastreioPublico=true, _logadoERP=false;
async function carregarEmpresa(){
  try{const{data}=await _supabase.rpc('branding_publico');
    if(data){ _rastreioPublico=data.rastreio_publico!==false;
      // (out/2026) a empresa pelo nome oficial (razão social), não pelo nome fantasia interno
      document.getElementById('empresa').textContent=data.razao_social||data.nome_fantasia||'Rastreabilidade';
      document.getElementById('emp-info').textContent=[data.cnpj&&'CNPJ '+data.cnpj,[data.cidade,data.uf].filter(Boolean).join('/'),data.telefone].filter(Boolean).join(' · ');if(data.logo)document.getElementById('logo').innerHTML=`<img src="${data.logo}" style="width:100%;height:100%;object-fit:cover;">`;}}catch(e){}
}

// Prefixo de 3 letras da linha, mesma fórmula usada para gerar o código.
function lin3De(nome){return String(nome||'').replace(/[^A-Za-z0-9]/g,'').substring(0,3).toUpperCase()||'LIN';}
function opTailDe(p){
  const n=(p&&p.producao&&p.producao.op_numero)||(p&&p.op_numero);
  return n?String(n).split('-').pop():null;
}

// Diagnóstico da última busca — para a tela dizer POR QUE não achou, em vez de
// um "não encontrado" genérico que não ajuda ninguém no galpão.
let _diag=null;

async function buscarPalletPorCodigo(cod){
  _diag=null;
  // 1) por código salvo (RPC pública — anon só vê o item escaneado, não a tabela)
  try{
    const{data,error}=await _supabase.rpc('rastreio_por_codigo',{cod});
    if(error) _diag={erro:error.message||String(error)};      // função ausente / sem permissão
    else if(data) return data;
  }catch(e){_diag={erro:e.message||String(e)};}

  // 2) parse do código: PREFIXO-AAAAMMDD-OPTAIL-P###
  const m=/^(.+)-(\d{8})-(.+)-P(\d+)$/i.exec(cod);
  if(!m){_diag={motivo:'formato'};return null;}

  const prefixo=String(m[1]).toUpperCase(), opTail=String(m[3]), numero=parseInt(m[4]);
  const data2=`${m[2].slice(0,4)}-${m[2].slice(4,6)}-${m[2].slice(6,8)}`;

  let lista=[];
  try{
    const{data,error}=await _supabase.rpc('rastreio_por_data_numero',{dt:data2,num:numero});
    if(error){_diag={erro:error.message||String(error)};return null;}
    lista=data||[];
  }catch(e){_diag={erro:e.message||String(e)};return null;}

  // Se a primeira consulta já falhou por erro de banco, não sobrescreve o
  // diagnóstico com "sem pallet" — a causa real é a função/permissão.
  if(!lista.length){ if(!(_diag&&_diag.erro)) _diag={motivo:'sem_pallet',data:data2,numero}; return null; }

  // ── CORREÇÃO ────────────────────────────────────────────────────────────
  // Antes: só tentava casar o código inteiro e, falhando, aceitava o resultado
  // apenas quando havia UM candidato. O prefixo da linha e o final da OP eram
  // capturados pela regex e jogados fora.
  // Consequência: num dia em que duas linhas produziram um pallet com o mesmo
  // número (ex.: Emitec e Linha 3, ambas com o nº 10), a busca ficava ambígua e
  // devolvia "não encontrado" — embora o pallet existisse. Linhas com número
  // único naquele dia funcionavam por sorte, pelo atalho do candidato único.
  // Agora o filtro afunila: código exato → linha + OP → linha → único.
  const exato=lista.filter(p=>palCodigo(p).toLowerCase()===cod.toLowerCase());
  if(exato.length===1) return exato[0];
  if(exato.length>1){_diag={motivo:'duplicado',qtd:exato.length,lista};return exato[0];}

  const porLinhaEOp=lista.filter(p=>lin3De(p.linha)===prefixo && opTailDe(p)===opTail);
  if(porLinhaEOp.length===1) return porLinhaEOp[0];

  const porLinha=lista.filter(p=>lin3De(p.linha)===prefixo);
  if(porLinha.length===1) return porLinha[0];
  if(porLinha.length>1){
    // mesma linha, mesma data, mesmo número: mais de uma OP no dia.
    // Sem o código gravado não há como escolher — melhor dizer isso.
    _diag={motivo:'ambiguo_mesma_linha',qtd:porLinha.length,lista:porLinha,prefixo,opTail};
    return null;
  }

  if(lista.length===1) return lista[0];
  _diag={motivo:'linha_nao_confere',prefixo,lista};
  return null;
}

// Texto de erro que diz o que fazer, com o diagnóstico do que a busca encontrou.
function mensagemNaoEncontrado(cod){
  const d=_diag||{};
  const base=`Pallet <b>${esc(cod)}</b> não encontrado.`;
  if(d.erro) return `<div class="err">${base}<br><br>A consulta ao banco falhou: <code>${esc(d.erro)}</code>.
    <br>Isso costuma ser função de rastreio ausente no Supabase (<code>rastreio_por_codigo</code> /
    <code>rastreio_por_data_numero</code>) ou permissão de leitura pública.</div>`;
  if(d.motivo==='formato') return `<div class="err">${base}<br><br>O código não está no formato
    <code>LINHA-AAAAMMDD-OP-P000</code>. Confira se o QR foi lido inteiro.</div>`;
  if(d.motivo==='sem_pallet') return `<div class="err">${base}<br><br>Não existe pallet de número
    <b>${d.numero}</b> registrado em <b>${esc(d.data)}</b>.<br>
    O rótulo foi impresso, mas o pallet não está no estoque. Em <b>Aferidor → Rótulos</b>, use
    <b>“Registrar / ajustar estoque”</b>; ou confira em <b>Produção</b> se a OP daquele dia declarou
    essa quantidade de pallets.</div>`;
  if(d.motivo==='ambiguo_mesma_linha') return `<div class="err">${base}<br><br>Existem
    <b>${d.qtd}</b> pallets com este número, nesta data e nesta linha — de OPs diferentes — e nenhum
    deles tem o código gravado.<br>Salve novamente a OP em <b>Produção</b> para gravar os códigos,
    e reimprima o rótulo.</div>`;
  if(d.motivo==='linha_nao_confere') return `<div class="err">${base}<br><br>Existe pallet com este
    número e data, mas de outra linha (prefixo <b>${esc(d.prefixo)}</b> não confere).<br>
    O rótulo pode ter sido gerado antes de a OP ser corrigida. Reimprima em <b>Aferidor → Rótulos</b>.</div>`;
  return `<div class="err">${base} Verifique se o rótulo foi gerado no sistema.</div>`;
}

// análise: mostra só o que tem valor, com nomes legíveis (nada de "{}")
function _rotulo(k){ const m={granulometria:'Granulometria',umidade:'Umidade',densidade:'Densidade',agua:'Água',liga:'Liga',exsudacao:'Exsudação',cor:'Cor',ph:'pH',mm:'Material mineral',peso_esp:'Peso específico',obs:'Observação',resultado:'Resultado',responsavel:'Responsável'};
  return m[k]||String(k).replace(/_/g,' ').replace(/^./,c=>c.toUpperCase()); }
function _valorLegivel(v){ if(v==null||v==='') return ''; if(Array.isArray(v)) return v.map(_valorLegivel).filter(Boolean).join(' · ');
  if(typeof v==='object'){ return Object.entries(v).filter(([,x])=>x!=null&&x!=='').map(([k,x])=>_rotulo(k)+': '+_valorLegivel(x)).join(' · '); }
  if(typeof v==='boolean') return v?'Sim':'Não'; return String(v); }
function analiseItens(p){ let a=p.analise; if(!a) return []; if(typeof a==='string'){ try{ a=JSON.parse(a); }catch(e){ return a.trim()&&a.trim()!=='{}'?[['Análise',a]]:[]; } }
  if(typeof a!=='object') return [['Análise',String(a)]];
  return Object.entries(a).map(([k,v])=>[_rotulo(k),_valorLegivel(v)]).filter(([,v])=>v&&v!=='{}'); }
function renderPallet(p,carr){
  const bag=/big\s*-?\s*bag|\bbags?\b/i.test(String(p.produto||'')), U=bag?'Bag':'Pallet';
  if(bag){document.title='Rastreabilidade — Bag';}
  const carregado=(p.estoque_status==='carregado'||p.estoque_status==='expedido');
  const eq=equipeLista(p), an=analiseItens(p), num=p.numero!=null?String(p.numero).padStart(3,'0'):'—';
  const it=(l,v,w)=>v&&v!=='—'?`<div class="it${w?' w':''}"><small>${l}</small><b>${esc(v)}</b></div>`:'';
  return `
  <div class="hero"><div class="st">${statusBadge(p)}</div>
    <small>${U} nº ${esc(num)}</small><div class="prod">${esc(p.produto||'—')}</div><span class="cod">${esc(palCodigo(p))}</span>
    <div class="kpis"><div><small>Fabricação</small><b>${fmtData(p.data)}</b></div><div><small>Validade</small><b>${validadeDe(p)}</b></div><div><small>Lote</small><b>${esc(loteDe(p))}</b></div></div></div>
  <div class="card"><div class="sec">Produção</div><div class="grid">
    ${it('Linha de produção',p.linha)}${it('Turno',turnoDe(p))}${it('Ordem de produção',p.producao&&p.producao.op_numero)}${it('Encarregado',encarregadoDe(p))}
    ${eq.length?`<div class="it w"><small>Equipe (${eq.length})</small><div class="eq">${eq.map(n=>`<span>${esc(n)}</span>`).join('')}</div></div>`:''}</div></div>
  <div class="card"><div class="sec">Qualidade</div>
    <div class="qual">${statusBadge(p)}${p.responsavel_lab?`<span class="vazio">por <b style="color:var(--primary);">${esc(p.responsavel_lab)}</b>${p.hora_lab?' · '+esc(String(p.hora_lab).slice(0,5)):''}</span>`:''}</div>
    ${an.length?`<div class="an">${an.map(([k,v])=>`<div class="it"><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join('')}</div>`:''}
    ${p.obs_lab?`<div class="it w" style="margin-top:8px;"><small>Observação do laboratório</small><b>${esc(p.obs_lab)}</b></div>`:''}</div>
  <div class="card"><div class="sec">Caminho do ${U.toLowerCase()}</div><div class="tl">
    <div><i class="on">🏭</i><p><b>Produzido</b><span>${fmtData(p.data)}${p.linha?' · '+esc(p.linha):''}${turnoDe(p)!=='—'?' · '+esc(turnoDe(p)):''}</span></p></div>
    <div><i class="${p.status&&p.status!=='pendente'?'on':''}">🧪</i><p><b>${p.status==='aprovado'?'Aprovado pela qualidade':p.status==='reprovado'?'Reprovado pela qualidade':'Aguardando análise da qualidade'}</b><span>${p.responsavel_lab?esc(p.responsavel_lab):'—'}</span></p></div>
    <div><i class="${carregado?'on':''}">🚛</i><p><b>${carregado?(p.estoque_status==='expedido'?'Expedido':'Carregado'):'Em estoque'}</b><span>${carregado?[fmtDataHora(p.carregado_em),p.cliente_dest,p.ordem_numero&&'ordem '+p.ordem_numero].filter(Boolean).map(esc).join(' · '):'ainda não carregado'}</span></p></div></div>
    ${carregado&&carr?`<div class="grid" style="margin-top:4px;">${it('Transportadora',carr.transportadora)}${it('Placa',carr.placa)}${it('Motorista',carr.motorista)}</div>`:''}</div>`;
}

function renderOrdem(ordem,pallets){
  const carregadoEm=pallets.map(p=>p.carregado_em).filter(Boolean).sort()[0];
  let html=`<div class="hero"><small>Ordem de carregamento</small><div class="prod">${esc(ordem)}</div>
    <div class="kpis"><div><small>Pallets</small><b>${pallets.length}</b></div><div><small>Carregado em</small><b>${fmtDataHora(carregadoEm)}</b></div><div><small>Produtos</small><b>${[...new Set(pallets.map(p=>p.produto))].length}</b></div></div></div>`;
  const porCli={};pallets.forEach(p=>{const c=p.cliente_dest||'Sem cliente';(porCli[c]=porCli[c]||[]).push(p);});
  Object.keys(porCli).sort().forEach(cli=>{
    const lista=porCli[cli].sort((a,b)=>new Date(a.data)-new Date(b.data));
    html+=`<div class="card"><div class="sec">${esc(cli)} <span class="badge b-ok">${lista.length} pallet(s)</span></div>
      <div style="overflow-x:auto;"><table><thead><tr><th>Código</th><th>Produto</th><th>Fabricação</th><th>Turno</th><th>Encarregado</th><th>Lote</th><th>Carregado</th><th>Qualidade</th></tr></thead><tbody>
      ${lista.map(p=>`<tr><td><b>${esc(palCodigo(p))}</b></td><td>${esc(p.produto)}</td><td>${fmtData(p.data)}</td><td>${esc(turnoDe(p))}</td><td>${esc(encarregadoDe(p))}</td><td>${esc(loteDe(p))}</td><td>${fmtDataHora(p.carregado_em)}</td><td>${statusBadge(p)}</td></tr>`).join('')}
      </tbody></table></div></div>`;
  });
  return html;
}

(async function(){
  document.getElementById('ts').textContent=new Date().toLocaleString('pt-BR');
  await carregarEmpresa();
  try{ const{data:{session}}=await _supabase.auth.getSession(); _logadoERP=!!session; }catch(e){}
  // (out/2026) consulta pública DESLIGADA no ERP (Aferidor → Rótulos): cliente vê só uma tela neutra;
  // quem está logado no ERP continua vendo tudo, com o aviso de que é modo teste.
  if(!_rastreioPublico&&!_logadoERP){
    document.getElementById('sub').textContent='Produto rastreável';
    document.getElementById('conteudo').innerHTML=`<div class="card" style="text-align:center;padding:44px 22px;">
      <div style="font-size:42px;">📦</div>
      <div style="font-size:19px;font-weight:800;color:var(--primary);margin-top:8px;">Produto com rastreabilidade</div>
      <div style="font-size:14px;color:var(--muted);margin-top:8px;line-height:1.5;">As informações deste lote estarão disponíveis para consulta em breve.<br>Obrigado pela preferência.</div></div>`;
    document.querySelectorAll('.btn-print').forEach(b=>b.style.display='none');
    return;
  }
  if(!_rastreioPublico&&_logadoERP){
    document.querySelector('.wrap').insertAdjacentHTML('afterbegin',`<div class="no-print" style="background:#fef3c7;border:1.5px solid #fcd34d;color:#78350f;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px;">
      🧪 <b>Modo teste:</b> a consulta pública do QR está <b>desligada</b>. Você vê porque está logado no ERP — o cliente vê só "disponível em breve". Ligue em Aferidor → Rótulos.</div>`);
  }
  const params=new URLSearchParams(location.search);
  let palletCod=params.get('pallet'); const ordem=params.get('ordem');
  // tolera QR que contenha a URL inteira
  if(palletCod&&/pallet=/i.test(palletCod)){const mm=/pallet=([^&]+)/i.exec(palletCod);if(mm)palletCod=decodeURIComponent(mm[1]);}
  const cont=document.getElementById('conteudo');
  try{
    if(palletCod){
      const p=await buscarPalletPorCodigo(palletCod);
      if(!p){cont.innerHTML=mensagemNaoEncontrado(palletCod);return;}
      document.getElementById('sub').textContent='Pallet '+palCodigo(p);
      let carr=null;
      if((p.estoque_status==='carregado'||p.estoque_status==='expedido')&&p.ordem_numero){
        try{const{data}=await _supabase.rpc('carregamento_por_ordem',{ordem:String(p.ordem_numero)});carr=data||null;}catch(e){}
      }
      cont.innerHTML=renderPallet(p,carr);
    }else if(ordem){
      const{data,error}=await _supabase.rpc('rastreio_por_ordem',{ordem:String(ordem)});
      if(error){cont.innerHTML=`<div class="err">Não foi possível consultar a ordem ${esc(ordem)}: <code>${esc(error.message)}</code>.<br>Verifique a função <code>rastreio_por_ordem</code> no Supabase.</div>`;return;}
      const pallets=data||[];
      if(!pallets.length){cont.innerHTML=`<div class="err">Nenhum pallet carregado encontrado para a ordem ${esc(ordem)}.</div>`;return;}
      document.getElementById('sub').textContent='Ordem de carregamento '+ordem;
      cont.innerHTML=renderOrdem(ordem,pallets);
    }else{
      cont.innerHTML='<div class="err">Aponte a câmera no QR de um pallet, ou informe ?pallet=CÓDIGO (ou ?ordem=NÚMERO) na URL.</div>';
    }
  }catch(e){cont.innerHTML=`<div class="err">Erro ao consultar: ${esc(e.message||e)}</div>`;}
})();
</script>
