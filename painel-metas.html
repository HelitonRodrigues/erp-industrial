<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metas das Linhas — Silicate</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<script src="js/regras.js"></script>
<!--
  PAINEL DE METAS — para a TV da fábrica. Linguagem simples, sem nome de pessoa.
  Mostra, por LINHA, se bateu a meta de SACOS e a de TEMPO DE MÁQUINA RODANDO no
  último dia de produção e QUANTO FALTOU (ou passou).
  Regras: as mesmas da OP (producao.html), em Regras.metaDaOP (js/regras.js).

  Dois jeitos de abrir:
   • logado no ERP → lê as tabelas; botão "📺 Passar para a TV" procura Chromecast /
     Google TV (Presentation API do Chrome: a TV recebe a página, a tela do celular
     ou do PC fica livre — não é espelhamento);
   • na TV, sem login → painel-metas.html?tv=CODIGO (ou /tv e digita o código).
     Lê pela RPC painel_tv_dados (migração 059), que só aceita o código da TV.
  ?data=AAAA-MM-DD mostra outro dia. Atualiza sozinho a cada 5 min.
-->
<style>
:root{
  --navy:#042D4D; --lime:#C9FF64; --fundo:#eef2f6; --card:#fff; --txt:#0f2233; --txt2:#5b6b7a; --borda:#dde4eb;
  --ok:#16a34a; --ok-claro:#dcfce7; --ok-esc:#166534; --nao:#dc2626; --nao-claro:#fee2e2; --nao-esc:#991b1b; --cinza:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--fundo);color:var(--txt);font-family:'Plus Jakarta Sans',system-ui,sans-serif}
body{min-height:100vh;padding:clamp(10px,min(1.2vw,2vh),24px);display:flex;flex-direction:column;gap:clamp(8px,min(.9vw,1.5vh),16px)}

/* topo */
.topo{display:flex;align-items:center;gap:clamp(10px,1vw,20px);background:var(--navy);color:#fff;border-radius:18px;padding:clamp(10px,min(1vw,1.8vh),18px) clamp(14px,1.4vw,26px)}
.topo svg{width:clamp(30px,min(2.6vw,4.6vh),50px);height:auto;flex:none}
.topo .tit{flex:1;min-width:0}
.topo h1{font-size:clamp(20px,min(2.2vw,4vh),42px);font-weight:800;line-height:1.05}
.topo .dia{font-size:clamp(13px,min(1.25vw,2.3vh),24px);color:var(--lime);font-weight:700;margin-top:3px}
.relogio{text-align:right}
.relogio b{display:block;font-size:clamp(24px,min(2.6vw,4.8vh),50px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.relogio small{font-size:clamp(10px,min(.8vw,1.4vh),14px);color:#b8c7d4}

/* frase do dia */
.frase{background:var(--card);border-radius:16px;padding:clamp(8px,min(.8vw,1.4vh),14px) clamp(14px,1.4vw,26px);font-size:clamp(16px,min(1.55vw,2.8vh),30px);font-weight:800;color:var(--navy);display:flex;align-items:center;gap:14px;border:2px solid var(--borda)}
.frase .placar{display:flex;gap:6px;margin-left:auto}
.frase .placar i{width:clamp(16px,min(1.4vw,2.6vh),28px);height:clamp(16px,min(1.4vw,2.6vh),28px);border-radius:50%;background:#cbd5e1}
.frase .placar i.ok{background:var(--ok)} .frase .placar i.nao{background:var(--nao)}

/* cartões */
.linhas{display:grid;gap:clamp(8px,min(1vw,1.6vh),18px);grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));flex:1}
.ln{background:var(--card);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;border:4px solid var(--borda);box-shadow:0 2px 10px rgba(4,45,77,.06)}
.ln.ok{border-color:var(--ok)} .ln.nao{border-color:var(--nao)}
.cab{padding:clamp(8px,min(.9vw,1.5vh),16px) clamp(12px,1.2vw,20px);color:#fff;background:#64748b}
.ln.ok .cab{background:var(--ok)} .ln.nao .cab{background:var(--nao)}
.cab .nome{font-size:clamp(20px,min(2vw,3.6vh),40px);font-weight:800;line-height:1.05}
.cab .res{font-size:clamp(15px,min(1.4vw,2.5vh),27px);font-weight:800;margin-top:2px;letter-spacing:.3px}
.corpo{padding:clamp(8px,min(.85vw,1.4vh),16px);display:flex;flex-direction:column;gap:clamp(6px,min(.7vw,1.2vh),12px);flex:1}
.bloco{border-radius:14px;padding:clamp(7px,min(.75vw,1.25vh),14px);background:#f6f8fa;border:2px solid var(--borda)}
.bloco.ok{background:var(--ok-claro);border-color:#86efac} .bloco.nao{background:var(--nao-claro);border-color:#fca5a5}
.bloco h3{font-size:clamp(12px,min(1vw,1.8vh),19px);font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--txt2);display:flex;justify-content:space-between;gap:8px}
.bloco h3 b{font-size:1.25em;line-height:1}
.fez{font-size:clamp(17px,min(1.55vw,2.8vh),32px);font-weight:800;line-height:1.15;margin-top:2px;color:var(--txt)}
.meta{font-size:clamp(12px,min(1.05vw,1.9vh),20px);color:var(--txt2);font-weight:700}
.falta{margin-top:4px;font-size:clamp(13px,min(1.15vw,2.1vh),23px);font-weight:800;border-radius:10px;padding:4px 10px;display:inline-block}
.bloco.ok .falta{background:var(--ok);color:#fff} .bloco.nao .falta{background:var(--nao);color:#fff}
.barra{position:relative;height:clamp(10px,min(.85vw,1.5vh),18px);background:#fff;border:2px solid var(--borda);border-radius:99px;margin:8px 0 2px;overflow:visible}
.barra i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.bloco.ok .barra i{background:var(--ok)} .bloco.nao .barra i{background:var(--nao)}
.barra b{position:absolute;top:-6px;bottom:-6px;width:4px;background:var(--navy);border-radius:2px}
.itens{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.item{font-size:clamp(13px,min(1.1vw,2vh),21px);font-weight:700;line-height:1.3}
.item span{color:var(--txt2);font-weight:700}
.item em{font-style:normal;font-weight:800}
.item em.ok{color:var(--ok)} .item em.nao{color:var(--nao)}
.turnos{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:clamp(13px,min(1.05vw,1.9vh),20px);font-weight:700;color:var(--txt2)}
.tu{background:#f1f5f9;border-radius:99px;padding:5px 12px;color:var(--txt);font-weight:800}
.hist{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.hist .lbl{font-size:clamp(12px,min(1vw,1.8vh),18px);font-weight:700;color:var(--txt2)}
.hist .dias{display:flex;gap:6px;flex-wrap:wrap}
.hist .d{text-align:center;font-size:clamp(10px,min(.8vw,1.4vh),14px);font-weight:700;color:var(--txt2)}
.hist .d i{display:flex;align-items:center;justify-content:center;width:clamp(24px,min(1.9vw,3.4vh),40px);height:clamp(24px,min(1.9vw,3.4vh),40px);border-radius:8px;background:#e2e8f0;color:#fff;font-style:normal;font-size:1.3em;margin-bottom:2px}
.hist .d i.ok{background:var(--ok)} .hist .d i.nao{background:var(--nao)}
.fogo{font-size:clamp(14px,min(1.2vw,2.2vh),23px);font-weight:800;color:#c2410c}
.aviso{font-size:12px;color:#92400e;background:#fef3c7;border-radius:8px;padding:6px 8px}
.rodape{font-size:clamp(11px,min(.85vw,1.5vh),15px);color:var(--txt2);text-align:center}

/* botões (somem sozinhos na TV) */
.ctl{position:fixed;right:14px;bottom:14px;display:flex;gap:8px;z-index:20;transition:opacity .4s}
.ctl.some{opacity:0;pointer-events:none}
.ctl button,.ctl a{font:inherit;font-size:15px;font-weight:800;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.bt-tv{background:var(--lime);color:var(--navy)} .bt-cinza{background:var(--navy);color:#fff}

/* janelas */
.fundo-modal{position:fixed;inset:0;background:rgba(4,45,77,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.modal{background:#fff;border-radius:20px;padding:22px;width:min(560px,100%);display:flex;flex-direction:column;gap:14px;max-height:94vh;overflow:auto}
.modal h2{font-size:22px;color:var(--navy)}
.modal p,.modal li{font-size:15px;color:#334155;line-height:1.5}
.modal ol{padding-left:22px;display:flex;flex-direction:column;gap:4px}
.modal .grande{font:inherit;font-size:20px;font-weight:800;border:0;border-radius:14px;padding:18px;background:var(--ok);color:#fff;cursor:pointer}
.modal .sec{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:10px;padding:10px 12px;background:#f1f5f9;color:var(--navy);cursor:pointer}
.codigo{font-size:34px;font-weight:800;letter-spacing:6px;color:var(--navy);background:#f1f5f9;border-radius:12px;padding:10px;text-align:center;font-variant-numeric:tabular-nums}
.endereco{font-size:18px;font-weight:800;color:var(--navy);word-break:break-all}
.caixa-ok{background:var(--ok-claro);color:var(--ok-esc);border-radius:12px;padding:10px 12px;font-weight:700}
.opc{display:flex;align-items:center;gap:10px;font-size:16px;padding:10px 12px;border-radius:12px;background:#f8fafc;border:2px solid #e2e8f0;cursor:pointer}
.opc input[type=radio],.opc input[type=checkbox]{width:22px;height:22px;flex:none}
.opc input[type=date]{font:inherit;font-size:16px;padding:6px 8px;border:2px solid #cbd5e1;border-radius:8px;margin-left:6px}
.opc.sub{background:transparent;border:0;padding:2px 12px 2px 44px;font-size:14px;color:#475569}
.grade-linhas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.caixa-nao{background:var(--nao-claro);color:var(--nao-esc);border-radius:12px;padding:10px 12px;font-weight:700}

/* tela do código (TV sem login) */
.entrar{margin:auto;background:#fff;border-radius:24px;padding:clamp(20px,3vw,48px);width:min(720px,100%);text-align:center;display:flex;flex-direction:column;gap:18px}
.entrar h2{font-size:clamp(24px,2.6vw,44px);color:var(--navy)}
.entrar p{font-size:clamp(16px,1.5vw,24px);color:#334155}
.entrar input{font:inherit;font-size:clamp(30px,3.4vw,56px);font-weight:800;letter-spacing:8px;text-align:center;text-transform:uppercase;border:3px solid var(--borda);border-radius:16px;padding:14px;width:100%}
.entrar input:focus{outline:none;border-color:var(--navy)}
.entrar input::placeholder{color:#cbd5e1;letter-spacing:2px;font-weight:700}
.entrar button{font:inherit;font-size:clamp(20px,2vw,32px);font-weight:800;border:0;border-radius:16px;padding:18px;background:var(--ok);color:#fff;cursor:pointer}
.msg{margin:auto;text-align:center;font-size:clamp(16px,1.6vw,28px);color:var(--txt2);max-width:820px;line-height:1.5}
</style>
</head>

<footer class="rodape" id="rodape">A meta vem do planejamento: média por hora da linha × tempo do turno (<span id="regra85">85%</span> do turno com a máquina rodando).</footer>

<script>
const REFRESH_MS = 5 * 60 * 1000, DIAS_HIST = 6, JANELA_DIAS = 30;
const SEMANA = ['dom','seg','ter','qua','qui','sex','sáb'];
const SEMANA_LONGA = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const LS_COD = 'painel_tv_codigo';
const nf = (v, d=0) => Number(v||0).toLocaleString('pt-BR', {minimumFractionDigits:d, maximumFractionDigits:d});
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
             set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
             del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
const params = new URLSearchParams(location.search);
// App "Avisos Silicate" tira foto do painel para mandar por DLNA: largura fixa e sem botões
if(/^\d{3,4}$/.test(params.get('largura')||'')) document.querySelector('meta[name=viewport]').setAttribute('content', 'width=' + params.get('largura'));
const CAPTURA = params.get('captura') === '1';
let _ultimaCarga = 0, _diaCarregado = null, _conexaoTV = null;

/* ── modo: logado no ERP ou TV com código ────────────────────────────────── */
if(params.get('tv')) ls.set(LS_COD, params.get('tv').toUpperCase().replace(/[^A-Z0-9]/g,''));
const USUARIO = (typeof getUser === 'function') ? getUser() : null;
const MODO = USUARIO ? 'erp' : (ls.get(LS_COD) ? 'tv' : 'codigo');

/* ── datas e textos ──────────────────────────────────────────────────────── */
function hojeISO(){ return new Date().toLocaleDateString('sv-SE', {timeZone:'America/Sao_Paulo'}); }
function somaDias(iso, n){ const d = new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function diaSemana(iso){ return new Date(iso+'T12:00:00').getDay(); }
function dataLonga(iso){ const [a,m,d] = iso.split('-'); return `${SEMANA_LONGA[diaSemana(iso)]}, ${Number(d)} de ${MESES[Number(m)-1]}`; }
function nomeTurno(t){ return String(t||'').replace(/^\s*\d+\s*º?\s*-\s*/,'').trim() || t; }
function unidade(un, produto){
  const u = String(un||'').toLowerCase();
  if((Regras.UNIDADE_KG[u]||0) > 1) return 't';
  if(u.startsWith('unid') || /bag/i.test(produto||'')) return 'bags';
  return 'sacos';
}
function qtd(v, un){
  if(un === 't') return nf(v, 1) + (Math.abs(v - 1) < 0.05 ? ' tonelada' : ' toneladas');
  const n = Math.round(v);
  if(un === 'bags') return nf(n) + (n === 1 ? ' bag' : ' bags');
  return nf(n) + (n === 1 ? ' saco' : ' sacos');
}
function metaInteira(meta, un){ return un === 't' ? Math.round(meta*10)/10 : Math.ceil(meta - 1e-9); }   // não dá para fazer 0,2 saco
function horas(h){
  const min = Math.round((h||0) * 60), hh = Math.floor(min/60), mm = min % 60;
  if(!hh) return mm + ' min';
  return hh + (hh === 1 ? ' hora' : ' horas') + (mm ? ' e ' + mm + ' min' : '');
}

/* ── dados (tabelas se logado; RPC com o código se for a TV) ─────────────── */
async function lerDados(ini, fim){
  if(MODO === 'tv'){
    const r = await _supabase.rpc('painel_tv_dados', {p_codigo: ls.get(LS_COD), p_ini: ini, p_fim: fim});
    if(r.error){
      if(/c[oó]digo/i.test(r.error.message)){ window.__painelErro = 'Código da TV errado ou trocado. Confira o código no ERP.'; ls.del(LS_COD); telaCodigo('O código da TV mudou ou está errado. Digite o código novo.'); return null; }
      throw new Error(r.error.message);
    }
    return { ops:r.data.producao||[], planos:r.data.planejamentos||[], linhas:r.data.linhas||[], produtos:r.data.produtos||[] };
  }
  const meses = [...new Set([ini.slice(0,7), fim.slice(0,7)])];
  const [op, pl, ln, pr] = await Promise.all([
    db(_supabase.from('producao').select('id,data,linha,turno,ht,produto,total_sacos,produtos_op').gte('data', ini).lte('data', fim).order('data'), 'Produção para o painel'),
    db(_supabase.from('planejamentos').select('mes,secoes').in('mes', meses), 'Planejamento para o painel'),
    db(_supabase.from('linhas_producao').select('nome,status,produtos').order('nome'), 'Linhas para o painel'),
    db(_supabase.from('produtos').select('nome,unidade'), 'Produtos para o painel'),
  ]);
  const erro = op.error || pl.error || ln.error || pr.error;
  if(erro) throw new Error(erro.message);
  return { ops:op.data||[], planos:pl.data||[], linhas:ln.data||[], produtos:pr.data||[] };
}

let _config = {}, _todasLinhas = [];
async function lerConfig(){
  const r = await _supabase.rpc('painel_tv_config_ler', MODO === 'tv' ? {p_codigo: ls.get(LS_COD)} : {});
  if(r.error) throw new Error(r.error.message);
  return r.data || {};
}
// Dia escolhido no ⚙️ vale até o fim do dia "dia_ate"; depois volta sozinho para ontem.
function diaEscolhido(cfg){
  if(!cfg || !/^\d{4}-\d{2}-\d{2}$/.test(cfg.dia || '')) return null;
  if(cfg.dia_ate && hojeISO() > cfg.dia_ate) return null;
  return cfg.dia;
}

async function carregar(){
  const ontem = somaDias(hojeISO(), -1);
  const pedido = params.get('data');
  let D;
  try{ _config = await lerConfig(); }
  catch(e){ console.error('[painel-metas] config', e); _config = {}; }
  const fixo = (pedido && /^\d{4}-\d{2}-\d{2}$/.test(pedido)) ? pedido : diaEscolhido(_config);
  const fim = fixo || ontem;
  try{ D = await lerDados(somaDias(fim, -JANELA_DIAS), fim); }
  catch(e){
    console.error('[painel-metas]', e);
    document.getElementById('linhas').innerHTML = '<div class="msg">⚠️ Sem conexão com o sistema agora. Tento de novo em 5 minutos.</div>';
    _ultimaCarga = Date.now(); return;
  }
  if(!D) return;

  const secoesMes = {};
  D.planos.forEach(p => { (secoesMes[p.mes] = secoesMes[p.mes] || []).push(...(p.secoes || [])); });
  const cad = {}; D.linhas.forEach(l => cad[l.nome] = l);

  // dia mostrado: ontem; se ontem não teve OP lançada, o último dia que teve
  const diasComOP = [...new Set(D.ops.map(o => o.data))].sort();
  let dia = fim;
  if(!fixo && !diasComOP.includes(fim) && diasComOP.length) dia = diasComOP[diasComOP.length-1];

  _todasLinhas = D.linhas.filter(l => l.status === 'ativo').map(l => l.nome);
  D.ops.forEach(o => { if(o.linha && !_todasLinhas.includes(o.linha)) _todasLinhas.push(o.linha); });
  const escolhidas = Array.isArray(_config.linhas) && _config.linhas.length ? _config.linhas : null;
  const nomes = escolhidas ? _todasLinhas.filter(n => escolhidas.includes(n)) : _todasLinhas.slice();

  const res = {};
  D.ops.forEach(o => {
    if(!o.linha) return;
    const m = Regras.metaDaOP(o, secoesMes[String(o.data).slice(0,7)] || [], cad[o.linha] || null, D.produtos);
    const porDia = res[o.linha] = res[o.linha] || {};
    juntar(porDia[o.data] = porDia[o.data] || novo(), m);
  });
  Object.values(res).forEach(porDia => Object.values(porDia).forEach(fechar));

  const ef = (secoesMes[dia.slice(0,7)] || []).map(s => parseFloat(s.eficiencia)).find(v => v > 0);
  if(ef) document.getElementById('regra85').textContent = nf(ef) + '%';

  desenhar(dia, ontem, nomes, res, diasComOP.filter(d => d <= dia), !!fixo);
  window.__painelPronto = Date.now();   // o app de TV espera isto para tirar a foto
  _ultimaCarga = Date.now(); _diaCarregado = hojeISO();
  document.getElementById('atualizado').textContent = 'atualizado às ' + new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit', timeZone:'America/Sao_Paulo'});
}

function novo(){ return { turnos:[], dispReal:0, dispMeta:0, hReal:0, hMeta:0, itens:{}, semCap:new Set() }; }
function juntar(r, m){
  r.turnos.push({ turno:m.turno, prod:m.producao.bateu });
  r.dispReal += m.disponibilidade.real; r.dispMeta += m.disponibilidade.meta;
  r.hReal += m.producao.horasReal; r.hMeta += m.producao.horasMeta;
  m.producao.itens.forEach(i => {
    const un = unidade(i.unidade, i.produto), k = (i.linha_produto || i.produto) + '|' + un;
    const it = r.itens[k] = r.itens[k] || { nome:i.linha_produto || i.produto, un, real:0, meta:0 };
    it.real += i.real; it.meta += i.meta;
  });
  m.semCap.forEach(s => r.semCap.add(s));
}
function fechar(r){
  r.prodOk = r.hMeta > 0 ? r.hReal >= r.hMeta - 1e-9 : null;
  r.prodPct = r.hMeta > 0 ? r.hReal / r.hMeta * 100 : null;
  r.dispOk = r.dispMeta > 0 ? r.dispReal >= r.dispMeta - 1e-9 : null;
  r.turnos.sort((a,b) => String(a.turno).localeCompare(String(b.turno), 'pt-BR', {numeric:true}));
}

/* ── tela ────────────────────────────────────────────────────────────────── */
function desenhar(dia, ontem, nomes, res, diasAteODia, fixo){
  const quando = fixo ? (dia === ontem ? 'Ontem' : 'No dia') : dia === ontem ? 'Ontem' : 'No último dia com produção';
  document.getElementById('dia').textContent = `${quando} · ${dataLonga(dia)}`;

  const doDia = nomes.map(n => ({ nome:n, r:(res[n]||{})[dia] || null }));
  const contam = doDia.filter(x => x.r && x.r.prodOk != null);
  const bateram = contam.filter(x => x.r.prodOk).length;
  let txt;
  if(!contam.length) txt = 'Ainda não tem produção lançada para mostrar.';
  else if(bateram === contam.length) txt = `🎉 Todas as linhas bateram a meta! Parabéns, equipe!`;
  else if(bateram === 0) txt = `💪 Nenhuma linha bateu a meta. Hoje é dia de virar o jogo!`;
  else txt = `👏 ${bateram} de ${contam.length} linhas ${bateram === 1 ? 'bateu' : 'bateram'} a meta. Vamos buscar as outras!`;
  const fr = document.getElementById('frase');
  fr.style.display = '';
  fr.innerHTML = `<span>${txt}</span><span class="placar">${contam.map(x => `<i class="${x.r.prodOk?'ok':'nao'}"></i>`).join('')}</span>`;

  const histDias = diasAteODia.slice(-DIAS_HIST);
  document.getElementById('linhas').innerHTML = doDia.map(x => cartao(x.nome, x.r, res[x.nome] || {}, histDias, dia, diasAteODia)).join('')
    || '<div class="msg">Nenhuma linha cadastrada.</div>';
}

function cartao(nome, r, porDia, histDias, dia, diasAteODia){
  let cls = '', resTxt = 'Não teve produção';
  if(r && r.prodOk != null){ cls = r.prodOk ? 'ok' : 'nao'; resTxt = r.prodOk ? '👍 BATEU A META' : '👎 NÃO BATEU A META'; }
  else if(r){ resTxt = 'Sem meta no planejamento'; }

  let corpo = '';
  if(r){
    corpo += blocoSacos(r);
    corpo += blocoTempo(r);
    if(r.turnos.length > 1 || (r.turnos[0] && r.turnos[0].turno)){
      corpo += `<div class="turnos">Turnos: ${r.turnos.map(t => `<span class="tu">${esc(nomeTurno(t.turno))} ${t.prod==null?'—':t.prod?'👍':'👎'}</span>`).join('')}</div>`;
    }
    if(r.semCap.size) corpo += `<div class="aviso">⚠️ Sem média por hora no planejamento: ${esc([...r.semCap].join(', '))}. Não entrou na conta.</div>`;
  } else {
    corpo += `<div class="bloco"><div class="meta">Nenhuma ordem de produção lançada para esta linha neste dia.</div></div>`;
  }
  corpo += historico(nome, porDia, histDias, dia, diasAteODia);

  return `<article class="ln ${cls}">
    <div class="cab"><div class="nome">${esc(nome)}</div><div class="res">${resTxt}</div></div>
    <div class="corpo">${corpo}</div>
  </article>`;
}

function blocoSacos(r){
  const itens = Object.values(r.itens);
  if(!itens.length) return `<div class="bloco"><h3>📦 Produção</h3><div class="meta">Sem média por hora cadastrada.</div></div>`;
  const ok = r.prodOk;
  const larg = Math.min(r.prodPct || 0, 125) / 125 * 100;
  let miolo;
  if(itens.length === 1){
    const i = itens[0], m = metaInteira(i.meta, i.un), dif = i.real - m;
    miolo = `<div class="fez">Fizemos ${qtd(i.real, i.un)}</div>
      <div class="meta">A meta era ${qtd(m, i.un)}</div>
      <div class="barra"><i style="width:${larg}%"></i><b style="left:${100/125*100}%"></b></div>
      <div class="falta">${dif >= 0 ? `Passou ${qtd(dif, i.un)} da meta 👏` : `Faltaram ${qtd(-dif, i.un)}`}</div>`;
  } else {
    miolo = `<div class="itens">${itens.map(i => {
      const m = metaInteira(i.meta, i.un), dif = i.real - m;
      return `<div class="item">${esc(i.nome)}: fizemos ${qtd(i.real, i.un)} <span>de ${qtd(m, i.un)}</span><br>
        <em class="${dif>=0?'ok':'nao'}">${dif >= 0 ? `passou ${qtd(dif, i.un)} 👏` : `faltaram ${qtd(-dif, i.un)}`}</em></div>`;
    }).join('')}</div>
    <div class="barra"><i style="width:${larg}%"></i><b style="left:${100/125*100}%"></b></div>`;
  }
  return `<div class="bloco ${ok?'ok':'nao'}"><h3>📦 Produção <b>${ok?'✅':'❌'}</b></h3>${miolo}</div>`;
}

function blocoTempo(r){
  if(!(r.dispMeta > 0)) return `<div class="bloco"><h3>⏱️ Máquina rodando</h3><div class="meta">Sem horário no planejamento.</div></div>`;
  const ok = r.dispOk, dif = r.dispReal - r.dispMeta;
  const larg = Math.min(r.dispReal / r.dispMeta * 100, 125) / 125 * 100;
  return `<div class="bloco ${ok?'ok':'nao'}"><h3>⏱️ Máquina rodando <b>${ok?'✅':'❌'}</b></h3>
    <div class="fez">Rodou ${horas(r.dispReal)}</div>
    <div class="meta">A meta era ${horas(r.dispMeta)}</div>
    <div class="barra"><i style="width:${larg}%"></i><b style="left:${100/125*100}%"></b></div>
    <div class="falta">${dif >= -1/120 ? (dif >= 1/60 ? `Passou ${horas(dif)} da meta 👏` : 'Bateu certinho 👏') : `Faltou ${horas(-dif)}`}</div>
  </div>`;
}

function historico(nome, porDia, histDias, dia, diasAteODia){
  if(!histDias.length) return '';
  const quadros = histDias.map(d => {
    const r = porDia[d], c = !r || r.prodOk == null ? '' : r.prodOk ? 'ok' : 'nao';
    return `<div class="d"><i class="${c}">${c==='ok'?'✓':c==='nao'?'✗':''}</i>${d===dia?'<b style="color:var(--navy)">'+SEMANA[diaSemana(d)]+'</b>':SEMANA[diaSemana(d)]}</div>`;
  }).join('');
  let seq = 0;
  for(const d of [...diasAteODia].reverse()){
    const r = porDia[d];
    if(!r || r.prodOk == null) continue;        // linha não rodou nesse dia: não conta nem quebra
    if(r.prodOk) seq++; else break;
  }
  return `<div class="hist"><div class="lbl">Últimos dias (meta de produção):</div><div class="dias">${quadros}</div>
    ${seq >= 2 ? `<div class="fogo">🔥 ${seq} dias seguidos batendo a meta!</div>` : ''}</div>`;
}

/* ── tela do código (TV sem login) ───────────────────────────────────────── */
function telaCodigo(aviso){
  document.getElementById('frase').style.display = 'none';
  document.getElementById('dia').textContent = 'Painel da TV';
  document.getElementById('rodape').style.display = 'none';
  document.getElementById('linhas').innerHTML = `<div class="entrar">
      <h2>📺 Ligar o painel nesta TV</h2>
      <p>Digite o código que aparece no ERP, no botão <b>“Passar para a TV”</b>.</p>
      ${aviso ? `<div class="caixa-nao">${esc(aviso)}</div>` : ''}
      <input id="cod" maxlength="12" autocomplete="off" autocapitalize="characters" placeholder="código">
      <button type="button" onclick="entrarCodigo()">ENTRAR</button>
    </div>`;
  const i = document.getElementById('cod'); i.focus();
  i.addEventListener('keydown', e => { if(e.key === 'Enter') entrarCodigo(); });
}
async function entrarCodigo(){
  const c = (document.getElementById('cod').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if(c.length < 6) return;
  const hoje = hojeISO();
  const r = await _supabase.rpc('painel_tv_dados', {p_codigo:c, p_ini:hoje, p_fim:hoje});
  if(r.error){ telaCodigo(/c[oó]digo/i.test(r.error.message) ? 'Código errado. Confira e digite de novo.' : 'Sem conexão. Tente de novo.'); return; }
  ls.set(LS_COD, c);
  location.replace(location.pathname + '?tv=' + c);
}

/* ── passar para a TV (logado) ───────────────────────────────────────────── */
async function codigoTV(novo){
  const r = await _supabase.rpc('painel_tv_codigo', {p_novo: !!novo});
  if(r.error){ toast('Não foi possível pegar o código da TV: ' + r.error.message, 'danger'); return null; }
  return r.data;
}
const urlTV = c => new URL('painel-metas.html?tv=' + c, location.href).href;
const fmtCod = c => String(c||'').replace(/(.{4})/, '$1 ');

async function abrirTV(){
  const c = await codigoTV(false); if(!c) return;
  const suporta = 'PresentationRequest' in window;
  const m = document.createElement('div'); m.className = 'fundo-modal'; m.id = 'm-tv';
  m.innerHTML = `<div class="modal">
    <h2>📺 Passar o painel para a TV</h2>
    ${_conexaoTV ? `<div class="caixa-ok">✅ O painel está passando na TV.</div><button class="grande" style="background:var(--nao)" onclick="pararTV()">⏹ PARAR DE PASSAR NA TV</button>`
      : suporta ? `<button class="grande" onclick="procurarTV()">🔍 PROCURAR TV</button>
        <p>Acha TVs com <b>Chromecast</b>, <b>Google TV</b> ou <b>Android TV</b> na mesma rede Wi-Fi. A tela deste aparelho continua livre — a TV mostra só o painel.</p>`
      : `<div class="caixa-nao">Este navegador não procura TV. Use o <b>Google Chrome</b> (computador ou Android) ou o jeito abaixo.</div>`}
    <div id="tv-msg"></div>
    <hr style="border:0;border-top:2px solid #e2e8f0">
    <h2 style="font-size:18px">A TV não apareceu? Faça direto na TV:</h2>
    <ol>
      <li>Na TV, abra o <b>navegador de internet</b>.</li>
      <li>Digite o endereço:<div class="endereco">${esc(location.host)}/tv</div></li>
      <li>Coloque o código:<div class="codigo">${esc(fmtCod(c))}</div></li>
    </ol>
    <p>A TV guarda o código: depois é só abrir o mesmo endereço.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between">
      <button class="sec" onclick="trocarCodigo()">🔄 Trocar o código (desliga as TVs ligadas)</button>
      <button class="sec" onclick="document.getElementById('m-tv').remove()">Fechar</button>
    </div>
  </div>`;
  m.addEventListener('click', e => { if(e.target === m) m.remove(); });
  document.body.appendChild(m);
}
async function procurarTV(){
  const msg = document.getElementById('tv-msg');
  const c = await codigoTV(false); if(!c) return;
  try{
    const req = new PresentationRequest([urlTV(c)]);
    const con = await req.start();                       // o Chrome mostra a lista de TVs
    _conexaoTV = con;
    con.addEventListener('terminate', () => { _conexaoTV = null; montarBotoes(); });
    msg.innerHTML = '<div class="caixa-ok">✅ Pronto! O painel está passando na TV.</div>';
    montarBotoes();
  }catch(e){
    if(e && e.name === 'NotAllowedError') return;        // a pessoa fechou a lista
    msg.innerHTML = `<div class="caixa-nao">${e && e.name === 'NotFoundError'
      ? 'Nenhuma TV encontrada. Confira se a TV está ligada e no mesmo Wi-Fi, ou use o jeito abaixo.'
      : 'Não deu para passar para a TV (' + esc(e && e.message || e) + '). Use o jeito abaixo.'}</div>`;
  }
}
function pararTV(){ try{ _conexaoTV && _conexaoTV.terminate(); }catch(e){} _conexaoTV = null; const m = document.getElementById('m-tv'); if(m) m.remove(); montarBotoes(); }
async function trocarCodigo(){
  if(!confirm('Trocar o código? As TVs ligadas vão pedir o código novo.')) return;
  const c = await codigoTV(true); if(!c) return;
  document.getElementById('m-tv').remove(); abrirTV();
}

/* ── ⚙️ escolher dia e linhas (vale para todas as TVs) ─────────────────── */
async function abrirConfig(){
  let cfg = {};
  try{ cfg = await lerConfig(); }catch(e){ toast('Não foi possível ler a configuração: ' + e.message, 'danger'); return; }
  const fixo = diaEscolhido(cfg);
  const ontem = somaDias(hojeISO(), -1);
  const marcadas = Array.isArray(cfg.linhas) && cfg.linhas.length ? cfg.linhas : _todasLinhas;
  const m = document.createElement('div'); m.className = 'fundo-modal'; m.id = 'm-cfg';
  m.innerHTML = `<div class="modal">
    <h2>⚙️ O que aparece no painel</h2>
    <div class="caixa-ok" style="background:#e0f2fe;color:#075985">Vale para <b>todas as TVs</b>. Elas mudam em até 5 minutos.</div>
    <h2 style="font-size:18px">📅 Qual dia mostrar?</h2>
    <label class="opc"><input type="radio" name="cfg-dia" value="auto" ${fixo ? '' : 'checked'}>
      <span><b>Automático</b> — sempre o resultado de ontem</span></label>
    <label class="opc"><input type="radio" name="cfg-dia" value="fixo" ${fixo ? 'checked' : ''}>
      <span><b>Escolher o dia:</b> <input type="date" id="cfg-data" value="${fixo || ontem}" max="${hojeISO()}"></span></label>
    <label class="opc sub"><input type="checkbox" id="cfg-volta" ${!fixo || cfg.dia_ate ? 'checked' : ''}>
      <span>Amanhã volta sozinho para o automático</span></label>
    <h2 style="font-size:18px">🏭 Quais linhas aparecem?</h2>
    <div class="grade-linhas">${_todasLinhas.map(n => `<label class="opc"><input type="checkbox" class="cfg-ln" value="${esc(n)}" ${marcadas.includes(n) ? 'checked' : ''}><span>${esc(n)}</span></label>`).join('')}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-top:4px">
      <button class="sec" onclick="document.getElementById('m-cfg').remove()">Cancelar</button>
      <button class="grande" style="padding:14px 22px;font-size:18px" onclick="salvarConfig()">✅ SALVAR</button>
    </div>
  </div>`;
  m.addEventListener('click', e => { if(e.target === m) m.remove(); });
  document.body.appendChild(m);
  const dt = document.getElementById('cfg-data');
  dt.addEventListener('input', () => { m.querySelector('input[value=fixo]').checked = true; });
}
async function salvarConfig(){
  const m = document.getElementById('m-cfg');
  const fixo = m.querySelector('input[name=cfg-dia]:checked').value === 'fixo';
  const data = document.getElementById('cfg-data').value;
  if(fixo && !/^\d{4}-\d{2}-\d{2}$/.test(data)){ toast('Escolha o dia.', 'warning'); return; }
  const linhas = [...m.querySelectorAll('.cfg-ln:checked')].map(i => i.value);
  if(!linhas.length){ toast('Marque pelo menos uma linha.', 'warning'); return; }
  const cfg = {
    dia: fixo ? data : null,
    dia_ate: fixo && document.getElementById('cfg-volta').checked ? hojeISO() : null,
    linhas: linhas.length === _todasLinhas.length ? null : linhas,     // todas = null (linha nova entra sozinha)
  };
  const r = await _supabase.rpc('painel_tv_config_salvar', {p_config: cfg});
  if(r.error){ toast('Não foi possível salvar: ' + r.error.message, 'danger'); return; }
  m.remove();
  toast('Salvo! As TVs mudam em até 5 minutos.', 'success');
  carregar();
}

/* ── TV: relógio, atualização, tela cheia, tela acesa ────────────────────── */
function relogio(){
  document.getElementById('hora').textContent = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit', timeZone:'America/Sao_Paulo'});
  if(_diaCarregado && _diaCarregado !== hojeISO()) carregar();
  else if(_ultimaCarga && Date.now() - _ultimaCarga > REFRESH_MS) carregar();
}
function telaCheia(){
  if(document.fullscreenElement) document.exitFullscreen();
  else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
}
function montarBotoes(){
  const c = document.getElementById('ctl');
  if(CAPTURA){ c.style.display = 'none'; return; }
  c.innerHTML = (MODO === 'erp'
      ? `<a class="bt-cinza" href="dashboard.html">⬅ ERP</a><button class="bt-cinza" onclick="abrirConfig()">⚙️ Dia e linhas</button><button class="bt-tv" onclick="abrirTV()">${_conexaoTV ? '📺 Na TV ✓' : '📺 Passar para a TV'}</button>` : '')
    + `<button class="bt-cinza" onclick="telaCheia()">⛶ Tela cheia</button>`;
}
let _tCtl = null;
function mostrarCtl(){
  const c = document.getElementById('ctl'); c.classList.remove('some');
  clearTimeout(_tCtl); _tCtl = setTimeout(() => c.classList.add('some'), MODO === 'erp' ? 8000 : 4000);
}
['mousemove','pointerdown','keydown'].forEach(ev => document.addEventListener(ev, mostrarCtl, {passive:true}));
async function manterTelaAcesa(){ try{ if('wakeLock' in navigator) await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange', () => { if(!document.hidden) manterTelaAcesa(); });

(function iniciar(){
  if(MODO === 'erp' && !requireAuth('painel_metas')) return;
  montarBotoes(); mostrarCtl();
  relogio(); setInterval(relogio, 15000);
  if(MODO === 'codigo'){ telaCodigo(); return; }
  carregar(); manterTelaAcesa();
})();
</script>
