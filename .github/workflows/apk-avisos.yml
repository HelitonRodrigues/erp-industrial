name: APK Avisos Silicate
on:
  push:
    paths: ['app-android.zip', '.github/app-android.zip', '.github/workflows/apk-avisos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Descompactar o projeto
        run: |
          Z=.github/app-android.zip; [ -f "$Z" ] || Z=app-android.zip
          unzip -q -o "$Z" -d build-app
      - name: Montar o APK
        working-directory: build-app/app-android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Renomear
        run: cp build-app/app-android/app/build/outputs/apk/release/app-release.apk AvisosSilicate.apk
      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: avisos-v${{ github.run_number }}
          name: Avisos Silicate v${{ github.run_number }}
          files: AvisosSilicate.apk
