name: Backup diário Supabase
on:
  schedule:
    - cron: '0 6 * * *'      # 06:00 UTC = 03:00 BRT
  workflow_dispatch:          # permite rodar na mão pelo botão "Run workflow"
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar pg_dump 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update && sudo apt-get install -y postgresql-client-17
      - name: Dump
        run: |
          STAMP=$(date +%Y%m%d-%H%M)
          # SUPABASE_DB_URL deve ser a URI do SESSION POOLER (IPv4).
          # A URL direta do Supabase e IPv6 e o runner do Actions falha em silencio.
          # /usr/bin/pg_dump e um wrapper que resolve pro 16 (padrao do runner).
          # Chamar o binario 17 direto — precisa ser >= versao do servidor (17.6).
          /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.SUPABASE_DB_URL }}" --no-owner --no-privileges -Fc -f "erp-$STAMP.dump"
      - name: Guardar como artifact
        uses: actions/upload-artifact@v4
        with:
          name: erp-backup
          path: '*.dump'
          retention-days: 14
