     saldo sem QR) e as ações que antes eram feitas na mão:
       ＋ Criar pallet com rótulo  → RPC acerto_criar_pallet (nº livre, lote/validade da OP ou dos rótulos, status do lab do lote,

       🖨 Reimprimir rótulo         → mesmo nº, mesmo QR (fila da LaserJet)
       🚫 Não existe no barracão    → RPC acerto_nao_existe (sai da contagem com motivo; não vai para o saldo sem QR)
     Rótulo = cópia fiel do totem.html (window.RotuloPallet). Tudo registrado na Auditoria (módulo ACERTO_PALLETS).

window.RotuloPallet=(function(){
const pad=(n,k=2)=>String(n).padStart(k,'0');
// data/hora sempre no horário de Brasília (o fuso do tablet pode estar errado)
const _spParts=d=>{try{const o={};new Intl.DateTimeFormat('en-GB',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d).forEach(x=>o[x.type]=x.value);return o;}catch(e){return {day:pad(d.getDate()),month:pad(d.getMonth()+1),year:d.getFullYear(),hour:pad(d.getHours()),minute:pad(d.getMinutes())};}};
const fData=d=>{const o=_spParts(d);return o.day+'/'+o.month+'/'+o.year;};
const fHora=d=>{const o=_spParts(d);return o.hour+':'+o.minute;};
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fD=s=>{if(!s)return '—';const[y,m,d]=String(s).slice(0,10).split('-');return d+'/'+m+'/'+y;};
const esc_=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/\s/g,'');
// "hoje" sempre no horário de Brasília — tablet com fuso errado não pode mudar o dia dos rótulos
const _fmtSP=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'});
const isoSP=d=>{try{return _fmtSP.format(d);}catch(e){return iso(d);}};
const hojeIso=()=>isoSP(new Date()), ontemIso=()=>isoSP(new Date(Date.now()-864e5));
const usuario=()=>{try{return (JSON.parse(sessionStorage.getItem('erp_user')||localStorage.getItem('erp_user')||'{}').nome)||'Central de rótulos';}catch(e){return 'Central de rótulos';}};
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};

   (simulado: ondulação de 1/2 quadradinho lia 0/8 na versão 5 e 6/8 na versão 7).
   Só usa a versão 7 se o quadradinho ficar com 0,75 mm ou mais; senão H automático; senão Q. */
function qrResistente(texto,ladoMaxMm){
  const tenta=o=>{try{return QRCode.create(texto,o);}catch(e){return null;}}, mod=q=>ladoMaxMm/(q.modules.size+8);
  let q=tenta({errorCorrectionLevel:'H',version:7}); if(q&&mod(q)>=0.75) return q;
  q=tenta({errorCorrectionLevel:'H'}); if(q&&mod(q)>=0.6) return q;
  return QRCode.create(texto,{errorCorrectionLevel:'Q'});
}
function qrSvg(texto,ladoMaxMm,dpmm){
  if(typeof QRCode==='undefined'||!QRCode.create) return `<div style="width:${ladoMaxMm}mm;height:${ladoMaxMm}mm;border:0.5mm solid #000;display:flex;align-items:center;justify-content:center;font:700 7pt Arial;">QR NÃO GERADO</div>`;
  const qr=qrResistente(texto,ladoMaxMm), n=qr.modules.size, d=qr.modules.data, b=4, tot=n+b*2;
  dpmm=dpmm||8; const dm=Math.max(3,Math.floor((ladoMaxMm*dpmm)/tot)), lado=(tot*dm)/dpmm;
  let r=''; for(let y=0;y<n;y++){let x=0;while(x<n){if(d[y*n+x]){const x0=x;while(x<n&&d[y*n+x])x++;r+=`<rect x="${x0+b}" y="${y+b}" width="${x-x0}" height="1"/>`;}else x++;}}
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${tot} ${tot}" width="${lado}mm" height="${lado}mm" shape-rendering="crispEdges" style="display:block;"><rect width="${tot}" height="${tot}" fill="#fff"/><g fill="#000">${r}</g></svg>`;
}

    const caps=g.pals.map(p=>Number(p.sacos_pallet)).filter(Boolean), cap=(g.ops.find(o=>o.cap)||{}).cap||caps.sort((a,b)=>caps.filter(v=>v===b).length-caps.filter(v=>v===a).length)[0]||'';
    return Object.assign(g,L,{laudo:ld,est,fora,carr,pend,cap,prod:g.ops.reduce((s,o)=>s+o.total,0),prov:g.ops.some(o=>o.prov),
      aprov:g.pals.some(p=>p.status==='aprovado'),naoExiste:fora.filter(p=>/^NÃO EXISTE/i.test(p.fora_estoque_motivo||''))}); })
    .sort((a,b)=>b.data.localeCompare(a.data)||a.linha.localeCompare(b.linha));
}

function render(){
  const un=_ehBag(_P)?'bags':'pallets', est=_grupos.reduce((s,g)=>s+g.est.length,0), sc=_grupos.reduce((s,g)=>s+g.est.reduce((t,p)=>t+(Number(p.sacos_pallet)||0),0),0),
    pend=_grupos.reduce((s,g)=>s+g.pend.length,0), carr=_grupos.reduce((s,g)=>s+g.carr.length,0);
  document.getElementById('ap-kpis').innerHTML=`
    <div class="ap-k"><div class="r">${un} com QR no estoque</div><div class="v">${_n(est)}</div><div class="s">${_n(sc)} ${_ehBag(_P)?'un':'sacos'}</div></div>
    <div class="ap-k"><div class="r">Saldo sem QR</div><div class="v">${_n(_saldo)}${_ehBag(_P)?'':' sc'}</div><div class="s">sobras e pallets sem rótulo</div></div>
    <div class="ap-k"><div class="r">Aguardando laboratório</div><div class="v" style="${pend?'color:#b45309':''}">${_n(pend)}</div><div class="s">${pend?'no estoque':'tudo aprovado'}</div></div>
    <div class="ap-k"><div class="r">Carregados no período</div><div class="v">${_n(carr)}</div><div class="s">${un}</div></div>`;
  const tab=document.getElementById('ap-tab');
  if(!_grupos.length){ tab.innerHTML='<div class="ap-vazio">Nada deste produto no período.</div>'; return; }
  const pode=checkPerm(MOD,'create');
  tab.innerHTML=`<table class="ap-tb"><thead><tr><th>Dia</th><th>Linha</th><th>Lote</th><th>Produção</th><th>No estoque (QR)</th><th>Fora da contagem</th><th>Carregados</th><th>Laboratório</th><th>Laudo</th><th></th></tr></thead><tbody>
  ${_grupos.map((g,i)=>{ const k=g.data+'|'+g.linha, ab=_aberto===k;
    return `<tr class="dia ${ab?'aberto':''}" onclick="abrir('${k}')">
      <td><b>${_dBR(g.data)}</b> <span style="color:#94a3b8;font-size:11px;">${_sem[new Date(g.data+'T12:00:00').getDay()]}</span></td><td>${_e(g.linha)}</td>
      <td>${g.lote?_e(g.lote):'<span class="b vm">sem lote</span>'}</td>
      <td>${g.ops.length?(g.prov?'<span class="b am">OP provisória</span> ':'')+_n(g.prod)+(_ehBag(_P)?' un':' sc'):'<span class="b cz">sem OP</span>'}</td>
      <td>${g.est.length}</td><td>${g.fora.length}${g.naoExiste.length?` <span class="b vm" title="não existem no barracão">${g.naoExiste.length} não existe</span>`:''}</td><td>${g.carr.length}</td>
      <td>${g.pend.length?`<span class="b am">${g.pend.length} pendente(s)</span>`:g.aprov?'<span class="b ok">aprovado</span>':'<span class="b cz">—</span>'}</td>
      <td>${g.laudo?`<span class="b ${g.laudo.status==='finalizado'?'ok':'am'}">${_e(String(g.laudo.numero||'').replace('LAU-2026-','LAU-'))}</span>`:'<span class="b cz">—</span>'}</td>
      <td style="white-space:nowrap;">${pode&&g.lote?`<button class="bt g" onclick="event.stopPropagation();novoPallet('${k}')">＋ ${_ehBag(_P)?'Bag':'Pallet'}</button>`:''} <span style="color:#94a3b8;">${ab?'▾':'▸'}</span></td></tr>
      ${ab?subLinhas(g):''}`; }).join('')}</tbody></table>
  <div style="padding:8px 12px;font-size:12px;color:#64748b;">Clique no dia para ver cada ${_ehBag(_P)?'bag':'pallet'} com <b>🖨 Reimprimir</b> e <b>🚫 Não existe no barracão</b>. "Fora da contagem" = remontados com sacos do saldo sem QR ou que não existem.</div>`;
}
function _faixas(ns){ns=ns.slice().sort((a,b)=>a-b);const o=[];for(let i=0;i<ns.length;i++){let j=i;while(j+1<ns.length&&ns[j+1]===ns[j]+1)j++;o.push(i===j?String(ns[i]):ns[i]+' a '+ns[j]);i=j;}return o.join(', ');}
function rotulosSoltos(g){
  const rs=_rots.filter(r=>r.dia===g.data&&r.linha===g.linha&&!r.pallet_id&&!r.lido&&!r.descartado_em&&!r.avulso), ds=_rots.filter(r=>r.dia===g.data&&r.linha===g.linha&&r.descartado_em);
  if(!rs.length&&!ds.length) return '';
  return `<tr class="sub"><td></td><td colspan="9" style="font-size:12.5px;">${rs.length?`🏷️ <b>${rs.length} rótulo(s) impresso(s) sem pallet</b>: nº ${_faixas(rs.map(r=>r.numero))} <span style="color:#64748b;">— ainda não viraram pallet (entram quando a produção for lançada)</span>
    ${checkPerm(MOD,'edit')?` <button class="bt vm" onclick="descartarSoltos('${g.data}','${g.linha}')">🗑 Descartar (jogados fora)</button>`:''}`:''}
    ${ds.length?`<div style="color:#94a3b8;margin-top:3px;">🗑 Descartados: nº ${_faixas(ds.map(r=>r.numero))} — não viram pallet nem estoque</div>`:''}</td></tr>`;
}
async function descartarSoltos(dia,linha){
  if(!guardAction(MOD,'edit')) return;
  const rs=_rots.filter(r=>r.dia===dia&&r.linha===linha&&!r.pallet_id&&!r.lido&&!r.descartado_em&&!r.avulso); if(!rs.length) return;
  const ns=rs.map(r=>r.numero).sort((a,b)=>a-b);
  const m=await erpPrompt(`Descartar os rótulos nº ${_faixas(ns)} de ${_P} (${_dBR(dia)}, ${linha})?\nEles nunca viram pallet nem estoque, mesmo quando a produção for lançada. Motivo:`,{titulo:'🗑 Descartar rótulos',ok:'Descartar'});
  if(!m||!String(m).trim()) return;
  const {data,error}=await _supabase.rpc('acerto_descartar_rotulos',{p_dia:dia,p_linha:linha,p_produto:_P,p_de:ns[0],p_ate:ns[ns.length-1],p_motivo:String(m).trim(),p_usuario:_quem()});
  if(error) return toast('Não descartou: '+error.message,'danger');
  addLog('UPDATE','ACERTO_PALLETS',_P,`Descartou ${data} rótulo(s) nº ${_faixas(ns)} · ${_P} · ${_dBR(dia)} ${linha} — ${m}`);
  toast(`${data} rótulo(s) descartado(s).`,'success'); const ab=_aberto; await carregar(); _aberto=ab; render();
}
function subLinhas(g){
  const ps=g.pals.slice().sort((a,b)=>a.numero-b.numero), pode=checkPerm(MOD,'edit');
  if(!ps.length) return `<tr class="sub"><td colspan="10" style="color:#94a3b8;">Nenhum ${_ehBag(_P)?'bag':'pallet'} com QR neste dia.</td></tr>`+rotulosSoltos(g);
  return rotulosSoltos(g)+ps.map(p=>{ const sit=p.estoque_status!=='estoque'?`<span class="b az">carregado${p.ordem_numero?' · '+_e(p.ordem_numero):''}</span>`
      :p.fora_estoque_em?(/^NÃO EXISTE/i.test(p.fora_estoque_motivo||'')?`<span class="b vm" title="${_e(p.fora_estoque_motivo)}">não existe</span>`:`<span class="b cz" title="${_e(p.fora_estoque_motivo||'')}">fora da contagem</span>`)
      :'<span class="b ok">no estoque</span>';
    return `<tr class="sub"><td></td><td>nº <b>${p.numero}</b></td><td colspan="2" style="font-family:ui-monospace,monospace;font-size:12px;">${_e(p.codigo||'—')}</td>
      <td>${_n(p.sacos_pallet)} ${_ehBag(_P)?'un':'sc'}</td><td colspan="2">${sit}</td><td>${p.status==='aprovado'?'<span class="b ok">aprovado</span>':`<span class="b am">${_e(p.status||'pendente')}</span>`}${p.a_conferir?' <span class="b am">a conferir</span>':''}</td>
      <td colspan="2" style="white-space:nowrap;">${p.codigo&&checkPerm(MOD,'view')?`<button class="bt" onclick="reimprimir('${p.id}')">🖨 Reimprimir</button>`:''}
        ${pode&&p.estoque_status==='estoque'&&!p.fora_estoque_em?` <button class="bt vm" onclick="naoExiste('${p.id}')">🚫 Não existe</button>`:''}</td></tr>`; }).join('');
}
function abrir(k){ _aberto=_aberto===k?'':k; render(); }

/* ── criar pallet ── */
function novoPallet(k){
  if(!guardAction(MOD,'create')) return;
  const g=_grupos.find(x=>x.data+'|'+x.linha===k); if(!g) return;
  const prox=Math.max(0,...g.pals.map(p=>p.numero||0),..._rots.filter(r=>r.dia===g.data&&r.linha===g.linha).map(r=>r.numero||0))+1;
  _form={k,g,sacos:g.cap||'',origem:_saldo>0?'sem_qr':'nova',prox,qtd:1}; renderForm();
  document.getElementById('ap-form').scrollIntoView({behavior:'smooth',block:'start'});
}
function renderForm(){
  const el=document.getElementById('ap-form'); if(!el) return;
  if(!_form){ el.innerHTML='<div style="font-weight:900;color:var(--primary);font-size:16px;">＋ Criar pallet com rótulo</div><div class="ap-vazio" style="padding:12px 0;">Clique em <b>＋ Pallet</b> no dia do lote.</div>'; return; }
  const f=_form, g=f.g, q=Math.max(1,parseInt(f.qtd,10)||1), s=(Number(f.sacos)||0)*q, un=_ehBag(_P)?'un':'sc';
  const okSaldo=f.origem!=='sem_qr'||s<=_saldo, lab=g.laudo&&g.laudo.status==='finalizado'||g.aprov;
  el.innerHTML=`<div style="font-weight:900;color:var(--primary);font-size:16px;">＋ Criar ${_ehBag(_P)?'bag':'pallet'} com rótulo</div>
    <div style="font-size:12px;color:#64748b;">${_e(_P)} · <b>${_dBR(g.data)}</b> · ${_e(g.linha)}</div>
    <label>Lote</label><input class="in ro" value="${_e(g.lote)}" readonly>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;"><div><label>${_ehBag(_P)?'Unidades':'Sacos no pallet'}</label><input class="in" id="ap-sacos" type="number" min="1" value="${_e(f.sacos)}" oninput="_form.sacos=this.value;renderForm();const i=document.getElementById('ap-sacos');if(i){i.focus();const v=i.value;i.value='';i.value=v;}"></div>
      <div><label>Número</label><input class="in ro" value="#${f.prox}${q>1?' a #'+(f.prox+q-1):''} (próximo livre)" readonly></div></div>
    <label>Quantos ${_ehBag(_P)?'bags':'pallets'} iguais criar de uma vez?</label><input class="in" id="ap-qtd" type="number" min="1" max="40" value="${q}" oninput="_form.qtd=this.value;renderForm();const i=document.getElementById('ap-qtd');if(i){i.focus();const v=i.value;i.value='';i.value=v;}">
    <label>De onde vêm os ${_ehBag(_P)?'bags':'sacos'}?</label>
    <div class="ap-op ${f.origem==='sem_qr'?'on':''}" onclick="_form.origem='sem_qr';renderForm()"><input type="radio" ${f.origem==='sem_qr'?'checked':''}><div><b>Do saldo sem QR</b> (sobras / pallet sem rótulo) — baixa ${_n(s)} ${un} do saldo (${_n(_saldo)} → ${_n(_saldo-s)})</div></div>
    <div class="ap-op ${f.origem==='nova'?'on':''}" onclick="_form.origem='nova';renderForm()"><input type="radio" ${f.origem==='nova'?'checked':''}><div><b>Produção nova ainda não lançada</b> — entra no estoque normal (lance a produção depois)</div></div>
    <div class="ap-chk">
      ${g.ops.length?`✅ Produção (OP) de ${_dBR(g.data)} encontrada${g.prov?' — <span class="x">provisória</span>':''}`:'<span class="x">⚠ Sem OP neste dia — o pallet fica "a conferir" até lançar a produção</span>'}<br>
      ${lab?'✅ Laboratório: lote <b>aprovado</b> → nasce aprovado':'<span class="x">⏳ Laboratório: lote ainda não aprovado → nasce pendente</span>'}<br>
      ${g.laudo?`${g.laudo.status==='finalizado'?'✅':'📝'} Laudo <b>${_e(g.laudo.numero)}</b>${g.laudo.status==='finalizado'?' — sai no certificado da carga':' (rascunho)'}`:'<span class="x">— Sem laudo do lote ainda (liga sozinho quando sair)</span>'}<br>
      ${okSaldo?'':'<span style="color:#b91c1c;font-weight:800;">✖ O saldo sem QR não tem essa quantidade.</span>'}
    </div>
    <button class="ap-go" id="ap-go" ${s>0&&okSaldo&&q<=40?'':'disabled'} onclick="criar()">🖨 Criar ${q>1?q+' '+(_ehBag(_P)?'bags':'pallets')+' ':''}e imprimir na LaserJet</button>
    <button class="bt" style="width:100%;margin-top:8px;" onclick="_form=null;renderForm()">Cancelar</button>`;
}
async function criar(){
  if(!guardAction(MOD,'create')||!_form) return;
  const f=_form, g=f.g, s=parseInt(f.sacos,10), q=Math.max(1,Math.min(40,parseInt(f.qtd,10)||1));
  if(!(s>0)) return toast('Informe a quantidade.','warning');
  // (18/11) vários de uma vez: um RPC por pallet (nº seguidos), um único envio para a impressora
  if(!(await erpConfirm(`Criar ${q>1?q+' '+(_ehBag(_P)?'bags':'pallets')+' (nº '+f.prox+' a '+(f.prox+q-1)+')':'o '+(_ehBag(_P)?'bag':'pallet')+' nº '+f.prox} de ${_P} (${_dBR(g.data)}, ${g.linha}, lote ${g.lote}) com ${s} ${_ehBag(_P)?'un':'sacos'} cada${f.origem==='sem_qr'?' tirados do saldo sem QR':''} e imprimir?`,{titulo:'🏷️ Criar pallet',ok:'Criar e imprimir',cancelar:'Voltar'}))) return;
  const bt=document.getElementById('ap-go'); if(bt){bt.disabled=true;bt.textContent='Criando…';}
  const rows=[];
  for(let i=0;i<q;i++){
    const {data,error}=await _supabase.rpc('acerto_criar_pallet',{p_produto:_P,p_dia:g.data,p_linha:g.linha,p_sacos:s,p_origem:f.origem,p_usuario:_quem()});
    if(error){ toast(`Parou no ${i+1}º: `+error.message,'danger'); break; }
    addLog('CREATE','ACERTO_PALLETS',data.codigo,`Criou ${_ehBag(_P)?'bag':'pallet'} nº ${data.numero} · ${_P} · ${_dBR(g.data)} ${g.linha} · lote ${data.lote} · ${s} ${_ehBag(_P)?'un':'sc'} (${f.origem==='sem_qr'?'saldo sem QR':'produção nova'}) · ${data.status}`);
    rows.push({numero:data.numero,codigo:data.codigo,lote:data.lote,validade:data.validade,dia:g.data,linha:g.linha,produto:_P});
  }
  if(!rows.length){ if(bt){bt.disabled=false;bt.textContent='🖨 Criar e imprimir na LaserJet';} return; }
  await imprimir(rows,rows.length>1?`${rows.length} rótulos criados — nº ${rows[0].numero} a ${rows[rows.length-1].numero}`:'Rótulo criado — nº '+rows[0].numero);
  _form=null; await carregar(); _aberto=g.data+'|'+g.linha; render();
}

/* ── impressão: mesmo rótulo da Central, na fila da LaserJet (ou neste computador) ── */
async function imprimir(rows,titulo){
  let html='';
  try{ await RotuloPallet.carregar(); html=RotuloPallet.html(rows.map(RotuloPallet.palDe),RotuloPallet.prodPorNome(_P)); }
  catch(e){ toast('Não montou o rótulo: '+(e.message||e),'danger'); return; }
  const r=await _supabase.from('impressao_fila').insert({destino:'laser',tipo:'rotulo',titulo:'Rótulos · '+_P+' · nº '+RotuloPallet.faixas(rows.map(x=>x.numero))+' (acerto)',tamanho:'A4',qtd:rows.length,criado_por:_quem()||'Acerto de pallets',html});
  const ov=document.createElement('div'); ov.className='ap-ov';
  ov.innerHTML=`<div class="ap-mod"><h3>${r.error?'⚠️':'✅'} ${_e(titulo)}</h3>
    <div style="font-size:13.5px;color:#334155;line-height:1.6;">${r.error?'Não consegui mandar para a LaserJet: '+_e(r.error.message)+'.<br>Imprima neste computador:':`Enviado para a <b>LaserJet</b> (estação de impressão). Se a estação estiver desligada, imprima neste computador.`}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;">
      <button class="bt" id="ap-aqui">🖨 Imprimir neste computador</button><button class="bt g" onclick="this.closest('.ap-ov').remove()">OK</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector('#ap-aqui').onclick=()=>{ const w=window.open('','_blank'); if(!w) return toast('O navegador bloqueou a janela de impressão.','warning');
    w.document.write('<html><head><meta charset="utf-8"><title>Rótulo</title><style>@page{size:A4;margin:0}body{margin:0}</style></head><body>'+html+'</body></html>'); w.document.close(); setTimeout(()=>{w.focus();w.print();},600); };
}
async function reimprimir(id){
  const p=_pals.find(x=>x.id===id); if(!p) return;
  const r=_rots.find(x=>x.id===p.rotulo_id)||_rots.find(x=>x.codigo===p.codigo);
  const g=_grupos.find(x=>x.data===p.data&&x.linha===p.linha)||{};
  const lote=(r&&r.lote)||g.lote, val=(r&&r.validade)||g.validade;
  if(!lote) return toast('Este pallet não tem lote para o rótulo.','warning');
  if(!(await erpConfirm(`Reimprimir o rótulo nº ${p.numero} (${p.codigo})? Sai igual ao original: mesmo número e mesmo QR.`,{titulo:'🖨 Reimprimir',ok:'Reimprimir',cancelar:'Voltar'}))) return;
  addLog('UPDATE','ACERTO_PALLETS',p.codigo,`Reimprimiu nº ${p.numero} · ${_P} · ${_dBR(p.data)} ${p.linha}`);
  await imprimir([{numero:p.numero,codigo:p.codigo,lote,validade:val,dia:p.data,linha:p.linha,produto:_P}],'Reimpressão — nº '+p.numero);
  carregarHist();
}
async function naoExiste(id){
  if(!guardAction(MOD,'edit')) return;
  const p=_pals.find(x=>x.id===id); if(!p) return;
  const m=await erpPrompt(`O ${_ehBag(_P)?'bag':'pallet'} nº ${p.numero} (${p.codigo}) aparece no estoque mas NÃO existe no barracão?\nEle sai da contagem (não vai para o saldo sem QR). Informe o motivo:`,{titulo:'🚫 Não existe no barracão',ok:'Tirar do estoque'});
  if(!m||!String(m).trim()) return;
  const {error}=await _supabase.rpc('acerto_nao_existe',{p_pallet:id,p_motivo:String(m).trim(),p_usuario:_quem()});
  if(error) return toast('Não tirou: '+error.message,'danger');
  addLog('UPDATE','ACERTO_PALLETS',p.codigo,`Não existe no barracão: nº ${p.numero} · ${_P} · ${_dBR(p.data)} ${p.linha} — ${m}`);
  toast(`Nº ${p.numero} saiu do estoque.`,'success'); const ab=_aberto; await carregar(); _aberto=ab; render();
}

/* ── histórico ── */
function renderHist(rows){
  document.getElementById('ap-hist').innerHTML=rows.length?rows.map(h=>`<div>${new Date(h.criado_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} · <b>${_e(String(h.usuario_email||'').split('@')[0])}</b> · ${_e(h.descricao)}</div>`).join(''):'<div class="ap-vazio">Nenhum acerto ainda.</div>';
}
async function carregarHist(){ const {data}=await _supabase.from('auditoria').select('criado_em,usuario_email,descricao').eq('modulo','ACERTO_PALLETS').order('criado_em',{ascending:false}).limit(15); renderHist(data||[]); }

async function iniciar(){
  if(!checkPerm(MOD,'view')){ document.getElementById('main-content').innerHTML='<div class="ap-vazio">Sem acesso ao Acerto de Pallets. Peça ao administrador para liberar no perfil.</div>'; return; }
  await carregarProdutos(); if(document.getElementById('ap-prod').value) carregar();
  if(typeof applyActionGuards==='function') applyActionGuards();
}
fetch('partials/sidebar.html').then(r=>r.text()).then(h=>{document.getElementById('sidebar-container').innerHTML=h;document.querySelector('[href="acerto-pallets.html"]')?.classList.add('active');if(typeof openGroup==='function')openGroup('producao');});
initSidebar('acerto-pallets.html').then(()=>{if(getUser())iniciar();});
</script>
