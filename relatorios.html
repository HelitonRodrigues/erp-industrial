<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP Industrial — Relatórios</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<script src="js/regras.js"></script>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   RELATÓRIOS (out/2026) — mesmo desenho do Painel da fábrica
   Período padrão: ONTEM (fechamento D-1). Produção na unidade de cada produto
   (sacos, bags, granel em t) — nunca somando unidades diferentes.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --ok:#16a34a; --ok-bg:#dcfce7; --ok-line:#22c55e;
  --warn:#b45309; --warn-bg:#fef3c7; --warn-line:#f59e0b;
  --bad:#dc2626; --bad-bg:#fee2e2; --bad-line:#ef4444;
  --info:#2563eb; --info-bg:#dbeafe;
  --wd-line:#e3e9f0; --line-soft:#f1f5f9;
  --ink-2:#475569; --ink-3:#64748b; --ink-4:#94a3b8; --ink-5:#cbd5e1;
  --wd-shadow:0 1px 2px rgba(4,45,77,.05);
}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}

/* Cabeçalho */
.rl-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
.rl-head h1{margin:0;font-size:26px;font-weight:800;color:var(--primary);letter-spacing:-.4px;}
.rl-head p{margin:3px 0 0;font-size:13.5px;color:var(--ink-3);font-weight:600;}
.rl-head p b{color:var(--primary);}
.export-btns{display:flex;gap:8px;flex-wrap:wrap;}
.btn-print,.btn-pdf,.btn-csv{height:40px;padding:0 14px;border-radius:11px;border:1.5px solid var(--wd-line);background:#fff;font:inherit;
  font-size:13px;font-weight:700;color:var(--primary);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn-print:hover,.btn-pdf:hover,.btn-csv:hover{border-color:var(--primary);}
.export-btns .btn-pdf{background:var(--primary);border-color:var(--primary);color:var(--accent);}
.sec-actions .btn-pdf,.sec-actions .btn-csv,.sec-actions .btn-print{height:34px;font-size:12px;padding:0 11px;border-radius:9px;}

/* Barra de período */
.filtro-bar{background:#fff;border:1px solid var(--wd-line);border-radius:14px;padding:12px 14px;margin-bottom:18px;box-shadow:var(--wd-shadow);
  display:flex;gap:12px 18px;flex-wrap:wrap;align-items:flex-end;}
.rl-presets{display:flex;gap:3px;background:var(--line-soft);padding:3px;border-radius:11px;flex-wrap:wrap;}
.chip-periodo{border:0;background:transparent;font:inherit;font-size:13px;font-weight:700;color:var(--ink-3);padding:8px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;}
.chip-periodo:hover{color:var(--primary);}
.chip-periodo.ativo{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(4,45,77,.14);}
.chip-periodo.ativo[data-p="ontem"]{background:var(--accent);}
.rl-campos{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.filtro-group{display:flex;flex-direction:column;gap:3px;}
.filtro-label{font-size:11.5px;font-weight:700;color:var(--ink-3);}
.filtro-bar .form-input{font-size:13px;padding:7px 10px;height:38px;border-radius:9px;}

/* Corpo: menu de relatórios + conteúdo */
.rl-body{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;align-items:start;}
.rl-nav{position:sticky;top:76px;background:#fff;border:1px solid var(--wd-line);border-radius:14px;padding:10px;box-shadow:var(--wd-shadow);
  max-height:calc(100vh - 96px);overflow-y:auto;}
.rl-grp{font-size:11.5px;font-weight:800;color:var(--ink-4);padding:10px 10px 4px;}
.rl-grp:first-child{padding-top:4px;}
.cat-tab{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;font:inherit;font-size:13.5px;font-weight:600;
  color:var(--ink-2);padding:8px 10px;border-radius:9px;cursor:pointer;text-align:left;white-space:nowrap;}
.cat-tab:hover{background:var(--line-soft);color:var(--primary);}
.cat-tab.ativo{background:var(--primary);color:#fff;font-weight:700;}
.cat-tab .ic{width:20px;text-align:center;flex-shrink:0;}
.rl-main{min-width:0;}
.rl-tit{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 14px;}
.rl-tit h2{margin:0;font-size:19px;font-weight:800;color:var(--primary);letter-spacing:-.2px;}
.rl-tit span{font-size:12.5px;color:var(--ink-3);}

/* KPIs */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px;margin-bottom:16px;}
.kpi-box{position:relative;background:#fff;border:1px solid var(--wd-line);border-radius:14px;padding:14px 16px;box-shadow:var(--wd-shadow);min-width:0;}
.kpi-box::before{content:'';position:absolute;left:16px;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--kc,var(--primary));}
.kpi-box-value{font-size:clamp(19px,1.7vw,25px);font-weight:800;color:var(--primary);letter-spacing:-.5px;line-height:1.15;
  font-variant-numeric:tabular-nums;margin-top:4px;word-break:break-word;}
.kpi-box-value small{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:0;}
.kpi-box-label{font-size:12.5px;font-weight:700;color:var(--ink-2);margin-top:4px;}
.kpi-box-sub{font-size:11.5px;color:var(--ink-4);margin-top:2px;line-height:1.35;}
.kpi-box.hero{background:var(--primary);border-color:var(--primary);}
.kpi-box.hero::before{background:var(--accent);}
.kpi-box.hero .kpi-box-value{color:var(--accent) !important;}
.kpi-box.hero .kpi-box-label{color:rgba(255,255,255,.85);}
.kpi-box.hero .kpi-box-sub{color:rgba(255,255,255,.6);}

/* Painéis e títulos */
.panel{background:#fff;border:1px solid var(--wd-line);border-radius:14px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--wd-shadow);min-width:0;}
.sec-header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.sec-title{font-size:15px;font-weight:800;color:var(--primary);letter-spacing:-.1px;}
.sec-actions{display:flex;gap:6px;flex-wrap:wrap;}

/* Tabelas */
.rel-table-wrap{overflow-x:auto;margin:0 -2px;}
.rel-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
.rel-table thead th{padding:9px 11px;font-size:11px;white-space:nowrap;}
.rel-table thead th:first-child{border-radius:8px 0 0 8px;}
.rel-table thead th:last-child{border-radius:0 8px 8px 0;}
.rel-table td{padding:10px 11px;border-bottom:1px solid var(--line-soft);color:var(--ink-2);vertical-align:middle;}
.rel-table td strong{color:var(--primary);}
.rel-table tbody tr{transition:background .1s;}
.rel-table tbody tr[onclick]{cursor:pointer;}
.rel-table tbody tr:hover td{background:#f8fafc;}
.rel-table td:first-child{white-space:nowrap;}
.rel-table .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.rel-table tfoot td{font-weight:800;color:var(--primary);border-top:1.5px solid var(--wd-line);border-bottom:0;}
.rel-table .sub{display:block;font-size:11px;color:var(--ink-4);font-weight:500;}

/* Status */
.st{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.st-ok{background:var(--ok-bg);color:#166534;} .st-warn{background:var(--warn-bg);color:#92400e;}
.st-danger{background:var(--bad-bg);color:#991b1b;} .st-info{background:var(--info-bg);color:#1e40af;}
.st-gray{background:var(--line-soft);color:var(--ink-3);} .st-purple{background:#ede9fe;color:#5b21b6;}

/* Gráficos */
.chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px;}
.chart-box{background:#fff;border:1px solid var(--wd-line);border-radius:14px;padding:16px 18px;box-shadow:var(--wd-shadow);min-width:0;}
.chart-box-title{font-size:15px;font-weight:800;color:var(--primary);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.chart-box canvas{max-height:300px;}
.un-tg{display:flex;gap:3px;background:var(--line-soft);padding:3px;border-radius:9px;}
.un-tg:empty{display:none;}
.un-b{border:0;background:transparent;font:inherit;font-size:12px;font-weight:700;color:var(--ink-3);padding:5px 10px;border-radius:7px;cursor:pointer;}
.un-b.on{background:#fff;color:var(--primary);box-shadow:0 1px 2px rgba(4,45,77,.12);}
.hp-cell{display:flex;align-items:center;gap:8px;min-width:120px;}
.hp-bar{flex:1;height:7px;background:var(--line-soft);border-radius:6px;overflow:hidden;min-width:50px;}
.hp-bar>span{display:block;height:100%;border-radius:6px;}
.hp-cell b{font-variant-numeric:tabular-nums;min-width:46px;text-align:right;}
.ln-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px;}

/* Modal */
.rel-modal-overlay{position:fixed;inset:0;background:rgba(3,32,54,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;
  opacity:0;pointer-events:none;transition:opacity .2s;}
.rel-modal-overlay.open{opacity:1;pointer-events:auto;}
.rel-modal{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:760px;max-height:86vh;overflow-y:auto;box-shadow:0 16px 60px rgba(4,45,77,.22);
  transform:translateY(10px);transition:transform .2s;}
.rel-modal-overlay.open .rel-modal{transform:none;}
.rel-modal-hdr{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;}
.rel-modal-title{font-size:17px;font-weight:800;color:var(--primary);}
.rel-modal-close{width:36px;height:36px;border-radius:10px;border:0;background:var(--line-soft);color:var(--ink-3);font-size:16px;cursor:pointer;flex-shrink:0;}
.rel-modal-close:hover{background:var(--wd-line);color:var(--primary);}
.det-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.det-cell{background:#f8fafc;border-radius:10px;padding:10px 12px;}
.det-cell-label{font-size:11px;font-weight:700;color:var(--ink-4);}
.det-cell-value{font-size:14px;font-weight:700;color:var(--primary);margin-top:2px;}

.rel-loading{text-align:center;padding:70px 20px;color:var(--ink-4);}
.rel-empty{text-align:center;padding:28px 16px;color:var(--ink-4);font-size:13px;}

@page{size:A4 portrait;margin:12mm 14mm;}
@media print{
  #sidebar-container,.sidebar,.topbar,.filtro-bar,.rl-nav,.export-btns,.sec-actions,#filtro-global,#rel-loading,
  .rel-modal-overlay,#toast-container,.un-tg,button{display:none !important;}
  html,body{margin:0 !important;padding:0 !important;width:100% !important;height:auto !important;overflow:visible !important;background:#fff !important;font-size:11px !important;}
  .main-content,.main-content.collapsed{margin-left:0 !important;padding:16px 20px !important;width:100% !important;max-width:100% !important;overflow:visible !important;}
  .rl-body{display:block !important;}
  #print-header-inject{display:block !important;position:relative !important;width:100% !important;margin-bottom:16px !important;page-break-after:avoid !important;}
  .rel-table-wrap{overflow:visible !important;width:100% !important;}
  .rel-table{width:100% !important;font-size:9px !important;}
  .rel-table thead th{font-size:8px !important;padding:5px 6px !important;white-space:normal !important;}
  .rel-table td{font-size:9px !important;padding:5px 6px !important;white-space:normal !important;}
  .kpi-row{grid-template-columns:repeat(auto-fill,minmax(100px,1fr)) !important;gap:6px !important;margin-bottom:10px !important;}
  .kpi-box{padding:8px 10px !important;box-shadow:none !important;}
  .kpi-box-value{font-size:16px !important;}
  .chart-grid{grid-template-columns:1fr 1fr !important;gap:10px !important;page-break-inside:avoid !important;}
  .chart-box canvas{max-height:160px !important;}
  .panel,.chart-box{padding:12px !important;margin-bottom:12px !important;box-shadow:none !important;break-inside:avoid !important;}
  thead{display:table-header-group !important;}
  tr{page-break-inside:avoid !important;}
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}
}

@media (max-width:1100px){
  .rl-body{grid-template-columns:minmax(0,1fr);}
  .rl-nav{position:static;max-height:none;display:flex;gap:4px;overflow-x:auto;padding:6px;scrollbar-width:thin;}
  .rl-grp{display:none;}
  .cat-tab{width:auto;flex-shrink:0;}
}
@media (max-width:1350px){ #rel-content [style*="grid-template-columns:1fr 1fr"]{grid-template-columns:minmax(0,1fr) !important;} }
@media (max-width:900px){ .chart-grid{grid-template-columns:minmax(0,1fr);} #rel-content [style*="grid-template-columns"]{grid-template-columns:minmax(0,1fr) !important;} }
@media (max-width:640px){
  .filtro-bar{padding:10px;}
  .rl-presets{width:100%;display:grid;grid-template-columns:repeat(3,1fr);}
  .chip-periodo{flex:1;padding:8px 6px;font-size:12.5px;}
  .rl-campos{width:100%;}
  .rl-campos .filtro-group{flex:1 1 45%;}
  .rl-campos .form-input{width:100% !important;}
  .kpi-row{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
  .panel,.chart-box{padding:14px;}
  .export-btns{width:100%;} .export-btns>*{flex:1;justify-content:center;}
  #rel-clock{display:none;}
  .topbar-user > div:last-child{display:none;}
}
</style>
</head>
<body>
<div id="sidebar-container"></div>

<header class="topbar" id="topbar">
  <button class="topbar-open-sidebar" onclick="toggleSidebar()">☰</button>
  <div class="topbar-title">Relatórios</div>
  <div class="topbar-right">
    <span id="rel-clock" style="font-size:13px;color:#64748b;font-weight:500;"></span>
    <div class="topbar-user">
      <div class="user-avatar" style="width:34px;height:34px;font-size:13px;" id="top-avatar">SA</div>
      <div>
        <div class="topbar-user-name" id="top-user-name">Super Admin</div>
        <div class="topbar-user-profile" id="top-user-perfil">SADM</div>
      </div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()" style="color:#94a3b8;">Sair</button>
  </div>
</header>

<main class="main-content" id="main-content">

  <div class="rl-head">
    <div>
      <h1>Relatórios</h1>
      <p id="rl-periodo-txt">—</p>
    </div>
    <div class="export-btns">
      <button class="btn-print" onclick="imprimirAtual()">🖨️ Imprimir</button>
      <button class="btn-csv"   onclick="exportarCSVAtual()">📊 CSV</button>
      <button class="btn-pdf"   onclick="gerarPDFAtual()">📄 PDF</button>
    </div>
  </div>

  <!-- PERÍODO — padrão ONTEM (fechamento D-1) -->
  <div class="filtro-bar" id="filtro-global">
    <div class="rl-presets" role="group" aria-label="Período">
      <button type="button" class="chip-periodo ativo" data-p="ontem" onclick="setPeriodo('ontem',this,true)">Ontem</button>
      <button type="button" class="chip-periodo" data-p="7d"     onclick="setPeriodo('7d',this,true)">7 dias</button>
      <button type="button" class="chip-periodo" data-p="mes"    onclick="setPeriodo('mes',this,true)">Este mês</button>
      <button type="button" class="chip-periodo" data-p="mesant" onclick="setPeriodo('mesant',this,true)">Mês anterior</button>
      <button type="button" class="chip-periodo" data-p="30d"    onclick="setPeriodo('30d',this,true)">30 dias</button>
      <button type="button" class="chip-periodo" data-p="3m"     onclick="setPeriodo('3m',this,true)">3 meses</button>
    </div>
    <div class="rl-campos">
      <label class="filtro-group"><span class="filtro-label">De</span>
        <input type="date" id="f-ini" class="form-input" style="width:145px;" onchange="periodoManual()"></label>
      <label class="filtro-group"><span class="filtro-label">Até</span>
        <input type="date" id="f-fim" class="form-input" style="width:145px;" onchange="periodoManual()"></label>
      <label class="filtro-group"><span class="filtro-label">Linha</span>
        <select id="f-linha" class="form-input" style="width:150px;" onchange="carregarAba()"><option value="">Todas</option></select></label>
      <label class="filtro-group"><span class="filtro-label">Turno</span>
        <select id="f-turno" class="form-input" style="width:150px;" onchange="carregarAba()"><option value="">Todos</option></select></label>
      <label class="filtro-group" id="fg-status" style="display:none;"><span class="filtro-label">Status</span>
        <select id="f-status" class="form-input" style="width:150px;" onchange="carregarAba()"><option value="">Todos</option></select></label>
    </div>
  </div>

  <div class="rl-body">
    <nav class="rl-nav" id="rl-nav" aria-label="Relatórios"></nav>
    <section class="rl-main">
      <div class="rl-tit"><h2 id="rl-aba-nome">Produção</h2><span id="rl-aba-desc"></span></div>
      <div id="rel-loading" class="rel-loading">
        <div class="spin" style="width:36px;height:36px;border-width:3px;margin:0 auto 14px;"></div>
        <div style="font-size:14px;font-weight:600;">Carregando dados…</div>
      </div>
      <div id="rel-content" style="display:none;"></div>
    </section>
  </div>

</main>

<!-- MODAL DETALHE -->
<div class="rel-modal-overlay" id="rel-modal" onclick="if(event.target===this)fecharModal()">
  <div class="rel-modal">
    <div class="rel-modal-hdr">
      <div class="rel-modal-title" id="rel-modal-title">Detalhes</div>
      <button class="rel-modal-close" onclick="fecharModal()">✕</button>
    </div>
    <div id="rel-modal-body"></div>
  </div>
</div>

<div id="toast-container"></div>

<script>
/* ══════════════════════════════════════════════════════════
   ESTADO GLOBAL
   ══════════════════════════════════════════════════════════ */
let _abaAtual = 'producao';
let _linhas   = [];
let _charts   = {};  // instâncias Chart.js ativas
let _empresa  = {};  // dados de empresa_config

/* ── SETUP ── */
fetch('partials/sidebar.html').then(r=>r.text()).then(html=>{
  document.getElementById('sidebar-container').innerHTML = html;
  document.querySelector('[href="relatorios.html"]')?.classList.add('active');
  openGroup('principal');
  initSidebar('relatorios.html');
});

setInterval(()=>{
  const c=document.getElementById('rel-clock');
  if(c) c.textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}, 1000);

/* Menu de relatórios, agrupado por área */
const ABAS = [
  { grp:'Visão geral', itens:[ ['gerencial','📋','Gerencial','Resumo de todas as áreas no período'] ]},
  { grp:'Produção', itens:[
    ['producao','⚙️','Produção','OPs, horas e produção por linha'],
    ['qualidade','🧪','Qualidade','Laboratório, pallets e lotes'],
    ['aferidor','🏷️','Aferidor','Aferições de aditivação'],
    ['manutencao','🔧','Manutenção','Ordens de serviço'],
    ['equipamentos','🛠️','Equipamentos','Cadastro e situação dos equipamentos'] ]},
  { grp:'Logística', itens:[
    ['portaria','🚛','Portaria','Entradas, pesagens e fila'],
    ['carregamento','🚚','Carregamento','Cargas e romaneios'],
    ['expedicao','📤','Expedição','Ordens de expedição'],
    ['frota','🚗','Frota','Veículos e revisões'],
    ['abastecimento','⛽','Abastecimento','Bombas, entradas e consumo'] ]},
  { grp:'Suprimentos e custos', itens:[
    ['almoxarifado','📦','Almoxarifado','Estoque e movimentações'],
    ['compras','🛒','Compras','Pedidos e solicitações'],
    ['terceiros','🤝','Terceiros','Serviços e remessas'],
    ['custos','💰','Custos','Lançamentos por natureza e centro'] ]},
  { grp:'Pessoas e conformidade', itens:[
    ['rh','👥','RH','Funcionários, férias e escala'],
    ['epi','🦺','EPI','Entregas e trocas'],
    ['bpf','📋','BPF','Não conformidades, auditorias e treinamentos'] ]},
];
const _ABA_INFO = {}; ABAS.forEach(g=>g.itens.forEach(([k,ic,nome,desc])=>_ABA_INFO[k]={ic,nome,desc}));
function montarNav(){
  document.getElementById('rl-nav').innerHTML = ABAS.map(g=>
    `<div class="rl-grp">${g.grp}</div>`+g.itens.map(([k,ic,nome])=>
      `<button type="button" class="cat-tab${k===_abaAtual?' ativo':''}" data-aba="${k}" onclick="trocarAba('${k}',this)" aria-current="${k===_abaAtual?'page':'false'}"><span class="ic">${ic}</span>${nome}</button>`).join('')
  ).join('');
}
function _tituloAba(){
  const i=_ABA_INFO[_abaAtual]||{nome:_abaAtual,desc:''};
  document.getElementById('rl-aba-nome').textContent=i.nome;
  document.getElementById('rl-aba-desc').textContent=i.desc;
}

/* ── PERÍODO — tudo termina em ONTEM: o dia corrente ainda não fechou ── */
function setPeriodo(tipo, btn, recarregar){
  document.querySelectorAll('.chip-periodo').forEach(c=>c.classList.remove('ativo'));
  if(btn) btn.classList.add('ativo');
  const ontem=_diaRel(-1);
  let ini=new Date(ontem), fim=new Date(ontem);
  if(tipo==='7d'){ ini=_diaRel(-7); }
  else if(tipo==='30d'){ ini=_diaRel(-30); }
  else if(tipo==='3m'){ ini=_diaRel(-91); }
  else if(tipo==='mes'){ ini=new Date(ontem.getFullYear(), ontem.getMonth(), 1); }
  else if(tipo==='mesant'){ const h=new Date(); ini=new Date(h.getFullYear(), h.getMonth()-1, 1); fim=new Date(h.getFullYear(), h.getMonth(), 0); }
  document.getElementById('f-ini').value=_iso(ini);
  document.getElementById('f-fim').value=_iso(fim);
  _textoPeriodo();
  if(recarregar) carregarAba();
}
function periodoManual(){
  const i=document.getElementById('f-ini'), f=document.getElementById('f-fim');
  if(i.value&&f.value&&i.value>f.value){ const t=i.value; i.value=f.value; f.value=t; }
  document.querySelectorAll('.chip-periodo').forEach(c=>c.classList.remove('ativo'));
  _textoPeriodo(); carregarAba();
}
function _textoPeriodo(){
  const {ini,fim}=getPeriodo(), el=document.getElementById('rl-periodo-txt'); if(!el||!ini||!fim) return;
  const d=s=>new Date(s+'T12:00:00');
  const n=Math.round((d(fim)-d(ini))/86400000)+1;
  const ontem=_iso(_diaRel(-1));
  if(ini===fim) el.innerHTML=(ini===ontem?'<b>Fechamento de ontem</b> · ':'')+d(ini).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  else el.innerHTML=`<b>${fmtD(ini)} a ${fmtD(fim)}</b> · ${n} dias`;
}

function getPeriodo(){
  return {
    ini:    document.getElementById('f-ini').value,
    fim:    document.getElementById('f-fim').value,
    linha:  document.getElementById('f-linha').value,
    turno:  document.getElementById('f-turno').value,
    status: document.getElementById('f-status').value,
  };
}

  const seq=++_cargaSeq;

/* ══════════════════════════════════════════════════════════
   PRODUÇÃO NA UNIDADE DO PRODUTO
   Sacos, bags (unidades) e granel em t (só a Longa Vida). O granel é
   lançado em kg na OP e convertido pela unidade do cadastro.
   ══════════════════════════════════════════════════════════ */
let _PRODS = [];
const _UNS = [['sc','Sacos','sc',0],['bags','Bags','bags',0],['t','Granel','t',1]];
function _qtdItem(p){ const v=(p.total_sacos!=null&&p.total_sacos!=='')?p.total_sacos:p.sacos_pallets; return parseFloat(v)||0; }
function qtdOP(l){
  if(l.__q) return l.__q;
  const q={sc:0,bags:0,t:0};
  const itens=(l.produtos_op&&l.produtos_op.length)?l.produtos_op:[{produto:l.produto,total_sacos:l.total_sacos}];
  itens.forEach(p=>{
    const un=(window.Regras?Regras.unidadeDoProduto(p.produto,_PRODS):'');
    const v=window.Regras?Regras.qtdNaUnidadeDoProduto(_qtdItem(p),un):_qtdItem(p);
    const k=/unid/i.test(un)?'bags':/ton/i.test(un)?'t':'sc';
    q[k]+=v;
  });
  return (l.__q=q);
}
function somaQ(rows){ const q={sc:0,bags:0,t:0}; (rows||[]).forEach(l=>{ const x=qtdOP(l); q.sc+=x.sc; q.bags+=x.bags; q.t+=x.t; }); return q; }
function fQ(q,sep){ const p=_UNS.filter(([k])=>q&&q[k]>0).map(([k,,u,d])=>fmtN(q[k],d)+' '+u); return p.length?p.join(sep||' · '):'—'; }
function fQh(q,h){ if(!(h>0)) return '—'; const p=_UNS.filter(([k])=>q&&q[k]>0).map(([k,,u,d])=>fmtN(q[k]/h,k==='t'?1:0)+' '+u+'/h'); return p.length?p.join('<br>'):'—'; }

/* ══════════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════════ */
const safe = async q => { try { const r = await q; return r.data||[]; } catch(e){ return []; } };
// Para queries de CONTAGEM (select('*',{count:'exact',head:true})): traz o total sem baixar as linhas.
const safeCount = async q => { try { const r = await q; if(r&&r.error) throw r.error; return (r&&r.count)||0; } catch(e){ console.warn('[relatorios] contagem falhou:', e&&e.message||e); return 0; } };
const fmtN = (v, dec=0) => (v||0).toLocaleString('pt-BR',{minimumFractionDigits:dec,maximumFractionDigits:dec});
const fmtD = d => d ? new Date(d+'T12:00:00').toLocaleDateString('pt-BR') : '—';
const cor  = (v, b1=85, b2=70) => v>=b1?'#16a34a':v>=b2?'#b45309':'#dc2626';
const st   = (cls,txt) => `<span class="st st-${cls}">${txt}</span>`;

function kpiBox(value, label, sub='', kc='var(--primary)', valCor='var(--primary)', cls=''){
  kc=kc||'var(--primary)'; valCor=valCor||'var(--primary)';
  return `<div class="kpi-box ${cls}" style="--kc:${kc};">
    <div class="kpi-box-value" style="color:${valCor};">${value}</div>
    <div class="kpi-box-label">${label}</div>
    ${sub?`<div class="kpi-box-sub">${sub}</div>`:''}
  </div>`;
}

function secHeader(title, btns=''){
  return `<div class="sec-header">
    <div class="sec-title">${title}</div>
    <div class="sec-actions">${btns}</div>
  </div>`;
}

function destruirCharts(){
  Object.values(_charts).forEach(c=>{ try{ c.destroy(); }catch(e){} });
  _charts = {};
}

function criarChart(id, config){
  const canvas = document.getElementById(id);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  if(_charts[id]) _charts[id].destroy();
  _charts[id] = new Chart(ctx, config);
}

async function abaProducao(){
  const {ini,fim,linha,turno} = getPeriodo();
  let q = _supabase.from('producao').select('*').gte('data',ini).lte('data',fim).order('data',{ascending:false});
  if(linha) q = q.eq('linha',linha);
  if(turno) q = q.eq('turno',turno);
  const rows = await safe(q);

  const tQ   = somaQ(rows);
  const tHT  = rows.reduce((s,l)=>s+(l.ht||0),0);
  const tHP  = rows.reduce((s,l)=>s+(l.hp||0),0);
  const tLe  = rows.reduce((s,l)=>s+(l.consumo_lenha||0),0);
  const nPar = rows.reduce((s,l)=>s+(l.paradas_op||[]).length,0);
  const disp = tHT>0?((tHT-tHP)/tHT*100):null;
  const nAnal= rows.filter(l=>l.status==='em_analise').length;

  // por linha
  const porLinha={};
  rows.forEach(l=>{
    const d=porLinha[l.linha]||(porLinha[l.linha]={ops:[],ht:0,hp:0,le:0,par:0});
    d.ops.push(l); d.ht+=l.ht||0; d.hp+=l.hp||0; d.le+=l.consumo_lenha||0; d.par+=(l.paradas_op||[]).length;
  });
  const nomesLn=[..._linhas.map(l=>l.nome).filter(n=>porLinha[n]), ...Object.keys(porLinha).filter(n=>!_linhas.some(l=>l.nome===n))];
  _PROD_REL={rows,porLinha,nomesLn,ini,fim};

  // KPI de produção: um por unidade que teve produção
  const unsCom=_UNS.filter(([k])=>tQ[k]>0);
  const kpisProd=(unsCom.length?unsCom:[_UNS[0]]).map(([k,r,u,d],i)=>
    kpiBox(fmtN(tQ[k],d)+` <small>${u}</small>`, k==='t'?'Granel produzido':r+' produzidos', k==='t'?'Longa Vida':'', '', '', i===0?'hero':''));
  const corDisp=disp==null?'var(--ink-4)':cor(disp);

  const html = `
    <div class="kpi-row">
      ${kpisProd.join('')}
      ${kpiBox(rows.length,'OPs lançadas',`${nomesLn.length} linha(s)`,'#3E7CB1')}
      ${kpiBox(disp==null?'—':fmtN(disp,1)+'<small>%</small>','Horas produtivas',`${fmtN(tHT,1)} h trabalhadas`,corDisp,corDisp)}
      ${kpiBox(fmtN(tHP,1)+'<small> h</small>','Horas paradas',`${nPar} parada(s) apontada(s)`,tHP>0?'#dc2626':'#16a34a',tHP>0?'#dc2626':'var(--primary)')}
      ${kpiBox(fmtN(tLe,1)+'<small> m³</small>','Lenha','consumo apontado nas OPs','#b45309')}
      ${kpiBox(nAnal,'Em análise','aguardando o laboratório',nAnal?'#f59e0b':'#16a34a',nAnal?'#b45309':'var(--primary)')}
    </div>

    <div class="chart-grid">
      <div class="chart-box">
        <div class="chart-box-title"><span id="tit-prod-dia">Produção diária por linha</span><div class="un-tg" id="un-prod"></div></div>
        <div style="position:relative;height:270px;"><canvas id="chart-prod-dia"></canvas></div>
      </div>
      <div class="chart-box">
        <div class="chart-box-title"><span>Horas por linha</span></div>
        <div style="position:relative;height:270px;"><canvas id="chart-prod-linha"></canvas></div>
      </div>
    </div>

    <div class="panel">
      ${secHeader('Resumo por linha',`<button class="btn-csv" onclick="csvProducaoLinha()">📊 CSV por linha</button>`)}
      <div class="rel-table-wrap">
        <table class="rel-table">
          <thead><tr><th>Linha</th><th class="n">OPs</th><th class="n">Produção</th><th class="n">Média por hora</th><th class="n">H.T</th><th class="n">H.P</th><th>Horas produtivas</th><th class="n">Lenha</th></tr></thead>
          <tbody>
            ${nomesLn.map(ln=>{
              const d=porLinha[ln], q=somaQ(d.ops), dp=d.ht>0?((d.ht-d.hp)/d.ht*100):null;
              return `<tr>
                <td><span class="ln-dot" style="background:${corLinhaRel(ln)};"></span><strong>${ln}</strong></td>
                <td class="n">${d.ops.length}</td>
                <td class="n"><strong>${fQ(q,'<br>')}</strong></td>
                <td class="n">${fQh(q,d.ht-d.hp)}</td>
                <td class="n">${fmtN(d.ht,1)} h</td>
                <td class="n" style="color:${d.hp>0?'#dc2626':'inherit'};">${fmtN(d.hp,1)} h</td>
                <td>${_barraProd(dp)}</td>
                <td class="n">${fmtN(d.le,1)} m³</td>
              </tr>`;
            }).join('')||`<tr><td colspan="8" class="rel-empty">Nenhum lançamento no período</td></tr>`}
          </tbody>
          ${nomesLn.length>1?`<tfoot><tr><td>Total</td><td class="n">${rows.length}</td><td class="n">${fQ(tQ,'<br>')}</td><td></td>
            <td class="n">${fmtN(tHT,1)} h</td><td class="n">${fmtN(tHP,1)} h</td><td>${_barraProd(disp)}</td><td class="n">${fmtN(tLe,1)} m³</td></tr></tfoot>`:''}
        </table>
      </div>
    </div>

    <div class="panel">
      ${secHeader(`Lançamentos (${rows.length})`,`
        <button class="btn-csv" onclick="csvProducao()">📊 CSV</button>
        <button class="btn-pdf" onclick="pdfProducao()">📄 PDF</button>
      `)}
      <div class="rel-table-wrap">
        <table class="rel-table">
          <thead><tr><th>Data</th><th>Linha</th><th>Turno</th><th>Encarregado</th><th>Produto</th><th class="n">Produção</th><th class="n">H.T</th><th class="n">H.P</th><th>Produtivas</th><th>Status</th></tr></thead>
          <tbody id="tbody-prod">
            ${rows.map(l=>{
              const dp=l.ht>0?((l.ht-l.hp)/l.ht*100):null;
              const prods=(l.produtos_op&&l.produtos_op.length?l.produtos_op.map(p=>p.produto).join(', '):l.produto)||'—';
              const stCls={em_analise:'warn',aprovado:'ok',reprovado:'danger',parada:'danger'}[l.status]||'gray';
              const stTxt={em_analise:'Em análise',aprovado:'Aprovado',reprovado:'Reprovado',parada:'Parada'}[l.status]||l.status||'—';
              return `<tr onclick="detalheProducao('${l.id}')">
                <td style="white-space:nowrap;">${fmtD(l.data)}<span class="sub">${l.dia_semana||''}</span></td>
                <td style="white-space:nowrap;"><span class="ln-dot" style="background:${corLinhaRel(l.linha)};"></span><strong>${l.linha}</strong>${l.op_numero?`<span class="sub">${l.op_numero}</span>`:''}</td>
                <td style="white-space:nowrap;">${l.turno||'—'}</td>
                <td>${l.encarregado||'—'}</td>
                <td style="font-size:12px;max-width:220px;">${prods}</td>
                <td class="n"><strong>${fQ(qtdOP(l),'<br>')}</strong></td>
                <td class="n">${fmtN(l.ht,2)} h</td>
                <td class="n" style="color:${l.hp>0?'#dc2626':'inherit'};">${fmtN(l.hp,2)} h</td>
                <td>${st(dp==null?'gray':dp>=85?'ok':dp>=70?'warn':'danger',dp==null?'—':dp.toFixed(1)+'%')}</td>
                <td>${st(stCls,stTxt)}</td>
              </tr>`;
            }).join('')||`<tr><td colspan="10" class="rel-empty">Nenhum lançamento no período</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>`;

  document.getElementById('rel-content').innerHTML = html;
  _UN_PROD=(unsCom[0]||_UNS[0])[0];   // cada carga começa pela unidade principal (sacos, se houver)
  setTimeout(()=>{ _graficoProdDia(); _graficoHorasLinha(); },60);

  window._dadosExport = rows;
  window._exportTitulo = 'Produção';
}

/* Gráficos da aba Produção */
let _PROD_REL=null, _UN_PROD='sc';
const _COR_LN_REL=['#042D4D','#3E7CB1','#8FB8DE','#7A9E2E','#D4A017','#9C5B8A','#C2410C','#0F766E'];
function corLinhaRel(n){ const nomes=_linhas.map(l=>l.nome); let i=nomes.indexOf(n); if(i<0) i=nomes.length+(String(n).length%3); return _COR_LN_REL[i%_COR_LN_REL.length]; }
function _barraProd(p){
  const c=p==null?'#cbd5e1':p>=85?'#22c55e':p>=70?'#f59e0b':'#ef4444', t=p==null?'#94a3b8':p>=85?'#16a34a':p>=70?'#b45309':'#dc2626';
  return `<div class="hp-cell"><div class="hp-bar"><span style="width:${Math.min(100,p||0).toFixed(1)}%;background:${c};"></span></div><b style="color:${t};">${p==null?'—':fmtN(p,1)+'%'}</b></div>`;
}
function setUnProd(u){ _UN_PROD=u; _graficoProdDia(); }
function _graficoProdDia(){
  const P=_PROD_REL; if(!P) return;
  const tQ=somaQ(P.rows);
  const uns=_UNS.filter(([k])=>tQ[k]>0);
  const tg=document.getElementById('un-prod');
  if(tg) tg.innerHTML=uns.length>1?uns.map(([k,r])=>`<button type="button" class="un-b${k===_UN_PROD?' on':''}" onclick="setUnProd('${k}')">${r}</button>`).join(''):'';
  const UN=_UNS.find(([k])=>k===_UN_PROD)||_UNS[0];
  // todos os dias do período (dia sem OP aparece vazio, não some do eixo)
  const dias=[]; for(let d=new Date(P.ini+'T12:00:00'); _iso(d)<=P.fim && dias.length<370; d.setDate(d.getDate()+1)) dias.push(_iso(d));
  const ds=P.nomesLn.map(ln=>({
    label:ln, backgroundColor:corLinhaRel(ln), borderRadius:3, borderSkipped:false, stack:'p',
    data:dias.map(d=>P.porLinha[ln].ops.filter(o=>o.data===d).reduce((s,o)=>s+qtdOP(o)[UN[0]],0)),
  })).filter(x=>x.data.some(v=>v>0));
  const fmt=v=>fmtN(v,UN[3])+' '+UN[2];
  if(dias.length===1){   // um dia só: uma barra por linha
    document.getElementById('tit-prod-dia').textContent='Produção por linha';
    const lns=P.nomesLn.filter(ln=>somaQ(P.porLinha[ln].ops)[UN[0]]>0);
    criarChart('chart-prod-dia',{type:'bar',
      data:{labels:lns,datasets:[{data:lns.map(ln=>somaQ(P.porLinha[ln].ops)[UN[0]]),backgroundColor:lns.map(corLinhaRel),borderRadius:6,maxBarThickness:70}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+fmt(c.raw)}}},
        scales:{x:{grid:{display:false}},y:{beginAtZero:true,ticks:{callback:v=>fmtN(v)}}}}});
    return;
  }
  criarChart('chart-prod-dia',{type:'bar',
    data:{labels:dias.map(d=>{const x=new Date(d+'T12:00:00');return dias.length>45?x.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):x.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});}),datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'bottom'},tooltip:{mode:'index',filter:i=>i.raw>0,callbacks:{label:c=>` ${c.dataset.label}: ${fmt(c.raw)}`,
        footer:it=>'Total: '+fmt(it.reduce((s,i)=>s+i.raw,0))}}},
      scales:{x:{stacked:true,grid:{display:false},ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:16}},
              y:{stacked:true,beginAtZero:true,ticks:{callback:v=>fmtN(v)}}}}});
}
function _graficoHorasLinha(){

async function abaQualidade(){
  const {ini,fim,linha} = getPeriodo();
  let qL = _supabase.from('producao').select('id,data,linha,turno,status').gte('data',ini).lte('data',fim);
  if(linha) qL = qL.eq('linha',linha);
  const lancs = await safe(qL);
  const ids = lancs.map(l=>l.id);
  const pallets = ids.length ? await safe(_supabase.from('producao_pallets').select('*').in('lancamento_id',ids)) : [];
  const labRows = await safe(_supabase.from('laboratorio').select('*').gte('created_at',ini+'T00:00:00').lte('created_at',fim+'T23:59:59').order('created_at',{ascending:false}).limit(300));

  // ── NOVO: Fluxo Automatizado (aferição produção → análise laboratório) ──
  const amostrasFluxo = labRows.filter(r=>r.status_amostra);
  const fluxoFinalizadas = amostrasFluxo.filter(a=>['finalizado'].includes(a.status_amostra));
  const fluxoAprovadasAuto = amostrasFluxo.filter(a=>['aprovado','finalizado'].includes(a.status_amostra) && a.resultado_ensaios);
  const fluxoReprovadas = amostrasFluxo.filter(a=>['reprovado','aguardando_nova_afericao','aguardando_decisao','bloqueado'].includes(a.status_amostra));
  const fluxoPendentes = amostrasFluxo.filter(a=>['aguardando_analise','em_analise'].includes(a.status_amostra));
  const taxaAutoAprov = amostrasFluxo.length>0 ? (fluxoAprovadasAuto.length/amostrasFluxo.length*100) : null;

  // ── NOVO: Correções (bloqueio de edição + auditoria) ──
  const [correcoes, auditoria] = await Promise.all([
    safe(_supabase.from('lab_solicitacoes_correcao').select('*').gte('data_solicitacao',ini+'T00:00:00').lte('data_solicitacao',fim+'T23:59:59').order('data_solicitacao',{ascending:false})),
    safe(_supabase.from('lab_auditoria_campos').select('*').gte('data',ini+'T00:00:00').lte('data',fim+'T23:59:59').order('data',{ascending:false}).limit(100)),
  ]);
  const correcoesPendentes = correcoes.filter(c=>c.status==='pendente');
  const correcoesAprovadas = correcoes.filter(c=>c.status==='aprovada');
  const correcoesRejeitadas = correcoes.filter(c=>c.status==='rejeitada');

  // ── NOVO: Caulim (Módulo 6A) ──
  const [caulimLotes, caulimExternas] = await Promise.all([
    safe(_supabase.from('caulim_lotes_producao').select('*').gte('data_abertura',ini+'T00:00:00').lte('data_abertura',fim+'T23:59:59').order('data_abertura',{ascending:false})),
    safe(_supabase.from('caulim_analises_externas').select('*').eq('status','vigente')),   // estado atual: só vigentes (vencida = vigente c/ validade passada); demais status não são usados aqui
  ]);
  const hojeQ = new Date().toISOString().split('T')[0];
  const caulimVigentes = caulimExternas.filter(e=>e.status==='vigente' && (!e.validade || e.validade>=hojeQ));
  const caulimVencidas = caulimExternas.filter(e=>e.status==='vigente' && e.validade && e.validade<hojeQ);
  const caulimPorStatus = {};
  caulimLotes.forEach(l=>{ caulimPorStatus[l.status]=(caulimPorStatus[l.status]||0)+1; });

  const aprov = pallets.filter(p=>p.status==='aprovado').length;
  const reprov= pallets.filter(p=>p.status==='reprovado').length;
  const pend  = pallets.filter(p=>p.status==='pendente').length;
  const qual  = (aprov+reprov)>0?(aprov/(aprov+reprov)*100):100;

  const porLn={};
  pallets.forEach(p=>{
    const ln=p.linha||'—';
    if(!porLn[ln]) porLn[ln]={aprov:0,reprov:0,pend:0};
    if(p.status==='aprovado') porLn[ln].aprov++;
    else if(p.status==='reprovado') porLn[ln].reprov++;
    else porLn[ln].pend++;
  });

  const CAULIM_ST_LABEL = {aberto:['gray','Aberto'],em_producao:['warn','Em produção'],liberado_preliminar:['ok','Liberado preliminar'],em_fechamento:['warn','Em fechamento'],aprovado:['ok','Aprovado'],reprovado:['danger','Reprovado'],certificado_emitido:['ok','Certificado emitido'],bloqueado:['danger','Bloqueado']};
  const FLUXO_ST_LABEL = {aguardando_analise:['warn','Aguardando análise'],em_analise:['info','Em análise'],aprovado:['ok','Aprovado'],reprovado:['danger','Reprovado'],aguardando_nova_afericao:['warn','Aguard. nova aferição'],aguardando_decisao:['warn','Aguard. decisão'],aprovado_excecao:['ok','Aprovado (exceção)'],bloqueado:['danger','Bloqueado'],finalizado:['gray','Finalizado']};

  const html = `
    <div class="kpi-row">
      ${kpiBox(fmtN(pallets.length),'Total de Pallets','no período','#2563eb')}
      ${kpiBox(fmtN(aprov),'Aprovados','','#16a34a','#16a34a')}
      ${kpiBox(fmtN(reprov),'Reprovados','',reprov>0?'#dc2626':'#16a34a',reprov>0?'#dc2626':'#16a34a')}
      ${kpiBox(fmtN(pend),'Pendentes','',pend>5?'#f59e0b':'#94a3b8',pend>5?'#b45309':'#94a3b8')}
      ${kpiBox(qual.toFixed(1)+'%','Índice de Qualidade','aprov / (aprov+reprov)','',cor(qual,95,85))}
      ${kpiBox(labRows.length,'Registros Lab.','no período','#7c3aed')}
    </div>

    <div class="chart-grid">

        <div class="chart-box-title">🥧 Status dos Pallets</div>
        <canvas id="chart-pal-status"></canvas>
      </div>

    <div class="panel">

            ${Object.entries(porLn).map(([ln,d])=>{

              return`<tr>
                <td><strong>${ln}</strong></td>
                <td style="color:#16a34a;font-weight:700;">${d.aprov}</td>
                <td style="color:${d.reprov>0?'#dc2626':'#94a3b8'};font-weight:700;">${d.reprov}</td>
                <td style="color:#b45309;">${d.pend}</td>
                <td>${tot}</td>
                <td>${st(q2>=95?'ok':q2>=85?'warn':'danger',q2.toFixed(1)+'%')}</td>
              </tr>`;
            }).join('')||`<tr><td colspan="6" class="rel-empty">Sem dados</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      ${secHeader('Pallets Detalhados',`

          <tbody>
            ${pallets.map(p=>{

              return`<tr onclick="detalhePallet('${p.id}')">

    <div class="panel">

      <div class="kpi-row" style="margin-bottom:0;">
        ${kpiBox(amostrasFluxo.length,'Amostras no Fluxo','no período','#0891b2')}
        ${kpiBox(fluxoPendentes.length,'Em andamento','aguardando análise/coleta',fluxoPendentes.length>0?'#f59e0b':'#94a3b8',fluxoPendentes.length>0?'#b45309':'#94a3b8')}

        ${kpiBox(correcoesAprovadas.length,'Aprovadas','','#16a34a','#16a34a')}

      </div>
      <div class="chart-box">
        <div class="chart-box-title">📈 OS por Status</div>
        <canvas id="chart-manut-status"></canvas>

/* ══════════════════════════════════════════════════════════
   ABA — FROTA
   ══════════════════════════════════════════════════════════ */
/* ── Replica fiel da lógica de status de revisão de frota.html ──
   (calcStatusVeiculo / calcStatusComp) — inclui verificação por
   COMPONENTE (Sistema→Componentes), não só o campo legado do veículo. */
function _hojeLocalRel(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function relCalcStatusComp(c,v){
  const hoje=new Date(); const hojeStr=_hojeLocalRel();
  const h=parseFloat(v?.horimetro_atual)||0;
  const hComp=parseFloat(c.horimetro_componente)||parseFloat(c.horimetro_inicial)||0;
  const intH=parseFloat(c.intervalo_revisao)||0;
  const modo=v?.tipo_controle||'';
  let venc=false, prox=false;
  if(modo!=='data' && intH>0 && hComp>0){
    const proxH=hComp+intH;
    if(h>=proxH) venc=true; else if(proxH-h<=50) prox=true;
  }
  if(modo!=='horas'){
    const ultima=c.ultima_revisao||c.data_ultima_revisao||'';
    const intM=parseInt(c.intervalo_revisao_meses)||0;
    let proxData='';
    if(ultima&&intM>0){ const d=new Date(ultima+'T00:00:00'); d.setMonth(d.getMonth()+intM); proxData=d.toISOString().slice(0,10); }
    else if(!ultima) proxData=c.proxima_revisao_data||'';
    if(proxData){ if(proxData<hojeStr) venc=true; else if((new Date(proxData+'T00:00:00')-hoje)/86400000<=30) prox=true; }
  }
  return venc?'vencido':prox?'proximo':'ok';
}
function relCalcStatusVeiculo(v){
  const hoje=new Date(); const hojeStr=_hojeLocalRel();
  const h=parseFloat(v.horimetro_atual)||0;
  let prox=parseFloat(v.proxima_revisao)||0;
  if(!prox&&h>0&&v.revisao_horas>0) prox=h+parseFloat(v.revisao_horas);
  const proxData=v.proxima_revisao_data||''; const tipo=v.tipo_revisao||'horimetro';
  if(tipo==='data'||tipo==='ambos'){
    if(proxData){ if(proxData<hojeStr) return 'vencido'; if((new Date(proxData)-hoje)/86400000<=30) return 'proximo'; }
  }
  if(tipo==='horimetro'||tipo==='ambos'){
    if(prox>0){ if(h>=prox) return 'vencido'; if(prox-h<=50) return 'proximo'; }
  }
  for(const c of v.componentes||[]){ const cs=relCalcStatusComp(c,v); if(cs==='vencido') return 'vencido'; if(cs==='proximo') return 'proximo'; }
  return 'ok';
}
// Próxima revisão "efetiva" para exibição: usa o campo do veículo se existir,
// senão a mais próxima entre os componentes (a mesma fonte que decide o status).
function relProxRevisaoTexto(v){
  const tipo=v.tipo_revisao||'horimetro';
  if((tipo==='data'||tipo==='ambos') && v.proxima_revisao_data) return {texto:fmtD(v.proxima_revisao_data),fonte:'veículo'};
  if((tipo==='horimetro'||tipo==='ambos') && v.proxima_revisao) return {texto:fmtN(v.proxima_revisao,0)+' h',fonte:'veículo'};
  // Sem dado no veículo — procura o componente mais próximo de vencer
  const comps=v.componentes||[];
  let melhor=null;
  comps.forEach(c=>{
    const intM=parseInt(c.intervalo_revisao_meses)||0;
    const ultima=c.ultima_revisao||c.data_ultima_revisao||'';
    if(ultima&&intM>0){
      const d=new Date(ultima+'T00:00:00'); d.setMonth(d.getMonth()+intM);
      const dISO=d.toISOString().slice(0,10);
      if(!melhor||dISO<melhor.data) melhor={data:dISO,nome:c.nome};
    }
  });
  if(melhor) return {texto:fmtD(melhor.data),fonte:melhor.nome};
  return {texto:'—',fonte:null};
}

  //  • total, vencidos e a-vencer → contagem (0 linhas), estado atual independe dos recentes;

  const REC_MAX = 500;

    safeCount(_supabase.from('epi_entregas').select('*',{count:'exact',head:true})),

          <tbody>

              const cc =ccs.find(c=>c.id===l.centro_custo_id);
              return`<tr onclick="detalheCusto('${l.id}')">

                <td>${l.descricao||'—'}</td>

                <td>${l.centro_custo_nome||cc?.nome||'—'}</td>
                <td style="font-weight:700;color:#dc2626;">R$ ${fmtN(parseFloat(l.valor)||0,2)}</td>
                <td>${l.fornecedor||'—'}</td>
                <td style="font-size:11px;">${l.modulo_origem==='manual'?'Manual':l.modulo_origem||'—'}</td>

    criarChart('chart-custo-cc',{type:'doughnut',data:{

          return`<tr onclick="detalheNcBpf('${n.id}')"><td>${fmtD(n.data)}</td><td>${n.procedimento_cod||'—'}</td>

/* ══════════════════════════════════════════════════════════
   ABA — RH
   ══════════════════════════════════════════════════════════ */
async function abaRh(){
  const hoje = new Date().toISOString().split('T')[0];
  const em30 = new Date(Date.now()+30*86400000).toISOString().split('T')[0];
  const [funcsAtivos, funcsTodos, ferias] = await Promise.all([
    safe(_supabase.from('funcionarios').select('id,nome,setor,status').eq('status','ativo').order('nome')),
    safe(_supabase.from('funcionarios').select('id,nome,setor,status').order('nome')),
    // Janela: as 200 férias mais recentes. A tabela mostra 60 e os KPIs pegam as atuais/
    // futuras (que ficam no topo da ordem por data_inicio desc), então nada exibido some;
    // só deixa de trazer anos de férias concluídas antigas. (protocolo #7)
    safe(_supabase.from('rh_ferias').select('*').order('data_inicio',{ascending:false}).limit(200)),
  ]);
  // Escala entra só como CONTAGEM no KPI — busca só o total (count), sem trazer as linhas.
  let escalas = 0;
  try { const r = await _supabase.from('rh_escala').select('*',{count:'exact',head:true}); escalas = r.count||0; } catch(e) {}
  const funcs = funcsTodos; // usado para resolver nome mesmo de funcionários já inativos
  const emGozo = ferias.filter(f=>f.status==='em_gozo'||(f.data_inicio<=hoje&&f.data_fim>=hoje));
  const agendadas = ferias.filter(f=>f.status==='agendada'&&f.data_inicio>=hoje&&f.data_inicio<=em30);
  const porSetor={};
  funcsAtivos.forEach(f=>{ const s=f.setor||'Sem setor'; porSetor[s]=(porSetor[s]||0)+1; });

  const html = `
    <div class="kpi-row">
      ${kpiBox(funcsAtivos.length,'Funcionários Ativos','','#2563eb')}
      ${kpiBox(emGozo.length,'Em Férias Hoje','','#7c3aed','#7c3aed')}
      ${kpiBox(agendadas.length,'Férias nos Próx. 30 dias','','#0891b2','#0891b2')}
      ${kpiBox(escalas,'Registros de Escala','cadastrados','#16a34a','#16a34a')}
    </div>

    <div class="panel">
      ${secHeader('Funcionários por Setor')}
      <div class="rel-table-wrap"><table class="rel-table">
        <thead><tr><th>Setor</th><th>Funcionários</th></tr></thead>
        <tbody>${Object.entries(porSetor).sort((a,b)=>b[1]-a[1]).map(([s,q])=>`<tr><td><strong>${s}</strong></td><td>${q}</td></tr>`).join('')||`<tr><td colspan="2" class="rel-empty">Sem dados</td></tr>`}</tbody>
      </table></div>
    </div>

    <div class="panel">
      ${secHeader('Férias',`<button class="btn-csv" onclick="exportarCSVAtual()">📊 CSV</button><button class="btn-pdf" onclick="imprimirAtual()">📄 PDF</button>`)}
      <div class="rel-table-wrap"><table class="rel-table">
        <thead><tr><th>Funcionário</th><th>Início</th><th>Fim</th><th>Dias</th><th>Status</th></tr></thead>
        <tbody>${ferias.slice(0,60).map(f=>{
          const fn=funcs.find(x=>x.id===f.funcionario_id);
          const dias=f.data_inicio&&f.data_fim?Math.round((new Date(f.data_fim+'T00:00:00')-new Date(f.data_inicio+'T00:00:00'))/86400000)+1:0;
          const t={agendada:['info','Agendada'],em_gozo:['warn','Em gozo'],concluida:['ok','Concluída']}[f.status]||['gray',f.status||'—'];
          return`<tr><td><strong>${fn?.nome||'—'}</strong></td><td>${fmtD(f.data_inicio)}</td><td>${fmtD(f.data_fim)}</td><td>${dias}d</td><td>${st(t[0],t[1])}</td></tr>`;
        }).join('')||`<tr><td colspan="5" class="rel-empty">Nenhum registro de férias</td></tr>`}</tbody>
      </table></div>
    </div>`;

  document.getElementById('rel-content').innerHTML = html;
  window._dadosExport = ferias; window._exportTitulo = 'RH-Ferias';
}

async function abaCarregamento(){
  const {ini,fim} = getPeriodo();
  const [carregamentos, romaneios] = await Promise.all([
    safe(_supabase.from('carregamentos').select('*').gte('data',ini).lte('data',fim).order('data',{ascending:false})),
    // "Pendentes" é ESTADO ATUAL: filtra por status (não por recência), senão um romaneio
    // antigo ainda pendente sumiria dos 500 recentes. null = 'recebido' (default do cliente).
    safe(_supabase.from('romaneios').select('*').or('status.in.(recebido,em_carregamento),status.is.null').order('data_emissao',{ascending:false}).limit(200)),
  ]);
  // Status real: recebido | em_carregamento | carregado | finalizado
  const ROM_LBL={recebido:['info','Recebido'],em_carregamento:['warn','Em Carregamento'],carregado:['ok','Carregado'],finalizado:['ok','Finalizado']};
  const pendentes = romaneios.filter(r=>['recebido','em_carregamento'].includes(r.status||'recebido'));
  const totalPallets = carregamentos.reduce((s,c)=>s+(c.total_pallets||0),0);

  const html = `
    <div class="kpi-row">
      ${kpiBox(carregamentos.length,'Carregamentos no Período','','#2563eb')}
      ${kpiBox(fmtN(totalPallets),'Pallets Carregados','no período','#16a34a','#16a34a')}
      ${kpiBox(pendentes.length,'Ordens Pendentes','aguardando carregamento',pendentes.length>0?'#f59e0b':'#94a3b8',pendentes.length>0?'#b45309':'#94a3b8')}
    </div>

    <div class="panel">
      ${secHeader('Carregamentos',`<button class="btn-csv" onclick="exportarCSVAtual()">📊 CSV</button><button class="btn-pdf" onclick="imprimirAtual()">📄 PDF</button>`)}
      <div class="rel-table-wrap"><table class="rel-table">
        <thead><tr><th>Ordem</th><th>Data</th><th>Motorista</th><th>Placa</th><th>Transportadora</th><th>Pallets</th></tr></thead>
        <tbody>${carregamentos.map(c=>`<tr onclick="detalheCarregamento('${c.id}')"><td><strong>${c.ordem_numero||'—'}</strong></td><td>${fmtD(c.data)}</td>
          <td>${c.motorista||'—'}</td><td>${c.placa||'—'}</td><td>${c.transportadora||'—'}</td><td>${c.total_pallets||0}</td></tr>`).join('')||`<tr><td colspan="6" class="rel-empty">Nenhum carregamento no período</td></tr>`}</tbody>
      </table></div>
    </div>

    <div class="panel">
      ${secHeader('Ordens (Romaneios) Pendentes de Carregamento')}
      <div class="rel-table-wrap"><table class="rel-table">
        <thead><tr><th>Nº Ordem</th><th>Transportadora</th><th>Motorista</th><th>Placa</th><th>Emissão</th><th>Status</th></tr></thead>
        <tbody>${pendentes.slice(0,50).map(r=>{const t=ROM_LBL[r.status||'recebido']||['gray',r.status||'—'];return`<tr>
          <td><strong>${r.numero||'—'}</strong></td><td>${r.transportadora||'—'}</td><td>${r.motorista||'—'}</td>
          <td>${r.placa||'—'}</td><td>${fmtD((r.data_emissao||'').slice(0,10))}</td><td>${st(t[0],t[1])}</td></tr>`;
        }).join('')||`<tr><td colspan="6" class="rel-empty">Nenhuma ordem pendente</td></tr>`}</tbody>
      </table></div>
    </div>`;

  document.getElementById('rel-content').innerHTML = html;
  window._dadosExport = carregamentos; window._exportTitulo = 'Carregamento';
}

}

async function abaCompras(){
  const hoje = new Date().toISOString().split('T')[0];
  // "Em aberto" = mesma definição usada no compras.html real (ainda não totalmente recebido/cancelado)
  const PED_ABERTOS = ['emitido','aguardando_entrega','recebido_parcial'];
  // Solicitação "pendente" = ainda não atendida/reprovada/cancelada/devolvida
  const SOL_FECHADAS = ['atendida','reprovada','cancelada','devolvida'];

  // Item 4 — cada número tem sua janela server-side (não puxar a tabela toda):
  //  • total de pedidos  → contagem (0 linhas trazidas);
  //  • em aberto/atrasado/valor → ESTADO ATUAL: todos os abertos de QUALQUER idade;
  //  • tabela + export   → recentes (teto REC_MAX; a tabela exibe 60);
  //  • solicitações por status → só a coluna status (histograma; candidato a RPC/view depois).
  const REC_MAX = 500;   // teto dos recentes p/ tabela+export; subir se um dia estourar (hoje há pouquíssimos pedidos)
  const [totalPedidos, abertos, recentes, solStatus] = await Promise.all([
    safeCount(_supabase.from('compras_pedidos').select('*',{count:'exact',head:true})),
    safe(_supabase.from('compras_pedidos').select('*').in('status',PED_ABERTOS)),
    safe(_supabase.from('compras_pedidos').select('*').order('created_at',{ascending:false}).limit(REC_MAX)),
    safe(_supabase.from('compras_solicitacoes').select('status')),
  ]);
  const valorAberto = abertos.reduce((s,p)=>s+(parseFloat(p.valor_total)||0),0);
  const atrasados = abertos.filter(p=>p.prazo_entrega && p.prazo_entrega<hoje);   // atrasado ⊂ abertos (já são status aberto)
  const solPend = solStatus.filter(s=>!SOL_FECHADAS.includes(s.status));
  const LABEL = {pendente:['warn','Pendente'],aprovada:['info','Aprovada'],aguardando_cotacao:['info','Ag. Cotação'],reprovada:['danger','Reprovada'],devolvida:['gray','Devolvida'],em_cotacao:['info','Em Cotação'],em_pedido:['info','Em Pedido'],atendida:['ok','Atendida'],cancelada:['gray','Cancelada'],emitido:['warn','Emitido'],aguardando_entrega:['warn','Ag. Entrega'],recebido_parcial:['warn','Receb. Parcial'],recebido_total:['ok','Recebido'],cancelado:['gray','Cancelado']};

  const html = `
    <div class="kpi-row">
      ${kpiBox(totalPedidos,'Pedidos','total','#2563eb')}
      ${kpiBox(abertos.length,'Pedidos em Aberto','',abertos.length>0?'#f59e0b':'#16a34a',abertos.length>0?'#b45309':'#16a34a')}
      ${kpiBox(atrasados.length,'Pedidos Atrasados','',atrasados.length>0?'#dc2626':'#16a34a',atrasados.length>0?'#dc2626':'#16a34a')}
      ${kpiBox('R$ '+fmtN(valorAberto,2),'Valor em Aberto','','#7c3aed','#7c3aed')}
      ${kpiBox(solPend.length,'Solicitações Pendentes','',solPend.length>0?'#f59e0b':'#94a3b8',solPend.length>0?'#b45309':'#94a3b8')}
    </div>

    <div class="panel">
      ${secHeader('Pedidos de Compra',`<button class="btn-csv" onclick="exportarCSVAtual()">📊 CSV</button><button class="btn-pdf" onclick="imprimirAtual()">📄 PDF</button>`)}
      <div class="rel-table-wrap"><table class="rel-table">
        <thead><tr><th>Número</th><th>Fornecedor</th><th>Comprador</th><th>Valor</th><th>Prazo Entrega</th><th>Status</th></tr></thead>
        <tbody>${recentes.slice(0,60).map(p=>{const t=LABEL[p.status]||['gray',p.status||'—'];
          const atrasado=p.prazo_entrega&&p.prazo_entrega<hoje&&PED_ABERTOS.includes(p.status);
          return`<tr onclick="detalheCompra('${p.id}')"><td><strong>#${String(p.numero||0).padStart(4,'0')}</strong></td><td>${p.fornecedor||'—'}</td>
            <td>${p.comprador||'—'}</td><td><strong>R$ ${fmtN(parseFloat(p.valor_total)||0,2)}</strong></td>
            <td>${p.prazo_entrega?fmtD(p.prazo_entrega)+(atrasado?' <span class="st st-danger">Atrasado</span>':''):'—'}</td>
            <td>${st(t[0],t[1])}</td></tr>`;
        }).join('')||`<tr><td colspan="6" class="rel-empty">Nenhum pedido registrado</td></tr>`}</tbody>
      </table></div>
    </div>

    <div class="panel">
      ${secHeader('Solicitações de Compra por Status')}
      <div class="rel-table-wrap"><table class="rel-table">
        <thead><tr><th>Status</th><th>Quantidade</th></tr></thead>
        <tbody>${(()=>{const g={};solStatus.forEach(s=>{const k=s.status||'—';g[k]=(g[k]||0)+1;});return Object.entries(g).map(([k,v])=>`<tr><td>${LABEL[k]?st(LABEL[k][0],LABEL[k][1]):k}</td><td>${v}</td></tr>`).join('')||`<tr><td colspan="2" class="rel-empty">Sem solicitações</td></tr>`;})()}</tbody>
      </table></div>
    </div>`;

  document.getElementById('rel-content').innerHTML = html;
  window._dadosExport = recentes; window._exportTitulo = 'Compras-Pedidos';   // export = recentes (até REC_MAX)
}

function detalheCompra(id){
  const p=(window._dadosExport||[]).find(x=>x.id===id); if(!p) return;
  const itens = typeof p.itens==='string'?JSON.parse(p.itens||'[]'):p.itens||[];
  const LABEL = {emitido:'Emitido',aguardando_entrega:'Ag. Entrega',recebido_parcial:'Receb. Parcial',recebido_total:'Recebido',cancelado:'Cancelado'};
  abrirModal(`Pedido #${String(p.numero||0).padStart(4,'0')}`,`

}

/* ══════════════════════════════════════════════════════════
   ABA — GERENCIAL COMPLETO
   ══════════════════════════════════════════════════════════ */
async function abaGerencial(){
  const {ini,fim} = getPeriodo();
  toast('Consolidando dados gerenciais...','info');

  const hoje = new Date().toISOString().split('T')[0];
  const em7  = new Date(Date.now()+7*86400000).toISOString().split('T')[0];

  const [prod,manut,almx,epiVenc,epiProx,exp,port,pals,custos,nats,ccs,frota,abastBombas,bpfNcs,martelos] = await Promise.all([
    safe(_supabase.from('producao').select('*').gte('data',ini).lte('data',fim)),
    safe(_supabase.from('manutencao').select('*').or('linha.is.null,linha.neq.Frota').gte('data_abertura',ini).lte('data_abertura',fim)),
    safe(_supabase.from('almoxarifado').select('nome,estoque_atual,estoque_minimo,categoria,unidade,custo_unitario')),
    // EPI vencidos / a vencer em 7d → contagem (estado atual); não baixa o histórico de entregas
    safeCount(_supabase.from('epi_entregas').select('*',{count:'exact',head:true}).lt('data_prevista_troca',hoje)),
    safeCount(_supabase.from('epi_entregas').select('*',{count:'exact',head:true}).gte('data_prevista_troca',hoje).lte('data_prevista_troca',em7)),
    safe(_supabase.from('expedicao_ordens').select('*').gte('created_at',ini+'T00:00:00').lte('created_at',fim+'T23:59:59')),
    safe(_supabase.from('portaria').select('*').gte('created_at',ini+'T00:00:00').lte('created_at',fim+'T23:59:59')),
    safe(_supabase.from('producao_pallets').select('status,linha,produto').gte('created_at',ini+'T00:00:00').lte('created_at',fim+'T23:59:59')),
    safe(_supabase.from('lancamentos_custo').select('*').gte('data',ini).lte('data',fim)),
    safe(_supabase.from('naturezas_custo').select('id,nome,grupo')),
    safe(_supabase.from('centros_custo').select('id,nome')),
    safe(_supabase.from('frota_veiculos').select('*').eq('status','ativo')),
    safe(_supabase.from('abastecimento_bombas').select('nome,litros_atual,capacidade_litros,combustivel')),
    safe(_supabase.from('bpf_ncs').select('id,status').eq('status','pendente')),
    safe(_supabase.from('producao_martelos').select('*').gte('data_retirada',ini)),
  ]);

  // ── PRODUÇÃO ── (na unidade de cada produto)
  const tQ   = somaQ(prod);
  const tSc  = tQ.sc;

      datasets:[{label:'Sacos',data:dias.map(d=>ppd[d]||0),backgroundColor:'#042D4D',borderRadius:4,borderSkipped:false}]
    },options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+fmtN(c.raw)+' sacos'}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>fmtN(v)}},x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:true}}}}});
    // Por linha
    const lns=Object.keys(porLinha);
    criarChart('chart-ger-linha',{type:'doughnut',data:{
      // horas trabalhadas por linha (produção tem unidades diferentes e não se soma)
      labels:lns,datasets:[{data:lns.map(l=>+porLinha[l].ht.toFixed(1)),
        backgroundColor:lns.map(corLinhaRel),borderWidth:2,borderColor:'#fff'}]
    },options:{responsive:true,cutout:'62%',plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>` ${c.label}: ${fmtN(c.raw,1)} h trabalhadas`}}}}});
    // Indicadores
    criarChart('chart-ger-kpis',{type:'bar',data:{
      labels:['Disponib.','Qualidade','OS Concl.','Expediç. Concl.'],
      datasets:[
        {label:'%',data:[parseFloat(disp.toFixed(1)),parseFloat(qual.toFixed(1)),
          manut.length>0?parseFloat((manutConcl/manut.length*100).toFixed(1)):0,
          exp.length>0?parseFloat((expConcl/exp.length*100).toFixed(1)):0],
          backgroundColor:['#2563eb','#16a34a','#7c3aed','#0891b2'],borderRadius:5,borderSkipped:false},
        {label:'Meta (85%)',data:[85,85,85,85],type:'line',borderColor:'#ef4444',borderWidth:1.5,
          borderDash:[4,3],pointRadius:0,fill:false}
      ]
    },options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}},
      scales:{y:{max:105,ticks:{font:{size:9}}},x:{ticks:{font:{size:10}}}}}});
    // Custos
    criarChart('chart-ger-custo',{type:'bar',data:{
      labels:topNat.map(([n])=>n.length>18?n.slice(0,18)+'…':n),
      datasets:[{data:topNat.map(([,v])=>v),backgroundColor:'#dc2626',borderRadius:4,borderSkipped:false}]
    },options:{responsive:true,plugins:{legend:{display:false}},
      scales:{y:{ticks:{font:{size:9},callback:v=>'R$'+fmtN(v,0)}},x:{ticks:{font:{size:9}}}}}});
  },150);
}

function exportarCSVAtual(){
  const dados = window._dadosExport;
  if(!dados?.length){ toast('Nenhum dado para exportar.','warning'); return; }
  const titulo = window._exportTitulo||_abaAtual;
  const {ini,fim} = getPeriodo();
  // CSV genérico com todas as chaves
  const keys = [...new Set(dados.flatMap(r=>Object.keys(r)))].filter(k=>!['id','created_at','atualizado_em'].includes(k));
  exportarCSV(keys, dados.map(r=>keys.map(k=>{
    const v=r[k];
    if(Array.isArray(v)||typeof v==='object'&&v) return JSON.stringify(v);
    return v??'';
  })), `${titulo}_${ini}_${fim}`);
  toast('CSV exportado!','success');
}

function imprimirAtual(){
  // Remover injeção anterior se houver
  document.getElementById('print-header-inject')?.remove();
  document.getElementById('print-header-style')?.remove();

  // Criar cabeçalho da empresa
  const hdr = document.createElement('div');
  hdr.id = 'print-header-inject';
  // Oculto na tela, visível apenas no print (via @media print acima)
  hdr.style.cssText = 'display:none;';
  hdr.innerHTML = buildPrintHeader();

  // Inserir como PRIMEIRO filho do main-content para garantir topo absoluto
  const main = document.getElementById('main-content');
  if(main) main.insertBefore(hdr, main.firstChild);

  window.print();

  // Limpar após diálogo fechar
  setTimeout(()=>{
    document.getElementById('print-header-inject')?.remove();
  }, 3000);
}

/* ── CABEÇALHO EMPRESA (compartilhado entre PDF e impressão) ── */
function buildEmpresaHeader(emp){
  const e = emp || _empresa || {};
  const nome    = e.nome_fantasia || e.razao_social || 'ERP Industrial';
  const razao   = e.razao_social && e.razao_social !== nome ? e.razao_social : '';
  const cnpj    = e.cnpj   ? 'CNPJ: '+e.cnpj : '';
  const ie      = e.ie     ? 'IE: '+e.ie : '';
  const end     = [e.rua && (e.rua + (e.numero?', '+e.numero:'')), e.bairro, e.cidade && (e.cidade+(e.uf?'/'+e.uf:''))].filter(Boolean).join(' — ');
  const tel     = e.telefone ? '📞 '+e.telefone : '';
  const email   = e.email    ? '✉️ '+e.email : '';
  const cep     = e.cep ? 'CEP '+e.cep : '';
  const logoHtml = e.logo
    ? `<img src="${e.logo}" style="height:52px;max-width:120px;object-fit:contain;border-radius:4px;" alt="Logo">`
    : `<div style="width:52px;height:52px;border-radius:8px;background:#042D4D;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;">🏭</div>`;
  const infos = [razao&&`<div style="font-size:10px;color:#475569;margin-top:1px;">${razao}</div>`||'',
    [cnpj,ie].filter(Boolean).join(' &nbsp;|&nbsp; ') ? `<div style="font-size:10px;color:#64748b;margin-top:2px;">${[cnpj,ie].filter(Boolean).join(' &nbsp;|&nbsp; ')}</div>` : '',
    end ? `<div style="font-size:10px;color:#64748b;margin-top:1px;">📍 ${end}${cep?' — '+cep:''}</div>` : '',
    [tel,email].filter(Boolean).join(' &nbsp;|&nbsp; ') ? `<div style="font-size:10px;color:#64748b;margin-top:1px;">${[tel,email].filter(Boolean).join(' &nbsp;|&nbsp; ')}</div>` : '',
  ].filter(Boolean).join('');
  return `<div style="display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:2px solid #042D4D;margin-bottom:14px;">
    ${logoHtml}
    <div style="flex:1;">
      <div style="font-size:18px;font-weight:800;color:#042D4D;line-height:1.1;">${nome}</div>
      ${infos}
    </div>
  </div>`;
}

function buildPrintHeader(){
  return buildEmpresaHeader(_empresa);
}

function abrirJanelaPDF(html, titulo){
  if(!html){ toast('Erro: sem dados para gerar PDF.','warning'); return; }
  const w = window.open('','_blank');
  if(!w){ toast('Permita pop-ups para gerar o PDF.','warning'); return; }
  w.document.write(html);
  w.document.close();
  // window.print() é chamado automaticamente pelo onload do template htmlPDFBase
  toast('PDF aberto — use Ctrl+P para salvar como PDF.','success');
}

async function pdfProducao(){
  if (!guardAction('relatorios', 'export')) return;
  const {ini,fim,linha,turno}=getPeriodo();
  if(!ini||!fim){toast('Selecione o período antes de gerar o PDF.','warning');return;}
  toast('Gerando PDF de Produção...','info');
  let q=_supabase.from('producao').select('*').gte('data',ini).lte('data',fim).order('data');
  if(linha)q=q.eq('linha',linha); if(turno)q=q.eq('turno',turno);
  const rows=await safe(q);
  const tQ=somaQ(rows);
  const tHT=rows.reduce((s,l)=>s+(l.ht||0),0);
  const tHP=rows.reduce((s,l)=>s+(l.hp||0),0);
  const tLe=rows.reduce((s,l)=>s+(l.consumo_lenha||0),0);
  const dp=tHT>0?((tHT-tHP)/tHT*100).toFixed(1):0;
  const efM=rows.length?Math.round(rows.reduce((s,l)=>s+(l.eficiencia||0),0)/rows.length):0;
  const analise=rows.filter(l=>l.status==='em_analise').length;
  const aprov=rows.filter(l=>l.status==='aprovado').length;
  const kpis=`<div class="kpis">
    ${[['Produção',fQ(tQ,'<br>')],['H. Trabalhadas',fmtN(tHT,1)+'h'],['H. Paradas',fmtN(tHP,1)+'h'],
       ['Disponibilidade',dp+'%'],['Consumo Lenha',fmtN(tLe,1)+' m³'],['Efic. Média',efM+'%'],
       ['Lançamentos',rows.length],['Em Análise',analise],['Aprovados',aprov]]
      .map(([l,v])=>`<div class="kpi"><div class="kpi-v">${v}</div><div class="kpi-l">${l}</div></div>`).join('')}
  </div>`;
  // Resumo por linha
  const porLn={};
  rows.forEach(l=>{if(!porLn[l.linha])porLn[l.linha]={ops:[],ht:0,hp:0,n:0};porLn[l.linha].ops.push(l);porLn[l.linha].ht+=l.ht||0;porLn[l.linha].hp+=l.hp||0;porLn[l.linha].n++;});
  const resumoLinha=Object.entries(porLn).sort((a,b)=>a[0].localeCompare(b[0])).map(([ln,d])=>{
    const d2=d.ht>0?((d.ht-d.hp)/d.ht*100).toFixed(1):0;
    return`<tr><td><strong>${ln}</strong></td><td>${d.n}</td><td><strong>${fQ(somaQ(d.ops),'<br>')}</strong></td><td>${fmtN(d.ht,1)}h</td><td>${fmtN(d.hp,1)}h</td><td>${d2}%</td></tr>`;}).join('');
  const tab=`
    <h3>Resumo por Linha</h3>
    <table><thead><tr><th>Linha</th><th>Lançamentos</th><th>Produção</th><th>H. Trabalhadas</th><th>H. Paradas</th><th>Disponib.</th></tr></thead>
    <tbody>${resumoLinha}</tbody></table>
    <h3>Lançamentos Detalhados</h3>
    <table><thead><tr><th>Data</th><th>Linha</th><th>Turno</th><th>Encarregado</th><th>Produto(s)</th><th>Produção</th><th>H.T</th><th>H.P</th><th>Disponib.</th><th>Efic.Disp</th><th>Efic.Prod</th><th>Lenha m³</th><th>Status</th></tr></thead>
    <tbody>${rows.map(l=>{
      const d2=l.ht>0?((l.ht-l.hp)/l.ht*100).toFixed(1):0;
      const prods=(l.produtos_op&&l.produtos_op.length?l.produtos_op.map(p=>p.produto).join(', '):l.produto)||'—';
      const stCls={em_analise:'warn',aprovado:'ok',reprovado:'danger',parada:'danger'}[l.status]||'info';
      const stTxt={em_analise:'Análise',aprovado:'Aprovado',reprovado:'Reprovado',parada:'Parada'}[l.status]||l.status||'—';
      return`<tr><td>${l.data||'—'}<br><small style="color:#94a3b8;">${l.dia_semana||''}</small></td>
        <td><strong>${l.linha}</strong>${l.op_numero?`<br><small style="color:#7c3aed;">${l.op_numero}</small>`:''}</td>
        <td>${l.turno}</td><td>${l.encarregado||'—'}</td><td>${prods}</td>
        <td><strong>${fQ(qtdOP(l),'<br>')}</strong></td>
        <td>${fmtN(l.ht,2)}h</td><td>${fmtN(l.hp,2)}h</td>
        <td>${d2}%</td><td>${l.efic_disp||'—'}</td><td>${l.efic_prod||'—'}</td>
        <td>${fmtN(l.consumo_lenha,1)}</td>
        <td><span class="bd bd-${stCls}">${stTxt}</span></td></tr>`;
    }).join('')||'<tr><td colspan="13" style="text-align:center;color:#94a3b8;padding:20px;">Nenhum dado</td></tr>'}</tbody></table>`;
  abrirJanelaPDF(htmlPDFBase('Relatório de Produção',`${fmtD(ini)} a ${fmtD(fim)}${linha?' — '+linha:''}${turno?' — '+turno:''}`,kpis,tab));
}
async function pdfManutencao(){
  if (!guardAction('relatorios', 'export')) return;
  const {ini,fim}=getPeriodo();
  if(!ini||!fim){toast('Selecione o período antes de gerar o PDF.','warning');return;}
  toast('Gerando PDF de Manutenção...','info');
  const rows=await safe(_supabase.from('manutencao').select('*').or('linha.is.null,linha.neq.Frota').gte('data_abertura',ini).lte('data_abertura',fim).order('data_abertura'));
  const hoje=new Date().toISOString().split('T')[0];
  const abertas=rows.filter(x=>x.status==='aberta').length;
  const andament=rows.filter(x=>x.status==='em_andamento').length;
  const concl=rows.filter(x=>x.status==='concluida').length;
  const urgentes=rows.filter(x=>x.prioridade==='urgente').length;
  const atrasadas=rows.filter(x=>x.data_prevista&&x.data_prevista<hoje&&!['concluida','cancelada'].includes(x.status)).length;
  const tHoras=rows.reduce((s,x)=>s+(x.horas_gastas||0),0);
  const custoTotal=rows.reduce((s,x)=>s+(parseFloat(x.custo_manutencao)||0),0);
  const kpis=`<div class="kpis">
    ${[['Total OS',rows.length],['Abertas',abertas],['Em Andamento',andament],['Concluídas',concl],
       ['Urgentes',urgentes],['Atrasadas',atrasadas],['Horas Gastas',fmtN(tHoras,1)+'h'],['Custo Total','R$ '+fmtN(custoTotal,2)]]

async function pdfEpi(){

  const ok=entregas.length-venc-prox;

  const reprov=pallets.filter(p=>p.status==='reprovado').length;
  const pend =pallets.filter(p=>p.status==='pendente').length;
  const qual =(aprov+reprov)>0?(aprov/(aprov+reprov)*100):100;
  // Por linha

  pallets.forEach(p=>{const ln=p.linha||'—';if(!porLn[ln])porLn[ln]={a:0,r:0,p:0};if(p.status==='aprovado')porLn[ln].a++;else if(p.status==='reprovado')porLn[ln].r++;else porLn[ln].p++;});

  </div>`;

        <td>${d.p}</td><td>${tot}</td>

    }).join('')||'<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:16px;">Sem dados de pallets no período</td></tr>'}</tbody></table>
    <h3>Pallets Detalhados</h3>
    <table><thead><tr><th>Nº Pallet</th><th>Linha</th><th>Produto</th><th>Status</th><th>Responsável Lab</th><th>Hora Análise</th><th>Obs.</th></tr></thead>

  const kpis=`<div class="kpis">

  const resumoCC=Object.entries(porCC).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<tr>
    <td><strong>${n}</strong></td>
    <td><strong>R$ ${fmtN(v,2)}</strong></td>
    <td>${tVal>0?'<span class="bd bd-info">'+(v/tVal*100).toFixed(1)+'%</span>':'—'}</td></tr>`).join('');
  const tab=`
    <h3>Resumo por Natureza de Custo</h3>
