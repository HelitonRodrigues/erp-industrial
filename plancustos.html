<script>
/* ================================================================
   PLANEJAMENTO & CUSTOS — Fase 1 (fundação + plano)
   Decisões de desenho (acordadas em 15/08/2026):
   • itens do plano são PLANOS (linha_id, turno_id, produto_nome) — o realizado
     das OPs entra por (produto, linha) mesmo sem plano correspondente (Fase 2);
   • vínculos por ID: renomear linha/turno no cadastro não quebra o plano;
   • config importada do custo-precificacao (preços/réguas) — motor de custo na Fase 3;
   • salvar honesto: erro de rede aparece como erro, nunca "✓ Salvo".
================================================================ */
let _planos=[], _linhas=[], _turnos=[], _produtosCad=[];
let _plano=null;          // plano aberto (objeto da tabela planos_mensais)
let _sujo=false;          // alterações não salvas
let _mostrarExcluidos=false;

const DIAS_SEMANA=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const MESES=['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

/* ── sidebar ── */
fetch('partials/sidebar.html').then(r=>r.text()).then(html=>{
  document.getElementById('sidebar-container').innerHTML=html;
}).catch(e=>console.warn('[sidebar]',e));
initSidebar('plancustos.html');

/* ================================================================
   MOTOR DE HORAS — portado 1:1 do custo-precificacao.html (5 meses
   de uso validado). Mesmas fórmulas; NÃO alterar sem recalibrar.
================================================================ */
function getFeriadosNacionais(ano,mes){
  const f=[];
  const fixos=[[1,1,'Ano Novo'],[4,21,'Tiradentes'],[5,1,'Dia do Trabalho'],[9,7,'Independência'],
    [10,12,'N.Sra.Aparecida'],[11,2,'Finados'],[11,15,'Proclamação da República'],[11,20,'Consciência Negra'],[12,25,'Natal']];
  fixos.forEach(([m,d,nome])=>{if(m===mes)f.push({dia:d,nome});});
  const a=ano%19,b=Math.floor(ano/100),c=ano%100,d2=Math.floor(b/4),e=b%4,
    fi=Math.floor((b+8)/25),g=Math.floor((b-fi+1)/3),h=(19*a+b-d2-g+15)%30,
    i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m2=Math.floor((a+11*h+22*l)/451);
  const mesPascoa=Math.floor((h+l-7*m2+114)/31),diaPascoa=(h+l-7*m2+114)%31+1;
  const pascoa=new Date(ano,mesPascoa-1,diaPascoa);
  const sf=new Date(pascoa);sf.setDate(pascoa.getDate()-2);
  const carnaval=new Date(pascoa);carnaval.setDate(pascoa.getDate()-47);
  const cc=new Date(pascoa);cc.setDate(pascoa.getDate()+60);
  if(mesPascoa===mes)f.push({dia:diaPascoa,nome:'Páscoa'});
  if(sf.getMonth()+1===mes)f.push({dia:sf.getDate(),nome:'Sexta-feira Santa'});
  if(carnaval.getMonth()+1===mes)f.push({dia:carnaval.getDate(),nome:'Carnaval'});
  if(cc.getMonth()+1===mes)f.push({dia:cc.getDate(),nome:'Corpus Christi'});
  return f;
}
function gerarCalendarioMes(ano,mes,feriadosLocais,calendarioExistente){
  const diasNoMes=new Date(ano,mes,0).getDate();
  const prefixo=`${ano}-${String(mes).padStart(2,'0')}-`;
  const feriadosNac=getFeriadosNacionais(ano,mes);
  const feriadosDias=new Set([...feriadosNac.map(x=>x.dia),...(feriadosLocais||[]).map(x=>x.dia)]);
  const calendario={};
  Object.entries(calendarioExistente||{}).forEach(([k,v])=>{if(k.startsWith(prefixo))calendario[k]=v;});
  for(let d=1;d<=diasNoMes;d++){
    const dateKey=`${prefixo}${String(d).padStart(2,'0')}`;
    if(calendario[dateKey]!==undefined)continue;
    const dow=new Date(ano,mes-1,d).getDay();
    calendario[dateKey]=feriadosDias.has(d)?'feriado':(dow===0?'folga':'trabalha');
  }
  return calendario;
}
function calcMinutos(ini,fim){
  if(!ini||!fim)return 0;
  const [h1,m1]=ini.split(':').map(Number);let [h2,m2]=fim.split(':').map(Number);
  let mins=(h2*60+m2)-(h1*60+m1);if(mins<0)mins+=1440;return mins;
}
function calcHorasSecao(calendarioMes,turno,eficienciaPct,extrasPorDia,paradasHoras,horasDomingoEspecial){
  const refM=Number(turno&&turno.refeicao_min)||0;
  const extrasMins=Math.round((extrasPorDia||0)*60);
  let minsBrutos=0,diasTrabalho=0;
  Object.entries(calendarioMes||{}).forEach(([dateKey,estado])=>{
    if(estado==='trabalha'||estado==='domingo-especial'){
      diasTrabalho++;
      if(estado==='domingo-especial'){
        minsBrutos+=Math.round((horasDomingoEspecial||0)*60)+extrasMins;
      }else{
        const dow=new Date(dateKey+'T12:00:00').getDay();
        const diaInfo=((turno&&turno.calendario)||{})[DIAS_SEMANA[dow]];
        let mDia=0;
        if(diaInfo&&diaInfo.ativo!==false&&diaInfo.inicio&&diaInfo.fim){
          mDia=Math.max(0,calcMinutos(diaInfo.inicio,diaInfo.fim)-refM);
        }
        if(mDia>0)minsBrutos+=mDia+extrasMins;
      }
    }
  });
  const paradasMins=Math.round((paradasHoras||0)*60);
  const perdaMins=Math.round(minsBrutos*(100-(eficienciaPct??100))/100);
  const liquidoMins=minsBrutos-perdaMins;
  const dispMins=Math.max(0,liquidoMins-paradasMins);
  return {diasTrabalho,horasBrutas:minsBrutos/60,perdaH:perdaMins/60,liquidoH:liquidoMins/60,paradaH:paradasMins/60,dispH:dispMins/60};
}
function distribuirHorasProdutos(produtos,horasDisp){
  let horasNecTotal=0;const necPorId={};const semDemanda=[];
  (produtos||[]).forEach(p=>{
    if(p.demanda>0){const nec=p.cap_hora>0?p.demanda/p.cap_hora:0;necPorId[p.id]=nec;horasNecTotal+=nec;}
    else semDemanda.push(p);
  });
  const fatorRateio=horasNecTotal>horasDisp&&horasNecTotal>0?horasDisp/horasNecTotal:1;
  let horasComDemanda=0;const alocado={};
  Object.entries(necPorId).forEach(([id,nec])=>{alocado[id]=nec*fatorRateio;horasComDemanda+=alocado[id];});
  const horasRestantes=Math.max(0,horasDisp-horasComDemanda);
  const horasPorSemDem=semDemanda.length>0?horasRestantes/semDemanda.length:0;
  const res={};
  (produtos||[]).forEach(p=>{
    const h=p.demanda>0?alocado[p.id]:horasPorSemDem;
    res[p.id]={horasDispProd:h,qtdMax:p.cap_hora>0?Math.round(h*p.cap_hora):0};
  });
  return res;
}

/* ================================================================
   HELPERS
================================================================ */
function fmtN(v,dec){const x=Number(v)||0;return x.toLocaleString('pt-BR',{minimumFractionDigits:dec??0,maximumFractionDigits:dec??1});}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function linhaNome(id){return _linhas.find(l=>l.id===id)?.nome||'⚠️ linha removida';}
function turnoDe(id){return _turnos.find(t=>t.id===id)||null;}
function novoId(){return 'i'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);}
function marcarSujo(){_sujo=true;const b=document.getElementById('pc-salvar-btn');if(b){b.textContent='💾 Salvar alterações •';b.classList.add('btn-primary');}}

/* ================================================================
   FASE 2 — REALIZADO AUTOMÁTICO (OPs da tabela producao)
   Regra acordada: o realizado entra por (produto, linha) MESMO sem plano
   correspondente — produto produzido em linha não planejada vira linha de
   comparação "não planejado", nunca um buraco. Matching por nome
   normalizado (mesma régua do norm_nome do banco), nunca por "contém".
================================================================ */
let _realOps=[],_realCarregado=false;

function normNome(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');}

async function carregarRealizado(){
  _realCarregado=false;
  const ini=`${_plano.ano}-${String(_plano.mes).padStart(2,'0')}-01`;
  const fimD=new Date(_plano.ano,_plano.mes,0).getDate();
  const fim=`${_plano.ano}-${String(_plano.mes).padStart(2,'0')}-${String(fimD).padStart(2,'0')}`;
  try{
    const {data,error}=await _supabase.from('producao')
      .select('data,linha,turno,status,ht,hp,consumo_lenha,produtos_op')
      .gte('data',ini).lte('data',fim).limit(2000);
    if(error)throw error;
    _realOps=data||[];_realCarregado=true;
  }catch(e){_realOps=[];console.warn('[realizado]',e.message||e);toast('Não consegui carregar o realizado: '+(e.message||e),'warning');}
}

function computarRealizado(){
  const porProduto={},porLinha={};
  _realOps.forEach(r=>{
    if(r.status==='parada')return;                      // dia parado não é produção
    const linhaR=(r.linha||'—').trim();
    const pl=porLinha[linhaR]=porLinha[linhaR]||{sacos:0,ht:0,hp:0,lenha:0,registros:0};
    pl.ht+=Number(r.ht)||0;pl.hp+=Number(r.hp)||0;pl.lenha+=Number(r.consumo_lenha)||0;pl.registros++;
    (r.produtos_op||[]).forEach(op=>{
      const nome=(op.produto||'').trim();if(!nome)return;
      const k=normNome(nome);
      const pp=porProduto[k]=porProduto[k]||{nome,total:0,porLinha:{}};
      const sacos=Number(op.total_sacos??op.sacos)||0;
      pp.total+=sacos;
      pp.porLinha[linhaR]=(pp.porLinha[linhaR]||0)+sacos;
      pl.sacos+=sacos;
    });
  });
  return {porProduto,porLinha};
}

/* itens do plano agrupados p/ exibição: linha → turno → produtos */
function gruposDoPlano(){
  const grupos=[];
  (_plano.itens||[]).forEach(it=>{
    let g=grupos.find(x=>x.linha_id===it.linha_id);
    if(!g){g={linha_id:it.linha_id,turnos:[]};grupos.push(g);}
    let t=g.turnos.find(x=>x.turno_id===it.turno_id);
    if(!t){t={turno_id:it.turno_id,itens:[]};g.turnos.push(t);}
    t.itens.push(it);
  });
  return grupos;
}
/* horas e quantidade planejada de cada item — mesma régua do CP:
   qtd = qtd_manual ?? (demanda>0 ? demanda : qtdMax das horas livres) */
function computarPlano(){
  const porItem={},porProduto={},porLinha={};
  gruposDoPlano().forEach(g=>{
    g.turnos.filter(tg=>tg.turno_id).forEach(tg=>{
      const primeiroItem=tg.itens.find(i=>!i._ph)||tg.itens[0]||{};
      const turno=turnoDe(tg.turno_id);
      const horas=calcHorasSecao(_plano.calendario,turno,primeiroItem.eficiencia??90,
        primeiroItem.extras||0,primeiroItem.paradas_h||0,_plano.horas_domingo_especial||8);
      const dist=distribuirHorasProdutos(tg.itens.filter(i=>i.ativo!==false&&!i._ph),horas.dispH);
      tg.itens.filter(it=>!it._ph).forEach(it=>{
        const d=dist[it.id]||{horasDispProd:0,qtdMax:0};
        const qtd=it.ativo===false?0:
          (it.qtd_manual!=null&&it.qtd_manual!==''?Number(it.qtd_manual):
           (Number(it.demanda)>0?Number(it.demanda):d.qtdMax));
        const excede=Number(it.demanda)>0&&Number(it.demanda)>d.qtdMax&&(it.qtd_manual==null||it.qtd_manual==='');
        porItem[it.id]={horas,horasProd:d.horasDispProd,qtdMax:d.qtdMax,qtd,excede};
        if(it.ativo===false)return;
        const chaveP=(it.produto_nome||'').trim();
        porProduto[chaveP]=porProduto[chaveP]||{demanda:0,planejado:0,linhas:{}};
        porProduto[chaveP].demanda+=Number(it.demanda)||0;
        porProduto[chaveP].planejado+=qtd;
        porProduto[chaveP].linhas[g.linha_id]=(porProduto[chaveP].linhas[g.linha_id]||0)+qtd;
        porLinha[g.linha_id]=porLinha[g.linha_id]||{horasDisp:0,horasUsadas:0,sacos:0,lenha:0,_turnos:new Set()};
        if(!porLinha[g.linha_id]._turnos.has(tg.turno_id)){
          porLinha[g.linha_id].horasDisp+=horas.dispH;
          porLinha[g.linha_id].lenha+=(Number(it.lenha_m3_turno)||0)*horas.diasTrabalho;
          porLinha[g.linha_id]._turnos.add(tg.turno_id);
        }
        porLinha[g.linha_id].horasUsadas+=it.cap_hora>0?qtd/it.cap_hora:0;
        porLinha[g.linha_id].sacos+=qtd;
      });
    });
  });
  return {porItem,porProduto,porLinha};
}

/* ================================================================
   INIT + LISTAGEM
================================================================ */
async function init(){
  const safe=async q=>{try{const r=await q;return r.error?(console.warn(r.error.message),[]):(r.data||[]);}catch(e){return[];}};
  const [planos,linhas,turnos,prods]=await Promise.all([
    safe(_supabase.from('planos_mensais').select('id,ano,mes,nome,status,totais,created_at,atualizado_em').order('ano',{ascending:false}).order('mes',{ascending:false})),
    safe(_supabase.from('linhas_producao').select('id,nome,status,produtos').eq('status','ativo').order('nome')),
    safe(_supabase.from('turnos').select('id,nome,calendario,refeicao_min,status').eq('status','ativo').order('nome')),
    safe(_supabase.from('produtos').select('id,nome,unidade,peso_unidade_kg,status').eq('status','ativo').order('nome')),
  ]);
  _planos=planos;_linhas=linhas;_turnos=turnos;_produtosCad=prods;
  renderLanding();
}

function renderLanding(){
  _plano=null;_sujo=false;
  document.getElementById('pc-header-actions').innerHTML=

/* Importa preços/réguas do último planejamento salvo do custo-precificacao.
   Só copia CONFIGURAÇÃO (preços, pesos, réguas) — nunca o plano em si. */
async function importarConfigCP(){
  const {data,error}=await _supabase.from('planejamentos_custo')
    .select('codigo,nome,mes,ano,estado').eq('status','ativo')
    .order('numero',{ascending:false}).limit(1).maybeSingle();
  if(error||!data||!data.estado)return null;
  const e=data.estado;
  return {
    origem:`${data.codigo||''} ${data.nome||''} (${data.mes}/${data.ano})`.trim(),
    importado_em:new Date().toISOString(),
    insumos:(e.insumos||[]).map(i=>({
      id:i.id,classe:i.classe,insumo:i.insumo,classificacao:i.classificacao,
      tipoRateio:i.tipoRateio,produtoBase:i.produtoBase||null,unidade:i.unidade,
      formulaQtd:i.formulaQtd,
      sacosPorPallet:i.sacosPorPalletEditado??i.sacosPorPallet??null,
      precoUnitario:i.precoUnitarioEditado??null,
      custoPorTon:i.custoPorTonEditado??i.custoPorTon??null,
      valorMensal:i.valorMensalEditado??i.valorMensal??null,
      quantidadeLivre:i.quantidadeLivreEditada??i.quantidadeLivre??null,
      quantidadeManual:i.quantidadeManualEditado??i.quantidadeManual??null,
      naturezaId:i.naturezaId||null,centroCustoId:i.centroCustoId||null,
      removido:!!i.removido,
    })),
    pesos:e.pesos||null, margemAlvo:e.margemAlvo||null, precoVendaManual:e.precoVendaManual||null,
    alvoMaximoPct:e.alvoMaximoPct??null, fatorEncargos:e.fatorEncargos??1,
    equipeAdmin:e.equipeAdmin||[], mapaProduto:e.mapaProduto||{},
    mpCinza:e.mpCinza||null, refeicao:e.refeicao||null, cartaoAlimentacao:e.cartaoAlimentacao||null,
    filtroManga:e.filtroManga||null, lenha:e.lenha||null, stretch:e.stretch||null,
    arrendamento:e.arrendamento||null, energia:e.energia||null,
    itensMultiplos:e.itensMultiplos||null, desgaste:e.desgaste||null, escopos:e.escopos||null,
  };
}

async function criarPlano(){
  if(typeof guardAction==='function'&&!guardAction('plancustos','edit'))return;
  const mes=parseInt(document.getElementById('np-mes').value),ano=parseInt(document.getElementById('np-ano').value);
  const errEl=document.getElementById('np-error');errEl.classList.add('hidden');
  if(!mes||!ano){errEl.textContent='Informe mês e ano.';errEl.classList.remove('hidden');return;}
  const jaTem=_planos.find(p=>p.mes===mes&&p.ano===ano&&p.status==='ativo');
  if(jaTem&&!confirm(`Já existe um plano ativo de ${MESES[mes]}/${ano}. Criar outro mesmo assim?`))return;
  const btn=document.getElementById('np-criar-btn');btn.disabled=true;btn.textContent='⏳ Criando...';
  try{
    let config={};
    if(document.getElementById('np-importar').checked){
      const imp=await importarConfigCP();
      if(imp){config=imp;}
    }
    const feriadosLocais=[];
    const registro={
      ano,mes,nome:document.getElementById('np-nome').value.trim()||null,
      calendario:gerarCalendarioMes(ano,mes,feriadosLocais,{}),
      feriados_locais:feriadosLocais,horas_domingo_especial:8,
      itens:[],config,
      criado_por:(typeof getUser==='function'?(getUser()||{}).nome:null)||null,
    };
    const {data,error}=await _supabase.from('planos_mensais').insert(registro).select().single();
    if(error)throw error;
    try{await addLog('CREATE','PLANCUSTOS',data.id,`Plano ${MESES[mes]}/${ano} criado`);}catch(e){}
    closeModal('m-novo-plano');
    toast(config.insumos?`Plano criado — preços importados de "${config.origem}".`:'Plano criado.','success');
    _planos.unshift(data);
    abrirPlanoObj(data);
  }catch(e){errEl.textContent='Erro ao criar: '+(e.message||e);errEl.classList.remove('hidden');}
  btn.disabled=false;btn.textContent='✨ Criar Plano';
}

async function abrirPlano(id){
  const {data,error}=await _supabase.from('planos_mensais').select('*').eq('id',id).maybeSingle();
  if(error||!data){toast('Erro ao abrir: '+(error?.message||'plano não encontrado'),'danger');return;}
  abrirPlanoObj(data);
}
async function abrirPlanoObj(p){
  _plano=p;_sujo=false;_realOps=[];_realCarregado=false;
  renderPlano();                       // pinta o plano na hora
  await carregarRealizado();           // realizado chega em seguida
  if(_plano&&_plano.id===p.id)renderPlano();
}
async function atualizarRealizado(){
  await carregarRealizado();
  renderPlano();
  toast('Realizado atualizado com as OPs de '+MESES[_plano.mes]+'/'+_plano.ano+'.','success');
}

function excluirPlano(id){
  const p=_planos.find(x=>x.id===id);if(!p)return;
  document.getElementById('confirm-msg').innerHTML=`Excluir o plano <strong>${MESES[p.mes]}/${p.ano}</strong>?<br><small style="color:#94a3b8;">Ele vai para os excluídos — dá para restaurar.</small>`;
  document.getElementById('confirm-ok').onclick=async()=>{
    const {error}=await _supabase.from('planos_mensais').update({status:'excluido',atualizado_em:new Date().toISOString()}).eq('id',id);
    closeModal('m-confirm');
    if(error){toast('Erro: '+error.message,'danger');return;}
    p.status='excluido';renderLanding();toast('Plano excluído (restaurável).','warning');
  };
  document.getElementById('m-confirm').classList.remove('hidden');
}
async function restaurarPlano(id){
  const {error}=await _supabase.from('planos_mensais').update({status:'ativo',atualizado_em:new Date().toISOString()}).eq('id',id);
  if(error){toast('Erro: '+error.message,'danger');return;}
  const p=_planos.find(x=>x.id===id);if(p)p.status='ativo';
  renderLanding();toast('Plano restaurado.','success');
}

/* ================================================================
   SALVAR — honesto: erro aparece como erro
================================================================ */
async function salvarPlano(){
  if(typeof guardAction==='function'&&!guardAction('plancustos','edit'))return;
  const btn=document.getElementById('pc-salvar-btn');
  btn.disabled=true;btn.textContent='⏳ Salvando...';
  const comp=computarPlano();
  const sacos=Object.values(comp.porProduto).reduce((s,p)=>s+p.planejado,0);
  const toneladas=Object.entries(comp.porProduto).reduce((s,[nome,p])=>{
    const cad=_produtosCad.find(x=>(x.nome||'').trim().toLowerCase()===nome.toLowerCase());
    const pesoKg=Number(cad?.peso_unidade_kg)||0;
    return s+(pesoKg>0?p.planejado*pesoKg/1000:0);
  },0);
  const payload={
    nome:_plano.nome,calendario:_plano.calendario,feriados_locais:_plano.feriados_locais,
    horas_domingo_especial:_plano.horas_domingo_especial,itens:_plano.itens,config:_plano.config,
    totais:{sacos,toneladas,produtos:Object.keys(comp.porProduto).length},
    atualizado_em:new Date().toISOString(),
  };
  try{
    const {error}=await _supabase.from('planos_mensais').update(payload).eq('id',_plano.id);
    if(error)throw error;
    _sujo=false;
    const idx=_planos.findIndex(x=>x.id===_plano.id);
    if(idx>-1)Object.assign(_planos[idx],{totais:payload.totais,atualizado_em:payload.atualizado_em,nome:_plano.nome});
    btn.textContent='✓ Salvo';btn.classList.remove('btn-primary');
    setTimeout(()=>{if(!_sujo)btn.textContent='💾 Salvar';},1800);
    toast('Plano salvo.','success');
  }catch(e){
    btn.textContent='⚠️ ERRO ao salvar — tente de novo';btn.classList.add('btn-primary');
    toast('NÃO SALVOU: '+(e.message||e),'danger');
  }
  btn.disabled=false;
}

function renderKPIs(comp){
  const totalSacos=Object.values(comp.porProduto).reduce((s,p)=>s+p.planejado,0);
  const totalDemanda=Object.values(comp.porProduto).reduce((s,p)=>s+p.demanda,0);
  const diasTrab=Object.values(_plano.calendario||{}).filter(v=>v==='trabalha'||v==='domingo-especial').length;
  const nLinhas=new Set((_plano.itens||[]).map(i=>i.linha_id)).size;
  const real=computarRealizado();
  const totalReal=Object.values(real.porProduto).reduce((s,p)=>s+p.total,0);
  const pct=totalSacos>0?totalReal/totalSacos*100:null;
  return `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
    <div class="pc-kpi"><div class="v">${diasTrab}</div><div class="l">dias de trabalho</div></div>
    <div class="pc-kpi"><div class="v">${nLinhas}</div><div class="l">linha(s) no plano</div></div>
    <div class="pc-kpi"><div class="v">${Object.keys(comp.porProduto).length}</div><div class="l">produto(s)</div></div>
    <div class="pc-kpi"><div class="v">${fmtN(totalDemanda,0)}</div><div class="l">demanda (un)</div></div>
    <div class="pc-kpi"><div class="v">${fmtN(totalSacos,0)}</div><div class="l">planejado (un)</div></div>
    <div class="pc-kpi" style="border-color:#bae6fd;"><div class="v" style="color:#0369a1;">${_realCarregado?fmtN(totalReal,0):'…'}</div><div class="l">realizado (un)</div></div>
    <div class="pc-kpi" style="border-color:#bae6fd;"><div class="v" style="color:${pct==null?'#94a3b8':pct>=100?'#15803d':'#0369a1'};">${pct==null?'—':fmtN(pct,0)+'%'}</div><div class="l">do planejado</div></div>
  </div>`;
}

/* ── calendário ── */
function renderCalendario(){
  const ano=_plano.ano,mes=_plano.mes;
  const diasNoMes=new Date(ano,mes,0).getDate();
  const primeiroDow=new Date(ano,mes-1,1).getDay();
  const cels=[];
  ['D','S','T','Q','Q','S','S'].forEach(d=>cels.push(`<div class="cab">${d}</div>`));
  for(let i=0;i<primeiroDow;i++)cels.push('<div></div>');
  for(let d=1;d<=diasNoMes;d++){
    const k=`${ano}-${String(mes).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const st=_plano.calendario[k]||'folga';
    const rot={trabalha:'trab',folga:'folga',feriado:'fer',['domingo-especial']:'dom.esp'}[st]||'';
    cels.push(`<div class="pc-dia ${st}" onclick="toggleDia('${k}')">${d}<small>${rot}</small></div>`);
  }
  return `<div class="pc-card">
    <div class="pc-sec-tit">📅 Calendário do mês
      <span class="pc-hint" style="font-weight:400;margin-left:6px;">clique no dia para alternar · trabalha → folga → feriado (domingo tem "domingo especial")</span>
      <span style="margin-left:auto;display:flex;gap:6px;align-items:center;">
        <label class="pc-hint">h do domingo especial</label>
        <input type="number" class="form-input" style="width:64px;padding:4px 8px;" min="0" max="24"
          value="${_plano.horas_domingo_especial??8}" onchange="_plano.horas_domingo_especial=parseFloat(this.value)||0;marcarSujo();renderPlano()">
      </span>
    </div>
    <div class="pc-cal">${cels.join('')}</div>
  </div>`;
}
function toggleDia(k){
  const atual=_plano.calendario[k]||'folga';
  const dow=new Date(k+'T12:00:00').getDay();
  const ciclo=dow===0?['folga','domingo-especial','trabalha']:['trabalha','folga','feriado'];
  const idx=ciclo.indexOf(atual);
  _plano.calendario[k]=ciclo[(idx+1)%ciclo.length];
  marcarSujo();renderPlano();
}

      <tbody>
        ${tg.itens.filter(it=>!it._ph).map(it=>{
          const c=comp.porItem[it.id]||{qtd:0,qtdMax:0,horasProd:0,excede:false};
          const badge=it.ativo===false?'<span class="pc-badge livre">fechado</span>':
            c.excede?`<span class="pc-badge excede" title="Demanda maior que a capacidade nas horas disponíveis (máx ${fmtN(c.qtdMax,0)})">⚠ excede cap.</span>`:
            '<span class="pc-badge ok">ok</span>';
          return `<tr style="${it.ativo===false?'opacity:.5;':''}">
            <td><strong>${esc(it.produto_nome)}</strong></td>
            <td><input type="number" class="form-input" style="padding:3px 6px;" min="0"
              value="${it.cap_hora||0}" onchange="setItemCampo('${it.id}','cap_hora',parseFloat(this.value)||0)"></td>
            <td><input type="number" class="form-input" style="padding:3px 6px;" min="0"
              value="${it.demanda||''}" placeholder="—" onchange="setItemCampo('${it.id}','demanda',this.value===''?0:parseFloat(this.value)||0)"></td>
            <td><input type="number" class="form-input" style="padding:3px 6px;" min="0"
              value="${it.qtd_manual??''}" placeholder="auto" onchange="setItemCampo('${it.id}','qtd_manual',this.value===''?null:parseFloat(this.value)||0)"></td>
            <td style="font-weight:800;color:var(--primary);">${fmtN(c.qtd,0)}</td>
            <td class="pc-hint">${fmtN(c.horasProd)}h</td>
            <td>${badge}</td>
            <td style="white-space:nowrap;">
              <button class="btn btn-ghost btn-sm" title="${it.ativo===false?'Reabrir':'Fechar (sai da conta sem apagar)'}"
                onclick="setItemCampo('${it.id}','ativo',${it.ativo===false?'true':'false'})">${it.ativo===false?'▶':'⏸'}</button>
              <button class="btn btn-ghost btn-sm" style="color:#dc2626;" onclick="removerItem('${it.id}')">✕</button>
            </td>
          </tr>`;
        }).join('')||'<tr><td colspan="8" class="pc-hint" style="text-align:center;">Nenhum produto neste turno.</td></tr>'}
      </tbody>
    </table>
    <div style="margin-top:6px;display:flex;gap:6px;align-items:center;">
      <select id="pc-add-prod-${g.linha_id}-${tg.turno_id}" class="form-input" style="width:240px;padding:5px 8px;">
        <option value="">+ Produto...</option>
        ${prodOpts.map(p=>`<option value="${esc(p.nome)}" data-cap="${p.capHora||0}">${esc(p.nome)}${p.capHora?' ('+p.capHora+'/h)':''}</option>`).join('')}
      </select>
      <button class="btn btn-secondary btn-sm" onclick="addProduto('${g.linha_id}','${tg.turno_id}')">Adicionar produto</button>
    </div>
  </div>`;
}
/* produtos oferecidos para uma linha: TODOS os do cadastro (produto roda em
   qualquer linha — decisão de desenho); a média/h sugerida vem do cadastro da
   linha quando existir lá */
function nomesProdutosParaLinha(linhaId){
  const linha=_linhas.find(l=>l.id===linhaId);
  const daLinha={};
  (linha?.produtos||[]).forEach(p=>{if(p&&p.nome)daLinha[(p.nome||'').trim().toLowerCase()]=Number(p.capHora)||0;});
  return _produtosCad.map(p=>({nome:p.nome,capHora:daLinha[(p.nome||'').trim().toLowerCase()]||0}));
}

/* ── mutações ── */
function addLinha(){
  const sel=document.getElementById('pc-add-linha');
  if(!sel.value){toast('Escolha a linha.','warning');return;}
  // linha entra vazia; turno e produtos na sequência
  _plano.itens.push({id:novoId(),linha_id:sel.value,turno_id:null,produto_nome:'__placeholder__',ativo:false,_ph:true});
  // placeholder só para o grupo aparecer; limpo ao adicionar o primeiro turno
  marcarSujo();renderPlano();
}
function addTurno(linhaId){
  const sel=document.getElementById('pc-add-turno-'+linhaId);
  if(!sel.value){toast('Escolha o turno.','warning');return;}
  _plano.itens=_plano.itens.filter(i=>!(i.linha_id===linhaId&&i._ph)); // remove placeholder
  _plano.itens.push({id:novoId(),linha_id:linhaId,turno_id:sel.value,produto_nome:'__placeholder__',ativo:false,_ph:true});
  marcarSujo();renderPlano();
}
function addProduto(linhaId,turnoId){
  const sel=document.getElementById(`pc-add-prod-${linhaId}-${turnoId}`);
  if(!sel.value){toast('Escolha o produto.','warning');return;}
  const jaTem=_plano.itens.some(i=>i.linha_id===linhaId&&i.turno_id===turnoId&&(i.produto_nome||'').toLowerCase()===sel.value.toLowerCase()&&!i._ph);
  if(jaTem){toast('Este produto já está neste turno.','warning');return;}
  const cap=parseFloat(sel.selectedOptions[0]?.dataset.cap)||0;
  const irmao=_plano.itens.find(i=>i.linha_id===linhaId&&i.turno_id===turnoId&&!i._ph);
  _plano.itens=_plano.itens.filter(i=>!(i.linha_id===linhaId&&i.turno_id===turnoId&&i._ph));
  _plano.itens.push({
    id:novoId(),linha_id:linhaId,turno_id:turnoId,produto_nome:sel.value,
    cap_hora:cap,demanda:0,qtd_manual:null,ativo:true,
    eficiencia:irmao?.eficiencia??90,extras:irmao?.extras||0,paradas_h:irmao?.paradas_h||0,lenha_m3_turno:irmao?.lenha_m3_turno||0,
  });
  marcarSujo();renderPlano();
}
function setItemCampo(itemId,campo,valor){
  const it=_plano.itens.find(i=>i.id===itemId);if(!it)return;
  it[campo]=valor;marcarSujo();renderPlano();
}
/* campos do turno (eficiência, extras, paradas, lenha) vivem replicados nos
   itens do turno — setar propaga para todos, mantendo o modelo plano */
function setTurnoCampo(linhaId,turnoId,campo,valor){
  _plano.itens.forEach(i=>{if(i.linha_id===linhaId&&i.turno_id===turnoId)i[campo]=valor;});
  marcarSujo();renderPlano();
}
function removerItem(itemId){
  const it=_plano.itens.find(i=>i.id===itemId);if(!it)return;
  const resto=_plano.itens.filter(i=>i.id!==itemId);
  // mantém o turno visível se era o último produto dele
  if(!resto.some(i=>i.linha_id===it.linha_id&&i.turno_id===it.turno_id)){
    resto.push({id:novoId(),linha_id:it.linha_id,turno_id:it.turno_id,produto_nome:'__placeholder__',ativo:false,_ph:true,
      eficiencia:it.eficiencia,extras:it.extras,paradas_h:it.paradas_h,lenha_m3_turno:it.lenha_m3_turno});
  }
  _plano.itens=resto;marcarSujo();renderPlano();
}
function removerTurno(linhaId,turnoId){
  const qtd=_plano.itens.filter(i=>i.linha_id===linhaId&&i.turno_id===turnoId&&!i._ph).length;
  if(qtd&&!confirm(`Remover o turno com ${qtd} produto(s)?`))return;
  _plano.itens=_plano.itens.filter(i=>!(i.linha_id===linhaId&&i.turno_id===turnoId));
  if(!_plano.itens.some(i=>i.linha_id===linhaId)){
    _plano.itens.push({id:novoId(),linha_id:linhaId,turno_id:null,produto_nome:'__placeholder__',ativo:false,_ph:true});
  }
  marcarSujo();renderPlano();
}
function removerLinha(linhaId){
  const qtd=_plano.itens.filter(i=>i.linha_id===linhaId&&!i._ph).length;
  if(qtd&&!confirm(`Remover a linha inteira com ${qtd} produto(s) planejados?`))return;
  _plano.itens=_plano.itens.filter(i=>i.linha_id!==linhaId);
  marcarSujo();renderPlano();
}

/* ── PLANO × REALIZADO — painéis por produto e por linha ── */
function renderPlanoReal(comp){
  const real=computarRealizado();
  // união das chaves normalizadas de produto (plano ∪ realizado)
  const planoPorNorm={};
  Object.entries(comp.porProduto).forEach(([nome,p])=>{planoPorNorm[normNome(nome)]={nome,...p};});
  const chaves=[...new Set([...Object.keys(planoPorNorm),...Object.keys(real.porProduto)])];
  chaves.sort((a,b)=>{
    const na=(planoPorNorm[a]?.nome||real.porProduto[a]?.nome||'');
    const nb=(planoPorNorm[b]?.nome||real.porProduto[b]?.nome||'');
    return na.localeCompare(nb,'pt');
  });
  // nomes de linha planejadas por produto (para marcar remanejamento)
  const linhasPlanejadasDe=k=>{
    const p=planoPorNorm[k];if(!p)return new Set();
    return new Set(Object.keys(p.linhas||{}).map(lid=>normNome(linhaNome(lid))));
  };
  const linhasProduto=chaves.map(k=>{
    const p=planoPorNorm[k],r=real.porProduto[k];
    const nome=p?.nome||r?.nome||'—';
    const demanda=p?.demanda||0,planejado=p?.planejado||0,realT=r?.total||0;
    const pct=planejado>0?realT/planejado*100:null;
    const saldo=realT-planejado;
    const lp=linhasPlanejadasDe(k);
    const ondeReal=r?Object.entries(r.porLinha).map(([ln,q])=>{
      const fora=planejado>0&&!lp.has(normNome(ln));
      return `${fora?'<span style="color:#b45309;font-weight:700;" title="Produzido em linha que não estava no plano deste produto">⚠ '+esc(ln)+'</span>':esc(ln)}: ${fmtN(q,0)}`;
    }).join(' · '):'—';
    let badge;
    if(!p&&r)badge='<span class="pc-badge" style="background:#fef3c7;color:#b45309;">não planejado</span>';
    else if(p&&!r)badge=_realCarregado?'<span class="pc-badge livre">sem produção</span>':'<span class="pc-badge livre">…</span>';
    else if(pct>=100)badge='<span class="pc-badge ok">✓ atendido</span>';
    else badge=`<span class="pc-badge" style="background:#e0f2fe;color:#0369a1;">${fmtN(pct,0)}%</span>`;
    const cad=_produtosCad.find(x=>normNome(x.nome)===k);
    const ton=Number(cad?.peso_unidade_kg)>0?realT*Number(cad.peso_unidade_kg)/1000:null;
    return `<tr>
      <td><strong>${esc(nome)}</strong></td>
      <td class="num">${demanda?fmtN(demanda,0):'—'}</td>
      <td class="num" style="font-weight:700;">${planejado?fmtN(planejado,0):'—'}</td>
      <td class="num" style="font-weight:800;color:#0369a1;">${realT?fmtN(realT,0):(_realCarregado?'0':'…')}</td>
      <td class="num" style="color:${planejado?(saldo>=0?'#15803d':'#b91c1c'):'#94a3b8'};font-weight:700;">${planejado?fmtN(saldo,0):'—'}</td>
      <td class="num">${ton!=null?fmtN(ton,1):'—'}</td>
      <td>${badge}</td>
      <td class="pc-hint">${ondeReal}</td>
    </tr>`;
  }).join('');

  // ── ocupação por linha (plano por linha_id ∪ realizado por nome) ──
  const planoLinhaPorNorm={};
  Object.entries(comp.porLinha).forEach(([lid,v])=>{planoLinhaPorNorm[normNome(linhaNome(lid))]={nome:linhaNome(lid),...v};});
  const chavesLinha=[...new Set([...Object.keys(planoLinhaPorNorm),...Object.keys(real.porLinha).map(n=>normNome(n))])];
  const realLinhaPorNorm={};
  Object.entries(real.porLinha).forEach(([nome,v])=>{realLinhaPorNorm[normNome(nome)]={nome,...v};});
  const linhasOcup=chavesLinha.map(k=>{
    const p=planoLinhaPorNorm[k],r=realLinhaPorNorm[k];
    const nome=p?.nome||r?.nome||'—';
    const badge=!p&&r?'<span class="pc-badge" style="background:#fef3c7;color:#b45309;">não planejada</span>':
                p&&!r?(_realCarregado?'<span class="pc-badge livre">sem produção</span>':'<span class="pc-badge livre">…</span>'):'';
    return `<tr>
      <td><strong>${esc(nome)}</strong> ${badge}</td>
      <td class="num">${p?fmtN(p.horasDisp):'—'}</td>
      <td class="num" style="color:#0369a1;font-weight:700;">${r?fmtN(r.ht):'—'}</td>
      <td class="num" style="color:#b45309;">${r?fmtN(r.hp):'—'}</td>
      <td class="num">${p?fmtN(p.sacos,0):'—'}</td>
      <td class="num" style="color:#0369a1;font-weight:700;">${r?fmtN(r.sacos,0):'—'}</td>
      <td class="num">${p?fmtN(p.lenha,1):'—'}</td>
      <td class="num" style="color:#0369a1;">${r?fmtN(r.lenha,1):'—'}</td>
    </tr>`;
  }).join('');

  if(!chaves.length&&!chavesLinha.length)return '';
  return `<div class="pc-card">
    <div class="pc-sec-tit">⚖️ Plano × Realizado — por produto
      <span class="pc-hint" style="font-weight:400;">a cobrança é por produto no mês, somando todas as linhas; ⚠ marca produção em linha fora do plano</span>
      <button class="btn btn-secondary btn-sm" style="margin-left:auto;" onclick="atualizarRealizado()">🔄 Atualizar realizado</button>
    </div>
    <div class="table-wrap"><table class="pc-resumo">
      <thead><tr><th>Produto</th><th class="num">Demanda</th><th class="num">Planejado</th><th class="num">Realizado</th><th class="num">Saldo</th><th class="num">Ton real</th><th>Situação</th><th>Onde (realizado)</th></tr></thead>
      <tbody>${linhasProduto||'<tr><td colspan="8" class="pc-hint" style="text-align:center;">Nada planejado nem produzido neste mês ainda.</td></tr>'}</tbody>
    </table></div>
    <div class="pc-sec-tit" style="margin-top:18px;">🏭 Ocupação por linha
      <span class="pc-hint" style="font-weight:400;">informativo — mostra como o recurso foi usado; H.T inclui paradas produtivas, H.P é hora parada</span>
    </div>
    <div class="table-wrap"><table class="pc-resumo">
      <thead><tr><th>Linha</th><th class="num">Horas disp. (plano)</th><th class="num">H.T real</th><th class="num">H.P real</th><th class="num">Un. planejadas</th><th class="num">Un. produzidas</th><th class="num">Lenha plan. (m³)</th><th class="num">Lenha real (m³)</th></tr></thead>
      <tbody>${linhasOcup||'<tr><td colspan="8" class="pc-hint" style="text-align:center;">Sem linhas.</td></tr>'}</tbody>
    </table></div>
    <div class="pc-hint" style="margin-top:8px;">O realizado vem direto das OPs da Produção (${_realOps.length} registro(s) no mês${_realCarregado?'':' — carregando…'}). Fase 3 traz os insumos realizados do ledger e o custo plano × real.</div>
  </div>`;
}

/* avisa antes de fechar com alteração pendente */
window.addEventListener('beforeunload',e=>{if(_sujo){e.preventDefault();e.returnValue='';}});

init();
</script>
